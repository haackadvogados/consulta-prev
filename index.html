nte;\n- auxílio-doença e aposentadoria por invalidez decorrentes de acidente de qualquer natureza, de doença profissional ou do trabalho ou de doença da lista ministerial surgida depois da filiação;\n- benefícios do segurado especial rural (aposentadoria por idade ou por invalidez, auxílio-doença, auxílio-reclusão e pensão, de 1 salário mínimo, e auxílio-acidente), que provam atividade rural pelo número de meses da carência em vez de contribuições;\n- serviço social;\n- reabilitação profissional;\n- salário-maternidade da empregada, da trabalhadora avulsa e da empregada doméstica.\nO salário-maternidade da contribuinte individual, da segurada especial e da facultativa tinha carência de 10 contribuições na lei, mas o STF (Supremo Tribunal Federal) declarou essa carência inconstitucional (ADIs, ações diretas de inconstitucionalidade, 2.110 e 2.111).", "fonte": "Lei 8.213/1991, art. 26, I a VI (red. Leis 9.876/1999, 13.135/2015 e 13.846/2019), art. 25, III, e art. 39, I; STF, ADIs 2.110 e 2.111", "origem": "03_TESES/legislacao/leis/Lei-8213-1991_planos-de-beneficios-previdencia.htm (arts. 25, 26 e 39, últimas ocorrências); doutrina-previdenciaria.md §6 (Carência), em .claude/skills/haack-prev-padrao/references/", "sinal": "firme"}, {"id": "qd-004", "tema": "Carência e qualidade de segurado", "pergunta": "Por quanto tempo continuo segurado do INSS sem contribuir, em cada situação?", "variantes": ["Período de graça", "Fui preso, ainda sou segurado?", "Saí do serviço militar, mantenho a qualidade de segurado?", "Quanto tempo depois de sair do emprego ainda tenho direito?", "Desempregado mantém a qualidade de segurado por quanto tempo?"], "resposta": "Mantém a qualidade de segurado, sem contribuir:\n- sem limite de prazo, quem está recebendo benefício, exceto auxílio-acidente;\n- até 12 meses após a última contribuição, quem deixou de exercer atividade remunerada ou está suspenso ou licenciado sem remuneração;\n- esse prazo de 12 meses passa a 24 meses para quem já pagou mais de 120 contribuições mensais sem perder a qualidade de segurado;\n- os prazos de 12 ou 24 meses ganham mais 12 meses para o desempregado que comprove a situação por registro no órgão próprio do Ministério do Trabalho e da Previdência Social (até 36 meses no total);\n- até 12 meses após cessar a segregação, quem teve doença de segregação compulsória;\n- até 12 meses após o livramento, o segurado preso ou recluso;\n- até 3 meses após o licenciamento, quem foi incorporado às Forças Armadas para prestar serviço militar;\n- até 6 meses após a última contribuição, o segurado facultativo.\nDurante esses prazos o segurado conserva todos os direitos. A perda ocorre no dia seguinte ao vencimento da contribuição do mês imediatamente posterior ao fim do prazo.", "fonte": "Lei 8.213/1991, art. 15, I a VI e §§ 1º a 4º (inciso I red. Lei 13.846/2019)", "origem": "03_TESES/legislacao/leis/Lei-8213-1991_planos-de-beneficios-previdencia.htm (art. 15, últimas ocorrências; redação da MP 905/2019 no inciso II com vigência encerrada)", "sinal": "firme"}, {"id": "qd-005", "tema": "Carência e qualidade de segurado", "pergunta": "Qual é a tabela de carência de quem começou a contribuir antes de 24/07/1991?", "variantes": ["Tabela progressiva de carência do artigo 142", "Comecei a trabalhar nos anos 80, quantas contribuições preciso?", "Carência reduzida para segurado antigo", "Quantos meses de contribuição eram exigidos em cada ano?"], "resposta": "Para quem era inscrito na Previdência Social Urbana até 24/07/1991 e para o trabalhador e o empregador rural cobertos pela Previdência Social Rural, a carência das aposentadorias por idade, por tempo de serviço e especial segue o ano em que todas as condições do benefício foram cumpridas:\n- 1991: 60 meses;\n- 1992: 60 meses;\n- 1993: 66 meses;\n- 1994: 72 meses;\n- 1995: 78 meses;\n- 1996: 90 meses;\n- 1997: 96 meses;\n- 1998: 102 meses;\n- 1999: 108 meses;\n- 2000: 114 meses;\n- 2001: 120 meses;\n- 2002: 126 meses;\n- 2003: 132 meses;\n- 2004: 138 meses;\n- 2005: 144 meses;\n- 2006: 150 meses;\n- 2007: 156 meses;\n- 2008: 162 meses;\n- 2009: 168 meses;\n- 2010: 174 meses;\n- 2011 em diante: 180 meses.", "fonte": "Lei 8.213/1991, art. 142 (red. Lei 9.032/1995)", "origem": "03_TESES/legislacao/leis/Lei-8213-1991_planos-de-beneficios-previdencia.htm (art. 142, segunda e última tabela, por ano de implementação das condições; a tabela original, por ano do requerimento, foi substituída)", "sinal": "firme"}, {"id": "qd-006", "tema": "Categorias e alíquotas", "pergunta": "Quais são as faixas e alíquotas do INSS do empregado em 2026?", "variantes": ["Tabela do INSS 2026 para carteira assinada", "Quanto desconta de INSS do meu salário?", "Alíquota progressiva do empregado doméstico", "Desconto máximo de INSS no contracheque"], "resposta": "Em 2026, o empregado, o empregado doméstico e o trabalhador avulso contribuem de forma progressiva, cada alíquota só sobre a parte do salário que cai na faixa:\n- até R$ 1.621,00: 7,5%;\n- de R$ 1.621,01 até R$ 2.902,84: 9%;\n- de R$ 2.902,85 até R$ 4.354,27: 12%;\n- de R$ 4.354,28 até R$ 8.475,55: 14%.\nAcima de R$ 8.475,55 (teto de 2026) não há desconto. Pela conta faixa a faixa, o desconto máximo é de R$ 988,09 em 2026, e um salário de R$ 3.000,00 desconta R$ 248,60. Vale para remunerações a partir da competência 01/2026; o 13º salário não se soma ao salário do mês para definir a faixa.", "fonte": "EC 103/2019, art. 28, I a IV e § 1º; Portaria Interministerial MPS/MF 13/2026, art. 7º e Anexo II", "origem": "05_AUTOMACAO/scripts/dados/aliquotas_contribuicao.json (linha empregado-2026-01); _CONTINUIDADE/_artefatos/prev-lacunas/fontes/INSUMO_dou-portaria-interministerial-mps-mf-n-13-de-9-de-janeiro-de-2026-680382603.html (Anexo II)", "sinal": "firme"}, {"id": "qd-007", "tema": "Categorias e alíquotas", "pergunta": "Quais foram as faixas do INSS do empregado de 2020 a 2025?", "variantes": ["Tabela do INSS de anos anteriores", "Quanto era descontado de INSS em 2022?", "Alíquota do empregado antes da reforma", "Tabela de contribuição 2024 e 2025"], "resposta": "Faixas do empregado, doméstico e avulso por competência:\n- 01/2020 e 02/2020 (alíquota única sobre o salário inteiro): até R$ 1.830,29, 8%; de R$ 1.830,30 a R$ 3.050,52, 9%; de R$ 3.050,53 a R$ 6.101,06, 11%;\n- 03/2020 a 12/2020 (progressiva): até R$ 1.045,00, 7,5%; até R$ 2.089,60, 9%; até R$ 3.134,40, 12%; até R$ 6.101,06, 14%;\n- 2021: até R$ 1.100,00, 7,5%; até R$ 2.203,48, 9%; até R$ 3.305,22, 12%; até R$ 6.433,57, 14%;\n- 2022: até R$ 1.212,00, 7,5%; até R$ 2.427,35, 9%; até R$ 3.641,03, 12%; até R$ 7.087,22, 14%;\n- 01/2023 a 04/2023: até R$ 1.302,00, 7,5%; até R$ 2.571,29, 9%; até R$ 3.856,94, 12%; até R$ 7.507,49, 14%;\n- 05/2023 a 12/2023: até R$ 1.320,00, 7,5%; até R$ 2.571,29, 9%; até R$ 3.856,94, 12%; até R$ 7.507,49, 14%;\n- 2024: até R$ 1.412,00, 7,5%; até R$ 2.666,68, 9%; até R$ 4.000,03, 12%; até R$ 7.786,02, 14%;\n- 2025: até R$ 1.518,00, 7,5%; até R$ 2.793,88, 9%; até R$ 4.190,83, 12%; até R$ 8.157,41, 14%.\nDesde 03/2020, cada alíquota incide só sobre a parte do salário dentro da faixa; cada faixa começa 1 centavo acima do limite da anterior.", "fonte": "Lei 8.212/1991, art. 20 (até 02/2020); EC 103/2019, art. 28 (desde 03/2020); Portarias SEPRT/ME 3.659/2020 e 477/2021; Portaria Interministerial MTP/ME 12/2022; Portarias Interministeriais MPS/MF 26/2023, 27/2023, 2/2024 e 6/2025, Anexos II", "origem": "05_AUTOMACAO/scripts/dados/aliquotas_contribuicao.json (linhas empregado-2020-01 a empregado-2025-01, com os HTML do DOU em _CONTINUIDADE/_artefatos/prev-lacunas/fontes/)", "sinal": "firme"}, {"id": "qd-008", "tema": "Categorias e alíquotas", "pergunta": "Quanto paga de INSS o autônomo, o MEI e o facultativo em cada plano, em 2026?", "variantes": ["Valor da guia do INSS em 2026", "Quanto custa contribuir pelo mínimo como autônomo?", "Plano simplificado 11% quanto é?", "Dona de casa baixa renda paga quanto?", "MEI caminhoneiro paga quanto de INSS?"], "resposta": "Em 2026, com salário mínimo de R$ 1.621,00 e teto de R$ 8.475,55:\n- contribuinte individual por conta própria e facultativo, plano normal: 20% sobre a base escolhida, de R$ 324,20 (sobre o mínimo) a R$ 1.695,11 (sobre o teto);\n- plano simplificado (contribuinte individual sem relação com empresa e facultativo): 11% do mínimo, R$ 178,31, sem direito a aposentadoria por tempo de contribuição;\n- MEI (microempreendedor individual): 5% do mínimo, R$ 81,05;\n- MEI transportador autônomo de cargas: 12% do mínimo, R$ 194,52;\n- facultativo de baixa renda (sem renda própria, dedicado ao trabalho doméstico na própria casa, família no CadÚnico (Cadastro Único) com renda de até 2 salários mínimos): 5% do mínimo, R$ 81,05;\n- contribuinte individual que presta serviço a empresa: 11% da remuneração, até o teto, retidos pela empresa.\nQuem pagou 11%, 5% ou 12% e quer contar o período para aposentadoria por tempo de contribuição ou levar para outro regime complementa até 20% (9, 15 ou 8 pontos percentuais). O vencimento do autônomo e do facultativo é o dia 15 do mês seguinte.", "fonte": "Lei 8.212/1991, arts. 21, caput, §§ 2º, 3º, 4º e 5º, e 30, II e § 4º; Lei 10.666/2003, art. 4º; LC 123/2006, arts. 18-A, § 3º, IV, e 18-F, III; Portaria Interministerial MPS/MF 13/2026, art. 2º", "origem": "05_AUTOMACAO/scripts/dados/aliquotas_contribuicao.json (linhas ci-facultativo-20, plano-simplificado-11, mei-5, mei-tac-12, facultativo-baixa-renda-5, ci-prestador-11, complementacao-11-5-para-20 e vencimento); valores em reais calculados sobre o salário mínimo e o teto de 2026 do art. 2º da Portaria 13/2026", "sinal": "firme"}, {"id": "qd-009", "tema": "Regras de transição", "pergunta": "Quais são as regras de transição da reforma e o que cada uma exige?", "variantes": ["Regras de transição da reforma da previdência", "Quem já contribuía antes de 2019 tem quais opções?", "Pontos, idade progressiva, pedágio 50 e pedágio 100", "Qual transição me serve?"], "resposta": "Para quem era filiado ao RGPS (Regime Geral de Previdência Social) até 13/11/2019, há seis regras de transição, todas com carência de 180 contribuições:\n- Pontos: 30 anos (mulher) ou 35 (homem) de contribuição e soma de idade e tempo, em dias, de 93 (mulher) ou 103 (homem) pontos em 2026, subindo 1 por ano até 100 e 105; renda de 60% da média mais 2 pontos percentuais por ano acima de 15 (mulher) ou 20 (homem).\n- Idade mínima progressiva: 30 ou 35 anos de contribuição e idade de 59 anos e 6 meses (mulher) ou 64 anos e 6 meses (homem) em 2026, subindo 6 meses por ano até 62 e 65; mesma renda.\n- Pedágio de 50%: só para quem tinha, em 13/11/2019, mais de 28 anos (mulher) ou 33 (homem) de contribuição; 30 ou 35 anos mais metade do que faltava naquela data, sem idade mínima; renda da média multiplicada pelo fator previdenciário.\n- Aposentadoria por idade: 62 anos (mulher, desde 2023) ou 65 (homem) e 15 anos de contribuição; renda de 60% mais 2 pontos percentuais por ano acima de 15 ou 20.\n- Pedágio de 100%: 57 anos (mulher) ou 60 (homem), 30 ou 35 anos de contribuição mais todo o tempo que faltava em 13/11/2019; renda de 100% da média.\n- Especial por pontos: 66 pontos e 15 anos de exposição, 76 pontos e 20 anos ou 86 pontos e 25 anos; renda de 60% mais 2 pontos percentuais por ano acima de 20 (acima de 15 para mulher e na especial de 15 anos).\nO professor tem versões próprias das regras de pontos, idade progressiva e pedágio de 100%. O segurado pode cumprir mais de uma e fica com a mais vantajosa.", "fonte": "EC 103/2019, arts. 15 a 18, 20, 21 e 26, §§ 2º, 3º, I, e 5º; Lei 8.213/1991, art. 25, II", "origem": "03_TESES/legislacao/leis/EC-103-2019_reforma-da-previdencia.txt (arts. 15 a 21 e 26); 03_TESES/legislacao/leis/Lei-8213-1991_planos-de-beneficios-previdencia.htm (art. 25, II)", "sinal": "firme"}, {"id": "qd-010", "tema": "Regras de transição", "pergunta": "Quem tem direito ao pedágio de 50% e quanto tempo a mais preciso trabalhar?", "variantes": ["Pedágio de 50 por cento, quem pode usar?", "Faltavam 2 anos em 2019, quanto tenho que pagar de pedágio?", "Regra do artigo 17 da reforma", "Transição sem idade mínima"], "resposta": "Tem direito quem, em 13/11/2019, já era filiado ao RGPS (Regime Geral de Previdência Social) e tinha mais de 28 anos de contribuição (mulher) ou mais de 33 anos (homem). Requisitos, todos juntos:\n- 30 anos de contribuição (mulher) ou 35 anos (homem);\n- mais um período adicional igual a 50% do tempo que, em 13/11/2019, faltava para chegar a 30 ou 35 anos;\n- 180 contribuições de carência;\n- sem idade mínima.\nExemplos: homem com 34 anos em 13/11/2019 faltava 1 ano, paga 6 meses de pedágio e se aposenta com 35 anos e 6 meses; mulher com 28 anos e 6 meses faltava 1 ano e 6 meses, paga 9 meses e se aposenta com 30 anos e 9 meses. Quem tinha exatamente 28 anos (mulher) ou 33 anos (homem), ou menos, fica fora. A renda é a média dos salários multiplicada pelo fator previdenciário, sem a regra 85/95.", "fonte": "EC 103/2019, art. 17, I e II e par. único; Lei 8.213/1991, art. 25, II", "origem": "03_TESES/legislacao/leis/EC-103-2019_reforma-da-previdencia.txt (art. 17); exemplos calculados pela regra do art. 17, II", "sinal": "firme"}, {"id": "qd-011", "tema": "Regras de transição", "pergunta": "Qual a idade e quantos pontos as transições exigem em cada ano, de 2019 em diante?", "variantes": ["Tabela ano a ano da idade mínima progressiva", "Quantos pontos eram exigidos em 2022?", "Idade da mulher na aposentadoria por idade de transição", "Que idade preciso em 2028?"], "resposta": "Regra de pontos, mulher (com 30 anos de contribuição): 86 em 2019; 87 em 2020; 88 em 2021; 89 em 2022; 90 em 2023; 91 em 2024; 92 em 2025; 93 em 2026; 94 em 2027; 95 em 2028; 96 em 2029; 97 em 2030; 98 em 2031; 99 em 2032; 100 de 2033 em diante.\nRegra de pontos, homem (com 35 anos): 96 em 2019; 97 em 2020; 98 em 2021; 99 em 2022; 100 em 2023; 101 em 2024; 102 em 2025; 103 em 2026; 104 em 2027; 105 de 2028 em diante.\nIdade mínima progressiva, mulher (com 30 anos): 56 anos em 2019; 56 e 6 meses em 2020; 57 em 2021; 57 e 6 meses em 2022; 58 em 2023; 58 e 6 meses em 2024; 59 em 2025; 59 e 6 meses em 2026; 60 em 2027; 60 e 6 meses em 2028; 61 em 2029; 61 e 6 meses em 2030; 62 de 2031 em diante.\nIdade mínima progressiva, homem (com 35 anos): 61 anos em 2019; 61 e 6 meses em 2020; 62 em 2021; 62 e 6 meses em 2022; 63 em 2023; 63 e 6 meses em 2024; 64 em 2025; 64 e 6 meses em 2026; 65 de 2027 em diante.\nTransição da aposentadoria por idade, mulher (com 15 anos): 60 anos em 2019; 60 e 6 meses em 2020; 61 em 2021; 61 e 6 meses em 2022; 62 de 2023 em diante. Homem: 65 anos em todos os anos.", "fonte": "EC 103/2019, arts. 15, caput, II, e § 1º; 16, caput, II, e § 1º; 18, I, e § 1º", "origem": "03_TESES/legislacao/leis/EC-103-2019_reforma-da-previdencia.txt (arts. 15, 16 e 18: valor de 2019 e acréscimo anual desde 01/01/2020, aplicados ano a ano)", "sinal": "firme"}, {"id": "qd-012", "tema": "Professor", "pergunta": "Quantos pontos e que idade o professor precisa em cada ano?", "variantes": ["Tabela de pontos da professora ano a ano", "Idade mínima do professor na transição em 2027", "Professora com 25 anos de sala de aula, quando me aposento?", "Regras de transição do professor"], "resposta": "Com 25 anos (professora) ou 30 anos (professor) de efetivo magistério na educação infantil, no ensino fundamental ou no médio, e filiação até 13/11/2019:\nPontos da professora: 81 em 2019; 82 em 2020; 83 em 2021; 84 em 2022; 85 em 2023; 86 em 2024; 87 em 2025; 88 em 2026; 89 em 2027; 90 em 2028; 91 em 2029; 92 de 2030 em diante.\nPontos do professor: 91 em 2019; 92 em 2020; 93 em 2021; 94 em 2022; 95 em 2023; 96 em 2024; 97 em 2025; 98 em 2026; 99 em 2027; 100 de 2028 em diante.\nIdade mínima progressiva da professora: 51 anos em 2019; 51 e 6 meses em 2020; 52 em 2021; 52 e 6 meses em 2022; 53 em 2023; 53 e 6 meses em 2024; 54 em 2025; 54 e 6 meses em 2026; 55 em 2027; 55 e 6 meses em 2028; 56 em 2029; 56 e 6 meses em 2030; 57 de 2031 em diante.\nIdade mínima progressiva do professor: 56 anos em 2019; 56 e 6 meses em 2020; 57 em 2021; 57 e 6 meses em 2022; 58 em 2023; 58 e 6 meses em 2024; 59 em 2025; 59 e 6 meses em 2026; 60 de 2027 em diante.\nPedágio de 100%: 52 anos (professora) ou 55 (professor), mais 100% do tempo de magistério que faltava em 13/11/2019, com renda de 100% da média. Regra permanente: 57 anos (mulher) ou 60 (homem) com 25 anos de magistério para ambos. Nas regras de pontos e idade, a renda é 60% da média mais 2 pontos percentuais por ano acima de 15 (mulher) ou 20 (homem).", "fonte": "EC 103/2019, arts. 15, § 3º, 16, § 2º, 19, § 1º, II, 20, § 1º, e 26, §§ 2º, 3º, I, e 5º", "origem": "05_AUTOMACAO/scripts/dados/professor_regras.json (regras art15-par3, art16-par2, art20-par1, art19-par1-II e tabela_anual 2019 a 2033); 03_TESES/legislacao/leis/EC-103-2019_reforma-da-previdencia.txt", "sinal": "firme"}, {"id": "qd-013", "tema": "Professor", "pergunta": "O que conta como tempo de magistério para a aposentadoria de professor?", "variantes": ["Licença e férias contam como magistério?", "Tempo de coordenadora pedagógica conta?", "Professor auxiliar tem aposentadoria de professor?", "Afastamento por doença conta como tempo de professor?", "Professor universitário conta?"], "resposta": "Conta como magistério, na educação infantil, no ensino fundamental ou no médio, presencial ou a distância:\n- a docência a qualquer título;\n- a direção de unidade escolar, exercida por professor;\n- a coordenação e o assessoramento pedagógicos, exercidos por professor;\n- a atividade de professor auxiliar;\n- o benefício por incapacidade recebido entre períodos de magistério;\n- o benefício por incapacidade acidentário até 30/06/2020, mesmo não intercalado, e, desde 01/07/2020, só se intercalado;\n- a licença-prêmio;\n- os descansos e as férias;\n- o salário-maternidade.\nNão conta: o especialista em educação que não é professor; o ensino superior, salvo para o acréscimo da EC (Emenda Constitucional) 20/1998 no magistério até 16/12/1998; e o tempo em outra atividade, que entra só no cálculo da média. O tempo de magistério não se converte em tempo comum. A prova é feita por diploma ou habilitação e CTPS (Carteira de Trabalho e Previdência Social), complementada por declaração da escola.", "fonte": "Lei 9.394/1996, art. 67, § 2º; Dec. 3.048/1999, art. 54, §§ 2º a 4º; IN PRES/INSS 128/2022, arts. 214, §§ 1º e 2º, 251, § 1º, e 255; STF, ADI 3.772", "origem": ".claude/skills/haack-prev-padrao/references/doutrina-professor-pcd-fator.md §2-A.1 (Quem é professor e que tempo conta; Conversão e tempo fora do magistério)", "sinal": "firme"}, {"id": "qd-014", "tema": "Pessoa com deficiência", "pergunta": "Quais são os graus de deficiência e o tempo exigido em cada um para aposentar?", "variantes": ["Deficiência leve, moderada e grave, quanto tempo?", "Aposentadoria da pessoa com deficiência por tempo e por idade", "Pontuação do IF-BrA", "Quantos anos a PcD precisa contribuir?"], "resposta": "Aposentadoria por tempo de contribuição da PcD (pessoa com deficiência), com renda de 100% do salário de benefício:\n- deficiência grave: 20 anos (mulher) ou 25 anos (homem);\n- deficiência moderada: 24 anos (mulher) ou 29 anos (homem);\n- deficiência leve: 28 anos (mulher) ou 33 anos (homem).\nAposentadoria por idade da PcD, em qualquer grau: 55 anos (mulher) ou 60 anos (homem), com 15 anos de contribuição e deficiência comprovada durante o mesmo período; renda de 70% do salário de benefício mais 1 ponto percentual por grupo de 12 contribuições, até 100%.\nO grau sai da avaliação do INSS (Instituto Nacional do Seguro Social) pelo IF-BrA (Índice de Funcionalidade Brasileiro Aplicado): grave até 5.739 pontos; moderada de 5.740 a 6.354; leve de 6.355 a 7.584; a partir de 7.585 a deficiência não basta para essa aposentadoria.", "fonte": "LC 142/2013, arts. 3º, I a IV, e 8º; Portaria Interministerial SDH/MPS/MF/MOG/AGU 1/2014, Anexo, itens 4.a, 4.d e 4.e", "origem": "03_TESES/legislacao/leis/LC-142-2013_aposentadoria-pessoa-com-deficiencia.htm (art. 3º); .claude/skills/haack-prev-padrao/references/doutrina-professor-pcd-fator.md §2-A.2 (pontuação e renda)", "sinal": "firme"}, {"id": "qd-015", "tema": "Pensão: dependentes", "pergunta": "Quem são os dependentes do segurado no INSS, classe por classe?", "variantes": ["Quem pode receber a pensão por morte?", "Enteado e menor sob guarda são dependentes?", "Ordem dos dependentes do INSS", "Pais e irmãos recebem pensão?"], "resposta": "São dependentes, em três classes:\n- 1ª classe: o cônjuge; a companheira ou o companheiro em união estável; o filho não emancipado, de qualquer condição, menor de 21 anos ou inválido ou com deficiência intelectual, mental ou grave; equiparados a filho, mediante declaração do segurado e se não tiverem condições de se sustentar, o enteado, o menor sob tutela e o menor sob guarda judicial;\n- 2ª classe: os pais;\n- 3ª classe: o irmão não emancipado, de qualquer condição, menor de 21 anos ou inválido ou com deficiência intelectual, mental ou grave.\nDependente de uma classe exclui os das classes seguintes. Na 1ª classe a dependência econômica é presumida; pais e irmãos precisam prová-la. União estável e dependência econômica exigem início de prova material de até 24 meses antes do óbito ou da prisão, não bastando testemunhas. Fica excluído quem foi condenado com trânsito em julgado por homicídio doloso, ou tentativa, contra o segurado, ressalvados os absolutamente incapazes e os inimputáveis.", "fonte": "Lei 8.213/1991, art. 16, I a III e §§ 1º a 5º e 7º (incisos I e III red. Lei 13.146/2015; § 2º red. Lei 15.108/2025; §§ 5º e 7º incl. Lei 13.846/2019)", "origem": "03_TESES/legislacao/leis/Lei-8213-1991_planos-de-beneficios-previdencia.htm (art. 16, últimas ocorrências de cada inciso e parágrafo)", "sinal": "firme"}, {"id": "qd-016", "tema": "Pensão: valor e duração", "pergunta": "Em que casos a pensão por morte acaba?", "variantes": ["Quando corta a pensão?", "A pensão do filho acaba com quantos anos?", "Viúva perde a pensão em que situações?", "Causas de cessação da pensão por morte", "Casar de novo corta a pensão?"], "resposta": "A cota de cada pensionista cessa:\n- para qualquer pensionista: pela morte; pela condenação com trânsito em julgado por homicídio doloso, ou tentativa, contra o segurado, ressalvados os absolutamente incapazes e os inimputáveis;\n- para filho, equiparado ou irmão: aos 21 anos, salvo se inválido ou com deficiência intelectual, mental ou grave;\n- para filho ou irmão inválido: pela cessação da invalidez;\n- para filho ou irmão com deficiência intelectual, mental ou grave: pelo afastamento da deficiência;\n- para cônjuge ou companheiro inválido ou com deficiência: pela cessação da invalidez ou afastamento da deficiência, respeitados os prazos mínimos abaixo;\n- para cônjuge ou companheiro: em 4 meses, se o falecido não tinha 18 contribuições ou se o casamento ou a união tinha menos de 2 anos;\n- para cônjuge ou companheiro com 18 contribuições e 2 anos de união, pelo prazo da idade na data do óbito; óbito desde 01/01/2021: 3 anos com menos de 22 anos, 6 anos de 22 a 27, 10 anos de 28 a 30, 15 anos de 31 a 41, 20 anos de 42 a 44, vitalícia com 45 ou mais; óbito de 01/03/2015 a 31/12/2020: 3 anos com menos de 21, 6 anos de 21 a 26, 10 anos de 27 a 29, 15 anos de 30 a 40, 20 anos de 41 a 43, vitalícia com 44 ou mais;\n- para cônjuge ou companheiro: pela perda do direito, apurada em processo judicial, se provada simulação ou fraude no casamento ou na união estável.\nSe a morte veio de acidente de qualquer natureza ou de doença profissional ou do trabalho, aplica-se o prazo por idade mesmo sem 18 contribuições ou 2 anos de união. Com o fim da última cota, a pensão se extingue. Novo casamento ou nova união não está entre as causas de cessação.", "fonte": "Lei 8.213/1991, art. 77, § 2º, I a VI, §§ 2º-A e 3º, e art. 74, §§ 1º e 2º; Portaria ME 424/2020, art. 1º", "origem": "03_TESES/legislacao/leis/Lei-8213-1991_planos-de-beneficios-previdencia.htm (art. 77, § 2º, últimas ocorrências: II red. Lei 13.183/2015, III e IV red. Lei 13.135/2015, VI incl. Lei 13.846/2019; art. 74, §§ 1º e 2º); 05_AUTOMACAO/scripts/dados/pensao_duracao.json (faixas desde 01/01/2021 e de 01/03/2015 a 31/12/2020)", "sinal": "firme"}, {"id": "qd-017", "tema": "BPC: renda e grupo familiar", "pergunta": "Quem entra e quem fica de fora da família no cálculo da renda do LOAS?", "variantes": ["Quem conta na renda do BPC?", "Avó que mora junto entra no grupo familiar do LOAS?", "Filho casado na mesma casa conta na renda?", "Composição do grupo familiar do BPC"], "resposta": "Entram no grupo familiar do BPC (benefício de prestação continuada) da LOAS (Lei Orgânica da Assistência Social), desde que morem sob o mesmo teto:\n- o requerente;\n- o cônjuge ou companheiro;\n- os pais e, na falta de um deles, a madrasta ou o padrasto;\n- os irmãos solteiros;\n- os filhos e enteados solteiros;\n- os menores tutelados, provada a tutela pelo termo de tutela.\nFicam de fora, mesmo morando junto:\n- o irmão, filho ou enteado casado, em união estável, divorciado, separado de fato ou viúvo;\n- a pessoa internada ou acolhida em instituição de longa permanência, como abrigo ou hospital;\n- o tutor ou curador que não esteja no rol acima ou não more sob o mesmo teto;\n- qualquer parente fora do rol, como avós, netos, tios, sobrinhos, genros e noras.\nMorar com familiar na mesma instituição hospitalar ou de abrigo não forma, por si só, grupo familiar.", "fonte": "Lei 8.742/1993, art. 20, § 1º (red. Lei 12.435/2011); Portaria Conjunta MDS/INSS 34/2025, art. 7º, §§ 1º a 3º", "origem": "03_TESES/legislacao/leis/Lei-8742-1993_LOAS-compilada.txt (art. 20, § 1º); _CONTINUIDADE/_artefatos/prev-lacunas/fontes/INSUMO_dou-portaria-conjunta-mds-inss-34-2025_2026-11-09.html (art. 7º)", "sinal": "firme"}, {"id": "qd-018", "tema": "BPC: renda e grupo familiar", "pergunta": "Que rendas não contam no cálculo da renda do LOAS?", "variantes": ["Aposentadoria de um salário do marido conta na renda do BPC?", "Bolsa de estágio entra na renda do LOAS?", "Outro LOAS na casa conta?", "Rendimentos excluídos da renda per capita"], "resposta": "Não entram na soma da renda da família para o BPC (benefício de prestação continuada):\n- bolsa de estágio supervisionado;\n- rendimento de contrato de aprendizagem;\n- auxílio financeiro temporário ou indenização por danos decorrentes de rompimento ou colapso de barragem;\n- o BPC já pago a outro idoso ou pessoa com deficiência da família;\n- benefício previdenciário de até 1 salário mínimo (R$ 1.621,00 em 2026) pago a idoso acima de 65 anos ou a pessoa com deficiência, um por membro da família;\n- o auxílio-inclusão e a remuneração de quem o recebe, só para manter o BPC já concedido a outra pessoa da família.\nTodo o resto entra, inclusive a renda informal declarada no CadÚnico (Cadastro Único). Se o mesmo membro recebe mais de um benefício de até 1 salário mínimo, só um deles é desconsiderado.", "fonte": "Lei 8.742/1993, art. 20, §§ 3º-A, 9º e 14; Portaria Conjunta MDS/INSS 34/2025, art. 8º, I, a a f, e §§ 1º e 2º", "origem": "03_TESES/legislacao/leis/Lei-8742-1993_LOAS-compilada.txt (art. 20, §§ 9º e 14); _CONTINUIDADE/_artefatos/prev-lacunas/fontes/INSUMO_dou-portaria-conjunta-mds-inss-34-2025_2026-11-09.html (art. 8º)", "sinal": "firme"}, {"id": "qd-019", "tema": "BPC: renda e grupo familiar", "pergunta": "Quanto o INSS desconta da renda do LOAS por gasto com remédio, fralda, consulta e alimentação especial?", "variantes": ["Valor do desconto de fralda no BPC", "Tabela de gastos dedutíveis do LOAS", "Remédio que o SUS não dá abate da renda?", "Desconto de Centro-Dia no BPC"], "resposta": "Desde 30/09/2026, o INSS (Instituto Nacional do Seguro Social) deduz da renda bruta da família, uma vez por categoria, estes valores médios por mês, para itens não fornecidos de graça pelo SUS (Sistema Único de Saúde) ou pelo SUAS (Sistema Único de Assistência Social):\n- medicamentos: R$ 56,00;\n- consultas e tratamentos médicos: R$ 110,00;\n- fraldas: R$ 120,00;\n- alimentação especial: R$ 147,00;\n- Centro-Dia do SUAS: R$ 40,00.\nDe 10/10/2025 a 29/09/2026 os valores eram: medicamentos, R$ 45,00; consultas e tratamentos, R$ 90,00; fraldas, R$ 99,00; alimentação especial, R$ 121,00; Centro-Dia, R$ 32,00.\nA dedução exige documento médico que ateste tratamento contínuo e a falta ou negativa do item no SUS, ou a necessidade e a falta do Centro-Dia. Quem gasta mais que a tabela pode provar o gasto efetivo com recibos dos 12 meses anteriores ao pedido.", "fonte": "Lei 8.742/1993, art. 20-B, III; Portaria Conjunta MDS/INSS 34/2025, art. 8º, §§ 4º a 7º, e Anexo I; Portaria Conjunta MDS/INSS 45/2026, art. 1º e Anexo I", "origem": "_CONTINUIDADE/_artefatos/prev-lacunas/fontes/INSUMO_dou-portaria-conjunta-mds-inss-34-2025_2026-11-09.html (art. 8º e Anexo I, DOU de 10/10/2025); INSUMO_dou-portaria-conjunta-mds-inss-45-2026_2026-11-09.html (Anexo I, DOU de 30/09/2026, em vigor na publicação)", "sinal": "firme"}, {"id": "qd-020", "tema": "Prova rural", "pergunta": "Quais documentos a lei aceita para provar o trabalho rural?", "variantes": ["Documentos para aposentadoria rural", "Bloco do produtor serve de prova?", "Nota fiscal de venda da safra prova atividade rural?", "DAP e Pronaf provam tempo de roça?", "Declaração do sindicato rural ainda vale?"], "resposta": "A lei aceita, junto com a autodeclaração e o cadastro do segurado especial, entre outros:\n- contrato individual de trabalho ou CTPS (Carteira de Trabalho e Previdência Social);\n- contrato de arrendamento, parceria ou comodato rural;\n- DAP (Declaração de Aptidão ao Programa Nacional de Fortalecimento da Agricultura Familiar, Pronaf) ou documento que a substitua;\n- bloco de notas do produtor rural;\n- notas fiscais de entrada emitidas pela empresa que comprou a produção, com o segurado como vendedor;\n- documentos fiscais de entrega da produção a cooperativa agrícola, entreposto de pescado ou outros, com o segurado como vendedor ou consignante;\n- comprovantes de recolhimento de contribuição à Previdência Social sobre a venda da produção;\n- cópia da declaração de imposto de renda com renda da venda de produção rural;\n- licença de ocupação ou permissão outorgada pelo Incra (Instituto Nacional de Colonização e Reforma Agrária).\nA declaração do sindicato rural deixou de constar da lista, revogada pela Lei 13.846/2019. A lista é exemplificativa: outros documentos da época também servem como início de prova.", "fonte": "Lei 8.213/1991, art. 106, caput e I a X (red. Leis 11.718/2008 e 13.846/2019)", "origem": "03_TESES/legislacao/leis/Lei-8213-1991_planos-de-beneficios-previdencia.htm (art. 106, últimas ocorrências: caput e IV red. Lei 13.846/2019; III revogado)", "sinal": "firme"}, {"id": "qd-021", "tema": "Salário-maternidade e outros", "pergunta": "Quanto é o salário-maternidade e quem paga, para cada tipo de segurada?", "variantes": ["Quem paga a licença-maternidade, a empresa ou o INSS?", "Valor do salário-maternidade da autônoma", "Salário-maternidade da agricultora", "Doméstica recebe quanto de salário-maternidade?", "Desempregada tem salário-maternidade?"], "resposta": "Por 120 dias, com estes valores e pagadores, sempre com o mínimo de 1 salário mínimo (R$ 1.621,00 em 2026):\n- empregada: remuneração integral, paga pela empresa, que depois compensa nas contribuições;\n- empregada de MEI (microempreendedor individual): remuneração integral, paga direto pelo INSS (Instituto Nacional do Seguro Social);\n- trabalhadora avulsa: remuneração integral, paga direto pelo INSS;\n- empregada doméstica: valor do último salário de contribuição, pago direto pelo INSS;\n- segurada especial rural: 1 salário mínimo, com 12 meses de atividade rural antes do benefício, pago direto pelo INSS; a lei prevê 1/12 da última contribuição anual a quem tiver contribuído;\n- contribuinte individual e facultativa: 1/12 da soma dos 12 últimos salários de contribuição, apurados em até 15 meses, pago direto pelo INSS;\n- desempregada que mantém a qualidade de segurada: mesma conta da contribuinte individual, paga direto pelo INSS;\n- quem adota ou obtém guarda judicial para adoção: 120 dias, pagos direto pelo INSS.\nA internação da mãe ou do bebê por mais de 2 semanas por complicação do parto estende o benefício por toda a internação e mais 120 dias após a alta; o nascimento de criança com deficiência permanente por síndrome congênita do vírus Zika acrescenta 60 dias.", "fonte": "Lei 8.213/1991, arts. 39, par. único, 71, caput e §§ 2º e 3º, 71-A, 72, caput e §§ 1º e 3º, e 73, caput, I a III e par. único", "origem": "03_TESES/legislacao/leis/Lei-8213-1991_planos-de-beneficios-previdencia.htm (arts. 39, 71 a 73, últimas ocorrências; § 3º do art. 71 incl. Lei 15.222/2025; § 2º incl. Lei 15.156/2025). As alterações da Lei 15.371/2026 (salário-paternidade) só vigoram em 01/01/2027 (art. 14 dessa lei, em 03_TESES/legislacao/leis/Lei-15371-2026_licenca-e-salario-paternidade.txt)", "sinal": "firme"}, {"id": "qd-022", "tema": "Salário-maternidade e outros", "pergunta": "Quem tem direito ao salário-família e até que idade do filho?", "variantes": ["Salário-família 2026", "Aposentado recebe salário-família?", "Doméstica tem salário-família?", "Até quantos anos do filho se recebe salário-família?", "Enteado dá direito a salário-família?"], "resposta": "Tem direito, em 2026, quem ganha até R$ 1.980,38 por mês:\n- o empregado, inclusive o doméstico;\n- o trabalhador avulso;\n- o aposentado por invalidez ou por idade;\n- os demais aposentados com 65 anos ou mais (homem) ou 60 anos ou mais (mulher).\nA cota é de R$ 67,54 por filho ou equiparado até 14 anos de idade, ou inválido de qualquer idade. Equiparam-se a filho o enteado, o menor sob tutela e o menor sob guarda judicial que não tenham condições de se sustentar. Exige certidão de nascimento e, todo ano, atestado de vacinação obrigatória e comprovante de frequência escolar; o empregado doméstico apresenta só a certidão. A empresa ou o empregador doméstico paga junto com o salário e compensa nas contribuições; o avulso pode receber pelo sindicato; o aposentado recebe junto com a aposentadoria. A remuneração considerada é a soma dos salários de contribuição, sem 13º e sem adicional de férias, e a cota é proporcional aos dias trabalhados no mês de admissão e de demissão. A cota não se incorpora ao salário nem ao benefício.", "fonte": "Lei 8.213/1991, arts. 16, § 2º, 65 a 70; Portaria Interministerial MPS/MF 13/2026, art. 4º e §§ 1º a 4º", "origem": "03_TESES/legislacao/leis/Lei-8213-1991_planos-de-beneficios-previdencia.htm (arts. 65, red. LC 150/2015, 67, 68, 69 e 70; art. 16, § 2º, red. Lei 15.108/2025); _CONTINUIDADE/_artefatos/prev-lacunas/fontes/INSUMO_dou-portaria-interministerial-mps-mf-n-13-de-9-de-janeiro-de-2026-680382603.html (art. 4º)", "sinal": "firme"}, {"id": "qd-023", "tema": "Cálculo do valor", "pergunta": "Quais são os valores do INSS em 2026?", "variantes": ["Teto do INSS 2026", "Salário mínimo 2026", "Limite de renda do auxílio-reclusão 2026", "Valor do LOAS em 2026", "Valores atualizados da previdência"], "resposta": "Valores em vigor desde 01/01/2026:\n- salário mínimo: R$ 1.621,00;\n- piso de aposentadoria, auxílio por incapacidade temporária e pensão por morte (valor total): R$ 1.621,00;\n- teto dos benefícios e do salário de contribuição: R$ 8.475,55;\n- reajuste dos benefícios acima do mínimo com início até 02/2025: 3,90%;\n- BPC (benefício de prestação continuada) e renda mensal vitalícia: R$ 1.621,00;\n- limite de renda por pessoa para o BPC (1/4 do mínimo): R$ 405,25;\n- auxílio-inclusão (50% do BPC): R$ 810,50;\n- salário-família: R$ 67,54 por cota, para remuneração de até R$ 1.980,38;\n- auxílio-reclusão: R$ 1.621,00, para preso de baixa renda com média dos 12 últimos salários de contribuição de até R$ 1.980,38;\n- diária para perícia ou reabilitação em outra cidade, por determinação do INSS (Instituto Nacional do Seguro Social): R$ 141,63;\n- limite das execuções do art. 128 da Lei 8.213/1991, pagas em até 60 dias sem precatório: R$ 97.260,00;\n- benefício do seringueiro (Lei 7.986/1989): R$ 3.242,00.", "fonte": "Decreto 12.797/2025, art. 1º; Portaria Interministerial MPS/MF 13/2026, arts. 1º a 5º e 8º, VIII e par. único; Lei 8.742/1993, arts. 20, § 3º, e 26-B", "origem": "_CONTINUIDADE/_artefatos/prev-lacunas/fontes/INSUMO_dou-portaria-interministerial-mps-mf-n-13-de-9-de-janeiro-de-2026-680382603.html (arts. 1º a 8º); 05_AUTOMACAO/scripts/dados/salario_minimo.json e teto_rgps.json (vigência 2026-01); limite do BPC e auxílio-inclusão calculados sobre o mínimo", "sinal": "firme"}, {"id": "qd-024", "tema": "Cálculo do valor", "pergunta": "Meu benefício começou em 2025. Quanto foi o reajuste em 2026?", "variantes": ["Reajuste proporcional do INSS 2026", "Aposentei em junho de 2025, qual o aumento?", "Tabela de reajuste por data de início do benefício", "Aumento da aposentadoria em janeiro de 2026"], "resposta": "O reajuste de 01/01/2026 depende do mês de início do benefício:\n- até 01/2025: 3,90%;\n- 02/2025: 3,90%;\n- 03/2025: 2,38%;\n- 04/2025: 1,86%;\n- 05/2025: 1,38%;\n- 06/2025: 1,02%;\n- 07/2025: 0,79%;\n- 08/2025: 0,58%;\n- 09/2025: 0,79%;\n- 10/2025: 0,27%;\n- 11/2025: 0,24%;\n- 12/2025: 0,21%.\nQuem recebe 1 salário mínimo passa a R$ 1.621,00. Benefício iniciado em 2025 cuja média superava o teto da época recebe também, em 01/2026, a diferença percentual entre a média e o teto, limitado a R$ 8.475,55.", "fonte": "Portaria Interministerial MPS/MF 13/2026, arts. 1º, § 1º, e 6º, e Anexo I", "origem": "_CONTINUIDADE/_artefatos/prev-lacunas/fontes/INSUMO_dou-portaria-interministerial-mps-mf-n-13-de-9-de-janeiro-de-2026-680382603.html (Anexo I, fator de reajuste por data de início)", "sinal": "firme"}, {"id": "qd-026", "tema": "Profissionais da saúde", "pergunta": "Quais profissões da saúde contavam como especiais só pela profissão até 28/04/1995?", "variantes": ["Enfermeira tem tempo especial pela profissão?", "Dentista e médico antes de 1995 contam como especial?", "Farmacêutico e veterinário têm enquadramento por categoria?", "Técnico de enfermagem conta pela categoria?"], "resposta": "Até 28/04/1995, contavam como especiais de 25 anos só pela profissão, provada pela CTPS (Carteira de Trabalho e Previdência Social) ou formulário:\n- pelo Decreto 53.831/1964, código 2.1.3: médicos, dentistas e enfermeiros;\n- pelo Decreto 83.080/1979, Anexo II, código 2.1.3: médicos expostos aos agentes nocivos do código 1.3.0 do Anexo I; médicos anatomopatologistas ou histopatologistas; médicos toxicologistas; médicos laboratoristas (patologistas); médicos radiologistas ou radioterapeutas; técnicos de raios X; técnicos de laboratório de anatomopatologia ou histopatologia; farmacêuticos-toxicologistas e bioquímicos; técnicos de laboratório de gabinete de necropsia; técnicos de anatomia; dentistas, enfermeiros e médicos veterinários expostos aos agentes nocivos do código 1.3.0 do Anexo I.\nProfissão da saúde fora dessas listas, como técnico e auxiliar de enfermagem, fisioterapeuta, farmacêutico não toxicologista, auxiliar de laboratório, trabalhador de lavanderia hospitalar e coveiro, só se enquadra pela categoria por analogia justificada (TNU (Turma Nacional de Uniformização), Tema 198). A partir de 29/04/1995, todas precisam provar a exposição a agentes biológicos.", "fonte": "Dec. 53.831/1964, Quadro Anexo, 2.1.3; Dec. 83.080/1979, Anexo II, 2.1.3; Lei 9.032/1995; IN PRES/INSS 128/2022, art. 269, § 1º; TNU Tema 198", "origem": ".claude/skills/haack-prev-padrao/references/doutrina-previdenciaria.md §5 (tabela de agentes biológicos e profissionais da saúde, linha Até 28/04/1995; Categoria e rol), com base no ins. R8 b.5.1 e b.5.2; lista do Dec. 83.080, Anexo II, 2.1.3, completada pela leitura OCR do PDF escaneado do Planalto em 03_TESES/legislacao/leis/Decreto-83080-1979_regulamento-beneficios-previdencia_anexos-ocr.txt (sem texto nativo)", "sinal": "firme"}, {"id": "qd-027", "tema": "Tempo especial: conceito e prova", "pergunta": "Motorista de caminhão ou de ônibus conta como especial pela profissão?", "variantes": ["Motorista de caminhão tem tempo especial?", "Cobrador de ônibus conta como especial?", "Ajudante de caminhão antes de 1995", "Aeroviário e aeronauta têm enquadramento por categoria?"], "resposta": "Sim, até 28/04/1995, pelo Decreto 53.831/1964, como atividade penosa de 25 anos. O código 2.4.4 (transporte rodoviário) lista:\n- motorneiros e condutores de bondes;\n- motoristas e cobradores de ônibus;\n- motoristas e ajudantes de caminhão.\nNo mesmo quadro, o código 2.4.1 (transporte aéreo), atividade perigosa de 25 anos, lista aeronautas e aeroviários de serviços de pista e de oficinas de manutenção, de conservação, de carga e descarga, de recepção e de despacho de aeronaves.\nA partir de 29/04/1995, o motorista precisa provar exposição a agente nocivo, como ruído ou vibração acima do limite, por PPP (Perfil Profissiográfico Previdenciário) ou laudo.", "fonte": "Dec. 53.831/1964, Quadro Anexo, códigos 2.4.1 e 2.4.4 (leitura da imagem do PDF escaneado do Planalto, sem texto nativo do quadro); Lei 9.032/1995; IN PRES/INSS 128/2022, art. 269, § 1º", "origem": "_CONTINUIDADE/_artefatos/prev-lacunas/INSUMO_pesquisa-08_agentes-quimicos_2026-10-21.md, b.1.2 (códigos 2.4.1 e 2.4.4 transcritos da imagem do PDF escaneado do Planalto, p. 4 e 5; sem texto nativo do quadro); marco de 28/04/1995 em doutrina-previdenciaria.md §1", "sinal": "firme"}, {"id": "qd-028", "tema": "Tempo especial: conceito e prova", "pergunta": "Quem trabalhava em metalúrgica, fundição ou com solda conta como especial pela profissão?", "variantes": ["Soldador tem tempo especial antes de 1995?", "Forneiro e fundidor contam como especial?", "Esmerilhador e pintor a pistola", "Trabalho em aciaria antes de 1995"], "resposta": "Sim, até 28/04/1995, como atividade de 25 anos, se a função estiver no Decreto 83.080/1979, Anexo II:\nCódigo 2.5.1, indústrias metalúrgicas e mecânicas (aciarias, fundições de ferro e metais não ferrosos, laminações):\n- forneiros, mãos de forno e reservas de forno;\n- fundidores, soldadores e lingoteiros;\n- tenazeiros, caçambeiros, amarradores, dobradores e desbastadores;\n- rebarbadores, esmerilhadores e marteleteiros de rebarbação;\n- operadores de tambores rotativos e de outras máquinas de rebarbação;\n- operadores de máquinas para fabricação de tubos por centrifugação;\n- operadores de pontes rolantes ou de equipamentos de transporte de peças e caçambas com metal líquido, nos recintos de aciarias, fundições e laminações;\n- operadores nos fornos de recozimento ou de têmpera, recozedores e temperadores.\nCódigo 2.5.3, operações diversas:\n- operadores de máquinas pneumáticas;\n- rebitadores com marteletes pneumáticos;\n- cortadores de chapa a oxiacetileno;\n- esmerilhadores;\n- soldadores (solda elétrica e a oxiacetileno);\n- operadores de jatos de areia com exposição direta à poeira;\n- pintores a pistola, com solventes hidrocarbonados e tintas tóxicas;\n- foguistas.\nO mecânico não aparece nessas listas. A partir de 29/04/1995 é preciso provar a exposição ao agente nocivo.", "fonte": "Dec. 83.080/1979, Anexo II, códigos 2.5.1 e 2.5.3 (leitura da imagem do PDF escaneado do Planalto, sem texto nativo dos anexos); Lei 9.032/1995", "origem": "_CONTINUIDADE/_artefatos/prev-lacunas/INSUMO_pesquisa-08_agentes-quimicos_2026-10-21.md, b.2.3 (códigos transcritos da imagem do PDF escaneado do Planalto, p. 198 e 202; sem texto nativo dos anexos)", "sinal": "firme"}, {"id": "anx3-000", "tema": "Auxílio-acidente", "pergunta": "Quais sequelas dão direito ao auxílio-acidente?", "variantes": ["lista de sequelas do auxílio-acidente", "anexo III", "que lesão dá auxílio-acidente", "tabela do auxílio-acidente"], "resposta": "O Anexo III do Decreto 3.048/1999 relaciona nove grupos de situações:\n- aparelho visual (perda de acuidade, lesão da musculatura do olho ou das vias lacrimais);\n- aparelho auditivo (perda ou redução da audição em grau médio ou superior por trauma acústico);\n- aparelho da fonação (perturbação da palavra em grau médio ou máximo);\n- prejuízo estético em grau médio ou máximo no crânio, na face ou no pescoço, ou perda de dentes com deformação da arcada;\n- perdas de segmentos de membros (mãos, dedos, pés);\n- alterações articulares (mandíbula, coluna, ombro, cotovelo, antebraço, dedos, quadril, joelho, tornozelo);\n- encurtamento de membro inferior de mais de 4 cm;\n- redução da força ou da capacidade funcional dos membros em grau sofrível ou inferior;\n- outros aparelhos (segmentectomia pulmonar com redução respiratória; perda de segmento do aparelho digestivo).\nDoença profissional ou do trabalho com sequela permanente que reduza a capacidade de trabalho também se enquadra, pelo art. 104 do regulamento.", "fonte": "Decreto 3.048/1999, Anexo III, Quadros 1 a 9, e art. 104", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo III", "sinal": "firme"}, {"id": "anx3-001", "tema": "Auxílio-acidente", "pergunta": "Auxílio-acidente: quais situações de aparelho visual dão direito?", "variantes": ["visão", "olho", "perdi a visão de um olho", "vista", "sequela visão auxílio-acidente"], "resposta": "Pelo Quadro 1 do Anexo III do Decreto 3.048/1999 (aparelho visual): a) acuidade visual, após correção, igual ou inferior a 0,2 no olho acidentado; b) acuidade visual, após correção, igual ou inferior a 0,5 em ambos os olhos, quando ambos tiverem sido acidentados; c) acuidade visual, após correção, igual ou inferior a 0,5 no olho acidentado, quando a do outro olho for igual a 0,5 ou menos, após correção; d) lesão da musculatura extrínseca do olho, acarretando paresia ou paralisia; e) lesão bilateral das vias lacrimais, com ou sem fístulas, ou unilateral com fístula. NOTA 1 - A acuidade visual restante é avaliada pela escala de Wecker, em décimos, e após a correção por lentes. NOTA 2 - A nubécula e o leucoma são analisados em função da redução da acuidade ou do prejuízo estético que acarretam, de acordo com os quadros respectivos.", "fonte": "Decreto 3.048/1999, Anexo III, Quadro nº 1", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo III", "sinal": "firme"}, {"id": "anx3-002", "tema": "Auxílio-acidente", "pergunta": "Auxílio-acidente: quais situações de aparelho auditivo dão direito?", "variantes": ["audição", "surdez", "perda auditiva", "ouvido", "PAIR", "sequela audição auxílio-acidente"], "resposta": "Pelo Quadro 2 do Anexo III do Decreto 3.048/1999 (aparelho auditivo): Trauma acústico: a) perda da audição no ouvido acidentado; b) redução da audição em grau médio ou superior em ambos os ouvidos, quando os dois tiverem sido acidentados; c) redução da audição, em grau médio ou superior, no ouvido acidentado, quando a audição do outro estiver também reduzida em grau médio ou superior. NOTA 1 - A capacidade auditiva em cada ouvido é avaliada mediante audiometria apenas aérea, nas frequências de 500, 1.000, 2.000 e 3.000 Hertz. NOTA 2 - A redução da audição, em cada ouvido, é avaliada pela média aritmética dos valores, em decibéis, encontrados nas frequências de 500, 1.000, 2.000 e 3.000 Hertz, segundo adaptação da classificação de Davis & Silvermann, 1970. Audição normal - até vinte e cinco decibéis. Redução em grau mínimo - vinte e seis a quarenta decibéis; Redução em grau médio - quarenta e um a setenta decibéis; Redução em grau máximo - setenta e um a noventa decibéis; Perda de audição - mais de noventa decibéis.", "fonte": "Decreto 3.048/1999, Anexo III, Quadro nº 2", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo III", "sinal": "firme"}, {"id": "anx3-003", "tema": "Auxílio-acidente", "pergunta": "Auxílio-acidente: quais situações de aparelho da fonação dão direito?", "variantes": ["fala", "voz", "sequela fala auxílio-acidente"], "resposta": "Pelo Quadro 3 do Anexo III do Decreto 3.048/1999 (aparelho da fonação): Perturbação da palavra em grau médio ou máximo, desde que comprovada por métodos clínicos objetivos.", "fonte": "Decreto 3.048/1999, Anexo III, Quadro nº 3", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo III", "sinal": "firme"}, {"id": "anx3-004", "tema": "Auxílio-acidente", "pergunta": "Auxílio-acidente: quais situações de prejuízo estético dão direito?", "variantes": ["cicatriz", "deformidade", "rosto", "dentes", "sequela cicatriz auxílio-acidente"], "resposta": "Pelo Quadro 4 do Anexo III do Decreto 3.048/1999 (prejuízo estético): Prejuízo estético, em grau médio ou máximo, quando atingidos crânios, e/ou face, e/ou pescoço ou perda de dentes quando há também deformação da arcada dentária que impede o uso de prótese. NOTA 1 - Só é considerada como prejuízo estético a lesão que determina apreciável modificação estética do segmento corpóreo atingido, acarretando aspecto desagradável, tendo-se em conta sexo, idade e profissão do acidentado. NOTA 2 - A perda anatômica de membro, a redução de movimentos articulares ou a alteração da capacidade funcional de membro não são considerados como prejuízo estético, podendo, porém, ser enquadradas, se for o caso, nos quadros respectivos.", "fonte": "Decreto 3.048/1999, Anexo III, Quadro nº 4", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo III", "sinal": "firme"}, {"id": "anx3-005", "tema": "Auxílio-acidente", "pergunta": "Auxílio-acidente: quais situações de perdas de segmentos de membros dão direito?", "variantes": ["amputação", "perdi um dedo", "dedo", "mão", "pé", "falange", "sequela amputação auxílio-acidente"], "resposta": "Pelo Quadro 5 do Anexo III do Decreto 3.048/1999 (perdas de segmentos de membros): a) perda de segmento ao nível ou acima do carpo; b) perda de segmento do primeiro quirodáctilo, desde que atingida a falange proximal; c) perda de segmentos de dois quirodáctilos, desde que atingida a falange proximal em pelo menos um deles; d) perda de segmento do segundo quirodáctilo, desde que atingida a falange proximal; e) perda de segmento de três ou mais falanges, de três ou mais quirodáctilos; f) perda de segmento ao nível ou acima do tarso; g) perda de segmento do primeiro pododáctilo, desde que atingida a falange proximal; h) perda de segmento de dois pododáctilos, desde que atingida a falange proximal em ambos; i) perda de segmento de três ou mais falanges, de três ou mais pododáctilos. NOTA: Para efeito de enquadramento, a perda parcial de parte óssea de um segmento equivale à perda do segmento. A perda parcial de partes moles sem perda de parte óssea do segmento não é considerada para efeito de enquadramento.", "fonte": "Decreto 3.048/1999, Anexo III, Quadro nº 5", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo III", "sinal": "firme"}, {"id": "anx3-006", "tema": "Auxílio-acidente", "pergunta": "Auxílio-acidente: quais situações de alterações articulares dão direito?", "variantes": ["articulação", "ombro", "joelho", "coluna", "cotovelo", "limitação de movimento", "sequela articulação auxílio-acidente"], "resposta": "Pelo Quadro 6 do Anexo III do Decreto 3.048/1999 (alterações articulares): a) redução em grau médio ou superior dos movimentos da mandíbula; b) redução em grau máximo dos movimentos do segmento cervical da coluna vertebral; c) redução em grau máximo dos movimentos do segmento lombo-sacro da coluna vertebral; d) redução em grau médio ou superior dos movimentos das articulações do ombro ou do cotovelo; e) redução em grau médio ou superior dos movimentos de pronação e/ou de supinação do antebraço; f) redução em grau máximo dos movimentos do primeiro e/ou do segundo quirodáctilo, desde que atingidas as articulações metacarpo-falangeana e falange-falangeana; g) redução em grau médio ou superior dos movimentos das articulações coxo-femural e/ou joelho, e/ou tíbio-társica. NOTA 1 - Os graus de redução de movimentos articulares referidos neste quadro são avaliados de acordo com os seguintes critérios: Grau máximo: redução acima de dois terços da amplitude normal do movimento da articulação; Grau médio: redução de mais de um terço e até dois terços da amplitude normal do movimento da articulação; Grau mínimo: redução de até um terço da amplitude normal do movimento da articulação. NOTA 2 - A redução de movimentos do cotovelo, de pronação e supinação do antebraço, punho, joelho e tíbio-társica, secundária a uma fratura de osso longo do membro, consolidada em posição viciosa e com desvio de eixo, também é enquadrada dentro dos limites estabelecidos.", "fonte": "Decreto 3.048/1999, Anexo III, Quadro nº 6", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo III", "sinal": "firme"}, {"id": "anx3-007", "tema": "Auxílio-acidente", "pergunta": "Auxílio-acidente: quais situações de encurtamento de membro inferior dão direito?", "variantes": ["perna mais curta", "encurtamento", "fratura", "sequela perna mais curta auxílio-acidente"], "resposta": "Pelo Quadro 7 do Anexo III do Decreto 3.048/1999 (encurtamento de membro inferior): Encurtamento de mais de 4 cm (quatro centímetros). NOTA: A preexistência de lesão de bacia deve ser considerada quando da avaliação do encurtamento.", "fonte": "Decreto 3.048/1999, Anexo III, Quadro nº 7", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo III", "sinal": "firme"}, {"id": "anx3-008", "tema": "Auxílio-acidente", "pergunta": "Auxílio-acidente: quais situações de redução da força e/ou da capacidade funcional dos membros dão direito?", "variantes": ["perda de força", "força na mão", "punho", "braço", "perna", "sequela perda de força auxílio-acidente"], "resposta": "Pelo Quadro 8 do Anexo III do Decreto 3.048/1999 (redução da força e/ou da capacidade funcional dos membros): a) redução da força e/ou da capacidade funcional da mão, do punho, do antebraço ou de todo o membro superior em grau sofrível ou inferior da classificação de desempenho muscular; b) redução da força e/ou da capacidade funcional do primeiro quirodáctilo em grau sofrível ou inferior; c) redução da força e/ou da capacidade funcional do pé, da perna ou de todo o membro inferior em grau sofrível ou inferior. NOTA 1 - Esta classificação se aplica a situações decorrentes de comprometimento muscular ou neurológico. Não se aplica a alterações decorrentes de lesões articulares ou de perdas anatômicas constantes dos quadros próprios. NOTA 2 - Na avaliação de redução da força ou da capacidade funcional é utilizada a classificação da carta de desempenho muscular da The National Foundation for Infantile Paralysis, adotada pelas Sociedades Internacionais de Ortopedia e Traumatologia, e a seguir transcrita: Desempenho muscular Grau 5 - Normal - cem por cento - Amplitude completa de movimento contra a gravidade e contra grande resistência. Grau 4 - Bom - setenta e cinco por cento - Amplitude completa de movimento contra a gravidade e contra alguma resistência. Grau 3 - Sofrível - cinquenta por cento - Amplitude completa de movimento contra a gravidade sem opor resistência. Grau 2 - Pobre - vinte e cinco por cento - Amplitude completa de movimento quando eliminada a gravidade. Grau 1 - Traços - dez por cento - Evidência de leve contração. Nenhum movimento articular. Grau 0 (zero) - zero por cento - Nenhuma evidência de contração. Grau E ou EG - zero por cento - Espasmo ou espasmo grave. Grau C ou CG - Contratura ou contratura grave. NOTA - O enquadramento dos casos de grau sofrível ou inferior abrange, na prática, os casos de redução em que há impossibilidade de movimento contra alguma força de resistência além da força de gravidade.", "fonte": "Decreto 3.048/1999, Anexo III, Quadro nº 8", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo III", "sinal": "firme"}, {"id": "anx3-009", "tema": "Auxílio-acidente", "pergunta": "Auxílio-acidente: quais situações de outros aparelhos e sistemas dão direito?", "variantes": ["pulmão", "intestino", "aparelho digestivo", "sequela pulmão auxílio-acidente"], "resposta": "Pelo Quadro 9 do Anexo III do Decreto 3.048/1999 (outros aparelhos e sistemas): a) segmentectomia pulmonar que acarrete redução em grau médio ou superior da capacidade funcional respiratória; devidamente correlacionada à sua atividade laborativa. b) perda do segmento do aparelho digestivo cuja localização ou extensão traz repercussões sobre a nutrição e o estado geral.", "fonte": "Decreto 3.048/1999, Anexo III, Quadro nº 9", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo III", "sinal": "firme"}, {"id": "tnu-a01", "tema": "TNU: temas e súmulas por assunto", "pergunta": "Quais temas e súmulas da TNU tratam de aposentadoria por idade, programada e regras de transição?", "variantes": ["TNU aposentadoria por idade", "tema TNU idade", "súmula TNU idade", "jurisprudência do Juizado sobre aposentadoria por idade", "tema TNU híbrida", "súmula TNU híbrida", "Turma Nacional aposentadoria por idade"], "resposta": "Temas representativos e súmulas da TNU (Turma Nacional de Uniformização) sobre aposentadoria por idade, programada e regras de transição, com sinal ao segurado e status na data da fonte (temas: repositório de 16/10/2026 e catálogo; súmulas: lista oficial de 24/10/2026):\nTema 21 (ADVERSO; transitado): O rural da carência deve ser imediatamente anterior à idade ou à DER (data de entrada do requerimento).\nTema 27 (FAVORÁVEL; transitado): Tabela do art. 142 aplicada pelo ano em que o segurado completa a idade.\nTema 131 (FAVORÁVEL; transitado): Aposentadoria híbrida sem rural imediato; rural remoto conta na carência.\nTema 145 (ADVERSO; transitado): O rural da carência deve ser imediatamente anterior à idade ou à DER.\nTema 153 (FAVORÁVEL; transitado): Rural com CTPS (Carteira de Trabalho e Previdência Social) anterior a 1991 conta na carência sem contribuições.\nTema 155 (FAVORÁVEL; transitado): Doméstico anterior à Lei 5.859/72 conta sem exigência de contribuições.\nSúmula 44 (FAVORÁVEL): A tabela do art. 142 aplica-se pelo ano em que o segurado completa a idade, ainda que a carência venha depois.\nSúmula 54 (FAVORÁVEL): Na idade rural, a atividade da carência se afere no período imediatamente anterior à DER ou à idade.\nSúmula 76 (ADVERSO): Rural não contributivo não majora o coeficiente da aposentadoria por idade (art. 50).", "fonte": "TNU, temas representativos e súmulas", "origem": "tnu-inventario-sinais.md v1.1; 04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md; 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md", "sinal": "firme", "ficha": true}, {"id": "tnu-a02", "tema": "TNU: temas e súmulas por assunto", "pergunta": "Quais temas e súmulas da TNU tratam de tempo de contribuição, carência e CNIS?", "variantes": ["TNU tempo de contribuição e carência", "tema TNU carência", "súmula TNU carência", "jurisprudência do Juizado sobre tempo de contribuição e carência", "tema TNU CTPS", "súmula TNU CTPS", "Turma Nacional tempo de contribuição e carência"], "resposta": "Temas representativos e súmulas da TNU (Turma Nacional de Uniformização) sobre tempo de contribuição, carência e CNIS (Cadastro Nacional de Informações Sociais), com sinal ao segurado e status na data da fonte (temas: repositório de 16/10/2026 e catálogo; súmulas: lista oficial de 24/10/2026):\nTema 27 (FAVORÁVEL; transitado): Tabela do art. 142 aplicada pelo ano em que o segurado completa a idade.\nTema 29 (FAVORÁVEL; transitado): Recolhimento tardio pelo empregador não prejudica a empregada doméstica.\nTema 63 (ADVERSO; transitado): Rural posterior à Lei 8.213 exige contribuições para a carência.\nTema 93 (FAVORÁVEL; transitado): DIB (data de início do benefício) na DER (data de entrada do requerimento) quando os requisitos já existiam nela (Súmula 33).\nTema 105 (FAVORÁVEL; transitado): Benefício por incapacidade intercalado conta como carência.\nTema 153 (FAVORÁVEL; transitado): Rural com CTPS (Carteira de Trabalho e Previdência Social) anterior a 1991 conta na carência sem contribuições.\nTema 155 (FAVORÁVEL; transitado): Doméstico anterior à Lei 5.859/72 conta sem exigência de contribuições.\nTema 176 (ADVERSO; transitado): Carência das MPs (Medidas Provisórias) 739/2016 e 767/2017 para incapacidade surgida na vigência delas.\nTema 192 (ADVERSO; transitado): Contribuição em atraso do contribuinte individual, relativa ao período entre a perda e a reaquisição da qualidade de segurado, não conta para carência.\nTema 216 (NEUTRO; transitado): Aluno-aprendiz exige quatro requisitos simultâneos (Súmula 18 alterada).\nTema 233 (FAVORÁVEL; transitado): Tempo de aposentadoria cassada no RPPS (regime próprio de previdência social) aproveitável no RGPS (Regime Geral de Previdência Social) por CTC (certidão de tempo de contribuição).\nTema 240 (ADVERSO; transitado): Anotação extemporânea em CTPS, isolada, não é início de prova material.\nTema 250 (FAVORÁVEL; sem trânsito na fonte): Aviso prévio indenizado vale para todos os fins previdenciários.\nTema 355 (ADVERSO; transitado): Seminarista não se equipara ao aluno-aprendiz.\nTema 358 (ADVERSO; transitado): Tempo de contribuição e carência são distintos; carência só com contribuições tempestivas; o art. 18 da EC (Emenda Constitucional) 103 não dispensa a carência.\nTema 384 (NEUTRO; transitado): Complementação de alíquota: efeitos na DER ou no novo requerimento.\nSúmula 10 (sem sinal na fonte): Rural anterior à Lei 8.213/91 serve à contagem recíproca com o serviço público, recolhidas as contribuições.\nSúmula 18 (sem sinal na fonte; alterada em 14/02/2020): Tempo de aluno-aprendiz exige retribuição, à conta do orçamento, como contraprestação por labor na execução de bens e serviços para terceiros.\nSúmula 24 (NEUTRO): Rural anterior à Lei 8.213/91 sem contribuições conta para benefício do RGPS, exceto para carência.\nSúmula 33 (sem sinal na fonte): Preenchidos os requisitos na DER, ela é o termo inicial da aposentadoria por tempo de serviço.\nSúmula 44 (FAVORÁVEL): A tabela do art. 142 aplica-se pelo ano em que o segurado completa a idade, ainda que a carência venha depois.\nSúmula 73 (NEUTRO): Auxílio-doença ou aposentadoria por invalidez não acidentários contam como tempo ou carência só se intercalados com contribuições.\nSúmula 75 (sem sinal na fonte): CTPS sem defeito formal goza de presunção relativa e prova o tempo, mesmo fora do CNIS.\nNão citar: Tema 394 (em julgamento, sem tese); Tema 66 (tese cancelada); Súmula 31 (revogada em 2023).", "fonte": "TNU, temas representativos e súmulas", "origem": "tnu-inventario-sinais.md v1.1; catalogo-temas-vinculantes.md v1.15 §4; 04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md; 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md", "sinal": "firme", "ficha": true}, {"id": "tnu-a03", "tema": "TNU: temas e súmulas por assunto", "pergunta": "Quais temas e súmulas da TNU tratam de contribuinte individual, facultativo de baixa renda e contribuição em atraso?", "variantes": ["TNU contribuinte individual", "tema TNU contribuinte individual", "súmula TNU contribuinte individual", "jurisprudência do Juizado sobre contribuinte individual", "tema TNU contribuição em atraso", "súmula TNU contribuição em atraso", "Turma Nacional contribuinte individual"], "resposta": "Temas representativos e súmulas da TNU (Turma Nacional de Uniformização) sobre contribuinte individual, facultativo de baixa renda e contribuição em atraso, com sinal ao segurado e status na data da fonte (temas: repositório de 16/10/2026 e catálogo; súmulas: lista oficial de 24/10/2026):\nTema 33 (FAVORÁVEL; transitado): Empresário contribuinte individual: habitualidade do ruído presumida com laudo.\nTema 181 (ADVERSO; transitado): CadÚnico (Cadastro Único para Programas Sociais) prévio exigido para a alíquota de 5% do facultativo de baixa renda, sem retroagir.\nTema 188 (ADVERSO; transitado): Após 03/12/1998, o contribuinte individual não tem especial pela falta de EPI (equipamento de proteção individual) eficaz, salvo ruído, cancerígeno do Grupo 1 da LINACH (Lista Nacional de Agentes Cancerígenos para Humanos) ou prova técnica de inexistência de EPI apto.\nTema 192 (ADVERSO; transitado): Contribuição em atraso do contribuinte individual, relativa ao período entre a perda e a reaquisição da qualidade de segurado, não conta para carência.\nTema 201 (ADVERSO; transitado): Contribuinte individual excluído do auxílio-acidente.\nTema 239 (FAVORÁVEL; transitado): Prorrogação do período de graça por desemprego involuntário estende-se ao contribuinte individual.\nTema 285 (FAVORÁVEL; transitado): Atualização extemporânea do CadÚnico valida a alíquota de 5%.\nTema 286 (FAVORÁVEL; transitado): Dependentes podem complementar após o óbito as contribuições de 5%.\nTema 358 (ADVERSO; transitado): Tempo de contribuição e carência são distintos; carência só com contribuições tempestivas; o art. 18 da EC (Emenda Constitucional) 103 não dispensa a carência.\nTema 359 (FAVORÁVEL; transitado): Complementação posterior do facultativo de baixa renda vale para qualidade e carência.\nTema 384 (NEUTRO; transitado): Complementação de alíquota: efeitos na DER (data de entrada do requerimento) ou no novo requerimento.\nSúmula 52 (ADVERSO): Na pensão, não se regularizam após o óbito contribuições do contribuinte individual, salvo as devidas por tomadora de serviços.\nSúmula 62 (FAVORÁVEL): Contribuinte individual tem especial se comprovar exposição a agentes nocivos.\nNão citar: Tema 394 (em julgamento, sem tese).", "fonte": "TNU, temas representativos e súmulas", "origem": "tnu-inventario-sinais.md v1.1; catalogo-temas-vinculantes.md v1.15 §4; 04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md; 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md", "sinal": "firme", "ficha": true}, {"id": "tnu-a04", "tema": "TNU: temas e súmulas por assunto", "pergunta": "Quais temas e súmulas da TNU tratam de tempo especial em geral: PPP, laudo, EPI e permanência?", "variantes": ["TNU tempo especial", "tema TNU PPP", "súmula TNU PPP", "jurisprudência do Juizado sobre tempo especial", "tema TNU EPI", "súmula TNU EPI", "Turma Nacional tempo especial"], "resposta": "Temas representativos e súmulas da TNU (Turma Nacional de Uniformização) sobre tempo especial em geral: PPP (Perfil Profissiográfico Previdenciário), laudo, EPI (equipamento de proteção individual) e permanência, com sinal ao segurado e status na data da fonte (temas: repositório de 16/10/2026 e catálogo; súmulas: lista oficial de 24/10/2026):\nTema 13 (FAVORÁVEL; transitado): Sem prévio pedido de revisão quando o INSS (Instituto Nacional do Seguro Social) omitiu o tempo especial.\nTema 14 (FAVORÁVEL; transitado): Laudo pericial extemporâneo mantém força probante se não modificadas as condições do ambiente.\nTema 56 (FAVORÁVEL; transitado): Engenheiro mecânico enquadrado por categoria até a Lei 9.032/95.\nTema 68 (FAVORÁVEL; transitado): Motorista equiparado ao tratorista por categoria profissional.\nTema 165 (FAVORÁVEL; transitado): O auxílio-doença previdenciário conta como tempo especial quando o segurado exercia atividade especial antes do afastamento, sem prova de nexo com a atividade.\nTema 174 (NEUTRO; transitado): Desde 19/11/2003 o ruído se mede pela NHO-01 (Norma de Higiene Ocupacional 01 da Fundacentro) ou pela NR-15 (Norma Regulamentadora 15), com a técnica no PPP; PPP omisso ou duvidoso exige o LTCAT (Laudo Técnico das Condições Ambientais de Trabalho).\nTema 188 (ADVERSO; transitado): Após 03/12/1998, o contribuinte individual não tem especial pela falta de EPI eficaz, salvo ruído, cancerígeno do Grupo 1 da LINACH (Lista Nacional de Agentes Cancerígenos para Humanos) ou prova técnica de inexistência de EPI apto.\nTema 198 (FAVORÁVEL; transitado): Antes de 29/04/1995 cabe analogia às ocupações dos Decretos 53.831/64 e 83.080/79, justificada a semelhança (síntese do catálogo).\nTema 208 (FAVORÁVEL; transitado): PPP exige responsável técnico pelos registros ambientais em todo o período; a falta supre-se por LTCAT ou elemento técnico equivalente, extensível a outros períodos se o ambiente não mudou.\nTema 213 (FAVORÁVEL; transitado): O EPI eficaz declarado no PPP pode ser desafiado por impugnação específica na causa de pedir; havendo divergência real ou dúvida razoável sobre a eficácia, o período é especial.\nTema 268 (ADVERSO; transitado): Técnico agrícola não se equipara ao trabalhador na agropecuária.\nTema 278 (FAVORÁVEL; transitado): CTC (certidão de tempo de contribuição) com tempo especial discriminado; conversão entre RGPS (Regime Geral de Previdência Social) e regime da União até a EC (Emenda Constitucional) 103.\nTema 323 (NEUTRO; transitado): Calor: o item a dispensa a taxa de metabolismo; os itens b e c a exigem.\nTema 354 (ADVERSO; transitado): Tecelagem sem enquadramento por categoria pelo Parecer 085/78.\nTema 383 (FAVORÁVEL; sem trânsito): EPI eficaz no PPP não afasta a especialidade de profissionais de saúde hospitalares em procedimentos geradores de aerossol, urgência em setores críticos ou alas infectocontagiosas; fora disso, só por impugnação específica.\nSúmula 9 (sem sinal na fonte): EPI, ainda que elimine a insalubridade, não descaracteriza o especial por ruído.\nSúmula 49 (FAVORÁVEL): Antes de 29/04/1995 a exposição a agentes nocivos não precisa ser permanente.\nSúmula 62 (FAVORÁVEL): Contribuinte individual tem especial se comprovar exposição a agentes nocivos.\nSúmula 68 (FAVORÁVEL): Laudo pericial não contemporâneo é apto a comprovar a atividade especial.\nSúmula 70 (sem sinal na fonte): Tratorista equiparado a motorista de caminhão por categoria profissional.\nSúmula 87 (FAVORÁVEL): A eficácia do EPI não afasta o especial antes de 03/12/1998.", "fonte": "TNU, temas representativos e súmulas", "origem": "tnu-inventario-sinais.md v1.1; catalogo-temas-vinculantes.md v1.15 §4; 04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md; 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md", "sinal": "firme", "ficha": true}, {"id": "tnu-a05", "tema": "TNU: temas e súmulas por assunto", "pergunta": "Quais temas e súmulas da TNU tratam de ruído?", "variantes": ["TNU ruído", "tema TNU ruído", "súmula TNU ruído", "jurisprudência do Juizado sobre ruído", "tema TNU NHO-01", "súmula TNU NHO-01", "Turma Nacional ruído"], "resposta": "Temas representativos e súmulas da TNU (Turma Nacional de Uniformização) sobre ruído, com sinal ao segurado e status na data da fonte (temas: repositório de 16/10/2026 e catálogo; súmulas: lista oficial de 24/10/2026):\nTema 33 (FAVORÁVEL; transitado): Empresário contribuinte individual: habitualidade do ruído presumida com laudo.\nTema 174 (NEUTRO; transitado): Desde 19/11/2003 o ruído se mede pela NHO-01 (Norma de Higiene Ocupacional 01 da Fundacentro) ou pela NR-15 (Norma Regulamentadora 15), com a técnica no PPP (Perfil Profissiográfico Previdenciário); PPP omisso ou duvidoso exige o LTCAT (Laudo Técnico das Condições Ambientais de Trabalho).\nTema 317 (ADVERSO; transitado): Menção a dose, dosímetro ou dosimetria no PPP não basta; exige menção expressa à NHO-01 ou à NR-15.\nSúmula 9 (sem sinal na fonte): EPI (equipamento de proteção individual), ainda que elimine a insalubridade, não descaracteriza o especial por ruído.\nNão citar: Súmula 32 (cancelada em 2013).", "fonte": "TNU, temas representativos e súmulas", "origem": "tnu-inventario-sinais.md v1.1; catalogo-temas-vinculantes.md v1.15 §4; 04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md; 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md", "sinal": "firme", "ficha": true}, {"id": "tnu-a06", "tema": "TNU: temas e súmulas por assunto", "pergunta": "Quais temas e súmulas da TNU tratam de agentes químicos?", "variantes": ["TNU agentes químicos", "tema TNU hidrocarbonetos", "súmula TNU hidrocarbonetos", "jurisprudência do Juizado sobre agentes químicos", "tema TNU óleos e graxas", "súmula TNU óleos e graxas", "Turma Nacional agentes químicos"], "resposta": "Temas representativos e súmulas da TNU (Turma Nacional de Uniformização) sobre agentes químicos, com sinal ao segurado e status na data da fonte (temas: repositório de 16/10/2026 e catálogo; súmulas: lista oficial de 24/10/2026):\nTema 53 (FAVORÁVEL; transitado): Manipulação de óleos e graxas, devidamente comprovada, configura atividade especial.\nTema 170 (FAVORÁVEL; transitado): A redação do art. 68, § 4º, do Decreto 3.048 dada pelo Decreto 8.123/2013 aplica-se a períodos anteriores: sem avaliação quantitativa e sem descaracterização por EPI (equipamento de proteção individual).\nTema 287 (FAVORÁVEL; transitado): Amianto: fator 1,75 ou 1,50 para requerimentos desde o Decreto 2.172/97.\nTema 298 (ADVERSO; transitado): Desde o Decreto 2.172/97, indicação genérica de hidrocarbonetos ou óleos e graxas não basta; é indispensável especificar o agente nocivo.\nTema 382 (ADVERSO; transitado): Tolueno por via cutânea, inclusive líquido, não autoriza o especial por análise qualitativa (Anexo 13 da NR-15 (Norma Regulamentadora 15)).\nSúmula 71 (sem sinal na fonte): O mero contato do pedreiro com cimento não é condição especial.\nNão citar: Tema 399 (afetado, sem tese); Tema 397 (em julgamento, sem tese).", "fonte": "TNU, temas representativos e súmulas", "origem": "tnu-inventario-sinais.md v1.1; catalogo-temas-vinculantes.md v1.15 §4; 04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md; 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md", "sinal": "firme", "ficha": true}, {"id": "tnu-a07", "tema": "TNU: temas e súmulas por assunto", "pergunta": "Quais temas e súmulas da TNU tratam de agentes biológicos e saúde?", "variantes": ["TNU agentes biológicos", "tema TNU agente biológico", "súmula TNU agente biológico", "jurisprudência do Juizado sobre agentes biológicos", "tema TNU hospital", "súmula TNU hospital", "Turma Nacional agentes biológicos"], "resposta": "Temas representativos e súmulas da TNU (Turma Nacional de Uniformização) sobre agentes biológicos e saúde, com sinal ao segurado e status na data da fonte (temas: repositório de 16/10/2026 e catálogo; súmulas: lista oficial de 24/10/2026):\nTema 100 (FAVORÁVEL; transitado): O código 1.3.2 do Decreto 53.831/64 alcança também serviços gerais de limpeza e higienização hospitalar (redação do portal).\nTema 188 (ADVERSO; transitado): Após 03/12/1998, o contribuinte individual não tem especial pela falta de EPI (equipamento de proteção individual) eficaz, salvo ruído, cancerígeno do Grupo 1 da LINACH (Lista Nacional de Agentes Cancerígenos para Humanos) ou prova técnica de inexistência de EPI apto.\nTema 198 (FAVORÁVEL; transitado): Antes de 29/04/1995 cabe analogia às ocupações dos Decretos 53.831/64 e 83.080/79, justificada a semelhança (síntese do catálogo).\nTema 205 (NEUTRO; transitado): O rol de atividades com agente biológico é exemplificativo, mas exige prova concreta de risco de contaminação superior ao risco em geral.\nTema 211 (FAVORÁVEL; transitado): Agente biológico exige probabilidade da exposição ocupacional, indissociável da produção ou do serviço pela profissiografia, sem tempo mínimo de exposição na jornada.\nTema 238 (ADVERSO; transitado): Limpeza e higienização hospitalar exigem prova da exposição a agentes biológicos do código 1.3.2 por laudo ou formulário, sem enquadramento por simples categoria.\nTema 347 (ADVERSO; julgado, trânsito pendente no STF (Supremo Tribunal Federal)): Agente comunitário de saúde e de endemias: art. 198, § 10, da CF (EC (Emenda Constitucional) 120/2022) de eficácia limitada; exposição efetiva exigida até a lei complementar (síntese do catálogo).\nTema 383 (FAVORÁVEL; sem trânsito): EPI eficaz no PPP (Perfil Profissiográfico Previdenciário) não afasta a especialidade de profissionais de saúde hospitalares em procedimentos geradores de aerossol, urgência em setores críticos ou alas infectocontagiosas; fora disso, só por impugnação específica.\nSúmula 82 (FAVORÁVEL): O código 1.3.2 do Decreto 53.831/64 alcança serviços gerais de limpeza e higienização hospitalar.", "fonte": "TNU, temas representativos e súmulas", "origem": "catalogo-temas-vinculantes.md v1.15 §4; 04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md; 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md", "sinal": "firme", "ficha": true}, {"id": "tnu-a08", "tema": "TNU: temas e súmulas por assunto", "pergunta": "Quais temas e súmulas da TNU tratam de vigilante, eletricidade e periculosidade?", "variantes": ["TNU vigilante e eletricidade", "tema TNU vigilante", "súmula TNU vigilante", "jurisprudência do Juizado sobre vigilante e eletricidade", "tema TNU eletricidade", "súmula TNU eletricidade", "Turma Nacional vigilante e eletricidade"], "resposta": "Temas representativos e súmulas da TNU (Turma Nacional de Uniformização) sobre vigilante, eletricidade e periculosidade, com sinal ao segurado e status na data da fonte (temas: repositório de 16/10/2026 e catálogo; súmulas: lista oficial de 24/10/2026):\nTema 87 (NEUTRO; transitado, em revisão): Vigilante armado com laudo após 1997.\nTema 157 (NEUTRO; sem datas na fonte): Frentista sem presunção de periculosidade; especial só com formulário ou laudo.\nTema 159 (FAVORÁVEL; transitado): Eletricidade é especial após o Decreto 2.172/97.\nTema 210 (NEUTRO; transitado): Tensão elétrica acima de 250 V exige probabilidade da exposição ocupacional, indissociável da atividade pela profissiografia, sem tempo mínimo na jornada.\nSúmula 26 (sem sinal na fonte): Vigilante é atividade especial, equiparada à de guarda (item 2.5.7 do Decreto 53.831/64).", "fonte": "TNU, temas representativos e súmulas", "origem": "tnu-inventario-sinais.md v1.1; catalogo-temas-vinculantes.md v1.15 §4; 04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md; 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md", "sinal": "firme", "ficha": true}, {"id": "tnu-a09", "tema": "TNU: temas e súmulas por assunto", "pergunta": "Quais temas e súmulas da TNU tratam de conversão de tempo especial e comum?", "variantes": ["TNU conversão de tempo", "tema TNU conversão", "súmula TNU conversão", "jurisprudência do Juizado sobre conversão de tempo", "tema TNU fator 1,4", "súmula TNU fator 1,4", "Turma Nacional conversão de tempo"], "resposta": "Temas representativos e súmulas da TNU (Turma Nacional de Uniformização) sobre conversão de tempo especial e comum, com sinal ao segurado e status na data da fonte (temas: repositório de 16/10/2026 e catálogo; súmulas: lista oficial de 24/10/2026):\nTema 41 (FAVORÁVEL; sem datas na fonte): Fator 1,4 para homens em qualquer período.\nTema 158 (ADVERSO; transitado): Professor sem conversão em tempo comum após a EC (Emenda Constitucional) 18/81.\nTema 278 (FAVORÁVEL; transitado): CTC (certidão de tempo de contribuição) com tempo especial discriminado; conversão entre RGPS (Regime Geral de Previdência Social) e regime da União até a EC 103.\nTema 287 (FAVORÁVEL; transitado): Amianto: fator 1,75 ou 1,50 para requerimentos desde o Decreto 2.172/97.\nSúmula 50 (NEUTRO): Conversão de especial em comum do trabalho em qualquer período.\nSúmula 55 (NEUTRO): Conversão de especial em comum pelo fator vigente na data da concessão.\nSúmula 66 (sem sinal na fonte): Servidor ex-celetista tem direito à conversão do especial em comum para contagem recíproca.\nSúmula 85 (sem sinal na fonte): Conversão de comum em especial de período anterior à Lei 9.032/95, se todos os requisitos foram cumpridos antes dela.\nNão citar: Súmula 16 (cancelada em 2009).", "fonte": "TNU, temas representativos e súmulas", "origem": "tnu-inventario-sinais.md v1.1; 04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md; 04_DECISOES/TNU/temas-represen
