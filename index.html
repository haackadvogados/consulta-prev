ria programada e por idade. O MEI (microempreendedor individual) contribui com 5% do salário mínimo, e esse período não conta para as regras por tempo de contribuição nem para a contagem em regime próprio sem complementar até 20%. O transportador autônomo de cargas inscrito como MEI paga 12%, com a mesma restrição.", "fonte": "Lei 8.212/1991, art. 21, § 2º, II, 'a'; LC 123/2006, arts. 18-A, § 3º, IV, e 18-F, III; IN 128/2022, art. 216, V, 'a', e §§ 1º e 2º (red. IN 212/2026)", "origem": "cenarios-e-custos.md §3; doutrina-previdenciaria.md §6", "sinal": "firme"}, {"id": "apos-038", "tema": "Categorias e alíquotas", "pergunta": "Como funciona a contribuição de 5% do facultativo de baixa renda?", "variantes": ["facultativo baixa renda", "INSS de 5% para dona de casa", "contribuição com CadÚnico"], "resposta": "É de 5% sobre o salário mínimo, só para quem não tem renda própria e se dedica exclusivamente ao trabalho doméstico na própria residência, em família inscrita no CadÚnico (Cadastro Único para Programas Sociais) com renda de até 2 salários mínimos, e conta para a aposentadoria programada e por idade. Para as regras por tempo de contribuição e para regime próprio, é preciso complementar a diferença até 20%.", "fonte": "Lei 8.212/1991, art. 21, § 2º, II, 'b', §§ 3º e 4º; IN 128/2022, art. 216, §§ 1º e 2º (red. IN 212/2026)", "origem": "cenarios-e-custos.md §3 e §4; Lei 8.212/1991 compilada, art. 21, § 2º, II, 'b', e § 4º", "sinal": "firme"}, {"id": "apos-039", "tema": "Categorias e alíquotas", "pergunta": "Presto serviço como autônomo para empresa. Quem recolhe o INSS?", "variantes": ["autônomo que trabalha para empresa", "empresa desconta 11% do autônomo", "RPA e INSS", "prestador de serviço precisa pagar carnê"], "resposta": "A empresa retém 11% da sua remuneração e recolhe. Desde abril de 2003 esse recolhimento se presume feito, e esse tempo pode constar em CTC (Certidão de Tempo de Contribuição) mesmo sem prova do pagamento pela empresa.", "fonte": "Lei 10.666/2003, art. 4º; Lei 8.213/1991, art. 96, V", "origem": "cenarios-e-custos.md §3; Lei 8.213/1991 compilada, art. 96", "sinal": "firme"}, {"id": "apos-040", "tema": "Categorias e alíquotas", "pergunta": "Paguei 11% ou 5% por anos. Posso completar para 20%?", "variantes": ["complementar contribuição", "complementação para 20%", "transformar 11% em 20%", "pagar a diferença do MEI"], "resposta": "Sim. Paga-se a diferença até 20% sobre o salário mínimo de cada competência (9 pontos percentuais para quem pagou 11%, 15 para quem pagou 5% e 8 para quem pagou 12%), com juros pela SELIC (taxa básica de juros) mais 1%, sem multa. Complementada, a competência passa a contar nas regras por tempo de contribuição e na contagem em regime próprio.", "fonte": "Lei 8.212/1991, art. 21, § 3º; Lei 9.430/1996, art. 5º, § 3º; IN 128/2022, art. 216, § 2º, e art. 514, I (red. IN 212/2026)", "origem": "cenarios-e-custos.md §4", "sinal": "controvertido"}, {"id": "apos-041", "tema": "Atraso, indenização e ajustes", "pergunta": "Uma contribuição abaixo do salário mínimo conta para alguma coisa?", "variantes": ["contribuição abaixo do mínimo", "salário menor que o mínimo", "trabalho intermitente e INSS", "recebi menos que o mínimo no mês"], "resposta": "Não. Desde novembro de 2019, a competência com contribuição abaixo do salário mínimo, sem ajuste, não conta para tempo de contribuição, carência nem cálculo do valor. Só passa a contar depois de ajustada.", "fonte": "CF, art. 195, § 14; EC 103/2019, art. 29; Dec. 3.048/1999, art. 19-E", "origem": "doutrina-previdenciaria.md §4; cenarios-e-custos.md §2", "sinal": "firme"}, {"id": "apos-042", "tema": "Atraso, indenização e ajustes", "pergunta": "Como ajusto uma contribuição que ficou abaixo do mínimo?", "variantes": ["complementação do artigo 29", "agrupar contribuições", "aproveitar sobra de outro mês", "ajuste de competência"], "resposta": "Há três formas: complementar a contribuição até o mínimo, usar o que sobrou acima do mínimo em outra competência ou agrupar competências baixas para formar contribuições mínimas. A emenda diz que esses ajustes só podem ser feitos ao longo do mesmo ano civil, e a compatibilidade desse prazo com a possibilidade de ajuste a qualquer tempo não está resolvida.", "fonte": "EC 103/2019, art. 29, I a III e parágrafo único", "origem": "cenarios-e-custos.md §4 e §6 (c.5); EC 103/2019 em 03_TESES/legislacao", "sinal": "controvertido"}, {"id": "apos-043", "tema": "Atraso, indenização e ajustes", "pergunta": "Quanto custa complementar uma competência abaixo do mínimo?", "variantes": ["valor da complementação", "quanto pago para completar o mínimo", "complementar como empregado"], "resposta": "A diferença entre o salário mínimo e a remuneração do mês, multiplicada pela alíquota da categoria: 20% para contribuinte individual; para empregado, 8% até fevereiro de 2020 e 7,5% depois. Após o vencimento há multa de mora e juros pela SELIC (taxa básica de juros) mais 1%. Essa complementação não é admitida para plano simplificado, MEI (microempreendedor individual), segurado especial e facultativo, e o ajuste feito é irreversível.", "fonte": "EC 103/2019, art. 29; Lei 8.212/1991, art. 35; Lei 9.430/1996, art. 61; IN 128/2022, art. 124, §§ 1º e 14", "origem": "cenarios-e-custos.md §4", "sinal": "firme"}, {"id": "apos-044", "tema": "Atraso, indenização e ajustes", "pergunta": "Posso pagar INSS atrasado?", "variantes": ["recolher em atraso", "pagar meses que fiquei sem contribuir", "pagar retroativo", "trabalhei como autônomo e não paguei"], "resposta": "Sim, se você exerceu atividade de contribuinte individual no período, com prova documental, e a competência ainda não decaiu (até 5 anos contados do primeiro dia do ano seguinte). Paga-se 20% da base com multa de mora e juros pela SELIC (taxa básica de juros) mais 1%, e o período passa a contar como tempo de contribuição.", "fonte": "Lei 8.212/1991, art. 35; Dec. 3.048/1999, arts. 216, § 12, e 348, I e § 1º; CTN, art. 173, I", "origem": "cenarios-e-custos.md §4; doutrina-previdenciaria.md §6", "sinal": "firme"}, {"id": "apos-045", "tema": "Atraso, indenização e ajustes", "pergunta": "Contribuição paga em atraso conta como carência?", "variantes": ["atrasado conta carência", "paguei atrasado e o INSS não contou", "carência de contribuição atrasada"], "resposta": "Para contribuinte individual e facultativo, a carência começa no primeiro pagamento feito em dia: atrasadas de competências anteriores a ele não contam, nem as pagas depois de perdida a qualidade de segurado. Pela letra da lei, contam as competências posteriores à primeira paga em dia, recolhidas sem perda da qualidade; a TNU (Turma Nacional de Uniformização), porém, afirma que carência depende de contribuição tempestiva, o que torna esse ponto discutível.", "fonte": "Lei 8.213/1991, art. 27, II; Dec. 3.048/1999, art. 28, II e § 4º; IN 128/2022, arts. 191, 192, § 3º, e 194, IV; TNU, Temas 192 e 358", "origem": "doutrina-previdenciaria.md §6 (atraso e indenização na carência); cenarios-e-custos.md §4", "sinal": "controvertido"}, {"id": "apos-046", "tema": "Atraso, indenização e ajustes", "pergunta": "Trabalhei por conta há mais de 5 anos e nunca paguei. Posso regularizar?", "variantes": ["indenização de período", "pagar tempo antigo", "período decadente", "indenizar tempo de autônomo"], "resposta": "Sim, por indenização, desde que comprovada a atividade. O valor é 20% da média dos 80% maiores salários de contribuição atualizados, com juros de 0,5% ao mês capitalizados ao ano, limitados a 50%, e multa de 10%. Depois de paga, conta como tempo de contribuição, mas em regra não conta como carência.", "fonte": "Lei 8.212/1991, art. 45-A, § 2º; Dec. 3.048/1999, arts. 122 e 239, §§ 8º e 8º-A; IN 128/2022, arts. 98, § 2º, 101 e 194, III", "origem": "cenarios-e-custos.md §4; doutrina-previdenciaria.md §6", "sinal": "firme"}, {"id": "apos-047", "tema": "Atraso, indenização e ajustes", "pergunta": "Qual a diferença entre pagar em atraso e indenizar?", "variantes": ["atraso ou indenização", "quando é indenização", "prazo de 5 anos do INSS"], "resposta": "O que separa um do outro é a decadência: competência de até 5 anos, contados do primeiro dia do ano seguinte, paga-se em atraso, com multa e juros; competência mais antiga só entra por indenização. O atraso pode contar para carência em certas condições; a indenização, em regra, conta só como tempo.", "fonte": "Dec. 3.048/1999, art. 348, I e § 1º; CTN, art. 173, I; Lei 8.212/1991, arts. 35 e 45-A", "origem": "doutrina-previdenciaria.md §6; cenarios-e-custos.md §4", "sinal": "controvertido"}, {"id": "apos-048", "tema": "Atraso, indenização e ajustes", "pergunta": "Tenho tempo de roça de antes de ser obrigado a contribuir. Pago multa para indenizar?", "variantes": ["indenizar tempo rural", "multa na indenização do rural", "tempo de lavoura antigo"], "resposta": "Não. A multa de 10% da indenização não se aplica ao tempo rural do empregado rural ou do segurado especial anterior à obrigatoriedade de filiação, inclusive para levar esse tempo a regime próprio. Os juros continuam devidos.", "fonte": "Lei 8.212/1991, art. 45-A, § 4º, e Lei 8.213/1991, art. 96, § 2º (incluídos pela Lei 15.363/2026)", "origem": "cenarios-e-custos.md §4; legislacao-pos-2019.md §3 (Lei 15.363/2026)", "sinal": "firme"}, {"id": "apos-049", "tema": "CNIS e contagem de tempo", "pergunta": "O que é o CNIS e ele vale como prova?", "variantes": ["extrato do INSS", "CNIS vale como prova", "meu histórico no INSS", "extrato previdenciário"], "resposta": "O CNIS (Cadastro Nacional de Informações Sociais) vale como prova de filiação, tempo de contribuição e salários. O segurado pode pedir inclusão, exclusão ou correção de dados a qualquer tempo; informação lançada fora de época só é aceita se confirmada por documento.", "fonte": "Lei 8.213/1991, art. 29-A, caput e § 2º; Dec. 3.048/1999, art. 19, § 2º", "origem": "doutrina-previdenciaria.md §6 (prova do tempo)", "sinal": "firme"}, {"id": "apos-050", "tema": "CNIS e contagem de tempo", "pergunta": "Um emprego meu não aparece no CNIS. E agora?", "variantes": ["vínculo faltando no CNIS", "carteira assinada que não aparece", "como incluir tempo no CNIS", "posso provar com testemunha"], "resposta": "Pede-se a inclusão com documento. Tempo de serviço só se prova com início de prova material da época, e testemunha sozinha não basta, salvo força maior ou caso fortuito. A justificação administrativa admite de 2 a 6 testemunhas para completar a prova material.", "fonte": "Lei 8.213/1991, arts. 29-A e 55, § 3º; Dec. 3.048/1999, arts. 142 a 151", "origem": "doutrina-previdenciaria.md §6 (prova do tempo)", "sinal": "firme"}, {"id": "apos-051", "tema": "CNIS e contagem de tempo", "pergunta": "Ganhei uma ação trabalhista reconhecendo o vínculo. O INSS conta esse tempo?", "variantes": ["sentença trabalhista conta no INSS", "acordo trabalhista e tempo de contribuição", "reconhecimento de vínculo na Justiça do Trabalho"], "resposta": "Só se houver início de prova material da época. Sentença trabalhista, sobretudo a homologatória de acordo sem prova material, não basta sozinha para o INSS (Instituto Nacional do Seguro Social) incluir o vínculo no CNIS (Cadastro Nacional de Informações Sociais).", "fonte": "Dec. 3.048/1999, art. 144, parágrafo único", "origem": "doutrina-previdenciaria.md §6 (prova do tempo)", "sinal": "firme"}, {"id": "apos-052", "tema": "CNIS e contagem de tempo", "pergunta": "Trabalhei no serviço público. Posso usar esse tempo no INSS?", "variantes": ["contagem recíproca", "tempo de servidor no INSS", "averbar tempo público", "fui concursado e saí"], "resposta": "Sim, pela contagem recíproca, com compensação entre os regimes. O tempo vem por CTC (Certidão de Tempo de Contribuição) emitida pelo regime próprio, com o período de data a data, o tempo líquido e a homologação da unidade gestora; o regime próprio só emite CTC para ex-servidor.", "fonte": "Lei 8.213/1991, arts. 94 e 96, VI; Dec. 3.048/1999, art. 130", "origem": "haack-prev-planejamento SKILL.md §3; cenarios-e-custos.md §1; Lei 8.213/1991 compilada, arts. 94 e 96", "sinal": "firme"}, {"id": "apos-053", "tema": "CNIS e contagem de tempo", "pergunta": "Posso usar o mesmo tempo no INSS e no regime de servidor?", "variantes": ["contar tempo duas vezes", "tempo concomitante público e privado", "aposentadoria nos dois regimes com o mesmo tempo"], "resposta": "Não. Tempo já usado para aposentadoria em um regime não conta no outro, tempo público e privado no mesmo período não se somam, e não existe contagem em dobro.", "fonte": "Lei 8.213/1991, art. 96, I a III", "origem": "Lei 8.213/1991 compilada, art. 96 (03_TESES/legislacao)", "sinal": "firme"}, {"id": "apos-054", "tema": "CNIS e contagem de tempo", "pergunta": "Virei servidor público. Posso levar meu tempo do INSS?", "variantes": ["CTC do INSS", "levar tempo do INSS para prefeitura", "certidão de tempo para regime próprio"], "resposta": "Sim, por CTC (Certidão de Tempo de Contribuição), obrigatória para o regime próprio contar o tempo. A CTC exige contribuição efetiva, salvo para empregado, doméstico, avulso e, desde 01/04/2003, contribuinte individual que presta serviço a empresa. Períodos pagos com 11% ou 5% só entram se complementados até 20%.", "fonte": "Lei 8.213/1991, arts. 94, § 2º, e 96, V e VII; IN 128/2022, art. 216, § 2º (red. IN 212/2026)", "origem": "Lei 8.213/1991 compilada, arts. 94 e 96; cenarios-e-custos.md §2", "sinal": "firme"}, {"id": "apos-055", "tema": "CNIS e contagem de tempo", "pergunta": "Trabalhei em lugar insalubre. Esse tempo pode virar tempo comum maior?", "variantes": ["converter tempo especial", "conversão de insalubridade", "tempo especial aumenta o tempo comum", "fator 1,4"], "resposta": "Sim, mas só para trabalho prestado até 13/11/2019. Na atividade de 25 anos, o fator é 1,40 (homem) e 1,20 (mulher); na de 20 anos, 1,75 e 1,50; na de 15 anos, 2,33 e 2,00. O trabalho especial depois de 13/11/2019 não se converte.", "fonte": "EC 103/2019, art. 25, § 2º; Dec. 3.048/1999, art. 188-P, § 5º", "origem": "doutrina-previdenciaria.md §5", "sinal": "firme"}, {"id": "apos-056", "tema": "Cálculo do valor", "pergunta": "Como é calculado o valor da aposentadoria?", "variantes": ["como calcula a aposentadoria", "quanto vou receber", "cálculo da RMI", "60% mais 2%"], "resposta": "Faz-se a média de todos os salários de contribuição desde julho de 1994 (ou desde o início, se posterior), corrigidos pelo INPC (Índice Nacional de Preços ao Consumidor) e limitados ao teto. O valor é 60% dessa média mais 2 pontos percentuais por ano de contribuição acima de 20 anos (homem) ou 15 anos (mulher). Exceções: o pedágio de 100% paga 100% da média, e o de 50% paga a média multiplicada pelo fator previdenciário.", "fonte": "EC 103/2019, art. 26, caput e §§ 1º, 2º, 3º e 5º; Lei 8.213/1991, art. 29-B", "origem": "doutrina-previdenciaria.md §4", "sinal": "firme"}, {"id": "apos-057", "tema": "Cálculo do valor", "pergunta": "Com quanto tempo de contribuição eu recebo 100% da média?", "variantes": ["aposentadoria integral", "quantos anos para ganhar 100%", "40 anos de contribuição homem", "35 anos de contribuição mulher"], "resposta": "Na regra de 60% mais 2 pontos percentuais por ano, chega-se a 100% com 40 anos de contribuição (homem) ou 35 anos (mulher). Pelo pedágio de 100%, o valor é 100% da média independentemente desse acréscimo.", "fonte": "EC 103/2019, art. 26, §§ 2º, 3º, I, e 5º", "origem": "doutrina-previdenciaria.md §4", "sinal": "firme"}, {"id": "apos-058", "tema": "Cálculo do valor", "pergunta": "As contribuições de antes de 1994 entram no cálculo?", "variantes": ["revisão da vida toda", "salários antigos entram na média", "contribuições anteriores ao Plano Real"], "resposta": "Não. A média usa só os salários desde julho de 1994. A chamada revisão da vida toda foi superada pelo STF (Supremo Tribunal Federal) no Tema 1.102, e esse tempo anterior conta como tempo de contribuição, mas não entra na média.", "fonte": "EC 103/2019, art. 26; Lei 9.876/1999, art. 3º; STF, Tema 1.102", "origem": "doutrina-previdenciaria.md §1 e §4; haack-prev-planejamento SKILL.md §4, Etapa C", "sinal": "firme"}, {"id": "apos-059", "tema": "Cálculo do valor", "pergunta": "Tenho contribuições baixas que puxam a média para baixo. Dá para tirar?", "variantes": ["descartar contribuições", "excluir salários baixos da média", "melhorar a média"], "resposta": "Sim. Podem ser excluídas da média as contribuições que a reduzam, desde que se mantenha o tempo mínimo exigido. O tempo excluído deixa de valer para tudo, inclusive para o acréscimo de 2 pontos percentuais por ano.", "fonte": "EC 103/2019, art. 26, § 6º", "origem": "doutrina-previdenciaria.md §4", "sinal": "firme"}, {"id": "apos-061", "tema": "Cálculo do valor", "pergunta": "Qual é o valor mínimo e o máximo da aposentadoria?", "variantes": ["teto do INSS", "piso da aposentadoria", "aposentadoria menor que o salário mínimo", "quanto é o teto em 2026"], "resposta": "Nenhuma aposentadoria fica abaixo do salário mínimo nem acima do teto. Em 2026, o salário mínimo é R$ 1.621,00 e o teto é R$ 8.475,55.", "fonte": "Lei 8.213/1991, art. 29, § 2º; Decreto 12.797/2025, art. 1º; Portaria Interministerial MPS/MF 13/2026, art. 2º", "origem": "doutrina-previdenciaria.md §3 e §4; teto_rgps.json", "sinal": "firme"}, {"id": "apos-062", "tema": "Cálculo do valor", "pergunta": "Se eu contribuir sempre pelo teto, vou receber o teto?", "variantes": ["contribuir no teto garante o teto", "pagar no máximo para receber o máximo", "aposentadoria no teto"], "resposta": "Não necessariamente. Contribuir pelo teto leva a média ao teto, mas o valor é o percentual da regra aplicado sobre essa média: 60% mais 2 pontos percentuais por ano acima de 20 anos (homem) ou 15 anos (mulher), salvo o pedágio de 100%, que paga 100% da média.", "fonte": "EC 103/2019, art. 26, §§ 1º, 2º, 3º e 5º", "origem": "doutrina-previdenciaria.md §4", "sinal": "firme"}, {"id": "apos-063", "tema": "Cálculo do valor", "pergunta": "O que é o fator previdenciário?", "variantes": ["fator previdenciário", "redutor da aposentadoria", "expectativa de vida reduz aposentadoria"], "resposta": "É um multiplicador aplicado sobre a média, calculado com a idade, o tempo de contribuição e a expectativa de sobrevida da tábua do IBGE (Instituto Brasileiro de Geografia e Estatística) publicada até a data do requerimento. Hoje incide no pedágio de 50%, onde é obrigatório, e na aposentadoria por tempo do direito adquirido, salvo, só nesta última, quando alcançados os pontos 85/95 ou, desde 31/12/2018, 86/96. O STF (Supremo Tribunal Federal) o declarou constitucional.", "fonte": "Lei 8.213/1991, art. 29, §§ 7º a 9º; Dec. 3.048/1999, art. 188-E, § 4º; EC 103/2019, art. 17, parágrafo único; STF, Tema 1.091", "origem": "cenarios-e-custos.md §2; doutrina-previdenciaria.md §3 e §4", "sinal": "firme"}, {"id": "apos-064", "tema": "Cálculo do valor", "pergunta": "Como era calculada a média antes da reforma?", "variantes": ["80% maiores salários", "cálculo antigo", "média antes de 2019"], "resposta": "Pela média dos 80% maiores salários de contribuição desde julho de 1994, corrigidos pelo INPC (Índice Nacional de Preços ao Consumidor), com divisor mínimo de 60% do período nas aposentadorias. Esse cálculo vale para quem tem direito adquirido até 13/11/2019; depois disso, a média usa 100% dos salários.", "fonte": "Lei 8.213/1991, arts. 29, I e II, e 29-B; Lei 9.876/1999, art. 3º, § 2º; EC 103/2019, arts. 3º e 26", "origem": "doutrina-previdenciaria.md §3 e §4", "sinal": "firme"}, {"id": "apos-065", "tema": "Cálculo do valor", "pergunta": "Tenho dois empregos. As duas contribuições somam na aposentadoria?", "variantes": ["atividades concomitantes", "dois vínculos ao mesmo tempo", "trabalho em dois lugares"], "resposta": "Sim. Desde a Lei 9.876/1999, o salário de contribuição de atividades simultâneas é a soma do que foi recolhido em todas elas, respeitado o teto.", "fonte": "Lei 8.213/1991, art. 32; STJ, Tema 1.070", "origem": "doutrina-previdenciaria.md §4", "sinal": "firme"}, {"id": "apos-066", "tema": "Cálculo do valor", "pergunta": "A aposentadoria é reajustada todo ano?", "variantes": ["reajuste da aposentadoria", "aumento do INSS em 2026", "correção anual do benefício"], "resposta": "Sim. Em 2026, os benefícios com início antes de 2025 foram reajustados em 3,90%; os iniciados ao longo de 2025 tiveram percentual proporcional ao mês de início, pela tabela da portaria. Quem recebe o salário mínimo acompanha o valor do mínimo, R$ 1.621,00 em 2026.", "fonte": "Portaria Interministerial MPS/MF 13/2026, art. 1º e Anexo I; Decreto 12.797/2025, art. 1º", "origem": "doutrina-previdenciaria.md §4 (valores de 2026)", "sinal": "firme"}, {"id": "apos-067", "tema": "Pedido ao INSS", "pergunta": "Quando pedi ainda faltava tempo. Posso aproveitar o tempo que trabalhei depois?", "variantes": ["reafirmação da DER", "completei o tempo depois do pedido", "faltavam meses quando pedi", "contar tempo durante o processo"], "resposta": "Sim, pela reafirmação da DER (data de entrada do requerimento): a data do pedido pode ser levada ao momento em que os requisitos foram cumpridos, inclusive durante o processo judicial até as instâncias ordinárias, observada a causa de pedir.", "fonte": "STJ, Tema 995", "origem": "doutrina-previdenciaria.md §3-A", "sinal": "firme"}, {"id": "apos-068", "tema": "Pedido ao INSS", "pergunta": "Posso entrar direto na Justiça sem pedir no INSS?", "variantes": ["preciso pedir no INSS antes", "processar o INSS sem requerimento", "requerimento administrativo obrigatório"], "resposta": "Em regra, não. Sem requerimento prévio no INSS (Instituto Nacional do Seguro Social), falta interesse para a ação, salvo as exceções da tese do STF (Supremo Tribunal Federal). O requerimento sem a documentação mínima também afasta o interesse, segundo tese do STJ (Superior Tribunal de Justiça) ainda sem trânsito em julgado.", "fonte": "STF, Tema 350; STJ, Tema 1.124", "origem": "haack-prev-padrao SKILL.md §3 (trava 3)", "sinal": "controvertido"}, {"id": "apos-069", "tema": "Pedido ao INSS", "pergunta": "Depois de concedida, em quanto tempo sai o primeiro pagamento?", "variantes": ["quando cai o primeiro pagamento", "prazo do INSS para pagar", "demora para receber depois de aprovado"], "resposta": "O primeiro pagamento deve ocorrer em até 45 dias da apresentação da documentação necessária.", "fonte": "Lei 8.213/1991, art. 41-A, § 5º", "origem": "doutrina-previdenciaria.md §3-A", "sinal": "firme"}, {"id": "apos-070", "tema": "Pedido ao INSS", "pergunta": "Depois de aposentado, posso trocar por uma regra melhor?", "variantes": ["trocar de aposentadoria", "desaposentação", "reaposentação", "me arrependi da regra escolhida"], "resposta": "Não. Depois de concedida, não se troca de aposentadoria, e a escolha se torna definitiva após o primeiro pagamento. Desaposentação e reaposentação não são admitidas pelo STF (Supremo Tribunal Federal).", "fonte": "STF, Tema 503; Dec. 3.048/1999, art. 181-B", "origem": "haack-prev-planejamento SKILL.md §4, Etapa C, e §8; doutrina-previdenciaria.md §3-A", "sinal": "firme"}, {"id": "apos-071", "tema": "Depois de aposentado e planejamento", "pergunta": "Posso continuar trabalhando depois de aposentado?", "variantes": ["trabalhar aposentado", "aposentado com carteira assinada", "aposentado precisa contribuir", "voltar a trabalhar depois de aposentar"], "resposta": "Sim. O aposentado que trabalha continua segurado obrigatório e contribui normalmente, mas essas contribuições não dão direito a nova prestação, exceto salário-família e reabilitação profissional, quando empregado. Na aposentadoria especial a regra é outra: voltar à atividade nociva faz cessar o pagamento.", "fonte": "Lei 8.212/1991, art. 12, § 4º; Lei 8.213/1991, arts. 18, § 2º, e 57, § 8º; STF, Tema 709", "origem": "cenarios-e-custos.md §7; Lei 8.213/1991 e Lei 8.212/1991 compiladas", "sinal": "firme"}, {"id": "apos-072", "tema": "Depois de aposentado e planejamento", "pergunta": "As contribuições depois de aposentado aumentam minha aposentadoria?", "variantes": ["contribuir aposentado aumenta o valor", "revisão pelas contribuições novas", "aposentado paga INSS à toa"], "resposta": "Não. Elas são obrigatórias para custeio da seguridade e não geram aumento nem nova aposentadoria; também não se pode trocar a aposentadoria por outra mais vantajosa.", "fonte": "Lei 8.212/1991, art. 12, § 4º; Lei 8.213/1991, art. 18, § 2º; STF, Tema 503", "origem": "cenarios-e-custos.md §7; haack-prev-planejamento SKILL.md §4, Etapa C", "sinal": "firme"}, {"id": "apos-073", "tema": "Depois de aposentado e planejamento", "pergunta": "Posso receber duas aposentadorias do INSS?", "variantes": ["duas aposentadorias", "acumular aposentadoria no INSS", "aposentadoria dupla"], "resposta": "Não. É vedado receber mais de uma aposentadoria do regime geral ao mesmo tempo, salvo direito adquirido.", "fonte": "Lei 8.213/1991, art. 124, II", "origem": "Lei 8.213/1991 compilada, art. 124 (03_TESES/legislacao)", "sinal": "firme"}, {"id": "apos-074", "tema": "Depois de aposentado e planejamento", "pergunta": "Aposentado recebe 13º?", "variantes": ["décimo terceiro do aposentado", "abono anual", "13º do INSS"], "resposta": "Sim. Quem recebeu aposentadoria durante o ano tem direito ao abono anual, calculado como a gratificação de Natal dos trabalhadores, tendo por base o valor do benefício de dezembro.", "fonte": "Lei 8.213/1991, art. 40 e parágrafo único", "origem": "Lei 8.213/1991 compilada, art. 40 (03_TESES/legislacao)", "sinal": "firme"}, {"id": "apos-075", "tema": "Depois de aposentado e planejamento", "pergunta": "Se eu parar de contribuir agora, ainda me aposento?", "variantes": ["parar de pagar o INSS", "vale a pena parar de contribuir", "já tenho o tempo mínimo, posso parar"], "resposta": "Sim, se já tiver a carência e o tempo mínimo de contribuição da regra e só faltar idade: a perda da qualidade de segurado não impede a aposentadoria por idade, por tempo ou especial. Mas o tempo deixa de crescer, o que reduz o percentual, e depois do período de graça você fica sem cobertura por incapacidade e sem pensão para os dependentes.", "fonte": "Lei 10.666/2003, art. 3º; Lei 8.213/1991, art. 15; EC 103/2019, art. 26, § 2º", "origem": "haack-prev-planejamento SKILL.md §4, Etapa C; doutrina-previdenciaria.md §6", "sinal": "firme"}, {"id": "apos-076", "tema": "Depois de aposentado e planejamento", "pergunta": "Vale a pena contribuir sobre um valor maior?", "variantes": ["aumentar a contribuição", "pagar mais INSS vale a pena", "contribuir acima do mínimo", "custo e retorno da contribuição"], "resposta": "Contribuir sobre base maior eleva a média de todos os salários desde julho de 1994, até o teto, e com ela o valor da aposentadoria. Se compensa é conta caso a caso: compara-se o custo adicional com o ganho mensal de renda e o tempo para recuperar o que foi pago, sem inflação nem imposto de renda.", "fonte": "EC 103/2019, art. 26, caput e § 1º; Lei 8.212/1991, art. 21", "origem": "cenarios-e-custos.md §1 e §5 (H.6); haack-prev-planejamento SKILL.md §4, Etapa B", "sinal": "firme"}, {"id": "apos-077", "tema": "Depois de aposentado e planejamento", "pergunta": "É melhor contribuir com 11% ou com 20%?", "variantes": ["11 ou 20 por cento", "qual alíquota escolher", "plano simplificado ou normal"], "resposta": "O 11% sobre o salário mínimo basta para a aposentadoria programada e por idade, com média no mínimo. O 20% é necessário para usar as regras por tempo de contribuição (pontos, idade progressiva, pedágios) ou levar o tempo a regime próprio, e permite contribuir sobre valor maior. Quem pagou 11% pode complementar depois, com juros.", "fonte": "Lei 8.213/1991, art. 18, § 3º; Lei 8.212/1991, art. 21, caput, §§ 2º e 3º; IN 128/2022, art. 216, §§ 1º e 2º (red. IN 212/2026)", "origem": "cenarios-e-custos.md §2, §3 e §4", "sinal": "firme"}, {"id": "apos-078", "tema": "Depois de aposentado e planejamento", "pergunta": "Tenho aposentadoria especial. Posso continuar no mesmo trabalho insalubre?", "variantes": ["aposentado especial continuar exposto", "voltar à atividade insalubre", "Tema 709"], "resposta": "Não sem perder o benefício. É constitucional vedar a aposentadoria especial a quem permanece ou volta à atividade nociva: implantado o benefício, a continuidade ou o retorno faz cessar o pagamento. A data de início do benefício é a data do pedido, com efeitos financeiros desde ela. Para profissionais de saúde houve suspensão ligada à pandemia, cujo alcance atual não está confirmado e deve ser conferido.", "fonte": "Lei 8.213/1991, art. 57, § 8º; STF, Tema 709 (ED de 24/02/2021)", "origem": "doutrina-previdenciaria.md §3-A e §5; cenarios-e-custos.md §7", "sinal": "firme"}, {"id": "esp-001", "tema": "Tempo especial: conceito e prova", "pergunta": "O que é tempo especial?", "variantes": ["o que é atividade especial", "trabalho insalubre conta diferente?", "o que é aposentadoria especial", "trabalho perigoso conta mais?"], "resposta": "É o período trabalhado com exposição a agente nocivo à saúde ou à integridade física, de forma permanente, não ocasional nem intermitente. Dá direito à aposentadoria especial com 15, 20 ou 25 anos de exposição, conforme o agente. A caracterização e a prova seguem a lei da época em que o trabalho foi prestado.", "fonte": "Lei 8.213/1991, art. 57, caput e § 3º; Dec. 3.048/1999, art. 188-P, § 6º", "origem": "doutrina-previdenciaria.md §5 (Base legal)", "sinal": "firme"}, {"id": "esp-002", "tema": "Tempo especial: conceito e prova", "pergunta": "Que documento prova o tempo especial?", "variantes": ["como provo que trabalhei em lugar insalubre", "o que o INSS pede para tempo especial", "precisa de laudo?", "qual papel serve para especial"], "resposta": "Depende do período: até 28/04/1995, a categoria profissional pela CTPS (Carteira de Trabalho e Previdência Social) ou formulário, com laudo se for ruído; de 29/04/1995 a 13/10/1996, formulário ou PPP (Perfil Profissiográfico Previdenciário); de 14/10/1996 a 31/12/2003, formulário com LTCAT (laudo técnico das condições ambientais do trabalho) ou PPP; a partir de 01/01/2004, o PPP.", "fonte": "IN 128/2022, art. 274 (red. IN 170/2024)", "origem": "doutrina-previdenciaria.md §5 (Prova por período)", "sinal": "firme"}, {"id": "esp-003", "tema": "Tempo especial: conceito e prova", "pergunta": "O que é o PPP e quem tem que me dar?", "variantes": ["o que é perfil profissiográfico", "a empresa é obrigada a dar o PPP?", "onde consigo o PPP", "PPP está errado, dá para corrigir?"], "resposta": "O PPP (Perfil Profissiográfico Previdenciário) é o formulário emitido pela empresa, com base no LTCAT (laudo técnico das condições ambientais do trabalho), que descreve função, setor e agentes nocivos por período. O trabalhador pode pedir à empresa a retificação do PPP quando ele estiver errado.", "fonte": "Lei 8.213/1991, art. 58, §§ 1º e 4º; Dec. 3.048/1999, art. 68, § 10", "origem": "doutrina-previdenciaria.md §5 (Base legal)", "sinal": "firme"}, {"id": "esp-004", "tema": "Tempo especial: conceito e prova", "pergunta": "Só a profissão anotada na carteira já conta como especial?", "variantes": ["enquadramento por categoria", "minha profissão era insalubre, basta a carteira?", "profissão especial antes de 1995", "categoria profissional conta?"], "resposta": "Sim, só até 28/04/1995 e quando a profissão estiver nos quadros dos decretos da época, provada pela CTPS (Carteira de Trabalho e Previdência Social). A partir de 29/04/1995 é preciso provar a exposição ao agente nocivo. Profissão que não consta dos quadros só se enquadra por analogia justificada.", "fonte": "Lei 9.032/1995; IN 128/2022, art. 269, § 1º; TNU Tema 198", "origem": "doutrina-previdenciaria.md §1 e §5 (Categoria e rol)", "sinal": "firme"}, {"id": "esp-005", "tema": "Tempo especial: conceito e prova", "pergunta": "Precisa ter ficado exposto o dia inteiro?", "variantes": ["exposição só em parte do dia conta?", "não era o tempo todo, perco?", "habitual e permanente", "exposição intermitente"], "resposta": "Até 28/04/1995, não: a exposição não precisava ser permanente. Desde 29/04/1995 a lei exige exposição permanente, não ocasional nem intermitente; para agente biológico e eletricidade, avalia-se pela descrição da função se a exposição é inseparável do serviço, sem tempo mínimo na jornada.", "fonte": "TNU Súm. 49; Lei 8.213/1991, art. 57, § 3º; TNU Temas 211 e 210", "origem": "doutrina-previdenciaria.md §5 (Habitualidade e permanência); catalogo-temas-vinculantes.md §3 e §4", "sinal": "firme"}, {"id": "esp-006", "tema": "Tempo especial: conceito e prova", "pergunta": "O que eu preciso trazer para provar tempo especial?", "variantes": ["documentos para aposentadoria especial", "lista de documentos tempo especial", "o que levar na consulta sobre insalubridade"], "resposta": "PPP (Perfil Profissiográfico Previdenciário) de cada empresa, com responsável técnico pelos registros ambientais desde 14/10/1996; LTCAT (laudo técnico das condições ambientais do trabalho) quando o PPP for omisso; CTPS (Carteira de Trabalho e Previdência Social) para a categoria até 28/04/1995; e os formulários antigos emitidos até 31/12/2003, se existirem.", "fonte": "IN 128/2022, arts. 272, 274 e 281, § 4º-A; TNU Temas 208 e 14", "origem": "gerente-previdenciario/SKILL.md, Etapa 1 (Caso de saúde: prova a pedir)", "sinal": "firme"}, {"id": "esp-007", "tema": "Tempo especial: conceito e prova", "pergunta": "Férias e licença-maternidade contam como tempo especial?", "variantes": ["férias quebram o tempo especial?", "salário-maternidade conta como especial", "descanso conta como insalubre"], "resposta": "Sim. Férias, descansos da legislação trabalhista e salário-maternidade não descaracterizam o tempo especial, desde que, na data do afastamento, a pessoa estivesse exposta ao agente nocivo.", "fonte": "IN 128/2022, art. 271, caput (não alterado pelas alteradoras); Dec. 3.048/1999, art. 65, parágrafo único (red. Dec. 10.410/2020)", "origem": "03_TESES/legislacao/leis/IN-128-2022-PRES-INSS_procedimentos-RGPS_DOU-original.txt, art. 271; _CONTINUIDADE/_artefatos/prev-lacunas/INSUMO_pesquisa-14_in128-alteradoras-ristf_2026-11-03.md, 1.b (art. 271 fora de todas as alteradoras); 03_TESES/legislacao/leis/Decreto-3048-1999_regulamento-da-previdencia-social_planalto.txt, art. 65", "sinal": "firme"}, {"id": "esp-008", "tema": "Agentes nocivos", "pergunta": "Qual o limite de ruído para contar como especial?", "variantes": ["quantos decibéis precisa", "barulho conta como especial?", "limite de ruído por época", "85 decibéis ou 90?"], "resposta": "Acima de 80 decibéis até 05/03/1997; acima de 90 decibéis de 06/03/1997 a 18/11/2003; acima de 85 decibéis a partir de 19/11/2003 (Decreto 4.882/2003). O limite de 85 não retroage ao período de 1997 a 2003.", "fonte": "IN 128/2022, art. 292, I a III (red. IN 170/2024); STJ Tema 694; TNU Tema 174", "origem": "_CONTINUIDADE/_artefatos/prev-lacunas/fontes/INSUMO_dou-in170-2024.html, art. 292 (nova redação); IN-128-2022 (03_TESES/legislacao/leis), art. 292; doutrina-previdenciaria.md §5 (ADVERSO ruído); catalogo-temas-vinculantes.md §7", "sinal": "firme"}, {"id": "esp-009", "tema": "Agentes nocivos", "pergunta": "Meu PPP só fala em dose de ruído, serve?", "variantes": ["PPP com dosimetria vale?", "PPP não diz a técnica de medição", "NHO-01 no PPP", "como o ruído tem que estar medido"], "resposta": "Não basta: desde 19/11/2003 o PPP (Perfil Profissiográfico Previdenciário) precisa indicar a técnica, NHO-01 (Norma de Higiene Ocupacional nº 01 da Fundacentro) ou NR-15 (Norma Regulamentadora nº 15), e a simples menção a dose ou dosimetria é insuficiente. Se o PPP for omisso, a falta se supre pelo LTCAT (laudo técnico das condições ambientais do trabalho).", "fonte": "TNU Temas 174 e 317", "origem": "doutrina-previdenciaria.md §5 (NEUTRO e ADVERSO ruído); catalogo-temas-vinculantes.md §4", "sinal": "firme"}, {"id": "esp-010", "tema": "Agentes nocivos", "pergunta": "O barulho variava durante o dia; como fica?", "variantes": ["ruído variável", "ruído não era constante", "pico de ruído conta?", "nível de ruído mudava"], "resposta": "Mede-se pelo NEN (Nível de Exposição Normalizado). Sem essa informação, vale o pico de ruído, desde que perícia técnica judicial comprove a habitualidade e a permanência da exposição.", "fonte": "STJ Tema 1083", "origem": "catalogo-temas-vinculantes.md §7 (STJ Tema 1083); doutrina-previdenciaria.md §5", "sinal": "firme"}, {"id": "esp-011", "tema": "Agentes nocivos", "pergunta": "Para ruído antigo basta a carteira de trabalho?", "variantes": ["ruído antes de 1995 precisa laudo?", "formulário antigo de ruído vale sozinho?", "barulho na década de 80"], "resposta": "Não. Ruído sempre exigiu laudo, inclusive antes de 28/04/1995, e os formulários antigos emitidos até 31/12/2003 só valem para ruído acompanhados do laudo técnico que os embasou.", "fonte": "IN 128/2022, art. 274", "origem": "doutrina-previdenciaria.md §5 (Prova por período); IN-128-2022 (03_TESES/legislacao/leis), art. 274", "sinal": "firme"}, {"id": "esp-012", "tema": "Agentes nocivos", "pergunta": "Trabalho com óleo, graxa e solvente conta como especial?", "variantes": ["hidrocarboneto é especial?", "agente químico conta?", "mexia com diesel e graxa", "produto químico dá aposentadoria especial?"], "resposta": "Pode contar, desde que comprovada a exposição: a manipulação de óleos e graxas configura atividade especial, com tempo de 25 anos. A partir do Decreto 2.172/1997, porém, o PPP (Perfil Profissiográfico Previdenciário) que só diz hidrocarbonetos ou óleos e graxas, sem especificar o agente, não basta.", "fonte": "TNU Temas 53 e 298; Dec. 3.048/1999, Anexo IV, 1.0.7", "origem": "doutrina-previdenciaria.md §5 (Agentes químicos e hidrocarbonetos)", "sinal": "firme"}, {"id": "esp-013", "tema": "Agentes nocivos", "pergunta": "Mecânico conta como especial só pela profissão?", "variantes": ["mecânico tem aposentadoria especial?", "oficina mecânica é insalubre?", "mecânico de motor diesel"], "resposta": "Não. Nenhum código de categoria dos decretos antigos nomeia o mecânico, e antes de 29/04/1995 só se enquadra por analogia justificada ou se a função exercida estiver no código 2.5.1 do Decreto 83.080/1979. A especialidade depende de provar a exposição a agentes químicos, como óleos minerais e solventes especificados no PPP (Perfil Profissiográfico Previdenciário) e no LTCAT (laudo técnico das condições ambientais do trabalho).", "fonte": "Decs. 53.831/1964 e 83.080/1979; TNU Temas 198 e 298", "origem": "doutrina-previdenciaria.md §5 (Agentes químicos, Categoria e Prova)", "sinal": "firme"}, {"id": "esp-014", "tema": "Agentes nocivos", "pergunta": "Se havia benzeno no ambiente, basta para ser especial?", "variantes": ["agente cancerígeno conta?", "benzeno dá especial?", "substância cancerígena no trabalho", "LINACH"], "resposta": "Para cancerígeno do Grupo 1 da LINACH (Lista Nacional de Agentes Cancerígenos para Humanos) com registro, como o benzeno, a presença provada no ambiente basta, sem medição de quantidade e sem descaracterização por EPI (equipamento de proteção individual). Para períodos a partir de 01/07/2020, o regulamento admite descaracterizar por medidas de controle que eliminem a nocividade, e não há tese judicial sobre essa redação.", "fonte": "Dec. 3.048/1999, art. 68, § 4º (red. Dec. 8.123/2013 e Dec. 10.410/2020); TNU Tema 170; IN 128/2022, art. 298", "origem": "doutrina-previdenciaria.md §5 (Cancerígeno e LINACH)", "sinal": "controvertido"}, {"id": "esp-015", "tema": "Agentes nocivos", "pergunta": "Eletricista tem tempo especial?", "variantes": ["eletricidade conta como especial?", "trabalho com alta tensão", "risco de choque elétrico", "eletricidade depois de 1997"], "resposta": "Sim, a exposição à eletricidade pode ser reconhecida como especial mesmo depois do Decreto 2.172/1997, porque a lista de agentes é exemplificativa, desde que a exposição seja permanente. Para tensão acima de 250 volts, avalia-se pela descrição da função se o risco é inseparável do serviço, sem tempo mínimo na jornada.", "fonte": "STJ Tema 534; TNU Tema 210", "origem": "doutrina-previdenciaria.md §5 (FAVORÁVEL); catalogo-temas-vinculantes.md §2, §4 e §7", "sinal": "firme"}, {"id": "esp-016", "tema": "Agentes nocivos", "pergunta": "Vigilante tem tempo especial?", "variantes": ["segurança armado é especial?", "vigilante com arma de fogo", "vigia conta como insalubre?", "aposentadoria especial de vigilante"], "resposta": "Não. O Supremo Tribunal Federal fixou que a atividade de vigilante, com ou sem arma de fogo, não se caracteriza como especial. Os segundos embargos de declaração, com possível modulação, foram a julgamento até 09/10/2026, e o resultado se confere no portal do Supremo antes de analisar o caso; a tese contrária do Superior Tribunal de Justiça está sobrestada e não serve de fundamento.", "fonte": "STF Tema 1209 (RE 1.368.225); STJ Tema 1031", "origem": "doutrina-previdenciaria.md §5 (ADVERSO Tema 1.209); catalogo-temas-vinculantes.md §1 e §6", "sinal": "controvertido"}, {"id": "esp-017", "tema": "Agentes nocivos", "pergunta": "Meu agente nocivo não está na lista do decreto; perco?", "variantes": ["agente fora da lista conta?", "o rol de agentes é fechado?", "atividade não prevista no decreto"], "resposta": "Não necessariamente: no Judiciário a lista de agentes nocivos é exemplificativa, desde que o trabalho seja permanente e a nocividade comprovada tecnicamente. Na via administrativa, o INSS (Instituto Nacional do Seguro Social) trata a lista como fechada.", "fonte": "STJ Tema 534; TNU Tema 205; IN 128/2022, arts. 287, §§ 3º e 4º, e 299, II", "origem": "doutrina-previdenciaria.md §5 (FAVORÁVEL, Categoria e rol, ADVERSO biológicos)", "sinal": "firme"}, {"id": "esp-018", "tema": "EPI e PPP", "pergunta": "Usei EPI; perco o tempo especial?", "variantes": ["equipamento de proteção tira o direito?", "PPP diz que EPI era eficaz", "usava luva e máscara, conta?", "EPI eficaz"], "resposta": "Antes de 03/12/1998 o EPI (equipamento de proteção individual) não importa. A partir daí, EPI realmente capaz de neutralizar o agente afasta a especialidade, e o EPI declarado eficaz no PPP (Perfil Profissiográfico Previdenciário) pesa contra o trabalhador, que pode impugnar especificamente a eficácia; havendo dúvida razoável, reconhece-se o especial. Para ruído acima do limite, a declaração de EPI eficaz no PPP não descaracteriza.", "fonte": "STF Tema 555; TNU Súm. 87; IN 128/2022, art. 291; TNU Tema 213; STJ Tema 1090", "origem": "doutrina-previdenciaria.md §5 (FAVORÁVEL, NEUTRO, EPI); catalogo-temas-vinculantes.md §7", "sinal": "firme"}, {"id": "esp-019", "tema": "EPI e PPP", "pergunta": "O protetor auricular tira o direito no ruído?", "variantes": ["protetor de ouvido anula o especial?", "EPI no ruído", "abafador elimina o barulho?"], "resposta": "Não. Com ruído acima do limite de tolerância, a declaração da empresa no PPP (Perfil Profissiográfico Previdenciário) de que o EPI (equipamento de proteção individual) era eficaz não descaracteriza o tempo especial.", "fonte": "STF Tema 555, item II; IN 128/2022, art. 291, § 2º (red. IN 170/2024)", "origem": "catalogo-temas-vinculantes.md §7 (STF Tema 555); _CONTINUIDADE/_artefatos/prev-lacunas/fontes/INSUMO_dou-in170-2024.html, art. 291, § 2º", "sinal": "firme"}, {"id": "esp-020", "tema": "EPI e PPP", "pergunta": "O PPP não tem responsável técnico; vale?", "variantes": ["PPP sem engenheiro de segurança", "PPP sem responsável pelos registros ambientais", "PPP incompleto"], "resposta": "O PPP (Perfil Profissiográfico Previdenciário) precisa de responsável técnico pelos registros ambientais desde 14/10/1996, mas a falta se supre pelo LTCAT (laudo técnico das condições ambientais do trabalho) ou elemento técnico equivalente. Também se pode pedir à empresa a retificação do PPP.", "fonte": "TNU Tema 208; IN 128/2022, art. 281, § 4º-A, I, a; Dec. 3.048/1999, art. 68, § 10", "origem": "doutrina-previdenciaria.md §5 (Prova qualitativa); gerente-previdenciario/SKILL.md, Etapa 3", "sinal": "firme"}, {"id": "esp-021", "tema": "EPI e PPP", "pergunta": "O laudo foi feito anos depois; serve?", "variantes": ["laudo extemporâneo vale?", "laudo não é da época", "LTCAT feito depois"], "resposta": "Sim. Laudo feito depois do período trabalhado é apto a provar a atividade especial, desde que as condições do ambiente não tenham mudado.", "fonte": "TNU Súm. 68; TNU Tema 14; IN 128/2022, art. 279", "origem": "doutrina-previdenciaria.md §5 (Prova qualitativa); catalogo-temas-vinculantes.md §3 e §4", "sinal": "firme"}, {"id": "esp-022", "tema": "EPI e PPP", "pergunta": "A empresa não quer me dar o PPP; o que acontece?", "variantes": ["empresa se recusa a entregar PPP", "não consigo o PPP", "empresa não fornece laudo"], "resposta": "O PPP (Perfil Profissiográfico Previdenciário) é emitido pela empresa com base no LTCAT (laudo técnico das condições ambientais do trabalho), e o trabalhador pode pedir a emissão ou a retificação. Sem o documento, o caminho judicial é a perícia técnica no estabelecimento; a exposição não se presume sem PPP, LTCAT, formulário de época ou perícia.", "fonte": "Lei 8.213/1991, art. 58, §§ 1º e 4º; Dec. 3.048/1999, art. 68, § 10", "origem": "doutrina-previdenciaria.md §5 (Base legal); variantes-e-pedidos.md §7.9 (Provas); gerente-previdenciario/SKILL.md, Etapa 1", "sinal": "firme"}, {"id": "esp-023", "tema": "EPI e PPP", "pergunta": "A empresa fechou e não tenho PPP; perdi o tempo especial?", "variantes": ["empresa falida, como provar especial", "empresa baixada", "perícia por similaridade", "perícia em empresa parecida"], "resposta": "Não necessariamente: até 28/04/1995 a categoria se prova pela CTPS (Carteira de Trabalho e Previdência Social), e formulário de época emitido até 31/12/2003 também serve. Sem documento, pede-se perícia técnica judicial, mas perícia indireta, por similaridade ou prova emprestada não têm tese firmada, e a prova emprestada está afetada sem tese no Superior Tribunal de Justiça.", "fonte": "IN 128/2022, arts. 272 e 274; STJ Tema 1366", "origem": "doutrina-previdenciaria.md §5 (Prova qualitativa, LACUNA); variantes-e-pedidos.md §7.9 (Provas)", "sinal": "controvertido"}, {"id": "esp-024", "tema": "EPI e PPP", "pergunta": "Se eu só conseguir o PPP depois, perco os atrasados?", "variantes": ["PPP novo no processo", "juntei o laudo só na justiça", "documento novo muda a data do benefício?"], "resposta": "Pode perder parte: pela tese do Superior Tribunal de Justiça, prova surgida só em juízo por impossibilidade material, como PPP (Perfil Profissiográfico Previdenciário) novo, LTCAT (laudo técnico das condições ambientais do trabalho) ou perícia, leva o início do benefício à citação, e não à DER (data de entrada do requerimento). A tese não transitou em julgado e tem embargos pendentes.", "fonte": "STJ Tema 1124", "origem": "doutrina-previdenciaria.md §3-A (DIB conforme a prova); catalogo-temas-vinculantes.md §7", "sinal": "controvertido"}, {"id": "esp-025", "tema": "Conversão de tempo especial", "pergunta": "Posso transformar tempo especial em tempo comum?", "variantes": ["converter especial em comum", "tempo especial vale mais?", "acréscimo do tempo insalubre", "conversão de tempo"], "resposta": "Sim, mas só o trabalho especial prestado até 13/11/2019. O tempo especial posterior a essa data não se converte e é averbado sem acréscimo.", "fonte": "Emenda Constitucional 103/2019, art. 25, § 2º; Dec. 3.048/1999, art. 188-P, § 5º", "origem": "doutrina-previdenciaria.md §1 e §5 (Conversão); variantes-e-pedidos.md §7.9 (Pedidos)", "sinal": "firme"}, {"id": "esp-026", "tema": "Conversão de tempo especial", "pergunta": "Quanto vale cada ano especial convertido?", "variantes": ["fator de conversão", "1,4 para homem", "multiplicador do tempo especial", "quanto aumenta o tempo"], "resposta": "No especial de 25 anos, cada ano vale 1,40 para homem e 1,20 para mulher; no de 20 anos, 1,75 (homem) e 1,50 (mulher); no de 15 anos, 2,33 (homem) e 2,00 (mulher). Só para trabalho até 13/11/2019.", "fonte": "Dec. 3.048/1999, art. 188-P, § 5º", "origem": "doutrina-previdenciaria.md §5 (tabela de conversão)", "sinal": "firme"}, {"id": "esp-027", "tema": "Conversão de tempo especial", "pergunta": "Tempo especial dos anos 80 e 90 também converte?", "variantes": ["conversão de período antigo", "tempo especial depois de 1998 converte?", "trabalho insalubre antigo conta mais?"], "resposta": "Sim. A conversão vale para trabalho especial de qualquer período, inclusive depois de 1998, desde que até 13/11/2019, com o fator vigente na data da aposentadoria.", "fonte": "TNU Súm. 50 e 55; STJ Tema 422; Emenda Constitucional 103/2019, art. 25, § 2º", "origem": "catalogo-temas-vinculantes.md §3 (Súm. 50 e 55/TNU); doutrina-previdenciaria.md §5", "sinal": "firme"}, {"id": "esp-028", "tema": "Conversão de tempo especial", "pergunta": "Trabalhei em área insalubre depois da reforma; ganho acréscimo?", "variantes": ["tempo especial depois de 2019", "conversão depois da reforma", "insalubre em 2020 conta mais?"], "resposta": "Não. O tempo especial trabalhado depois de 13/11/2019 não tem fator de conversão; ele serve para a aposentadoria especial, inclusive pela transição por pontos, e é averbado sem conversão.", "fonte": "Emenda Constitucional 103/2019, arts. 19, § 1º, I, 21 e 25, § 2º; STJ Tema 546", "origem": "doutrina-previdenciaria.md §5 (Conversão e EC 103; NEUTRO Tema 546); variantes-e-pedidos.md §7.9", "sinal": "firme"}, {"id": "esp-029", "tema": "Aposentadoria especial: requisitos e valor", "pergunta": "Quantos anos preciso para a aposentadoria especial?", "variantes": ["tempo mínimo da especial", "15, 20 ou 25 anos", "quanto tempo de insalubridade para aposentar", "carência da especial"], "resposta": "15, 20 ou 25 anos de efetiva exposição, conforme o agente nocivo, além de 180 contribuições de carência. Agentes químicos e biológicos são de 25 anos.", "fonte": "Lei 8.213/1991, arts. 25, II, e 57", "origem": "doutrina-previdenciaria.md §3 (Carência) e §5 (biológicos e químicos)", "sinal": "firme"}, {"id": "esp-030", "tema": "Aposentadoria especial: requisitos e valor", "pergunta": "Completei os 25 anos antes da reforma; preciso de idade mínima?", "variantes": ["direito adquirido na especial", "fechei o tempo antes de 2019", "especial pela regra antiga"], "resposta": "Não. Quem completou o tempo especial e a carência até 13/11/2019 tem direito adquirido à aposentadoria especial pela regra antiga, sem idade mínima, com 100% do salário de benefício, e pode requerer a qualquer tempo.", "fonte": "Emenda Constitucional 103/2019, art. 3º; Lei 8.213/1991, art. 57, § 1º", "origem": "doutrina-previdenciaria.md §3 (Direito adquirido pré-reforma)", "sinal": "firme"}, {"id": "esp-031", "tema": "Aposentadoria especial: requisitos e valor", "pergunta": "Comecei antes da reforma e não completei; como fica a especial?", "variantes": ["regra de transição da especial", "pontos da aposentadoria especial", "86 pontos", "especial por pontos"], "resposta": "Para quem se filiou até 13/11/2019 vale a transição por pontos: 66 pontos com 15 anos de exposição, 76 pontos com 20 anos ou 86 pontos com 25 anos, somando idade e tempo de contribuição. Os pontos são fixos, sem aumento anual, e iguais para homem e mulher.", "fonte": "Emenda Constitucional 103/2019, art. 21; Dec. 3.048/1999, art. 188-P", "origem": "doutrina-previdenciaria.md §2 (Art. 21, especial por pontos)", "sinal": "firme"}, {"id": "esp-032", "tema": "Aposentadoria especial: requisitos e valor", "pergunta": "A transição por pontos caiu junto com a idade mínima?", "variantes": ["ADI 6309 atinge os pontos?", "regra dos 86 pontos continua?", "STF derrubou os pontos?"], "resposta": "Não. A transição por pontos não foi impugnada na ADI (ação direta de inconstitucionalidade) 6.309 e segue vigente; estender a ela a inconstitucionalidade é tese sem acórdão.", "fonte": "Emenda Constitucional 103/2019, art. 21; ADI 6.309", "origem": "doutrina-previdenciaria.md §2 (tabela, Art. 21); catalogo-temas-vinculantes.md §1 (ADI 6309)", "sinal": "firme"}, {"id": "esp-033", "tema": "Aposentadoria especial: requisitos e valor", "pergunta": "Quem começou a trabalhar depois da reforma tem idade mínima na especial?", "variantes": ["idade mínima da aposentadoria especial", "60 anos para especial", "STF derrubou idade da especial", "ADI 6309"], "resposta": "A Emenda Constitucional 103/2019 previa 55, 58 e 60 anos (para 15, 20 e 25 anos de exposição), mas o Supremo Tribunal Federal declarou essas idades inconstitucionais em 03/06/2026, na ADI (ação direta de inconstitucionalidade) 6.309. A decisão não transitou em julgado, e a AGU (Advocacia-Geral da União) pede que valha só para requerimentos posteriores a 11/06/2026.", "fonte": "Emenda Constitucional 103/2019, art. 19, § 1º, I; ADI 6.309", "origem": "doutrina-previdenciaria.md §2 (Regra permanente); catalogo-temas-vinculantes.md §1", "sinal": "controvertido"}, {"id": "esp-034", "tema": "Aposentadoria especial: requisitos e valor", "pergunta": "Quanto vou receber na aposentadoria especial?", "variantes": ["valor da aposentadoria especial", "especial é integral?", "cálculo da especial depois da reforma", "100% da média?"], "resposta": "Pela regra antiga (direito adquirido até 13/11/2019), 100% do salário de benefício. Depois da reforma, 60% da média de todos os salários desde 07/1994, mais 2 pontos percentuais por ano de contribuição acima de 20 anos (homem) ou 15 anos (mulher e especial de 15 anos).", "fonte": "Lei 8.213/1991, art. 57, § 1º; Emenda Constitucional 103/2019, art. 26, §§ 2º e 5º; Dec. 3.048/1999, art. 188-P, § 3º", "origem": "doutrina-previdenciaria.md §2, §3 e §4", "sinal": "firme"}, {"id": "esp-035", "tema": "Aposentadoria especial: requisitos e valor", "pergunta": "Aposentado na especial pode continuar trabalhando no mesmo lugar?", "variantes": ["posso seguir no hospital depois de aposentar?", "voltar a trabalhar em área insalubre", "aposentadoria especial e continuar trabalhando", "perco a aposentadoria se trabalhar?"], "resposta": "Não em atividade nociva: se permanecer ou voltar a trabalhar exposto a agente nocivo, seja a mesma atividade ou outra, o pagamento da aposentadoria especial cessa depois da implantação. A vedação alcança só a atividade especial.", "fonte": "Lei 8.213/1991, art. 57, § 8º; STF Tema 709", "origem": "doutrina-previdenciaria.md §5 (NEUTRO Tema 709); catalogo-temas-vinculantes.md §7", "sinal": "firme"}, {"id": "esp-036", "tema": "Aposentadoria especial: requisitos e valor", "pergunta": "Posso pedir a especial e seguir trabalhando até sair o benefício?", "variantes": ["preciso sair do emprego para pedir?", "continuar trabalhando enquanto o INSS analisa", "atrasados da especial"], "resposta": "Sim. Quem pede e continua no trabalho nocivo tem o benefício com início na DER (data de entrada do requerimento) e atrasados desde ela; só depois da implantação a continuidade na atividade nociva faz cessar o pagamento.", "fonte": "STF Tema 709, item ii (redação dos ED de 24/02/2021)", "origem": "doutrina-previdenciaria.md §3-A e §5; catalogo-temas-vinculantes.md §7", "sinal": "firme"}, {"id": "esp-037", "tema": "Aposentadoria especial: requisitos e valor", "pergunta": "Estou há anos sem contribuir; ainda posso pedir a especial?", "variantes": ["perdi a qualidade de segurado, e a especial?", "parei de contribuir faz tempo", "sem contribuir posso aposentar especial?"], "resposta": "Sim. A perda da qualidade de segurado não impede a aposentadoria especial, desde que cumpridos o tempo especial e a carência.", "fonte": "Lei 10.666/2003, art. 3º", "origem": "doutrina-previdenciaria.md §6 (Período de graça)", "sinal": "firme"}, {"id": "esp-038", "tema": "Tempo especial: conceito e prova", "pergunta": "O tempo afastado pelo auxílio-doença conta como especial?", "variantes": ["afastado pelo INSS conta como insalubre?", "auxílio-doença no meio do tempo especial", "benefício por incapacidade conta como especial"], "resposta": "Sim, no afastamento até 30/06/2020, para quem exercia atividade especial antes do afastamento, seja o auxílio-doença acidentário ou previdenciário, sem precisar provar relação da doença com o trabalho. Para afastamento a partir de 01/07/2020, o INSS (Instituto Nacional do Seguro Social) não conta o período como especial, e o ponto é controvertido.", "fonte": "STJ Tema 998; TNU Tema 165; IN 128/2022, art. 271, § 2º", "origem": "doutrina-previdenciaria.md §5 (FAVORÁVEL; Contribuinte individual e afastamento); catalogo-temas-vinculantes.md §2 e §4", "sinal": "controvertido"}, {"id": "esp-039", "tema": "Tempo especial: conceito e prova", "pergunta": "Fiquei afastado depois de julho de 2020; conta como especial?", "variantes": ["afastamento depois de 2020 conta?", "INSS não contou meu auxílio-doença como especial", "auxílio-doença recente e tempo especial"], "resposta": "Para afastamentos por incapacidade a partir de 01/07/2020, o INSS (Instituto Nacional do Seguro Social) não conta o período como especial. Não há tese judicial lida sobre esse período, e a posição do Superior Tribunal de Justiça foi firmada antes dessa regra.", "fonte": "IN 128/2022, art. 271, § 2º; STJ Tema 998", "origem": "doutrina-previdenciaria.md §5 (ADVERSO biológicos; LACUNA ins. R8 c.10); gerente-previdenciario/SKILL.md, Etapa 3", "sinal": "controvertido"}, {"id": "esp-040", "tema": "Tempo especial: conceito e prova", "pergunta": "Autônomo tem direito a tempo especial?", "variantes": ["contribuinte individual tem especial?", "trabalho por conta própria insalubre", "médico autônomo especial", "dentista autônomo aposentadoria especial"], "resposta": "Sim, se comprovar a exposição a agentes nocivos. Até 28/04/1995, prova-se a categoria com documentos ano a ano; depois, o Superior Tribunal de Justiça admite o especial do não cooperado sem formulário emitido por empresa, mas há recurso pendente no Supremo Tribunal Federal e o INSS (Instituto Nacional do Seguro Social) só reconhece o cooperado.", "fonte": "TNU Súm. 62; STJ Tema 1291; IN 128/2022, art. 275; Dec. 3.048/1999, art. 64", "origem": "doutrina-previdenciaria.md §5 (Contribuinte individual e afastamento; ADVERSO); variantes-e-pedidos.md §7.9", "sinal": "controvertido"}, {"id": "esp-041", "tema": "Profissionais da saúde", "pergunta": "Quem trabalha com doentes ou material contaminado tem tempo especial?", "variantes": ["profissional da saúde tem especial?", "enfermeiro aposentadoria especial", "agente biológico", "trabalho em hospital é insalubre?"], "resposta": "Sim, com tempo de 25 anos: até 28/04/1995 por categoria (médicos, dentistas, enfermeiros e outras profissões dos quadros); até 05/03/1997 pelo contato com doentes ou materiais infecto-contagiantes; desde 06/03/1997, em estabelecimento de saúde, no contato com pacientes com doenças infecto-contagiosas ou manuseio de materiais contaminados, além de autópsia, exumação, esgoto e lixo.", "fonte": "Dec. 53.831/1964, 2.1.3 e 1.3.2; Dec. 83.080/1979, Anexos I e II; Dec. 2.172/1997 e Dec. 3.048/1999, Anexo IV, 3.0.1", "origem": "doutrina-previdenciaria.md §5 (Agentes biológicos e profissionais da saúde, tabela)", "sinal": "firme"}, {"id": "esp-042", "tema": "Profissionais da saúde", "pergunta": "Técnico ou auxiliar de enfermagem conta como especial?", "variantes": ["técnica de enfermagem tem especial?", "auxiliar de enfermagem insalubre", "fisioterapeuta tem especial?", "profissão de saúde que não está no decreto"], "resposta": "Até 28/04/1995, por categoria, só por analogia justificada, porque essas funções não estão nominadas nos decretos, e esse ponto não tem regra fechada. Depois disso, conta pela exposição a agentes biológicos provada no PPP (Perfil Profissiográfico Previdenciário), avaliada pela descrição da função, sem exigir tempo mínimo de exposição na jornada.", "fonte": "TNU Temas 198 e 211; Dec. 3.048/1999, Anexo IV, 3.0.1", "origem": "doutrina-previdenciaria.md §5 (Categoria e rol; Habitualidade; LACUNA ins. R8 c.6)", "sinal": "controvertido"}, {"id": "esp-043", "tema": "Profissionais da saúde", "pergunta": "O hospital diz no PPP que o EPI era eficaz; perco o especial?", "variantes": ["EPI na enfermagem", "luva e máscara tiram o especial na saúde?", "UTI com EPI eficaz", "pronto-socorro e EPI"], "resposta": "Até 02/12/1998 o EPI (equipamento de proteção individual) é irrelevante. Depois, a Turma Nacional de Uniformização decidiu que o EPI eficaz não impede o especial do profissional de saúde em procedimento que gera aerossol, urgência ou emergência em UTI (unidade de terapia intensiva), pronto-socorro, centro cirúrgico ou ala de infectocontagiosos, mas a decisão foi por maioria e não transitou. Fora desses setores, cabe impugnar especificamente a eficácia, e a dúvida favorece o trabalhador.", "fonte": "TNU Súm. 87; TNU Tema 383; TNU Tema 213; STJ Tema 1090, item III", "origem": "doutrina-previdenciaria.md §5 (EPI, bloco biológico); catalogo-temas-vinculantes.md §4", "sinal": "controvertido"}, {"id": "esp-044", "tema": "Profissionais da saúde", "pergunta": "Faxineira de hospital tem direito a tempo especial?", "variantes": ["limpeza hospitalar é especial?", "serviços gerais no hospital", "higienização hospitalar insalubre"], "resposta": "Pode ter, porque o código de agentes biológicos alcança a limpeza e higienização hospitalar, mas não por simples categoria: é obrigatório laudo ou formulário do período que prove a exposição. Só a carteira de trabalho não basta.", "fonte": "TNU Súm. 82 e Tema 100; TNU Tema 238", "origem": "doutrina-previdenciaria.md §5 (Limpeza hospitalar; ADVERSO biológicos)", "sinal": "firme"}, {"id": "esp-045", "tema": "Profissionais da saúde", "pergunta": "Agente comunitário de saúde tem aposentadoria especial?", "variantes": ["ACS tem especial?", "agente de endemias aposentadoria especial", "Emenda 120 agente de saúde"], "resposta": "Não automaticamente: a Turma Nacional de Uniformização exige a prova da efetiva exposição, porque a regra da Emenda Constitucional 120/2022 depende de regulamentação. O tema está no Supremo Tribunal Federal com repercussão geral e ainda sem tese.", "fonte": "TNU Tema 347; STF Tema 1470; Constituição Federal, art. 198, § 10", "origem": "doutrina-previdenciaria.md §5 (Agente comunitário; ADVERSO biológicos); catalogo-temas-vinculantes.md §1", "sinal": "controvertido"}, {"id": "esp-046", "tema": "Profissionais da saúde", "pergunta": "Profissional da saúde aposentado na especial pode continuar no hospital?", "variantes": ["enfermeira aposentada especial pode trabalhar?", "suspensão do Tema 709 para saúde", "médico aposentado especial continua atendendo"], "resposta": "A regra geral veda continuar em atividade nociva depois da implantação da aposentadoria especial. Houve suspensão dessa vedação para profissionais de saúde ligada à lei da pandemia (Lei 13.979/2020), mas não se pode afirmar que ela ainda vale; o ponto se confere no portal do Supremo Tribunal Federal na data do caso.", "fonte": "STF Tema 709 (terceiros ED, DJe 04/11/2021); Lei 13.979/2020, art. 3º-J", "origem": "doutrina-previdenciaria.md §5 (LACUNAS do bloco); catalogo-temas-vinculantes.md §1 (Tema 709)", "sinal": "controvertido"}, {"id": "rur-001", "tema": "Segurado especial rural", "pergunta": "Quem é considerado segurado especial?", "variantes": ["quem é trabalhador rural para o INSS", "agricultor familiar é segurado especial?", "pescador artesanal é segurado especial?", "pequeno produtor rural"], "resposta": "É o produtor rural que explora área de até 4 módulos fiscais, o seringueiro ou extrativista vegetal e o pescador artesanal, com o cônjuge ou companheiro e os filhos maiores de 16 anos que trabalham com o grupo, em regime de economia familiar e sem empregados permanentes. Pode ser proprietário, possuidor, assentado, parceiro, meeiro, comodatário ou arrendatário.", "fonte": "Lei 8.213/1991, art. 11, VII e § 1º", "origem": "gerente-previdenciario/SKILL.md, Etapa 1 (Trabalhador rural); variantes-e-pedidos.md §7.8", "sinal": "firme"}, {"id": "rur-002", "tema": "Segurado especial rural", "pergunta": "O que é regime de economia familiar?", "variantes": ["trabalho em família na roça", "economia familiar o que significa", "família que vive da terra"], "resposta": "É o trabalho dos membros da família indispensável à própria subsistência, exercido em mútua dependência e colaboração, sem empregados permanentes.", "fonte": "Lei 8.213/1991, art. 11, § 1º", "origem": "variantes-e-pedidos.md §7.8 (Capítulo 1)", "sinal": "firme"}, {"id": "rur-003", "tema": "Segurado especial rural", "pergunta": "Meus filhos que ajudavam na roça também são segurados especiais?", "variantes": ["filho que trabalha na lavoura é segurado?", "esposa que ajuda na roça", "família toda é segurada?"], "resposta": "Sim. O cônjuge ou companheiro e o filho maior de 16 anos que trabalham com o grupo familiar também são segurados especiais.", "fonte": "Lei 8.213/1991, art. 11, VII", "origem": "gerente-previdenciario/SKILL.md, Etapa 1 (Trabalhador rural)", "sinal": "firme"}, {"id": "rur-004", "tema": "Segurado especial rural", "pergunta": "Ter empregado na propriedade tira a condição de segurado especial?", "variantes": ["contratar peão tira o direito?", "tinha empregado fixo na roça", "mão de obra contratada"], "resposta": "Empregado permanente, sim: o regime de economia familiar exige que não haja empregados permanentes.", "fonte": "Lei 8.213/1991, art. 11, § 1º", "origem": "gerente-previdenciario/SKILL.md, Etapa 1 (Trabalhador rural); variantes-e-pedidos.md §7.8", "sinal": "firme"}, {"id": "rur-005", "tema": "Segurado especial rural", "pergunta": "Minha terra é grande; perco a condição de segurado especial?", "variantes": ["tamanho da propriedade", "mais de 4 módulos fiscais", "terra maior que o módulo rural", "quantos hectares pode ter"], "resposta": "Não por si só: o tamanho da propriedade não descaracteriza o regime de economia familiar quando preenchidos os demais requisitos. A lei fala em até 4 módulos fiscais, e área maior que o módulo rural não afasta a qualificação se a exploração familiar for comprovada.", "fonte": "STJ Tema 1115; TNU Súm. 30; Lei 8.213/1991, art. 11, VII", "origem": "catalogo-temas-vinculantes.md §2 e §3; gerente-previdenciario/SKILL.md, Etapa 1", "sinal": "firme"}, {"id": "rur-006", "tema": "Segurado especial rural", "pergunta": "Meu marido trabalha na cidade; perco a condição de rural?", "variantes": ["esposa com emprego urbano", "filho trabalha na cidade", "alguém da família tem carteira assinada", "membro da família urbano"], "resposta": "Não por si só: o trabalho urbano de um membro da família não descaracteriza os demais como segurados especiais, e analisa-se se o trabalho rural continuava indispensável à subsistência do grupo. Documento em nome do cônjuge que passou ao trabalho urbano deixa de servir como prova rural.", "fonte": "STJ Tema 532; TNU Súm. 41; STJ Tema 533", "origem": "catalogo-temas-vinculantes.md §2 e §3; gerente-previdenciario/SKILL.md, Etapa 1", "sinal": "firme"}, {"id": "rur-007", "tema": "Segurado especial rural", "pergunta": "Trabalhei uns tempos na cidade e voltei para a roça; perdi o direito?", "variantes": ["atividade urbana no meio do tempo rural", "fui para a cidade e voltei", "trabalho urbano intercalado"], "resposta": "Não por si só: a atividade urbana intercalada não impede o benefício de trabalhador rural, analisado o caso. Mas outra atividade remunerada por mais de 120 dias, corridos ou intercalados, no ano civil exclui da condição de segurado especial a partir do mês seguinte.", "fonte": "TNU Súm. 46; Lei 8.213/1991, art. 11, § 9º, III, e § 10, II, b", "origem": "catalogo-temas-vinculantes.md §3; variantes-e-pedidos.md §7.8 (Alertas do script)", "sinal": "firme"}, {"id": "rur-008", "tema": "Segurado especial rural", "pergunta": "Ser associado de cooperativa tira a condição de segurado especial?", "variantes": ["sou sócio da cooperativa agrícola", "cooperativa de crédito rural", "cargo na cooperativa"], "resposta": "Não. A associação em cooperativa vinculada à atividade rural, exceto cooperativa de trabalho, não descaracteriza o segurado especial, nem a atividade remunerada de mandato eletivo nessa cooperativa, desde que sem dedicação exclusiva nem regime integral de trabalho.", "fonte": "Lei 8.213/1991, art. 11, § 8º, VI, a, e § 9º, V, b, 1 (Lei 15.072/2024); Dec. 13.054/2026", "origem": "legislacao-pos-2019.md §3 (Lei 15.072/2024 e Dec. 13.054/2026)", "sinal": "firme"}, {"id": "rur-009", "tema": "Prova rural", "pergunta": "Que documentos provam o trabalho rural?", "variantes": ["como provo que trabalhei na roça", "o que serve de prova rural", "nota de produtor serve?", "documentos da lavoura"], "resposta": "Contrato de arrendamento, parceria ou comodato rural; Declaração de Aptidão ao Pronaf (Programa Nacional de Fortalecimento da Agricultura Familiar); bloco de notas do produtor; notas fiscais de venda da produção; comprovante de entrega a cooperativa; comprovante de contribuição sobre a comercialização; declaração de imposto de renda com renda rural; licença do Incra (Instituto Nacional de Colonização e Reforma Agrária).", "fonte": "Lei 8.213/1991, art. 106", "origem": "gerente-previdenciario/SKILL.md, Etapa 1 (Caso rural ou híbrido: prova a pedir)", "sinal": "firme"}, {"id": "rur-010", "tema": "Prova rural", "pergunta": "Certidão de casamento dizendo lavrador serve de prova?", "variantes": ["profissão de agricultor na certidão", "documento em nome do marido serve?", "certidão de nascimento dos filhos com lavrador"], "resposta": "Sim. Certidão de casamento ou outro documento que qualifique o cônjuge como trabalhador rural é início de prova material, salvo se o cônjuge passou ao trabalho urbano.", "fonte": "TNU Súm. 6; STJ Tema 533", "origem": "catalogo-temas-vinculantes.md §3 (Súm. 6/TNU); gerente-previdenciario/SKILL.md, Etapa 1", "sinal": "firme"}, {"id": "rur-011", "tema": "Prova rural", "pergunta": "Só com testemunhas dá para provar que trabalhei na roça?", "variantes": ["não tenho documento, só vizinhos", "prova só testemunhal", "testemunha basta?", "sem papel nenhum da roça"], "resposta": "Não. Prova só testemunhal não basta para comprovar atividade rural; é preciso início de prova material da época, que as testemunhas complementam. Sem documento, a ação é extinta sem julgamento do mérito e pode ser proposta de novo quando houver prova.", "fonte": "Súm. 149/STJ; Lei 8.213/1991, art. 55, § 3º; STJ Tema 629", "origem": "doutrina-previdenciaria.md §6 (Rural; ADVERSO Súm. 149); catalogo-temas-vinculantes.md §3 e §7", "sinal": "firme"}, {"id": "rur-012", "tema": "Prova rural", "pergunta": "Preciso de documento de todos os anos que trabalhei na roça?", "variantes": ["documento de cada ano", "tenho papel só de alguns anos", "tempo antes do documento mais antigo"], "resposta": "Não. O início de prova material não precisa cobrir todo o período, e testemunhas convincentes estendem o tempo inclusive para antes do documento mais antigo. Mas o documento deve ser da época dos fatos que prova.", "fonte": "TNU Súm. 14; Súm. 577/STJ; STJ Tema 638; TNU Súm. 34", "origem": "catalogo-temas-vinculantes.md §2 e §3; doutrina-previdenciaria.md §6 (Rural, Prova)", "sinal": "firme"}, {"id": "rur-013", "tema": "Prova rural", "pergunta": "Como funciona a autodeclaração rural?", "variantes": ["autodeclaração do segurado especial", "cadastro no CNIS do agricultor", "depois de 2023 como provo rural"], "resposta": "Para atividade até 31/12/2022, o segurado especial prova pela autodeclaração ratificada por entidade pública credenciada ou pelos documentos da lei. A partir de 01/01/2023, a prova é exclusivamente o cadastro do segurado especial no CNIS (Cadastro Nacional de Informações Sociais).", "fonte": "Lei 8.213/1991, art. 38-B, §§ 1º e 2º", "origem": "doutrina-previdenciaria.md §6 (Rural, Prova); gerente-previdenciario/SKILL.md, Etapa 1", "sinal": "firme"}, {"id": "rur-014", "tema": "Prova rural", "pergunta": "E se meu cadastro de segurado especial ficou sem atualizar?", "variantes": ["cadastro rural desatualizado", "não atualizei o CNIS rural", "cadastro parado há anos"], "resposta": "Cadastro sem atualização por cinco anos restringe o cômputo: o período só conta com comercialização e contribuição em época própria. O alcance exato dessa restrição ainda não está fechado.", "fonte": "Lei 8.213/1991, art. 38-A, §§ 4º a 6º", "origem": "variantes-e-pedidos.md §7.8 (Alertas do script; LACUNA insumo R7a c.10); gerente-previdenciario/SKILL.md, Etapa 1", "sinal": "controvertido"}, {"id": "rur-015", "tema": "Prova rural", "pergunta": "O INSS ouve testemunhas sobre o trabalho rural?", "variantes": ["justificação administrativa", "levar testemunha no INSS", "quantas testemunhas"], "resposta": "Sim, pela justificação administrativa, com 2 a 6 testemunhas, que complementam o início de prova material. Não cabe recurso da decisão que considera a justificação eficaz ou ineficaz.", "fonte": "Dec. 3.048/1999, arts. 142 a 151 (art. 147); Lei 8.213/1991, art. 55, § 3º", "origem": "doutrina-previdenciaria.md §6 (Justificação administrativa e Prova do tempo)", "sinal": "firme"}, {"id": "rur-016", "tema": "Prova rural", "pergunta": "Boia-fria sem registro consegue provar o tempo rural?", "variantes": ["diarista rural sem carteira", "trabalhava por dia na lavoura", "safrista sem registro"], "resposta": "Sim, mas também precisa de início de prova material; prova material de só parte do período basta se complementada por testemunhas idôneas e robustas.", "fonte": "STJ Tema 554; Súm. 149/STJ", "origem": "catalogo-temas-vinculantes.md §7 (STJ Tema 554)", "sinal": "firme"}, {"id": "rur-017", "tema": "Prova rural", "pergunta": "Diarista rural eventual depois de 2010 precisa contribuir?", "variantes": ["trabalhador rural eventual", "contribuinte individual rural", "diarista rural recente conta sem pagar?"], "resposta": "Sim. O contribuinte individual rural eventual, depois de 31/12/2010, só tem contados os meses com recolhimento.", "fonte": "Lei 8.213/1991, art. 11, V, g; insumo R7a a.2", "origem": "variantes-e-pedidos.md §7.8 (Alertas do script); gerente-previdenciario/SKILL.md, Etapa 1-A", "sinal": "firme"}, {"id": "rur-018", "tema": "Tempo rural e contagem", "pergunta": "O tempo de roça antes de 1991, sem contribuição, conta?", "variantes": ["tempo rural antigo sem pagar INSS", "roça antes de 1991", "tempo de lavoura sem contribuição"], "resposta": "Sim, conta como tempo de contribuição, mas não como carência nas aposentadorias urbanas. Na aposentadoria híbrida por idade, esse tempo conta também para a carência. As fontes divergem se o marco é 24/07/1991 (lei) ou 31/10/1991 (decreto).", "fonte": "Lei 8.213/1991, art. 55, § 2º; TNU Súm. 24; STJ Tema 1007", "origem": "doutrina-previdenciaria.md §6 (Rural, Cômputo e Híbrida)", "sinal": "firme"}, {"id": "rur-019", "tema": "Tempo rural e contagem", "pergunta": "Tempo de roça depois de 1991 conta para aposentadoria por tempo de contribuição?", "variantes": ["rural depois de 1991 sem contribuir", "segurado especial e tempo de contribuição", "contribuição facultativa do rural"], "resposta": "Só com contribuição facultativa: o tempo de segurado especial posterior a 1991 só conta como tempo de contribuição se ele recolheu contribuições facultativas.", "fonte": "Lei 8.213/1991, art. 39, II; Súm. 272/STJ", "origem": "doutrina-previdenciaria.md §6 (Rural, Cômputo); catalogo-temas-vinculantes.md §3", "sinal": "firme"}, {"id": "rur-020", "tema": "Tempo rural e contagem", "pergunta": "Fui empregado rural com carteira antes de 1991; conta como carência?", "variantes": ["empregado de fazenda registrado", "carteira assinada na roça antes de 91", "empregado rural e carência"], "resposta": "Sim. O tempo de empregado rural registrado em CTPS (Carteira de Trabalho e Previdência Social) antes de 1991 conta para a carência, porque o empregado não responde pelo recolhimento.", "fonte": "STJ Tema 644", "origem": "catalogo-temas-vinculantes.md §2 e §7 (STJ Tema 644)", "sinal": "firme"}, {"id": "rur-021", "tema": "Tempo rural e contagem", "pergunta": "Trabalhei na roça desde criança; esse tempo conta?", "variantes": ["trabalho rural na infância", "desde os 12 anos na lavoura", "menor de idade na roça"], "resposta": "Sim, até 24/07/1991: o trabalho rural comprovado a partir dos 12 anos pode ser reconhecido para fins previdenciários.", "fonte": "TNU Súm. 5", "origem": "catalogo-temas-vinculantes.md §3 (Súm. 5/TNU); variantes-e-pedidos.md §7.8", "sinal": "firme"}, {"id": "rur-022", "tema": "Tempo rural e contagem", "pergunta": "Trabalho rural de menor depois de 1991 conta?", "variantes": ["criança na roça nos anos 90", "menor de 14 anos trabalhando depois de 1991", "trabalho infantil rural recente"], "resposta": "Não há regra firmada nas fontes: o reconhecimento do trabalho de menor de 14 anos entre 25/07/1991 e 22/06/2008, e de menor de 16 anos a partir de 23/06/2008, é ponto em aberto.", "fonte": "TNU Súm. 5 (limite temporal); insumo R7a c.15", "origem": "variantes-e-pedidos.md §7.8 (Alertas) e §10 (lacuna 19)", "sinal": "controvertido"}, {"id": "rur-023", "tema": "Tempo rural e contagem", "pergunta": "Posso pagar o INSS pelo tempo de roça que não contribuí?", "variantes": ["indenizar tempo rural", "pagar atrasado do tempo de lavoura", "multa para pagar tempo rural"], "resposta": "Quando a indenização é exigida, o período conta como tempo depois de pago, e desde a Lei 15.363/2026 não incide a multa de 10% sobre o tempo rural do empregado rural ou do segurado especial anterior à obrigatoriedade de filiação. Em regra, o período indenizado não conta para a carência.", "fonte": "Lei 8.212/1991, art. 45-A, caput e § 4º; Lei 8.213/1991, art. 27, II", "origem": "doutrina-previdenciaria.md §6 (Indenização do art. 45-A e Decadência)", "sinal": "firme"}, {"id": "rur-024", "tema": "Aposentadoria rural e híbrida", "pergunta": "Com que idade o trabalhador rural se aposenta?", "variantes": ["idade da aposentadoria rural", "agricultor aposenta com quantos anos", "55 anos mulher da roça", "aposentadoria por idade rural"], "resposta": "60 anos o homem e 55 anos a mulher, com 180 meses de atividade rural, ainda que descontínua. Vale para segurado especial, empregado e avulso rurais e contribuinte individual rural eventual, e a Reforma da Previdência não mudou essas idades.", "fonte": "Lei 8.213/1991, art. 48, §§ 1º e 2º; Constituição Federal, art. 201, § 7º, II", "origem": "doutrina-previdenciaria.md §2 e §6 (Rural); gerente-previdenciario/SKILL.md, Etapa 1", "sinal": "firme"}, {"id": "rur-025", "tema": "Aposentadoria rural e híbrida", "pergunta": "Parei de trabalhar na roça há anos; ainda me aposento como rural?", "variantes": ["saí do campo antes da idade", "não trabalho mais na lavoura", "precisa estar na roça para aposentar?"], "resposta": "Em regra, não: os 180 meses rurais devem estar no período imediatamente anterior ao requerimento ou ao dia em que completou a idade, e o segurado especial tem de estar no campo ao completar a idade. Quem já tinha reunido idade e carência no campo antes de sair tem direito adquirido.", "fonte": "TNU Súm. 54; STJ Tema 642", "origem": "doutrina-previdenciaria.md §6 (Rural); catalogo-temas-vinculantes.md §7 (STJ Tema 642)", "sinal": "firme"}, {"id": "rur-026", "tema": "Aposentadoria rural e híbrida", "pergunta": "O que é aposentadoria híbrida?", "variantes": ["juntar tempo rural e urbano", "aposentadoria mista", "híbrida idade e requisitos", "trabalhei na roça e na cidade"], "resposta": "É a aposentadoria por idade que soma tempo rural e urbano. Pela leitura do INSS (Instituto Nacional do Seguro Social), exige 65 anos (homem) ou 62 (mulher) e 20 anos (homem) ou 15 (mulher) de contribuição; a tese pela letra da Lei 8.213 pede 65 (homem) ou 60 (mulher), sem tempo mínimo de contribuição, mas não há precedente vinculante sobre ela depois da Reforma da Previdência.", "fonte": "Lei 8.213/1991, art. 48, § 3º; Dec. 3.048/1999, arts. 51 e 57", "origem": "doutrina-previdenciaria.md §6 (Rural, Híbrida); gerente-previdenciario/SKILL.md
