lantes.md §3 e §4", "sinal": "firme"}, {"id": "esp-022", "tema": "EPI e PPP", "pergunta": "A empresa não quer me dar o PPP; o que acontece?", "variantes": ["empresa se recusa a entregar PPP", "não consigo o PPP", "empresa não fornece laudo"], "resposta": "O PPP (Perfil Profissiográfico Previdenciário) é emitido pela empresa com base no LTCAT (laudo técnico das condições ambientais do trabalho), e o trabalhador pode pedir a emissão ou a retificação. Sem o documento, o caminho judicial é a perícia técnica no estabelecimento; a exposição não se presume sem PPP, LTCAT, formulário de época ou perícia.", "fonte": "Lei 8.213/1991, art. 58, §§ 1º e 4º; Dec. 3.048/1999, art. 68, § 10", "origem": "doutrina-previdenciaria.md §5 (Base legal); variantes-e-pedidos.md §7.9 (Provas); gerente-previdenciario/SKILL.md, Etapa 1", "sinal": "firme"}, {"id": "esp-023", "tema": "EPI e PPP", "pergunta": "A empresa fechou e não tenho PPP; perdi o tempo especial?", "variantes": ["empresa falida, como provar especial", "empresa baixada", "perícia por similaridade", "perícia em empresa parecida"], "resposta": "Não necessariamente: até 28/04/1995 a categoria se prova pela CTPS (Carteira de Trabalho e Previdência Social), e formulário de época emitido até 31/12/2003 também serve. Sem documento, pede-se perícia técnica judicial, mas perícia indireta, por similaridade ou prova emprestada não têm tese firmada, e a prova emprestada está afetada sem tese no Superior Tribunal de Justiça.", "fonte": "IN 128/2022, arts. 272 e 274; STJ Tema 1366", "origem": "doutrina-previdenciaria.md §5 (Prova qualitativa, LACUNA); variantes-e-pedidos.md §7.9 (Provas)", "sinal": "controvertido"}, {"id": "esp-024", "tema": "EPI e PPP", "pergunta": "Se eu só conseguir o PPP depois, perco os atrasados?", "variantes": ["PPP novo no processo", "juntei o laudo só na justiça", "documento novo muda a data do benefício?"], "resposta": "Pode perder parte: pela tese do Superior Tribunal de Justiça, prova surgida só em juízo por impossibilidade material, como PPP (Perfil Profissiográfico Previdenciário) novo, LTCAT (laudo técnico das condições ambientais do trabalho) ou perícia, leva o início do benefício à citação, e não à DER (data de entrada do requerimento). A tese não transitou em julgado e tem embargos pendentes.", "fonte": "STJ Tema 1124", "origem": "doutrina-previdenciaria.md §3-A (DIB conforme a prova); catalogo-temas-vinculantes.md §7", "sinal": "controvertido"}, {"id": "esp-025", "tema": "Conversão de tempo especial", "pergunta": "Posso transformar tempo especial em tempo comum?", "variantes": ["converter especial em comum", "tempo especial vale mais?", "acréscimo do tempo insalubre", "conversão de tempo"], "resposta": "Sim, mas só o trabalho especial prestado até 13/11/2019. O tempo especial posterior a essa data não se converte e é averbado sem acréscimo.", "fonte": "Emenda Constitucional 103/2019, art. 25, § 2º; Dec. 3.048/1999, art. 188-P, § 5º", "origem": "doutrina-previdenciaria.md §1 e §5 (Conversão); variantes-e-pedidos.md §7.9 (Pedidos)", "sinal": "firme"}, {"id": "esp-026", "tema": "Conversão de tempo especial", "pergunta": "Quanto vale cada ano especial convertido?", "variantes": ["fator de conversão", "1,4 para homem", "multiplicador do tempo especial", "quanto aumenta o tempo"], "resposta": "No especial de 25 anos, cada ano vale 1,40 para homem e 1,20 para mulher; no de 20 anos, 1,75 (homem) e 1,50 (mulher); no de 15 anos, 2,33 (homem) e 2,00 (mulher). Só para trabalho até 13/11/2019.", "fonte": "Dec. 3.048/1999, art. 188-P, § 5º", "origem": "doutrina-previdenciaria.md §5 (tabela de conversão)", "sinal": "firme"}, {"id": "esp-027", "tema": "Conversão de tempo especial", "pergunta": "Tempo especial dos anos 80 e 90 também converte?", "variantes": ["conversão de período antigo", "tempo especial depois de 1998 converte?", "trabalho insalubre antigo conta mais?"], "resposta": "Sim. A conversão vale para trabalho especial de qualquer período, inclusive depois de 1998, desde que até 13/11/2019, com o fator vigente na data da aposentadoria.", "fonte": "TNU Súm. 50 e 55; STJ Tema 422; Emenda Constitucional 103/2019, art. 25, § 2º", "origem": "catalogo-temas-vinculantes.md §3 (Súm. 50 e 55/TNU); doutrina-previdenciaria.md §5", "sinal": "firme"}, {"id": "esp-028", "tema": "Conversão de tempo especial", "pergunta": "Trabalhei em área insalubre depois da reforma; ganho acréscimo?", "variantes": ["tempo especial depois de 2019", "conversão depois da reforma", "insalubre em 2020 conta mais?"], "resposta": "Não. O tempo especial trabalhado depois de 13/11/2019 não tem fator de conversão; ele serve para a aposentadoria especial, inclusive pela transição por pontos, e é averbado sem conversão.", "fonte": "Emenda Constitucional 103/2019, arts. 19, § 1º, I, 21 e 25, § 2º; STJ Tema 546", "origem": "doutrina-previdenciaria.md §5 (Conversão e EC 103; NEUTRO Tema 546); variantes-e-pedidos.md §7.9", "sinal": "firme"}, {"id": "esp-029", "tema": "Aposentadoria especial: requisitos e valor", "pergunta": "Quantos anos preciso para a aposentadoria especial?", "variantes": ["tempo mínimo da especial", "15, 20 ou 25 anos", "quanto tempo de insalubridade para aposentar", "carência da especial"], "resposta": "15, 20 ou 25 anos de efetiva exposição, conforme o agente nocivo, além de 180 contribuições de carência. Agentes químicos e biológicos são de 25 anos.", "fonte": "Lei 8.213/1991, arts. 25, II, e 57", "origem": "doutrina-previdenciaria.md §3 (Carência) e §5 (biológicos e químicos)", "sinal": "firme"}, {"id": "esp-030", "tema": "Aposentadoria especial: requisitos e valor", "pergunta": "Completei os 25 anos antes da reforma; preciso de idade mínima?", "variantes": ["direito adquirido na especial", "fechei o tempo antes de 2019", "especial pela regra antiga"], "resposta": "Não. Quem completou o tempo especial e a carência até 13/11/2019 tem direito adquirido à aposentadoria especial pela regra antiga, sem idade mínima, com 100% do salário de benefício, e pode requerer a qualquer tempo.", "fonte": "Emenda Constitucional 103/2019, art. 3º; Lei 8.213/1991, art. 57, § 1º", "origem": "doutrina-previdenciaria.md §3 (Direito adquirido pré-reforma)", "sinal": "firme"}, {"id": "esp-031", "tema": "Aposentadoria especial: requisitos e valor", "pergunta": "Comecei antes da reforma e não completei; como fica a especial?", "variantes": ["regra de transição da especial", "pontos da aposentadoria especial", "86 pontos", "especial por pontos"], "resposta": "Para quem se filiou até 13/11/2019 vale a transição por pontos: 66 pontos com 15 anos de exposição, 76 pontos com 20 anos ou 86 pontos com 25 anos, somando idade e tempo de contribuição. Os pontos são fixos, sem aumento anual, e iguais para homem e mulher.", "fonte": "Emenda Constitucional 103/2019, art. 21; Dec. 3.048/1999, art. 188-P", "origem": "doutrina-previdenciaria.md §2 (Art. 21, especial por pontos)", "sinal": "firme"}, {"id": "esp-032", "tema": "Aposentadoria especial: requisitos e valor", "pergunta": "A transição por pontos caiu junto com a idade mínima?", "variantes": ["ADI 6309 atinge os pontos?", "regra dos 86 pontos continua?", "STF derrubou os pontos?"], "resposta": "Não. A transição por pontos não foi impugnada na ADI (ação direta de inconstitucionalidade) 6.309 e segue vigente; estender a ela a inconstitucionalidade é tese sem acórdão.", "fonte": "Emenda Constitucional 103/2019, art. 21; ADI 6.309", "origem": "doutrina-previdenciaria.md §2 (tabela, Art. 21); catalogo-temas-vinculantes.md §1 (ADI 6309)", "sinal": "firme"}, {"id": "esp-033", "tema": "Aposentadoria especial: requisitos e valor", "pergunta": "Quem começou a trabalhar depois da reforma tem idade mínima na especial?", "variantes": ["idade mínima da aposentadoria especial", "60 anos para especial", "STF derrubou idade da especial", "ADI 6309"], "resposta": "A Emenda Constitucional 103/2019 previa 55, 58 e 60 anos (para 15, 20 e 25 anos de exposição), mas o Supremo Tribunal Federal declarou essas idades inconstitucionais em 03/06/2026, na ADI (ação direta de inconstitucionalidade) 6.309. A decisão não transitou em julgado, e a AGU (Advocacia-Geral da União) pede que valha só para requerimentos posteriores a 11/06/2026.", "fonte": "Emenda Constitucional 103/2019, art. 19, § 1º, I; ADI 6.309", "origem": "doutrina-previdenciaria.md §2 (Regra permanente); catalogo-temas-vinculantes.md §1", "sinal": "controvertido"}, {"id": "esp-034", "tema": "Aposentadoria especial: requisitos e valor", "pergunta": "Quanto vou receber na aposentadoria especial?", "variantes": ["valor da aposentadoria especial", "especial é integral?", "cálculo da especial depois da reforma", "100% da média?"], "resposta": "Pela regra antiga (direito adquirido até 13/11/2019), 100% do salário de benefício. Depois da reforma, 60% da média de todos os salários desde 07/1994, mais 2 pontos percentuais por ano de contribuição acima de 20 anos (homem) ou 15 anos (mulher e especial de 15 anos).", "fonte": "Lei 8.213/1991, art. 57, § 1º; Emenda Constitucional 103/2019, art. 26, §§ 2º e 5º; Dec. 3.048/1999, art. 188-P, § 3º", "origem": "doutrina-previdenciaria.md §2, §3 e §4", "sinal": "firme"}, {"id": "esp-035", "tema": "Aposentadoria especial: requisitos e valor", "pergunta": "Aposentado na especial pode continuar trabalhando no mesmo lugar?", "variantes": ["posso seguir no hospital depois de aposentar?", "voltar a trabalhar em área insalubre", "aposentadoria especial e continuar trabalhando", "perco a aposentadoria se trabalhar?"], "resposta": "Não em atividade nociva: se permanecer ou voltar a trabalhar exposto a agente nocivo, seja a mesma atividade ou outra, o pagamento da aposentadoria especial cessa depois da implantação. A vedação alcança só a atividade especial.", "fonte": "Lei 8.213/1991, art. 57, § 8º; STF Tema 709", "origem": "doutrina-previdenciaria.md §5 (NEUTRO Tema 709); catalogo-temas-vinculantes.md §7", "sinal": "firme"}, {"id": "esp-036", "tema": "Aposentadoria especial: requisitos e valor", "pergunta": "Posso pedir a especial e seguir trabalhando até sair o benefício?", "variantes": ["preciso sair do emprego para pedir?", "continuar trabalhando enquanto o INSS analisa", "atrasados da especial"], "resposta": "Sim. Quem pede e continua no trabalho nocivo tem o benefício com início na DER (data de entrada do requerimento) e atrasados desde ela; só depois da implantação a continuidade na atividade nociva faz cessar o pagamento.", "fonte": "STF Tema 709, item ii (redação dos ED de 24/02/2021)", "origem": "doutrina-previdenciaria.md §3-A e §5; catalogo-temas-vinculantes.md §7", "sinal": "firme"}, {"id": "esp-037", "tema": "Aposentadoria especial: requisitos e valor", "pergunta": "Estou há anos sem contribuir; ainda posso pedir a especial?", "variantes": ["perdi a qualidade de segurado, e a especial?", "parei de contribuir faz tempo", "sem contribuir posso aposentar especial?"], "resposta": "Sim. A perda da qualidade de segurado não impede a aposentadoria especial, desde que cumpridos o tempo especial e a carência.", "fonte": "Lei 10.666/2003, art. 3º", "origem": "doutrina-previdenciaria.md §6 (Período de graça)", "sinal": "firme"}, {"id": "esp-038", "tema": "Tempo especial: conceito e prova", "pergunta": "O tempo afastado pelo auxílio-doença conta como especial?", "variantes": ["afastado pelo INSS conta como insalubre?", "auxílio-doença no meio do tempo especial", "benefício por incapacidade conta como especial"], "resposta": "Sim, no afastamento até 30/06/2020, para quem exercia atividade especial antes do afastamento, seja o auxílio-doença acidentário ou previdenciário, sem precisar provar relação da doença com o trabalho. Para afastamento a partir de 01/07/2020, o INSS (Instituto Nacional do Seguro Social) não conta o período como especial, e o ponto é controvertido.", "fonte": "STJ Tema 998; TNU Tema 165; IN 128/2022, art. 271, § 2º", "origem": "doutrina-previdenciaria.md §5 (FAVORÁVEL; Contribuinte individual e afastamento); catalogo-temas-vinculantes.md §2 e §4", "sinal": "firme"}, {"id": "esp-039", "tema": "Tempo especial: conceito e prova", "pergunta": "Fiquei afastado depois de julho de 2020; conta como especial?", "variantes": ["afastamento depois de 2020 conta?", "INSS não contou meu auxílio-doença como especial", "auxílio-doença recente e tempo especial"], "resposta": "Para afastamentos por incapacidade a partir de 01/07/2020, o INSS (Instituto Nacional do Seguro Social) não conta o período como especial. Não há tese judicial lida sobre esse período, e a posição do Superior Tribunal de Justiça foi firmada antes dessa regra.", "fonte": "IN 128/2022, art. 271, § 2º; STJ Tema 998", "origem": "doutrina-previdenciaria.md §5 (ADVERSO biológicos; LACUNA ins. R8 c.10); gerente-previdenciario/SKILL.md, Etapa 3", "sinal": "controvertido"}, {"id": "esp-040", "tema": "Tempo especial: conceito e prova", "pergunta": "Autônomo tem direito a tempo especial?", "variantes": ["contribuinte individual tem especial?", "trabalho por conta própria insalubre", "médico autônomo especial", "dentista autônomo aposentadoria especial"], "resposta": "Sim, se comprovar a exposição a agentes nocivos. Até 28/04/1995, prova-se a categoria com documentos ano a ano; depois, o Superior Tribunal de Justiça admite o especial do não cooperado sem formulário emitido por empresa, mas há recurso pendente no Supremo Tribunal Federal e o INSS (Instituto Nacional do Seguro Social) só reconhece o cooperado.", "fonte": "TNU Súm. 62; STJ Tema 1291; IN 128/2022, art. 275; Dec. 3.048/1999, art. 64", "origem": "doutrina-previdenciaria.md §5 (Contribuinte individual e afastamento; ADVERSO); variantes-e-pedidos.md §7.9", "sinal": "controvertido"}, {"id": "esp-041", "tema": "Profissionais da saúde", "pergunta": "Quem trabalha com doentes ou material contaminado tem tempo especial?", "variantes": ["profissional da saúde tem especial?", "enfermeiro aposentadoria especial", "agente biológico", "trabalho em hospital é insalubre?"], "resposta": "Sim, com tempo de 25 anos: até 28/04/1995 por categoria (médicos, dentistas, enfermeiros e outras profissões dos quadros); até 05/03/1997 pelo contato com doentes ou materiais infecto-contagiantes; desde 06/03/1997, em estabelecimento de saúde, no contato com pacientes com doenças infecto-contagiosas ou manuseio de materiais contaminados, além de autópsia, exumação, esgoto e lixo.", "fonte": "Dec. 53.831/1964, 2.1.3 e 1.3.2; Dec. 83.080/1979, Anexos I e II; Dec. 2.172/1997 e Dec. 3.048/1999, Anexo IV, 3.0.1", "origem": "doutrina-previdenciaria.md §5 (Agentes biológicos e profissionais da saúde, tabela)", "sinal": "firme"}, {"id": "esp-042", "tema": "Profissionais da saúde", "pergunta": "Técnico ou auxiliar de enfermagem conta como especial?", "variantes": ["técnica de enfermagem tem especial?", "auxiliar de enfermagem insalubre", "fisioterapeuta tem especial?", "profissão de saúde que não está no decreto"], "resposta": "Até 28/04/1995, por categoria, só por analogia justificada, porque essas funções não estão nominadas nos decretos, e esse ponto não tem regra fechada. Depois disso, conta pela exposição a agentes biológicos provada no PPP (Perfil Profissiográfico Previdenciário), avaliada pela descrição da função, sem exigir tempo mínimo de exposição na jornada.", "fonte": "TNU Temas 198 e 211; Dec. 3.048/1999, Anexo IV, 3.0.1", "origem": "doutrina-previdenciaria.md §5 (Categoria e rol; Habitualidade; LACUNA ins. R8 c.6)", "sinal": "controvertido"}, {"id": "esp-043", "tema": "Profissionais da saúde", "pergunta": "O hospital diz no PPP que o EPI era eficaz; perco o especial?", "variantes": ["EPI na enfermagem", "luva e máscara tiram o especial na saúde?", "UTI com EPI eficaz", "pronto-socorro e EPI"], "resposta": "Até 02/12/1998 o EPI (equipamento de proteção individual) é irrelevante. Depois, a Turma Nacional de Uniformização decidiu que o EPI eficaz não impede o especial do profissional de saúde em procedimento que gera aerossol, urgência ou emergência em UTI (unidade de terapia intensiva), pronto-socorro, centro cirúrgico ou ala de infectocontagiosos, mas a decisão foi por maioria e não transitou. Fora desses setores, cabe impugnar especificamente a eficácia, e a dúvida favorece o trabalhador.", "fonte": "TNU Súm. 87; TNU Tema 383; TNU Tema 213; STJ Tema 1090, item III", "origem": "doutrina-previdenciaria.md §5 (EPI, bloco biológico); catalogo-temas-vinculantes.md §4", "sinal": "controvertido"}, {"id": "esp-044", "tema": "Profissionais da saúde", "pergunta": "Faxineira de hospital tem direito a tempo especial?", "variantes": ["limpeza hospitalar é especial?", "serviços gerais no hospital", "higienização hospitalar insalubre"], "resposta": "Pode ter, porque o código de agentes biológicos alcança a limpeza e higienização hospitalar, mas não por simples categoria: é obrigatório laudo ou formulário do período que prove a exposição. Só a carteira de trabalho não basta.", "fonte": "TNU Súm. 82 e Tema 100; TNU Tema 238", "origem": "doutrina-previdenciaria.md §5 (Limpeza hospitalar; ADVERSO biológicos)", "sinal": "firme"}, {"id": "esp-045", "tema": "Profissionais da saúde", "pergunta": "Agente comunitário de saúde tem aposentadoria especial?", "variantes": ["ACS tem especial?", "agente de endemias aposentadoria especial", "Emenda 120 agente de saúde"], "resposta": "Não automaticamente: a Turma Nacional de Uniformização exige a prova da efetiva exposição, porque a regra da Emenda Constitucional 120/2022 depende de regulamentação. O tema está no Supremo Tribunal Federal com repercussão geral e ainda sem tese.", "fonte": "TNU Tema 347; STF Tema 1470; Constituição Federal, art. 198, § 10", "origem": "doutrina-previdenciaria.md §5 (Agente comunitário; ADVERSO biológicos); catalogo-temas-vinculantes.md §1", "sinal": "controvertido"}, {"id": "esp-046", "tema": "Profissionais da saúde", "pergunta": "Profissional da saúde aposentado na especial pode continuar no hospital?", "variantes": ["enfermeira aposentada especial pode trabalhar?", "suspensão do Tema 709 para saúde", "médico aposentado especial continua atendendo"], "resposta": "A regra geral veda continuar em atividade nociva depois da implantação da aposentadoria especial. Houve suspensão dessa vedação para profissionais de saúde ligada à lei da pandemia (Lei 13.979/2020), mas não se pode afirmar que ela ainda vale; o ponto se confere no portal do Supremo Tribunal Federal na data do caso.", "fonte": "STF Tema 709 (terceiros ED, DJe 04/11/2021); Lei 13.979/2020, art. 3º-J", "origem": "doutrina-previdenciaria.md §5 (LACUNAS do bloco); catalogo-temas-vinculantes.md §1 (Tema 709)", "sinal": "controvertido"}, {"id": "rur-001", "tema": "Segurado especial rural", "pergunta": "Quem é considerado segurado especial?", "variantes": ["quem é trabalhador rural para o INSS", "agricultor familiar é segurado especial?", "pescador artesanal é segurado especial?", "pequeno produtor rural"], "resposta": "É o produtor rural que explora área de até 4 módulos fiscais, o seringueiro ou extrativista vegetal e o pescador artesanal, com o cônjuge ou companheiro e os filhos maiores de 16 anos que trabalham com o grupo, em regime de economia familiar e sem empregados permanentes. Pode ser proprietário, possuidor, assentado, parceiro, meeiro, comodatário ou arrendatário.", "fonte": "Lei 8.213/1991, art. 11, VII e § 1º", "origem": "gerente-previdenciario/SKILL.md, Etapa 1 (Trabalhador rural); variantes-e-pedidos.md §7.8", "sinal": "firme"}, {"id": "rur-002", "tema": "Segurado especial rural", "pergunta": "O que é regime de economia familiar?", "variantes": ["trabalho em família na roça", "economia familiar o que significa", "família que vive da terra"], "resposta": "É o trabalho dos membros da família indispensável à própria subsistência, exercido em mútua dependência e colaboração, sem empregados permanentes.", "fonte": "Lei 8.213/1991, art. 11, § 1º", "origem": "variantes-e-pedidos.md §7.8 (Capítulo 1)", "sinal": "firme"}, {"id": "rur-003", "tema": "Segurado especial rural", "pergunta": "Meus filhos que ajudavam na roça também são segurados especiais?", "variantes": ["filho que trabalha na lavoura é segurado?", "esposa que ajuda na roça", "família toda é segurada?"], "resposta": "Sim. O cônjuge ou companheiro e o filho maior de 16 anos que trabalham com o grupo familiar também são segurados especiais.", "fonte": "Lei 8.213/1991, art. 11, VII", "origem": "gerente-previdenciario/SKILL.md, Etapa 1 (Trabalhador rural)", "sinal": "firme"}, {"id": "rur-004", "tema": "Segurado especial rural", "pergunta": "Ter empregado na propriedade tira a condição de segurado especial?", "variantes": ["contratar peão tira o direito?", "tinha empregado fixo na roça", "mão de obra contratada"], "resposta": "Empregado permanente, sim: o regime de economia familiar exige que não haja empregados permanentes.", "fonte": "Lei 8.213/1991, art. 11, § 1º", "origem": "gerente-previdenciario/SKILL.md, Etapa 1 (Trabalhador rural); variantes-e-pedidos.md §7.8", "sinal": "firme"}, {"id": "rur-005", "tema": "Segurado especial rural", "pergunta": "Minha terra é grande; perco a condição de segurado especial?", "variantes": ["tamanho da propriedade", "mais de 4 módulos fiscais", "terra maior que o módulo rural", "quantos hectares pode ter"], "resposta": "Não por si só: o tamanho da propriedade não descaracteriza o regime de economia familiar quando preenchidos os demais requisitos. A lei fala em até 4 módulos fiscais, e área maior que o módulo rural não afasta a qualificação se a exploração familiar for comprovada.", "fonte": "STJ Tema 1115; TNU Súm. 30; Lei 8.213/1991, art. 11, VII", "origem": "catalogo-temas-vinculantes.md §2 e §3; gerente-previdenciario/SKILL.md, Etapa 1", "sinal": "firme"}, {"id": "rur-006", "tema": "Segurado especial rural", "pergunta": "Meu marido trabalha na cidade; perco a condição de rural?", "variantes": ["esposa com emprego urbano", "filho trabalha na cidade", "alguém da família tem carteira assinada", "membro da família urbano"], "resposta": "Não por si só: o trabalho urbano de um membro da família não descaracteriza os demais como segurados especiais, e analisa-se se o trabalho rural continuava indispensável à subsistência do grupo. Documento em nome do cônjuge que passou ao trabalho urbano deixa de servir como prova rural.", "fonte": "STJ Tema 532; TNU Súm. 41; STJ Tema 533", "origem": "catalogo-temas-vinculantes.md §2 e §3; gerente-previdenciario/SKILL.md, Etapa 1", "sinal": "firme"}, {"id": "rur-007", "tema": "Segurado especial rural", "pergunta": "Trabalhei uns tempos na cidade e voltei para a roça; perdi o direito?", "variantes": ["atividade urbana no meio do tempo rural", "fui para a cidade e voltei", "trabalho urbano intercalado"], "resposta": "Não por si só: a atividade urbana intercalada não impede o benefício de trabalhador rural, analisado o caso. Mas outra atividade remunerada por mais de 120 dias, corridos ou intercalados, no ano civil exclui da condição de segurado especial a partir do mês seguinte.", "fonte": "TNU Súm. 46; Lei 8.213/1991, art. 11, § 9º, III, e § 10, II, b", "origem": "catalogo-temas-vinculantes.md §3; variantes-e-pedidos.md §7.8 (Alertas do script)", "sinal": "firme"}, {"id": "rur-008", "tema": "Segurado especial rural", "pergunta": "Ser associado de cooperativa tira a condição de segurado especial?", "variantes": ["sou sócio da cooperativa agrícola", "cooperativa de crédito rural", "cargo na cooperativa"], "resposta": "Não. A associação em cooperativa vinculada à atividade rural, exceto cooperativa de trabalho, não descaracteriza o segurado especial, nem a atividade remunerada de mandato eletivo nessa cooperativa, desde que sem dedicação exclusiva nem regime integral de trabalho.", "fonte": "Lei 8.213/1991, art. 11, § 8º, VI, a, e § 9º, V, b, 1 (Lei 15.072/2024); Dec. 13.054/2026", "origem": "legislacao-pos-2019.md §3 (Lei 15.072/2024 e Dec. 13.054/2026)", "sinal": "firme"}, {"id": "rur-009", "tema": "Prova rural", "pergunta": "Que documentos provam o trabalho rural?", "variantes": ["como provo que trabalhei na roça", "o que serve de prova rural", "nota de produtor serve?", "documentos da lavoura"], "resposta": "Contrato de arrendamento, parceria ou comodato rural; Declaração de Aptidão ao Pronaf (Programa Nacional de Fortalecimento da Agricultura Familiar); bloco de notas do produtor; notas fiscais de venda da produção; comprovante de entrega a cooperativa; comprovante de contribuição sobre a comercialização; declaração de imposto de renda com renda rural; licença do Incra (Instituto Nacional de Colonização e Reforma Agrária).", "fonte": "Lei 8.213/1991, art. 106", "origem": "gerente-previdenciario/SKILL.md, Etapa 1 (Caso rural ou híbrido: prova a pedir)", "sinal": "firme"}, {"id": "rur-010", "tema": "Prova rural", "pergunta": "Certidão de casamento dizendo lavrador serve de prova?", "variantes": ["profissão de agricultor na certidão", "documento em nome do marido serve?", "certidão de nascimento dos filhos com lavrador"], "resposta": "Sim. Certidão de casamento ou outro documento que qualifique o cônjuge como trabalhador rural é início de prova material, salvo se o cônjuge passou ao trabalho urbano.", "fonte": "TNU Súm. 6; STJ Tema 533", "origem": "catalogo-temas-vinculantes.md §3 (Súm. 6/TNU); gerente-previdenciario/SKILL.md, Etapa 1", "sinal": "firme"}, {"id": "rur-011", "tema": "Prova rural", "pergunta": "Só com testemunhas dá para provar que trabalhei na roça?", "variantes": ["não tenho documento, só vizinhos", "prova só testemunhal", "testemunha basta?", "sem papel nenhum da roça"], "resposta": "Não. Prova só testemunhal não basta para comprovar atividade rural; é preciso início de prova material da época, que as testemunhas complementam. Sem documento, a ação é extinta sem julgamento do mérito e pode ser proposta de novo quando houver prova.", "fonte": "Súm. 149/STJ; Lei 8.213/1991, art. 55, § 3º; STJ Tema 629", "origem": "doutrina-previdenciaria.md §6 (Rural; ADVERSO Súm. 149); catalogo-temas-vinculantes.md §3 e §7", "sinal": "firme"}, {"id": "rur-012", "tema": "Prova rural", "pergunta": "Preciso de documento de todos os anos que trabalhei na roça?", "variantes": ["documento de cada ano", "tenho papel só de alguns anos", "tempo antes do documento mais antigo"], "resposta": "Não. O início de prova material não precisa cobrir todo o período, e testemunhas convincentes estendem o tempo inclusive para antes do documento mais antigo. Mas o documento deve ser da época dos fatos que prova.", "fonte": "TNU Súm. 14; Súm. 577/STJ; STJ Tema 638; TNU Súm. 34", "origem": "catalogo-temas-vinculantes.md §2 e §3; doutrina-previdenciaria.md §6 (Rural, Prova)", "sinal": "firme"}, {"id": "rur-013", "tema": "Prova rural", "pergunta": "Como funciona a autodeclaração rural?", "variantes": ["autodeclaração do segurado especial", "cadastro no CNIS do agricultor", "depois de 2023 como provo rural"], "resposta": "Para atividade até 31/12/2022, o segurado especial prova pela autodeclaração ratificada por entidade pública credenciada ou pelos documentos da lei. A partir de 01/01/2023, a prova é exclusivamente o cadastro do segurado especial no CNIS (Cadastro Nacional de Informações Sociais).", "fonte": "Lei 8.213/1991, art. 38-B, §§ 1º e 2º", "origem": "doutrina-previdenciaria.md §6 (Rural, Prova); gerente-previdenciario/SKILL.md, Etapa 1", "sinal": "firme"}, {"id": "rur-014", "tema": "Prova rural", "pergunta": "E se meu cadastro de segurado especial ficou sem atualizar?", "variantes": ["cadastro rural desatualizado", "não atualizei o CNIS rural", "cadastro parado há anos"], "resposta": "Cadastro sem atualização por cinco anos restringe o cômputo: o período só conta com comercialização e contribuição em época própria. O alcance exato dessa restrição ainda não está fechado.", "fonte": "Lei 8.213/1991, art. 38-A, §§ 4º a 6º", "origem": "variantes-e-pedidos.md §7.8 (Alertas do script; LACUNA insumo R7a c.10); gerente-previdenciario/SKILL.md, Etapa 1", "sinal": "controvertido"}, {"id": "rur-015", "tema": "Prova rural", "pergunta": "O INSS ouve testemunhas sobre o trabalho rural?", "variantes": ["justificação administrativa", "levar testemunha no INSS", "quantas testemunhas"], "resposta": "Sim, pela justificação administrativa, com 2 a 6 testemunhas, que complementam o início de prova material. Não cabe recurso da decisão que considera a justificação eficaz ou ineficaz.", "fonte": "Dec. 3.048/1999, arts. 142 a 151 (art. 147); Lei 8.213/1991, art. 55, § 3º", "origem": "doutrina-previdenciaria.md §6 (Justificação administrativa e Prova do tempo)", "sinal": "firme"}, {"id": "rur-016", "tema": "Prova rural", "pergunta": "Boia-fria sem registro consegue provar o tempo rural?", "variantes": ["diarista rural sem carteira", "trabalhava por dia na lavoura", "safrista sem registro"], "resposta": "Sim, mas também precisa de início de prova material; prova material de só parte do período basta se complementada por testemunhas idôneas e robustas.", "fonte": "STJ Tema 554; Súm. 149/STJ", "origem": "catalogo-temas-vinculantes.md §7 (STJ Tema 554)", "sinal": "firme"}, {"id": "rur-017", "tema": "Prova rural", "pergunta": "Diarista rural eventual depois de 2010 precisa contribuir?", "variantes": ["trabalhador rural eventual", "contribuinte individual rural", "diarista rural recente conta sem pagar?"], "resposta": "Sim. O contribuinte individual rural eventual, depois de 31/12/2010, só tem contados os meses com recolhimento.", "fonte": "Lei 8.213/1991, art. 11, V, g; insumo R7a a.2", "origem": "variantes-e-pedidos.md §7.8 (Alertas do script); gerente-previdenciario/SKILL.md, Etapa 1-A", "sinal": "firme"}, {"id": "rur-018", "tema": "Tempo rural e contagem", "pergunta": "O tempo de roça antes de 1991, sem contribuição, conta?", "variantes": ["tempo rural antigo sem pagar INSS", "roça antes de 1991", "tempo de lavoura sem contribuição"], "resposta": "Sim, conta como tempo de contribuição, mas não como carência nas aposentadorias urbanas. Na aposentadoria híbrida por idade, esse tempo conta também para a carência. As fontes divergem se o marco é 24/07/1991 (lei) ou 31/10/1991 (decreto).", "fonte": "Lei 8.213/1991, art. 55, § 2º; TNU Súm. 24; STJ Tema 1007", "origem": "doutrina-previdenciaria.md §6 (Rural, Cômputo e Híbrida)", "sinal": "firme"}, {"id": "rur-019", "tema": "Tempo rural e contagem", "pergunta": "Tempo de roça depois de 1991 conta para aposentadoria por tempo de contribuição?", "variantes": ["rural depois de 1991 sem contribuir", "segurado especial e tempo de contribuição", "contribuição facultativa do rural"], "resposta": "Só com contribuição facultativa: o tempo de segurado especial posterior a 1991 só conta como tempo de contribuição se ele recolheu contribuições facultativas.", "fonte": "Lei 8.213/1991, art. 39, II; Súm. 272/STJ", "origem": "doutrina-previdenciaria.md §6 (Rural, Cômputo); catalogo-temas-vinculantes.md §3", "sinal": "firme"}, {"id": "rur-020", "tema": "Tempo rural e contagem", "pergunta": "Fui empregado rural com carteira antes de 1991; conta como carência?", "variantes": ["empregado de fazenda registrado", "carteira assinada na roça antes de 91", "empregado rural e carência"], "resposta": "Sim. O tempo de empregado rural registrado em CTPS (Carteira de Trabalho e Previdência Social) antes de 1991 conta para a carência, porque o empregado não responde pelo recolhimento.", "fonte": "STJ Tema 644", "origem": "catalogo-temas-vinculantes.md §2 e §7 (STJ Tema 644)", "sinal": "firme"}, {"id": "rur-021", "tema": "Tempo rural e contagem", "pergunta": "Trabalhei na roça desde criança; esse tempo conta?", "variantes": ["trabalho rural na infância", "desde os 12 anos na lavoura", "menor de idade na roça"], "resposta": "Sim, até 24/07/1991: o trabalho rural comprovado a partir dos 12 anos pode ser reconhecido para fins previdenciários.", "fonte": "TNU Súm. 5", "origem": "catalogo-temas-vinculantes.md §3 (Súm. 5/TNU); variantes-e-pedidos.md §7.8", "sinal": "firme"}, {"id": "rur-022", "tema": "Tempo rural e contagem", "pergunta": "Trabalho rural de menor depois de 1991 conta?", "variantes": ["criança na roça nos anos 90", "menor de 14 anos trabalhando depois de 1991", "trabalho infantil rural recente"], "resposta": "Não há regra firmada nas fontes: o reconhecimento do trabalho de menor de 14 anos entre 25/07/1991 e 22/06/2008, e de menor de 16 anos a partir de 23/06/2008, é ponto em aberto.", "fonte": "TNU Súm. 5 (limite temporal); insumo R7a c.15", "origem": "variantes-e-pedidos.md §7.8 (Alertas) e §10 (lacuna 19)", "sinal": "controvertido"}, {"id": "rur-023", "tema": "Tempo rural e contagem", "pergunta": "Posso pagar o INSS pelo tempo de roça que não contribuí?", "variantes": ["indenizar tempo rural", "pagar atrasado do tempo de lavoura", "multa para pagar tempo rural"], "resposta": "Quando a indenização é exigida, o período conta como tempo depois de pago, e desde a Lei 15.363/2026 não incide a multa de 10% sobre o tempo rural do empregado rural ou do segurado especial anterior à obrigatoriedade de filiação. Em regra, o período indenizado não conta para a carência.", "fonte": "Lei 8.212/1991, art. 45-A, caput e § 4º; Lei 8.213/1991, art. 27, II", "origem": "doutrina-previdenciaria.md §6 (Indenização do art. 45-A e Decadência)", "sinal": "firme"}, {"id": "rur-024", "tema": "Aposentadoria rural e híbrida", "pergunta": "Com que idade o trabalhador rural se aposenta?", "variantes": ["idade da aposentadoria rural", "agricultor aposenta com quantos anos", "55 anos mulher da roça", "aposentadoria por idade rural"], "resposta": "60 anos o homem e 55 anos a mulher, com 180 meses de atividade rural, ainda que descontínua. Vale para segurado especial, empregado e avulso rurais e contribuinte individual rural eventual, e a Reforma da Previdência não mudou essas idades.", "fonte": "Lei 8.213/1991, art. 48, §§ 1º e 2º; Constituição Federal, art. 201, § 7º, II", "origem": "doutrina-previdenciaria.md §2 e §6 (Rural); gerente-previdenciario/SKILL.md, Etapa 1", "sinal": "firme"}, {"id": "rur-025", "tema": "Aposentadoria rural e híbrida", "pergunta": "Parei de trabalhar na roça há anos; ainda me aposento como rural?", "variantes": ["saí do campo antes da idade", "não trabalho mais na lavoura", "precisa estar na roça para aposentar?"], "resposta": "Em regra, não: os 180 meses rurais devem estar no período imediatamente anterior ao requerimento ou ao dia em que completou a idade, e o segurado especial tem de estar no campo ao completar a idade. Quem já tinha reunido idade e carência no campo antes de sair tem direito adquirido.", "fonte": "TNU Súm. 54; STJ Tema 642", "origem": "doutrina-previdenciaria.md §6 (Rural); catalogo-temas-vinculantes.md §7 (STJ Tema 642)", "sinal": "firme"}, {"id": "rur-026", "tema": "Aposentadoria rural e híbrida", "pergunta": "O que é aposentadoria híbrida?", "variantes": ["juntar tempo rural e urbano", "aposentadoria mista", "híbrida idade e requisitos", "trabalhei na roça e na cidade"], "resposta": "É a aposentadoria por idade que soma tempo rural e urbano. Pela leitura do INSS (Instituto Nacional do Seguro Social), exige 65 anos (homem) ou 62 (mulher) e 20 anos (homem) ou 15 (mulher) de contribuição; a tese pela letra da Lei 8.213 pede 65 (homem) ou 60 (mulher), sem tempo mínimo de contribuição, mas não há precedente vinculante sobre ela depois da Reforma da Previdência.", "fonte": "Lei 8.213/1991, art. 48, § 3º; Dec. 3.048/1999, arts. 51 e 57", "origem": "doutrina-previdenciaria.md §6 (Rural, Híbrida); gerente-previdenciario/SKILL.md, Etapa 3 (Híbrida)", "sinal": "controvertido"}, {"id": "rur-027", "tema": "Aposentadoria rural e híbrida", "pergunta": "Trabalhei na roça quando jovem e depois na cidade; posso usar o tempo rural na aposentadoria por idade?", "variantes": ["tempo rural remoto na híbrida", "roça muito antiga conta?", "tempo rural descontínuo"], "resposta": "Sim, na aposentadoria híbrida: o tempo rural anterior a 1991, ainda que remoto, descontínuo e sem contribuição, conta para a carência, seja qual for o trabalho que predominou ou o exercido ao completar a idade.", "fonte": "STJ Tema 1007; STF Tema 1104", "origem": "catalogo-temas-vinculantes.md §7 (STJ Tema 1007); doutrina-previdenciaria.md §6", "sinal": "firme"}, {"id": "rur-028", "tema": "Aposentadoria rural e híbrida", "pergunta": "Tempo rural depois de 1991 sem contribuição entra na híbrida?", "variantes": ["rural recente na aposentadoria híbrida", "roça depois de 91 na carência", "híbrida com tempo rural novo"], "resposta": "Pela letra da Lei 8.213 entra, mas não há tese repetitiva que confirme; é leitura do texto, sujeita a divergência.", "fonte": "Lei 8.213/1991, art. 48, § 3º", "origem": "doutrina-previdenciaria.md §6 (Híbrida; LACUNA insumo R7a c.5); variantes-e-pedidos.md §7.8", "sinal": "controvertido"}, {"id": "rur-029", "tema": "Aposentadoria rural e híbrida", "pergunta": "O tempo rural aumenta o valor da minha aposentadoria por idade?", "variantes": ["tempo de roça aumenta o percentual?", "rural sem contribuição melhora o valor?", "coeficiente da aposentadoria por idade"], "resposta": "Na regra anterior à Reforma da Previdência (direito adquirido até 13/11/2019), não: o tempo rural sem contribuição averbado não aumenta o percentual de cálculo da aposentadoria por idade (70% mais 1% por grupo de 12 contribuições). Para o cálculo posterior à Reforma (60% mais 2 pontos percentuais por ano de contribuição acima do mínimo), as fontes não tratam do ponto.", "fonte": "TNU Súm. 76; Lei 8.213/1991, art. 50; Emenda Constitucional 103/2019, art. 26, § 2º", "origem": "catalogo-temas-vinculantes.md §3 (Súm. 76/TNU); doutrina-previdenciaria.md §3 (art. 50 só como direito adquirido) e §4 (coeficiente pós-EC 103)", "sinal": "controvertido"}, {"id": "inc-001", "tema": "Auxílio por incapacidade temporária", "pergunta": "Quem tem direito ao auxílio-doença?", "variantes": ["quando posso ficar encostado pelo INSS", "tenho direito a auxílio por incapacidade", "fiquei doente e não consigo trabalhar, o INSS paga?"], "resposta": "Tem direito o segurado incapaz para o trabalho ou para a sua atividade habitual por mais de 15 dias consecutivos, com a carência cumprida quando ela for exigida. O nome atual é auxílio por incapacidade temporária; a lei ainda usa auxílio-doença. Doença ou lesão que já existia antes da filiação não gera o benefício, salvo se houve progressão ou agravamento.", "fonte": "Lei 8.213/1991, art. 59, caput e § 1º; Dec. 3.048/1999, art. 71", "origem": "doutrina-incapacidade.md §7 (Auxílio por incapacidade temporária: requisito e valor)", "sinal": "firme"}, {"id": "inc-002", "tema": "Auxílio por incapacidade temporária", "pergunta": "Quanto eu recebo de auxílio-doença?", "variantes": ["qual o valor do encostamento", "o auxílio-doença paga o salário inteiro?", "quanto paga o auxílio por incapacidade"], "resposta": "91% do salário de benefício, que é a média de 100% dos salários de contribuição desde 07/1994, atualizados. Para fato gerador desde 01/03/2015, o valor não pode passar da média simples dos 12 últimos salários de contribuição. Nunca fica acima do teto nem abaixo do salário mínimo; abaixo do mínimo só pode ficar para quem trabalha em mais de uma atividade e está incapaz para uma delas.", "fonte": "Lei 8.213/1991, arts. 29, § 10, 33 e 61; EC 103/2019, art. 26, caput", "origem": "doutrina-incapacidade.md §7 (Auxílio por incapacidade temporária: requisito e valor)", "sinal": "firme"}, {"id": "inc-003", "tema": "Auxílio por incapacidade temporária", "pergunta": "O auxílio-doença por acidente de trabalho paga mais que o comum?", "variantes": ["B91 paga mais que B31?", "auxílio acidentário tem valor maior", "encostado por acidente ganha mais"], "resposta": "Não. O B91 (auxílio por incapacidade temporária acidentário) e o B31 (auxílio por incapacidade temporária comum) pagam os mesmos 91% do salário de benefício. A diferença de valor entre comum e acidentário só aparece na aposentadoria por incapacidade permanente, que é de 100% quando acidentária.", "fonte": "Lei 8.213/1991, art. 61; Dec. 3.048/1999, art. 72; EC 103/2019, art. 26, § 3º, II", "origem": "doutrina-incapacidade.md §7 (Auxílio por incapacidade temporária: requisito e valor; Aposentadoria por incapacidade permanente)", "sinal": "firme"}, {"id": "inc-004", "tema": "Auxílio por incapacidade temporária", "pergunta": "Quem paga os primeiros 15 dias de afastamento?", "variantes": ["a empresa paga os 15 dias?", "quando o INSS começa a pagar", "primeiros quinze dias do atestado"], "resposta": "A empresa paga os 15 primeiros dias do empregado. O INSS (Instituto Nacional do Seguro Social) paga a partir do 16º dia de afastamento. Se houver novo afastamento pelo mesmo motivo dentro de 60 dias, a empresa fica desobrigada e o benefício anterior é prorrogado.", "fonte": "Lei 8.213/1991, art. 60, caput e § 3º; Dec. 3.048/1999, art. 75, §§ 3º a 5º", "origem": "doutrina-incapacidade.md §7 (Data de início, duração e cessação)", "sinal": "firme"}, {"id": "inc-005", "tema": "Auxílio por incapacidade temporária", "pergunta": "A partir de quando o auxílio-doença é pago?", "variantes": ["desde quando recebo o benefício", "autônomo recebe desde o primeiro dia?", "pedi o auxílio atrasado, perco os dias?"], "resposta": "Empregado, salvo o doméstico, recebe a partir do 16º dia do afastamento; doméstico, autônomo e demais segurados, desde a DII (data de início da incapacidade). Se o pedido for feito depois do 30º dia do afastamento, o benefício começa na DER (data de entrada do requerimento). Se a incapacidade começou depois do pedido, começa na data de início da incapacidade.", "fonte": "Lei 8.213/1991, art. 60, caput e § 1º; Dec. 3.048/1999, art. 72, I a III; IN 128/2022, art. 336", "origem": "doutrina-incapacidade.md §7 (Data de início, duração e cessação)", "sinal": "firme"}, {"id": "inc-006", "tema": "Auxílio por incapacidade temporária", "pergunta": "Trabalho em dois empregos e fiquei incapaz só para um. Recebo?", "variantes": ["tenho duas atividades, posso receber auxílio-doença de uma", "dois vínculos e encostado em um", "trabalho em dois lugares e me afastei de um"], "resposta": "Sim. O segurado com mais de uma atividade recebe o benefício pela atividade em que está incapaz, e a carência é contada só dela. Nesse caso o valor pode ficar abaixo do salário mínimo, quando somado às outras remunerações o total supera o mínimo.", "fonte": "Dec. 3.048/1999, arts. 73 e 74; IN 128/2022, art. 337", "origem": "doutrina-incapacidade.md §7 (Data de início, duração e cessação)", "sinal": "firme"}, {"id": "inc-007", "tema": "Auxílio por incapacidade temporária", "pergunta": "Preso recebe auxílio-doença?", "variantes": ["quem está na cadeia recebe encostamento", "fui preso recebendo auxílio", "recluso tem auxílio por incapacidade"], "resposta": "Não, se estiver em regime fechado. Se já recebia e foi preso, o benefício fica suspenso por até 60 dias e depois é cessado.", "fonte": "Lei 8.213/1991, art. 59, §§ 2º a 8º; Dec. 3.048/1999, art. 71, §§ 3º a 9º", "origem": "doutrina-incapacidade.md §7 (Data de início, duração e cessação)", "sinal": "firme"}, {"id": "inc-008", "tema": "Auxílio por incapacidade temporária", "pergunta": "Meu auxílio acabou e piorei. Quando posso pedir de novo?", "variantes": ["cortaram meu auxílio, posso pedir outro", "novo pedido de auxílio-doença depois da alta", "voltou a doença depois que cessou"], "resposta": "Novo requerimento só depois de 30 dias da data do exame, da DCB (data de cessação do benefício) ou da cessação administrativa. Se for a mesma espécie e a mesma causa, com início em até 60 dias da cessação, o INSS (Instituto Nacional do Seguro Social) restabelece o benefício anterior em vez de conceder um novo.", "fonte": "IN 128/2022, arts. 346 e 347", "origem": "doutrina-incapacidade.md §7 (Data de início, duração e cessação); gerente-previdenciario SKILL.md Etapa 1-B", "sinal": "firme"}, {"id": "inc-009", "tema": "Perícia, Atestmed e prorrogação", "pergunta": "Dá para conseguir auxílio-doença só mandando atestado, sem perícia?", "variantes": ["o que é Atestmed", "auxílio pelo atestado no Meu INSS", "análise documental do INSS"], "resposta": "Sim, por análise documental (Atestmed), que concede pelo exame da documentação médica ou odontológica. O benefício assim concedido dura no máximo 30 dias, e a soma dos benefícios por análise documental fica limitada a 30 dias, mesmo que não consecutivos; acima disso, exige perícia presencial ou por telemedicina. Parecer favorável em perícia presencial ou por telemedicina no requerimento imediatamente anterior reinicia esse limite.", "fonte": "Lei 8.213/1991, art. 60, §§ 11-F e 11-G (Lei 15.265/2025); Portaria Conjunta MPS/INSS 13/2026, art. 3º, alterada pela 54/2026", "origem": "doutrina-incapacidade.md §7 (Análise documental (Atestmed))", "sinal": "firme"}, {"id": "inc-010", "tema": "Perícia, Atestmed e prorrogação", "pergunta": "O Atestmed pode dar mais de 30 dias?", "variantes": ["limite de 90 dias no atestado", "quantos dias o Atestmed concede", "análise documental de 90 dias ainda vale?"], "resposta": "A lei fixa 30 dias, mas permite exceção por ato do Executivo, justificada e por prazo determinado. A Portaria Conjunta 14/2026 ampliou o limite para 90 dias por 180 dias, e a Portaria Conjunta 43/2026 prorrogou essa ampliação por 365 dias. Nenhum ato lido diz de quando contam esses 365 dias, então o termo final do limite de 90 dias está em aberto.", "fonte": "Lei 8.213/1991, art. 60, § 11-I; Portarias Conjuntas MPS/INSS 14/2026 e 43/2026", "origem": "doutrina-incapacidade.md §7 (Análise documental (Atestmed)), LACUNA ins. R24-17 c.4", "sinal": "controvertido"}, {"id": "inc-011", "tema": "Perícia, Atestmed e prorrogação", "pergunta": "O INSS negou meu pedido pelo Atestmed. E agora?", "variantes": ["indeferiram o atestado", "negaram a análise documental", "Atestmed recusado, o que fazer"], "resposta": "Cabe recurso em 30 dias da decisão. O pedido de reanálise da documentação, em 10 dias da ciência, só vale para indeferimento cientificado a partir da Portaria Conjunta 54/2026, publicada em 06/11/2026. Depois de dois indeferimentos sucessivos por análise documental, os pedidos seguintes vão para perícia presencial.", "fonte": "Portaria Conjunta MPS/INSS 13/2026, arts. 8º, 8º-A e 13, red. Portaria Conjunta 54/2026", "origem": "doutrina-incapacidade.md §7 (Análise documental (Atestmed))", "sinal": "firme"}, {"id": "inc-012", "tema": "Perícia, Atestmed e prorrogação", "pergunta": "Auxílio por acidente de trabalho sai pelo Atestmed?", "variantes": ["B91 pela análise documental", "acidentário pelo atestado", "auxílio acidentário sem perícia"], "resposta": "Só se o nexo técnico previdenciário for reconhecido pela Perícia Médica Federal. Sem esse reconhecimento, a análise documental não concede o benefício como acidentário.", "fonte": "Portaria Conjunta MPS/INSS 13/2026", "origem": "doutrina-incapacidade.md §7 (Análise documental (Atestmed))", "sinal": "firme"}, {"id": "inc-013", "tema": "Perícia, Atestmed e prorrogação", "pergunta": "O que é alta programada? O auxílio acaba sozinho?", "variantes": ["data de cessação do auxílio", "o INSS marca a data da alta", "auxílio sem prazo dura quanto"], "resposta": "Sim. O ato de concessão fixa, sempre que possível, um prazo estimado de duração, e o benefício cessa nessa data. Sem prazo fixado, cessa em 120 dias da concessão ou da reativação. Nos dois casos, cessa salvo pedido de prorrogação.", "fonte": "Lei 8.213/1991, art. 60, §§ 8º e 9º; Dec. 3.048/1999, art. 78, §§ 1º a 4º; IN 128/2022, art. 344", "origem": "doutrina-incapacidade.md §7 (Data de início, duração e cessação)", "sinal": "firme"}, {"id": "inc-014", "tema": "Perícia, Atestmed e prorrogação", "pergunta": "Como peço prorrogação do auxílio-doença?", "variantes": ["ainda não estou bom, como prorrogo", "pedido de prorrogação do encostamento", "prazo para prorrogar o benefício"], "resposta": "O pedido de prorrogação é feito nos últimos 15 dias do benefício. Feito no prazo, evita a cessação automática na data fixada ou nos 120 dias. Para benefícios sem data de cessação, a TNU (Turma Nacional de Uniformização) admite a revisão com convocação e o pedido de prorrogação com pagamento até a perícia.", "fonte": "IN 128/2022, art. 339, § 3º, red. IN 212/2026; TNU Tema 164", "origem": "doutrina-incapacidade.md §7 (Data de início, duração e cessação; Precedentes)", "sinal": "firme"}, {"id": "inc-015", "tema": "Perícia, Atestmed e prorrogação", "pergunta": "O juiz deu prazo de recuperação. Conta de quando?", "variantes": ["prazo fixado na perícia judicial", "perito disse 3 meses, conta desde quando", "DCB fixada pelo juiz"], "resposta": "O prazo de recuperação fixado na perícia conta da data do exame, com mínimo de 30 dias a partir da implantação. Sem prazo fixado, os 120 dias contam da implantação ou do restabelecimento.", "fonte": "TNU Tema 246", "origem": "doutrina-incapacidade.md §7 (Precedentes)", "sinal": "firme"}, {"id": "inc-016", "tema": "Perícia, Atestmed e prorrogação", "pergunta": "O perito disse que minha incapacidade começou no dia da perícia. Pode isso?", "variantes": ["DII na data da perícia", "perito fixou o início da doença no dia do exame", "data de início da incapacidade errada"], "resposta": "Só excepcionalmente. Para a TNU (Turma Nacional de Uniformização), fixar a DII (data de início da incapacidade) na data da perícia é excepcional e exige fundamentação.", "fonte": "TNU Tema 343", "origem": "doutrina-incapacidade.md §7 (Precedentes)", "sinal": "firme"}, {"id": "inc-017", "tema": "Perícia, Atestmed e prorrogação", "pergunta": "Sou obrigado a fazer perícia, tratamento e cirurgia para manter o benefício?", "variantes": ["o INSS pode me obrigar a operar", "se eu faltar na perícia cortam", "tenho que fazer o tratamento que o INSS mandar?"], "resposta": "Perícia, reabilitação profissional e tratamento gratuito são obrigatórios, sob pena de suspensão do benefício, mesmo que concedido na Justiça. Cirurgia e transfusão de sangue são facultativas. A recuperação que dependa de cirurgia não autoriza, por si só, a aposentadoria por incapacidade permanente.", "fonte": "Lei 8.213/1991, art. 101, I a III (Lei 14.441/2022); TNU Tema 272", "origem": "03_TESES/legislacao/leis/Lei-8213-1991 (art. 101); doutrina-incapacidade.md §7 (Precedentes)", "sinal": "firme"}, {"id": "inc-018", "tema": "Perícia, Atestmed e prorrogação", "pergunta": "O INSS pode me chamar para nova perícia mesmo aposentado por invalidez?", "variantes": ["pente-fino do INSS", "revisão do aposentado por invalidez", "convocação para perícia de revisão"], "resposta": "Sim. O aposentado por incapacidade permanente e quem recebe auxílio por incapacidade temporária, concedidos na Justiça ou no INSS (Instituto Nacional do Seguro Social), podem ser convocados a qualquer momento para reavaliação. Ficam dispensados os segurados com aids, Alzheimer, Parkinson e esclerose lateral amiotrófica, e o aposentado cuja perícia constatou incapacidade permanente, irreversível ou irrecuperável, salvo suspeita fundada de fraude ou erro.", "fonte": "Lei 8.213/1991, art. 43, §§ 4º a 6º, e art. 60, §§ 10 e 15 (Lei 15.157/2025)", "origem": "doutrina-incapacidade.md §7 (Data de início, duração e cessação); legislacao-pos-2019.md §3 (Lei 15.157/2025)", "sinal": "firme"}, {"id": "inc-019", "tema": "Perícia, Atestmed e prorrogação", "pergunta": "Aposentado por invalidez com mais de 60 anos ainda faz perícia?", "variantes": ["idoso aposentado por invalidez é chamado para perícia", "com 60 anos fico livre do pente-fino", "isenção de perícia por idade"], "resposta": "Não, se não voltou a trabalhar: o aposentado por incapacidade permanente e o pensionista inválido ficam isentos do exame depois dos 60 anos. A isenção não vale quando o exame serve para conceder o adicional de 25%, para verificar recuperação a pedido do próprio aposentado ou para subsidiar curatela.", "fonte": "Lei 8.213/1991, art. 101, §§ 1º, II, e 2º", "origem": "03_TESES/legislacao/leis/Lei-8213-1991 (art. 101)", "sinal": "firme"}, {"id": "inc-020", "tema": "Perícia, Atestmed e prorrogação", "pergunta": "Dá para recorrer da perícia do INSS administrativamente?", "variantes": ["recurso contra perícia negada", "recorrer à Junta de Recursos", "perícia disse que estou apto, como recorro"], "resposta": "Sim. O recurso ordinário à Junta de Recursos é feito em 30 dias da ciência da decisão, em prazo contínuo. Matéria exclusivamente médica (incapacidade, auxílio-acidente, data de início da doença e da incapacidade, data de cessação) é de alçada exclusiva da Junta e não sobe à Câmara de Julgamento. Entrar com ação com o mesmo pedido importa renúncia ao recurso administrativo.", "fonte": "Dec. 3.048/1999, arts. 305, § 1º, e 307; IN 128/2022, art. 580; Regimento Interno do CRPS, arts. 78 e 89, § 3º; Lei 8.213/1991, art. 126, § 3º", "origem": "competencia-e-rito.md §9; gerente-previdenciario SKILL.md Etapa 1-B", "sinal": "firme"}, {"id": "inc-021", "tema": "Perícia, Atestmed e prorrogação", "pergunta": "O INSS está demorando para analisar meu auxílio. Tem prazo?", "variantes": ["perícia não marca", "INSS não responde o pedido de auxílio", "demora na análise do benefício"], "resposta": "O parâmetro é o acordo homologado no RE (recurso extraordinário) 1.171.152: 45 dias para incapacidade temporária e permanente e 60 dias para auxílio-acidente, contados do fim da instrução, e perícia em até 45 dias do agendamento (90 nas unidades de difícil provimento). A via contra a demora é o mandado de segurança, em 120 dias. A vigência atual do acordo, firmado por 24 meses desde 10/06/2021, não foi confirmada.", "fonte": "Acordo no RE 1.171.152 (Tema 1.066/STF, cancelado sem tese); Lei 12.016/2009, art. 23", "origem": "competencia-e-rito.md §9 (Mora do INSS e LACUNAS da via administrativa)", "sinal": "controvertido"}, {"id": "inc-022", "tema": "Aposentadoria por incapacidade permanente", "pergunta": "Quem tem direito à aposentadoria por invalidez?", "variantes": ["como me aposento por invalidez", "aposentadoria por incapacidade permanente, quem pode", "não tenho mais condição de trabalhar em nada"], "resposta": "Tem direito o segurado incapaz para o trabalho e insuscetível de reabilitação para atividade que lhe garanta a subsistência, recebendo ou não auxílio por incapacidade temporária antes. O nome atual é aposentadoria por incapacidade permanente; a lei ainda diz aposentadoria por invalidez. Exige carência de 12 contribuições, salvo as isenções.", "fonte": "Lei 8.213/1991, arts. 25, I, e 42; Dec. 3.048/1999, art. 43", "origem": "doutrina-incapacidade.md §7 (Aposentadoria por incapacidade permanente; Carência e isenção)", "sinal": "firme"}, {"id": "inc-023", "tema": "Aposentadoria por incapacidade permanente", "pergunta": "Quanto paga a aposentadoria por invalidez hoje?", "variantes": ["aposentadoria por invalidez paga 100%?", "valor da aposentadoria por incapacidade depois da reforma", "por que minha aposentadoria por invalidez veio baixa"], "resposta": "Para fato gerador desde 14/11/2019: 60% do salário de benefício mais 2 pontos percentuais por ano de contribuição acima de 20 anos (homem) ou 15 anos (mulher). Se decorrer de acidente do trabalho, doença profissional ou do trabalho, é 100%. Fato gerador até 13/11/2019 garante 100%, pelo direito adquirido.", "fonte": "EC 103/2019, art. 26, §§ 2º, III, 3º, II, e 5º; Lei 8.213/1991, art. 44; Dec. 3.048/1999, art. 44", "origem": "doutrina-incapacidade.md §7 (Aposentadoria por incapacidade permanente)", "sinal": "firme"}, {"id": "inc-024", "tema": "Aposentadoria por incapacidade permanente", "pergunta": "Dá para pedir na Justiça os 100% da aposentadoria por invalidez comum, dizendo que a reforma é inconstitucional?", "variantes": ["revisão da aposentadoria por invalidez para 100%", "os 60% da invalidez são inconstitucionais?", "Tema 1.300 do STF"], "resposta": "Não. O STF (Supremo Tribunal Federal) decidiu no Tema 1.300, com trânsito em julgado em 18/04/2026, que é constitucional o cálculo de 60% mais 2 pontos percentuais da aposentadoria por incapacidade permanente não acidentária quando a incapacidade é constatada depois da reforma. Os 100% só cabem na aposentadoria acidentária ou com fato gerador até 13/11/2019.", "fonte": "STF Tema 1.300 (RE 1.469.150), ADVERSO", "origem": "doutrina-incapacidade.md §7 (bloco ADVERSO: STF Tema 1.300); catalogo-temas-vinculantes-2.md §1", "sinal": "firme"}, {"id": "inc-025", "tema": "Aposentadoria por incapacidade permanente", "pergunta": "Fiquei incapaz antes da reforma, mas a perícia foi depois. Qual regra vale?", "variantes": ["doença começou antes de 13/11/2019 e perícia depois", "invalidez antes da reforma, direito a 100%?", "data que conta para a regra da aposentadoria por invalidez"], "resposta": "Está em aberto. A tese do STF (Supremo Tribunal Federal) no Tema 1.300 fala em incapacidade constatada depois da reforma, e a IN (Instrução Normativa) 128/2022 fala em fato gerador a partir de 14/11/2019. Se o marco é a DII (data de início da incapacidade) ou a data da perícia depende do acórdão, que não foi lido.", "fonte": "STF Tema 1.300; IN 128/2022, art. 233, II", "origem": "doutrina-incapacidade.md §7 (Aposentadoria por incapacidade permanente), LACUNA ins. R24-17 c.12", "sinal": "controvertido"}, {"id": "inc-026", "tema": "Aposentadoria por incapacidade permanente", "pergunta": "Estou no auxílio-doença e vão me aposentar por invalidez. Muda o valor?", "variantes": ["transformação do auxílio em aposentadoria", "conversão do auxílio-doença em aposentadoria por invalidez", "o auxílio vira aposentadoria, qual o valor"], "resposta": "Sim. Com fato gerador até 13/11/2019, a aposentadoria é 100% do salário de benefício do auxílio, reajustado; desde 14/11/2019, 60% mais 2 pontos percentuais, ou 100% se acidentária. Na transformação direta, o tempo em auxílio não entra como salário de contribuição na média (STF, Supremo Tribunal Federal, Tema 88). Não está definido se o salário de benefício, desde 14/11/2019, é o do auxílio reajustado ou uma nova média.", "fonte": "IN 128/2022, art. 233, § 1º, I a III; STF Tema 88", "origem": "doutrina-incapacidade.md §7 (Transformação e período em benefício no PBC), LACUNA ins. R24-17 c.2", "sinal": "controvertido"}, {"id": "inc-027", "tema": "Aposentadoria por incapacidade permanente", "pergunta": "Desde quando começa a aposentadoria por invalidez?", "variantes": ["data de início da aposentadoria por invalidez", "a aposentadoria retroage?", "quando passo a receber como aposentado"], "resposta": "Se veio depois do auxílio por incapacidade temporária, no dia seguinte à cessação dele; a IN (Instrução Normativa) 128/2022 fixa a data da perícia, e as datas podem divergir. Sem auxílio anterior, segue a regra do auxílio: empregado no 16º dia, demais na DII (data de início da incapacidade), e na DER (data de entrada do requerimento) quando pedida depois de 30 dias. Sem pedido no INSS (Instituto Nacional do Seguro Social), a concedida na Justiça começa na citação.", "fonte": "Lei 8.213/1991, art. 43; Dec. 3.048/1999, art. 44, § 1º; IN 128/2022, arts. 326, § 6º, e 327; STJ Súm. 576", "origem": "doutrina-incapacidade.md §7 (Data de início da aposentadoria)", "sinal": "firme"}, {"id": "inc-028", "tema": "Aposentadoria por incapacidade permanente", "pergunta": "O que é o acréscimo de 25% na aposentadoria?", "variantes": ["adicional de grande invalidez", "preciso de cuidador, ganho mais?", "25% para quem depende de outra pessoa"], "resposta": "É o adicional de 25% pago ao aposentado por incapacidade permanente que precisa da assistência permanente de outra pessoa. É devido ainda que ultrapasse o teto, é recalculado nos reajustes, cessa com a morte e não passa para a pensão.", "fonte": "Lei 8.213/1991, art. 45; Dec. 3.048/1999, art. 45 e Anexo I", "origem": "doutrina-incapacidade.md §7 (Adicional, mensalidade de recuperação e retorno)", "sinal": "firme"}, {"id": "inc-029", "tema": "Aposentadoria por incapacidade permanente", "pergunta": "Aposentado por idade ou por tempo que precisa de cuidador tem os 25%?", "variantes": ["adicional de 25% em outra aposentadoria", "extensão do acréscimo de 25%", "minha mãe aposentada por idade precisa de ajuda, ganha 25%?"], "resposta": "Não. O STF (Supremo Tribunal Federal) decidiu no Tema 1.095 que o adicional de 25% não se estende às demais espécies de aposentadoria; é só da aposentadoria por incapacidade permanente.", "fonte": "STF Tema 1.095 (RE 1.221.446), ADVERSO", "origem": "doutrina-incapacidade.md §7 (bloco ADVERSO: STF Tema 1.095)", "sinal": "firme"}, {"id": "inc-030", "tema": "Aposentadoria por incapacidade permanente", "pergunta": "Se eu melhorar, perco a aposentadoria por invalidez de uma vez?", "variantes": ["recuperei, o que acontece com a aposentadoria", "mensalidade de recuperação", "aposentadoria por invalidez é para sempre?"], "resposta": "Depende do caso previsto em lei. Recuperação total em até 5 anos de benefício cessa a aposentadoria de imediato para o empregado com direito a voltar à função, e para os demais após tantos meses quantos forem os anos de benefício. Recuperação parcial, ou depois de 5 anos, dá 6 meses de renda integral, 6 com redução de 50% e 6 com redução de 75%.", "fonte": "Lei 8.213/1991, art. 47; Dec. 3.048/1999, art. 49; IN 128/2022, art. 333", "origem": "doutrina-incapacidade.md §7 (Adicional, mensalidade de recuperação e retorno)", "sinal": "firme"}, {"id": "inc-031", "tema": "Aposentadoria por incapacidade permanente", "pergunta": "Aposentado por invalidez pode voltar a trabalhar?", "variantes": ["posso fazer um bico aposentado por invalidez", "trabalhar e receber aposentadoria por incapacidade", "voltei a trabalhar, perco a aposentadoria?"], "resposta": "Não sem perder o benefício. O retorno voluntário à atividade cancela a aposentadoria por incapacidade permanente desde a data do retorno.", "fonte": "Lei 8.213/1991, art. 46; Dec. 3.048/1999, art. 48", "origem": "doutrina-incapacidade.md §7 (Adicional, mensalidade de recuperação e retorno)", "sinal": "firme"}, {"id": "inc-032", "tema": "Aposentadoria por incapacidade permanente", "pergunta": "Minha incapacidade é parcial e permanente. Me aposento?", "variantes": ["incapacidade parcial dá aposentadoria", "posso fazer outro serviço, tenho direito a invalidez?", "perito disse incapacidade parcial definitiva"], "resposta": "Em regra, não: para a TNU (Turma Nacional de Uniformização), incapacidade parcial e permanente leva à análise de reabilitação profissional, não à aposentadoria. A exceção é a doença estigmatizante, em que cabe aposentadoria por incapacidade parcial e permanente após análise das condições pessoais.", "fonte": "TNU Temas 177 e 274", "origem": "doutrina-incapacidade.md §7 (Precedentes)", "sinal": "firme"}, {"id": "inc-033", "tema": "Auxílio-acidente", "pergunta": "O que é o auxílio-acidente?", "variantes": ["fiquei com sequela, tenho direito a algum benefício", "auxílio-acidente é a mesma coisa que auxílio-doença?", "indenização do INSS por sequela"], "resposta": "É uma indenização mensal ao segurado que, depois da consolidação das lesões de acidente de qualquer natureza, ficou com sequela que reduz a capacidade para o trabalho que habitualmente exercia. Não depende de estar incapaz, e o rol de sequelas do Anexo III do Regulamento é só exemplificativo.", "fonte": "Lei 8.213/1991, art. 86, caput; Dec. 3.048/1999, art. 104; IN 128/2022, art. 354, § 1º", "origem": "doutrina-incapacidade.md §8 (Fato gerador)", "sinal": "firme"}, {"id": "inc-034", "tema": "Auxílio-acidente", "pergunta": "Autônomo tem direito a auxílio-acidente?", "variantes": ["MEI recebe auxílio-acidente", "contribuinte individual e auxílio-acidente", "quem paga como facultativo tem auxílio-acidente"], "resposta": "Não. Têm direito o empregado, o doméstico com fato gerador desde 02/06/2015, o avulso e o segurado especial. O contribuinte individual (autônomo) e o facultativo ficam fora, por exclusão expressa da lei.", "fonte": "Lei 8.213/1991, art. 18, § 1º; IN 128/2022, art. 352, §§ 4º e 9º; TNU Tema 201, ADVERSO", "origem": "doutrina-incapacidade.md §8 (Segurados)", "sinal": "firme"}, {"id": "inc-035", "tema": "Auxílio-acidente", "pergunta": "Quanto paga o auxílio-acidente?", "variantes": ["valor do auxílio-acidente", "auxílio-acidente é meio salário?", "o auxílio-acidente pode ser menor que o mínimo"], "resposta": "50% do salário de benefício do auxílio por incapacidade temporária que o originou, corrigido; sem auxílio anterior, 50% do salário de benefício do auxílio a que teria direito. Pode ficar abaixo do salário mínimo. Não está definido se a correção da base é mensal ou só pelos reajustes anuais.", "fonte": "Lei 8.213/1991, art. 86, § 1º; Dec. 3.048/1999, arts. 42, par. único, e 104, § 1º; IN 128/2022, art. 233, X e § 3º", "origem": "doutrina-incapacidade.md §8 (Valor), LACUNA ins. R24-17 c.1", "sinal": "controvertido"}, {"id": "inc-036", "tema": "Auxílio-acidente", "pergunta": "Auxílio-acidente precisa de carência?", "variantes": ["quantas contribuições para o auxílio-acidente", "comecei a trabalhar agora e me acidentei", "auxílio-acidente sem tempo de contribuição"], "resposta": "Não. O auxílio-acidente independe de carência.", "fonte": "Lei 8.213/1991, art. 26, I; Dec. 3.048/1999, art. 30, I", "origem": "doutrina-incapacidade.md §8 (Carência)", "sinal": "firme"}, {"id": "inc-037", "tema": "Auxílio-acidente", "pergunta": "Posso trabalhar recebendo auxílio-acidente?", "variantes": ["voltei a trabalhar, perco o auxílio-acidente?", "auxílio-acidente com salário", "recebo auxílio-acidente e estou empregado"], "resposta": "Sim. O auxílio-acidente é devido a partir do dia seguinte à cessação do auxílio por incapacidade temporária, independentemente de qualquer remuneração ou rendimento do segurado.", "fonte": "Lei 8.213/1991, art. 86, § 2º; Dec. 3.048/1999, art. 104, § 2º", "origem": "doutrina-incapacidade.md §8 (Termo inicial)", "sinal": "firme"}, {"id": "inc-038", "tema": "Auxílio-acidente", "pergunta": "Desde quando o auxílio-acidente é pago?", "variantes": ["o auxílio-acidente retroage", "nunca pedi o auxílio-acidente, posso receber atrasado", "precisa pedir o auxílio-acidente separado?"], "resposta": "No dia seguinte à cessação do auxílio por incapacidade temporária; sem auxílio anterior, na DER (data de entrada do requerimento). Os atrasados respeitam a prescrição de 5 anos. A TNU (Turma Nacional de Uniformização) dispensa pedido de prorrogação e pedido específico do auxílio-acidente.", "fonte": "Lei 8.213/1991, art. 86, § 2º; STJ Tema 862; TNU Tema 315", "origem": "doutrina-incapacidade.md §8 (Termo inicial)", "sinal": "firme"}, {"id": "inc-039", "tema": "Auxílio-acidente", "pergunta": "Minha sequela é pequena. Tenho direito ao auxílio-acidente?", "variantes": ["lesão leve dá auxílio-acidente", "perdi pouco movimento do dedo", "sequela mínima e auxílio-acidente"], "resposta": "Sim, se houver redução da capacidade para o trabalho habitual: o grau da lesão não interfere, ainda que mínima, e é irrelevante que a doença possa reverter. Não há direito se a sequela não reduz a capacidade habitual nem exige maior esforço na atividade.", "fonte": "STJ Temas 416 e 156; TNU Súm. 88 (FAVORÁVEIS); TNU Súm. 89 (ADVERSA)", "origem": "doutrina-incapacidade.md §8 (Grau e reversibilidade)", "sinal": "firme"}, {"id": "inc-040", "tema": "Auxílio-acidente", "pergunta": "O auxílio-acidente é para a vida toda?", "variantes": ["até quando recebo auxílio-acidente", "auxílio-acidente acaba quando eu me aposentar?", "quando corta o auxílio-acidente"], "resposta": "Não. Cessa na véspera de qualquer aposentadoria, na emissão de CTC (certidão de tempo de contribuição) ou no óbito. É restabelecido se a aposentadoria por incapacidade permanente for cessada ou se o segurado desistir da aposentadoria, e fica suspenso enquanto o auxílio por incapacidade temporária pelo mesmo acidente estiver reaberto.", "fonte": "Lei 8.213/1991, art. 86, §§ 1º a 3º; Dec. 3.048/1999, art. 104, §§ 1º a 3º e 6º; IN 128/2022, arts. 355 e 356", "origem": "doutrina-incapacidade.md §8 (Cessação e restabelecimento)", "sinal": "firme"}, {"id": "inc-041", "tema": "Auxílio-acidente", "pergunta": "Posso receber auxílio-acidente junto com a aposentadoria?", "variantes": ["acumular auxílio-acidente e aposentadoria", "me aposentei e cortaram o auxílio-acidente", "auxílio-acidente continua depois de aposentar?"], "resposta": "Só se a lesão e a aposentadoria forem anteriores a 11/11/1997. Fora disso, a acumulação é vedada e o auxílio-acidente cessa na véspera da aposentadoria. Em compensação, o valor mensal do auxílio-acidente entra no salário de contribuição da aposentadoria, limitado ao teto.", "fonte": "STJ Súm. 507 e TNU Tema 85 (ADVERSOS); Lei 8.213/1991, arts. 31 e 86", "origem": "doutrina-incapacidade.md §8 (bloco ADVERSO: acumulação com aposentadoria; Reflexo na aposentadoria)", "sinal": "firme"}, {"id": "inc-042", "tema": "Auxílio-acidente", "pergunta": "Posso ter dois auxílios-acidente?", "variantes": ["dois acidentes, dois auxílios", "segundo auxílio-acidente", "acumular auxílio-acidente"], "resposta": "Não. A lei veda o recebimento de mais de um auxílio-acidente, salvo direito adquirido.", "fonte": "Lei 8.213/1991, art. 124, V", "origem": "doutrina-incapacidade.md §7 (Trabalho durante a incapacidade e compensação); 03_TESES/legislacao/leis/Lei-8213-1991 (art. 124)", "sinal": "firme"}, {"id": "inc-043", "tema": "Auxílio-acidente", "pergunta": "Recebendo auxílio-acidente eu continuo segurado do INSS?", "variantes": ["auxílio-acidente mantém a qualidade de segurado", "parei de contribuir e recebo auxílio-acidente", "perco a qualidade de segurado com auxílio-acidente?"], "resposta": "Não por tempo ilimitado. Quem está em gozo de benefício mantém a qualidade de segurado sem limite de prazo, mas a lei exclui expressamente o auxílio-acidente dessa regra.", "fonte": "Lei 8.213/1991, art. 15, I", "origem": "doutrina-incapacidade.md §8 (Cessação e restabelecimento); doutrina-previdenciaria.md §6 (Período de graça)", "sinal": "firme"}, {"id": "inc-044", "tema": "Auxílio-acidente", "pergunta": "Como peço o auxílio-acidente no INSS?", "variantes": ["requerimento de auxílio-acidente", "auxílio-acidente tem perícia?", "documentos para o auxílio-acidente"], "resposta": "Desde 24/03/2026 o requerimento passa obrigatoriamente por análise documental prévia, que não substitui o exame presencial da sequela e da redução da capacidade. Faltando documento essencial, o pedido é indeferido sem perícia.", "fonte": "Portaria Conjunta MPS/INSS 15/2026, arts. 1º, § 3º, 3º, par. único, e 4º, II", "origem": "doutrina-incapacidade.md §8 (Análise documental prévia)", "sinal": "firme"}, {"id": "inc-045", "tema": "Acidente do trabalho (B91)", "pergunta": "Qual a diferença entre auxílio-doença comum e acidentário?", "variantes": ["B31 ou B91, faz diferença?", "vale a pena brigar para ser acidentário", "benefício acidentário tem vantagem?"], "resposta": "O valor do auxílio é igual (91%), mas o B91 (auxílio por incapacidade temporária acidentário) traz efeitos que o B31 (comum) não tem: isenção de carência em todos os casos, aposentadoria por incapacidade permanente de 100%, estabilidade de 12 meses no emprego após a cessação, depósito do FGTS (Fundo de Garantia do Tempo de Serviço) durante o afastamento e ação na Justiça Estadual. É acidentário o que decorre de acidente do trabalho, doença profissional ou do trabalho.", "fonte": "Lei 8.213/1991, arts. 26, II, 61 e 118; EC 103/2019, art. 26, § 3º, II; Lei 8.036/1990, art. 15, § 5º; CF, art. 109, I", "origem": "doutrina-incapacidade.md §7; competencia-e-rito.md §5; 03_TESES/legislacao/leis (Lei 8.213, art. 118; Lei 8.036, art. 15)", "sinal": "firme"}, {"id": "inc-046", "tema": "Acidente do trabalho (B91)", "pergunta": "O que conta como acidente de trabalho?", "variantes": ["me machuquei no serviço, é acidente de trabalho?", "conceito de acidente do trabalho", "acidente na empresa"], "resposta": "É o que ocorre pelo exercício do trabalho a serviço de empresa ou de empregador doméstico, ou do segurado especial, e causa lesão corporal ou perturbação funcional que leve à morte ou à perda ou redução, permanente ou temporária, da capacidade para o trabalho. Também contam a doença profissional, a doença do trabalho e as situações equiparadas por lei.", "fonte": "Lei 8.213/1991, arts. 19, 20 e 21", "origem": "03_TESES/legislacao/leis/Lei-8213-1991 (arts. 19 a 21)", "sinal": "firme"}, {"id": "inc-047", "tema": "Acidente do trabalho (B91)", "pergunta": "Doença causada pelo trabalho é acidente de trabalho?", "variantes": ["LER, coluna, depressão pelo serviço é acidentário?", "doença ocupacional", "peguei doença no trabalho"], "resposta": "Sim. Doença profissional (produzida pelo trabalho peculiar a certa atividade) e doença do trabalho (adquirida pelas condições em que o trabalho é feito) equiparam-se a acidente do trabalho. Não contam a doença degenerativa, a inerente ao grupo etário, a que não incapacita e a endêmica da região, salvo exposição pela natureza do trabalho. Doença fora da relação oficial é acidentária se resultou das condições especiais do trabalho e com ele se relaciona diretamente.", "fonte": "Lei 8.213/1991, art. 20, I e II, §§ 1º e 2º", "origem": "03_TESES/legislacao/leis/Lei-8213-1991 (art. 20)", "sinal": "firme"}, {"id": "inc-048", "tema": "Acidente do trabalho (B91)", "pergunta": "Acidente no caminho para o trabalho é acidente de trabalho?", "variantes": ["acidente de trajeto", "bati a moto indo para o serviço", "acidente voltando do trabalho"], "resposta": "Sim. Equipara-se a acidente do trabalho o sofrido no percurso da residência para o trabalho ou deste para aquela, qualquer que seja o meio de locomoção, inclusive veículo próprio. A MP (medida provisória) 905/2019 chegou a revogar essa regra, mas perdeu a vigência, e o texto vigente da lei mantém o trajeto.", "fonte": "Lei 8.213/1991, art. 21, IV, d", "origem": "03_TESES/legislacao/leis/Lei-8213-1991 (art. 21, IV, d, última ocorrência); legislacao-pos-2019.md §3 (MP 905/2019)", "sinal": "firme"}, {"id": "inc-049", "tema": "Acidente do trabalho (B91)", "pergunta": "Fui agredido no serviço. É acidente de trabalho?", "variantes": ["assalto no trabalho", "acidente no horário de almoço", "viagem a serviço e acidente"], "resposta": "Sim. Equipara-se a acidente do trabalho o sofrido no local e horário de trabalho por agressão, sabotagem ou terrorismo de terceiro ou colega, ofensa física por disputa ligada ao trabalho, imprudência de terceiro, desabamento ou incêndio. Também o ocorrido fora do local e horário em ordem da empresa ou em viagem a serviço, e nos intervalos de refeição ou descanso no local do trabalho.", "fonte": "Lei 8.213/1991, art. 21, II, IV e § 1º", "origem": "03_TESES/legislacao/leis/Lei-8213-1991 (art. 21)", "sinal": "firme"}, {"id": "inc-050", "tema": "Acidente do trabalho (B91)", "pergunta": "A empresa não quis emitir a CAT. O que faço?", "variantes": ["empresa se recusa a fazer a CAT", "quem pode abrir a CAT", "prazo da comunicação de acidente"], "resposta": "A empresa deve emitir a CAT (comunicação de acidente do trabalho) até o primeiro dia útil seguinte ao acidente e, em caso de morte, de imediato, sob pena de multa. Se não emitir, podem fazê-lo o próprio acidentado, seus dependentes, o sindicato, o médico que o atendeu ou qualquer autoridade pública, sem esse prazo. A emissão por terceiro não livra a empresa da multa.", "fonte": "Lei 8.213/1991, art. 22, caput e §§ 2º e 3º", "origem": "03_TESES/legislacao/leis/Lei-8213-1991 (art. 22)", "sinal": "firme"}, {"id": "inc-051", "tema": "Acidente do trabalho (B91)", "pergunta": "Sem CAT o INSS pode reconhecer que minha doença é do trabalho?", "variantes": ["o que é NTEP", "nexo técnico epidemiológico", "INSS reconhece acidentário sem CAT"], "resposta": "Sim. A perícia do INSS (Instituto Nacional do Seguro Social) caracteriza a natureza acidentária quando constata o nexo técnico epidemiológico entre a atividade da empresa e a doença pela CID (Classificação Internacional de Doenças). A empresa pode pedir a não aplicação desse nexo, com recurso de efeito suspensivo ao Conselho de Recursos da Previdência Social, e o segurado também pode recorrer.", "fonte": "Lei 8.213/1991, art. 21-A, caput e §§ 1º e 2º", "origem": "03_TESES/legislacao/leis/Lei-8213-1991 (art. 21-A)", "sinal": "firme"}, {"id": "inc-052", "tema": "Acidente do trabalho (B91)", "pergunta": "Na doença do trabalho, qual é a data do acidente?", "variantes": ["data do acidente em doença ocupacional", "quando começa a contar a doença do trabalho", "dia do acidente na LER"], "resposta": "É a data do início da incapacidade para a atividade habitual, o dia da segregação compulsória ou o dia do diagnóstico, valendo o que ocorrer primeiro.", "fonte": "Lei 8.213/1991, art. 23", "origem": "03_TESES/legislacao/leis/Lei-8213-1991 (art. 23)", "sinal": "firme"}, {"id": "inc-053", "tema": "Acidente do trabalho (B91)", "pergunta": "Depois do auxílio por acidente de trabalho tenho estabilidade?", "variantes": ["estabilidade acidentária", "a empresa pode me demitir quando eu voltar do INSS", "12 meses de estabilidade"], "resposta": "Sim. O segurado que sofreu acidente do trabalho tem garantida a manutenção do contrato na empresa por no mínimo 12 meses depois da cessação do auxílio-doença acidentário, independentemente de receber auxílio-acidente.", "fonte": "Lei 8.213/1991, art. 118", "origem": "03_TESES/legislacao/leis/Lei-8213-1991 (art. 118)", "sinal": "firme"}, {"id": "inc-054", "tema": "Acidente do trabalho (B91)", "pergunta": "A empresa tem que depositar o FGTS enquanto estou afastado?", "variantes": ["FGTS durante o auxílio-doença", "afastado pelo INSS tem FGTS?", "depósito do fundo de garantia no afastamento"], "resposta": "Sim, na licença por acidente do trabalho o depósito do FGTS (Fundo de Garantia do Tempo de Serviço) é obrigatório. A fonte lida não prevê a mesma obrigação para o afastamento por doença comum.", "fonte": "Lei 8.036/1990, art. 15, § 5º", "origem": "03_TESES/legislacao/leis/Lei-8036-1990_FGTS.pdf (art. 15, § 5º)", "sinal": "firme"}, {"id": "inc-055", "tema": "Acidente do trabalho (B91)", "pergunta": "Afastado pelo INSS, como fico na empresa?", "variantes": ["contrato fica suspenso no auxílio-doença", "sou demitido estando encostado?", "situação do empregado afastado"], "resposta": "O empregado, inclusive o doméstico, em gozo de auxílio por incapacidade temporária é considerado pela empresa como licenciado.", "fonte": "Lei 8.213/1991, art. 63", "origem": "03_TESES/legislacao/leis/Lei-8213-1991 (art. 63)", "sinal": "firme"}, {"id": "inc-056", "tema": "Carência e qualidade de segurado", "pergunta": "Quantas contribuições preciso para o auxílio-doença?", "variantes": ["carência do auxílio-doença", "comecei a pagar agora, posso pedir auxílio?", "12 contribuições"], "resposta": "12 contribuições mensais, tanto para o auxílio por incapacidade temporária quanto para a aposentadoria por incapacidade permanente, salvo os casos isentos de carência.", "fonte": "Lei 8.213/1991, art. 25, I; Dec. 3.048/1999, art. 29, I", "origem": "doutrina-incapacidade.md §7 (Carência e isenção); doutrina-previdenciaria.md §6", "sinal": "firme"}, {"id": "inc-057", "tema": "Carência e qualidade de segurado", "pergunta": "Quando não precisa de carência para o auxílio-doença?", "variantes": ["doença grave dispensa carência", "acidente dispensa as 12 contribuições", "isenção de carência"], "resposta": "Não precisa nos casos de acidente de qualquer natureza, doença profissional ou do trabalho e doenças da lista interministerial iniciadas depois da filiação. A lista vigente é a da Portaria Interministerial MTP/MS (Ministério do Trabalho e Previdência e Ministério da Saúde) 22/2022, com o inciso XVIII, gestação de alto risco, incluído pela Portaria Interministerial MPS/MS (Ministério da Previdência Social e Ministério da Saúde) 15/2026. Acidente vascular encefálico agudo e abdome agudo cirúrgico só isentam com evolução aguda e critério de gravidade.", "fonte": "Lei 8.213/1991, art. 26, II; PIM MTP/MS 22/2022; PIM MPS/MS 15/2026", "origem": "doutrina-incapacidade.
