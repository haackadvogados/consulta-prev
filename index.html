, mandando somar o tempo fora do magistério no fator previdenciário do professor, mas sem data de trânsito em julgado conhecida. É tese ainda não consolidada.", "fonte": "TNU TF-019 e TF-020 (PUILs 5000356-41.2024.4.04.7138/RS e 5007233-87.2024.4.04.7108/RS)", "origem": "doutrina-professor-pcd-fator.md §2-A.1; catalogo-temas-vinculantes-2.md §4.2", "sinal": "controvertido"}, {"id": "prof-012", "tema": "Professor", "pergunta": "O professor paga fator previdenciário?", "variantes": ["fator na aposentadoria do professor", "dá para tirar o fator da professora?", "professor fator previdenciário STJ"], "resposta": "Sim, quando os requisitos foram completados a partir de 29/11/1999 (STJ (Superior Tribunal de Justiça) Tema 1.011; STF (Supremo Tribunal Federal) Tema 1.091). Só não incide se todos os requisitos estavam completos antes da Lei 9.876/1999. No cálculo, o professor ganha 5 anos e a professora 10 anos a mais no tempo. Depois da EC (Emenda Constitucional) 103/2019, o fator só aparece no direito adquirido e no art. 17, que não tem versão para professor.", "fonte": "STJ Tema 1.011; STF Tema 1.091; TNU Tema 149; Lei 8.213, art. 29, § 9º, II e III; EC 103/2019, arts. 17 e 26", "origem": "doutrina-professor-pcd-fator.md §2-A.1", "sinal": "firme"}, {"id": "prof-013", "tema": "Professor", "pergunta": "Professor que tinha tempo antes de 1998 tem algum acréscimo?", "variantes": ["bônus de 17% professor", "acréscimo de 20% professora", "bônus da EC 20 magistério"], "resposta": "Sim. Quem tinha magistério até 16/12/1998 e opta pela aposentadoria comum com 35 anos (homem) ou 30 (mulher) exclusivamente em funções de magistério recebe acréscimo de 17% (homem) ou 20% (mulher) sobre esse tempo. A regra da EC (Emenda Constitucional) 20/1998 foi revogada pela EC 103/2019 e vale como direito adquirido; aqui conta também o ensino superior.", "fonte": "EC 20/1998, art. 9º, § 2º; IN 128, art. 251, § 1º", "origem": "doutrina-professor-pcd-fator.md §2-A.1", "sinal": "firme"}, {"id": "pcd-001", "tema": "Pessoa com deficiência", "pergunta": "Quem é considerado pessoa com deficiência para aposentar?", "variantes": ["minha doença conta como deficiência?", "o que é deficiência para o INSS", "deficiência leve dá aposentadoria?"], "resposta": "É quem tem impedimento de longo prazo, de 2 anos ininterruptos, de natureza física, mental, intelectual ou sensorial que, junto com barreiras, dificulta a participação plena na sociedade. A condição e o grau são fixados por avaliação do INSS (Instituto Nacional do Seguro Social).", "fonte": "LC 142/2013, art. 2º; IN 128, art. 303; Portaria Interministerial 1/2014, art. 3º", "origem": "doutrina-professor-pcd-fator.md §2-A.2", "sinal": "firme"}, {"id": "pcd-002", "tema": "Pessoa com deficiência", "pergunta": "Quanto tempo a pessoa com deficiência precisa contribuir para aposentar por tempo?", "variantes": ["aposentadoria PcD por tempo de contribuição", "deficiência grave quantos anos", "LC 142 tempo moderada leve"], "resposta": "Depende do grau, em tempo de contribuição na condição de PcD (pessoa com deficiência): grave, 20 anos (mulher) ou 25 (homem); moderada, 24 ou 29; leve, 28 ou 33. Exige carência e a condição de PcD na DER (data de entrada do requerimento) ou na data em que completou os requisitos. A renda é 100% do SB (salário de benefício).", "fonte": "LC 142/2013, arts. 3º, I a III, e 8º; Dec. 3.048, arts. 70-A, 70-B e 70-J; IN 128, art. 314", "origem": "doutrina-professor-pcd-fator.md §2-A.2", "sinal": "firme"}, {"id": "pcd-003", "tema": "Pessoa com deficiência", "pergunta": "A pessoa com deficiência se aposenta por idade mais cedo?", "variantes": ["aposentadoria por idade PcD", "55 anos mulher com deficiência", "idade da pessoa com deficiência"], "resposta": "Sim. Aos 55 anos (mulher) ou 60 (homem), com 15 anos de contribuição na condição de PcD (pessoa com deficiência), em qualquer grau. A renda é de 70% do SB (salário de benefício) mais 1 ponto percentual por grupo de 12 contribuições, até mais 30%.", "fonte": "LC 142/2013, arts. 3º, IV, e 8º; Dec. 3.048, arts. 70-C, § 1º, e 70-J; IN 128, art. 311; TNU TF-233 e TF-235", "origem": "doutrina-professor-pcd-fator.md §2-A.2", "sinal": "firme"}, {"id": "pcd-004", "tema": "Pessoa com deficiência", "pergunta": "Como é a avaliação da deficiência no INSS?", "variantes": ["perícia da pessoa com deficiência", "assistente social na aposentadoria PcD", "IF-BrA o que é"], "resposta": "É biopsicossocial: médico e assistente social pontuam 41 atividades em 7 domínios (25, 50, 75 ou 100 pontos cada) pelo IF-BrA (Índice de Funcionalidade Brasileiro Aplicado), e o grau sai da soma das duas avaliações, entre 2.050 e 8.200 pontos. A perícia também fixa a data provável de início e as mudanças de grau.", "fonte": "CF, art. 201, § 1º, I; LC 142/2013, arts. 4º e 5º; Dec. 3.048, arts. 70-A e 70-D; IN 128, art. 305; Portaria Interministerial 1/2014, art. 2º, § 1º, e Anexo", "origem": "doutrina-professor-pcd-fator.md §2-A.2", "sinal": "firme"}, {"id": "pcd-005", "tema": "Pessoa com deficiência", "pergunta": "Quantos pontos definem deficiência grave, moderada ou leve?", "variantes": ["pontuação do IF-BrA", "faixa de pontos deficiência", "deficiência insuficiente"], "resposta": "No IF-BrA (Índice de Funcionalidade Brasileiro Aplicado): grave até 5.739 pontos; moderada de 5.740 a 6.354; leve de 6.355 a 7.584; a partir de 7.585 a deficiência é insuficiente para a aposentadoria.", "fonte": "Portaria Interministerial SDH/MPS/MF/MOG/AGU 1/2014, Anexo, itens 4.a, 4.d e 4.e", "origem": "doutrina-professor-pcd-fator.md §2-A.2", "sinal": "firme"}, {"id": "pcd-006", "tema": "Pessoa com deficiência", "pergunta": "Fiquei com deficiência depois de anos trabalhando. Posso usar a aposentadoria da pessoa com deficiência?", "variantes": ["deficiência adquirida no meio da vida", "acidente que deixou sequela e aposentadoria PcD", "tempo antes da deficiência conta?", "mudou o grau da deficiência"], "resposta": "Sim. Com deficiência que surgiu depois ou com mudança de grau, os tempos são convertidos proporcionalmente e somados pelo grau preponderante, que é o de maior tempo. Se na DER (data de entrada do requerimento) a pessoa já não tiver a condição de PcD (pessoa com deficiência), pode sair a aposentadoria comum com os períodos convertidos.", "fonte": "LC 142/2013, art. 7º; Dec. 3.048, art. 70-E, §§ 1º e 2º; IN 128, art. 309, §§ 3º e 4º, e Anexo XVIII", "origem": "doutrina-professor-pcd-fator.md §2-A.2", "sinal": "firme"}, {"id": "pcd-007", "tema": "Pessoa com deficiência", "pergunta": "Como provo que já tinha deficiência anos atrás?", "variantes": ["testemunha prova deficiência antiga?", "deficiência antes de 2013", "prova da deficiência no passado"], "resposta": "Por documentos; é vedada a prova exclusivamente testemunhal. A LC (Lei Complementar) 142/2013 entrou em vigor em 09/11/2013, e a deficiência anterior a essa data também se prova documentalmente.", "fonte": "LC 142/2013, arts. 6º, § 2º, e 11; Dec. 3.048, art. 70-D, § 1º", "origem": "doutrina-professor-pcd-fator.md §2-A.2", "sinal": "firme"}, {"id": "pcd-008", "tema": "Pessoa com deficiência", "pergunta": "O perito fez só exame médico, sem o questionário. Vale?", "variantes": ["laudo sem IF-BrA", "perícia judicial da pessoa com deficiência sem assistente social", "visão monocular perícia"], "resposta": "Não deveria valer: a perícia administrativa ou judicial da PcD (pessoa com deficiência) não dispensa o IF-BrA (Índice de Funcionalidade Brasileiro Aplicado), inclusive na visão monocular, segundo teses da TNU (Turma Nacional de Uniformização). Laudo sem ele pode ser impugnado.", "fonte": "TNU TF-234, TF-351, TF-440, TF-051 e TF-251", "origem": "doutrina-professor-pcd-fator.md §2-A.2", "sinal": "firme"}, {"id": "pcd-009", "tema": "Pessoa com deficiência", "pergunta": "Tenho tempo especial e deficiência. Posso juntar os dois?", "variantes": ["insalubridade e deficiência juntas", "tempo especial na aposentadoria PcD", "converter especial para deficiência"], "resposta": "Em parte. O tempo especial pode contar como tempo de PcD (pessoa com deficiência) só na aposentadoria por tempo, se for mais favorável, só para períodos até 13/11/2019 e sem aplicar as duas reduções no mesmo período. O tempo de PcD não se converte para a aposentadoria especial.", "fonte": "LC 142/2013, art. 10; Dec. 3.048, art. 70-F e § 1º; IN 128, art. 310, §§ 1º e 2º, e Anexo XIX", "origem": "doutrina-professor-pcd-fator.md §2-A.2", "sinal": "firme"}, {"id": "pcd-010", "tema": "Pessoa com deficiência", "pergunta": "Na aposentadoria da pessoa com deficiência tem fator previdenciário?", "variantes": ["fator na aposentadoria PcD", "fator reduz aposentadoria da pessoa com deficiência?"], "resposta": "Só se aumentar a renda, pela LC (Lei Complementar) 142/2013. O INSS (Instituto Nacional do Seguro Social) aplica essa garantia apenas a quem tinha direito até 13/11/2019; para DIB (data de início do benefício) posterior a leitura do INSS é contrária, e a lei complementar não traz esse limite no tempo.", "fonte": "LC 142/2013, art. 9º, I; Dec. 3.048, art. 188-E, § 6º; IN 128, art. 229, § 2º, II", "origem": "doutrina-professor-pcd-fator.md §2-A.2", "sinal": "controvertido"}, {"id": "pcd-011", "tema": "Pessoa com deficiência", "pergunta": "A média da aposentadoria da pessoa com deficiência descarta os menores salários?", "variantes": ["80% maiores salários PcD", "cálculo da aposentadoria PcD depois da reforma", "média de 100% dos salários deficiente"], "resposta": "Está em julgamento. O INSS (Instituto Nacional do Seguro Social) usa a média de 100% dos salários desde 07/1994; a tese do segurado é a média dos 80% maiores, pela LC (Lei Complementar) 142/2013 e pela EC (Emenda Constitucional) 103/2019, art. 22. A TNU (Turma Nacional de Uniformização) afetou a questão no Tema 389 em 11/02/2026, ainda sem tese.", "fonte": "LC 142/2013, art. 8º; EC 103/2019, art. 22; Dec. 3.048, arts. 32 e 70-J; TNU Tema 389", "origem": "doutrina-professor-pcd-fator.md §2-A.2; catalogo-temas-vinculantes-2.md §4.1", "sinal": "controvertido"}, {"id": "pcd-012", "tema": "Pessoa com deficiência", "pergunta": "Aposentado como pessoa com deficiência pode continuar trabalhando ou escolher outra aposentadoria?", "variantes": ["posso trabalhar depois da aposentadoria PcD?", "aposentadoria da LC 142 e emprego", "PcD pode optar por outra aposentadoria mais vantajosa"], "resposta": "Sim nos dois casos. O aposentado pela LC (Lei Complementar) 142/2013 pode seguir trabalhando, e a PcD (pessoa com deficiência) pode optar por qualquer outra aposentadoria mais vantajosa.", "fonte": "IN 128, art. 306; LC 142/2013, art. 9º, V; Dec. 3.048, art. 70-G", "origem": "doutrina-professor-pcd-fator.md §2-A.2", "sinal": "firme"}, {"id": "pcd-013", "tema": "Pessoa com deficiência", "pergunta": "A carência toda precisa ser como pessoa com deficiência?", "variantes": ["180 contribuições já com deficiência?", "carência na aposentadoria PcD por tempo"], "resposta": "Não, na aposentadoria por tempo: exige-se a carência e a condição de PcD (pessoa com deficiência) na DER (data de entrada do requerimento) ou na data dos requisitos, sem exigir que a carência seja toda cumprida com deficiência. Na aposentadoria por idade, os 15 anos de contribuição precisam ser na condição de PcD.", "fonte": "LC 142/2013, art. 3º; IN 128, arts. 311 e 314, §§ 2º e 3º", "origem": "doutrina-professor-pcd-fator.md §2-A.2", "sinal": "firme"}, {"id": "fat-001", "tema": "Fator previdenciário", "pergunta": "O que é o fator previdenciário?", "variantes": ["por que minha aposentadoria veio menor", "fórmula do fator", "fator e expectativa de vida"], "resposta": "É um multiplicador da média que leva em conta o tempo de contribuição, a idade e a expectativa de sobrevida na aposentadoria, pela tábua do IBGE (Instituto Brasileiro de Geografia e Estatística), média nacional única para ambos os sexos. A fórmula é f = (Tc × 0,31 ÷ Es) × [1 + (Id + Tc × 0,31) ÷ 100].", "fonte": "Lei 9.876/1999, Anexo; Lei 8.213, art. 29, § 8º; Dec. 3.048, art. 188-E, §§ 2º e 3º", "origem": "doutrina-professor-pcd-fator.md §2-A.3", "sinal": "firme"}, {"id": "fat-002", "tema": "Fator previdenciário", "pergunta": "O fator previdenciário ainda existe depois da reforma?", "variantes": ["fator acabou em 2019?", "quem ainda paga fator", "fator no pedágio de 50%"], "resposta": "Sim, em dois casos: no direito adquirido até 13/11/2019 e na transição do art. 17 da EC (Emenda Constitucional) 103/2019, onde é obrigatório e não há a regra 85/95. Nas demais regras da reforma o fator não se aplica.", "fonte": "EC 103/2019, arts. 17, par. único, e 26; Dec. 3.048, art. 188-K, §§ 2º e 3º; IN 128, art. 229, § 1º", "origem": "doutrina-professor-pcd-fator.md §2-A.1 e §2-A.3", "sinal": "firme"}, {"id": "fat-003", "tema": "Fator previdenciário", "pergunta": "O que é a regra 85/95?", "variantes": ["regra 86/96", "pontos para tirar o fator", "soma idade e tempo sem fator"], "resposta": "É a soma de idade e tempo de contribuição, incluídas as frações em meses completos, que afasta o fator previdenciário, com tempo mínimo de 35 anos (homem) ou 30 (mulher). Depois da EC (Emenda Constitucional) 103/2019 só vale para quem completou até 13/11/2019: 95/85 de 18/06/2015 a 30/12/2018 e 96/86 de 31/12/2018 a 13/11/2019. O professor tem mais 5 pontos.", "fonte": "Lei 8.213, art. 29-C, red. Lei 13.183/2015; Dec. 3.048, art. 188-E, §§ 8º a 10", "origem": "doutrina-professor-pcd-fator.md §2-A.3", "sinal": "firme"}, {"id": "fat-004", "tema": "Fator previdenciário", "pergunta": "Mulher tem vantagem no cálculo do fator?", "variantes": ["bônus de 5 anos da mulher no fator", "professora ganha tempo no fator"], "resposta": "Sim. No fator previdenciário somam-se 5 anos ao tempo da mulher, 5 ao do professor e 10 ao da professora com tempo exclusivo de magistério na educação básica.", "fonte": "Lei 8.213, art. 29, § 9º; Dec. 3.048, art. 188-E, § 5º", "origem": "doutrina-professor-pcd-fator.md §2-A.3", "sinal": "firme"}, {"id": "fat-005", "tema": "Fator previdenciário", "pergunta": "Na aposentadoria por idade tem fator?", "variantes": ["fator reduz aposentadoria por idade?", "fator opcional"], "resposta": "Só se aumentar a renda: na aposentadoria por idade o fator previdenciário é opcional.", "fonte": "Lei 9.876/1999, art. 7º; Dec. 3.048, art. 188-E, § 7º", "origem": "doutrina-professor-pcd-fator.md §2-A.3", "sinal": "firme"}, {"id": "fat-006", "tema": "Fator previdenciário", "pergunta": "Dá para tirar o fator da minha aposentadoria na Justiça?", "variantes": ["ação para afastar o fator", "fator é inconstitucional?", "revisão do fator previdenciário"], "resposta": "Não. O STF (Supremo Tribunal Federal) declarou o fator previdenciário constitucional (Tema 1.091, trânsito em 27/06/2020). Ele só deixa de valer quando a própria regra da aposentadoria não o usa.", "fonte": "STF Tema 1.091", "origem": "doutrina-professor-pcd-fator.md §2-A.3; parecer-de-revisao-ao-cliente.md §6", "sinal": "firme"}, {"id": "fat-007", "tema": "Fator previdenciário", "pergunta": "Qual tabela de expectativa de vida vale no meu fator?", "variantes": ["tábua do IBGE do ano em que completei o tempo", "pedi depois e o fator piorou"], "resposta": "Vale a tábua do IBGE (Instituto Brasileiro de Geografia e Estatística) publicada até a DER (data de entrada do requerimento), não a da data em que os requisitos foram completados (TNU (Turma Nacional de Uniformização) Tema 25). O IBGE publica a nova tábua até 1º de dezembro de cada ano.", "fonte": "Dec. 3.048, art. 188-E, § 4º; Dec. 3.266/1999, art. 2º; TNU Tema 25", "origem": "doutrina-professor-pcd-fator.md §2-A.3", "sinal": "firme"}, {"id": "fat-008", "tema": "Fator previdenciário", "pergunta": "Tempo rural antigo conta no fator e nos pontos?", "variantes": ["roça antes de 1991 melhora o fator?", "tempo rural na regra 85/95"], "resposta": "Sim, segundo precedentes da TNU (Turma Nacional de Uniformização) fora do rito representativo: o tempo rural anterior à Lei 8.213/1991 conta no tempo do fator previdenciário e nos pontos da regra 85/95.", "fonte": "TNU PUILs 0038018-08.2017.4.01.3500/GO e 0002491-36.2015.4.03.6304/SP", "origem": "doutrina-professor-pcd-fator.md §2-A.3", "sinal": "firme"}, {"id": "rev-001", "tema": "Revisão: prazos", "pergunta": "Até quando posso pedir revisão da aposentadoria?", "variantes": ["prazo de 10 anos para revisão", "minha aposentadoria tem 12 anos, ainda dá?", "decadência da revisão"], "resposta": "Até 10 anos, contados do dia primeiro do mês seguinte ao do recebimento da primeira prestação. Passado esse prazo, a revisão do cálculo da concessão acaba. Há exceções que não decaem, como a readequação aos tetos e o reajuste, e a revisão por reclamatória trabalhista tem prazo próprio.", "fonte": "Lei 8.213, art. 103, caput e I, red. Lei 13.846/2019", "origem": "doutrina-revisao.md §11.1", "sinal": "firme"}, {"id": "rev-002", "tema": "Revisão: prazos", "pergunta": "O INSS negou meu benefício há mais de 10 anos. Perdi o direito?", "variantes": ["benefício cortado há muito tempo", "indeferimento antigo tem prazo?", "cessação do benefício decadência"], "resposta": "Não perdeu o direito: indeferimento, cancelamento ou cessação não têm prazo de decadência, porque o STF (Supremo Tribunal Federal) derrubou essa regra na ADI (ação direta de inconstitucionalidade) 6.096, transitada em 03/08/2021. As parcelas, porém, só se cobram dos últimos 5 anos.", "fonte": "STF ADI 6.096; Lei 8.213, art. 103, par. único", "origem": "doutrina-revisao.md §11.1", "sinal": "firme"}, {"id": "rev-003", "tema": "Revisão: prazos", "pergunta": "Se eu ganhar a revisão, recebo atrasado de quantos anos?", "variantes": ["atrasados de 5 anos", "prescrição das parcelas", "recebo desde o começo da aposentadoria?"], "resposta": "Dos últimos 5 anos: as parcelas mais antigas prescrevem. O pedido administrativo suspende esse prazo, que volta a correr depois da ciência da decisão. Na revisão por reclamatória trabalhista, a TNU (Turma Nacional de Uniformização) entende que o prazo não corre durante a ação trabalhista (Tema 200), tese que vincula os Juizados Especiais Federais.", "fonte": "Lei 8.213, art. 103, par. único; Súm. 85/STJ; Dec. 20.910, art. 4º; TNU Tema 200", "origem": "doutrina-revisao.md §11.1 e §11.7; haack-prev-revisao SKILL §4 Etapa D", "sinal": "firme"}, {"id": "rev-004", "tema": "Revisão: prazos", "pergunta": "O INSS nem analisou um período meu. O prazo de 10 anos vale assim mesmo?", "variantes": ["ponto não apreciado pelo INSS decai?", "INSS esqueceu de analisar tempo especial", "tempo especial não reconhecido na concessão"], "resposta": "Sim. O prazo de 10 anos alcança também a questão que o INSS (Instituto Nacional do Seguro Social) não apreciou na concessão (STJ (Superior Tribunal de Justiça) Tema 975). Período especial ou outro tempo não reconhecido só se revisa dentro desse prazo.", "fonte": "STJ Tema 975; Lei 8.213, art. 103", "origem": "doutrina-revisao.md §11.1", "sinal": "firme"}, {"id": "rev-005", "tema": "Revisão: prazos", "pergunta": "Pedi revisão no INSS antes dos 10 anos. Isso segura o prazo?", "variantes": ["pedido administrativo interrompe decadência?", "revisão no INSS dentro do prazo", "Tema 1.370"], "resposta": "Não há certeza. Nenhum texto oficial diz que o pedido ao INSS (Instituto Nacional do Seguro Social) dentro do prazo suspende ou interrompe a decadência, e a questão está no STJ (Superior Tribunal de Justiça) Tema 1.370, em julgamento e sem tese. Se for decidida contra, só a ação na Justiça garante o prazo.", "fonte": "Lei 8.213, art. 103, II; Dec. 3.048, art. 347, II; STJ Tema 1.370", "origem": "doutrina-revisao.md §11.1; haack-prev-revisao SKILL §7", "sinal": "controvertido"}, {"id": "rev-006", "tema": "Revisão: prazos", "pergunta": "Recebo pensão do meu marido. Posso revisar a aposentadoria dele que gerou a pensão?", "variantes": ["revisão da pensão por morte pela aposentadoria do falecido", "prazo da revisão na pensão", "benefício derivado decadência"], "resposta": "Só se o prazo da aposentadoria dele não tiver acabado: a decadência conta da concessão do benefício originário e não se renova quando a pensão é concedida. A readequação aos tetos é exceção e não decai, inclusive na pensão.", "fonte": "TNU PUIL 0002460-53.2015.4.03.6324/SP; TNU PUILs 0507760-41.2019.4.05.8102 e 5087643-04.2021.4.02.5101", "origem": "doutrina-revisao.md §11.1 e §11.2", "sinal": "firme"}, {"id": "rev-007", "tema": "Revisão: prazos", "pergunta": "Minha aposentadoria é dos anos 90. Ainda dá para revisar o cálculo?", "variantes": ["benefício antigo antes de 1997", "aposentadoria de 1995 revisão", "revisão de benefício muito antigo"], "resposta": "Não, quanto ao cálculo da concessão: para benefício anterior a 1997, o prazo de 10 anos começou em 01/08/1997 (STF (Supremo Tribunal Federal) Tema 313) e já terminou. Pode sobrar a readequação aos tetos, que não decai, se a média foi limitada ao teto.", "fonte": "STF Tema 313; STJ Tema 544", "origem": "doutrina-revisao.md §11.1 e §11.3", "sinal": "firme"}, {"id": "rev-008", "tema": "Revisão: prazos", "pergunta": "Revisão do reajuste anual também tem prazo de 10 anos?", "variantes": ["reajuste errado do benefício", "decadência do reajustamento"], "resposta": "Não. A revisão de reajustamento não decai; só as parcelas mais antigas que 5 anos prescrevem.", "fonte": "IN 128, art. 594, I; Lei 8.213, art. 103, par. único", "origem": "doutrina-revisao.md §11.1", "sinal": "firme"}, {"id": "rev-009", "tema": "Revisão: tipos", "pergunta": "O que é a revisão do teto?", "variantes": ["readequação aos tetos de 1998 e 2003", "minha aposentadoria foi limitada ao teto", "revisão das emendas 20 e 41"], "resposta": "É ajustar a renda aos novos tetos de R$ 1.200,00 (EC (Emenda Constitucional) 20/1998) e R$ 2.400,00 (EC 41/2003) quando a média foi limitada ao teto da época (STF (Supremo Tribunal Federal) Tema 76). Alcança benefícios com DIB (data de início do benefício) até 31/12/2003, inclusive os de 05/10/1988 a 05/04/1991 (Tema 930), e não decai. Os atrasados contam da ação individual, não da ação civil pública (STJ (Superior Tribunal de Justiça) Tema 1.005).", "fonte": "EC 20/1998, art. 14; EC 41/2003, art. 5º; STF Temas 76 e 930; STJ Tema 1.005", "origem": "doutrina-revisao.md §11.2", "sinal": "firme"}, {"id": "rev-010", "tema": "Revisão: tipos", "pergunta": "Benefício anterior a 1988 tem revisão do teto?", "variantes": ["readequação de benefício antes da Constituição", "menor e maior valor-teto"], "resposta": "Ainda não é definitivo. O STJ (Superior Tribunal de Justiça) mandou aplicar o menor e o maior valor-teto (Tema 1.140, julgado em 14/08/2024), mas há recurso extraordinário pendente e sem trânsito. A limitação só ao menor valor-teto não basta (TNU (Turma Nacional de Uniformização)).", "fonte": "STJ Tema 1.140; TNU PUIL 0504607-40.2018.4.05.8100", "origem": "doutrina-revisao.md §11.2", "sinal": "controvertido"}, {"id": "rev-011", "tema": "Revisão: tipos", "pergunta": "Trabalhei em dois empregos ao mesmo tempo. O INSS somou os salários?", "variantes": ["atividades concomitantes", "dois vínculos no CNIS", "revisão de dupla atividade"], "resposta": "Deveria: os salários das atividades concomitantes se somam, respeitado o teto (STJ (Superior Tribunal de Justiça) Tema 1.070). O INSS (Instituto Nacional do Seguro Social) aplicava a regra antiga da múltipla atividade para DIB (data de início do benefício) anterior a 18/06/2019, e é isso que a revisão corrige. Vale para DIB de 29/11/1999 a 17/06/2019, dentro do prazo de 10 anos.", "fonte": "STJ Tema 1.070; Lei 8.213, art. 32, red. Lei 13.846/2019; IN 128, art. 225", "origem": "doutrina-revisao.md §11.5; fluxo-de-revisao.md §3", "sinal": "firme"}, {"id": "rev-012", "tema": "Revisão: tipos", "pergunta": "Tem salário errado ou faltando no meu CNIS. Dá para corrigir?", "variantes": ["erro no CNIS", "salário a menor no extrato do INSS", "vínculo faltando no CNIS"], "resposta": "Sim, com documentos contemporâneos: dados extemporâneos no CNIS (Cadastro Nacional de Informações Sociais) só se incluem ou corrigem com prova da época. Se o benefício já foi concedido, a correção que muda o cálculo segue o prazo de 10 anos da revisão.", "fonte": "Lei 8.213, arts. 29-A, §§ 2º, 3º e 5º, e 103; Dec. 3.048, arts. 19, § 2º, e 19-B", "origem": "doutrina-revisao.md §11.1 e §11.7", "sinal": "firme"}, {"id": "rev-013", "tema": "Revisão: tipos", "pergunta": "A empresa não recolheu meu INSS. Esse tempo conta?", "variantes": ["patrão não pagou o INSS", "salário sem recolhimento conta?"], "resposta": "Sim, para o empregado: os salários contam ainda que o empregador não tenha recolhido a contribuição.", "fonte": "Lei 8.213, art. 34, I", "origem": "doutrina-revisao.md §11.7", "sinal": "firme"}, {"id": "rev-014", "tema": "Revisão: tipos", "pergunta": "Fiquei em auxílio-doença no meio do período. Isso entra no cálculo da aposentadoria?", "variantes": ["auxílio-doença conta na média?", "benefício por incapacidade no cálculo", "invalidez precedida de auxílio-doença"], "resposta": "Sim, se o benefício foi intercalado com atividade ou contribuição: o valor conta como salário de contribuição. Não se aplica na transformação direta do auxílio-doença em aposentadoria por invalidez (STF (Supremo Tribunal Federal) Tema 88) nem na aposentadoria voluntária sem retorno ao trabalho depois do benefício (TNU (Turma Nacional de Uniformização)).", "fonte": "Lei 8.213, art. 29, § 5º; STF Tema 88; Súm. 557/STJ; TNU PUIL 0061252-98.2017.4.03.6301", "origem": "doutrina-revisao.md §11.5", "sinal": "firme"}, {"id": "rev-015", "tema": "Revisão: tipos", "pergunta": "Eu já tinha direito a uma aposentadoria melhor antes de pedir. Posso trocar o cálculo?", "variantes": ["melhor benefício", "direito adquirido a valor maior", "aposentadoria calculada na data errada"], "resposta": "Sim, há direito ao cálculo mais favorável da data em que já tinha direito (STF (Supremo Tribunal Federal) Tema 334). O pedido, porém, decai em 10 anos da primeira prestação (STJ (Superior Tribunal de Justiça) Tema 966).", "fonte": "STF Tema 334; STJ Tema 966", "origem": "doutrina-revisao.md §11.6", "sinal": "firme"}, {"id": "rev-016", "tema": "Revisão: tipos", "pergunta": "Ainda dá para pedir a revisão do artigo 29?", "variantes": ["revisão do art. 29, II", "revisão do auxílio-doença do acordo", "diferença do art. 29 não paga"], "resposta": "Recálculo novo, não: o cronograma do acordo na ACP (ação civil pública) terminou e o recálculo fora dele está decaído. Resta cobrar diferença apurada e não paga, até 31/12/2027 pela leitura do próprio INSS (Instituto Nacional do Seguro Social).", "fonte": "Lei 8.213, art. 29, II; TNU Temas 1 e 134; ACP 0002320-59.2012.4.03.6183/SP", "origem": "doutrina-revisao.md §11.4", "sinal": "controvertido"}, {"id": "rev-017", "tema": "Revisão: tipos", "pergunta": "O INSS dividiu minha média por um número maior que minhas contribuições. Está certo?", "variantes": ["divisor mínimo", "divisor de 108 meses", "poucas contribuições depois de 1994"], "resposta": "Em parte. Para o filiado até 07/1994, a lei fixa divisor mínimo de 108 meses desde 05/05/2022, salvo na aposentadoria por incapacidade permanente, mas o regulamento e a instrução do INSS (Instituto Nacional do Seguro Social) ainda falam em 60% do período, e não se sabe se o INSS aplica os 108 meses. A tese de divisor igual ao número de contribuições foi rejeitada (TNU (Turma Nacional de Uniformização) Tema 203).", "fonte": "Lei 8.213, art. 135-A; Dec. 3.048, art. 188-E, § 1º; IN 128, art. 230; TNU Tema 203", "origem": "doutrina-revisao.md §11.6", "sinal": "controvertido"}, {"id": "rev-018", "tema": "Revisão: tipos", "pergunta": "Dá para tirar os salários baixos da média?", "variantes": ["descarte de contribuições", "excluir salários pequenos do cálculo"], "resposta": "Sim, nas aposentadorias programadas calculadas pela EC (Emenda Constitucional) 103/2019: podem ser excluídas as contribuições que reduzem a média, mantido o tempo mínimo exigido, e o tempo excluído não serve para nenhum outro fim. Nos benefícios por incapacidade a questão está na TNU (Turma Nacional de Uniformização) Tema 392, sem tese.", "fonte": "EC 103/2019, art. 26, § 6º; Dec. 3.048/1999, art. 32, §§ 24 e 25; TNU Tema 392", "origem": "doutrina-revisao.md §11.6; doutrina-incapacidade.md §7 (Auxílio por incapacidade temporária: requisito e valor)", "sinal": "firme"}, {"id": "rev-019", "tema": "Revisão: tipos", "pergunta": "Ainda dá para pedir as revisões dos anos 90, do buraco negro?", "variantes": ["revisão do buraco negro", "artigos 144 e 145", "revisão da Lei 8.870"], "resposta": "Não. As revisões dos arts. 144 e 145 da Lei 8.213 e do art. 26 da Lei 8.870 valeram para benefícios de 1988 a 1993 e estão decaídas desde 01/08/1997. Se a renda foi limitada ao teto, o que sobrevive é a readequação aos tetos de 1998 e 2003.", "fonte": "Lei 8.213, arts. 144 e 145 (revogados); Lei 8.870/1994, art. 26; STF Tema 313; STF Tema 930", "origem": "doutrina-revisao.md §11.3 e §11.9", "sinal": "firme"}, {"id": "rev-020", "tema": "Revisão: reclamatória trabalhista", "pergunta": "Ganhei ação trabalhista. Minha aposentadoria pode aumentar?", "variantes": ["reclamatória aumenta o benefício", "verbas da Justiça do Trabalho no INSS", "horas extras da ação trabalhista na aposentadoria"], "resposta": "Sim, se as verbas remuneratórias reconhecidas caem nos meses usados no cálculo do benefício. O prazo é de 10 anos contados do trânsito em julgado da reclamatória (STJ (Superior Tribunal de Justiça) Tema 1.117).", "fonte": "STJ Tema 1.117; TNU PUIL 5015985-46.2018.4.04.7112", "origem": "doutrina-revisao.md §11.7; haack-prev-revisao SKILL §5.2", "sinal": "firme"}, {"id": "rev-021", "tema": "Revisão: reclamatória trabalhista", "pergunta": "Fiz acordo na Justiça do Trabalho. Serve para revisar a aposentadoria?", "variantes": ["acordo trabalhista homologado vale no INSS?", "sentença homologatória de acordo"], "resposta": "Só com prova da época: o acordo homologado vale como início de prova apenas se houver nos autos elementos contemporâneos dos fatos (STJ (Superior Tribunal de Justiça) Tema 1.188). Sentença condenatória com prova no processo é o caso forte.", "fonte": "STJ Tema 1.188; TNU Súm. 31 (revogada em 22/11/2023)", "origem": "doutrina-revisao.md §11.7; haack-prev-revisao SKILL §5.1", "sinal": "firme"}, {"id": "rev-022", "tema": "Revisão: reclamatória trabalhista", "pergunta": "A ação trabalhista demorou anos. Perco os atrasados desse tempo?", "variantes": ["prescrição durante a reclamatória", "Tema 200 TNU", "atrasados da revisão por ação trabalhista"], "resposta": "Pela TNU (Turma Nacional de Uniformização), não: a prescrição não corre durante a ação trabalhista até a homologação dos cálculos, e só se soma o tempo em que corre, comparado com 5 anos (Tema 200). A tese vincula os Juizados Especiais Federais; pela regra mais rígida, a prescrição só para durante o pedido ao INSS (Instituto Nacional do Seguro Social), e parcelas antigas podem ficar de fora.", "fonte": "TNU Tema 200; Dec. 20.910, art. 4º; Súm. 85/STJ", "origem": "doutrina-revisao.md §11.7; haack-prev-revisao SKILL §4 Etapa D e §5.3", "sinal": "controvertido"}, {"id": "rev-023", "tema": "Revisão: reclamatória trabalhista", "pergunta": "A diferença da ação trabalhista é paga desde quando me aposentei?", "variantes": ["efeitos financeiros da revisão por reclamatória", "pedir no INSS ou na Justiça", "desde a DIB ou desde o pedido"], "resposta": "Na Justiça, desde a DIB (data de início do benefício), segundo a TNU (Turma Nacional de Uniformização), sem tema obrigatório do STJ (Superior Tribunal de Justiça) sobre isso. Pedindo ao INSS (Instituto Nacional do Seguro Social), a diferença conta só a partir da data do pedido de revisão. Em ambos os casos, respeitada a prescrição.", "fonte": "TNU PUILs 0510156-08.2021.4.05.8300 e 0001821-41.2015.4.03.6322; Dec. 3.048, arts. 347, § 4º, e 176, § 7º; IN 128, arts. 585 a 587", "origem": "doutrina-revisao.md §11.7; haack-prev-revisao SKILL §5.4", "sinal": "firme"}, {"id": "rev-024", "tema": "Revisão: reclamatória trabalhista", "pergunta": "Que documentos da ação trabalhista o INSS pede?", "variantes": ["papéis da reclamatória para revisão", "certidão de trânsito e cálculos"], "resposta": "A decisão em inteiro teor, a certidão de trânsito em julgado e a planilha de cálculos homologada, que o INSS (Instituto Nacional do Seguro Social) confronta com seus sistemas. Se o vínculo inteiro só foi reconhecido na reclamatória, exige-se também início de prova material da época.", "fonte": "IN 128, art. 172, I a IV e § 1º; art. 571", "origem": "doutrina-revisao.md §11.7; haack-prev-revisao SKILL §3 e §5.1", "sinal": "firme"}, {"id": "rev-025", "tema": "Revisão: reclamatória trabalhista", "pergunta": "O aumento de salário perto da aposentadoria conta se veio da ação trabalhista?", "variantes": ["aumento nos últimos 36 meses", "salário majorado antes de aposentar"], "resposta": "Sim. Aumento nos 36 meses anteriores ao benefício acima do limite legal não conta, salvo se homologado pela Justiça do Trabalho.", "fonte": "Lei 8.213, art. 29, § 4º", "origem": "doutrina-revisao.md §11.7", "sinal": "firme"}, {"id": "rev-026", "tema": "Revisão: reclamatória trabalhista", "pergunta": "Entrei com a ação trabalhista quando a aposentadoria já tinha mais de 10 anos. Ainda vale?", "variantes": ["reclamatória depois de decaída a revisão", "ação trabalhista tardia e revisão"], "resposta": "Não está decidido. O STJ (Superior Tribunal de Justiça) Tema 1.117 conta o prazo do trânsito da reclamatória, mas não tratou da ação trabalhista ajuizada depois de vencido o prazo normal do benefício; há risco de se entender que o prazo terminou.", "fonte": "STJ Tema 1.117", "origem": "doutrina-revisao.md §11.7; parecer-de-revisao-ao-cliente.md §4", "sinal": "controvertido"}, {"id": "rev-027", "tema": "Revisão: teses mortas", "pergunta": "Ainda dá para entrar com a revisão da vida toda?", "variantes": ["revisão da vida inteira", "salários antes de 1994 na média", "vida toda STF"], "resposta": "Não. O STF (Supremo Tribunal Federal) cancelou a tese favorável (Tema 1.102, trânsito em 15/05/2026): a média começa em 07/1994 para quem já contribuía antes, sem opção pela vida toda. Ação nova não tem chance e ainda pode gerar condenação em honorários do INSS (Instituto Nacional do Seguro Social).", "fonte": "STF Tema 1.102; ADIs 2.110 e 2.111; Lei 9.876/1999, art. 3º", "origem": "doutrina-revisao.md §11.9; parecer-de-revisao-ao-cliente.md §6", "sinal": "firme"}, {"id": "rev-028", "tema": "Revisão: teses mortas", "pergunta": "Continuei trabalhando aposentado. Posso trocar por uma aposentadoria maior?", "variantes": ["desaposentação", "reaposentação", "contribuições depois de aposentado"], "resposta": "Não. O STF (Supremo Tribunal Federal) decidiu que não existe desaposentação nem reaposentação sem lei (Tema 503, trânsito em 08/12/2020).", "fonte": "STF Tema 503; Lei 8.213, art. 18, § 2º", "origem": "doutrina-revisao.md §11.9", "sinal": "firme"}, {"id": "rev-029", "tema": "Revisão: teses mortas", "pergunta": "Tenho direito à revisão do IRSM de fevereiro de 1994?", "variantes": ["revisão dos 39,67%", "IRSM 1994"], "resposta": "Não, se não aderiu ao acordo da Lei 10.999/2004, cuja adesão ia até 31/10/2005. A TNU (Turma Nacional de Uniformização) decidiu que o prazo não foi reaberto (Tema 375); está decaído para todo benefício com 02/1994 no cálculo.", "fonte": "Lei 10.999/2004; TNU Tema 375; TNU PUIL 0029021-11.2005.4.01.4000/PI", "origem": "doutrina-revisao.md §11.9", "sinal": "firme"}, {"id": "rev-030", "tema": "Revisão: teses mortas", "pergunta": "Meu benefício deveria subir na mesma proporção do teto?", "variantes": ["reajuste pelo teto", "benefício não acompanha o teto", "perdi valor em salários mínimos"], "resposta": "Não há base: as EC (Emendas Constitucionais) 20 e 41 reajustam o teto pelos índices dos benefícios, e não o contrário. Nenhuma tese de tribunal superior garantindo esse reajuste foi localizada em fonte oficial.", "fonte": "EC 20/1998, art. 14; EC 41/2003, art. 5º", "origem": "doutrina-revisao.md §11.9; haack-prev-revisao SKILL §8", "sinal": "controvertido"}, {"id": "rev-031", "tema": "Revisão: teses mortas", "pergunta": "Minha aposentadoria por invalidez deveria ser de 100%?", "variantes": ["incapacidade permanente 60% é inconstitucional?", "aposentadoria por invalidez integral"], "resposta": "Não, se a incapacidade foi constatada depois da reforma e não decorre do trabalho: o STF (Supremo Tribunal Federal) julgou constitucional o cálculo de 60% da média mais 2 pontos percentuais por ano acima de 20 (homem) ou 15 (mulher) (Tema 1.300, trânsito em 18/04/2026). Os 100% ficam para a incapacidade causada por acidente ou doença do trabalho.", "fonte": "STF Tema 1.300; EC 103/2019, art. 26, §§ 2º, III, e 3º, II", "origem": "haack-prev-revisao SKILL §8; parecer-de-revisao-ao-cliente.md §6", "sinal": "firme"}, {"id": "rev-032", "tema": "Revisão: na prática", "pergunta": "Pedindo revisão, o INSS pode diminuir meu benefício?", "variantes": ["risco de perder valor na revisão", "INSS reduz aposentadoria na revisão", "revisão pode piorar?"], "resposta": "Sim, há risco: na primeira revisão a pedido, o INSS (Instituto Nacional do Seguro Social) reexamina também os demais critérios da concessão. A revisão que prejudique o beneficiário só produz efeitos depois de assegurado o contraditório.", "fonte": "IN 128, arts. 584, 585, § 1º, e 588", "origem": "doutrina-revisao.md §11.7 e §11.8", "sinal": "firme"}, {"id": "rev-033", "tema": "Revisão: na prática", "pergunta": "Se o juiz der liminar e depois eu perder, devolvo o dinheiro?", "variantes": ["tutela antecipada revogada", "devolver valores da liminar"], "resposta": "Sim. Revogada a tutela antecipada, o autor devolve o que recebeu, por desconto de até 30% do benefício em manutenção (STJ (Superior Tribunal de Justiça) Tema 692).", "fonte": "STJ Tema 692 (Pet 12.482/DF)", "origem": "doutrina-revisao.md §11.9", "sinal": "firme"}, {"id": "rev-034", "tema": "Revisão: na prática", "pergunta": "Como saber se minha aposentadoria tem revisão?", "variantes": ["vale a pena revisar?", "que documento levo para ver revisão", "análise da carta de concessão"], "resposta": "Pela carta de concessão com a memória de cálculo, o histórico de créditos com a primeira prestação paga, o CNIS (Cadastro Nacional de Informações Sociais) completo com remunerações e a cópia integral do processo administrativo. Primeiro se confere o prazo de 10 anos, depois a tese e o valor da diferença.", "fonte": "Lei 8.213, art. 103, I; haack-prev-revisao, gate de insumo", "origem": "haack-prev-revisao SKILL §3 e princípio nuclear", "sinal": "firme"}, {"id": "rev-035", "tema": "Revisão: na prática", "pergunta": "Preciso pedir a revisão no INSS antes de entrar na Justiça?", "variantes": ["requerimento prévio para revisão", "ir direto ao juiz"], "resposta": "Em regra, não: a revisão pode ir direto à Justiça, salvo se depender de matéria de fato ainda não levada ao INSS (Instituto Nacional do Seguro Social), como verbas reconhecidas em ação trabalhista, caso em que o requerimento prévio é exigido (STF (Supremo Tribunal Federal) Tema 350, item III). Sem novo requerimento há menos de cinco anos, o interesse de agir se mantém, com a mesma ressalva.", "fonte": "STF Tema 350, item III; TNU PUIL 0001240-40.2021.4.03.6314/SP", "origem": "catalogo-temas-vinculantes.md (STF Tema 350, tese integral); competencia-e-rito.md §7; haack-prev-revisao SKILL §5.4; doutrina-revisao.md §11.1", "sinal": "firme"}, {"id": "rev-036", "tema": "Revisão: na prática", "pergunta": "Quanto vou receber de atrasados na revisão?", "variantes": ["valor dos atrasados", "quanto dá a revisão", "diferença acumulada"], "resposta": "A diferença mensal entre a renda devida e a paga, de cada mês não prescrito, corrigida até o cálculo. Em regra cobram-se os últimos 5 anos, e cada mês de espera pode fazer perder a parcela mais antiga. O valor só se afirma depois do cálculo sobre a carta de concessão e o CNIS (Cadastro Nacional de Informações Sociais).", "fonte": "Lei 8.213, art. 103, par. único; Súm. 85/STJ", "origem": "haack-prev-revisao SKILL §12; parecer-de-revisao-ao-cliente.md §4", "sinal": "firme"}, {"id": "adm-001", "tema": "Pedido no INSS", "pergunta": "Preciso pedir no INSS antes de entrar na Justiça?", "variantes": ["tem que passar pelo INSS primeiro", "posso processar o INSS sem pedir antes", "prévio requerimento"], "resposta": "Sim, para benefício novo é preciso requerer antes no INSS (Instituto Nacional do Seguro Social): sem o pedido e a negativa, ou sem o INSS passar do prazo legal de análise, não há interesse para a ação. Pedir não é o mesmo que esgotar todos os recursos administrativos.", "fonte": "STF Tema 350 (RE 631.240), item I", "origem": "competencia-e-rito.md §7", "sinal": "firme"}, {"id": "adm-002", "tema": "Pedido no INSS", "pergunta": "Tem caso em que posso ir direto à Justiça sem pedir no INSS?", "variantes": ["dá para pular o INSS", "quando não precisa de pedido administrativo", "revisão precisa pedir no INSS antes"], "resposta": "Sim, em duas situações: quando o INSS (Instituto Nacional do Seguro Social) tem entendimento notório e reiterado contra o pedido; e em revisão, restabelecimento ou manutenção de benefício, salvo se depender de fato que o INSS nunca analisou. Na ação acidentária, dispensa-se esgotar os recursos administrativos, não o pedido: a inicial de incapacidade exige o comprovante de indeferimento ou de não prorrogação, quando for o caso.", "fonte": "STF Tema 350, itens II e III; Súmula 89/STJ; Lei 8.213/1991, art. 129-A, II, a", "origem": "competencia-e-rito.md §7", "sinal": "firme"}, {"id": "adm-003", "tema": "Pedido no INSS", "pergunta": "Posso fazer o pedido no INSS sem documentos e completar depois na Justiça?", "variantes": ["pedir de qualquer jeito só para ter a negativa", "indeferimento forçado", "juntar os documentos só no processo"], "resposta": "Não é seguro: pelo STJ (Superior Tribunal de Justiça), o pedido precisa de documentação minimamente suficiente, e o indeferimento forçado ou a exigência ignorada podem tirar o interesse de agir; fato ou documento novo levado só ao juiz pode exigir novo requerimento, salvo documento apenas complementar. A tese do Tema 1.124 ainda não transitou em julgado.", "fonte": "STJ Tema 1.124, itens 1.1, 1.2, 1.3 e 1.6", "origem": "competencia-e-rito.md §7", "sinal": "controvertido"}, {"id": "adm-004", "tema": "Pedido no INSS", "pergunta": "O INSS pode recusar meu pedido porque falta documento?", "variantes": ["não aceitaram meu requerimento", "recusaram o protocolo", "documentação incompleta"], "resposta": "Não, documentação incompleta não autoriza o INSS (Instituto Nacional do Seguro Social) a recusar o protocolo do requerimento. O que faltar é pedido depois por carta de exigências.", "fonte": "Lei 8.213/1991, art. 105; IN PRES/INSS 128/2022, art. 566", "origem": "competencia-e-rito.md §9, item 2; pecas-administrativas.md §§2 e 3", "sinal": "firme"}, {"id": "adm-005", "tema": "Pedido no INSS", "pergunta": "Já tenho um pedido aberto no INSS, posso fazer outro igual?", "variantes": ["fazer novo pedido enquanto o outro está em análise", "pedir de novo o mesmo benefício", "novo requerimento"], "resposta": "Não enquanto o primeiro não for decidido: novo requerimento da mesma espécie só depois da decisão do anterior e do fim dos 30 dias do prazo de recurso. Revisão e benefício por incapacidade ficam fora dessa trava; na incapacidade, o novo pedido só cabe 30 dias depois da cessação ou da decisão anterior.", "fonte": "IN PRES/INSS 128/2022, arts. 576-A (red. IN 208/2026) e 346", "origem": "pecas-administrativas.md §§2 e 13; gerente-previdenciario/SKILL.md Etapa 1-B", "sinal": "firme"}, {"id": "adm-006", "tema": "Pedido no INSS", "pergunta": "Meu auxílio vai acabar, posso pedir prorrogação?", "variantes": ["prorrogar o auxílio-doença", "o benefício vai cessar", "pedido de prorrogação"], "resposta": "Sim, nos últimos 15 dias do benefício. Sem prazo fixado, o benefício cessa em 120 dias, salvo pedido de prorrogação; contra o resultado da nova avaliação cabe recurso ao CRPS (Conselho de Recursos da Previdência Social) em 30 dias.", "fonte": "IN PRES/INSS 128/2022, art. 339, § 3º (red. IN 212/2026); Lei 8.213/1991, art. 60, §§ 9º e 11", "origem": "pecas-administrativas.md §4", "sinal": "firme"}, {"id": "adm-007", "tema": "Pedido no INSS", "pergunta": "O INSS está demorando, qual o prazo para analisar meu pedido?", "variantes": ["pedido parado há meses", "quanto tempo o INSS tem para responder", "demora do INSS"], "resposta": "Pelo acordo homologado no STF (Supremo Tribunal Federal) no RE (Recurso Extraordinário) 1.171.152, contados do fim da instrução: 30 dias para salário-maternidade, 45 para benefício por incapacidade, 60 para pensão, auxílio-reclusão e auxílio-acidente, e 90 para aposentadorias e BPC (Benefício de Prestação Continuada); a perícia, em até 45 dias do agendamento, ou 90 nas unidades de difícil provimento. A vigência atual do acordo não foi confirmada; na falta dele, vale o prazo geral de 30 dias após a instrução, prorrogável.", "fonte": "RE 1.171.152 (Tema 1.066/STF, cancelado sem tese); Lei 9.784, art. 49", "origem": "competencia-e-rito.md §9 (Mora do INSS e LACUNAS)", "sinal": "controvertido"}, {"id": "adm-009", "tema": "Exigência e documento novo", "pergunta": "O INSS mandou carta de exigência, quanto tempo tenho?", "variantes": ["prazo da exigência", "INSS pediu mais documentos", "carta de exigências"], "resposta": "No mínimo 30 dias da ciência, prorrogáveis por igual período se houver pedido justificado antes do fim do prazo. Enquanto a exigência está aberta, os prazos do INSS (Instituto Nacional do Seguro Social) ficam suspensos.", "fonte": "IN PRES/INSS 128/2022, art. 566, caput, § 2º e § 9º (IN 212/2026)", "origem": "pecas-administrativas.md §3", "sinal": "firme"}, {"id": "adm-010", "tema": "Exigência e documento novo", "pergunta": "E se eu não cumprir a exigência a tempo?", "variantes": ["perdi o prazo da exigência", "não mandei os documentos pedidos", "pedido encerrado por desistência"], "resposta": "Sem cumprimento em 30 dias da ciência, o INSS (Instituto Nacional do Seguro Social) encerra o pedido sem analisar o mérito, como desistência. Dá para pedir de novo, mas com nova DER (data de entrada do requerimento), perdendo-se o período entre as duas datas.", "fonte": "IN PRES/INSS 128/2022, arts. 574, § 4º, II, 600, p.ú., e 601 (red. IN 212/2026)", "origem": "pecas-administrativas.md §3; competencia-e-rito.md §9, item 3", "sinal": "firme"}, {"id": "adm-011", "tema": "Exigência e documento novo", "pergunta": "Posso juntar documento novo depois que o INSS negou?", "variantes": ["achei um documento depois", "levar PPP no recurso", "documento novo muda a data"], "resposta": "Sim, no recurso à Junta, até a inclusão em pauta, mas documento novo apresentado só no recurso faz os efeitos financeiros contarem da data em que foi apresentado, e não da DER (data de entrada do requerimento). Documento decisivo deve ir ao INSS (Instituto Nacional do Seguro Social) o quanto antes.", "fonte": "IN PRES/INSS 128/2022, art. 582; Regimento Interno do CRPS, art. 71, § 1º", "origem": "pecas-administrativas.md §7; haack-prev-administrativo/SKILL.md §7", "sinal": "firme"}, {"id": "adm-012", "tema": "Exigência e documento novo", "pergunta": "Pedido de revisão com documento novo paga desde quando?", "variantes": ["revisão no INSS retroage", "efeito financeiro da revisão administrativa", "revisão por ação trabalhista no INSS"], "resposta": "Na revisão administrativa com elemento novo, os efeitos financeiros ficam na DPR (data do pedido de revisão), e o INSS (Instituto Nacional do Seguro Social) trata a sentença trabalhista como elemento novo. Na via judicial, a TNU (Turma Nacional de Uniformização) admite as diferenças desde a DIB (data de início do benefício).", "fonte": "IN PRES/INSS 128/2022, art. 586; Dec. 3.048/1999, art. 347, § 4º; TNU PUIL 0510156-08.2021.4.05.8300", "origem": "pecas-administrativas.md §6", "sinal": "firme"}, {"id": "adm-013", "tema": "INSS negou", "pergunta": "O INSS negou, e agora?", "variantes": ["benefício indeferido", "o que fazer depois da negativa", "recorrer ou entrar na Justiça"], "resposta": "Há três caminhos: recurso à Junta de Recursos do CRPS (Conselho de Recursos da Previdência Social) em 30 dias, novo requerimento ou ação judicial. A escolha considera o prazo do recurso, os documentos que faltaram e o fato de que ação com o mesmo pedido encerra o recurso administrativo.", "fonte": "Dec. 3.048/1999, art. 305, § 1º, II; Lei 8.213/1991, art. 126, § 3º; IN PRES/INSS 128/2022, art. 576-A", "origem": "gerente-previdenciario/SKILL.md Etapa 1-B", "sinal": "firme"}, {"id": "adm-014", "tema": "INSS negou", "pergunta": "Qual o prazo para recorrer da negativa do INSS?", "variantes": ["prazo do recurso administrativo", "30 dias para recorrer", "recurso à Junta de Recursos"], "resposta": "30 dias corridos da ciência da decisão, excluído o dia do começo e incluído o do vencimento. A ciência eletrônica se presume 5 dias após a disponibilização, mas consultar o processo antes disso antecipa o início do prazo.", "fonte": "Dec. 3.048/1999, art. 305, § 1º, II; IN PRES/INSS 128/2022, arts. 580, 597 e 599, § 1º; Regimento Interno do CRPS, arts. 77 e 80, § 1º", "origem": "pecas-administrativas.md §§7 e 13; haack-prev-administrativo/SKILL.md §3", "sinal": "firme"}, {"id": "adm-015", "tema": "INSS negou", "pergunta": "Tenho recurso no INSS e quero entrar na Justiça, pode?", "variantes": ["recurso pendente e ação ao mesmo tempo", "entrar com ação com recurso em andamento", "desistir do recurso administrativo"], "resposta": "Pode, mas a ação com o mesmo pedido equivale a renunciar ao recurso administrativo e desistir do que já foi interposto. Recurso pendente e ação com pedido idêntico não convivem.", "fonte": "Lei 8.213/1991, art. 126, § 3º; Dec. 3.048/1999, art. 307", "origem": "competencia-e-rito.md §9", "sinal": "firme"}, {"id": "adm-016", "tema": "INSS negou", "pergunta": "Quanto tempo o CRPS leva para julgar o recurso?", "variantes": ["demora do recurso administrativo", "prazo de julgamento da Junta", "INSS tem que cumprir a decisão do recurso"], "resposta": "O Regimento do CRPS (Conselho de Recursos da Previdência Social) fixa até 365 dias por instância, descontado o tempo em diligência. Decidido o recurso, o INSS (Instituto Nacional do Seguro Social) tem até 60 dias para cumprir, sem poder reduzir nem ampliar o alcance da decisão.", "fonte": "Regimento Interno do CRPS, arts. 77, §§ 5º e 6º, e 117, § 1º; Dec. 3.048/1999, art. 308, § 2º", "origem": "pecas-administrativas.md §§7 e 13", "sinal": "firme"}, {"id": "adm-017", "tema": "INSS negou", "pergunta": "Se a Junta negar, ainda dá para recorrer no INSS?", "variantes": ["recurso especial à Câmara", "segunda instância administrativa", "perdi na Junta de Recursos"], "resposta": "Sim, cabe recurso especial à Câmara de Julgamento em 30 dias, com efeito suspensivo e devolutivo. Matéria exclusivamente médica (incapacidade, auxílio-acidente, BPC (Benefício de Prestação Continuada) da pessoa com deficiência, datas de início da doença, da incapacidade e de cessação) para na Junta e não sobe.", "fonte": "Regimento Interno do CRPS, arts. 77, 89, § 3º, e 90; Dec. 3.048/1999, art. 308", "origem": "pecas-administrativas.md §9", "sinal": "firme"}, {"id": "proc-001", "tema": "Onde corre a ação", "pergunta": "Onde corre a ação contra o INSS?", "variantes": ["qual Justiça julga o INSS", "Juizado ou vara federal", "onde processar o INSS"], "resposta": "Benefício comum até 60 salários mínimos vai ao JEF (Juizado Especial Federal), que é obrigatório onde houver vara de JEF; acima disso, à vara federal comum. Se a causa é acidente do trabalho, vai à Justiça Estadual, qualquer que seja o valor.", "fonte": "Lei 10.259/2001, art. 3º, caput e § 3º; CF, art. 109, I; Súmula 15/STJ", "origem": "competencia-e-rito.md §§1 e 2", "sinal": "firme"}, {"id": "proc-003", "tema": "Onde corre a ação", "pergunta": "Passou de 60 salários, posso abrir mão do excedente para ficar no Juizado?", "variantes": ["renunciar ao que passa de 60 salários", "renúncia ao excedente", "ficar no JEF mesmo com valor alto"], "resposta": "Sim, é lícito renunciar de forma expressa ao que exceder 60 salários mínimos, incluídas até 12 parcelas vincendas, para litigar no JEF (Juizado Especial Federal). É troca de crédito por rito, decidida antes da petição inicial.", "fonte": "STJ Tema 1.030; Lei 10.259/2001, art. 3º", "origem": "competencia-e-rito.md §2", "sinal": "firme"}, {"id": "proc-005", "tema": "Onde corre a ação", "pergunta": "Acidente de trabalho contra o INSS corre onde?", "variantes": ["auxílio acidentário na Justiça", "benefício por acidente do trabalho", "doença do trabalho contra o INSS"], "resposta": "Na Justiça Estadual, nas duas instâncias e fora de qualquer Juizado, para os benefícios acidentários, a pensão por morte decorrente de acidente do trabalho e a revisão de benefício acidentário. O que define é a petição afirmar o nexo com o trabalho; ação de indenização contra o empregador é outra ação.", "fonte": "CF, art. 109, I; Súmula 15/STJ; STF Tema 414; STJ Tema 1.053; Lei 8.213/1991, art. 129, II", "origem": "competencia-e-rito.md §§1, 1-A e 5", "sinal": "firme"}, {"id": "proc-006", "tema": "Custos e advogado", "pergunta": "Preciso de advogado para entrar no Juizado Federal?", "variantes": ["posso entrar sozinho no Juizado", "advogado é obrigatório", "sem advogado contra o INSS"], "resposta": "Não no primeiro grau: no JEF (Juizado Especial Federal) a parte pode designar representante para a causa, advogado ou não. Para recorrer da sentença, a representação por advogado é obrigatória.", "fonte": "Lei 10.259/2001, art. 10; Lei 9.099/1995, art. 41, § 2º", "origem": "competencia-e-rito.md §2; Lei 10.259/2001 em disco (03_TESES/legislacao/leis)", "sinal": "firme"}, {"id": "proc-007", "tema": "Custos e advogado", "pergunta": "Tem custas para entrar no Juizado Federal?", "variantes": ["quanto custa entrar com a ação", "taxa do processo", "preciso pagar para processar o INSS"], "resposta": "Não no primeiro grau: o acesso ao JEF (Juizado Especial Federal) não depende de custas, taxas ou despesas. Para recorrer há preparo em 48 horas, que abrange as despesas dispensadas no primeiro grau, salvo para quem tem assistência judiciária gratuita.", "fonte": "Lei 9.099/1995, arts. 42, § 1º, e 54; Lei 10.259/2001, art. 1º", "origem": "competencia-e-rito.md §2; Lei 9.099/1995 em disco (03_TESES/legislacao/leis)", "sinal": "firme"}, {"id": "proc-008", "tema": "Custos e advogado", "pergunta": "Se eu perder no Juizado Federal, pago alguma coisa?", "variantes": ["perder a ação custa", "sucumbência no Juizado", "honorários do INSS se eu perder"], "resposta": "Na sentença de primeiro grau do JEF (Juizado Especial Federal), não: não há condenação em custas e honorários, salvo litigância de má-fé. Quem recorre e perde na Turma Recursal paga custas e honorários de 10% a 20% da condenação ou do valor corrigido da causa; com gratuidade, a cobrança fica suspensa.", "fonte": "Lei 9.099/1995, art. 55; CPC, art. 98, § 3º", "origem": "competencia-e-rito.md §2; Lei 9.099/1995 e CPC em disco (03_TESES/legislacao/leis)", "sinal": "firme"}, {"id": "proc-009", "tema": "Custos e advogado", "pergunta": "Se eu perder na vara federal, tenho que pagar o INSS?", "variantes": ["condenação em honorários", "perder fora do Juizado", "sucumbência com justiça gratuita"], "resposta": "Pode haver condenação, mas com gratuidade da justiça a cobrança fica suspensa: o INSS (Instituto Nacional do Seguro Social) só pode executá-la se, em até 5 anos do trânsito em julgado, provar que a falta de recursos acabou; passado esse prazo, a dívida se extingue.", "fonte": "CPC, art. 98, §§ 2º e 3º", "origem": "CPC em disco (03_TESES/legislacao/leis)", "sinal": "firme"}, {"id": "proc-010", "tema": "Custos e advogado", "pergunta": "E na ação acidentária, se eu perder?", "variantes": ["acidente de trabalho perder a ação", "custas na ação acidentária", "isenção do segurado"], "resposta": "O autor da ação acidentária é isento de custas e de verbas de sucumbência; a isenção é do segurado, não do INSS (Instituto Nacional do Seguro Social). Os honorários periciais são antecipados pelo INSS e, se o autor isento perder, ficam a cargo do Estado.", "fonte": "Lei 8.213/1991, art. 129, p.ú.; Súmula 110/STJ; Lei 13.876/2019, art. 1º, § 7º, II; STJ Tema 1.044", "origem": "competencia-e-rito.md §§5 e 6", "sinal": "firme"}, {"id": "proc-012", "tema": "Custos e advogado", "pergunta": "Vai ter perícia na ação?", "variantes": ["perícia judicial", "médico do juiz", "como provar a incapacidade"], "resposta": "Em benefício por incapacidade, sim: a incapacidade se prova por laudo, e sem laudo o caminho é pedir perícia judicial. A petição precisa descrever a doença, as limitações, a atividade, as falhas da perícia do INSS (Instituto Nacional do Seguro Social) e se houve ação anterior, com o indeferimento ou a não prorrogação e a documentação médica.", "fonte": "Lei 8.213/1991, art. 129-A", "origem": "gerente-previdenciario/SKILL.md Etapa 3 (Perícia); competencia-e-rito.md §5", "sinal": "firme"}, {"id": "proc-013", "tema": "Andamento da ação", "pergunta": "O INSS pode recorrer da sentença? Em quanto tempo?", "variantes": ["prazo do recurso do INSS", "INSS vai recorrer", "o INSS tem prazo maior"], "resposta": "Sim. No JEF (Juizado Especial Federal), o recurso contra a sentença é de 10 dias úteis, sem prazo maior para o INSS (Instituto Nacional do Seguro Social); na vara federal, na estadual delegada e na acidentária, a apelação é de 15 dias úteis, em dobro para o INSS.", "fonte": "Lei 9.099/1995, arts. 12-A e 42; Lei 10.259/2001, art. 9º; CPC, arts. 183, 219 e 1.003, § 5º", "origem": "competencia-e-rito.md §§1 e 7-A; prazos-recursais.md (a) e (b)", "sinal": "firme"}, {"id": "proc-014", "tema": "Andamento da ação", "pergunta": "Perdi na sentença, posso recorrer?", "variantes": ["recorrer da sentença", "prazo para recorrer na Justiça", "quem julga o recurso"], "resposta": "Sim: no JEF (Juizado Especial Federal), recurso à Turma Recursal em 10 dias úteis da ciência da sentença, com advogado obrigatório; na vara federal ou estadual delegada, apelação ao TRF (Tribunal Regional Federal) em 15 dias úteis; na acidentária, apelação ao TJ (Tribunal de Justiça).", "fonte": "Lei 9.099/1995, arts. 12-A, 41, § 2º, e 42; Lei 10.259/2001, art. 21; CPC, art. 1.003, § 5º; CF, art. 109, § 4º", "origem": "competencia-e-rito.md §§1 e 2", "sinal": "firme"}, {"id": "proc-015", "tema": "Andamento da ação", "pergunta": "Posso pedir para receber já, antes da sentença?", "variantes": ["liminar", "tutela de urgência", "tutela antecipada para implantar o benefício"], "resposta": "Sim, por tutela de urgência, concedida quando há elementos que mostrem a probabilidade do direito e perigo de dano ou risco ao resultado útil do processo. Concedida, o benefício é implantado e pago mês a mês antes da sentença.", "fonte": "CPC, art. 300", "origem": "CPC em disco (03_TESES/legislacao/leis); honorarios-contratuais.md §2", "sinal": "firme"}, {"id": "proc-017", "tema": "Atrasados e pagamento", "pergunta": "Ganhei, quando recebo os atrasados?", "variantes": ["quando sai o dinheiro", "pagamento depois do trânsito em julgado", "RPV ou precatório"], "resposta": "No JEF (Juizado Especial Federal), depois do trânsito em julgado, por RPV (requisição de pequeno valor), paga em 60 dias da entrega da requisição, sem precatório. Acima de 60 salários mínimos, o pagamento é por precatório, salvo renúncia ao excedente.", "fonte": "Lei 10.259/2001, art. 17, caput, §§ 1º e 4º", "origem": "competencia-e-rito.md §2 (Pagamento)", "sinal": "firme"}, {"id": "proc-018", "tema": "Atrasados e pagamento", "pergunta": "Qual o limite da RPV?", "variantes": ["teto da requisição de pequeno valor", "até quanto sai por RPV", "dividir o valor para receber mais rápido"], "resposta": "Na Justiça Federal, a RPV (requisição de pequeno valor) tem o mesmo limite de 60 salários mínimos da competência do JEF (Juizado Especial Federal). É vedado fracionar a execução para receber parte por RPV e parte por precatório, e quem passa do limite pode renunciar ao excedente para receber por RPV.", "fonte": "Lei 10.259/2001, art. 17, §§ 1º, 3º e 4º", "origem": "competencia-e-rito.md §2 (Pagamento)", "sinal": "firme"}, {"id": "proc-019", "tema": "Atrasados e pagamento", "pergunta": "Quando o benefício passa a ser pago depois que ganho a ação?", "variantes": ["implantação do benefício", "quando entra na conta todo mês", "INSS implantar"], "resposta": "No JEF (Juizado Especial Federal), a implantação do benefício mensal é obrigação de fazer, cumprida por ofício do juiz ao INSS (Instituto Nacional do Seguro Social), com o trânsito em julgado; antes disso, só com tutela de urgência.", "fonte": "Lei 10.259/2001, art. 16; CPC, art. 300", "origem": "Lei 10.259/2001 e CPC em disco (03_TESES/legislacao/leis)", "sinal": "firme"}, {"id": "proc-020", "tema": "Atrasados e pagamento", "pergunta": "Desde quando contam os atrasados?", "variantes": ["retroativo desde quando", "data de início do benefício na sentença", "atrasados desde o pedido"], "resposta": "Com as mesmas provas do processo administrativo, desde a DER (data de entrada do requerimento) ou da data posterior em que os requisitos foram cumpridos; prova que só surgiu em juízo por impossibilidade material, como perícia ou PPP (perfil profissiográfico previdenciário) novo, leva o início à citação. Sempre respeitada a prescrição de 5 anos, e a tese do STJ (Superior Tribunal de Justiça) Tema 1.124 ainda não transitou em julgado.", "fonte": "STJ Tema 1.124; Lei 8.213/1991, art. 103, p.ú.", "origem": "doutrina-previdenciaria.md §3-A; competencia-e-rito.md §7", "sinal": "controvertido"}, {"id": "proc-021", "tema": "Atrasados e pagamento", "pergunta": "Perco alguma coisa se demorar para entrar com a ação?", "variantes": ["prescrição de 5 anos", "atrasados de mais de cinco anos", "demorei para processar"], "resposta": "Sim, parcelas: prescrevem as prestações vencidas antes dos 5 anos anteriores ao ajuizamento. O direito ao benefício negado, cancelado ou cessado não se perde pelo tempo, e a prescrição não corre contra menores, incapazes e ausentes.", "fonte": "Lei 8.213/1991, art. 103, p.ú.; Súmula 85/STJ; ADI 6.096", "origem": "competencia-e-rito.md §8", "sinal": "firme"}, {"id": "proc-023", "tema": "Atrasados e pagamento", "pergunta": "Tenho benefício há muitos anos, ainda posso revisar?", "variantes": ["prazo para revisão", "decadência de 10 anos", "revisar aposentadoria antiga"], "resposta": "O prazo para revisar o ato de concessão é de 10 anos, contados do primeiro dia do mês seguinte ao recebimento da primeira prestação, inclusive sobre ponto que o INSS (Instituto Nacional do Seguro Social) não analisou. Para benefício negado, cancelado ou cessado não corre esse prazo de decadência; se o pedido administrativo de revisão segura o prazo está em julgamento no STJ (Superior Tribunal de Justiça), Tema 1.370, sem tese.", "fonte": "Lei 8.213/1991, art. 103; STF Tema 313; STJ Tema 975; ADI 6.096; STJ Tema 1.370", "origem": "competencia-e-rito.md §8; pecas-administrativas.md §6", "sinal": "controvertido"}, {"id": "proc-024", "tema": "Atrasados e pagamento", "pergunta": "Como os atrasados são corrigidos?", "variantes": ["correção monetária dos atrasados", "qual índice corrige", "SELIC ou INPC"], "resposta": "Pelo Manual de Cálculos da Justiça Federal, conforme a competência de cada parcela: INPC (Índice Nacional de Preços ao Consumidor) para parcelas de 09/2006 a 11/2021, SELIC (Sistema Especial de Liquidação e de Custódia) como índice único de 12/2021 a 08/2025 e, desde 09/2025, INPC com taxa legal. O regime desde 09/2025 não tem norma expressa e pode mudar.", "fonte": "Lei 8.213/1991, art. 41-A; STF Tema 810; EC 113/2021, art. 3º; Manual de Cálculos da JF, 4.3.1.1 e 4.3.2", "origem": "doutrina-previdenciaria.md §4 (Correção e juros)", "sinal": "controvertido"}, {"id": "proc-025", "tema": "Atrasados e pagamento", "pergunta": "Desde quando correm os juros dos atrasados?", "variantes": ["juros de mora", "juros desde a citação", "correção até o pagamento"], "resposta": "Os juros de mora correm desde a citação do INSS (Instituto Nacional do Seguro Social). Da expedição da RPV (requisição de pequeno valor) ou do precatório até o pagamento, a correção é pelo IPCA (Índice Nacional de Preços ao Consumidor Amplo), com juros de 2% ao ano simples, limitados à SELIC (Sistema Especial de Liquidação e de Custódia).", "fonte": "Súmula 204/STJ; EC 113/2021, art. 3º, red. EC 136/2025", "origem": "doutrina-previdenciaria.md §4 (Correção e juros)", "sinal": "firme"}, {"id": "doc-001", "tema": "Documentos do caso", "pergunta": "Que documentos trago para pedir aposentadoria?", "variantes": ["documentos para aposentadoria", "o que levar na consulta", "papelada da aposentadoria"], "resposta": "CNIS (Cadastro Nacional de Informações Sociais), carteiras de trabalho e documento de vínculo que não esteja no CNIS; para tempo especial, PPP (perfil profissiográfico previdenciário) ou LTCAT (laudo técnico das condições ambientais do trabalho) do período; se já houve pedido, a carta de indeferimento e a cópia do processo administrativo.", "fonte": "Lei 8.213/1991, art. 55, § 3º; IN PRES/INSS 128/2022, art. 274", "origem": "gerente-previdenciario/SKILL.md Etapa 1; roteiro-de-calculo.md §1", "sinal": "firme"}, {"id": "doc-002", "tema": "Documentos do caso", "pergunta": "Que documentos trago para auxílio por incapacidade?", "variantes": ["documentos para auxílio-doença", "laudos médicos", "benefício por doença"], "resposta": "Laudos e documentação médica com a data de início da incapacidade e as limitações, resultado da perícia do INSS (Instituto Nacional do Seguro Social), carta do benefício anterior e comunicação de cessação, CNIS (Cadastro Nacional de Informações Sociais) e, se for acidente de trabalho, a CAT (Comunicação de Acidente de Trabalho) ou decisão que reconheça o nexo.", "fonte": "Lei 8.213/1991, arts. 60 e 129-A", "origem": "gerente-previdenciario/SKILL.md Etapa 1; roteiro-de-calculo.md §6", "sinal": "firme"}, {"id": "doc-003", "tema": "Documentos do caso", "pergunta": "Que documentos trago para pensão por morte?", "variantes": ["documentos para pensão", "marido faleceu", "provar união estável"], "resposta": "Certidão de óbito; prova da qualidade de segurado do falecido (carta de aposentadoria ou CNIS (Cadastro Nacional de Informações Sociais)); certidão de nascimento ou casamento de cada dependente; na união estável, duas provas materiais, uma delas de até 24 meses antes do óbito; para ex-cônjuge, a decisão de alimentos.", "fonte": "Lei 8.213/1991, arts. 16, § 5º, e 76; IN PRES/INSS 128/2022, art. 180", "origem": "pecas-administrativas.md §2-A; gerente-previdenciario/SKILL.md Etapa 1", "sinal": "firme"}, {"id": "doc-004", "tema": "Documentos do caso", "pergunta": "Tem prazo para pedir a pensão e receber desde o óbito?", "variantes": ["pensão retroativa à data do óbito", "prazo para requerer pensão", "90 ou 180 dias"], "resposta": "Sim: 180 dias do óbito para filhos menores de 16 anos e 90 dias para os demais dependentes, para que os efeitos contem desde o óbito.", "fonte": "Lei 8.213/1991, art. 74, I e II", "origem": "pecas-administrativas.md §2-A", "sinal": "firme"}, {"id": "doc-005", "tema": "Documentos do caso", "pergunta": "Que documentos trago para o BPC (LOAS)?", "variantes": ["documentos para LOAS", "benefício assistencial", "BPC do idoso ou deficiente"], "resposta": "CPF (Cadastro de Pessoas Físicas), CadÚnico (Cadastro Único para Programas Sociais) atualizado há no máximo 24 meses e registro biométrico; quem mora sob o mesmo teto e a renda de cada um; comprovantes de gastos de saúde não fornecidos pelo poder público; na deficiência, documentação médica para a avaliação. BPC é o Benefício de Prestação Continuada e LOAS, a Lei Orgânica da Assistência Social.", "fonte": "Lei 8.742/1993, art. 20, §§ 12, 12-A e 12-B; Portaria Conjunta MDS/INSS 34/2025, arts. 7º e 8º", "origem": "pecas-administrativas.md §2-A; gerente-previdenciario/SKILL.md Etapa 1", "sinal": "firme"}, {"id": "doc-006", "tema": "Documentos do caso", "pergunta": "Que documentos trago para aposentadoria rural?", "variantes": ["provar trabalho na roça", "documentos de agricultor", "segurado especial"], "resposta": "Por ano do período, documentos como contrato de arrendamento, parceria ou comodato, DAP (Declaração de Aptidão ao Pronaf), bloco de notas do produtor e notas fiscais de entrada emitidas pelo comprador da produção, com o segurado como vendedor; autodeclaração ratificada para atividade até 31/12/2022 e, desde 01/01/2023, o cadastro de segurado especial no CNIS (Cadastro Nacional de Informações Sociais). Testemunha só complementa o documento.", "fonte": "Lei 8.213/1991, arts. 38-B, 55, § 3º, e 106", "origem": "pecas-administrativas.md §2; gerente-previdenciario/SKILL.md Etapa 1", "sinal": "firme"}, {"id": "doc-007", "tema": "Documentos do caso", "pergunta": "Que documentos trago para revisar meu benefício?", "variantes": ["documentos para revisão", "carta de concessão", "revisão por ação trabalhista"], "resposta": "Carta de concessão e relação dos salários de contribuição do período de cálculo. Na revisão por ação trabalhista, inteiro teor da sentença, certidão de trânsito em julgado, planilha de cálculos homologada e a prova material da época que houver nos autos trabalhistas, porque acordo homologado sem esses elementos não vale como início de prova.", "fonte": "IN PRES/INSS 128/2022, art. 172, § 1º; Dec. 3.048/1999, art. 144, p.ú.; STJ Tema 1.188", "origem": "pecas-administrativas.md §6; roteiro-de-calculo.md §§8 e 9", "sinal": "firme"}, {"id": "doc-008", "tema": "Documentos do caso", "pergunta": "Testemunha serve para provar tempo de trabalho?", "variantes": ["só tenho testemunhas", "prova testemunhal", "não tenho documento do período"], "resposta": "Não sozinha: tempo de serviço exige início de prova material contemporânea, e a prova exclusivamente testemunhal é vedada. A testemunha complementa o documento.", "fonte": "Lei 8.213/1991, art. 55, § 3º; Súmula 149/STJ", "origem": "pecas-administrativas.md §2; gerente-previdenciario/SKILL.md Etapa 3", "sinal": "firme"}, {"id": "doc-009", "tema": "Documentos do caso", "pergunta": "Meu CNIS está errado, dá para corrigir?", "variantes": ["vínculo faltando no CNIS", "salário errado no extrato", "retificar CNIS"], "resposta": "Sim, a qualquer tempo, mesmo sem pedir benefício. O INSS (Instituto Nacional do Seguro Social) tem até 180 dias para fornecer as informações e cabe recurso ao CRPS (Conselho de Recursos da Previdência Social); dado lançado fora de época no CNIS (Cadastro Nacional de Informações Sociais) só vale com documento que o corrobore.", "fonte": "Lei 8.213/1991, arts. 29-A, §§ 1º a 3º, e 126, III; Dec. 3.048/1999, art. 19", "origem": "pecas-administrativas.md §5; competencia-e-rito.md §9, item 1", "sinal": "firme"}, {"id": "port-001", "tema": "Meu INSS e procuração", "pergunta": "Como entro no Meu INSS?", "variantes": ["acessar o Meu INSS", "login gov.br", "entrar no aplicativo do INSS"], "resposta": "Na página do Meu INSS (Instituto Nacional do Seguro Social), clicar em 'Entrar com gov.br', informar o CPF (Cadastro de Pessoas Físicas), seguir em 'Continuar', digitar a senha e clicar em 'Entrar'.", "fonte": "Passo a passo oficial do Meu INSS (05/2025)", "origem": "meu-inss.md §1", "sinal": "firme"}, {"id": "port-003", "tema": "Meu INSS e procuração", "pergunta": "O advogado pode usar minha senha gov.br?", "variantes": ["passar a senha para o advogado", "advogado entrar na minha conta", "compartilhar senha"], "resposta": "Não: o advogado não usa a senha gov.br do cliente, prática que a OAB (Ordem dos Advogados do Brasil) considera insegura. Para consulta, o caminho é a procuração eletrônica; para requerer, o advogado usa o próprio acesso ao INSS (Instituto Nacional do Seguro Social) Digital, com certificado digital e autenticação de dois fatores.", "fonte": "Orientação OAB de 25/05/2026; Plano de Trabalho INSS/OAB-RS, itens 8.1 e 9.6, V", "origem": "haack-prev-portais/SKILL.md §1; inss-digital.md §§2 e 6", "sinal": "firme"}, {"id": "port-004", "tema": "Meu INSS e procuração", "pergunta": "Como faço a procuração eletrônica para o advogado?", "variantes": ["procuração no gov.br", "dar acesso ao advogado no Meu INSS", "cadastrar procurador"], "resposta": "O segurado faz só no site gov.br, não no aplicativo: 'Procurações Eletrônicas', 'Cadastrar Procuração', seus dados e os do advogado, data inicial e final (até 5 anos), serviços 23392 e 23393 do Meu INSS (Instituto Nacional do Seguro Social), 'Pré-visualizar Procuração', 'Assinar Procuração' e confirmação por código enviado por SMS (mensagem de texto) ao celular.", "fonte": "Procuração eletrônica, manual do INSS (04/2026)", "origem": "meu-inss.md §7", "sinal": "firme"}, {"id": "port-005", "tema": "Meu INSS e procuração", "pergunta": "A procuração eletrônica serve para o advogado pedir o benefício?", "variantes": ["procuração eletrônica protocola pedido", "limites da procuração do gov.br", "imprimir a procuração eletrônica"], "resposta": "Não, ela só permite consultar pedidos, extratos, documentos e benefícios, sem alteração cadastral nem novo requerimento, e impressa ou em PDF (Portable Document Format) não vale como procuração. Exige conta gov.br prata ou ouro dos dois e verificação em duas etapas do advogado; o segurado pode revogá-la a qualquer momento.", "fonte": "Procuração eletrônica, manual do INSS (04/2026); orientação OAB de 25/05/2026", "origem": "meu-inss.md §7; haack-prev-portais/SKILL.md §1", "sinal": "firme"}, {"id": "port-006", "tema": "Meu INSS e procuração", "pergunta": "O que o advogado precisa para pedir no INSS por mim?", "variantes": ["termo de representação", "procuração para o INSS", "documento para o advogado protocolar"], "resposta": "Termo de representação do Anexo V do acordo entre INSS (Instituto Nacional do Seguro Social) e OAB/RS (Ordem dos Advogados do Brasil, Seccional do Rio Grande do Sul), um por requerimento e com o serviço marcado, ou procuração com fins específicos; procuração com amplos poderes é vedada. Menor ou incapaz tem modelo próprio.", "fonte": "ACT INSS/OAB-RS, cláusula primeira, subcláusula segunda", "origem": "documentos-e-atalho.md §1; haack-prev-portais/SKILL.md §2", "sinal": "firme"}, {"id": "port-007", "tema": "Meu INSS e procuração", "pergunta": "Como acompanho meu pedido no Meu INSS?", "variantes": ["ver andamento do pedido", "consultar pedido", "situação do requerimento"], "resposta": "Em 'Consultar Pedidos', localizar o pedido e clicar em 'Detalhar'; a situação aparece como Em Análise, Concluído, Em Exigência ou Cancelado. Abrir a decisão ou a exigência pode dar início ao prazo, então anote a data antes de abrir.", "fonte": "Passo a passo oficial do Meu INSS (05/2025); Regimento Interno do CRPS, art. 80, § 1º", "origem": "meu-inss.md §5; haack-prev-portais/SKILL.md §5, item 9", "sinal": "firme"}, {"id": "port-008", "tema": "Meu INSS e procuração", "pergunta": "Como cumpro a exigência pelo Meu INSS?", "variantes": ["responder exigência no aplicativo", "anexar documento no Meu INSS", "pedido em exigência"], "resposta": "O INSS (Instituto Nacional do Seguro Social) avisa por SMS (mensagem de texto) ou e-mail, e o pedido aparece como 'Em Exigência' em 'Consultar Pedidos'. Os roteiros oficiais para cumprir divergem ('Cumprimento de exigência' ou 'Agendamentos/Solicitações'), por isso o botão deve ser conferido na tela.", "fonte": "Notícias do INSS atualizadas em 10/2026; manual do Meu INSS (11/2025)", "origem": "meu-inss.md §6", "sinal": "controvertido"}, {"id": "port-009", "tema": "Meu INSS e procuração", "pergunta": "Como consigo a cópia do processo administrativo?", "variantes": ["cópia do processo do INSS", "baixar o processo", "processo administrativo completo"], "resposta": "Pelo advogado, no INSS (Instituto Nacional do Seguro Social) Digital: 'Detalhar Requerimento', aba 'DETALHAMENTO', 'BAIXAR PROCESSO'; ali só aparecem os pedidos feitos pela entidade. Pedido feito por outro canal se consulta pelo Meu INSS ou pela Central 135.", "fonte": "Guia Prático Entidades Parceiras, INSS (06/2023)", "origem": "inss-digital.md §4", "sinal": "firme"}, {"id": "port-010", "tema": "Meu INSS e procuração", "pergunta": "Qual o tamanho máximo dos documentos que mando ao INSS?", "variantes": ["limite de arquivo", "arquivo grande demais", "foto ou cópia simples vale"], "resposta": "Até 5 MB (megabytes) por documento e 50 MB no total, nos dois portais, em .pdf, .jpg, .jpeg, .png ou .bmp. Vale cópia simples, sem autenticação, digitalizada ou fotografada, desde que inteira, legível, colorida e com verso; documento ilegível é desconsiderado e gera exigência.", "fonte": "Plano de Trabalho INSS/OAB-RS, itens 8.2, III, 8.3, 8.5 e 8.5.1; manuais do INSS (06/2023 e 11/2025)", "origem": "documentos-e-atalho.md §1; meu-inss.md §8", "sinal": "firme"}, {"id": "port-011", "tema": "Meu INSS e procuração", "pergunta": "Pedi aposentadoria rural no Meu INSS, já acabou?", "variantes": ["autodeclaração rural", "pedido rural feito com sucesso", "adiar autodeclaração"], "resposta": "Não: depois de 'Pedido feito com sucesso' ainda é preciso informar a categoria da atividade e preencher a autodeclaração. Quem adia tem 30 dias, e o benefício pode ser negado por falta dos dados.", "fonte": "Passo a passo oficial do INSS, aposentadoria por idade rural (04/2025)", "origem": "meu-inss.md §4", "sinal": "firme"}, {"id": "anx-001", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Quais agentes ou atividades dão aposentadoria especial com 15 anos?", "variantes": ["15 anos de exposição", "especial de 15 anos", "mina subsolo", "mineiro", "quais agentes exigem 15 anos"], "resposta": "Só um enquadramento: trabalho permanente no subsolo de mineração subterrânea, em frente de produção (código 4.0.2 do Anexo IV do Decreto 3.048/1999). Nenhum agente químico, físico ou biológico isolado é de 15 anos.", "fonte": "Decreto 3.048/1999, Anexo IV, código 4.0.2", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-002", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Quais agentes ou atividades dão aposentadoria especial com 20 anos?", "variantes": ["20 anos de exposição", "especial de 20 anos", "amianto", "asbesto", "mineração afastada da frente de produção"], "resposta": "Dois enquadramentos: asbesto, o amianto (código 1.0.2: extração, processamento e manipulação de rochas amiantíferas; fabricação de guarnições para freios, embreagens e materiais isolantes com asbesto; fabricação de fibrocimento; mistura, cardagem, fiação e tecelagem de fibras de asbesto); e mineração subterrânea em atividade afastada das frentes de produção (código 4.0.1).", "fonte": "Decreto 3.048/1999, Anexo IV, códigos 1.0.2 e 4.0.1", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-003", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Quais agentes dão aposentadoria especial com 25 anos?", "variantes": ["25 anos de exposição", "especial de 25 anos", "lista de agentes nocivos", "quais são os agentes nocivos"], "resposta": "Todos os demais agentes do Anexo IV do Decreto 3.048/1999.\n- Químicos: arsênio e seus compostos; benzeno e seus compostos tóxicos; berílio e seus compostos tóxicos; bromo e seus compostos tóxicos; cádmio e seus compostos tóxicos; carvão mineral e seus derivados; chumbo e seus compostos tóxicos; cloro e seus compostos tóxicos; cromo e seus compostos tóxicos; dissulfeto de carbono; fósforo e seus compostos tóxicos; iodo; manganês e seus compostos; mercúrio e seus compostos; níquel e seus compostos tóxicos; petróleo, xisto betumin
