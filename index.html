 nascimento do filho ou documento do equiparado; todo ano, atestado de vacinação obrigatória e comprovante de frequência escolar; o empregado doméstico apresenta só a certidão.\nAtenção: o aposentado que continua empregado tem direito ao salário-família, uma das poucas prestações que as novas contribuições garantem.", "fonte": "Lei 8.213/1991, arts. 16, § 2º, 26, I, e 65 a 70; Portaria Interministerial MPS/MF 13/2026, art. 4º", "origem": "síntese dos itens qd-022, out-006, qd-003, apos-071", "sinal": "firme", "ficha": true}, {"id": "fic-030", "tema": "Carência e qualidade de segurado", "pergunta": "Como funciona a carência no INSS?", "variantes": ["regra da carência", "carência", "o que é carência", "quantas contribuições preciso", "carência de cada benefício", "benefícios sem carência", "doenças que dispensam carência"], "resposta": "O que é: o número mínimo de contribuições mensais exigido para o benefício; não se confunde com tempo de contribuição, contado em anos, meses e dias.\nQuanto: 12 contribuições para auxílio por incapacidade temporária e aposentadoria por incapacidade permanente; 180 para aposentadorias por idade, por tempo e especial; 24 para auxílio-reclusão; inscritos até 24/07/1991 seguem a tabela do art. 142 da Lei 8.213/1991, de 60 contribuições em 1991 a 180 de 2011 em diante.\nSem carência: pensão por morte, salário-família, auxílio-acidente, salário-maternidade, benefícios do segurado especial (que prova meses de atividade) e incapacidade por acidente de qualquer natureza, doença profissional ou do trabalho ou doença da lista surgida depois da filiação.\nDoenças da lista: tuberculose ativa, hanseníase, transtorno mental grave com alienação, câncer, cegueira, paralisia irreversível, cardiopatia grave, Parkinson, espondilite anquilosante, nefropatia grave, Paget avançado, aids (síndrome da imunodeficiência adquirida), contaminação por radiação, hepatopatia grave, esclerose múltipla, AVC (acidente vascular encefálico) agudo, abdome agudo cirúrgico e gestação de alto risco.\nReingresso: depois de perder a qualidade de segurado, exigem-se 6 contribuições (metade) para os benefícios por incapacidade.\nO que não conta: atrasadas anteriores ao primeiro pagamento em dia do contribuinte individual e do facultativo, período indenizado, tempo rural anterior a 1991 sem contribuição (salvo na híbrida) e competência abaixo do mínimo sem ajuste.\nAtenção: pela lei contam as atrasadas posteriores à primeira paga em dia, sem perda da qualidade, mas a TNU (Turma Nacional de Uniformização) exige contribuição tempestiva, o que torna o ponto discutível.", "fonte": "Lei 8.213/1991, arts. 24 a 27-A, 142 e 151; PIM MTP/MS 22/2022; PIM MPS/MS 15/2026; STF ADIs 2.110 e 2.111; TNU Temas 192 e 358", "origem": "síntese dos itens apos-024, apos-025, apos-026, apos-027, apos-045, apos-046, apos-041, inc-056, inc-057, inc-059, qd-001, qd-003, qd-005, rur-018", "sinal": "firme", "ficha": true}, {"id": "fic-031", "tema": "Carência e qualidade de segurado", "pergunta": "Como funciona a qualidade de segurado e o período de graça?", "variantes": ["qualidade de segurado", "período de graça", "regra da qualidade de segurado", "até quando continuo segurado", "perdi a qualidade de segurado", "parei de contribuir e agora", "quanto tempo fico segurado sem pagar"], "resposta": "O que é: a condição que garante cobertura do INSS (Instituto Nacional do Seguro Social), mantida por certo prazo mesmo sem contribuir, com todos os direitos.\nPrazos: 12 meses após a última contribuição; 24 meses para quem tem mais de 120 contribuições sem perda da qualidade; mais 12 meses para o desempregado com registro no órgão próprio (até 36 no total); 6 meses para o facultativo; sem limite para quem recebe benefício, exceto auxílio-acidente; 12 meses após o livramento do preso; 3 meses após o licenciamento do serviço militar.\nPerda: no dia seguinte ao vencimento da contribuição do mês imediatamente posterior ao fim do prazo; para contribuinte individual e facultativo, esse vencimento é o dia 15 do mês seguinte.\nEfeitos da perda: não impede aposentadoria por idade, por tempo ou especial com a carência e o tempo cumpridos, mas tira a cobertura por incapacidade e a pensão aos dependentes enquanto durar.\nReingresso: voltando a contribuir, exigem-se 6 contribuições para os benefícios por incapacidade.\nAtenção: o autônomo só tem período de graça contado da última contribuição igual ou superior ao salário mínimo; competência abaixo do mínimo sem ajuste não serve.", "fonte": "Lei 8.213/1991, arts. 15 e 27-A; Lei 8.212/1991, art. 30, II; Lei 10.666/2003, art. 3º; Dec. 3.048/1999, art. 13, §§ 7º e 8º", "origem": "síntese dos itens apos-028, apos-029, apos-030, apos-031, apos-075, inc-059, inc-061, qd-004, pen-014", "sinal": "firme", "ficha": true}, {"id": "fic-032", "tema": "Categorias e alíquotas", "pergunta": "Quais são as formas de contribuir para o INSS (empregado, autônomo, MEI e facultativo)?", "variantes": ["formas de contribuir para o INSS", "como contribuir para o INSS", "quanto pagar de INSS", "alíquotas do INSS", "contribuição do autônomo", "contribuição do facultativo", "plano simplificado 11%", "carnê do INSS"], "resposta": "Empregado, doméstico e avulso: desconto progressivo em 2026, faixa a faixa, de 7,5% até R$ 1.621,00, 9% até R$ 2.902,84, 12% até R$ 4.354,27 e 14% até R$ 8.475,55, sem desconto acima do teto; o salário conta mesmo que o empregador não recolha.\nAutônomo, plano normal: 20% sobre a base escolhida entre o salário mínimo e o teto (R$ 324,20 a R$ 1.695,11 em 2026), com vencimento no dia 15 do mês seguinte.\nPlano simplificado: 11% do salário mínimo (R$ 178,31 em 2026), para o autônomo sem relação com empresa e o facultativo.\nAutônomo que presta serviço a empresa: a empresa retém 11% da remuneração e recolhe, e desde 04/2003 o recolhimento se presume feito.\nMEI (microempreendedor individual): 5% do salário mínimo (R$ 81,05 em 2026); transportador autônomo de cargas, 12% (R$ 194,52).\nFacultativo: quem não exerce atividade obrigatória paga 20%, 11% ou 5% como baixa renda (sem renda própria, só trabalho doméstico na própria casa e família no CadÚnico, Cadastro Único, com renda de até 2 salários mínimos).\nAtenção: 11%, 5% e 12% valem só para a aposentadoria programada e por idade; para as regras por tempo de contribuição e para levar o tempo a regime próprio, complementa-se até 20% com juros pela SELIC (taxa básica de juros) mais 1%.", "fonte": "Lei 8.212/1991, arts. 20, 21 e 30; EC 103/2019, art. 28; Lei 10.666/2003, art. 4º; LC 123/2006, arts. 18-A e 18-F; Lei 8.213/1991, arts. 13 e 34, I; Portaria Interministerial MPS/MF 13/2026", "origem": "síntese dos itens apos-032, apos-033, apos-034, apos-035, apos-036, apos-037, apos-038, apos-039, apos-040, qd-006, qd-008, rev-013", "sinal": "firme", "ficha": true}, {"id": "fic-033", "tema": "Categorias e alíquotas", "pergunta": "Como funciona a contribuição do MEI para o INSS?", "variantes": ["MEI", "regra do MEI no INSS", "aposentadoria do MEI", "contribuição do MEI", "como funciona o INSS do MEI", "MEI conta para aposentadoria", "microempreendedor individual"], "resposta": "Quanto paga: o MEI (microempreendedor individual) contribui com 5% do salário mínimo (R$ 81,05 em 2026); o transportador autônomo de cargas inscrito como MEI paga 12% (R$ 194,52 em 2026).\nPara que vale: conta para a aposentadoria programada e para a por idade, com média no salário mínimo.\nPara que não vale: não conta nas regras por tempo de contribuição (pontos, idade progressiva, pedágio de 50% e de 100%) nem para levar o tempo a regime próprio sem complementar.\nComo completar: paga-se a diferença até 20% sobre o salário mínimo de cada competência (15 pontos percentuais para quem pagou 5% e 8 para quem pagou 12%), com juros pela SELIC (taxa básica de juros) mais 1%, sem multa; a competência passa a contar nas regras por tempo.\nAtenção: a complementação está registrada como ponto controvertido na base, e o ajuste de competência abaixo do mínimo não é admitido para o MEI.", "fonte": "Lei 8.212/1991, art. 21, §§ 2º, II, 'a', e 3º; LC 123/2006, arts. 18-A, § 3º, IV, e 18-F, III; IN 128/2022, arts. 124 e 216 (red. IN 212/2026)", "origem": "síntese dos itens apos-037, apos-040, apos-043, qd-008", "sinal": "firme", "ficha": true}, {"id": "fic-034", "tema": "Atraso, indenização e ajustes", "pergunta": "Como funciona o pagamento de contribuição em atraso e a indenização ao INSS?", "variantes": ["contribuição em atraso", "pagar INSS atrasado", "indenização de tempo ao INSS", "regra para pagar INSS atrasado", "contribuição abaixo do mínimo", "regularizar tempo sem contribuição", "complementar contribuição"], "resposta": "Atraso: o contribuinte individual com atividade comprovada paga a competência ainda não decaída (até 5 anos contados do primeiro dia do ano seguinte) com 20% da base, multa de mora e juros pela SELIC (taxa básica de juros) mais 1%, e o período conta como tempo de contribuição.\nIndenização: competência mais antiga, com atividade comprovada, custa 20% da média dos 80% maiores salários de contribuição atualizados, juros de 0,5% ao mês limitados a 50% e multa de 10%; a multa não incide no tempo rural anterior à obrigatoriedade de filiação (Lei 15.363/2026).\nCarência: atrasadas anteriores ao primeiro pagamento em dia e as pagas depois de perdida a qualidade de segurado não contam; o período indenizado, em regra, conta só como tempo.\nAbaixo do mínimo: desde 11/2019 a competência abaixo do salário mínimo não conta sem ajuste, feito por complementação (20% para autônomo; 7,5% para empregado, 8% até 02/2020), uso do excedente de outra competência ou agrupamento; o ajuste é irreversível e não é admitido para plano simplificado, MEI (microempreendedor individual), segurado especial e facultativo.\nComplementação de 11% ou 5%: a diferença até 20% sobre o salário mínimo, com juros pela SELIC mais 1%, sem multa.\nAtenção: contribuições do autônomo falecido não se regularizam depois do óbito, e a emenda limita o ajuste abaixo do mínimo ao mesmo ano civil, ponto não resolvido.", "fonte": "Lei 8.212/1991, arts. 21, § 3º, 35 e 45-A; Lei 8.213/1991, arts. 27, II, e 96, § 2º; EC 103/2019, art. 29; Dec. 3.048/1999, arts. 19-E, 216 e 348; CTN, art. 173, I; TNU Súm. 52", "origem": "síntese dos itens apos-040, apos-041, apos-042, apos-043, apos-044, apos-045, apos-046, apos-047, apos-048, rur-023, pen-015", "sinal": "firme", "ficha": true}, {"id": "fic-035", "tema": "Cálculo do valor", "pergunta": "Como funciona o cálculo do valor da aposentadoria?", "variantes": ["cálculo da aposentadoria", "como calcula o valor da aposentadoria", "quanto vou receber de aposentadoria", "regra de cálculo do INSS", "valor do benefício", "média dos salários", "60% mais 2% por ano"], "resposta": "Média: todos os salários de contribuição desde 07/1994 (ou desde o início, se posterior), corrigidos pelo INPC (Índice Nacional de Preços ao Consumidor) e limitados ao teto; salários de atividades simultâneas se somam.\nPercentual: 60% da média mais 2 pontos percentuais por ano de contribuição acima de 20 anos (homem) ou 15 anos (mulher), chegando a 100% com 40 anos (homem) ou 35 (mulher).\nExceções: pedágio de 100%, 100% da média; pedágio de 50%, média multiplicada pelo fator previdenciário; incapacidade permanente acidentária, 100%; auxílio por incapacidade temporária, 91%; auxílio-acidente, 50%; pessoa com deficiência, 100% por tempo e 70% mais 1% por grupo de 12 contribuições por idade.\nLimites: nunca abaixo do salário mínimo nem acima do teto (R$ 1.621,00 e R$ 8.475,55 em 2026); reajuste em 2026 de 3,90% para benefícios iniciados até 02/2025.\nDescarte: podem ser excluídas as contribuições que reduzem a média, mantido o tempo mínimo, e o tempo excluído deixa de valer para tudo, inclusive para o acréscimo.\nDireito adquirido: até 13/11/2019 vale a média dos 80% maiores salários.\nAtenção: se meses além do ano completo aumentam o percentual não está resolvido (adota-se ano completo), e salários anteriores a 1994 não entram na média (revisão da vida toda superada no STF, Supremo Tribunal Federal, Tema 1.102).", "fonte": "EC 103/2019, art. 26; Lei 8.213/1991, arts. 29, 29-B, 32 e 61; Lei 9.876/1999, art. 3º; Portaria Interministerial MPS/MF 13/2026; STF Tema 1.102; STJ Tema 1.070", "origem": "síntese dos itens apos-056, apos-057, apos-058, apos-059, apos-060, apos-061, apos-062, apos-064, apos-065, apos-066, inc-002, inc-023, inc-035, pcd-002, pcd-003, qd-024", "sinal": "firme", "ficha": true}, {"id": "fic-036", "tema": "Fator previdenciário", "pergunta": "O que é e como funciona o fator previdenciário?", "variantes": ["fator previdenciário", "regra do fator previdenciário", "como funciona o fator previdenciário", "quando incide o fator previdenciário", "regra 85/95", "regra 86/96", "tirar o fator previdenciário"], "resposta": "O que é: multiplicador da média que considera tempo de contribuição, idade e expectativa de sobrevida da tábua do IBGE (Instituto Brasileiro de Geografia e Estatística) publicada até a DER (data de entrada do requerimento), pela fórmula f = (Tc × 0,31 ÷ Es) × [1 + (Id + Tc × 0,31) ÷ 100].\nOnde incide hoje: obrigatório no pedágio de 50% e na aposentadoria por tempo do direito adquirido até 13/11/2019; na aposentadoria por idade e na da pessoa com deficiência, só se aumentar a renda (na da pessoa com deficiência, o INSS, Instituto Nacional do Seguro Social, só aplica essa garantia a quem tinha direito até 13/11/2019, ponto controvertido); nas demais regras da reforma, não se aplica.\nComo afastar: no direito adquirido, a soma de idade e tempo de 95/85 (18/06/2015 a 30/12/2018) ou 96/86 (31/12/2018 a 13/11/2019), com tempo mínimo de 35 anos (homem) ou 30 (mulher) e mais 5 pontos para o professor; no pedágio de 50%, não há como afastar.\nBônus: somam-se 5 anos ao tempo da mulher, 5 ao do professor e 10 ao da professora com magistério exclusivo na educação básica.\nAtenção: o STF (Supremo Tribunal Federal) declarou o fator constitucional (Tema 1.091, trânsito em 27/06/2020), e o tempo rural anterior a 1991 conta no fator e nos pontos por precedentes da TNU (Turma Nacional de Uniformização) fora do rito representativo.", "fonte": "Lei 9.876/1999, art. 7º e Anexo; Lei 8.213/1991, arts. 29, §§ 7º a 9º, e 29-C; Dec. 3.048/1999, art. 188-E; EC 103/2019, art. 17, par. único; STF Tema 1.091; TNU Tema 25", "origem": "síntese dos itens fat-001, fat-002, fat-003, fat-004, fat-005, fat-006, fat-007, fat-008, apos-063, pcd-010, qd-010", "sinal": "firme", "ficha": true}, {"id": "fic-037", "tema": "Revisão: tipos", "pergunta": "Como funciona a revisão de benefício do INSS (o que existe e quais os prazos)?", "variantes": ["revisão de aposentadoria", "revisão do benefício", "regra da revisão do INSS", "quais revisões existem", "prazo para revisar aposentadoria", "como pedir revisão", "minha aposentadoria tem revisão"], "resposta": "Prazo: 10 anos contados do dia primeiro do mês seguinte à primeira prestação, inclusive sobre ponto que o INSS (Instituto Nacional do Seguro Social) não analisou; os atrasados alcançam os últimos 5 anos.\nRevisões vivas: readequação aos tetos de 1998 e 2003 (benefícios até 31/12/2003 com média limitada ao teto, sem decadência); soma de atividades concomitantes (início de 29/11/1999 a 17/06/2019); reclamatória trabalhista (10 anos do trânsito, com prova da época); correção do CNIS (Cadastro Nacional de Informações Sociais); melhor benefício; auxílio intercalado na média; exclusão de salários baixos da média.\nRevisões mortas: vida toda (STF, Supremo Tribunal Federal, Tema 1.102), desaposentação (Tema 503), buraco negro, IRSM (Índice de Reajuste do Salário Mínimo) de 02/1994 fora do acordo, recálculo do art. 29 fora do acordo e 100% na aposentadoria por incapacidade não acidentária (Tema 1.300).\nProva e documentos: carta de concessão com memória de cálculo, histórico de créditos com a primeira prestação, CNIS completo e cópia do processo administrativo.\nVia: em regra direto na Justiça, salvo fato ainda não levado ao INSS, como verbas de ação trabalhista, que exige pedido prévio.\nAtenção: na primeira revisão a pedido o INSS reexamina todos os critérios e pode reduzir o benefício, e se o pedido administrativo segura a decadência está em julgamento no STJ (Superior Tribunal de Justiça), Tema 1.370.", "fonte": "Lei 8.213/1991, arts. 29, 32 e 103; EC 20/1998, art. 14; EC 41/2003, art. 5º; STF Temas 76, 313, 334, 350, 503, 1.102 e 1.300; STJ Temas 975, 1.070, 1.117 e 1.370; IN 128/2022, art. 584", "origem": "síntese dos itens rev-001, rev-003, rev-004, rev-005, rev-009, rev-011, rev-012, rev-014, rev-015, rev-016, rev-018, rev-019, rev-020, rev-027, rev-028, rev-029, rev-031, rev-032, rev-034, rev-035", "sinal": "firme", "ficha": true}, {"id": "fic-038", "tema": "Revisão: prazos", "pergunta": "Como funcionam a decadência e a prescrição nos benefícios do INSS?", "variantes": ["decadência e prescrição", "decadência previdenciária", "prescrição dos atrasados", "prazo de 10 anos para revisão", "atrasados de 5 anos", "perdi o prazo para revisar", "quantos anos de atrasado recebo"], "resposta": "Decadência: 10 anos para revisar o ato de concessão, contados do dia primeiro do mês seguinte à primeira prestação, incluído o ponto não analisado pelo INSS (Instituto Nacional do Seguro Social); para benefício anterior a 1997 o prazo começou em 01/08/1997 e já terminou; a pensão não renova o prazo da aposentadoria que a originou.\nSem decadência: indeferimento, cancelamento e cessação (ADI 6.096, transitada em 03/08/2021), readequação aos tetos e revisão do reajuste.\nPrescrição: prescrevem as parcelas vencidas antes dos 5 anos anteriores à ação; não corre contra menores, incapazes e ausentes.\nSuspensão: o pedido administrativo suspende a prescrição, que volta a correr após a ciência da decisão; na revisão por reclamatória, a TNU (Turma Nacional de Uniformização) entende que ela não corre durante a ação trabalhista (Tema 200).\nReclamatória trabalhista: a revisão tem 10 anos contados do trânsito em julgado da reclamatória (STJ, Superior Tribunal de Justiça, Tema 1.117).\nAcidentária: 5 anos contados do acidente ou do reconhecimento da incapacidade permanente ou do agravamento.\nAtenção: se o pedido de revisão ao INSS segura a decadência está em julgamento no STJ (Tema 1.370), e só a ação judicial garante o prazo com certeza.", "fonte": "Lei 8.213/1991, arts. 103 e 104; ADI 6.096; Súm. 85/STJ; Dec. 20.910/1932, art. 4º; STF Tema 313; STJ Temas 975, 1.117 e 1.370; TNU Tema 200", "origem": "síntese dos itens rev-001, rev-002, rev-003, rev-004, rev-005, rev-006, rev-007, rev-008, rev-020, rev-022, proc-021, proc-022, proc-023, inc-075", "sinal": "firme", "ficha": true}, {"id": "fic-039", "tema": "Pedido no INSS", "pergunta": "Como funciona o pedido no INSS e quais os prazos de resposta?", "variantes": ["pedido no INSS", "como pedir benefício no INSS", "prazo do INSS para responder", "quanto tempo o INSS demora", "requerimento administrativo", "INSS demorando", "precisa pedir no INSS antes da Justiça"], "resposta": "Requerimento prévio: obrigatório para benefício novo antes da ação (STF, Supremo Tribunal Federal, Tema 350); dispensado quando o INSS (Instituto Nacional do Seguro Social) tem entendimento notório contrário e em revisão ou restabelecimento que não dependa de fato novo.\nDocumentação: o INSS não pode recusar o protocolo por falta de documento, mas pedido sem documentação mínima pode tirar o interesse de agir (STJ, Superior Tribunal de Justiça, Tema 1.124, sem trânsito).\nExigência: prazo mínimo de 30 dias da ciência, prorrogável; não cumprida, o pedido se encerra como desistência e o novo pedido tem nova DER (data de entrada do requerimento).\nPrazos de análise: pelo acordo no RE (Recurso Extraordinário) 1.171.152, contados do fim da instrução, 30 dias para salário-maternidade, 45 para incapacidade, 60 para pensão, auxílio-reclusão e auxílio-acidente e 90 para aposentadorias e BPC (benefício de prestação continuada); perícia em até 45 dias do agendamento.\nDemora: excedido o prazo, cabe ação ou mandado de segurança em 120 dias; concedido, o primeiro pagamento sai em até 45 dias da documentação.\nPedido repetido: novo requerimento da mesma espécie só depois da decisão do anterior e dos 30 dias de recurso.\nAtenção: a vigência atual do acordo de prazos não foi confirmada (na falta, vale o prazo geral de 30 dias da Lei 9.784/1999), e o tempo trabalhado depois do pedido pode ser aproveitado pela reafirmação da DER (STJ Tema 995).", "fonte": "STF Tema 350; STJ Temas 995 e 1.124; Lei 8.213/1991, arts. 41-A, § 5º, e 105; IN 128/2022, arts. 566 e 576-A; RE 1.171.152; Lei 9.784/1999, art. 49; Lei 12.016/2009, art. 23", "origem": "síntese dos itens adm-001, adm-002, adm-003, adm-004, adm-005, adm-007, adm-008, adm-009, adm-010, apos-067, apos-068, apos-069", "sinal": "controvertido", "ficha": true}, {"id": "fic-040", "tema": "INSS negou", "pergunta": "O INSS negou: quais são os caminhos?", "variantes": ["INSS negou", "benefício negado", "indeferimento do INSS", "o que fazer quando o INSS nega", "pedido indeferido", "INSS indeferiu minha aposentadoria", "caminhos depois da negativa do INSS"], "resposta": "Caminhos: recurso à Junta de Recursos do CRPS (Conselho de Recursos da Previdência Social), novo requerimento ou ação judicial.\nRecurso: 30 dias corridos da ciência da decisão; a ciência eletrônica se presume 5 dias após a disponibilização, e abrir a decisão antes antecipa o prazo.\nNovo requerimento: da mesma espécie, só depois de decidido o anterior e vencidos os 30 dias de recurso; na incapacidade, 30 dias após a decisão ou a cessação.\nAção judicial: a negativa abre o interesse de agir; o direito ao benefício negado não decai, mas as parcelas prescrevem em 5 anos.\nDocumento novo: pode ir no recurso até a pauta, mas os efeitos financeiros contam da apresentação, e não da DER (data de entrada do requerimento).\nAtenção: entrar com ação com o mesmo pedido equivale a renunciar ao recurso administrativo e desistir do já interposto.", "fonte": "Dec. 3.048/1999, arts. 305, § 1º, e 307; Lei 8.213/1991, arts. 103, par. único, e 126, § 3º; IN 128/2022, arts. 346, 576-A, 580 e 582; ADI 6.096", "origem": "síntese dos itens adm-005, adm-011, adm-013, adm-014, adm-015, proc-021, rev-002", "sinal": "firme", "ficha": true}, {"id": "fic-041", "tema": "INSS negou", "pergunta": "Como funciona o recurso administrativo ao INSS?", "variantes": ["recurso administrativo", "recurso ao INSS", "recurso à Junta de Recursos", "prazo de recurso do INSS", "como recorrer no INSS", "recurso ao CRPS", "recurso da perícia do INSS"], "resposta": "Prazo: 30 dias corridos da ciência da decisão, excluído o dia do começo e incluído o do vencimento; a ciência eletrônica se presume 5 dias após a disponibilização.\nInstâncias: recurso ordinário à Junta de Recursos do CRPS (Conselho de Recursos da Previdência Social) e, contra a decisão da Junta, recurso especial à Câmara de Julgamento em 30 dias, com efeito suspensivo e devolutivo.\nMatéria médica: incapacidade, auxílio-acidente, BPC (benefício de prestação continuada) da pessoa com deficiência e datas de início da doença, da incapacidade e de cessação param na Junta e não sobem à Câmara.\nDuração: até 365 dias por instância, descontadas as diligências; decidido o recurso, o INSS (Instituto Nacional do Seguro Social) tem até 60 dias para cumprir.\nDocumento novo: admitido até a inclusão em pauta, com efeitos financeiros desde a apresentação.\nAtestmed: para indeferimento cientificado a partir da Portaria Conjunta 54/2026 (06/11/2026), cabe também reanálise da documentação em 10 dias.\nAtenção: não há efeito suspensivo fixado para o recurso à Junta, e a ação judicial com o mesmo pedido importa renúncia ao recurso.", "fonte": "Dec. 3.048/1999, arts. 305, 307 e 308; Regimento Interno do CRPS, arts. 71, 77, 80, 89 e 90; IN 128/2022, arts. 580, 582 e 599; Lei 8.213/1991, art. 126, § 3º; Lei 9.784/1999, art. 61", "origem": "síntese dos itens adm-011, adm-014, adm-015, adm-016, adm-017, adm-018, inc-011, inc-020", "sinal": "firme", "ficha": true}, {"id": "fic-042", "tema": "Ação judicial e competência", "pergunta": "Como funciona a ação judicial contra o INSS (onde corre, custo e etapas)?", "variantes": ["ação contra o INSS", "processo contra o INSS", "onde entro com a ação contra o INSS", "quanto custa processar o INSS", "etapas da ação previdenciária", "juizado especial federal", "como funciona o processo no JEF"], "resposta": "Onde corre: benefício comum até 60 salários mínimos no JEF (Juizado Especial Federal), obrigatório onde houver; acima disso, na vara federal; acidentário na Justiça Estadual, qualquer que seja o valor; comarca sem vara federal a mais de 70 km dela, em ação desde 01/01/2020, na Justiça Estadual por competência delegada.\nValor da causa: parcelas vencidas atualizadas mais 12 vincendas; é lícito renunciar ao que exceder 60 salários mínimos para ficar no JEF.\nCusto: no JEF não há custas nem honorários na sentença, mas quem recorre e perde paga custas e honorários de 10% a 20%; na vara federal a condenação fica suspensa com gratuidade por 5 anos; na acidentária o autor é isento; fora dos juizados, em ação desde 03/09/2026, a ADC (Ação Declaratória de Constitucionalidade) 80 presume a insuficiência só até R$ 5.000,00 de renda mensal.\nAdvogado: dispensável no primeiro grau do JEF e obrigatório para recorrer.\nEtapas: requerimento prévio no INSS (Instituto Nacional do Seguro Social), petição inicial, perícia judicial nos casos de incapacidade, sentença, recurso (10 dias úteis no JEF; apelação em 15 dias úteis, em dobro para o INSS), trânsito em julgado, implantação e pagamento por RPV (requisição de pequeno valor) ou precatório.\nTutela de urgência: com probabilidade do direito e perigo de dano, o benefício é implantado antes da sentença; revogada, devolve-se o recebido por desconto de até 30% do benefício.\nAtenção: sem requerimento prévio ao INSS, falta interesse de agir, e ação com o mesmo pedido de recurso administrativo pendente encerra esse recurso.", "fonte": "CF, art. 109, I e § 3º; Lei 10.259/2001, arts. 3º, 10 e 17; Lei 9.099/1995, arts. 41, 42, 54 e 55; CPC, arts. 98, 292, 300 e 1.003; Lei 8.213/1991, art. 129; STF Tema 350 e ADC 80; STJ Temas 692 e 1.030", "origem": "síntese dos itens proc-001, proc-002, proc-003, proc-004, proc-005, proc-006, proc-007, proc-008, proc-009, proc-010, proc-011, proc-012, proc-013, proc-014, proc-015, rev-033, adm-001, adm-015", "sinal": "firme", "ficha": true}, {"id": "fic-043", "tema": "Atrasados e pagamento", "pergunta": "Como funcionam os atrasados e o pagamento por RPV e precatório?", "variantes": ["atrasados do INSS", "RPV", "precatório", "quando recebo os atrasados", "como são pagos os atrasados", "limite da RPV", "correção dos atrasados"], "resposta": "Desde quando: da DER (data de entrada do requerimento) ou da data posterior em que os requisitos foram cumpridos; prova que só surgiu em juízo por impossibilidade material leva o início à citação (STJ, Superior Tribunal de Justiça, Tema 1.124, sem trânsito); sempre respeitada a prescrição de 5 anos.\nCálculo: apura-se a RMI (renda mensal inicial), monta-se o quadro mês a mês, descontam-se os valores já pagos pelo INSS (Instituto Nacional do Seguro Social), aplica-se a prescrição e corrigem-se as parcelas.\nCorreção: INPC (Índice Nacional de Preços ao Consumidor) de 09/2006 a 11/2021, SELIC (Sistema Especial de Liquidação e de Custódia) de 12/2021 a 08/2025 e, desde 09/2025, INPC com taxa legal; juros de mora desde a citação.\nRPV (requisição de pequeno valor): até 60 salários mínimos (R$ 97.260,00 em 2026), paga em 60 dias da entrega da requisição, depois do trânsito em julgado; acima disso, precatório, salvo renúncia ao excedente; é vedado fracionar a execução.\nEntre expedição e pagamento: correção pelo IPCA (Índice Nacional de Preços ao Consumidor Amplo) com juros de 2% ao ano, limitados à SELIC.\nBenefício mensal: implantado por ofício ao INSS com o trânsito em julgado, ou antes por tutela de urgência.\nAtenção: o regime de correção desde 09/2025 não tem norma expressa e pode mudar.", "fonte": "Lei 10.259/2001, arts. 16 e 17; Lei 8.213/1991, arts. 41-A e 103, par. único; STJ Temas 1.124 e 1.207; Súm. 204/STJ; EC 113/2021, art. 3º; STF Tema 810; Manual de Cálculos da JF", "origem": "síntese dos itens proc-017, proc-018, proc-019, proc-020, proc-024, proc-025, proc-026, qd-023", "sinal": "controvertido", "ficha": true}, {"id": "fic-044", "tema": "Perícia, Atestmed e prorrogação", "pergunta": "Como funciona a perícia médica do INSS e a judicial?", "variantes": ["perícia médica", "perícia do INSS", "como funciona a perícia", "Atestmed", "perícia judicial", "nova perícia do INSS", "pente-fino do INSS"], "resposta": "Análise documental: pelo Atestmed, o auxílio por incapacidade temporária sai pelo exame dos atestados, com soma limitada a 30 dias (ampliada temporariamente para 90 por portaria, com termo final em aberto); acima disso, perícia presencial ou por telemedicina; depois de dois indeferimentos documentais seguidos, perícia presencial.\nObrigações: comparecer à perícia, à reabilitação e ao tratamento gratuito, sob pena de suspensão, mesmo com benefício concedido na Justiça; cirurgia e transfusão de sangue são facultativas.\nReavaliação: o INSS (Instituto Nacional do Seguro Social) pode convocar a qualquer momento quem recebe auxílio ou aposentadoria por incapacidade; ficam dispensados os portadores de aids (síndrome da imunodeficiência adquirida), Alzheimer, Parkinson e esclerose lateral amiotrófica, o aposentado com incapacidade irreversível e, sem volta ao trabalho, o aposentado com mais de 60 anos.\nDatas: fixar a DII (data de início da incapacidade) na data da perícia é excepcional e exige fundamentação; prazo de recuperação fixado conta da data do exame, com mínimo de 30 dias da implantação.\nRecurso: à Junta de Recursos em 30 dias; matéria exclusivamente médica não sobe à Câmara de Julgamento.\nNa Justiça: a incapacidade se prova por laudo pericial, e a petição deve descrever a doença, as limitações, a atividade e as falhas da perícia do INSS.\nAtenção: no BPC (benefício de prestação continuada) e na aposentadoria da pessoa com deficiência a avaliação é biopsicossocial, médica e social, e laudo da pessoa com deficiência sem o IF-BrA (Índice de Funcionalidade Brasileiro Aplicado) pode ser impugnado.", "fonte": "Lei 8.213/1991, arts. 43, 60, 101 e 129-A; Portarias Conjuntas MPS/INSS 13/2026, 14/2026 e 43/2026; Dec. 3.048/1999, art. 305; TNU Temas 246, 272 e 343", "origem": "síntese dos itens inc-009, inc-010, inc-011, inc-015, inc-016, inc-017, inc-018, inc-019, inc-020, proc-012, bpc-023, pcd-004, pcd-008", "sinal": "firme", "ficha": true}, {"id": "fic-045", "tema": "CNIS e contagem de tempo", "pergunta": "Como funciona o CNIS e o acerto de vínculos e salários?", "variantes": ["CNIS", "corrigir o CNIS", "acerto do CNIS", "vínculo que não aparece no CNIS", "como incluir emprego no CNIS", "extrato do INSS errado", "retificação de CNIS"], "resposta": "O que é: o CNIS (Cadastro Nacional de Informações Sociais) vale como prova de filiação, tempo de contribuição e salários.\nCorreção: pode ser pedida a qualquer tempo, mesmo sem pedir benefício; o INSS (Instituto Nacional do Seguro Social) tem até 180 dias para fornecer as informações e cabe recurso ao CRPS (Conselho de Recursos da Previdência Social).\nVínculo faltando: inclui-se com início de prova material da época; testemunha sozinha não basta, salvo força maior, e a justificação administrativa ouve de 2 a 6 testemunhas para completar o documento.\nAção trabalhista: o vínculo reconhecido só entra com prova material da época; acordo homologado sem esses elementos não basta.\nEmpregado: os salários contam ainda que o empregador não tenha recolhido a contribuição.\nComo obter: pelo Meu INSS, com a conta gov.br do segurado, ou pelo advogado com procuração eletrônica, que só permite consulta.\nAtenção: dado lançado fora de época só vale com documento que o confirme, e competência abaixo do salário mínimo desde 11/2019 não conta sem ajuste.", "fonte": "Lei 8.213/1991, arts. 29-A, 34, I, 55, § 3º, e 126, III; Dec. 3.048/1999, arts. 19, 19-E e 142 a 151; STJ Tema 1.188", "origem": "síntese dos itens apos-049, apos-050, apos-051, apos-041, rev-012, rev-013, rev-021, doc-009, port-002, port-005", "sinal": "firme", "ficha": true}, {"id": "fic-046", "tema": "Documentos do caso", "pergunta": "Quais documentos levar em cada tipo de caso previdenciário?", "variantes": ["documentos para o INSS", "que documentos levar", "documentos para aposentadoria", "documentos para auxílio-doença", "documentos para pensão", "documentos para o LOAS", "lista de documentos previdenciários"], "resposta": "Aposentadoria: CNIS (Cadastro Nacional de Informações Sociais), carteiras de trabalho, documentos de vínculos fora do CNIS e, se já houve pedido, a carta de indeferimento e a cópia do processo administrativo; no tempo especial, PPP (Perfil Profissiográfico Previdenciário) ou LTCAT (laudo técnico das condições ambientais do trabalho) de cada período.\nRural: por ano do período, contrato de arrendamento, parceria ou comodato, DAP (Declaração de Aptidão ao Pronaf, Programa Nacional de Fortalecimento da Agricultura Familiar), bloco do produtor e notas fiscais de venda; autodeclaração até 31/12/2022 e cadastro no CNIS desde 01/01/2023.\nIncapacidade: laudos com a data de início da incapacidade e as limitações, resultado da perícia do INSS (Instituto Nacional do Seguro Social), carta do benefício e comunicação de cessação, CNIS e, no acidente de trabalho, a CAT (Comunicação de Acidente do Trabalho).\nPensão por morte: certidão de óbito, prova da qualidade de segurado do falecido, certidões dos dependentes, duas provas materiais da união estável (uma de até 24 meses antes do óbito) e, para ex-cônjuge, a decisão de alimentos.\nBPC (benefício de prestação continuada): CPF (Cadastro de Pessoas Físicas), CadÚnico (Cadastro Único) atualizado há no máximo 24 meses, biometria, moradores e renda de cada um, gastos de saúde e, na deficiência, documentação médica.\nRevisão: carta de concessão, salários de contribuição do período e, na reclamatória, inteiro teor da sentença, certidão de trânsito, cálculos homologados e prova da época.\nProfessor: diploma ou habilitação, carteira de trabalho e declaração da escola.\nAtenção: cada arquivo vai com até 5 MB (50 MB no total), legível, colorido e com verso; documento ilegível é desconsiderado e gera exigência.", "fonte": "Lei 8.213/1991, arts. 16, § 5º, 38-B, 55, § 3º, 106 e 129-A; Lei 8.742/1993, art. 20, §§ 12 a 12-B; IN 128/2022, arts. 172, 180 e 274; Plano de Trabalho INSS/OAB-RS, item 8", "origem": "síntese dos itens doc-001, doc-002, doc-003, doc-005, doc-006, doc-007, qd-013, port-010", "sinal": "firme", "ficha": true}, {"id": "fic-047", "tema": "Depois de aposentado e planejamento", "pergunta": "Como funciona o planejamento previdenciário?", "variantes": ["planejamento previdenciário", "planejamento da aposentadoria", "quando posso me aposentar", "vale a pena continuar contribuindo", "qual a melhor regra para mim", "simulação de aposentadoria", "como planejar a aposentadoria"], "resposta": "O que é: comparar, antes do pedido, as regras que o segurado cumpre e os cenários de contribuição, com data, valor e custo de cada um.\nRegras: quem era filiado até 13/11/2019 pode cumprir mais de uma transição e escolher a mais vantajosa, e o direito ao melhor benefício olha o quadro mais favorável entre a data dos requisitos e a DER (data de entrada do requerimento).\nParar de contribuir: quem já tem carência e tempo mínimo e só espera a idade ainda se aposenta, mas o percentual deixa de crescer e, passado o período de graça, fica sem cobertura por incapacidade e sem pensão para os dependentes.\nContribuir sobre mais: base maior eleva a média, até o teto; compara-se o custo adicional com o ganho mensal e o tempo para recuperar o que foi pago.\n11% ou 20%: o 11% basta para a aposentadoria programada e por idade, com média no mínimo; o 20% é necessário para as regras por tempo de contribuição e para regime próprio, e o 11% pode ser complementado depois, com juros.\nAtenção: a escolha da regra fica definitiva com o primeiro pagamento, sem troca por outra, desaposentação ou reaposentação.", "fonte": "EC 103/2019, arts. 15 a 21 e 26; Lei 8.212/1991, art. 21; Lei 8.213/1991, arts. 15 e 18; Lei 10.666/2003, art. 3º; STF Temas 334 e 503; Dec. 3.048/1999, art. 181-B", "origem": "síntese dos itens apos-012, apos-013, apos-070, apos-075, apos-076, apos-077, apos-040", "sinal": "firme", "ficha": true}, {"id": "fic-048", "tema": "Depois de aposentado e planejamento", "pergunta": "Como funciona a vida do aposentado do INSS (trabalhar, contribuir e 13º)?", "variantes": ["aposentado pode trabalhar", "depois de aposentado", "regras para o aposentado", "aposentado que continua trabalhando", "13º do aposentado", "contribuição depois de aposentado", "trocar de aposentadoria"], "resposta": "Trabalho: o aposentado pode continuar trabalhando e segue como segurado obrigatório, contribuindo normalmente.\nContribuições: não aumentam a aposentadoria nem geram outra, exceto salário-família e reabilitação profissional quando empregado.\nTroca: não se troca de aposentadoria depois do primeiro pagamento, e desaposentação e reaposentação não são admitidas (STF, Supremo Tribunal Federal, Tema 503).\n13º: quem recebeu aposentadoria no ano tem abono anual, calculado sobre o benefício de dezembro.\nExceções: o aposentado especial perde o pagamento se permanecer ou voltar à atividade nociva, e o aposentado por incapacidade permanente que volta voluntariamente ao trabalho tem a aposentadoria cancelada; o aposentado como pessoa com deficiência pode trabalhar.\nAtenção: não se recebem duas aposentadorias do RGPS (Regime Geral de Previdência Social), salvo direito adquirido.", "fonte": "Lei 8.212/1991, art. 12, § 4º; Lei 8.213/1991, arts. 18, § 2º, 40, 46, 57, § 8º, e 124, II; STF Temas 503 e 709; IN 128/2022, art. 306", "origem": "síntese dos itens apos-070, apos-071, apos-072, apos-073, apos-074, apos-078, inc-031, pcd-012", "sinal": "firme", "ficha": true}, {"id": "fic-049", "tema": "CNIS e contagem de tempo", "pergunta": "Como funciona a contagem recíproca entre o INSS e o serviço público?", "variantes": ["contagem recíproca", "CTC", "certidão de tempo de contribuição", "levar tempo do INSS para o serviço público", "usar tempo de servidor no INSS", "averbação de tempo", "tempo de serviço público no INSS"], "resposta": "O que é: o tempo de um regime pode ser usado no outro, com compensação financeira entre eles, mediante CTC (Certidão de Tempo de Contribuição).\nDo serviço público para o INSS (Instituto Nacional do Seguro Social): o regime próprio emite a CTC, só para ex-servidor, com o período de data a data, o tempo líquido e a homologação da unidade gestora.\nDo INSS para o serviço público: a CTC é obrigatória e exige contribuição efetiva, salvo empregado, doméstico, avulso e, desde 01/04/2003, contribuinte individual que presta serviço a empresa.\nAlíquota: períodos pagos com 11% ou 5% só entram na CTC se complementados até 20%.\nAtenção: tempo usado para aposentadoria num regime não conta no outro, tempo público e privado no mesmo período não se somam e não existe contagem em dobro; emitir CTC faz cessar o auxílio-acidente.", "fonte": "Lei 8.213/1991, arts. 86, 94 e 96; Dec. 3.048/1999, art. 130; Lei 10.666/2003, art. 4º; IN 128/2022, art. 216, § 2º", "origem": "síntese dos itens apos-052, apos-053, apos-054, apos-039, inc-040", "sinal": "firme", "ficha": true}, {"id": "fic-050", "tema": "Trabalho, acumulação e reabilitação", "pergunta": "Como funciona a reabilitação profissional do INSS?", "variantes": ["reabilitação profissional", "reabilitação do INSS", "regra da reabilitação", "quem tem direito à reabilitação", "readaptação pelo INSS", "voltar ao trabalho em outra função"], "resposta": "O que é: o serviço do INSS (Instituto Nacional do Seguro Social) que prepara o segurado incapaz para a atividade habitual a exercer outra atividade.\nQuem tem direito: o segurado em auxílio por incapacidade temporária que não pode se recuperar para a atividade habitual, inclusive aposentados e o aposentado que continua empregado; a incapacidade parcial e permanente leva à reabilitação, e não à aposentadoria.\nRequisitos: não exige carência; cabe quando a incapacidade para a atividade habitual não tem recuperação.\nRegras obrigatórias: participar é obrigatório, sob pena de suspensão do benefício; a mudança de função compatível com a limitação não é desvio de função; empresas com 100 ou mais empregados devem preencher de 2% a 5% dos cargos com reabilitados ou pessoas com deficiência.\nValor: não é pagamento em dinheiro; inclui fornecimento, reparo e substituição de prótese, órtese e instrumentos de locomoção e transporte do acidentado do trabalho quando necessário.\nInício e duração: o benefício por incapacidade é mantido até o segurado ser considerado reabilitado para atividade que garanta a subsistência ou, se não recuperável, até ser aposentado por incapacidade permanente; ao final, o INSS emite certificado com as atividades que pode exercer.\nDocumentos necessários: laudos médicos com as limitações; resultado da perícia do INSS que indicou a reabilitação; carta do auxílio por incapacidade temporária em curso.\nAtenção: a recuperação que dependa de cirurgia não autoriza, por si só, a aposentadoria por incapacidade permanente, e a cirurgia é facultativa.", "fonte": "Lei 8.213/1991, arts. 62, 89, 90, 92, 93 e 101; TNU Tema 177", "origem": "síntese dos itens inc-069, inc-070, inc-071, inc-032, inc-017, qd-003, apos-071, doc-002", "sinal": "firme", "ficha": true}, {"id": "fic-051", "tema": "Meu INSS e procuração", "pergunta": "Como funciona o Meu INSS e a procuração eletrônica para o advogado?", "variantes": ["Meu INSS", "procuração eletrônica", "como entrar no Meu INSS", "procuração para o advogado no INSS", "senha do gov.br", "advogado acessar meu INSS", "termo de representação"], "resposta": "Acesso: no Meu INSS (Instituto Nacional do Seguro Social), 'Entrar com gov.br', CPF (Cadastro de Pessoas Físicas), 'Continuar', senha e 'Entrar'.\nProcuração eletrônica: feita pelo segurado só no site gov.br, em 'Procurações Eletrônicas', com os dados do advogado, prazo de até 5 anos, serviços 23392 e 23393 e confirmação por código enviado por SMS (mensagem de texto); exige conta gov.br prata ou ouro dos dois e pode ser revogada a qualquer momento.\nAlcance: serve só para consultar pedidos, extratos, documentos e benefícios, sem novo requerimento nem alteração cadastral.\nPara requerer: o advogado usa o próprio acesso ao INSS Digital com termo de representação do Anexo V do acordo INSS e OAB/RS (Ordem dos Advogados do Brasil, Seccional do Rio Grande do Sul), um por requerimento, ou procuração com fins específicos; procuração com amplos poderes é vedada.\nAcompanhamento: em 'Consultar Pedidos' e 'Detalhar', com situação Em Análise, Concluído, Em Exigência ou Cancelado.\nAtenção: o advogado não usa a senha gov.br do cliente, e abrir a decisão ou a exigência no portal pode dar início ao prazo.", "fonte": "Manual da procuração eletrônica do INSS (04/2026); ACT INSS/OAB-RS, cláusula primeira; Plano de Trabalho INSS/OAB-RS, itens 8.1 e 9.6; Regimento Interno do CRPS, art. 80, § 1º", "origem": "síntese dos itens port-001, port-003, port-004, port-005, port-006, port-007", "sinal": "firme", "ficha": true}, {"id": "fic-053", "tema": "Trabalho, acumulação e reabilitação", "pergunta": "O que é e quem tem direito ao serviço social do INSS?", "variantes": ["serviço social do INSS", "assistente social do INSS", "o que é o serviço social", "quem tem direito ao serviço social", "atendimento social do INSS", "orientação sobre direitos no INSS"], "resposta": "O que é: prestação do RGPS (Regime Geral de Previdência Social) que esclarece os beneficiários sobre seus direitos sociais e os meios de exercê-los e ajuda a resolver problemas da relação com a Previdência Social.\nQuem tem direito: segurados e dependentes, com prioridade aos segurados em benefício por incapacidade temporária e atenção especial a aposentados e pensionistas.\nRequisitos: não exige carência.\nRegras obrigatórias: atua por intervenção técnica, assistência de natureza jurídica, ajuda material, recursos sociais, intercâmbio com empresas e pesquisa social; nos hospitais públicos em que atua, orienta os segurados sobre os benefícios por incapacidade; no BPC (benefício de prestação continuada) da pessoa com deficiência, o serviço social do INSS (Instituto Nacional do Seguro Social) faz a avaliação social.\nValor: não é pagamento em dinheiro.\nInício e duração: a Lei 8.213/1991 não fixa início nem duração para o serviço social.\nDocumentos necessários: a Lei 8.213/1991 não fixa documento próprio para o serviço social.\nAtenção: a MP (medida provisória) 905/2019 chegou a revogar o serviço social no rol do art. 18 da Lei 8.213/1991, mas perdeu a vigência, e o serviço segue no texto compilado.", "fonte": "Lei 8.213/1991, arts. 18, III, 'b', 26, IV, e 88; Lei 8.742/1993, art. 20, § 6º", "origem": "síntese dos itens qd-003, bpc-023; Lei-8213-1991_planos-de-beneficios-previdencia.htm, arts. 18, III, e 88 (§ 5º incl. Lei 15.288/2025)", "sinal": "firme", "ficha": true}, {"id": "fic-054", "tema": "Direito adquirido e regras antigas", "pergunta": "O pecúlio do INSS ainda existe?", "variantes": ["pecúlio", "pecúlio do INSS", "devolução das contribuições do aposentado", "pecúlio do aposentado que volta a trabalhar", "pecúlio por acidente"], "resposta": "O que era: pagamento único ao segurado que se incapacitava antes da carência, ao aposentado por idade ou por tempo de serviço que voltava a trabalhar e depois se afastava, e ao segurado ou dependentes na invalidez ou morte por acidente do trabalho.\nSituação: extinto em três etapas. A Lei 8.870/1994, publicada no DOU (Diário Oficial da União) de 16/04/1994 e em vigor na publicação (art. 28), revogou no art. 29 o inciso II do art. 81 e o art. 84 da Lei 8.213/1991, encerrando o pecúlio do aposentado que voltava a trabalhar. A Lei 9.032/1995, DOU de 29/04/1995 e em vigor na publicação (art. 7º), revogou no art. 8º a alínea a do inciso III do art. 18 (pecúlios) e os arts. 82, 83 e 85. A Lei 9.129/1995, DOU de 21/11/1995 e em vigor na publicação (art. 6º), encerrou o instituto no art. 7º: \"São revogados os arts. 81 da Lei nº 8.213, de 24 de julho de 1991\".\nAtenção: as contribuições do aposentado que trabalha não geram devolução nem nova prestação, salvo salário-família e reabilitação profissional quando empregado.", "fonte": "Lei 8.870/1994, arts. 28 e 29; Lei 9.032/1995, arts. 7º e 8º; Lei 9.129/1995, arts. 6º e 7º; Lei 8.213/1991, arts. 18, III, a, e 81 a 85", "origem": "03_TESES/legislacao/leis/Lei-8870-1994_altera-8212-8213-extingue-abono-permanencia.htm, Lei-9129-1995_parcelamento-contribuicoes-revoga-peculios.htm (baixados do Planalto em 10/11/2026) e Lei-9032-1995_altera-8212-8213-atividade-especial.htm; datas de publicação pela nota final de cada texto do Planalto", "sinal": "firme", "ficha": true}, {"id": "fic-055", "tema": "Direito adquirido e regras antigas", "pergunta": "O abono de permanência em serviço ainda existe?", "variantes": ["abono de permanência em serviço", "abono de permanência do INSS", "25% para quem continuava trabalhando", "abono para não se aposentar", "abono de permanência acabou"], "resposta": "O que era: abono mensal de 25% da aposentadoria por tempo de serviço a quem, tendo direito a ela (35 anos ou mais de serviço, homem, ou 30 anos ou mais, mulher), optava por continuar trabalhando.\nSituação: extinto pela Lei 8.870/1994, publicada no DOU (Diário Oficial da União) de 16/04/1994 e em vigor na publicação (art. 28); o art. 29 revogou \"a alínea i, do inciso I do art. 18\" e \"o art. 87 e parágrafo único\" da Lei 8.213/1991, e a mesma lei tirou o abono do rol de carência do art. 25, II.\nAtenção: quem ainda recebe abono de permanência não pode receber junto aposentadoria, salvo direito adquirido, e o preso que recebe abono de permanência não gera auxílio-reclusão.", "fonte": "Lei 8.870/1994, arts. 28 e 29; Lei 8.213/1991, arts. 18, I, i, 25, II (red. Lei 8.870/1994), e 87", "origem": "03_TESES/legislacao/leis/Lei-8870-1994_altera-8212-8213-extingue-abono-permanencia.htm (baixado do Planalto em 10/11/2026; nota final: DOU de 16/04/1994, retificado em 12/05/1994); Lei-8213-1991_planos-de-beneficios-previdencia.htm, arts. 18, 25 e 87", "sinal": "firme", "ficha": true}, {"id": "fic-056", "tema": "Direito adquirido e regras antigas", "pergunta": "O auxílio-natalidade do INSS ainda existe?", "variantes": ["auxílio-natalidade", "auxílio-natalidade do INSS", "benefício por nascimento de filho", "ajuda do INSS pelo parto", "auxílio-natalidade acabou"], "resposta": "O que era: parcela única paga, após 12 contribuições, à segurada gestante ou ao segurado pelo parto da esposa ou companheira não segurada, com remuneração baixa.\nSituação: extinto a partir de 01/01/1996. A LOAS (Lei Orgânica da Assistência Social, Lei 8.742/1993, DOU (Diário Oficial da União) de 08/12/1993), no art. 40, extinguiu a renda mensal vitalícia, o auxílio-natalidade e o auxílio-funeral com a implantação dos benefícios eventuais (art. 22) e do BPC (benefício de prestação continuada, art. 20); o Decreto 1.744/1995, publicado no DOU de 11/12/1995 e hoje revogado pelo Decreto 6.214/2007, fixou a data no art. 39: \"A partir de 1º de janeiro de 1996, ficam extintos o auxílio-natalidade, o auxílio-funeral e a renda mensal vitalícia\". A Lei 9.528/1997, DOU de 11/12/1997, revogou depois, no art. 15, os arts. 139, 140 e 141 da Lei 8.213/1991. O art. 140 previa, ele próprio, o pagamento pela Previdência Social só até a lei da Assistência Social.\nAtenção: o nascimento hoje gera o salário-maternidade (120 dias) e, para o segurado de baixa renda, a cota do salário-família.", "fonte": "Lei 8.742/1993, arts. 20, 22 e 40; Decreto 1.744/1995, art. 39; Lei 9.528/1997, art. 15; Lei 8.213/1991, art. 140, § 6º", "origem": "03_TESES/legislacao/leis/Lei-8742-1993_LOAS-compilada.htm (art. 40); Decreto-1744-1995_regulamento-BPC-extincao-RMV-natalidade-funeral_revogado.htm e Lei-9528-1997_altera-8212-8213-revoga-arts-139-a-141.htm (baixados do Planalto em 10/11/2026); Lei-8213-1991_planos-de-beneficios-previdencia.htm, art. 140", "sinal": "firme", "ficha": true}, {"id": "fic-057", "tema": "Direito adquirido e regras antigas", "pergunta": "O auxílio-funeral do INSS ainda existe?", "variantes": ["auxílio-funeral", "auxílio-funeral do INSS", "INSS paga o enterro", "ajuda para o funeral", "auxílio-funeral acabou"], "resposta": "O que era: valor pago ao executor do funeral pela morte do segurado de baixa renda.\nSituação: extinto a partir de 01/01/1996. A LOAS (Lei Orgânica da Assistência Social, Lei 8.742/1993, DOU (Diário Oficial da União) de 08/12/1993), no art. 40, extinguiu a renda mensal vitalícia, o auxílio-natalidade e o auxílio-funeral com a implantação dos benefícios eventuais (art. 22) e do BPC (benefício de prestação continuada, art. 20); o Decreto 1.744/1995, publicado no DOU de 11/12/1995 e hoje revogado pelo Decreto 6.214/2007, fixou a data no art. 39: \"A partir de 1º de janeiro de 1996, ficam extintos o auxílio-natalidade, o auxílio-funeral e a renda mensal vitalícia\". A Lei 9.528/1997, DOU de 11/12/1997, revogou depois, no art. 15, os arts. 139, 140 e 141 da Lei 8.213/1991. O art. 141, § 2º, previa, ele próprio, o pagamento pela Previdência Social só até a lei da Assistência Social.\nAtenção: a morte do segurado hoje gera a pensão por morte aos dependentes.", "fonte": "Lei 8.742/1993, arts. 22 e 40; Decreto 1.744/1995, art. 39; Lei 9.528/1997, art. 15; Lei 8.213/1991, art. 141, § 2º", "origem": "03_TESES/legislacao/leis/Lei-8742-1993_LOAS-compilada.htm (art. 40); Decreto-1744-1995_regulamento-BPC-extincao-RMV-natalidade-funeral_revogado.htm e Lei-9528-1997_altera-8212-8213-revoga-arts-139-a-141.htm (baixados do Planalto em 10/11/2026); Lei-8213-1991_planos-de-beneficios-previdencia.htm, art. 141", "sinal": "firme", "ficha": true}, {"id": "fic-058", "tema": "Direito adquirido e regras antigas", "pergunta": "A renda mensal vitalícia ainda existe?", "variantes": ["renda mensal vitalícia", "RMV", "amparo previdenciário", "benefício do idoso de 70 anos", "renda mensal vitalícia acabou"], "resposta": "O que era: renda devida ao maior de 70 anos ou inválido sem atividade remunerada nem meios de sustento, desde que tivesse sido filiado à Previdência Social por no mínimo 12 meses, tivesse exercido por no mínimo 5 anos atividade remunerada hoje abrangida pelo RGPS (Regime Geral de Previdência Social) ou tivesse se filiado à antiga Previdência Social Urbana depois dos 60 anos; o valor era de 1 salário mínimo.\nSituação: extinta para novos pedidos a partir de 01/01/1996. A LOAS (Lei Orgânica da Assistência Social, Lei 8.742/1993, DOU (Diário Oficial da União) de 08/12/1993), no art. 40, extinguiu a renda mensal vitalícia com a implantação do BPC (benefício de prestação continuada); o Decreto 1.744/1995, publicado no DOU de 11/12/1995 e hoje revogado pelo Decreto 6.214/2007, fixou no art. 39 a extinção \"A partir de 1º de janeiro de 1996\" e, no art. 40, que o BPC só podia ser requerido a partir de 01/01/1996; o pedido de renda mensal vitalícia ficou assegurado ao maior de 70 anos e ao inválido até 31/12/1995 (Decreto 1.744/1995, art. 39, parágrafo único, e LOAS, art. 40, § 2º, red. Lei 9.711/1998, DOU de 21/11/1998). A Lei 9.528/1997, DOU de 11/12/1997, revogou depois, no art. 15, o art. 139 da Lei 8.213/1991. Quem já recebia segue recebendo: em 2026, R$ 1.621,00.\nAtenção: quem hoje está nessa situação pede o BPC (benefício de prestação continuada) da LOAS (Lei Orgânica da Assistência Social), aos 65 anos ou por deficiência, com renda familiar por pessoa de até 1/4 do salário mínimo.", "fonte": "Lei 8.742/1993, art. 40, caput e § 2º (red. Lei 9.711/1998, art. 25); Decreto 1.744/1995, arts. 39 e 40; Lei 9.528/1997, art. 15; Lei 8.213/1991, art. 139; Portaria Interministerial MPS/MF 13/2026", "origem": "03_TESES/legislacao/leis/Lei-8742-1993_LOAS-compilada.htm (art. 40); Decreto-1744-1995_regulamento-BPC-extincao-RMV-natalidade-funeral_revogado.htm, Lei-9711-1998_recuperacao-haveres-altera-art-40-LOAS.htm e Lei-9528-1997_altera-8212-8213-revoga-arts-139-a-141.htm (baixados do Planalto em 10/11/2026); item qd-023", "sinal": "firme", "ficha": true}, {"id": "apos-001", "tema": "Aposentadoria programada", "pergunta": "Com que idade posso me aposentar hoje?", "variantes": ["qual a idade mínima para aposentar", "idade para aposentadoria depois da reforma", "com quantos anos a mulher se aposenta", "com quantos anos o homem se aposenta"], "resposta": "Para quem se filiou ao INSS (Instituto Nacional do Seguro Social) depois de 13/11/2019, a regra permanente exige 62 anos (mulher) ou 65 anos (homem), com 15 anos de contribuição (mulher) ou 20 anos (homem). Quem já contribuía até 13/11/2019 pode usar também as regras de transição e fica com a mais vantajosa.", "fonte": "EC 103/2019, art. 19; CF, art. 201, § 7º, I", "origem": "doutrina-previdenciaria.md §2", "sinal": "firme"}, {"id": "apos-002", "tema": "Aposentadoria programada", "pergunta": "Posso me aposentar com 15 anos de contribuição?", "variantes": ["15 anos de INSS dá para aposentar", "aposentadoria com tempo mínimo", "tenho só 15 anos de carteira", "quanto tempo mínimo de contribuição"], "resposta": "Mulher: sim, aos 62 anos, com 15 anos de contribuição. Homem: só se já era filiado até 13/11/2019, pela transição por idade (65 anos e 15 anos de contribuição); homem filiado depois dessa data precisa de 20 anos. Em qualquer caso são exigidas 180 contribuições de carência.", "fonte": "EC 103/2019, arts. 18 e 19; Lei 8.213/1991, art. 25, II", "origem": "doutrina-previdenciaria.md §2 e §3", "sinal": "firme"}, {"id": "apos-003", "tema": "Aposentadoria programada", "pergunta": "Ainda existe aposentadoria só por tempo de contribuição, sem idade mínima?", "variantes": ["aposentar só por tempo", "acabou a aposentadoria por tempo de serviço", "35 anos de contribuição sem idade", "30 anos de contribuição mulher sem idade"], "resposta": "Não, salvo para quem completou 35 anos (homem) ou 30 anos (mulher) de contribuição até 13/11/2019, que tem direito adquirido. Para os demais filiados até 13/11/2019, não exigem idade mínima o pedágio de 50%, para quem em 13/11/2019 tinha mais de 33 anos (homem) ou 28 anos (mulher) de contribuição, e a regra de pontos, que soma idade e tempo.", "fonte": "EC 103/2019, arts. 3º, 15 e 17", "origem": "doutrina-previdenciaria.md §2 e §3", "sinal": "firme"}, {"id": "apos-004", "tema": "Aposentadoria programada", "pergunta": "Comecei a contribuir depois da reforma. Posso usar regra de transição?", "variantes": ["filiado depois de novembro de 2019", "primeiro emprego depois de 2019", "regra de transição vale para quem começou agora", "comecei a pagar INSS em 2020"], "resposta": "Não. As regras de transição valem só para quem era filiado até 13/11/2019. Quem se filiou depois segue apenas a regra permanente: 62 anos (mulher) ou 65 anos (homem), com 15 anos (mulher) ou 20 anos (homem) de contribuição.", "fonte": "EC 103/2019, arts. 15 a 20", "origem": "doutrina-previdenciaria.md §2; cenarios-e-custos.md §2", "sinal": "firme"}, {"id": "apos-005", "tema": "Aposentadoria programada", "pergunta": "A regra é diferente para homem e para mulher?", "variantes": ["diferença entre homem e mulher na aposentadoria", "mulher aposenta mais cedo", "mulher precisa de menos tempo"], "resposta": "Sim. Na regra permanente a mulher precisa de 62 anos e 15 anos de contribuição, e o homem de 65 anos e 20 anos; o homem filiado até 13/11/2019 pode usar a transição por idade, com 65 anos e 15 anos de contribuição. No cálculo, o acréscimo de 2 pontos percentuais por ano começa depois de 15 anos de contribuição para a mulher e de 20 anos para o homem.", "fonte": "EC 103/2019, arts. 18, 19 e 26, §§ 2º e 5º", "origem": "doutrina-previdenciaria.md §2 e §4", "sinal": "firme"}, {"id": "apos-006", "tema": "Aposentadoria programada", "pergunta": "Qual é a regra de aposentadoria para professor?", "variantes": ["professora se aposenta mais cedo", "aposentadoria do magistério", "professor tem regra especial", "tempo de sala de aula"], "resposta": "Na regra permanente, 25 anos de magistério e 57 anos de idade (mulher) ou 60 anos (homem). Para filiados até 13/11/2019 há transições próprias: pontos com 25 anos (mulher) ou 30 anos (homem) de magistério, idade mínima progressiva e pedágio de 100%, as duas últimas com idade e tempo reduzidos em 5 anos. O tempo de magistério não se converte em tempo comum.", "fonte": "EC 103/2019, arts. 15, § 3º, 16, § 2º, 19, § 1º, II, e 20, § 1º; Dec. 3.048/1999, art. 54, § 4º", "origem": "doutrina-previdenciaria.md §2; cenarios-e-custos.md §2", "sinal": "firme"}, {"id": "apos-007", "tema": "Direito adquirido e regras antigas", "pergunta": "Completei os requisitos antes da reforma e não pedi. Perdi o direito?", "variantes": ["direito adquirido", "já tinha tempo em 2019 e não pedi", "posso pedir pela regra antiga", "fechei o tempo antes de novembro de 2019"], "resposta": "Não. Quem cumpriu todos os requisitos até 13/11/2019 pode pedir a qualquer tempo pela regra da época, e o valor também é calculado pela lei vigente quando os requisitos foram atendidos.", "fonte": "EC 103/2019, art. 3º, caput e § 2º", "origem": "doutrina-previdenciaria.md §3", "sinal": "firme"}, {"id": "apos-008", "tema": "Direito adquirido e regras antigas", "pergunta": "Como era a aposentadoria por tempo de contribuição antes da reforma?", "variantes": ["aposentadoria por tempo integral", "regra antiga 35 anos", "aposentadoria antiga sem idade", "como era antes de 2019"], "resposta": "Exigia 35 anos de contribuição (homem) ou 30 anos (mulher), sem idade mínima, e 180 contribuições de carência. O valor era 100% do salário de benefício multiplicado pelo fator previdenciário, salvo quando o segurado alcançava os pontos da fórmula 85/95 (86/96 desde 31/12/2018). Só vale para quem completou esses requisitos até 13/11/2019.", "fonte": "CF, art. 201, § 7º, I (red. EC 20/1998); Lei 8.213/1991, arts. 25, II, 29 e 29-C; EC 103/2019, art. 3º", "origem": "doutrina-previdenciaria.md §3", "sinal": "firme"}, {"id": "apos-009", "tema": "Direito adquirido e regras antigas", "pergunta": "O que era a regra 86/96?", "variantes": ["fórmula 85/95", "regra dos pontos antiga", "aposentadoria sem fator previdenciário", "86 pontos mulher 96 pontos homem"], "resposta": "Era a fórmula que afastava o fator previdenciário quando a soma de idade e tempo de contribuição atingia os pontos, com tempo mínimo de 35 anos (homem) ou 30 anos (mulher). Valeu 95/85 de 18/06/2015 a 30/12/2018 e 96/86 de 31/12/2018 a 13/11/2019. Quem atingiu os pontos e não pediu conserva a pontuação da data em que cumpriu.", "fonte": "Lei 8.213/1991, art. 29-C, §§ 2º e 4º (red. Lei 13.183/2015); Dec. 3.048/1999, art. 188-E, §§ 8º a 10", "origem": "doutrina-previdenciaria.md §3", "sinal": "firme"}, {"id": "apos-010", "tema": "Direito adquirido e regras antigas", "pergunta": "Ainda dá para pedir a aposentadoria proporcional?", "variantes": ["aposentadoria proporcional", "pedágio de 40%", "aposentadoria com 30 anos homem", "proporcional da reforma de 1998"], "resposta": "Só como direito adquirido: era preciso ser filiado até 16/12/1998, ter 53 anos (homem) ou 48 anos (mulher) e 30 anos (homem) ou 25 anos (mulher) de contribuição mais o pedágio de 40%, tudo cumprido até 13/11/2019. O valor era 70% mais 5% por ano excedente, até 100%.", "fonte": "EC 20/1998, art. 9º, § 1º (revogado pela EC 103/2019, art. 35, II); EC 103/2019, art. 3º", "origem": "doutrina-previdenciaria.md §3", "sinal": "firme"}, {"id": "apos-011", "tema": "Direito adquirido e regras antigas", "pergunta": "Como era a aposentadoria por idade antes da reforma?", "variantes": ["aposentadoria por idade regra antiga", "60 anos mulher antes de 2019", "idade antes da reforma"], "resposta": "No meio urbano, 65 anos (homem) ou 60 anos (mulher), com a carência cumprida. O valor era 70% do salário de benefício mais 1% por grupo de 12 contribuições, até 100%. Vale para quem reuniu idade e carência até 13/11/2019.", "fonte": "Lei 8.213/1991, arts. 48 e 50; EC 103/2019, art. 3º", "origem": "doutrina-previdenciaria.md §3", "sinal": "firme"}, {"id": "apos-012", "tema": "Direito adquirido e regras antigas", "pergunta": "Se eu tenho direito pela regra antiga e pela nova, qual vale?", "variantes": ["melhor benefício", "o INSS escolhe a regra mais vantajosa", "qual regra paga mais", "comparar regra antiga e nova"], "resposta": "Vale a mais favorável. Pelo direito ao melhor benefício, o cálculo observa o quadro mais vantajoso entre a data em que os requisitos foram cumpridos e a DER (data de entrada do requerimento), ainda que o valor tenha caído depois. Isso não permite misturar regras de regimes diferentes.", "fonte": "STF, Tema 334; Dec. 3.048/1999, art. 181-D", "origem": "doutrina-previdenciaria.md §3-A; cenarios-e-custos.md §2", "sinal": "firme"}, {"id": "apos-013", "tema": "Regras de transição", "pergunta": "Posso me encaixar em mais de uma regra de transição?", "variantes": ["qual regra de transição é a minha", "posso escolher a regra", "cumpro duas regras ao mesmo tempo"], "resposta": "Sim. Para quem era filiado até 13/11/2019, cada regra de transição é autônoma: o segurado pode cumprir mais de uma e escolhe a mais vantajosa, comparando data e valor de cada uma.", "fonte": "EC 103/2019, arts. 15 a 18, 20 e 21", "origem": "doutrina-previdenciaria.md §2", "sinal": "firme"}, {"id": "apos-014", "tema": "Regras de transição", "pergunta": "Como funciona a regra dos pontos?", "variantes": ["regra de pontos", "soma de idade e tempo", "transição por pontuação", "quantos pontos preciso"], "resposta": "Exige 30 anos (mulher) ou 35 anos (homem) de contribuição e que a soma de idade e tempo de contribuição, contados em dias, alcance os pontos do ano. Em 2026 são 93 pontos (mulher) e 103 (homem), com 1 ponto a mais por ano até 100 (mulher) e 105 (homem). O valor é 60% da média mais 2 pontos percentuais por ano acima de 15 anos (mulher) ou 20 anos (homem). Só para filiados até 13/11/2019.", "fonte": "EC 103/2019, arts. 15 e 26, §§ 2º e 5º", "origem": "doutrina-previdenciaria.md §2", "sinal": "firme"}, {"id": "apos-015", "tema": "Regras de transição", "pergunta": "Quantos pontos são exigidos em cada ano?", "variantes": ["tabela de pontos", "pontos em 2027", "pontos em 2028", "quando os pontos param de subir"], "resposta": "Mulher: 86 em 2019 até 92 em 2025; 93 em 2026; 94 em 2027; 95 em 2028; 96 em 2029; 97 em 2030; 98 em 2031; 99 em 2032; 100 de 2033 em diante. Homem: 96 em 2019 até 102 em 2025; 103 em 2026; 104 em 2027; 105 de 2028 em diante.", "fonte": "EC 103/2019, art. 15, §§ 1º e 2º", "origem": "doutrina-previdenciaria.md §2 (tabela do art. 15)", "sinal": "firme"}, {"id": "apos-016", "tema": "Regras de transição", "pergunta": "Quantos pontos o professor precisa?", "variantes": ["pontos do professor", "tabela de pontos da professora", "transição de pontos magistério"], "resposta": "Com 25 anos (professora) ou 30 anos (professor) de magistério: professora, 88 pontos em 2026, 89 em 2027, 90 em 2028, 91 em 2029 e 92 de 2030 em diante; professor, 98 em 2026, 99 em 2027 e 100 de 2028 em diante. Vale só para filiados até 13/11/2019.", "fonte": "EC 103/2019, art. 15, § 3º", "origem": "doutrina-previdenciaria.md §2 (tabela do art. 15)", "sinal": "firme"}, {"id": "apos-017", "tema": "Regras de transição", "pergunta": "Como funciona a regra da idade mínima progressiva?", "variantes": ["idade mínima que aumenta", "transição por idade e tempo", "56 anos e 30 de contribuição", "idade progressiva"], "resposta": "Exige 30 anos (mulher) ou 35 anos (homem) de contribuição e a idade mínima do ano, que sobe 6 meses por ano. Mulher: 59 anos e 6 meses em 2026, 60 em 2027, 60 e 6 meses em 2028, 61 em 2029, 61 e 6 meses em 2030 e 62 de 2031 em diante. Homem: 64 anos e 6 meses em 2026 e 65 de 2027 em diante. Para professor, idade e tempo são reduzidos em 5 anos; o valor é 60% da média mais 2 pontos percentuais por ano acima de 15 anos (mulher) ou 20 anos (homem).", "fonte": "EC 103/2019, arts. 16 e 26, §§ 2º e 5º", "origem": "doutrina-previdenciaria.md §2 (tabela do art. 16)", "sinal": "firme"}, {"id": "apos-018", "tema": "Regras de transição", "pergunta": "Como funciona o pedágio de 50%?", "variantes": ["pedágio de 50 por cento", "faltava pouco em 2019", "transição sem idade mínima", "faltavam dois anos quando veio a reforma"], "resposta": "Vale só para quem, em 13/11/2019, tinha mais de 28 anos (mulher) ou 33 anos (homem) de contribuição. É preciso completar 30 anos (mulher) ou 35 anos (homem) e pagar um pedágio de 50% do tempo que faltava naquela data, sem idade mínima. O valor é a média multiplicada pelo fator previdenciário.", "fonte": "EC 103/2019, art. 17 e parágrafo único; Dec. 3.048/1999, art. 188-K", "origem": "doutrina-previdenciaria.md §2 e §4", "sinal": "firme"}, {"id": "apos-019", "tema": "Regras de transição", "pergunta": "Como funciona o pedágio de 100%?", "variantes": ["pedágio de 100 por cento", "aposentadoria com 100% da média", "57 anos mulher 60 anos homem", "transição com pedágio integral"], "resposta": "Exige 57 anos (mulher) ou 60 anos (homem), 30 anos (mulher) ou 35 anos (homem) de contribuição e mais um pedágio igual a 100% do tempo que faltava em 13/11/2019. O valor é 100% da média. Para professor, idade e tempo são reduzidos em 5 anos.", "fonte": "EC 103/2019, arts. 20 e 26, § 3º, I", "origem": "doutrina-previdenciaria.md §2 e §4", "sinal": "firme"}, {"id": "apos-020", "tema": "Regras de transição", "pergunta": "Como se calcula o pedágio?", "variantes": ["quanto tempo de pedágio vou pagar", "o que é o tempo que faltava", "conta do pedágio"], "resposta": "Primeiro se apura quanto faltava em 13/11/2019: tempo mínimo (30 anos mulher ou 35 anos homem) menos o tempo que a pessoa tinha naquela data. No pedágio de 50%, exige-se o tempo mínimo mais metade do que faltava; no de 100%, o tempo mínimo mais todo o tempo que faltava.", "fonte": "EC 103/2019, arts. 17 e 20", "origem": "doutrina-previdenciaria.md §2 (fórmulas do pedágio)", "sinal": "firme"}, {"id": "apos-021", "tema": "Regras de transição", "pergunta": "Como funciona a transição da aposentadoria por idade?", "variantes": ["aposentadoria por idade transição", "mulher com 62 anos e 15 de contribuição", "homem 65 anos e 15 anos", "idade da mulher subiu"], "resposta": "Para filiados até 13/11/2019, exige 15 anos de contribuição para ambos os sexos, 65 anos para o homem e, para a mulher, 60 anos em 2019, subindo 6 meses por ano até 62 anos, idade exigida desde 2023. O valor é 60% da média mais 2 pontos percentuais por ano acima de 15 anos (mulher) ou 20 anos (homem).", "fonte": "EC 103/2019, arts. 18 e 26, §§ 2º e 5º", "origem": "doutrina-previdenciaria.md §2", "sinal": "firme"}, {"id": "apos-022", "tema": "Regras de transição", "pergunta": "Qual regra paga 100% da média?", "variantes": ["como ganhar a aposentadoria integral", "aposentadoria sem redutor", "qual regra paga mais"], "resposta": "Entre as aposentadorias programadas, só o pedágio de 100% paga 100% da média direto. O pedágio de 50% paga a média multiplicada pelo fator previdenciário, e as demais regras pagam 60% da média mais 2 pontos percentuais por ano acima de 15 anos (mulher) ou 20 anos (homem).", "fonte": "EC 103/2019, arts. 17, parágrafo único, e 26, §§ 2º, 3º, I, e 5º", "origem": "doutrina-previdenciaria.md §4", "sinal": "firme"}, {"id": "apos-023", "tema": "Regras de transição", "pergunta": "Como fica a aposentadoria especial por pontos para quem já trabalhava antes da reforma?", "variantes": ["especial por pontos", "86 pontos e 25 anos de insalubridade", "aposentadoria especial transição"], "resposta": "Para filiados até 13/11/2019, exige 66 pontos e 15 anos de exposição, 76 pontos e 20 anos, ou 86 pontos e 25 anos, conforme a atividade, com pontos fixos que não sobem com o tempo. O valor é 60% da média mais 2 pontos percentuais por ano acima de 20 anos de contribuição, ou acima de 15 anos para mulheres e na especial de 15 anos. Exige exposição permanente, não ocasional nem intermitente.", "fonte": "EC 103/2019, arts. 21 e 26, § 5º; Dec. 3.048/1999, art. 188-P, §§ 3º e 4º", "origem": "doutrina-previdenciaria.md §2", "sinal": "firme"}, {"id": "apos-024", "tema": "Carência e qualidade de segurado", "pergunta": "Quantas contribuições preciso ter para me aposentar?", "variantes": ["carência da aposentadoria", "180 contribuições", "quantos meses de contribuição", "o que é carência"], "resposta": "São 180 contribuições mensais de carência para a aposentadoria por idade, por tempo de contribuição e especial. Carência é o número mínimo de contribuições exigido; não se confunde com o tempo de contribuição.", "fonte": "Lei 8.213/1991, art. 25, II", "origem": "doutrina-previdenciaria.md §3 e §6", "sinal": "firme"}, {"id": "apos-025", "tema": "Carência e qualidade de segurado", "pergunta": "Comecei a contribuir antes de 1991. Minha carência é menor?", "variantes": ["tabela progressiva de carência", "inscrito antes de 1991", "carência do artigo 142"], "resposta": "Para inscritos até 24/07/1991, a carência segue a tabela pelo ano em que todas as condições foram cumpridas: 60 contribuições em 1991 e 1992, subindo ano a ano até 180 contribuições de 2011 em diante. Para quem cumpre os requisitos hoje, a carência já é de 180.", "fonte": "Lei 8.213/1991, art. 142", "origem": "doutrina-previdenciaria.md §3", "sinal": "firme"}, {"id": "apos-026", "tema": "Carência e qualidade de segurado", "pergunta": "Carência e tempo de contribuição são a mesma coisa?", "variantes": ["diferença entre carência e tempo", "tenho tempo mas não tenho carência", "o que conta como carência"], "resposta": "Não. Carência é o número de contribuições mensais exigido; tempo de contribuição é o período contado em anos, meses e dias. Há períodos que contam como tempo e não como carência, como contribuições em atraso anteriores à primeira paga em dia, indenização de período antigo e tempo rural anterior a 1991 sem contribuição.", "fonte": "Lei 8.213/1991, arts. 25, 27, II, e 55, § 2º", "origem": "doutrina-previdenciaria.md §6", "sinal": "firme"}, {"id": "apos-027", "tema": "Carência e qualidade de segurado", "pergunta": "Quantas contribuições cada benefício exige?", "variantes": ["carência do auxílio-doença", "carência de cada benefício", "12 contribuições", "carência do auxílio-reclusão"], "resposta": "12 contribuições para auxílio por incapacidade temporária e aposentadoria por incapacidade permanente; 180 para aposentadoria por idade, por tempo e especial; 24 para o auxílio-reclusão. A carência de 10 contribuições do salário-maternidade foi declarada inconstitucional pelo STF (Supremo Tribunal Federal).", "fonte": "Lei 8.213/1991, art. 25, I a IV; STF, ADIs 2.110 e 2.111", "origem": "doutrina-previdenciaria.md §6", "sinal": "firme"}, {"id": "apos-028", "tema": "Carência e qualidade de segurado", "pergunta": "Parei de contribuir. Até quando continuo segurado?", "variantes": ["período de graça", "quanto tempo fico coberto sem pagar", "perdi a qualidade de segurado", "fiquei desempregado e parei de pagar"], "resposta": "Em regra, 12 meses após a última contribuição. Passa a 24 meses para quem tem mais de 120 contribuições sem perda da qualidade, e soma mais 12 meses para o desempregado com registro no órgão próprio. O facultativo tem 6 meses, e quem está recebendo benefício, exceto auxílio-acidente, mantém a qualidade sem limite.", "fonte": "Lei 8.213/1991, art. 15, I, II, VI, §§ 1º e 2º", "origem": "doutrina-previdenciaria.md §6", "sinal": "firme"}, {"id": "apos-029", "tema": "Carência e qualidade de segurado", "pergunta": "Em que dia exatamente perco a qualidade de segurado?", "variantes": ["quando perco o seguro do INSS", "data da perda da qualidade", "último dia do período de graça"], "resposta": "No dia seguinte ao término do prazo para pagar a contribuição do mês imediatamente posterior ao fim do período de graça. Para contribuinte individual e facultativo, esse prazo vence no dia 15 do mês seguinte ao da competência.", "fonte": "Lei 8.213/1991, art. 15, § 4º; Lei 8.212/1991, art. 30, II", "origem": "doutrina-previdenciaria.md §6", "sinal": "firme"}, {"id": "apos-030", "tema": "Carência e qualidade de segurado", "pergunta": "Se eu perder a qualidade de segurado, perco a aposentadoria?", "variantes": ["preciso estar pagando para aposentar", "parei de pagar há anos, ainda aposento", "perda da qualidade e aposentadoria", "tenho que ser segurado quando pedir"], "resposta": "Não. A perda da qualidade de segurado não impede a aposentadoria por tempo de contribuição, a especial nem a por idade, desde que cumpridos a carência e os demais requisitos da regra. O que se perde é a cobertura por incapacidade e a pensão aos dependentes enquanto a pessoa estiver sem qualidade.", "fonte": "Lei 10.666/2003, art. 3º", "origem": "doutrina-previdenciaria.md §6; haack-prev-planejamento SKILL.md §4, Etapa C", "sinal": "firme"}, {"id": "apos-031", "tema": "Carência e qualidade de segurado", "pergunta": "Pago como autônomo abaixo do mínimo. Isso mantém minha qualidade de segurado?", "variantes": ["contribuição baixa mantém a cobertura", "período de graça do autônomo", "paguei menos que o salário mínimo"], "resposta": "Não. O contribuinte individual só tem período de graça contado a partir da última contribuição igual ou superior ao salário mínimo; a competência abaixo do mínimo sem ajuste não serve para isso.", "fonte": "Dec. 3.048/1999, art. 13, §§ 7º e 8º", "origem": "doutrina-previdenciaria.md §6; cenarios-e-custos.md §7", "sinal": "firme"}, {"id": "apos-032", "tema": "Categorias e alíquotas", "pergunta": "Quem é obrigado a contribuir para o INSS?", "variantes": ["segurado obrigatório", "tipos de segurado", "categorias do INSS", "sou obrigado a pagar INSS"], "resposta": "São segurados obrigatórios o empregado, o empregado doméstico, o contribuinte individual, o trabalhador avulso e o segurado especial (produtor rural em regime de economia familiar), conforme a atividade exercida. Quem trabalha numa dessas condições é filiado ao INSS (Instituto Nacional do Seguro Social) pela própria atividade.", "fonte": "Lei 8.213/1991, art. 11, I, II, V, VI e VII", "origem": "Lei 8.213/1991 compilada, art. 11 (03_TESES/legislacao)", "sinal": "firme"}, {"id": "apos-033", "tema": "Categorias e alíquotas", "pergunta": "Quem não trabalha pode contribuir para o INSS?", "variantes": ["contribuir como facultativo", "dona de casa pode pagar INSS", "estudante pode contribuir", "pagar INSS sem trabalhar"], "resposta": "Sim, como segurado facultativo: é quem não se enquadra em nenhuma categoria obrigatória e se filia mediante contribuição. O facultativo paga 20% sobre a base escolhida, 11% do salário mínimo no plano simplificado ou 5% do mínimo se não tiver renda própria, se dedicar só ao trabalho doméstico na própria casa e a família for de baixa renda inscrita no CadÚnico (Cadastro Único para Programas Sociais), com renda de até 2 salários mínimos.", "fonte": "Lei 8.213/1991, art. 13; Lei 8.212/1991, art. 21, caput, § 2º, I e II, 'b', e § 4º", "origem": "cenarios-e-custos.md §3; Lei 8.213/1991 compilada, art. 13; Lei 8.212/1991 compilada, art. 21, § 2º, II, 'b', e § 4º", "sinal": "firme"}, {"id": "apos-034", "tema": "Categorias e alíquotas", "pergunta": "Quanto o empregado de carteira assinada contribui?", "variantes": ["desconto do INSS no salário", "alíquota do empregado", "quanto desconta de INSS"], "resposta": "Desde março de 2020 a contribuição do empregado é progressiva, calculada faixa a faixa sobre o salário, até o teto; até fevereiro de 2020 era uma alíquota única sobre o total. As faixas são atualizadas todo ano por portaria.", "fonte": "EC 103/2019, art. 28; Lei 8.212/1991, art. 20", "origem": "cenarios-e-custos.md §3", "sinal": "firme"}, {"id": "apos-035", "tema": "Categorias e alíquotas", "pergunta": "Sou autônomo. Quanto tenho que pagar de INSS?", "variantes": ["contribuinte individual quanto paga", "carnê de autônomo", "pagar 20% do INSS", "quanto paga quem trabalha por conta"], "resposta": "No plano normal, 20% sobre a base que você declarar, entre o salário mínimo (R$ 1.621,00 em 2026) e o teto (R$ 8.475,55 em 2026). O vencimento é o dia 15 do mês seguinte ao da competência. Quem trabalha por conta própria, sem relação com empresa, pode optar pelo plano simplificado de 11% sobre o salário mínimo.", "fonte": "Lei 8.212/1991, arts. 21, caput e § 2º, I, 28, §§ 3º e 5º, e 30, II; Decreto 12.797/2025, art. 1º; Portaria Interministerial MPS/MF 13/2026, art. 2º", "origem": "cenarios-e-custos.md §3; doutrina-previdenciaria.md §4", "sinal": "firme"}, {"id": "apos-036", "tema": "Categorias e alíquotas", "pergunta": "Pagar 11% no plano simplificado vale para aposentadoria?", "variantes": ["plano simplificado", "contribuição de 11%", "pagar o mínimo do INSS", "11% conta tempo"], "resposta": "Vale para a aposentadoria programada e para a por idade. Não vale para as regras por tempo de contribuição (pontos, idade progressiva, pedágio de 50% e de 100%) nem para levar o tempo a regime próprio, salvo se complementar a diferença até 20% sobre o salário mínimo da competência.", "fonte": "Lei 8.213/1991, art. 18, § 3º; Lei 8.212/1991, art. 21, §§ 2º, I, e 3º; IN 128/2022, art. 216, V, 'a', e §§ 1º e 2º (red. IN 212/2026)", "origem": "cenarios-e-custos.md §2 e §3; doutrina-previdenciaria.md §6", "sinal": "firme"}, {"id": "apos-037", "tema": "Categorias e alíquotas", "pergunta": "Sou MEI. Os 5% que pago contam para aposentadoria?", "variantes": ["MEI aposenta", "microempreendedor individual INSS", "DAS do MEI conta tempo", "5% do salário mínimo"], "resposta": "Sim para a aposentado
