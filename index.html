<body>
<title>Consulta Previdenciária</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<style>
/* Layout: uma coluna de leitura; a caixa de pergunta fica presa no topo, a resposta vem logo abaixo em corpo grande. */
:root {
  --bg: #F8F8F5; --surface: #FFFFFF; --fg: #23221E; --muted: #606060; --line: #E2DFD5;
  --gold: #B8940A; --gold-text: #7A6100; --gold-soft: #F5EFD7; --warn: #8A4B00; --warn-soft: #FBEBD5;
  --font: "Montserrat", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161613; --surface: #1F1E1A; --fg: #ECE9DF; --muted: #A5A195; --line: #35332B;
    --gold: #D2AC22; --gold-text: #E0BD45; --gold-soft: #2C2712; --warn: #F0B56A; --warn-soft: #33260F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161613; --surface: #1F1E1A; --fg: #ECE9DF; --muted: #A5A195; --line: #35332B;
  --gold: #D2AC22; --gold-text: #E0BD45; --gold-soft: #2C2712; --warn: #F0B56A; --warn-soft: #33260F;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 0 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }

.topo { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 12px; display: flex; flex-direction: column; gap: 10px; }
.marca { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.marca b { font-weight: 700; letter-spacing: .14em; font-size: 11px; text-transform: uppercase; color: var(--gold-text); }
.marca span { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.caixa { position: relative; }
#q { width: 100%; font: 500 18px/1.3 var(--font); color: var(--fg); background: var(--surface); border: 1.5px solid var(--line);
  border-radius: 10px; padding: 15px 46px 15px 16px; outline: none; -webkit-appearance: none; appearance: none; }
#q::placeholder { color: var(--muted); font-weight: 400; }
#q:focus { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }
#q::-webkit-search-cancel-button { display: none; }
#limpar { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border: 0; background: none;
  color: var(--muted); font-size: 22px; line-height: 1; cursor: pointer; border-radius: 8px; }
#limpar:hover { color: var(--fg); }
button:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

main, .pilha { display: flex; flex-direction: column; gap: 22px; }
main { padding-top: 8px; }
.pilha:empty { display: none; }
.barra { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; min-height: 20px; }
#dica { font-size: 12px; color: var(--muted); flex: 1 1 200px; min-width: 0; }
.resposta.fora { border-top-color: var(--warn); }
.resposta .texto.pensando { color: var(--muted); font-weight: 400; font-size: 15px; }
.usados { display: flex; flex-direction: column; gap: 6px; }
.rotulo { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }

/* Resposta principal */
.resposta { background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--gold); border-radius: 10px; padding: 20px 20px 16px; display: flex; flex-direction: column; gap: 12px; }
.resposta h2 { margin: 0; font-size: 14px; font-weight: 600; color: var(--muted); text-wrap: balance; }
.resposta .texto { margin: 0; font-size: 19px; line-height: 1.55; font-weight: 500; white-space: pre-line; overflow-wrap: anywhere; }
.pe { display: flex; gap: 10px 14px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 10px; }
.fonte { margin: 0; font-size: 12px; color: var(--muted); flex: 1 1 260px; min-width: 0; overflow-wrap: anywhere; }
.fonte b { font-weight: 600; }
.acoes { display: flex; gap: 8px; flex-wrap: wrap; }
.pilula { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .04em; padding: 3px 9px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); align-self: flex-start; }
.pilula.tema { background: var(--gold-soft); color: var(--gold-text); }
.cab { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { font: 600 12.5px var(--font); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
.btn:hover { border-color: var(--gold); }
.btn.forte { background: var(--gold); border-color: var(--gold); color: #1B1700; }
.btn[disabled] { opacity: .55; cursor: default; }

/* Lista de perguntas */
.lista { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
.lista details + details { border-top: 1px solid var(--line); }
.lista summary { list-style: none; cursor: pointer; padding: 12px 16px; font-weight: 500; font-size: 14.5px; display: flex; gap: 10px; justify-content: space-between; align-items: baseline; }
.lista summary::-webkit-details-marker { display: none; }
.lista summary::after { content: "+"; color: var(--gold-text); font-weight: 600; flex: none; }
.lista details[open] summary::after { content: "−"; }
.lista summary:hover { background: var(--gold-soft); }
.lista .corpo { padding: 0 16px 14px; display: flex; flex-direction: column; gap: 8px; }
.lista .corpo p { margin: 0; font-size: 16px; line-height: 1.55; white-space: pre-line; overflow-wrap: anywhere; }
.lista .corpo .fonte { font-size: 12px; flex: none; }

/* Temas */
.temas { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
.temas button { text-align: left; font: 500 13.5px/1.3 var(--font); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.temas button:hover { border-color: var(--gold); }
.temas button span { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.grupo { display: flex; flex-direction: column; gap: 8px; }
.grupo h3 { margin: 0; font-size: 13px; font-weight: 700; color: var(--gold-text); }

.aviso { margin: 0; font-size: 13.5px; color: var(--muted); }
.claude { border-top-color: var(--muted); }
.claude .texto.pensando { color: var(--muted); font-weight: 400; font-size: 15px; }
.rodape { font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; margin: 0; }
@media (max-width: 480px) { .resposta .texto { font-size: 17.5px; } #q { font-size: 16.5px; } }
</style>

<div class="wrap">
  <div class="topo">
    <div class="marca"><b>Haack Advogados · Consulta Previdenciária</b><span id="meta"></span></div>
    <div class="caixa">
      <input id="q" type="search" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"
        placeholder="Digite a pergunta do cliente" aria-label="Pergunta do cliente">
      <button id="limpar" type="button" aria-label="Limpar a pergunta" hidden>×</button>
    </div>
    <div class="barra">
      <span id="dica"></span>
      <span class="acoes">
        <button id="nova" class="btn" type="button" hidden>Nova conversa</button>
        <button id="enviar" class="btn forte" type="button" hidden>Responder</button>
      </span>
    </div>
  </div>
  <main>
    <div id="conversa" class="pilha" aria-live="polite"></div>
    <div id="saida" class="pilha"></div>
  </main>
</div>

<script type="application/json" id="base">{"data": "10/11/2026", "itens": [{"id": "apos-001", "tema": "Aposentadoria programada", "pergunta": "Com que idade posso me aposentar hoje?", "variantes": ["qual a idade mínima para aposentar", "idade para aposentadoria depois da reforma", "com quantos anos a mulher se aposenta", "com quantos anos o homem se aposenta"], "resposta": "Para quem se filiou ao INSS (Instituto Nacional do Seguro Social) depois de 13/11/2019, a regra permanente exige 62 anos (mulher) ou 65 anos (homem), com 15 anos de contribuição (mulher) ou 20 anos (homem). Quem já contribuía até 13/11/2019 pode usar também as regras de transição e fica com a mais vantajosa.", "fonte": "EC 103/2019, art. 19; CF, art. 201, § 7º, I", "origem": "doutrina-previdenciaria.md §2", "sinal": "firme"}, {"id": "apos-002", "tema": "Aposentadoria programada", "pergunta": "Posso me aposentar com 15 anos de contribuição?", "variantes": ["15 anos de INSS dá para aposentar", "aposentadoria com tempo mínimo", "tenho só 15 anos de carteira", "quanto tempo mínimo de contribuição"], "resposta": "Mulher: sim, aos 62 anos, com 15 anos de contribuição. Homem: só se já era filiado até 13/11/2019, pela transição por idade (65 anos e 15 anos de contribuição); homem filiado depois dessa data precisa de 20 anos. Em qualquer caso são exigidas 180 contribuições de carência.", "fonte": "EC 103/2019, arts. 18 e 19; Lei 8.213/1991, art. 25, II", "origem": "doutrina-previdenciaria.md §2 e §3", "sinal": "firme"}, {"id": "apos-003", "tema": "Aposentadoria programada", "pergunta": "Ainda existe aposentadoria só por tempo de contribuição, sem idade mínima?", "variantes": ["aposentar só por tempo", "acabou a aposentadoria por tempo de serviço", "35 anos de contribuição sem idade", "30 anos de contribuição mulher sem idade"], "resposta": "Não, salvo para quem completou 35 anos (homem) ou 30 anos (mulher) de contribuição até 13/11/2019, que tem direito adquirido. Para os demais filiados até 13/11/2019, não exigem idade mínima o pedágio de 50%, para quem em 13/11/2019 tinha mais de 33 anos (homem) ou 28 anos (mulher) de contribuição, e a regra de pontos, que soma idade e tempo.", "fonte": "EC 103/2019, arts. 3º, 15 e 17", "origem": "doutrina-previdenciaria.md §2 e §3", "sinal": "firme"}, {"id": "apos-004", "tema": "Aposentadoria programada", "pergunta": "Comecei a contribuir depois da reforma. Posso usar regra de transição?", "variantes": ["filiado depois de novembro de 2019", "primeiro emprego depois de 2019", "regra de transição vale para quem começou agora", "comecei a pagar INSS em 2020"], "resposta": "Não. As regras de transição valem só para quem era filiado até 13/11/2019. Quem se filiou depois segue apenas a regra permanente: 62 anos (mulher) ou 65 anos (homem), com 15 anos (mulher) ou 20 anos (homem) de contribuição.", "fonte": "EC 103/2019, arts. 15 a 20", "origem": "doutrina-previdenciaria.md §2; cenarios-e-custos.md §2", "sinal": "firme"}, {"id": "apos-005", "tema": "Aposentadoria programada", "pergunta": "A regra é diferente para homem e para mulher?", "variantes": ["diferença entre homem e mulher na aposentadoria", "mulher aposenta mais cedo", "mulher precisa de menos tempo"], "resposta": "Sim. Na regra permanente a mulher precisa de 62 anos e 15 anos de contribuição, e o homem de 65 anos e 20 anos; o homem filiado até 13/11/2019 pode usar a transição por idade, com 65 anos e 15 anos de contribuição. No cálculo, o acréscimo de 2 pontos percentuais por ano começa depois de 15 anos de contribuição para a mulher e de 20 anos para o homem.", "fonte": "EC 103/2019, arts. 18, 19 e 26, §§ 2º e 5º", "origem": "doutrina-previdenciaria.md §2 e §4", "sinal": "firme"}, {"id": "apos-006", "tema": "Aposentadoria programada", "pergunta": "Qual é a regra de aposentadoria para professor?", "variantes": ["professora se aposenta mais cedo", "aposentadoria do magistério", "professor tem regra especial", "tempo de sala de aula"], "resposta": "Na regra permanente, 25 anos de magistério e 57 anos de idade (mulher) ou 60 anos (homem). Para filiados até 13/11/2019 há transições próprias: pontos com 25 anos (mulher) ou 30 anos (homem) de magistério, idade mínima progressiva e pedágio de 100%, as duas últimas com idade e tempo reduzidos em 5 anos. O tempo de magistério não se converte em tempo comum.", "fonte": "EC 103/2019, arts. 15, § 3º, 16, § 2º, 19, § 1º, II, e 20, § 1º; Dec. 3.048/1999, art. 54, § 4º", "origem": "doutrina-previdenciaria.md §2; cenarios-e-custos.md §2", "sinal": "firme"}, {"id": "apos-007", "tema": "Direito adquirido e regras antigas", "pergunta": "Completei os requisitos antes da reforma e não pedi. Perdi o direito?", "variantes": ["direito adquirido", "já tinha tempo em 2019 e não pedi", "posso pedir pela regra antiga", "fechei o tempo antes de novembro de 2019"], "resposta": "Não. Quem cumpriu todos os requisitos até 13/11/2019 pode pedir a qualquer tempo pela regra da época, e o valor também é calculado pela lei vigente quando os requisitos foram atendidos.", "fonte": "EC 103/2019, art. 3º, caput e § 2º", "origem": "doutrina-previdenciaria.md §3", "sinal": "firme"}, {"id": "apos-008", "tema": "Direito adquirido e regras antigas", "pergunta": "Como era a aposentadoria por tempo de contribuição antes da reforma?", "variantes": ["aposentadoria por tempo integral", "regra antiga 35 anos", "aposentadoria antiga sem idade", "como era antes de 2019"], "resposta": "Exigia 35 anos de contribuição (homem) ou 30 anos (mulher), sem idade mínima, e 180 contribuições de carência. O valor era 100% do salário de benefício multiplicado pelo fator previdenciário, salvo quando o segurado alcançava os pontos da fórmula 85/95 (86/96 desde 31/12/2018). Só vale para quem completou esses requisitos até 13/11/2019.", "fonte": "CF, art. 201, § 7º, I (red. EC 20/1998); Lei 8.213/1991, arts. 25, II, 29 e 29-C; EC 103/2019, art. 3º", "origem": "doutrina-previdenciaria.md §3", "sinal": "firme"}, {"id": "apos-009", "tema": "Direito adquirido e regras antigas", "pergunta": "O que era a regra 86/96?", "variantes": ["fórmula 85/95", "regra dos pontos antiga", "aposentadoria sem fator previdenciário", "86 pontos mulher 96 pontos homem"], "resposta": "Era a fórmula que afastava o fator previdenciário quando a soma de idade e tempo de contribuição atingia os pontos, com tempo mínimo de 35 anos (homem) ou 30 anos (mulher). Valeu 95/85 de 18/06/2015 a 30/12/2018 e 96/86 de 31/12/2018 a 13/11/2019. Quem atingiu os pontos e não pediu conserva a pontuação da data em que cumpriu.", "fonte": "Lei 8.213/1991, art. 29-C, §§ 2º e 4º (red. Lei 13.183/2015); Dec. 3.048/1999, art. 188-E, §§ 8º a 10", "origem": "doutrina-previdenciaria.md §3", "sinal": "firme"}, {"id": "apos-010", "tema": "Direito adquirido e regras antigas", "pergunta": "Ainda dá para pedir a aposentadoria proporcional?", "variantes": ["aposentadoria proporcional", "pedágio de 40%", "aposentadoria com 30 anos homem", "proporcional da reforma de 1998"], "resposta": "Só como direito adquirido: era preciso ser filiado até 16/12/1998, ter 53 anos (homem) ou 48 anos (mulher) e 30 anos (homem) ou 25 anos (mulher) de contribuição mais o pedágio de 40%, tudo cumprido até 13/11/2019. O valor era 70% mais 5% por ano excedente, até 100%.", "fonte": "EC 20/1998, art. 9º, § 1º (revogado pela EC 103/2019, art. 35, II); EC 103/2019, art. 3º", "origem": "doutrina-previdenciaria.md §3", "sinal": "firme"}, {"id": "apos-011", "tema": "Direito adquirido e regras antigas", "pergunta": "Como era a aposentadoria por idade antes da reforma?", "variantes": ["aposentadoria por idade regra antiga", "60 anos mulher antes de 2019", "idade antes da reforma"], "resposta": "No meio urbano, 65 anos (homem) ou 60 anos (mulher), com a carência cumprida. O valor era 70% do salário de benefício mais 1% por grupo de 12 contribuições, até 100%. Vale para quem reuniu idade e carência até 13/11/2019.", "fonte": "Lei 8.213/1991, arts. 48 e 50; EC 103/2019, art. 3º", "origem": "doutrina-previdenciaria.md §3", "sinal": "firme"}, {"id": "apos-012", "tema": "Direito adquirido e regras antigas", "pergunta": "Se eu tenho direito pela regra antiga e pela nova, qual vale?", "variantes": ["melhor benefício", "o INSS escolhe a regra mais vantajosa", "qual regra paga mais", "comparar regra antiga e nova"], "resposta": "Vale a mais favorável. Pelo direito ao melhor benefício, o cálculo observa o quadro mais vantajoso entre a data em que os requisitos foram cumpridos e a DER (data de entrada do requerimento), ainda que o valor tenha caído depois. Isso não permite misturar regras de regimes diferentes.", "fonte": "STF, Tema 334; Dec. 3.048/1999, art. 181-D", "origem": "doutrina-previdenciaria.md §3-A; cenarios-e-custos.md §2", "sinal": "firme"}, {"id": "apos-013", "tema": "Regras de transição", "pergunta": "Posso me encaixar em mais de uma regra de transição?", "variantes": ["qual regra de transição é a minha", "posso escolher a regra", "cumpro duas regras ao mesmo tempo"], "resposta": "Sim. Para quem era filiado até 13/11/2019, cada regra de transição é autônoma: o segurado pode cumprir mais de uma e escolhe a mais vantajosa, comparando data e valor de cada uma.", "fonte": "EC 103/2019, arts. 15 a 18, 20 e 21", "origem": "doutrina-previdenciaria.md §2", "sinal": "firme"}, {"id": "apos-014", "tema": "Regras de transição", "pergunta": "Como funciona a regra dos pontos?", "variantes": ["regra de pontos", "soma de idade e tempo", "transição por pontuação", "quantos pontos preciso"], "resposta": "Exige 30 anos (mulher) ou 35 anos (homem) de contribuição e que a soma de idade e tempo de contribuição, contados em dias, alcance os pontos do ano. Em 2026 são 93 pontos (mulher) e 103 (homem), com 1 ponto a mais por ano até 100 (mulher) e 105 (homem). O valor é 60% da média mais 2 pontos percentuais por ano acima de 15 anos (mulher) ou 20 anos (homem). Só para filiados até 13/11/2019.", "fonte": "EC 103/2019, arts. 15 e 26, §§ 2º e 5º", "origem": "doutrina-previdenciaria.md §2", "sinal": "firme"}, {"id": "apos-015", "tema": "Regras de transição", "pergunta": "Quantos pontos são exigidos em cada ano?", "variantes": ["tabela de pontos", "pontos em 2027", "pontos em 2028", "quando os pontos param de subir"], "resposta": "Mulher: 86 em 2019 até 92 em 2025; 93 em 2026; 94 em 2027; 95 em 2028; 96 em 2029; 97 em 2030; 98 em 2031; 99 em 2032; 100 de 2033 em diante. Homem: 96 em 2019 até 102 em 2025; 103 em 2026; 104 em 2027; 105 de 2028 em diante.", "fonte": "EC 103/2019, art. 15, §§ 1º e 2º", "origem": "doutrina-previdenciaria.md §2 (tabela do art. 15)", "sinal": "firme"}, {"id": "apos-016", "tema": "Regras de transição", "pergunta": "Quantos pontos o professor precisa?", "variantes": ["pontos do professor", "tabela de pontos da professora", "transição de pontos magistério"], "resposta": "Com 25 anos (professora) ou 30 anos (professor) de magistério: professora, 88 pontos em 2026, 89 em 2027, 90 em 2028, 91 em 2029 e 92 de 2030 em diante; professor, 98 em 2026, 99 em 2027 e 100 de 2028 em diante. Vale só para filiados até 13/11/2019.", "fonte": "EC 103/2019, art. 15, § 3º", "origem": "doutrina-previdenciaria.md §2 (tabela do art. 15)", "sinal": "firme"}, {"id": "apos-017", "tema": "Regras de transição", "pergunta": "Como funciona a regra da idade mínima progressiva?", "variantes": ["idade mínima que aumenta", "transição por idade e tempo", "56 anos e 30 de contribuição", "idade progressiva"], "resposta": "Exige 30 anos (mulher) ou 35 anos (homem) de contribuição e a idade mínima do ano, que sobe 6 meses por ano. Mulher: 59 anos e 6 meses em 2026, 60 em 2027, 60 e 6 meses em 2028, 61 em 2029, 61 e 6 meses em 2030 e 62 de 2031 em diante. Homem: 64 anos e 6 meses em 2026 e 65 de 2027 em diante. Para professor, idade e tempo são reduzidos em 5 anos; o valor é 60% da média mais 2 pontos percentuais por ano acima de 15 anos (mulher) ou 20 anos (homem).", "fonte": "EC 103/2019, arts. 16 e 26, §§ 2º e 5º", "origem": "doutrina-previdenciaria.md §2 (tabela do art. 16)", "sinal": "firme"}, {"id": "apos-018", "tema": "Regras de transição", "pergunta": "Como funciona o pedágio de 50%?", "variantes": ["pedágio de 50 por cento", "faltava pouco em 2019", "transição sem idade mínima", "faltavam dois anos quando veio a reforma"], "resposta": "Vale só para quem, em 13/11/2019, tinha mais de 28 anos (mulher) ou 33 anos (homem) de contribuição. É preciso completar 30 anos (mulher) ou 35 anos (homem) e pagar um pedágio de 50% do tempo que faltava naquela data, sem idade mínima. O valor é a média multiplicada pelo fator previdenciário.", "fonte": "EC 103/2019, art. 17 e parágrafo único; Dec. 3.048/1999, art. 188-K", "origem": "doutrina-previdenciaria.md §2 e §4", "sinal": "firme"}, {"id": "apos-019", "tema": "Regras de transição", "pergunta": "Como funciona o pedágio de 100%?", "variantes": ["pedágio de 100 por cento", "aposentadoria com 100% da média", "57 anos mulher 60 anos homem", "transição com pedágio integral"], "resposta": "Exige 57 anos (mulher) ou 60 anos (homem), 30 anos (mulher) ou 35 anos (homem) de contribuição e mais um pedágio igual a 100% do tempo que faltava em 13/11/2019. O valor é 100% da média. Para professor, idade e tempo são reduzidos em 5 anos.", "fonte": "EC 103/2019, arts. 20 e 26, § 3º, I", "origem": "doutrina-previdenciaria.md §2 e §4", "sinal": "firme"}, {"id": "apos-020", "tema": "Regras de transição", "pergunta": "Como se calcula o pedágio?", "variantes": ["quanto tempo de pedágio vou pagar", "o que é o tempo que faltava", "conta do pedágio"], "resposta": "Primeiro se apura quanto faltava em 13/11/2019: tempo mínimo (30 anos mulher ou 35 anos homem) menos o tempo que a pessoa tinha naquela data. No pedágio de 50%, exige-se o tempo mínimo mais metade do que faltava; no de 100%, o tempo mínimo mais todo o tempo que faltava.", "fonte": "EC 103/2019, arts. 17 e 20", "origem": "doutrina-previdenciaria.md §2 (fórmulas do pedágio)", "sinal": "firme"}, {"id": "apos-021", "tema": "Regras de transição", "pergunta": "Como funciona a transição da aposentadoria por idade?", "variantes": ["aposentadoria por idade transição", "mulher com 62 anos e 15 de contribuição", "homem 65 anos e 15 anos", "idade da mulher subiu"], "resposta": "Para filiados até 13/11/2019, exige 15 anos de contribuição para ambos os sexos, 65 anos para o homem e, para a mulher, 60 anos em 2019, subindo 6 meses por ano até 62 anos, idade exigida desde 2023. O valor é 60% da média mais 2 pontos percentuais por ano acima de 15 anos (mulher) ou 20 anos (homem).", "fonte": "EC 103/2019, arts. 18 e 26, §§ 2º e 5º", "origem": "doutrina-previdenciaria.md §2", "sinal": "firme"}, {"id": "apos-022", "tema": "Regras de transição", "pergunta": "Qual regra paga 100% da média?", "variantes": ["como ganhar a aposentadoria integral", "aposentadoria sem redutor", "qual regra paga mais"], "resposta": "Entre as aposentadorias programadas, só o pedágio de 100% paga 100% da média direto. O pedágio de 50% paga a média multiplicada pelo fator previdenciário, e as demais regras pagam 60% da média mais 2 pontos percentuais por ano acima de 15 anos (mulher) ou 20 anos (homem).", "fonte": "EC 103/2019, arts. 17, parágrafo único, e 26, §§ 2º, 3º, I, e 5º", "origem": "doutrina-previdenciaria.md §4", "sinal": "firme"}, {"id": "apos-023", "tema": "Regras de transição", "pergunta": "Como fica a aposentadoria especial por pontos para quem já trabalhava antes da reforma?", "variantes": ["especial por pontos", "86 pontos e 25 anos de insalubridade", "aposentadoria especial transição"], "resposta": "Para filiados até 13/11/2019, exige 66 pontos e 15 anos de exposição, 76 pontos e 20 anos, ou 86 pontos e 25 anos, conforme a atividade, com pontos fixos que não sobem com o tempo. O valor é 60% da média mais 2 pontos percentuais por ano acima de 20 anos de contribuição, ou acima de 15 anos para mulheres e na especial de 15 anos. Exige exposição permanente, não ocasional nem intermitente.", "fonte": "EC 103/2019, arts. 21 e 26, § 5º; Dec. 3.048/1999, art. 188-P, §§ 3º e 4º", "origem": "doutrina-previdenciaria.md §2", "sinal": "firme"}, {"id": "apos-024", "tema": "Carência e qualidade de segurado", "pergunta": "Quantas contribuições preciso ter para me aposentar?", "variantes": ["carência da aposentadoria", "180 contribuições", "quantos meses de contribuição", "o que é carência"], "resposta": "São 180 contribuições mensais de carência para a aposentadoria por idade, por tempo de contribuição e especial. Carência é o número mínimo de contribuições exigido; não se confunde com o tempo de contribuição.", "fonte": "Lei 8.213/1991, art. 25, II", "origem": "doutrina-previdenciaria.md §3 e §6", "sinal": "firme"}, {"id": "apos-025", "tema": "Carência e qualidade de segurado", "pergunta": "Comecei a contribuir antes de 1991. Minha carência é menor?", "variantes": ["tabela progressiva de carência", "inscrito antes de 1991", "carência do artigo 142"], "resposta": "Para inscritos até 24/07/1991, a carência segue a tabela pelo ano em que todas as condições foram cumpridas: 60 contribuições em 1991 e 1992, subindo ano a ano até 180 contribuições de 2011 em diante. Para quem cumpre os requisitos hoje, a carência já é de 180.", "fonte": "Lei 8.213/1991, art. 142", "origem": "doutrina-previdenciaria.md §3", "sinal": "firme"}, {"id": "apos-026", "tema": "Carência e qualidade de segurado", "pergunta": "Carência e tempo de contribuição são a mesma coisa?", "variantes": ["diferença entre carência e tempo", "tenho tempo mas não tenho carência", "o que conta como carência"], "resposta": "Não. Carência é o número de contribuições mensais exigido; tempo de contribuição é o período contado em anos, meses e dias. Há períodos que contam como tempo e não como carência, como contribuições em atraso anteriores à primeira paga em dia, indenização de período antigo e tempo rural anterior a 1991 sem contribuição.", "fonte": "Lei 8.213/1991, arts. 25, 27, II, e 55, § 2º", "origem": "doutrina-previdenciaria.md §6", "sinal": "firme"}, {"id": "apos-027", "tema": "Carência e qualidade de segurado", "pergunta": "Quantas contribuições cada benefício exige?", "variantes": ["carência do auxílio-doença", "carência de cada benefício", "12 contribuições", "carência do auxílio-reclusão"], "resposta": "12 contribuições para auxílio por incapacidade temporária e aposentadoria por incapacidade permanente; 180 para aposentadoria por idade, por tempo e especial; 24 para o auxílio-reclusão. A carência de 10 contribuições do salário-maternidade foi declarada inconstitucional pelo STF (Supremo Tribunal Federal).", "fonte": "Lei 8.213/1991, art. 25, I a IV; STF, ADIs 2.110 e 2.111", "origem": "doutrina-previdenciaria.md §6", "sinal": "firme"}, {"id": "apos-028", "tema": "Carência e qualidade de segurado", "pergunta": "Parei de contribuir. Até quando continuo segurado?", "variantes": ["período de graça", "quanto tempo fico coberto sem pagar", "perdi a qualidade de segurado", "fiquei desempregado e parei de pagar"], "resposta": "Em regra, 12 meses após a última contribuição. Passa a 24 meses para quem tem mais de 120 contribuições sem perda da qualidade, e soma mais 12 meses para o desempregado com registro no órgão próprio. O facultativo tem 6 meses, e quem está recebendo benefício, exceto auxílio-acidente, mantém a qualidade sem limite.", "fonte": "Lei 8.213/1991, art. 15, I, II, VI, §§ 1º e 2º", "origem": "doutrina-previdenciaria.md §6", "sinal": "firme"}, {"id": "apos-029", "tema": "Carência e qualidade de segurado", "pergunta": "Em que dia exatamente perco a qualidade de segurado?", "variantes": ["quando perco o seguro do INSS", "data da perda da qualidade", "último dia do período de graça"], "resposta": "No dia seguinte ao término do prazo para pagar a contribuição do mês imediatamente posterior ao fim do período de graça. Para contribuinte individual e facultativo, esse prazo vence no dia 15 do mês seguinte ao da competência.", "fonte": "Lei 8.213/1991, art. 15, § 4º; Lei 8.212/1991, art. 30, II", "origem": "doutrina-previdenciaria.md §6", "sinal": "firme"}, {"id": "apos-030", "tema": "Carência e qualidade de segurado", "pergunta": "Se eu perder a qualidade de segurado, perco a aposentadoria?", "variantes": ["preciso estar pagando para aposentar", "parei de pagar há anos, ainda aposento", "perda da qualidade e aposentadoria", "tenho que ser segurado quando pedir"], "resposta": "Não. A perda da qualidade de segurado não impede a aposentadoria por tempo de contribuição, a especial nem a por idade, desde que cumpridos a carência e os demais requisitos da regra. O que se perde é a cobertura por incapacidade e a pensão aos dependentes enquanto a pessoa estiver sem qualidade.", "fonte": "Lei 10.666/2003, art. 3º", "origem": "doutrina-previdenciaria.md §6; haack-prev-planejamento SKILL.md §4, Etapa C", "sinal": "firme"}, {"id": "apos-031", "tema": "Carência e qualidade de segurado", "pergunta": "Pago como autônomo abaixo do mínimo. Isso mantém minha qualidade de segurado?", "variantes": ["contribuição baixa mantém a cobertura", "período de graça do autônomo", "paguei menos que o salário mínimo"], "resposta": "Não. O contribuinte individual só tem período de graça contado a partir da última contribuição igual ou superior ao salário mínimo; a competência abaixo do mínimo sem ajuste não serve para isso.", "fonte": "Dec. 3.048/1999, art. 13, §§ 7º e 8º", "origem": "doutrina-previdenciaria.md §6; cenarios-e-custos.md §7", "sinal": "firme"}, {"id": "apos-032", "tema": "Categorias e alíquotas", "pergunta": "Quem é obrigado a contribuir para o INSS?", "variantes": ["segurado obrigatório", "tipos de segurado", "categorias do INSS", "sou obrigado a pagar INSS"], "resposta": "São segurados obrigatórios o empregado, o empregado doméstico, o contribuinte individual, o trabalhador avulso e o segurado especial (produtor rural em regime de economia familiar), conforme a atividade exercida. Quem trabalha numa dessas condições é filiado ao INSS (Instituto Nacional do Seguro Social) pela própria atividade.", "fonte": "Lei 8.213/1991, art. 11, I, II, V, VI e VII", "origem": "Lei 8.213/1991 compilada, art. 11 (03_TESES/legislacao)", "sinal": "firme"}, {"id": "apos-033", "tema": "Categorias e alíquotas", "pergunta": "Quem não trabalha pode contribuir para o INSS?", "variantes": ["contribuir como facultativo", "dona de casa pode pagar INSS", "estudante pode contribuir", "pagar INSS sem trabalhar"], "resposta": "Sim, como segurado facultativo: é quem não se enquadra em nenhuma categoria obrigatória e se filia mediante contribuição. O facultativo paga 20% sobre a base escolhida, 11% do salário mínimo no plano simplificado ou 5% do mínimo se não tiver renda própria, se dedicar só ao trabalho doméstico na própria casa e a família for de baixa renda inscrita no CadÚnico (Cadastro Único para Programas Sociais), com renda de até 2 salários mínimos.", "fonte": "Lei 8.213/1991, art. 13; Lei 8.212/1991, art. 21, caput, § 2º, I e II, 'b', e § 4º", "origem": "cenarios-e-custos.md §3; Lei 8.213/1991 compilada, art. 13; Lei 8.212/1991 compilada, art. 21, § 2º, II, 'b', e § 4º", "sinal": "firme"}, {"id": "apos-034", "tema": "Categorias e alíquotas", "pergunta": "Quanto o empregado de carteira assinada contribui?", "variantes": ["desconto do INSS no salário", "alíquota do empregado", "quanto desconta de INSS"], "resposta": "Desde março de 2020 a contribuição do empregado é progressiva, calculada faixa a faixa sobre o salário, até o teto; até fevereiro de 2020 era uma alíquota única sobre o total. As faixas são atualizadas todo ano por portaria.", "fonte": "EC 103/2019, art. 28; Lei 8.212/1991, art. 20", "origem": "cenarios-e-custos.md §3", "sinal": "firme"}, {"id": "apos-035", "tema": "Categorias e alíquotas", "pergunta": "Sou autônomo. Quanto tenho que pagar de INSS?", "variantes": ["contribuinte individual quanto paga", "carnê de autônomo", "pagar 20% do INSS", "quanto paga quem trabalha por conta"], "resposta": "No plano normal, 20% sobre a base que você declarar, entre o salário mínimo (R$ 1.621,00 em 2026) e o teto (R$ 8.475,55 em 2026). O vencimento é o dia 15 do mês seguinte ao da competência. Quem trabalha por conta própria, sem relação com empresa, pode optar pelo plano simplificado de 11% sobre o salário mínimo.", "fonte": "Lei 8.212/1991, arts. 21, caput e § 2º, I, 28, §§ 3º e 5º, e 30, II; Decreto 12.797/2025, art. 1º; Portaria Interministerial MPS/MF 13/2026, art. 2º", "origem": "cenarios-e-custos.md §3; doutrina-previdenciaria.md §4", "sinal": "firme"}, {"id": "apos-036", "tema": "Categorias e alíquotas", "pergunta": "Pagar 11% no plano simplificado vale para aposentadoria?", "variantes": ["plano simplificado", "contribuição de 11%", "pagar o mínimo do INSS", "11% conta tempo"], "resposta": "Vale para a aposentadoria programada e para a por idade. Não vale para as regras por tempo de contribuição (pontos, idade progressiva, pedágio de 50% e de 100%) nem para levar o tempo a regime próprio, salvo se complementar a diferença até 20% sobre o salário mínimo da competência.", "fonte": "Lei 8.213/1991, art. 18, § 3º; Lei 8.212/1991, art. 21, §§ 2º, I, e 3º; IN 128/2022, art. 216, V, 'a', e §§ 1º e 2º (red. IN 212/2026)", "origem": "cenarios-e-custos.md §2 e §3; doutrina-previdenciaria.md §6", "sinal": "firme"}, {"id": "apos-037", "tema": "Categorias e alíquotas", "pergunta": "Sou MEI. Os 5% que pago contam para aposentadoria?", "variantes": ["MEI aposenta", "microempreendedor individual INSS", "DAS do MEI conta tempo", "5% do salário mínimo"], "resposta": "Sim para a aposentadoria programada e por idade. O MEI (microempreendedor individual) contribui com 5% do salário mínimo, e esse período não conta para as regras por tempo de contribuição nem para a contagem em regime próprio sem complementar até 20%. O transportador autônomo de cargas inscrito como MEI paga 12%, com a mesma restrição.", "fonte": "Lei 8.212/1991, art. 21, § 2º, II, 'a'; LC 123/2006, arts. 18-A, § 3º, IV, e 18-F, III; IN 128/2022, art. 216, V, 'a', e §§ 1º e 2º (red. IN 212/2026)", "origem": "cenarios-e-custos.md §3; doutrina-previdenciaria.md §6", "sinal": "firme"}, {"id": "apos-038", "tema": "Categorias e alíquotas", "pergunta": "Como funciona a contribuição de 5% do facultativo de baixa renda?", "variantes": ["facultativo baixa renda", "INSS de 5% para dona de casa", "contribuição com CadÚnico"], "resposta": "É de 5% sobre o salário mínimo, só para quem não tem renda própria e se dedica exclusivamente ao trabalho doméstico na própria residência, em família inscrita no CadÚnico (Cadastro Único para Programas Sociais) com renda de até 2 salários mínimos, e conta para a aposentadoria programada e por idade. Para as regras por tempo de contribuição e para regime próprio, é preciso complementar a diferença até 20%.", "fonte": "Lei 8.212/1991, art. 21, § 2º, II, 'b', §§ 3º e 4º; IN 128/2022, art. 216, §§ 1º e 2º (red. IN 212/2026)", "origem": "cenarios-e-custos.md §3 e §4; Lei 8.212/1991 compilada, art. 21, § 2º, II, 'b', e § 4º", "sinal": "firme"}, {"id": "apos-039", "tema": "Categorias e alíquotas", "pergunta": "Presto serviço como autônomo para empresa. Quem recolhe o INSS?", "variantes": ["autônomo que trabalha para empresa", "empresa desconta 11% do autônomo", "RPA e INSS", "prestador de serviço precisa pagar carnê"], "resposta": "A empresa retém 11% da sua remuneração e recolhe. Desde abril de 2003 esse recolhimento se presume feito, e esse tempo pode constar em CTC (Certidão de Tempo de Contribuição) mesmo sem prova do pagamento pela empresa.", "fonte": "Lei 10.666/2003, art. 4º; Lei 8.213/1991, art. 96, V", "origem": "cenarios-e-custos.md §3; Lei 8.213/1991 compilada, art. 96", "sinal": "firme"}, {"id": "apos-040", "tema": "Categorias e alíquotas", "pergunta": "Paguei 11% ou 5% por anos. Posso completar para 20%?", "variantes": ["complementar contribuição", "complementação para 20%", "transformar 11% em 20%", "pagar a diferença do MEI"], "resposta": "Sim. Paga-se a diferença até 20% sobre o salário mínimo de cada competência (9 pontos percentuais para quem pagou 11%, 15 para quem pagou 5% e 8 para quem pagou 12%), com juros pela SELIC (taxa básica de juros) mais 1%, sem multa. Complementada, a competência passa a contar nas regras por tempo de contribuição e na contagem em regime próprio.", "fonte": "Lei 8.212/1991, art. 21, § 3º; Lei 9.430/1996, art. 5º, § 3º; IN 128/2022, art. 216, § 2º, e art. 514, I (red. IN 212/2026)", "origem": "cenarios-e-custos.md §4", "sinal": "controvertido"}, {"id": "apos-041", "tema": "Atraso, indenização e ajustes", "pergunta": "Uma contribuição abaixo do salário mínimo conta para alguma coisa?", "variantes": ["contribuição abaixo do mínimo", "salário menor que o mínimo", "trabalho intermitente e INSS", "recebi menos que o mínimo no mês"], "resposta": "Não. Desde novembro de 2019, a competência com contribuição abaixo do salário mínimo, sem ajuste, não conta para tempo de contribuição, carência nem cálculo do valor. Só passa a contar depois de ajustada.", "fonte": "CF, art. 195, § 14; EC 103/2019, art. 29; Dec. 3.048/1999, art. 19-E", "origem": "doutrina-previdenciaria.md §4; cenarios-e-custos.md §2", "sinal": "firme"}, {"id": "apos-042", "tema": "Atraso, indenização e ajustes", "pergunta": "Como ajusto uma contribuição que ficou abaixo do mínimo?", "variantes": ["complementação do artigo 29", "agrupar contribuições", "aproveitar sobra de outro mês", "ajuste de competência"], "resposta": "Há três formas: complementar a contribuição até o mínimo, usar o que sobrou acima do mínimo em outra competência ou agrupar competências baixas para formar contribuições mínimas. A emenda diz que esses ajustes só podem ser feitos ao longo do mesmo ano civil, e a compatibilidade desse prazo com a possibilidade de ajuste a qualquer tempo não está resolvida.", "fonte": "EC 103/2019, art. 29, I a III e parágrafo único", "origem": "cenarios-e-custos.md §4 e §6 (c.5); EC 103/2019 em 03_TESES/legislacao", "sinal": "controvertido"}, {"id": "apos-043", "tema": "Atraso, indenização e ajustes", "pergunta": "Quanto custa complementar uma competência abaixo do mínimo?", "variantes": ["valor da complementação", "quanto pago para completar o mínimo", "complementar como empregado"], "resposta": "A diferença entre o salário mínimo e a remuneração do mês, multiplicada pela alíquota da categoria: 20% para contribuinte individual; para empregado, 8% até fevereiro de 2020 e 7,5% depois. Após o vencimento há multa de mora e juros pela SELIC (taxa básica de juros) mais 1%. Essa complementação não é admitida para plano simplificado, MEI (microempreendedor individual), segurado especial e facultativo, e o ajuste feito é irreversível.", "fonte": "EC 103/2019, art. 29; Lei 8.212/1991, art. 35; Lei 9.430/1996, art. 61; IN 128/2022, art. 124, §§ 1º e 14", "origem": "cenarios-e-custos.md §4", "sinal": "firme"}, {"id": "apos-044", "tema": "Atraso, indenização e ajustes", "pergunta": "Posso pagar INSS atrasado?", "variantes": ["recolher em atraso", "pagar meses que fiquei sem contribuir", "pagar retroativo", "trabalhei como autônomo e não paguei"], "resposta": "Sim, se você exerceu atividade de contribuinte individual no período, com prova documental, e a competência ainda não decaiu (até 5 anos contados do primeiro dia do ano seguinte). Paga-se 20% da base com multa de mora e juros pela SELIC (taxa básica de juros) mais 1%, e o período passa a contar como tempo de contribuição.", "fonte": "Lei 8.212/1991, art. 35; Dec. 3.048/1999, arts. 216, § 12, e 348, I e § 1º; CTN, art. 173, I", "origem": "cenarios-e-custos.md §4; doutrina-previdenciaria.md §6", "sinal": "firme"}, {"id": "apos-045", "tema": "Atraso, indenização e ajustes", "pergunta": "Contribuição paga em atraso conta como carência?", "variantes": ["atrasado conta carência", "paguei atrasado e o INSS não contou", "carência de contribuição atrasada"], "resposta": "Para contribuinte individual e facultativo, a carência começa no primeiro pagamento feito em dia: atrasadas de competências anteriores a ele não contam, nem as pagas depois de perdida a qualidade de segurado. Pela letra da lei, contam as competências posteriores à primeira paga em dia, recolhidas sem perda da qualidade; a TNU (Turma Nacional de Uniformização), porém, afirma que carência depende de contribuição tempestiva, o que torna esse ponto discutível.", "fonte": "Lei 8.213/1991, art. 27, II; Dec. 3.048/1999, art. 28, II e § 4º; IN 128/2022, arts. 191, 192, § 3º, e 194, IV; TNU, Temas 192 e 358", "origem": "doutrina-previdenciaria.md §6 (atraso e indenização na carência); cenarios-e-custos.md §4", "sinal": "controvertido"}, {"id": "apos-046", "tema": "Atraso, indenização e ajustes", "pergunta": "Trabalhei por conta há mais de 5 anos e nunca paguei. Posso regularizar?", "variantes": ["indenização de período", "pagar tempo antigo", "período decadente", "indenizar tempo de autônomo"], "resposta": "Sim, por indenização, desde que comprovada a atividade. O valor é 20% da média dos 80% maiores salários de contribuição atualizados, com juros de 0,5% ao mês capitalizados ao ano, limitados a 50%, e multa de 10%. Depois de paga, conta como tempo de contribuição, mas em regra não conta como carência.", "fonte": "Lei 8.212/1991, art. 45-A, § 2º; Dec. 3.048/1999, arts. 122 e 239, §§ 8º e 8º-A; IN 128/2022, arts. 98, § 2º, 101 e 194, III", "origem": "cenarios-e-custos.md §4; doutrina-previdenciaria.md §6", "sinal": "firme"}, {"id": "apos-047", "tema": "Atraso, indenização e ajustes", "pergunta": "Qual a diferença entre pagar em atraso e indenizar?", "variantes": ["atraso ou indenização", "quando é indenização", "prazo de 5 anos do INSS"], "resposta": "O que separa um do outro é a decadência: competência de até 5 anos, contados do primeiro dia do ano seguinte, paga-se em atraso, com multa e juros; competência mais antiga só entra por indenização. O atraso pode contar para carência em certas condições; a indenização, em regra, conta só como tempo.", "fonte": "Dec. 3.048/1999, art. 348, I e § 1º; CTN, art. 173, I; Lei 8.212/1991, arts. 35 e 45-A", "origem": "doutrina-previdenciaria.md §6; cenarios-e-custos.md §4", "sinal": "controvertido"}, {"id": "apos-048", "tema": "Atraso, indenização e ajustes", "pergunta": "Tenho tempo de roça de antes de ser obrigado a contribuir. Pago multa para indenizar?", "variantes": ["indenizar tempo rural", "multa na indenização do rural", "tempo de lavoura antigo"], "resposta": "Não. A multa de 10% da indenização não se aplica ao tempo rural do empregado rural ou do segurado especial anterior à obrigatoriedade de filiação, inclusive para levar esse tempo a regime próprio. Os juros continuam devidos.", "fonte": "Lei 8.212/1991, art. 45-A, § 4º, e Lei 8.213/1991, art. 96, § 2º (incluídos pela Lei 15.363/2026)", "origem": "cenarios-e-custos.md §4; legislacao-pos-2019.md §3 (Lei 15.363/2026)", "sinal": "firme"}, {"id": "apos-049", "tema": "CNIS e contagem de tempo", "pergunta": "O que é o CNIS e ele vale como prova?", "variantes": ["extrato do INSS", "CNIS vale como prova", "meu histórico no INSS", "extrato previdenciário"], "resposta": "O CNIS (Cadastro Nacional de Informações Sociais) vale como prova de filiação, tempo de contribuição e salários. O segurado pode pedir inclusão, exclusão ou correção de dados a qualquer tempo; informação lançada fora de época só é aceita se confirmada por documento.", "fonte": "Lei 8.213/1991, art. 29-A, caput e § 2º; Dec. 3.048/1999, art. 19, § 2º", "origem": "doutrina-previdenciaria.md §6 (prova do tempo)", "sinal": "firme"}, {"id": "apos-050", "tema": "CNIS e contagem de tempo", "pergunta": "Um emprego meu não aparece no CNIS. E agora?", "variantes": ["vínculo faltando no CNIS", "carteira assinada que não aparece", "como incluir tempo no CNIS", "posso provar com testemunha"], "resposta": "Pede-se a inclusão com documento. Tempo de serviço só se prova com início de prova material da época, e testemunha sozinha não basta, salvo força maior ou caso fortuito. A justificação administrativa admite de 2 a 6 testemunhas para completar a prova material.", "fonte": "Lei 8.213/1991, arts. 29-A e 55, § 3º; Dec. 3.048/1999, arts. 142 a 151", "origem": "doutrina-previdenciaria.md §6 (prova do tempo)", "sinal": "firme"}, {"id": "apos-051", "tema": "CNIS e contagem de tempo", "pergunta": "Ganhei uma ação trabalhista reconhecendo o vínculo. O INSS conta esse tempo?", "variantes": ["sentença trabalhista conta no INSS", "acordo trabalhista e tempo de contribuição", "reconhecimento de vínculo na Justiça do Trabalho"], "resposta": "Só se houver início de prova material da época. Sentença trabalhista, sobretudo a homologatória de acordo sem prova material, não basta sozinha para o INSS (Instituto Nacional do Seguro Social) incluir o vínculo no CNIS (Cadastro Nacional de Informações Sociais).", "fonte": "Dec. 3.048/1999, art. 144, parágrafo único", "origem": "doutrina-previdenciaria.md §6 (prova do tempo)", "sinal": "firme"}, {"id": "apos-052", "tema": "CNIS e contagem de tempo", "pergunta": "Trabalhei no serviço público. Posso usar esse tempo no INSS?", "variantes": ["contagem recíproca", "tempo de servidor no INSS", "averbar tempo público", "fui concursado e saí"], "resposta": "Sim, pela contagem recíproca, com compensação entre os regimes. O tempo vem por CTC (Certidão de Tempo de Contribuição) emitida pelo regime próprio, com o período de data a data, o tempo líquido e a homologação da unidade gestora; o regime próprio só emite CTC para ex-servidor.", "fonte": "Lei 8.213/1991, arts. 94 e 96, VI; Dec. 3.048/1999, art. 130", "origem": "haack-prev-planejamento SKILL.md §3; cenarios-e-custos.md §1; Lei 8.213/1991 compilada, arts. 94 e 96", "sinal": "firme"}, {"id": "apos-053", "tema": "CNIS e contagem de tempo", "pergunta": "Posso usar o mesmo tempo no INSS e no regime de servidor?", "variantes": ["contar tempo duas vezes", "tempo concomitante público e privado", "aposentadoria nos dois regimes com o mesmo tempo"], "resposta": "Não. Tempo já usado para aposentadoria em um regime não conta no outro, tempo público e privado no mesmo período não se somam, e não existe contagem em dobro.", "fonte": "Lei 8.213/1991, art. 96, I a III", "origem": "Lei 8.213/1991 compilada, art. 96 (03_TESES/legislacao)", "sinal": "firme"}, {"id": "apos-054", "tema": "CNIS e contagem de tempo", "pergunta": "Virei servidor público. Posso levar meu tempo do INSS?", "variantes": ["CTC do INSS", "levar tempo do INSS para prefeitura", "certidão de tempo para regime próprio"], "resposta": "Sim, por CTC (Certidão de Tempo de Contribuição), obrigatória para o regime próprio contar o tempo. A CTC exige contribuição efetiva, salvo para empregado, doméstico, avulso e, desde 01/04/2003, contribuinte individual que presta serviço a empresa. Períodos pagos com 11% ou 5% só entram se complementados até 20%.", "fonte": "Lei 8.213/1991, arts. 94, § 2º, e 96, V e VII; IN 128/2022, art. 216, § 2º (red. IN 212/2026)", "origem": "Lei 8.213/1991 compilada, arts. 94 e 96; cenarios-e-custos.md §2", "sinal": "firme"}, {"id": "apos-055", "tema": "CNIS e contagem de tempo", "pergunta": "Trabalhei em lugar insalubre. Esse tempo pode virar tempo comum maior?", "variantes": ["converter tempo especial", "conversão de insalubridade", "tempo especial aumenta o tempo comum", "fator 1,4"], "resposta": "Sim, mas só para trabalho prestado até 13/11/2019. Na atividade de 25 anos, o fator é 1,40 (homem) e 1,20 (mulher); na de 20 anos, 1,75 e 1,50; na de 15 anos, 2,33 e 2,00. O trabalho especial depois de 13/11/2019 não se converte.", "fonte": "EC 103/2019, art. 25, § 2º; Dec. 3.048/1999, art. 188-P, § 5º", "origem": "doutrina-previdenciaria.md §5", "sinal": "firme"}, {"id": "apos-056", "tema": "Cálculo do valor", "pergunta": "Como é calculado o valor da aposentadoria?", "variantes": ["como calcula a aposentadoria", "quanto vou receber", "cálculo da RMI", "60% mais 2%"], "resposta": "Faz-se a média de todos os salários de contribuição desde julho de 1994 (ou desde o início, se posterior), corrigidos pelo INPC (Índice Nacional de Preços ao Consumidor) e limitados ao teto. O valor é 60% dessa média mais 2 pontos percentuais por ano de contribuição acima de 20 anos (homem) ou 15 anos (mulher). Exceções: o pedágio de 100% paga 100% da média, e o de 50% paga a média multiplicada pelo fator previdenciário.", "fonte": "EC 103/2019, art. 26, caput e §§ 1º, 2º, 3º e 5º; Lei 8.213/1991, art. 29-B", "origem": "doutrina-previdenciaria.md §4", "sinal": "firme"}, {"id": "apos-057", "tema": "Cálculo do valor", "pergunta": "Com quanto tempo de contribuição eu recebo 100% da média?", "variantes": ["aposentadoria integral", "quantos anos para ganhar 100%", "40 anos de contribuição homem", "35 anos de contribuição mulher"], "resposta": "Na regra de 60% mais 2 pontos percentuais por ano, chega-se a 100% com 40 anos de contribuição (homem) ou 35 anos (mulher). Pelo pedágio de 100%, o valor é 100% da média independentemente desse acréscimo.", "fonte": "EC 103/2019, art. 26, §§ 2º, 3º, I, e 5º", "origem": "doutrina-previdenciaria.md §4", "sinal": "firme"}, {"id": "apos-058", "tema": "Cálculo do valor", "pergunta": "As contribuições de antes de 1994 entram no cálculo?", "variantes": ["revisão da vida toda", "salários antigos entram na média", "contribuições anteriores ao Plano Real"], "resposta": "Não. A média usa só os salários desde julho de 1994. A chamada revisão da vida toda foi superada pelo STF (Supremo Tribunal Federal) no Tema 1.102, e esse tempo anterior conta como tempo de contribuição, mas não entra na média.", "fonte": "EC 103/2019, art. 26; Lei 9.876/1999, art. 3º; STF, Tema 1.102", "origem": "doutrina-previdenciaria.md §1 e §4; haack-prev-planejamento SKILL.md §4, Etapa C", "sinal": "firme"}, {"id": "apos-059", "tema": "Cálculo do valor", "pergunta": "Tenho contribuições baixas que puxam a média para baixo. Dá para tirar?", "variantes": ["descartar contribuições", "excluir salários baixos da média", "melhorar a média"], "resposta": "Sim. Podem ser excluídas da média as contribuições que a reduzam, desde que se mantenha o tempo mínimo exigido. O tempo excluído deixa de valer para tudo, inclusive para o acréscimo de 2 pontos percentuais por ano.", "fonte": "EC 103/2019, art. 26, § 6º", "origem": "doutrina-previdenciaria.md §4", "sinal": "firme"}, {"id": "apos-061", "tema": "Cálculo do valor", "pergunta": "Qual é o valor mínimo e o máximo da aposentadoria?", "variantes": ["teto do INSS", "piso da aposentadoria", "aposentadoria menor que o salário mínimo", "quanto é o teto em 2026"], "resposta": "Nenhuma aposentadoria fica abaixo do salário mínimo nem acima do teto. Em 2026, o salário mínimo é R$ 1.621,00 e o teto é R$ 8.475,55.", "fonte": "Lei 8.213/1991, art. 29, § 2º; Decreto 12.797/2025, art. 1º; Portaria Interministerial MPS/MF 13/2026, art. 2º", "origem": "doutrina-previdenciaria.md §3 e §4; teto_rgps.json", "sinal": "firme"}, {"id": "apos-062", "tema": "Cálculo do valor", "pergunta": "Se eu contribuir sempre pelo teto, vou receber o teto?", "variantes": ["contribuir no teto garante o teto", "pagar no máximo para receber o máximo", "aposentadoria no teto"], "resposta": "Não necessariamente. Contribuir pelo teto leva a média ao teto, mas o valor é o percentual da regra aplicado sobre essa média: 60% mais 2 pontos percentuais por ano acima de 20 anos (homem) ou 15 anos (mulher), salvo o pedágio de 100%, que paga 100% da média.", "fonte": "EC 103/2019, art. 26, §§ 1º, 2º, 3º e 5º", "origem": "doutrina-previdenciaria.md §4", "sinal": "firme"}, {"id": "apos-063", "tema": "Cálculo do valor", "pergunta": "O que é o fator previdenciário?", "variantes": ["fator previdenciário", "redutor da aposentadoria", "expectativa de vida reduz aposentadoria"], "resposta": "É um multiplicador aplicado sobre a média, calculado com a idade, o tempo de contribuição e a expectativa de sobrevida da tábua do IBGE (Instituto Brasileiro de Geografia e Estatística) publicada até a data do requerimento. Hoje incide no pedágio de 50% e na aposentadoria por tempo do direito adquirido, salvo quando alcançados os pontos 85/95 ou, desde 31/12/2018, 86/96. O STF (Supremo Tribunal Federal) o declarou constitucional.", "fonte": "Lei 8.213/1991, art. 29, §§ 7º a 9º; Dec. 3.048/1999, art. 188-E, § 4º; EC 103/2019, art. 17, parágrafo único; STF, Tema 1.091", "origem": "cenarios-e-custos.md §2; doutrina-previdenciaria.md §3 e §4", "sinal": "firme"}, {"id": "apos-064", "tema": "Cálculo do valor", "pergunta": "Como era calculada a média antes da reforma?", "variantes": ["80% maiores salários", "cálculo antigo", "média antes de 2019"], "resposta": "Pela média dos 80% maiores salários de contribuição desde julho de 1994, corrigidos pelo INPC (Índice Nacional de Preços ao Consumidor), com divisor mínimo de 60% do período nas aposentadorias. Esse cálculo vale para quem tem direito adquirido até 13/11/2019; depois disso, a média usa 100% dos salários.", "fonte": "Lei 8.213/1991, arts. 29, I e II, e 29-B; Lei 9.876/1999, art. 3º, § 2º; EC 103/2019, arts. 3º e 26", "origem": "doutrina-previdenciaria.md §3 e §4", "sinal": "firme"}, {"id": "apos-065", "tema": "Cálculo do valor", "pergunta": "Tenho dois empregos. As duas contribuições somam na aposentadoria?", "variantes": ["atividades concomitantes", "dois vínculos ao mesmo tempo", "trabalho em dois lugares"], "resposta": "Sim. Desde a Lei 9.876/1999, o salário de contribuição de atividades simultâneas é a soma do que foi recolhido em todas elas, respeitado o teto.", "fonte": "Lei 8.213/1991, art. 32; STJ, Tema 1.070", "origem": "doutrina-previdenciaria.md §4", "sinal": "firme"}, {"id": "apos-066", "tema": "Cálculo do valor", "pergunta": "A aposentadoria é reajustada todo ano?", "variantes": ["reajuste da aposentadoria", "aumento do INSS em 2026", "correção anual do benefício"], "resposta": "Sim. Em 2026, os benefícios com início antes de 2025 foram reajustados em 3,90%; os iniciados em 2025 tiveram reajuste proporcional pela tabela da portaria. Quem recebe o salário mínimo acompanha o valor do mínimo, R$ 1.621,00 em 2026.", "fonte": "Portaria Interministerial MPS/MF 13/2026, art. 1º e Anexo I; Decreto 12.797/2025, art. 1º", "origem": "doutrina-previdenciaria.md §4 (valores de 2026)", "sinal": "firme"}, {"id": "apos-067", "tema": "Pedido ao INSS", "pergunta": "Quando pedi ainda faltava tempo. Posso aproveitar o tempo que trabalhei depois?", "variantes": ["reafirmação da DER", "completei o tempo depois do pedido", "faltavam meses quando pedi", "contar tempo durante o processo"], "resposta": "Sim, pela reafirmação da DER (data de entrada do requerimento): a data do pedido pode ser levada ao momento em que os requisitos foram cumpridos, inclusive durante o processo judicial até as instâncias ordinárias, observada a causa de pedir.", "fonte": "STJ, Tema 995", "origem": "doutrina-previdenciaria.md §3-A", "sinal": "firme"}, {"id": "apos-068", "tema": "Pedido ao INSS", "pergunta": "Posso entrar direto na Justiça sem pedir no INSS?", "variantes": ["preciso pedir no INSS antes", "processar o INSS sem requerimento", "requerimento administrativo obrigatório"], "resposta": "Em regra, não. Sem requerimento prévio no INSS (Instituto Nacional do Seguro Social), falta interesse para a ação, salvo as exceções da tese do STF (Supremo Tribunal Federal). O requerimento sem a documentação mínima também afasta o interesse, segundo tese do STJ (Superior Tribunal de Justiça) ainda sem trânsito em julgado.", "fonte": "STF, Tema 350; STJ, Tema 1.124", "origem": "haack-prev-padrao SKILL.md §3 (trava 3)", "sinal": "firme"}, {"id": "apos-069", "tema": "Pedido ao INSS", "pergunta": "Depois de concedida, em quanto tempo sai o primeiro pagamento?", "variantes": ["quando cai o primeiro pagamento", "prazo do INSS para pagar", "demora para receber depois de aprovado"], "resposta": "O primeiro pagamento deve ocorrer em até 45 dias da apresentação da documentação necessária.", "fonte": "Lei 8.213/1991, art. 41-A, § 5º", "origem": "doutrina-previdenciaria.md §3-A", "sinal": "firme"}, {"id": "apos-070", "tema": "Pedido ao INSS", "pergunta": "Depois de aposentado, posso trocar por uma regra melhor?", "variantes": ["trocar de aposentadoria", "desaposentação", "reaposentação", "me arrependi da regra escolhida"], "resposta": "Não. Depois de concedida, não se troca de aposentadoria, e a escolha se torna definitiva após o primeiro pagamento. Desaposentação e reaposentação não são admitidas pelo STF (Supremo Tribunal Federal).", "fonte": "STF, Tema 503; Dec. 3.048/1999, art. 181-B", "origem": "haack-prev-planejamento SKILL.md §4, Etapa C, e §8; doutrina-previdenciaria.md §3-A", "sinal": "firme"}, {"id": "apos-071", "tema": "Depois de aposentado e planejamento", "pergunta": "Posso continuar trabalhando depois de aposentado?", "variantes": ["trabalhar aposentado", "aposentado com carteira assinada", "aposentado precisa contribuir", "voltar a trabalhar depois de aposentar"], "resposta": "Sim. O aposentado que trabalha continua segurado obrigatório e contribui normalmente, mas essas contribuições não dão direito a nova prestação, exceto salário-família e reabilitação profissional, quando empregado. Na aposentadoria especial a regra é outra: voltar à atividade nociva faz cessar o pagamento.", "fonte": "Lei 8.212/1991, art. 12, § 4º; Lei 8.213/1991, arts. 18, § 2º, e 57, § 8º; STF, Tema 709", "origem": "cenarios-e-custos.md §7; Lei 8.213/1991 e Lei 8.212/1991 compiladas", "sinal": "firme"}, {"id": "apos-072", "tema": "Depois de aposentado e planejamento", "pergunta": "As contribuições depois de aposentado aumentam minha aposentadoria?", "variantes": ["contribuir aposentado aumenta o valor", "revisão pelas contribuições novas", "aposentado paga INSS à toa"], "resposta": "Não. Elas são obrigatórias para custeio da seguridade e não geram aumento nem nova aposentadoria; também não se pode trocar a aposentadoria por outra mais vantajosa.", "fonte": "Lei 8.212/1991, art. 12, § 4º; Lei 8.213/1991, art. 18, § 2º; STF, Tema 503", "origem": "cenarios-e-custos.md §7; haack-prev-planejamento SKILL.md §4, Etapa C", "sinal": "firme"}, {"id": "apos-073", "tema": "Depois de aposentado e planejamento", "pergunta": "Posso receber duas aposentadorias do INSS?", "variantes": ["duas aposentadorias", "acumular aposentadoria no INSS", "aposentadoria dupla"], "resposta": "Não. É vedado receber mais de uma aposentadoria do regime geral ao mesmo tempo, salvo direito adquirido.", "fonte": "Lei 8.213/1991, art. 124, II", "origem": "Lei 8.213/1991 compilada, art. 124 (03_TESES/legislacao)", "sinal": "firme"}, {"id": "apos-074", "tema": "Depois de aposentado e planejamento", "pergunta": "Aposentado recebe 13º?", "variantes": ["décimo terceiro do aposentado", "abono anual", "13º do INSS"], "resposta": "Sim. Quem recebeu aposentadoria durante o ano tem direito ao abono anual, calculado como a gratificação de Natal dos trabalhadores, tendo por base o valor do benefício de dezembro.", "fonte": "Lei 8.213/1991, art. 40 e parágrafo único", "origem": "Lei 8.213/1991 compilada, art. 40 (03_TESES/legislacao)", "sinal": "firme"}, {"id": "apos-075", "tema": "Depois de aposentado e planejamento", "pergunta": "Se eu parar de contribuir agora, ainda me aposento?", "variantes": ["parar de pagar o INSS", "vale a pena parar de contribuir", "já tenho o tempo mínimo, posso parar"], "resposta": "Sim, se já tiver a carência e o tempo mínimo de contribuição da regra e só faltar idade: a perda da qualidade de segurado não impede a aposentadoria por idade, por tempo ou especial. Mas o tempo deixa de crescer, o que reduz o percentual, e depois do período de graça você fica sem cobertura por incapacidade e sem pensão para os dependentes.", "fonte": "Lei 10.666/2003, art. 3º; Lei 8.213/1991, art. 15; EC 103/2019, art. 26, § 2º", "origem": "haack-prev-planejamento SKILL.md §4, Etapa C; doutrina-previdenciaria.md §6", "sinal": "firme"}, {"id": "apos-076", "tema": "Depois de aposentado e planejamento", "pergunta": "Vale a pena contribuir sobre um valor maior?", "variantes": ["aumentar a contribuição", "pagar mais INSS vale a pena", "contribuir acima do mínimo", "custo e retorno da contribuição"], "resposta": "Contribuir sobre base maior eleva a média de todos os salários desde julho de 1994, até o teto, e com ela o valor da aposentadoria. Se compensa é conta caso a caso: compara-se o custo adicional com o ganho mensal de renda e o tempo para recuperar o que foi pago, sem inflação nem imposto de renda.", "fonte": "EC 103/2019, art. 26, caput e § 1º; Lei 8.212/1991, art. 21", "origem": "cenarios-e-custos.md §1 e §5 (H.6); haack-prev-planejamento SKILL.md §4, Etapa B", "sinal": "firme"}, {"id": "apos-077", "tema": "Depois de aposentado e planejamento", "pergunta": "É melhor contribuir com 11% ou com 20%?", "variantes": ["11 ou 20 por cento", "qual alíquota escolher", "plano simplificado ou normal"], "resposta": "O 11% sobre o salário mínimo basta para a aposentadoria programada e por idade, com média no mínimo. O 20% é necessário para usar as regras por tempo de contribuição (pontos, idade progressiva, pedágios) ou levar o tempo a regime próprio, e permite contribuir sobre valor maior. Quem pagou 11% pode complementar depois, com juros.", "fonte": "Lei 8.213/1991, art. 18, § 3º; Lei 8.212/1991, art. 21, caput, §§ 2º e 3º; IN 128/2022, art. 216, §§ 1º e 2º (red. IN 212/2026)", "origem": "cenarios-e-custos.md §2, §3 e §4", "sinal": "firme"}, {"id": "apos-078", "tema": "Depois de aposentado e planejamento", "pergunta": "Tenho aposentadoria especial. Posso continuar no mesmo trabalho insalubre?", "variantes": ["aposentado especial continuar exposto", "voltar à atividade insalubre", "Tema 709"], "resposta": "Não sem perder o benefício. É constitucional vedar a aposentadoria especial a quem permanece ou volta à atividade nociva: implantado o benefício, a continuidade ou o retorno faz cessar o pagamento. A data de início do benefício é a data do pedido, com efeitos financeiros desde ela. Para profissionais de saúde houve suspensão ligada à pandemia, cujo alcance atual não está confirmado e deve ser conferido.", "fonte": "Lei 8.213/1991, art. 57, § 8º; STF, Tema 709 (ED de 24/02/2021)", "origem": "doutrina-previdenciaria.md §3-A e §5; cenarios-e-custos.md §7", "sinal": "firme"}, {"id": "esp-001", "tema": "Tempo especial: conceito e prova", "pergunta": "O que é tempo especial?", "variantes": ["o que é atividade especial", "trabalho insalubre conta diferente?", "o que é aposentadoria especial", "trabalho perigoso conta mais?"], "resposta": "É o período trabalhado com exposição a agente nocivo à saúde ou à integridade física, de forma permanente, não ocasional nem intermitente. Dá direito à aposentadoria especial com 15, 20 ou 25 anos de exposição, conforme o agente. A caracterização e a prova seguem a lei da época em que o trabalho foi prestado.", "fonte": "Lei 8.213/1991, art. 57, caput e § 3º; Dec. 3.048/1999, art. 188-P, § 6º", "origem": "doutrina-previdenciaria.md §5 (Base legal)", "sinal": "firme"}, {"id": "esp-002", "tema": "Tempo especial: conceito e prova", "pergunta": "Que documento prova o tempo especial?", "variantes": ["como provo que trabalhei em lugar insalubre", "o que o INSS pede para tempo especial", "precisa de laudo?", "qual papel serve para especial"], "resposta": "Depende do período: até 28/04/1995, a categoria profissional pela CTPS (Carteira de Trabalho e Previdência Social) ou formulário, com laudo se for ruído; de 29/04/1995 a 13/10/1996, formulário ou PPP (Perfil Profissiográfico Previdenciário); de 14/10/1996 a 31/12/2003, formulário com LTCAT (laudo técnico das condições ambientais do trabalho) ou PPP; a partir de 01/01/2004, o PPP.", "fonte": "IN 128/2022, art. 274 (red. IN 170/2024)", "origem": "doutrina-previdenciaria.md §5 (Prova por período)", "sinal": "firme"}, {"id": "esp-003", "tema": "Tempo especial: conceito e prova", "pergunta": "O que é o PPP e quem tem que me dar?", "variantes": ["o que é perfil profissiográfico", "a empresa é obrigada a dar o PPP?", "onde consigo o PPP", "PPP está errado, dá para corrigir?"], "resposta": "O PPP (Perfil Profissiográfico Previdenciário) é o formulário emitido pela empresa, com base no LTCAT (laudo técnico das condições ambientais do trabalho), que descreve função, setor e agentes nocivos por período. O trabalhador pode pedir à empresa a retificação do PPP quando ele estiver errado.", "fonte": "Lei 8.213/1991, art. 58, §§ 1º e 4º; Dec. 3.048/1999, art. 68, § 10", "origem": "doutrina-previdenciaria.md §5 (Base legal)", "sinal": "firme"}, {"id": "esp-004", "tema": "Tempo especial: conceito e prova", "pergunta": "Só a profissão anotada na carteira já conta como especial?", "variantes": ["enquadramento por categoria", "minha profissão era insalubre, basta a carteira?", "profissão especial antes de 1995", "categoria profissional conta?"], "resposta": "Sim, só até 28/04/1995 e quando a profissão estiver nos quadros dos decretos da época, provada pela CTPS (Carteira de Trabalho e Previdência Social). A partir de 29/04/1995 é preciso provar a exposição ao agente nocivo. Profissão que não consta dos quadros só se enquadra por analogia justificada.", "fonte": "Lei 9.032/1995; IN 128/2022, art. 269, § 1º; TNU Tema 198", "origem": "doutrina-previdenciaria.md §1 e §5 (Categoria e rol)", "sinal": "firme"}, {"id": "esp-005", "tema": "Tempo especial: conceito e prova", "pergunta": "Precisa ter ficado exposto o dia inteiro?", "variantes": ["exposição só em parte do dia conta?", "não era o tempo todo, perco?", "habitual e permanente", "exposição intermitente"], "resposta": "Até 28/04/1995, não: a exposição não precisava ser permanente. Desde 29/04/1995 a lei exige exposição permanente, não ocasional nem intermitente; para agente biológico e eletricidade, avalia-se pela descrição da função se a exposição é inseparável do serviço, sem tempo mínimo na jornada.", "fonte": "TNU Súm. 49; Lei 8.213/1991, art. 57, § 3º; TNU Temas 211 e 210", "origem": "doutrina-previdenciaria.md §5 (Habitualidade e permanência); catalogo-temas-vinculantes.md §3 e §4", "sinal": "firme"}, {"id": "esp-006", "tema": "Tempo especial: conceito e prova", "pergunta": "O que eu preciso trazer para provar tempo especial?", "variantes": ["documentos para aposentadoria especial", "lista de documentos tempo especial", "o que levar na consulta sobre insalubridade"], "resposta": "PPP (Perfil Profissiográfico Previdenciário) de cada empresa, com responsável técnico pelos registros ambientais desde 14/10/1996; LTCAT (laudo técnico das condições ambientais do trabalho) quando o PPP for omisso; CTPS (Carteira de Trabalho e Previdência Social) para a categoria até 28/04/1995; e os formulários antigos emitidos até 31/12/2003, se existirem.", "fonte": "IN 128/2022, arts. 272, 274 e 281, § 4º-A; TNU Temas 208 e 14", "origem": "gerente-previdenciario/SKILL.md, Etapa 1 (Caso de saúde: prova a pedir)", "sinal": "firme"}, {"id": "esp-007", "tema": "Tempo especial: conceito e prova", "pergunta": "Férias e licença-maternidade contam como tempo especial?", "variantes": ["férias quebram o tempo especial?", "salário-maternidade conta como especial", "descanso conta como insalubre"], "resposta": "Sim. Férias, descansos da legislação trabalhista e salário-maternidade não descaracterizam o tempo especial, desde que, na data do afastamento, a pessoa estivesse exposta ao agente nocivo.", "fonte": "IN 128/2022, art. 271, caput (não alterado pelas alteradoras); Dec. 3.048/1999, art. 65, parágrafo único (red. Dec. 10.410/2020)", "origem": "03_TESES/legislacao/leis/IN-128-2022-PRES-INSS_procedimentos-RGPS_DOU-original.txt, art. 271; _CONTINUIDADE/_artefatos/prev-lacunas/INSUMO_pesquisa-14_in128-alteradoras-ristf_2026-11-03.md, 1.b (art. 271 fora de todas as alteradoras); 03_TESES/legislacao/leis/Decreto-3048-1999_regulamento-da-previdencia-social_planalto.txt, art. 65", "sinal": "firme"}, {"id": "esp-008", "tema": "Agentes nocivos", "pergunta": "Qual o limite de ruído para contar como especial?", "variantes": ["quantos decibéis precisa", "barulho conta como especial?", "limite de ruído por época", "85 decibéis ou 90?"], "resposta": "Acima de 80 decibéis até 05/03/1997; acima de 90 decibéis de 06/03/1997 a 18/11/2003; acima de 85 decibéis a partir de 19/11/2003 (Decreto 4.882/2003). O limite de 85 não retroage ao período de 1997 a 2003.", "fonte": "IN 128/2022, art. 292, I a III (red. IN 170/2024); STJ Tema 694; TNU Tema 174", "origem": "_CONTINUIDADE/_artefatos/prev-lacunas/fontes/INSUMO_dou-in170-2024.html, art. 292 (nova redação); IN-128-2022 (03_TESES/legislacao/leis), art. 292; doutrina-previdenciaria.md §5 (ADVERSO ruído); catalogo-temas-vinculantes.md §7", "sinal": "firme"}, {"id": "esp-009", "tema": "Agentes nocivos", "pergunta": "Meu PPP só fala em dose de ruído, serve?", "variantes": ["PPP com dosimetria vale?", "PPP não diz a técnica de medição", "NHO-01 no PPP", "como o ruído tem que estar medido"], "resposta": "Não basta: desde 19/11/2003 o PPP (Perfil Profissiográfico Previdenciário) precisa indicar a técnica, NHO-01 (Norma de Higiene Ocupacional nº 01 da Fundacentro) ou NR-15 (Norma Regulamentadora nº 15), e a simples menção a dose ou dosimetria é insuficiente. Se o PPP for omisso, a falta se supre pelo LTCAT (laudo técnico das condições ambientais do trabalho).", "fonte": "TNU Temas 174 e 317", "origem": "doutrina-previdenciaria.md §5 (NEUTRO e ADVERSO ruído); catalogo-temas-vinculantes.md §4", "sinal": "firme"}, {"id": "esp-010", "tema": "Agentes nocivos", "pergunta": "O barulho variava durante o dia; como fica?", "variantes": ["ruído variável", "ruído não era constante", "pico de ruído conta?", "nível de ruído mudava"], "resposta": "Mede-se pelo NEN (Nível de Exposição Normalizado). Sem essa informação, vale o pico de ruído, desde que perícia técnica judicial comprove a habitualidade e a permanência da exposição.", "fonte": "STJ Tema 1083", "origem": "catalogo-temas-vinculantes.md §7 (STJ Tema 1083); doutrina-previdenciaria.md §5", "sinal": "firme"}, {"id": "esp-011", "tema": "Agentes nocivos", "pergunta": "Para ruído antigo basta a carteira de trabalho?", "variantes": ["ruído antes de 1995 precisa laudo?", "formulário antigo de ruído vale sozinho?", "barulho na década de 80"], "resposta": "Não. Ruído sempre exigiu laudo, inclusive antes de 28/04/1995, e os formulários antigos emitidos até 31/12/2003 só valem para ruído acompanhados do laudo técnico que os embasou.", "fonte": "IN 128/2022, art. 274", "origem": "doutrina-previdenciaria.md §5 (Prova por período); IN-128-2022 (03_TESES/legislacao/leis), art. 274", "sinal": "firme"}, {"id": "esp-012", "tema": "Agentes nocivos", "pergunta": "Trabalho com óleo, graxa e solvente conta como especial?", "variantes": ["hidrocarboneto é especial?", "agente químico conta?", "mexia com diesel e graxa", "produto químico dá aposentadoria especial?"], "resposta": "Pode contar, desde que comprovada a exposição: a manipulação de óleos e graxas configura atividade especial, com tempo de 25 anos. A partir do Decreto 2.172/1997, porém, o PPP (Perfil Profissiográfico Previdenciário) que só diz hidrocarbonetos ou óleos e graxas, sem especificar o agente, não basta.", "fonte": "TNU Temas 53 e 298; Dec. 3.048/1999, Anexo IV, 1.0.7", "origem": "doutrina-previdenciaria.md §5 (Agentes químicos e hidrocarbonetos)", "sinal": "firme"}, {"id": "esp-013", "tema": "Agentes nocivos", "pergunta": "Mecânico conta como especial só pela profissão?", "variantes": ["mecânico tem aposentadoria especial?", "oficina mecânica é insalubre?", "mecânico de motor diesel"], "resposta": "Não. Nenhum código de categoria dos decretos antigos nomeia o mecânico, e antes de 29/04/1995 só se enquadra por analogia justificada ou se a função exercida estiver no código 2.5.1 do Decreto 83.080/1979. A especialidade depende de provar a exposição a agentes químicos, como óleos minerais e solventes especificados no PPP (Perfil Profissiográfico Previdenciário) e no LTCAT (laudo técnico das condições ambientais do trabalho).", "fonte": "Decs. 53.831/1964 e 83.080/1979; TNU Temas 198 e 298", "origem": "doutrina-previdenciaria.md §5 (Agentes químicos, Categoria e Prova)", "sinal": "firme"}, {"id": "esp-014", "tema": "Agentes nocivos", "pergunta": "Se havia benzeno no ambiente, basta para ser especial?", "variantes": ["agente cancerígeno conta?", "benzeno dá especial?", "substância cancerígena no trabalho", "LINACH"], "resposta": "Para cancerígeno do Grupo 1 da LINACH (Lista Nacional de Agentes Cancerígenos para Humanos) com registro, como o benzeno, a presença provada no ambiente basta, sem medição de quantidade e sem descaracterização por EPI (equipamento de proteção individual). Para períodos a partir de 01/07/2020, o regulamento admite descaracterizar por medidas de controle que eliminem a nocividade, e não há tese judicial sobre essa redação.", "fonte": "Dec. 3.048/1999, art. 68, § 4º (red. Dec. 8.123/2013 e Dec. 10.410/2020); TNU Tema 170; IN 128/2022, art. 298", "origem": "doutrina-previdenciaria.md §5 (Cancerígeno e LINACH)", "sinal": "controvertido"}, {"id": "esp-015", "tema": "Agentes nocivos", "pergunta": "Eletricista tem tempo especial?", "variantes": ["eletricidade conta como especial?", "trabalho com alta tensão", "risco de choque elétrico", "eletricidade depois de 1997"], "resposta": "Sim, a exposição à eletricidade pode ser reconhecida como especial mesmo depois do Decreto 2.172/1997, porque a lista de agentes é exemplificativa, desde que a exposição seja permanente. Para tensão acima de 250 volts, avalia-se pela descrição da função se o risco é inseparável do serviço, sem tempo mínimo na jornada.", "fonte": "STJ Tema 534; TNU Tema 210", "origem": "doutrina-previdenciaria.md §5 (FAVORÁVEL); catalogo-temas-vinculantes.md §2, §4 e §7", "sinal": "firme"}, {"id": "esp-016", "tema": "Agentes nocivos", "pergunta": "Vigilante tem tempo especial?", "variantes": ["segurança armado é especial?", "vigilante com arma de fogo", "vigia conta como insalubre?", "aposentadoria especial de vigilante"], "resposta": "Não. O Supremo Tribunal Federal fixou que a atividade de vigilante, com ou sem arma de fogo, não se caracteriza como especial. Os segundos embargos de declaração, com possível modulação, foram a julgamento até 09/10/2026, e o resultado se confere no portal do Supremo antes de analisar o caso; a tese contrária do Superior Tribunal de Justiça está sobrestada e não serve de fundamento.", "fonte": "STF Tema 1209 (RE 1.368.225); STJ Tema 1031", "origem": "doutrina-previdenciaria.md §5 (ADVERSO Tema 1.209); catalogo-temas-vinculantes.md §1 e §6", "sinal": "controvertido"}, {"id": "esp-017", "tema": "Agentes nocivos", "pergunta": "Meu agente nocivo não está na lista do decreto; perco?", "variantes": ["agente fora da lista conta?", "o rol de agentes é fechado?", "atividade não prevista no decreto"], "resposta": "Não necessariamente: no Judiciário a lista de agentes nocivos é exemplificativa, desde que o trabalho seja permanente e a nocividade comprovada tecnicamente. Na via administrativa, o INSS (Instituto Nacional do Seguro Social) trata a lista como fechada.", "fonte": "STJ Tema 534; TNU Tema 205; IN 128/2022, arts. 287, §§ 3º e 4º, e 299, II", "origem": "doutrina-previdenciaria.md §5 (FAVORÁVEL, Categoria e rol, ADVERSO biológicos)", "sinal": "firme"}, {"id": "esp-018", "tema": "EPI e PPP", "pergunta": "Usei EPI; perco o tempo especial?", "variantes": ["equipamento de proteção tira o direito?", "PPP diz que EPI era eficaz", "usava luva e máscara, conta?", "EPI eficaz"], "resposta": "Antes de 03/12/1998 o EPI (equipamento de proteção individual) não importa. A partir daí, EPI realmente capaz de neutralizar o agente afasta a especialidade, e o EPI declarado eficaz no PPP (Perfil Profissiográfico Previdenciário) pesa contra o trabalhador, que pode impugnar especificamente a eficácia; havendo dúvida razoável, reconhece-se o especial. Para ruído acima do limite, a declaração de EPI eficaz no PPP não descaracteriza.", "fonte": "STF Tema 555; TNU Súm. 87; IN 128/2022, art. 291; TNU Tema 213; STJ Tema 1090", "origem": "doutrina-previdenciaria.md §5 (FAVORÁVEL, NEUTRO, EPI); catalogo-temas-vinculantes.md §7", "sinal": "firme"}, {"id": "esp-019", "tema": "EPI e PPP", "pergunta": "O protetor auricular tira o direito no ruído?", "variantes": ["protetor de ouvido anula o especial?", "EPI no ruído", "abafador elimina o barulho?"], "resposta": "Não. Com ruído acima do limite de tolerância, a declaração da empresa no PPP (Perfil Profissiográfico Previdenciário) de que o EPI (equipamento de proteção individual) era eficaz não descaracteriza o tempo especial.", "fonte": "STF Tema 555, item II; IN 128/2022, art. 291, § 2º (red. IN 170/2024)", "origem": "catalogo-temas-vinculantes.md §7 (STF Tema 555); _CONTINUIDADE/_artefatos/prev-lacunas/fontes/INSUMO_dou-in170-2024.html, art. 291, § 2º", "sinal": "firme"}, {"id": "esp-020", "tema": "EPI e PPP", "pergunta": "O PPP não tem responsável técnico; vale?", "variantes": ["PPP sem engenheiro de segurança", "PPP sem responsável pelos registros ambientais", "PPP incompleto"], "resposta": "O PPP (Perfil Profissiográfico Previdenciário) precisa de responsável técnico pelos registros ambientais desde 14/10/1996, mas a falta se supre pelo LTCAT (laudo técnico das condições ambientais do trabalho) ou elemento técnico equivalente. Também se pode pedir à empresa a retificação do PPP.", "fonte": "TNU Tema 208; IN 128/2022, art. 281, § 4º-A, I, a; Dec. 3.048/1999, art. 68, § 10", "origem": "doutrina-previdenciaria.md §5 (Prova qualitativa); gerente-previdenciario/SKILL.md, Etapa 3", "sinal": "firme"}, {"id": "esp-021", "tema": "EPI e PPP", "pergunta": "O laudo foi feito anos depois; serve?", "variantes": ["laudo extemporâneo vale?", "laudo não é da época", "LTCAT feito depois"], "resposta": "Sim. Laudo feito depois do período trabalhado é apto a provar a atividade especial, desde que as condições do ambiente não tenham mudado.", "fonte": "TNU Súm. 68; TNU Tema 14; IN 128/2022, art. 279", "origem": "doutrina-previdenciaria.md §5 (Prova qualitativa); catalogo-temas-vincu
