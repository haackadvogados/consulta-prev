<style>
/* Layout: uma coluna de leitura; a caixa de pergunta fica presa no topo, a resposta vem logo abaixo em corpo grande. */
:root {
  --bg: #F8F8F5; --surface: #FFFFFF; --fg: #23221E; --muted: #606060; --line: #E2DFD5;
  --gold: #B8940A; --gold-text: #7A6100; --gold-soft: #F5EFD7; --warn: #8A4B00; --warn-soft: #FBEBD5;
  --font: "Montserrat", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161613; --surface: #1F1E1A; --fg: #ECE9DF; --muted: #A5A195; --line: #35332B;
    --gold: #D2AC22; --gold-text: #E0BD45; --gold-soft: #2C2712; --warn: #F0B56A; --warn-soft: #33260F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161613; --surface: #1F1E1A; --fg: #ECE9DF; --muted: #A5A195; --line: #35332B;
  --gold: #D2AC22; --gold-text: #E0BD45; --gold-soft: #2C2712; --warn: #F0B56A; --warn-soft: #33260F;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 0 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }

.topo { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 12px; display: flex; flex-direction: column; gap: 10px; }
.marca { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.marca b { font-weight: 700; letter-spacing: .14em; font-size: 11px; text-transform: uppercase; color: var(--gold-text); }
.marca span { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.caixa { position: relative; }
#q { width: 100%; font: 500 18px/1.3 var(--font); color: var(--fg); background: var(--surface); border: 1.5px solid var(--line);
  border-radius: 10px; padding: 15px 46px 15px 16px; outline: none; -webkit-appearance: none; appearance: none; }
#q::placeholder { color: var(--muted); font-weight: 400; }
#q:focus { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }
#q::-webkit-search-cancel-button { display: none; }
#limpar { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border: 0; background: none;
  color: var(--muted); font-size: 22px; line-height: 1; cursor: pointer; border-radius: 8px; }
#limpar:hover { color: var(--fg); }
button:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

main, .pilha { display: flex; flex-direction: column; gap: 22px; }
main { padding-top: 8px; }
.pilha:empty { display: none; }
.barra { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; min-height: 20px; }
#dica { font-size: 12px; color: var(--muted); flex: 1 1 200px; min-width: 0; }
.resposta.fora { border-top-color: var(--warn); }
.resposta .texto.ficha { font-size: 16.5px; font-weight: 400; line-height: 1.6; }
.resposta .texto.pensando { color: var(--muted); font-weight: 400; font-size: 15px; }
.usados { display: flex; flex-direction: column; gap: 6px; }
.rotulo { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }

/* Resposta principal */
.resposta { background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--gold); border-radius: 10px; padding: 20px 20px 16px; display: flex; flex-direction: column; gap: 12px; }
.resposta h2 { margin: 0; font-size: 14px; font-weight: 600; color: var(--muted); text-wrap: balance; }
.resposta .texto { margin: 0; font-size: 19px; line-height: 1.55; font-weight: 500; white-space: pre-line; overflow-wrap: anywhere; }
.pe { display: flex; gap: 10px 14px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 10px; }
.fonte { margin: 0; font-size: 12px; color: var(--muted); flex: 1 1 260px; min-width: 0; overflow-wrap: anywhere; }
.fonte b { font-weight: 600; }
.acoes { display: flex; gap: 8px; flex-wrap: wrap; }
.pilula { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .04em; padding: 3px 9px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); align-self: flex-start; }
.pilula.tema { background: var(--gold-soft); color: var(--gold-text); }
.cab { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { font: 600 12.5px var(--font); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
.btn:hover { border-color: var(--gold); }
.btn.forte { background: var(--gold); border-color: var(--gold); color: #1B1700; }
.btn[disabled] { opacity: .55; cursor: default; }

/* Lista de perguntas */
.lista { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
.lista details + details { border-top: 1px solid var(--line); }
.lista summary { list-style: none; cursor: pointer; padding: 12px 16px; font-weight: 500; font-size: 14.5px; display: flex; gap: 10px; justify-content: space-between; align-items: baseline; }
.lista summary::-webkit-details-marker { display: none; }
.lista summary::after { content: "+"; color: var(--gold-text); font-weight: 600; flex: none; }
.lista details[open] summary::after { content: "−"; }
.lista summary:hover { background: var(--gold-soft); }
.lista .corpo { padding: 0 16px 14px; display: flex; flex-direction: column; gap: 8px; }
.lista .corpo p { margin: 0; font-size: 16px; line-height: 1.55; white-space: pre-line; overflow-wrap: anywhere; }
.lista .corpo .fonte { font-size: 12px; flex: none; }

/* Temas */
.temas { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
.temas button { text-align: left; font: 500 13.5px/1.3 var(--font); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.temas button:hover { border-color: var(--gold); }
.temas button span { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.grupo { display: flex; flex-direction: column; gap: 8px; }
.grupo h3 { margin: 0; font-size: 13px; font-weight: 700; color: var(--gold-text); }

.aviso { margin: 0; font-size: 13.5px; color: var(--muted); }
.claude { border-top-color: var(--muted); }
.claude .texto.pensando { color: var(--muted); font-weight: 400; font-size: 15px; }
.rodape { font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; margin: 0; }
@media (max-width: 480px) { .resposta .texto { font-size: 17.5px; } #q { font-size: 16.5px; } }

or ano de contribuição acima de 15 anos (mulher) ou 20 anos (homem).\nProfessor: com 25 anos (professora) ou 30 (professor) de magistério na educação básica, 88 pontos (professora) ou 98 (professor) em 2026, subindo até 92 (2030) e 100 (2028).\nProva e documentos: CNIS (Cadastro Nacional de Informações Sociais) e carteiras de trabalho; a contagem em dias sai do cálculo sobre o CNIS conferido.\nAtenção: competências pagas com 11% (plano simplificado) ou 5% (MEI, microempreendedor individual, e facultativo de baixa renda) não contam nesta regra sem complementar até 20%.", "fonte": "EC 103/2019, arts. 15 e 26, §§ 2º e 5º; Lei 8.213/1991, art. 25, II", "origem": "síntese dos itens apos-014, apos-015, apos-016, qd-011, qd-012, prof-003, apos-036, apos-037", "sinal": "firme", "ficha": true}, {"id": "fic-004", "tema": "Regras de transição", "pergunta": "Qual é a regra da transição por idade mínima progressiva?", "variantes": ["regra da idade mínima progressiva", "idade mínima progressiva", "requisitos da idade mínima progressiva", "como funciona a idade progressiva", "quem tem direito à idade mínima progressiva", "transição por idade mínima e tempo de contribuição", "idade que sobe 6 meses por ano"], "resposta": "Quem tem direito: segurado filiado ao INSS (Instituto Nacional do Seguro Social) até 13/11/2019.\nRequisitos: 30 anos (mulher) ou 35 anos (homem) de contribuição, 180 contribuições de carência e a idade mínima do ano: mulher, 59 anos e 6 meses em 2026, subindo 6 meses por ano até 62 anos a partir de 2031; homem, 64 anos e 6 meses em 2026 e 65 anos a partir de 2027.\nValor: 60% da média de todos os salários desde 07/1994 mais 2 pontos percentuais por ano de contribuição acima de 15 anos (mulher) ou 20 anos (homem).\nProfessor: idade e tempo reduzidos em 5 anos, com 25 anos (professora) ou 30 (professor) de magistério; em 2026, 54 anos e 6 meses (professora) ou 59 anos e 6 meses (professor).\nProva e documentos: CNIS (Cadastro Nacional de Informações Sociais), carteiras de trabalho e, no professor, diploma ou habilitação e declaração da escola.\nAtenção: competências pagas com 11% ou 5% não contam nesta regra sem complementar até 20%.", "fonte": "EC 103/2019, arts. 16 e 26, §§ 2º e 5º; Lei 8.213/1991, art. 25, II", "origem": "síntese dos itens apos-017, qd-011, qd-012, prof-004, qd-013, apos-036", "sinal": "firme", "ficha": true}, {"id": "fic-005", "tema": "Regras de transição", "pergunta": "Qual é a regra do pedágio de 50%?", "variantes": ["regra do pedágio de 50%", "pedágio de 50", "requisitos do pedágio de 50%", "como funciona o pedágio de 50%", "quem tem direito ao pedágio de 50%", "pedágio de 50 por cento sem idade mínima", "transição do artigo 17"], "resposta": "Quem tem direito: só quem, em 13/11/2019, era filiado ao INSS (Instituto Nacional do Seguro Social) e tinha mais de 28 anos (mulher) ou mais de 33 anos (homem) de contribuição; quem tinha exatamente 28 ou 33 anos, ou menos, fica fora.\nRequisitos: 30 anos (mulher) ou 35 anos (homem) de contribuição mais um período adicional igual a 50% do tempo que faltava em 13/11/2019, 180 contribuições de carência e nenhuma idade mínima.\nExemplo: homem com 34 anos de contribuição em 13/11/2019 faltava 1 ano, paga 6 meses de pedágio e se aposenta com 35 anos e 6 meses.\nValor: média dos salários multiplicada pelo fator previdenciário, obrigatório nesta regra e sem a regra 85/95 para afastá-lo.\nProva e documentos: CNIS (Cadastro Nacional de Informações Sociais) e carteiras de trabalho, para apurar o tempo exato em 13/11/2019.\nAtenção: o fator previdenciário foi declarado constitucional pelo STF (Supremo Tribunal Federal), não há versão desta regra para o professor e competências pagas com 11% ou 5% não contam sem complementar até 20%.", "fonte": "EC 103/2019, art. 17 e parágrafo único; Dec. 3.048/1999, art. 188-K; STF Tema 1.091", "origem": "síntese dos itens apos-018, apos-020, qd-010, fat-002, fat-006, prof-012, apos-036", "sinal": "firme", "ficha": true}, {"id": "fic-006", "tema": "Regras de transição", "pergunta": "Qual é a regra do pedágio de 100%?", "variantes": ["regra do pedágio de 100%", "pedágio de 100", "requisitos do pedágio de 100%", "como funciona o pedágio de 100%", "quem tem direito ao pedágio de 100%", "regra que paga 100% da média", "transição do artigo 20"], "resposta": "Quem tem direito: segurado filiado ao INSS (Instituto Nacional do Seguro Social) até 13/11/2019.\nRequisitos: 57 anos (mulher) ou 60 anos (homem) de idade, 30 anos (mulher) ou 35 anos (homem) de contribuição mais um pedágio igual a 100% do tempo que faltava em 13/11/2019, e 180 contribuições de carência.\nCálculo do pedágio: apura-se quanto faltava em 13/11/2019 (tempo mínimo menos o tempo que a pessoa tinha) e exige-se o tempo mínimo mais todo esse tempo que faltava.\nValor: 100% da média dos salários desde 07/1994, a única aposentadoria programada que paga a média integral sem acréscimo por tempo.\nProfessor: 52 anos (professora) ou 55 (professor), com 25 ou 30 anos de magistério mais 100% do que faltava em 13/11/2019, também com 100% da média.\nAtenção: competências pagas com 11% ou 5% não contam nesta regra sem complementar até 20%.", "fonte": "EC 103/2019, arts. 20 e 26, § 3º, I; Lei 8.213/1991, art. 25, II", "origem": "síntese dos itens apos-019, apos-020, apos-022, apos-057, prof-005, qd-012, apos-036", "sinal": "firme", "ficha": true}, {"id": "fic-007", "tema": "Regras de transição", "pergunta": "Qual é a regra da transição da aposentadoria por idade?", "variantes": ["regra de transição por idade", "transição da aposentadoria por idade", "requisitos da transição por idade", "como funciona a transição por idade", "quem tem direito à transição por idade", "aposentadoria por idade com 15 anos de contribuição", "homem com 15 anos de contribuição"], "resposta": "Quem tem direito: segurado filiado ao INSS (Instituto Nacional do Seguro Social) até 13/11/2019.\nRequisitos: mulher, 62 anos (exigidos desde 2023; eram 60 em 2019, com aumento de 6 meses por ano); homem, 65 anos; 15 anos de contribuição para ambos e 180 contribuições de carência.\nValor: 60% da média de todos os salários desde 07/1994 mais 2 pontos percentuais por ano de contribuição acima de 15 anos (mulher) ou 20 anos (homem), no mínimo o salário mínimo.\nProva e documentos: CNIS (Cadastro Nacional de Informações Sociais) e carteiras de trabalho.\nAtenção: é a regra que permite ao homem filiado até 13/11/2019 aposentar-se com 15 anos de contribuição (o filiado depois precisa de 20), e nela contam as contribuições de 11% e de 5%.", "fonte": "EC 103/2019, arts. 18 e 26, §§ 2º e 5º; Lei 8.213/1991, arts. 18, § 3º, e 25, II", "origem": "síntese dos itens apos-021, apos-002, qd-011, apos-036, apos-037", "sinal": "firme", "ficha": true}, {"id": "fic-008", "tema": "Direito adquirido e regras antigas", "pergunta": "Como funciona o direito adquirido para quem completou os requisitos até 13/11/2019?", "variantes": ["direito adquirido", "direito adquirido na aposentadoria", "completei os requisitos antes da reforma", "regra antiga da aposentadoria", "quem tem direito adquirido", "aposentadoria pela regra de antes da reforma", "regras anteriores à EC 103"], "resposta": "Quem tem direito: quem cumpriu todos os requisitos de uma aposentadoria até 13/11/2019, ainda que não tenha pedido; pode pedir a qualquer tempo pela regra da época.\nRequisitos da época: tempo de contribuição, 35 anos (homem) ou 30 (mulher) sem idade mínima; idade urbana, 65 anos (homem) ou 60 (mulher) com a carência; proporcional, filiação até 16/12/1998, 53 ou 48 anos de idade e 30 ou 25 anos de contribuição mais pedágio de 40%; especial, 15, 20 ou 25 anos de exposição sem idade; professor, 25 (professora) ou 30 (professor) anos de magistério sem idade.\nValor: calculado pela lei vigente quando os requisitos foram cumpridos, com média dos 80% maiores salários desde 07/1994; tempo de contribuição com fator previdenciário salvo pontos 95/85 ou 96/86; idade com 70% mais 1% por grupo de 12 contribuições; especial com 100%.\nRegras obrigatórias: a pontuação 85/95 ou 86/96 alcançada fica conservada na data em que foi cumprida, mesmo pedindo depois.\nProva e documentos: CNIS (Cadastro Nacional de Informações Sociais), carteiras de trabalho e, na especial, PPP (Perfil Profissiográfico Previdenciário) do período.\nAtenção: vale o cálculo mais vantajoso entre a data dos requisitos e a DER (data de entrada do requerimento), mas, depois da concessão, a revisão para buscar esse cálculo decai em 10 anos da primeira prestação.", "fonte": "EC 103/2019, art. 3º; Lei 8.213/1991, arts. 29, 29-C, 48, 50 e 57; EC 20/1998, art. 9º; STF Tema 334; STJ Tema 966", "origem": "síntese dos itens apos-007, apos-008, apos-009, apos-010, apos-011, apos-012, apos-064, esp-030, prof-002, rev-015", "sinal": "firme", "ficha": true}, {"id": "fic-009", "tema": "Direito adquirido e regras antigas", "pergunta": "Qual é a regra da aposentadoria por tempo de contribuição (regra antiga)?", "variantes": ["regra da aposentadoria por tempo de contribuição", "aposentadoria por tempo de contribuição", "aposentadoria por tempo de serviço", "requisitos da aposentadoria por tempo", "como funciona a aposentadoria por tempo de contribuição", "quem tem direito à aposentadoria por tempo", "aposentar sem idade mínima", "35 anos de contribuição"], "resposta": "O que é: a aposentadoria por tempo de contribuição sem idade mínima, extinta pela reforma da previdência para quem não completou os requisitos até 13/11/2019.\nQuem tem direito: só quem completou 35 anos (homem) ou 30 anos (mulher) de contribuição até 13/11/2019; os demais filiados até essa data têm, sem idade mínima, apenas o pedágio de 50% e a regra de pontos.\nRequisitos: 35 anos (homem) ou 30 anos (mulher) de contribuição, sem idade mínima, e 180 contribuições de carência (menos para inscritos até 24/07/1991, pela tabela do art. 142 da Lei 8.213/1991); professor, 30 anos (professor) ou 25 (professora) de magistério; proporcional, filiação até 16/12/1998, 53 anos (homem) ou 48 (mulher) e 30 ou 25 anos de contribuição mais pedágio de 40%.\nRegras obrigatórias: todos os requisitos precisam estar cumpridos até 13/11/2019; competências pagas com 11% ou 5% não contam sem complementar até 20%; depois do primeiro pagamento não se troca de aposentadoria.\nValor: 100% do salário de benefício (média dos 80% maiores salários desde 07/1994) multiplicado pelo fator previdenciário, que deixa de incidir quando a soma de idade e tempo atingiu 95/85 (de 18/06/2015 a 30/12/2018) ou 96/86 (de 31/12/2018 a 13/11/2019); professor com bônus de 5 ou 10 anos no fator e mais 5 pontos; proporcional com 70% mais 5% por ano excedente.\nInício e duração: pode ser pedida a qualquer tempo, com cálculo pela lei da data dos requisitos; vitalícia, com 13º.\nDocumentos necessários: CNIS (Cadastro Nacional de Informações Sociais); carteiras de trabalho; documentos de vínculos fora do CNIS; no professor, diploma ou habilitação e declaração da escola; se já houve pedido, carta de indeferimento e cópia do processo administrativo.\nAtenção: o fator previdenciário é constitucional (STF, Supremo Tribunal Federal, Tema 1.091), e o tempo rural anterior a 1991 conta no fator e nos pontos, por precedentes da TNU (Turma Nacional de Uniformização).", "fonte": "CF, art. 201, § 7º, I (red. EC 20/1998); Lei 8.213/1991, arts. 25, II, 29, 29-C e 142; EC 103/2019, art. 3º; EC 20/1998, art. 9º; STF Tema 1.091", "origem": "síntese dos itens apos-003, apos-008, apos-009, apos-010, apos-025, apos-064, fat-003, fat-004, fat-006, fat-008, prof-002, apos-007, apos-036, doc-001", "sinal": "firme", "ficha": true}, {"id": "fic-010", "tema": "Aposentadoria especial: requisitos e valor", "pergunta": "Qual é a regra da aposentadoria especial?", "variantes": ["regra da aposentadoria especial", "aposentadoria especial", "requisitos da aposentadoria especial", "como funciona a aposentadoria especial", "quem tem direito à aposentadoria especial", "aposentadoria por insalubridade", "aposentadoria de 25 anos", "aposentadoria especial depois da reforma"], "resposta": "O que é: a aposentadoria de quem trabalhou exposto a agente nocivo à saúde, com tempo reduzido de 15, 20 ou 25 anos.\nQuem tem direito: segurado com exposição permanente, não ocasional nem intermitente, a agente químico, físico ou biológico, inclusive o autônomo que prove a exposição.\nRequisitos: 15, 20 ou 25 anos de exposição (15 só na mineração subterrânea em frente de produção; 20 no amianto e na mineração afastada da frente; 25 nos demais agentes) e 180 contribuições de carência; quem completou até 13/11/2019 não tem idade mínima; o filiado até 13/11/2019 que não completou usa a transição de 66, 76 ou 86 pontos, fixos e iguais para homem e mulher.\nRegras obrigatórias: desde 29/04/1995 é preciso provar a exposição ao agente, e não só a profissão; EPI (equipamento de proteção individual) eficaz afasta a especialidade desde 03/12/1998, salvo no ruído; implantado o benefício, permanecer ou voltar à atividade nociva faz cessar o pagamento (STF, Supremo Tribunal Federal, Tema 709); a perda da qualidade de segurado não impede o pedido.\nValor: direito adquirido até 13/11/2019, 100% do salário de benefício; depois, 60% da média desde 07/1994 mais 2 pontos percentuais por ano acima de 20 anos de contribuição (homem) ou 15 (mulher e especial de 15 anos).\nInício e duração: começa na DER (data de entrada do requerimento), com atrasados desde ela, e pode-se seguir trabalhando até a implantação.\nDocumentos necessários: PPP (Perfil Profissiográfico Previdenciário) de cada empresa, com função, setor, profissiografia e agente por período e responsável técnico desde 14/10/1996; LTCAT (laudo técnico das condições ambientais do trabalho) quando o PPP for omisso, inclusive extemporâneo com declaração de que o ambiente não mudou; CTPS (Carteira de Trabalho e Previdência Social), ficha ou livro de registro para categoria até 28/04/1995; formulário de época emitido até 31/12/2003, se existir; autônomo, documentos ano a ano da atividade e prova técnica da exposição.\nAtenção: para o filiado depois de 13/11/2019, as idades mínimas de 55, 58 e 60 anos foram declaradas inconstitucionais pelo STF em 03/06/2026 (ADI 6.309), sem trânsito em julgado e com pedido da AGU (Advocacia-Geral da União) para valer só em requerimentos posteriores a 11/06/2026.", "fonte": "Lei 8.213/1991, arts. 25, II, e 57; EC 103/2019, arts. 3º, 19, § 1º, I, 21 e 26; Dec. 3.048/1999, Anexo IV e art. 188-P; STF Tema 709; ADI 6.309", "origem": "síntese dos itens esp-001, esp-029, esp-030, esp-031, esp-032, esp-033, esp-034, esp-035, esp-036, esp-037, esp-006, anx-004, esp-002, esp-004, esp-018, esp-021, esp-040; gerente-previdenciario/SKILL.md, Etapa 1, prova a pedir (agente biológico)", "sinal": "controvertido", "ficha": true}, {"id": "fic-011", "tema": "Tempo especial: conceito e prova", "pergunta": "Como funciona o tempo especial e a conversão em tempo comum?", "variantes": ["regra do tempo especial", "tempo especial", "conversão de tempo especial em comum", "como provar tempo especial", "quem tem direito a tempo especial", "insalubridade conta para aposentadoria", "fator 1,4", "converter tempo insalubre"], "resposta": "O que é: período com exposição permanente, não ocasional nem intermitente, a agente nocivo; caracterização e prova seguem a lei da época do trabalho, e a exigência de permanência vale desde 29/04/1995.\nProva e documentos: até 28/04/1995, categoria profissional pela CTPS (Carteira de Trabalho e Previdência Social) ou formulário; de 29/04/1995 a 13/10/1996, formulário ou PPP (Perfil Profissiográfico Previdenciário); de 14/10/1996 a 31/12/2003, formulário com LTCAT (laudo técnico das condições ambientais do trabalho) ou PPP; desde 01/01/2004, o PPP; ruído sempre exigiu laudo.\nRuído: acima de 80 decibéis até 05/03/1997, acima de 90 de 06/03/1997 a 18/11/2003 e acima de 85 desde 19/11/2003, com técnica NHO-01 (Norma de Higiene Ocupacional 01 da Fundacentro) ou NR-15 (Norma Regulamentadora 15) indicada no PPP.\nConversão em comum: só para trabalho até 13/11/2019; atividade de 25 anos, fator 1,40 (homem) e 1,20 (mulher); de 20 anos, 1,75 e 1,50; de 15 anos, 2,33 e 2,00; o tempo especial posterior é averbado sem acréscimo.\nEPI (equipamento de proteção individual): antes de 03/12/1998 não importa; depois, o EPI realmente eficaz afasta a especialidade, salvo no ruído acima do limite, e a dúvida razoável favorece o trabalhador.\nAtenção: o INSS (Instituto Nacional do Seguro Social) trata a lista de agentes como fechada e o Judiciário como exemplificativa; o vigilante não tem tempo especial pela tese do STF (Supremo Tribunal Federal), com embargos pendentes.", "fonte": "Lei 8.213/1991, arts. 57 e 58; EC 103/2019, art. 25, § 2º; Dec. 3.048/1999, art. 188-P, § 5º; IN 128/2022, arts. 274 e 292; STF Temas 555 e 1.209; STJ Tema 534", "origem": "síntese dos itens esp-001, esp-002, esp-004, esp-005, esp-008, esp-009, esp-011, esp-016, esp-017, esp-018, esp-019, esp-025, esp-026, esp-027, esp-028", "sinal": "firme", "ficha": true}, {"id": "fic-012", "tema": "Aposentadoria rural e híbrida", "pergunta": "Qual é a regra da aposentadoria rural por idade?", "variantes": ["regra da aposentadoria rural", "aposentadoria rural", "requisitos da aposentadoria rural", "como funciona a aposentadoria rural", "quem tem direito à aposentadoria rural", "aposentadoria do agricultor", "aposentadoria de quem trabalha na roça", "aposentadoria do trabalhador rural"], "resposta": "O que é: a aposentadoria por idade do trabalhador rural, com idade 5 anos menor que a urbana.\nQuem tem direito: segurado especial, empregado rural, avulso rural e contribuinte individual rural eventual.\nRequisitos: 60 anos (homem) ou 55 anos (mulher) e 180 meses de atividade rural, ainda que descontínua; a reforma da previdência não mudou essas idades, e o segurado especial prova meses de atividade em vez de contribuições.\nRegras obrigatórias: os 180 meses devem estar no período imediatamente anterior ao requerimento ou à data da idade, e o segurado especial tem de estar no campo ao completar a idade; testemunha sozinha não prova; o diarista eventual depois de 31/12/2010 só conta os meses com recolhimento; outra atividade remunerada por mais de 120 dias no ano exclui da condição de segurado especial; depois de 'Pedido feito com sucesso' no Meu INSS (portal do Instituto Nacional do Seguro Social) ainda é preciso informar a categoria e preencher a autodeclaração em 30 dias, sob pena de indeferimento.\nValor: 1 salário mínimo para o segurado especial (R$ 1.621,00 em 2026).\nInício e duração: vitalícia.\nDocumentos necessários: autodeclaração ratificada por entidade pública credenciada, para atividade até 31/12/2022; cadastro do segurado especial no CNIS (Cadastro Nacional de Informações Sociais), prova exclusiva desde 01/01/2023; por ano do período, contrato de arrendamento, parceria ou comodato rural, DAP (Declaração de Aptidão ao Pronaf, Programa Nacional de Fortalecimento da Agricultura Familiar), bloco de notas do produtor, notas fiscais de entrada com o segurado como vendedor, entrega da produção a cooperativa, comprovante de contribuição sobre a comercialização, declaração de imposto de renda com renda rural e licença do Incra (Instituto Nacional de Colonização e Reforma Agrária); certidão de casamento que qualifique o cônjuge como lavrador; testemunhas, só como complemento.\nAtenção: quem saiu do campo antes de completar a idade vai para a aposentadoria híbrida, salvo direito adquirido, e cadastro do segurado especial sem atualização por 5 anos restringe o cômputo.", "fonte": "Lei 8.213/1991, arts. 11, V, g, 38-B, 48, §§ 1º e 2º, e 106; CF, art. 201, § 7º, II; TNU Súm. 54; STJ Tema 642; Súm. 149/STJ", "origem": "síntese dos itens rur-024, rur-025, rur-017, rur-009, rur-011, rur-013, qd-003, qd-023, doc-006, port-011, rur-007, rur-010, rur-014; gerente-previdenciario/SKILL.md, Etapa 1, prova a pedir (rural)", "sinal": "firme", "ficha": true}, {"id": "fic-013", "tema": "Aposentadoria rural e híbrida", "pergunta": "Qual é a regra da aposentadoria híbrida?", "variantes": ["regra da aposentadoria híbrida", "aposentadoria híbrida", "requisitos da aposentadoria híbrida", "como funciona a aposentadoria híbrida", "quem tem direito à aposentadoria híbrida", "aposentadoria mista rural e urbana", "somar tempo de roça com tempo urbano"], "resposta": "O que é: a aposentadoria por idade que soma tempo rural e tempo urbano.\nQuem tem direito: quem trabalhou no campo e na cidade, seja qual for o trabalho que predominou ou o exercido ao completar a idade.\nRequisitos: pela leitura do INSS (Instituto Nacional do Seguro Social), 65 anos (homem) ou 62 (mulher) e 20 anos (homem) ou 15 (mulher) de contribuição; pela letra da Lei 8.213/1991, 65 anos (homem) ou 60 (mulher), sem tempo mínimo de contribuição, tese sem precedente vinculante depois da reforma.\nRegras obrigatórias: o tempo rural anterior a 1991, ainda que remoto, descontínuo e sem contribuição, conta para a carência (STJ, Superior Tribunal de Justiça, Tema 1.007; STF, Supremo Tribunal Federal, Tema 1.104); o posterior a 1991 sem contribuição entra só pela letra da lei, sem tese repetitiva; o tempo rural exige início de prova material da época.\nValor: na regra anterior à reforma, o tempo rural sem contribuição não aumentava o percentual (70% mais 1% por grupo de 12 contribuições); para o cálculo posterior, as fontes não tratam do ponto.\nInício e duração: vitalícia, com 13º.\nDocumentos necessários: CNIS (Cadastro Nacional de Informações Sociais) e carteiras de trabalho do tempo urbano; para o tempo rural, os documentos do art. 106 da Lei 8.213/1991 por ano do período (contrato de arrendamento, parceria ou comodato, DAP, Declaração de Aptidão ao Pronaf, Programa Nacional de Fortalecimento da Agricultura Familiar, bloco do produtor, notas fiscais de venda), autodeclaração até 31/12/2022 ou cadastro no CNIS desde 01/01/2023, certidão que qualifique o cônjuge como lavrador e testemunhas como complemento.\nAtenção: a idade e o tempo mínimo exigidos depois de 13/11/2019 estão em disputa entre a leitura do INSS e a letra da lei.", "fonte": "Lei 8.213/1991, arts. 48, § 3º, e 55, §§ 2º e 3º; Dec. 3.048/1999, arts. 51 e 57; STJ Tema 1.007; STF Tema 1.104; TNU Súm. 76", "origem": "síntese dos itens rur-026, rur-027, rur-028, rur-029, rur-018, rur-011, doc-006, qd-020; gerente-previdenciario/SKILL.md, Etapa 1, prova a pedir (rural)", "sinal": "controvertido", "ficha": true}, {"id": "fic-014", "tema": "Segurado especial rural", "pergunta": "O que é e quem é o segurado especial rural?", "variantes": ["segurado especial", "quem é segurado especial", "regra do segurado especial", "requisitos do segurado especial", "regime de economia familiar", "agricultor familiar no INSS", "pequeno produtor rural", "pescador artesanal"], "resposta": "Quem é: produtor rural em área de até 4 módulos fiscais (proprietário, possuidor, assentado, parceiro, meeiro, comodatário ou arrendatário), seringueiro ou extrativista vegetal e pescador artesanal, com o cônjuge ou companheiro e os filhos maiores de 16 anos que trabalham com o grupo.\nRequisitos: regime de economia familiar, em que o trabalho da família é indispensável à subsistência, em mútua dependência e colaboração, sem empregados permanentes.\nO que não descaracteriza: área maior que o módulo com exploração familiar comprovada; trabalho urbano de outro membro da família; atividade urbana intercalada; associação a cooperativa rural que não seja de trabalho.\nO que exclui: empregado permanente; outra atividade remunerada por mais de 120 dias, corridos ou intercalados, no ano civil, a partir do mês seguinte.\nValor: os benefícios do segurado especial são de 1 salário mínimo (aposentadoria por idade ou por incapacidade, auxílio por incapacidade temporária, auxílio-reclusão e pensão), sem carência em contribuições: prova-se o número de meses de atividade rural.\nAtenção: desde 01/01/2023 a prova é exclusivamente o cadastro do segurado especial no CNIS (Cadastro Nacional de Informações Sociais), e cadastro sem atualização por 5 anos restringe o cômputo do período.", "fonte": "Lei 8.213/1991, arts. 11, VII, §§ 1º, 8º, 9º e 10, 26, 38-A, 38-B e 39, I; STJ Temas 532 e 1.115; TNU Súm. 30, 41 e 46", "origem": "síntese dos itens rur-001, rur-002, rur-003, rur-004, rur-005, rur-006, rur-007, rur-008, rur-013, rur-014, qd-003", "sinal": "firme", "ficha": true}, {"id": "fic-015", "tema": "Prova rural", "pergunta": "Como funciona a prova do tempo rural?", "variantes": ["prova do tempo rural", "como provar tempo de roça", "documentos para provar trabalho rural", "regra da prova rural", "provar que trabalhei na roça", "tempo rural conta", "início de prova material rural", "testemunha para tempo rural"], "resposta": "Regra: exige início de prova material da época, que as testemunhas complementam; prova só testemunhal não basta, e sem documento a ação é extinta sem julgamento do mérito, podendo ser proposta de novo.\nDocumentos: contrato de arrendamento, parceria ou comodato, DAP (Declaração de Aptidão ao Pronaf, Programa Nacional de Fortalecimento da Agricultura Familiar), bloco de notas do produtor, notas fiscais de venda da produção, imposto de renda com renda rural, licença do Incra (Instituto Nacional de Colonização e Reforma Agrária) e certidão de casamento que qualifique o cônjuge como lavrador; a lista é exemplificativa, e a declaração do sindicato saiu dela em 2019.\nPeríodo: o documento não precisa cobrir todos os anos e testemunhas convincentes estendem o tempo, inclusive para antes do documento mais antigo, mas ele deve ser da época dos fatos.\nAutodeclaração: atividade até 31/12/2022 prova-se pela autodeclaração ratificada ou pelos documentos; desde 01/01/2023, só pelo cadastro do segurado especial no CNIS (Cadastro Nacional de Informações Sociais).\nNo INSS (Instituto Nacional do Seguro Social): a justificação administrativa ouve de 2 a 6 testemunhas para completar a prova material.\nContagem: tempo rural até 1991 sem contribuição conta como tempo, a partir dos 12 anos, mas não como carência nas aposentadorias urbanas (conta na híbrida); depois de 1991, só com contribuição facultativa; empregado rural com carteira antes de 1991 conta também como carência.\nAtenção: documento em nome do cônjuge que passou ao trabalho urbano deixa de servir como prova rural.", "fonte": "Lei 8.213/1991, arts. 38-B, 39, II, 55, §§ 2º e 3º, e 106; Súm. 149 e 577/STJ; STJ Temas 533, 629, 638 e 644; TNU Súm. 5, 6 e 14; Dec. 3.048/1999, arts. 142 a 151", "origem": "síntese dos itens rur-009, rur-010, rur-011, rur-012, rur-013, rur-015, rur-016, rur-018, rur-019, rur-020, rur-021, rur-006, qd-020", "sinal": "firme", "ficha": true}, {"id": "fic-016", "tema": "Professor", "pergunta": "Qual é a regra da aposentadoria do professor?", "variantes": ["regra da aposentadoria do professor", "aposentadoria de professor", "requisitos da aposentadoria do professor", "como funciona a aposentadoria da professora", "quem tem direito à aposentadoria de professor", "aposentadoria especial de professor", "tempo de magistério"], "resposta": "O que é: a aposentadoria com idade e tempo reduzidos para quem exerce magistério na educação básica.\nQuem tem direito: professor com efetivo exercício de magistério na educação infantil, no ensino fundamental ou no médio, incluídas a direção de escola e a coordenação e o assessoramento pedagógicos exercidos por professor; especialista em educação e ensino superior ficam fora.\nRequisitos: regra permanente, 57 anos (mulher) ou 60 (homem) com 25 anos de magistério para ambos; transições para filiados até 13/11/2019, pontos de 88 (professora) ou 98 (professor) em 2026 com 25 ou 30 anos de magistério, idade mínima de 54 anos e 6 meses ou 59 anos e 6 meses em 2026, e pedágio de 100% com 52 ou 55 anos; 180 contribuições de carência.\nRegras obrigatórias: o tempo de magistério não se converte em tempo comum; o tempo em outra profissão não soma ao magistério e entra só na média; o professor não tem versão do pedágio de 50%.\nValor: 60% da média mais 2 pontos percentuais por ano acima de 15 (mulher) ou 20 (homem) na regra permanente, nos pontos e na idade progressiva; 100% da média no pedágio de 100%; direito adquirido até 13/11/2019 (25 ou 30 anos de magistério, sem idade), 100% do salário de benefício com fator previdenciário e bônus de 10 ou 5 anos, afastado com os pontos 85/95 mais 5.\nInício e duração: vitalícia, com 13º.\nDocumentos necessários: diploma ou habilitação; CTPS (Carteira de Trabalho e Previdência Social); declaração do estabelecimento de ensino, quando necessária, com a função exercida (docência, direção, coordenação ou assessoramento pedagógico) e o nível de ensino; CNIS (Cadastro Nacional de Informações Sociais).\nAtenção: contam como magistério férias, licença-prêmio, salário-maternidade e benefício por incapacidade entre períodos de magistério; o acidentário só até 30/06/2020 mesmo não intercalado.", "fonte": "CF, art. 201, § 8º; EC 103/2019, arts. 15, § 3º, 16, § 2º, 19, § 1º, II, e 20, § 1º; Lei 9.394/1996, art. 67, § 2º; Dec. 3.048/1999, art. 54; IN 128/2022, arts. 214, 251 e 255", "origem": "síntese dos itens prof-001, prof-002, prof-003, prof-004, prof-005, prof-006, prof-007, prof-009, prof-010, prof-012, qd-012, qd-013, apos-006, prof-008, qd-013; gerente-previdenciario/SKILL.md, Etapa 1, prova a pedir (professor)", "sinal": "firme", "ficha": true}, {"id": "fic-017", "tema": "Pessoa com deficiência", "pergunta": "Qual é a regra da aposentadoria da pessoa com deficiência?", "variantes": ["regra da aposentadoria da pessoa com deficiência", "aposentadoria PcD", "aposentadoria do deficiente", "requisitos da aposentadoria da pessoa com deficiência", "como funciona a aposentadoria da pessoa com deficiência", "quem tem direito à aposentadoria da pessoa com deficiência", "LC 142", "aposentadoria por deficiência grave moderada leve"], "resposta": "O que é: a aposentadoria com tempo ou idade reduzidos para a PcD (pessoa com deficiência), conforme o grau da deficiência.\nQuem tem direito: quem tem impedimento de longo prazo (2 anos ininterruptos) físico, mental, intelectual ou sensorial que, junto com barreiras, dificulta a participação plena na sociedade, com grau fixado pela avaliação do INSS (Instituto Nacional do Seguro Social).\nRequisitos: por tempo, deficiência grave com 20 anos (mulher) ou 25 (homem) de contribuição como PcD, moderada com 24 ou 29 e leve com 28 ou 33, além da carência; por idade, 55 anos (mulher) ou 60 (homem) com 15 anos de contribuição na condição de PcD, em qualquer grau.\nRegras obrigatórias: condição de PcD na DER (data de entrada do requerimento) ou na data dos requisitos; deficiência surgida depois ou com mudança de grau tem os tempos convertidos pelo grau preponderante; o tempo especial só conta como tempo de PcD até 13/11/2019, sem somar as duas reduções no mesmo período.\nValor: por tempo, 100% do salário de benefício; por idade, 70% mais 1 ponto percentual por grupo de 12 contribuições, até 100%.\nInício e duração: vitalícia.\nDocumentos necessários: avaliação biopsicossocial, médica e social, com o grau pelo IF-BrA (Índice de Funcionalidade Brasileiro Aplicado), a data provável de início e as variações de grau; documentos médicos da época de cada período; para deficiência anterior a 09/11/2013, documentos daquela época, vedada a prova só testemunhal; CNIS (Cadastro Nacional de Informações Sociais).\nAtenção: grau grave até 5.739 pontos, moderado de 5.740 a 6.354 e leve de 6.355 a 7.584; o INSS usa a média de 100% dos salários e a média dos 80% maiores está afetada na TNU (Turma Nacional de Uniformização) Tema 389, sem tese; o aposentado pode seguir trabalhando e a PcD pode optar por outra aposentadoria mais vantajosa.", "fonte": "LC 142/2013, arts. 2º a 9º; Dec. 3.048/1999, arts. 70-A a 70-J; IN 128/2022, arts. 303 a 314; Portaria Interministerial 1/2014; TNU Tema 389", "origem": "síntese dos itens pcd-001, pcd-002, pcd-003, pcd-004, pcd-005, pcd-006, pcd-007, pcd-008, pcd-010, pcd-011, pcd-012, pcd-013, qd-014, pcd-009; gerente-previdenciario/SKILL.md, Etapa 1, prova a pedir (pessoa com deficiência)", "sinal": "firme", "ficha": true}, {"id": "fic-018", "tema": "Auxílio por incapacidade temporária", "pergunta": "Qual é a regra do auxílio por incapacidade temporária (auxílio-doença)?", "variantes": ["regra do auxílio-doença", "auxílio-doença", "requisitos do auxílio-doença", "como funciona o auxílio-doença", "quem tem direito ao auxílio-doença", "auxílio por incapacidade temporária", "encostado pelo INSS", "afastamento pelo INSS"], "resposta": "O que é: o auxílio por incapacidade temporária, ainda chamado auxílio-doença na lei, pago enquanto o segurado não pode trabalhar.\nQuem tem direito: segurado incapaz para o trabalho ou para a atividade habitual por mais de 15 dias consecutivos, com qualidade de segurado; quem tem duas atividades e ficou incapaz para uma recebe por ela.\nRequisitos: 12 contribuições de carência (6 depois de perder e recuperar a qualidade de segurado), dispensadas em acidente de qualquer natureza, doença profissional ou do trabalho e doenças graves da lista ministerial surgidas depois da filiação (câncer, cardiopatia grave, Parkinson, entre outras).\nRegras obrigatórias: doença ou lesão anterior à filiação não gera o benefício, salvo agravamento; a volta voluntária ao trabalho cancela o auxílio desde o retorno, com devolução; perícia, reabilitação e tratamento gratuito são obrigatórios; preso em regime fechado não recebe; não acumula com aposentadoria nem com salário-maternidade.\nValor: 91% do salário de benefício (média de 100% dos salários desde 07/1994), limitado à média dos 12 últimos salários de contribuição, entre o salário mínimo e o teto; o acidentário paga o mesmo valor.\nInício e duração: empregado, salvo o doméstico, recebe do INSS (Instituto Nacional do Seguro Social) a partir do 16º dia, e a empresa paga os 15 primeiros; os demais, desde a DII (data de início da incapacidade); pedido depois do 30º dia começa na DER (data de entrada do requerimento); cessa na data estimada ou em 120 dias, salvo prorrogação pedida nos últimos 15 dias.\nDocumentos necessários: laudo médico com a data de início da incapacidade e as limitações; resultado da perícia do INSS, inclusive da análise documental; carta do benefício anterior e comunicação de cessação, se houver; CNIS (Cadastro Nacional de Informações Sociais); no acidente de trabalho, a CAT (Comunicação de Acidente do Trabalho) ou decisão que reconheça o nexo.\nAtenção: pelo Atestmed (análise documental) o benefício sai sem perícia por até 30 dias, ampliados temporariamente para 90 por portaria; acima disso, perícia presencial ou por telemedicina.", "fonte": "Lei 8.213/1991, arts. 25, I, 26, II, 27-A, 29, § 10, 59, 60 e 61; Dec. 3.048/1999, arts. 71 a 78; IN 128/2022, arts. 336 e 339", "origem": "síntese dos itens inc-001, inc-002, inc-004, inc-005, inc-009, inc-010, inc-013, inc-014, inc-056, inc-057, inc-059, inc-060, inc-064, qd-001, inc-003, inc-006, inc-007, inc-017, inc-066, doc-002; gerente-previdenciario/SKILL.md, Etapa 1, prova a pedir (incapacidade)", "sinal": "firme", "ficha": true}, {"id": "fic-019", "tema": "Aposentadoria por incapacidade permanente", "pergunta": "Qual é a regra da aposentadoria por incapacidade permanente (aposentadoria por invalidez)?", "variantes": ["regra da aposentadoria por invalidez", "aposentadoria por invalidez", "requisitos da aposentadoria por invalidez", "como funciona a aposentadoria por invalidez", "quem tem direito à aposentadoria por invalidez", "aposentadoria por incapacidade permanente", "aposentar por doença", "invalidez"], "resposta": "O que é: a aposentadoria por incapacidade permanente, ainda chamada aposentadoria por invalidez na lei.\nQuem tem direito: segurado incapaz para o trabalho e insuscetível de reabilitação para atividade que lhe garanta a subsistência, tendo recebido ou não auxílio por incapacidade temporária antes.\nRequisitos: qualidade de segurado e 12 contribuições de carência, salvo acidente, doença do trabalho e doenças graves da lista; incapacidade parcial e permanente leva, em regra, à reabilitação, não à aposentadoria, salvo doença estigmatizante.\nRegras obrigatórias: a volta voluntária ao trabalho cancela a aposentadoria desde o retorno; reavaliação pericial a qualquer tempo, dispensada depois dos 60 anos sem volta ao trabalho e para aids (síndrome da imunodeficiência adquirida), Alzheimer, Parkinson e esclerose lateral amiotrófica; recuperação parcial ou depois de 5 anos dá 18 meses de redução gradual antes de cessar.\nValor: fato gerador desde 14/11/2019, 60% da média mais 2 pontos percentuais por ano acima de 20 anos (homem) ou 15 (mulher); 100% se decorrer de acidente do trabalho ou doença profissional ou do trabalho; fato gerador até 13/11/2019, 100%; mais 25% para quem precisa de assistência permanente de outra pessoa, mesmo acima do teto.\nInício e duração: no dia seguinte à cessação do auxílio (a IN, Instrução Normativa, 128/2022 fixa a data da perícia); sem auxílio anterior, a regra do auxílio; na Justiça sem pedido prévio, na citação; o adicional de 25% cessa com a morte e não passa à pensão.\nDocumentos necessários: laudo médico com a data de início da incapacidade; resultado da perícia do INSS (Instituto Nacional do Seguro Social); carta do benefício precedente (espécie, data de início, data de cessação e salário de benefício); CNIS (Cadastro Nacional de Informações Sociais) com cada período em benefício marcado como intercalado ou não; no acidente de trabalho, a CAT (Comunicação de Acidente do Trabalho) ou decisão que reconheça o nexo.\nAtenção: o STF (Supremo Tribunal Federal), Tema 1.300 (trânsito em 18/04/2026), confirmou os 60% mais 2 pontos na aposentadoria não acidentária, e está em aberto se o marco é a DII (data de início da incapacidade) ou a data da perícia.", "fonte": "Lei 8.213/1991, arts. 25, I, 42 a 47 e 101; EC 103/2019, art. 26, §§ 2º, III, e 3º, II; STF Temas 1.095 e 1.300; TNU Temas 177 e 274", "origem": "síntese dos itens inc-022, inc-023, inc-024, inc-025, inc-027, inc-028, inc-029, inc-030, inc-031, inc-032, inc-018, inc-019, doc-002; gerente-previdenciario/SKILL.md, Etapa 1, prova a pedir (incapacidade)", "sinal": "firme", "ficha": true}, {"id": "fic-020", "tema": "Auxílio-acidente", "pergunta": "Qual é a regra do auxílio-acidente?", "variantes": ["regra do auxílio-acidente", "auxílio-acidente", "requisitos do auxílio-acidente", "como funciona o auxílio-acidente", "quem tem direito ao auxílio-acidente", "indenização por sequela do INSS", "B94", "sequela de acidente"], "resposta": "O que é: indenização mensal ao segurado que ficou com sequela que reduz a capacidade para o trabalho habitual, paga junto com o salário.\nQuem tem direito: empregado, empregado doméstico (fato gerador desde 02/06/2015), avulso e segurado especial, depois da consolidação das lesões de acidente de qualquer natureza ou de doença profissional ou do trabalho; autônomo e facultativo ficam fora.\nRequisitos: sem carência e sem precisar estar incapaz; basta redução da capacidade habitual, ainda que mínima, e o rol de sequelas do Anexo III do Decreto 3.048/1999 é exemplificativo.\nRegras obrigatórias: não acumula com aposentadoria, salvo lesão e aposentadoria anteriores a 11/11/1997; não se recebem dois auxílios-acidente; não mantém a qualidade de segurado por prazo ilimitado; desde 24/03/2026 o pedido passa por análise documental prévia e, faltando documento essencial, é indeferido sem perícia.\nValor: 50% do salário de benefício do auxílio por incapacidade temporária que o originou, podendo ficar abaixo do salário mínimo; seu valor entra no salário de contribuição da aposentadoria.\nInício e duração: no dia seguinte à cessação do auxílio por incapacidade temporária ou, sem ele, na DER (data de entrada do requerimento); cessa na véspera de qualquer aposentadoria, na emissão de CTC (Certidão de Tempo de Contribuição) ou no óbito.\nDocumentos necessários: carta do auxílio por incapacidade temporária que o precedeu (espécie, data de início, data de cessação e salário de benefício); laudo médico que descreva a sequela consolidada e a redução da capacidade; resultado da perícia do INSS (Instituto Nacional do Seguro Social); comprovação da categoria (empregado, doméstico, avulso ou segurado especial); no acidente de trabalho, a CAT (Comunicação de Acidente do Trabalho) ou decisão que reconheça o nexo; CNIS (Cadastro Nacional de Informações Sociais).\nAtenção: a TNU (Turma Nacional de Uniformização) dispensa pedido específico do auxílio-acidente quando cessa o auxílio por incapacidade temporária, e os atrasados respeitam a prescrição de 5 anos.", "fonte": "Lei 8.213/1991, arts. 15, I, 18, § 1º, 26, I, 31 e 86; Dec. 3.048/1999, art. 104 e Anexo III; STJ Súm. 507; Portaria Conjunta MPS/INSS 15/2026", "origem": "síntese dos itens inc-033, inc-034, inc-035, inc-036, inc-037, inc-038, inc-039, inc-040, inc-041, inc-043, inc-044, anx3-000, inc-042, doc-002; gerente-previdenciario/SKILL.md, Etapa 1, prova a pedir (auxílio-acidente)", "sinal": "firme", "ficha": true}, {"id": "fic-021", "tema": "Acidente do trabalho (B91)", "pergunta": "Qual é a diferença entre benefício acidentário e benefício comum?", "variantes": ["benefício acidentário", "diferença entre B91 e B31", "auxílio-doença acidentário", "regra do acidente de trabalho no INSS", "como funciona o benefício por acidente de trabalho", "acidentário x comum", "doença do trabalho no INSS"], "resposta": "O que é acidentário: o que decorre de acidente do trabalho, doença profissional ou doença do trabalho e situações equiparadas, como o acidente no trajeto entre casa e trabalho e a agressão sofrida no serviço.\nDiferenças: o auxílio paga os mesmos 91% no B91 (acidentário) e no B31 (comum), mas o B91 dispensa carência, dá aposentadoria por incapacidade permanente de 100%, estabilidade de 12 meses no emprego após a cessação, depósito do FGTS (Fundo de Garantia do Tempo de Serviço) durante o afastamento e pensão sem exigir 18 contribuições nem 2 anos de união.\nReconhecimento: a empresa emite a CAT (Comunicação de Acidente do Trabalho) até o primeiro dia útil seguinte; se não emitir, podem fazê-lo o acidentado, os dependentes, o sindicato ou o médico; sem CAT, a perícia do INSS (Instituto Nacional do Seguro Social) reconhece pelo nexo técnico epidemiológico.\nData do acidente na doença: a do início da incapacidade, da segregação compulsória ou do diagnóstico, a que vier primeiro.\nAção judicial: Justiça Estadual, fora dos juizados, qualquer que seja o valor; o autor é isento de custas e sucumbência; prazo de 5 anos do acidente ou do reconhecimento da incapacidade.\nAtenção: doença degenerativa, inerente à idade ou endêmica da região não é acidentária, e o Atestmed só concede como acidentário se a Perícia Médica Federal reconhecer o nexo.", "fonte": "Lei 8.213/1991, arts. 19 a 23, 26, II, 61, 77, § 2º-A, 118 e 129; EC 103/2019, art. 26, § 3º, II; Lei 8.036/1990, art. 15, § 5º; CF, art. 109, I", "origem": "síntese dos itens inc-045, inc-046, inc-047, inc-048, inc-049, inc-050, inc-051, inc-052, inc-053, inc-054, inc-012, inc-072, inc-074, inc-075, pen-027", "sinal": "firme", "ficha": true}, {"id": "fic-022", "tema": "BPC: quem tem direito", "pergunta": "O que é e quem tem direito ao BPC do idoso (LOAS)?", "variantes": ["regra do LOAS do idoso", "LOAS idoso", "BPC do idoso", "requisitos do LOAS", "como funciona o LOAS", "quem tem direito ao LOAS", "benefício assistencial do idoso", "aposentadoria sem contribuição"], "resposta": "O que é: o BPC (benefício de prestação continuada) da LOAS (Lei Orgânica da Assistência Social) ao idoso, benefício assistencial de 1 salário mínimo que não exige contribuição; espécie 88.\nQuem tem direito: pessoa com 65 anos ou mais que não tem meios de se manter nem de ser mantida pela família; o estrangeiro residente também, pelo STF (Supremo Tribunal Federal).\nRequisitos: renda familiar por pessoa igual ou inferior a 1/4 do salário mínimo (R$ 405,25 em 2026), CPF (Cadastro de Pessoas Físicas), CadÚnico (Cadastro Único) atualizado há no máximo 24 meses e registro biométrico.\nRegras obrigatórias: não acumula com aposentadoria, pensão ou outro benefício da seguridade, cabendo a opção pelo mais vantajoso; exigência não cumprida em 30 dias equivale a desistência; benefício acima de 1 salário mínimo de outro morador entra inteiro na renda.\nValor: 1 salário mínimo (R$ 1.621,00 em 2026), sem 13º e sem desconto de contribuição.\nInício e duração: desde a DER (data de entrada do requerimento); revisão a cada 2 anos; não gera pensão por morte, e só os valores não recebidos em vida vão aos herdeiros.\nDocumentos necessários: CPF; inscrição no CadÚnico atualizada há no máximo 24 meses; registro biométrico (Carteira de Identidade Nacional, título de eleitor ou CNH, Carteira Nacional de Habilitação); composição do grupo sob o mesmo teto, com nascimento e estado civil de cada membro; renda de cada membro, por tipo, com o documento que a prova; comprovantes de gastos de saúde não fornecidos pelo SUS (Sistema Único de Saúde) nem pelo SUAS (Sistema Único de Assistência Social).\nAtenção: aposentadoria ou BPC de até 1 salário mínimo de outro idoso ou pessoa com deficiência da casa sai da conta; se quem acabou de completar 65 anos já preenche a idade é ponto controvertido.", "fonte": "CF, art. 203; Lei 8.742/1993, arts. 20 e 21; Dec. 6.214/2007, Anexo, arts. 22 e 23; STF Temas 173 e 312; TNU Tema 369", "origem": "síntese dos itens bpc-001, bpc-002, bpc-003, bpc-007, bpc-008, bpc-012, bpc-014, bpc-025, bpc-026, bpc-027, bpc-028, bpc-029, bpc-032, doc-005, bpc-021, bpc-022, bpc-024; gerente-previdenciario/SKILL.md, Etapa 1, prova a pedir (benefício assistencial)", "sinal": "firme", "ficha": true}, {"id": "fic-023", "tema": "BPC: quem tem direito", "pergunta": "O que é e quem tem direito ao BPC da pessoa com deficiência (LOAS)?", "variantes": ["regra do LOAS deficiente", "LOAS deficiente", "BPC da pessoa com deficiência", "requisitos do LOAS para deficiência", "como funciona o LOAS da pessoa com deficiência", "quem tem direito ao LOAS por deficiência", "LOAS para criança com deficiência", "LOAS autismo"], "resposta": "O que é: o BPC (benefício de prestação continuada) da LOAS (Lei Orgânica da Assistência Social) à pessoa com deficiência, benefício assistencial de 1 salário mínimo que não exige contribuição; espécie 87.\nQuem tem direito: pessoa com impedimento de longo prazo (efeitos por no mínimo 2 anos) que, em interação com barreiras, obstrui sua participação plena na sociedade, inclusive criança, avaliada pela limitação compatível com a idade.\nRequisitos: renda familiar por pessoa igual ou inferior a 1/4 do salário mínimo (R$ 405,25 em 2026), CPF (Cadastro de Pessoas Físicas), CadÚnico (Cadastro Único) atualizado há no máximo 24 meses, biometria e avaliação biopsicossocial médica (Perícia Médica Federal) e social (serviço social do INSS, Instituto Nacional do Seguro Social).\nRegras obrigatórias: a atividade remunerada suspende o BPC; o aprendiz acumula por até 2 anos; não acumula com outro benefício da seguridade; autismo e visão monocular não dão direito automático; no recurso administrativo, a matéria médica para na Junta de Recursos.\nValor: 1 salário mínimo (R$ 1.621,00 em 2026), sem 13º; quem tem deficiência moderada ou grave e passa a trabalhar ganhando até 2 salários mínimos recebe o auxílio-inclusão, de 50% do BPC (R$ 810,50 em 2026).\nInício e duração: desde a DER (data de entrada do requerimento), ou desde a data em que a perícia judicial situar a incapacidade se ela já existia na DER; revisão a cada 2 anos, com reavaliação médica dispensada se o impedimento for permanente, irreversível ou irrecuperável.\nDocumentos necessários: CPF; CadÚnico atualizado há no máximo 24 meses; registro biométrico; composição do grupo sob o mesmo teto, com nascimento e estado civil de cada membro; renda de cada membro com o documento que a prova; gastos de saúde não fornecidos pelo SUS (Sistema Único de Saúde) nem pelo SUAS (Sistema Único de Assistência Social); documentação médica para a avaliação biopsicossocial.\nAtenção: a TNU (Turma Nacional de Uniformização) conta os 2 anos do início do impedimento até a cessação prevista, entendimento adverso a quem tem impedimento mais curto.", "fonte": "Lei 8.742/1993, arts. 20, §§ 2º, 3º, 6º e 10, 21, 21-A e 26-A; Lei 13.146/2015, art. 2º; Dec. 6.214/2007, art. 4º, § 1º; TNU Temas 173, 376 e 378", "origem": "síntese dos itens bpc-001, bpc-004, bpc-005, bpc-006, bpc-023, bpc-025, bpc-028, bpc-029, bpc-030, bpc-031, qd-023, bpc-032, adm-017, doc-005; gerente-previdenciario/SKILL.md, Etapa 1, prova a pedir (benefício assistencial)", "sinal": "firme", "ficha": true}, {"id": "fic-024", "tema": "BPC: renda e grupo familiar", "pergunta": "Como funciona o cálculo da renda e do grupo familiar no BPC (LOAS)?", "variantes": ["renda do LOAS", "grupo familiar do LOAS", "como calcula a renda do LOAS", "limite de renda do BPC", "quem entra na renda do LOAS", "regra da renda per capita do LOAS", "1/4 do salário mínimo"], "resposta": "Regra: somam-se as rendas de todos os membros do grupo que moram sob o mesmo teto e divide-se pelo número de pessoas; o resultado deve ser igual ou inferior a 1/4 do salário mínimo (R$ 405,25 em 2026) no mês do requerimento; a renda informal entra pelo CadÚnico (Cadastro Único) e, havendo divergência entre bases, prevalece a maior.\nQuem entra: o requerente, o cônjuge ou companheiro, os pais (ou madrasta e padrasto na falta de um deles), os irmãos solteiros, os filhos e enteados solteiros e os menores tutelados.\nQuem fica fora: filho, irmão ou enteado casado, em união estável, divorciado, separado ou viúvo; pessoa internada ou em instituição de longa permanência; avós, netos, tios, sobrinhos, genros e noras.\nRendas excluídas: BPC (benefício de prestação continuada) de outro membro; benefício previdenciário de até 1 salário mínimo de idoso acima de 65 anos ou pessoa com deficiência, um por membro; bolsa de estágio, aprendizagem e indenização por rompimento de barragem.\nDeduções: desde 30/09/2026, por mês, medicamentos R$ 56,00, consultas e tratamentos R$ 110,00, fraldas R$ 120,00, alimentação especial R$ 147,00 e Centro-Dia R$ 40,00, com documento médico; gasto maior se prova com recibos de 12 meses.\nRenda acima de 1/4: o INSS (Instituto Nacional do Seguro Social) nega; na Justiça admite-se provar a miserabilidade por laudo social (STF, Supremo Tribunal Federal, Tema 27; STJ, Superior Tribunal de Justiça, Tema 185).\nAtenção: para a TNU (Turma Nacional de Uniformização), entram benefício acima de 1 salário mínimo e benefício de 1 salário mínimo de membro sem deficiência e com menos de 65 anos, e filhos com condições podem afastar o BPC; se o Bolsa Família entra não tem resposta firme.", "fonte": "Lei 8.742/1993, arts. 20, §§ 1º, 3º, 3º-A, 9º, 11-A e 14, e 20-B; Portaria Conjunta MDS/INSS 34/2025, arts. 7º e 8º; Portaria Conjunta MDS/INSS 45/2026; STF Temas 27 e 312; STJ Temas 185 e 640; TNU Tema 369", "origem": "síntese dos itens bpc-008, bpc-009, bpc-010, bpc-011, bpc-012, bpc-013, bpc-014, bpc-015, bpc-016, bpc-018, bpc-019, bpc-020, qd-017, qd-018, qd-019", "sinal": "firme", "ficha": true}, {"id": "fic-025", "tema": "Pensão: requisitos e prazos", "pergunta": "Qual é a regra da pensão por morte?", "variantes": ["regra da pensão por morte", "pensão por morte", "requisitos da pensão por morte", "como funciona a pensão por morte", "quem tem direito à pensão por morte", "pensão da viúva", "pensão do INSS quando o marido morre", "quanto tempo dura a pensão"], "resposta": "O que é: o benefício pago aos dependentes do segurado que morre, aposentado ou não.\nQuem tem direito: os dependentes, em três classes: cônjuge, companheiro e filho menor de 21 anos, inválido ou com deficiência intelectual, mental ou grave (enteado e menor tutelado equiparados); pais; irmão nas mesmas condições do filho; a classe anterior exclui as seguintes, e só pais e irmãos provam dependência econômica.\nRequisitos: sem carência; o falecido precisa ter qualidade de segurado na data do óbito ou já ter reunido os requisitos de alguma aposentadoria; vale a lei da data do óbito.\nRegras obrigatórias: união estável exige início de prova material de até 24 meses antes do óbito; contribuições atrasadas do autônomo não se regularizam depois do óbito; não se recebem duas pensões de cônjuge no RGPS (Regime Geral de Previdência Social); fica excluído o condenado por homicídio doloso contra o segurado; filho não recebe depois dos 21 anos por estar estudando.\nValor: óbito desde 14/11/2019, cota familiar de 50% mais 10 pontos percentuais por dependente, até 100%, sobre a aposentadoria recebida ou a por incapacidade permanente a que teria direito; com dependente inválido ou com deficiência, 100% até o teto; as cotas não revertem; óbito até 13/11/2019, 100% com reversão; nunca abaixo de 1 salário mínimo no total.\nInício e duração: desde o óbito se pedida em 180 dias (filhos menores de 16 anos) ou 90 dias (demais), depois desde a DER (data de entrada do requerimento); para cônjuge ou companheiro, 4 meses se o falecido não tinha 18 contribuições ou a união tinha menos de 2 anos, salvo morte por acidente ou doença do trabalho; com ambos, pela idade no óbito desde 01/01/2021: 3 anos (menos de 22), 6 (22 a 27), 10 (28 a 30), 15 (31 a 41), 20 (42 a 44) e vitalícia com 45 ou mais.\nDocumentos necessários: certidão de óbito; prova da qualidade de segurado do falecido (carta de aposentadoria ou CNIS, Cadastro Nacional de Informações Sociais, com os salários dele); certidão de nascimento ou de casamento de cada dependente; laudo, se houver dependente inválido ou com deficiência; declaração do segurado, no enteado e no menor tutelado; na união estável, duas provas materiais, uma de até 24 meses antes do óbito; data do casamento ou do início da união e as 18 contribuições; para ex-cônjuge, a decisão de alimentos e o prazo, se temporários.\nAtenção: o STF (Supremo Tribunal Federal) julgou constitucional o cálculo por cotas (ADI 7.051), e novo casamento não está entre as causas de cessação da cota.", "fonte": "Lei 8.213/1991, arts. 16, 26, I, 74, 76, 77 e 102; EC 103/2019, art. 23; STJ Súm. 340 e 416; STF ADI 7.051; TNU Súm. 52", "origem": "síntese dos itens pen-001, pen-002, pen-003, pen-006, pen-008, pen-010, pen-011, pen-012, pen-013, pen-016, pen-017, pen-018, pen-020, pen-021, pen-022, pen-023, pen-024, pen-025, pen-027, pen-030, pen-015, doc-003, pen-028, pen-029, acu-004, qd-016; gerente-previdenciario/SKILL.md, Etapa 1, prova a pedir (pensão por morte)", "sinal": "firme", "ficha": true}, {"id": "fic-026", "tema": "Acumulação de benefícios", "pergunta": "Como funciona a acumulação de benefícios do INSS?", "variantes": ["acumulação de benefícios", "posso receber dois benefícios", "regra da acumulação de pensão e aposentadoria", "redutor da pensão", "quais benefícios não acumulam", "acumular pensão e aposentadoria", "receber dois benefícios do INSS"], "resposta": "Vedado acumular: duas aposentadorias do RGPS (Regime Geral de Previdência Social); aposentadoria e auxílio por incapacidade temporária; salário-maternidade e auxílio por incapacidade temporária; dois auxílios-acidente; duas pensões de cônjuge ou companheiro, com opção pela mais vantajosa; auxílio-acidente e aposentadoria, salvo lesão e aposentadoria anteriores a 11/11/1997.\nSeguro-desemprego: não acumula com benefício previdenciário, exceto pensão por morte e auxílio-acidente.\nAcumula com redutor: pensão de cônjuge do RGPS com aposentadoria de qualquer regime; pensão de cônjuge do RGPS com pensão de outro regime ou militar; aposentadoria do RGPS com pensão de cônjuge de regime próprio ou militar.\nValor: o benefício mais vantajoso é pago integral; do outro recebe-se 60% da parte entre 1 e 2 salários mínimos, 40% entre 2 e 3, 20% entre 3 e 4 e 10% acima de 4.\nDireito adquirido: quem tinha direito aos dois benefícios até 13/11/2019 não sofre o redutor.\nBPC (benefício de prestação continuada): não acumula com nenhum benefício, e quem tem direito aos dois escolhe o mais vantajoso, podendo renunciar à cota de pensão.\nAtenção: receber a 100% a parte até 1 salário mínimo do segundo benefício é leitura favorável, sem tese judicial, e benefício inacumulável já pago se compensa mês a mês, sem saldo negativo.", "fonte": "Lei 8.213/1991, art. 124; EC 103/2019, art. 24; Dec. 3.048/1999, art. 167-A; Lei 8.742/1993, art. 20, § 4º; STJ Súm. 507 e Tema 1.207", "origem": "síntese dos itens acu-001, acu-002, acu-003, acu-004, acu-005, acu-006, acu-007, acu-008, inc-041, inc-067, inc-068, bpc-032", "sinal": "firme", "ficha": true}, {"id": "fic-027", "tema": "Salário-maternidade e outros", "pergunta": "Qual é a regra do salário-maternidade?", "variantes": ["regra do salário-maternidade", "salário-maternidade", "requisitos do salário-maternidade", "como funciona o salário-maternidade", "quem tem direito ao salário-maternidade", "licença-maternidade do INSS", "auxílio-maternidade", "salário-maternidade da autônoma"], "resposta": "O que é: o benefício pago durante o afastamento por parto, adoção ou guarda judicial para adoção.\nQuem tem direito: a segurada empregada, doméstica, avulsa, contribuinte individual, facultativa, segurada especial e a desempregada que mantém a qualidade de segurada, além do segurado ou da segurada que adota ou obtém guarda judicial para adoção; se quem tinha direito morre, o cônjuge ou companheiro segurado recebe o restante.\nRequisitos: sem carência, porque o STF (Supremo Tribunal Federal) declarou inconstitucional a de 10 contribuições; a segurada especial comprova 12 meses de atividade rural antes do benefício.\nRegras obrigatórias: não acumula com auxílio por incapacidade temporária; o benefício exige afastamento do trabalho ou da atividade, sob pena de suspensão; gravidez múltipla e adoção simultânea de mais de uma criança geram um só benefício; na adoção ou guarda não se concede a mais de um segurado no mesmo processo, ressalvada a mãe biológica, ainda que o outro adotante seja de regime próprio; quem exerce atividades concomitantes recebe um salário-maternidade por atividade em que cumpriu os requisitos; o aposentado que segue ou volta a trabalhar como segurado obrigatório tem direito; o pagamento ao cônjuge ou companheiro sobrevivente deve ser pedido até o último dia do benefício originário, sob pena de indeferimento, e não cabe no aborto não criminoso, na morte do filho ou no abandono.\nValor: empregada e avulsa, remuneração integral (com salário variável, média dos 6 últimos salários); doméstica, o último salário de contribuição (com salário variável, média dos 6 últimos); segurada especial, 1 salário mínimo; contribuinte individual, facultativa e desempregada em período de graça, 1/12 da soma dos 12 últimos salários de contribuição apurados em até 15 meses; empregada intermitente, média das remunerações dos 12 meses anteriores ao fato gerador; empregada de jornada parcial com salário abaixo do mínimo, 1 salário mínimo; o total nunca fica abaixo de 1 salário mínimo (R$ 1.621,00 em 2026). Quem paga: a empresa paga à empregada e compensa nas contribuições; o INSS (Instituto Nacional do Seguro Social) paga direto à avulsa, à doméstica, à empregada de MEI (microempreendedor individual), à intermitente, à empregada de jornada parcial com salário abaixo do mínimo, à contribuinte individual, à facultativa, à segurada especial, à desempregada em período de graça, em toda adoção ou guarda para fins de adoção e ao cônjuge ou companheiro sobrevivente.\nInício e duração: 120 dias como regra. Parto, inclusive de natimorto: começa no afastamento, que pode ocorrer entre 28 dias antes do parto e o parto; a segurada em período de graça recebe a partir do nascimento; parto antecipado mantém os 120 dias. Em casos excepcionais, o início pode ser antecipado e o fim adiado em até 2 semanas cada, por atestado médico específico submetido à perícia do INSS; em período de graça, só o repouso posterior se estende. Internação da mãe ou do recém-nascido por mais de 2 semanas, por complicação do parto: o benefício cobre toda a internação e mais 120 dias após a alta, descontado o tempo recebido antes do parto. Criança com deficiência permanente por síndrome congênita do vírus Zika: mais 60 dias, no parto e na adoção ou guarda. Aborto não criminoso: 2 semanas, a partir do aborto. Adoção ou guarda judicial para fins de adoção de criança de até 12 anos: 120 dias, a partir do trânsito em julgado da sentença de adoção ou da data do termo de guarda ou da liminar nos autos de adoção. Cônjuge ou companheiro sobrevivente: do óbito até o fim do benefício originário. Prazo para pedir: 5 anos do fato gerador; o sobrevivente, até o último dia do benefício originário. Desde 25/05/2026, no benefício pago direto, o INSS tem 30 dias do requerimento para conceder, sob pena de concessão provisória automática, e o valor recebido nessa fase não se devolve, salvo má-fé.\nDocumentos necessários: CNIS (Cadastro Nacional de Informações Sociais) ou outra prova da qualidade de segurada. Parto: pedido feito antes do parto se instrui com atestado médico, que prova a gestação e fixa o início do afastamento; pedido feito depois do parto se instrui com a certidão de nascimento, que prova o parto e a data, e o INSS pode exigir perícia em caso de dúvida; para a empregada, inclusive doméstica, o início do afastamento se fixa pelo atestado médico ou pela certidão de nascimento. Natimorto: a lei, o decreto e a IN (Instrução Normativa) lidos não nomeiam documento próprio; o cartório remete o registro de natimorto ao INSS pelo SIRC (Sistema Nacional de Informações de Registro Civil). Aborto não criminoso: atestado médico. Extensão de 2 semanas: atestado médico específico, submetido à perícia. Adoção: nova certidão de nascimento da criança com o nome do adotante; guarda: termo de guarda com o nome do guardião e a indicação de que é para fins de adoção, sem o que não há benefício. Desempregada em período de graça: certidão de nascimento, ou atestado médico no aborto, ou os documentos da adoção, com o fato gerador dentro do período de graça. Segurada especial: documentos rurais do art. 106 da Lei 8.213/1991 ou cadastro no CNIS para os 12 meses de atividade. Contribuinte individual, facultativa e desempregada: os 12 últimos salários de contribuição.\nAtenção: a segurada especial pede pelo Meu INSS e precisa informar a categoria e preencher a autodeclaração depois do protocolo. O prazo de 180 dias para pedir, criado pela MP (medida provisória) 871/2019 no art. 71-D da Lei 8.213/1991, não consta da Lei 13.846/2019, que converteu a MP; vale o prazo de 5 anos da IN 128/2022. O art. 93, § 2º, do Decreto 3.048/1999 ainda fala em 10 meses de atividade rural para a segurada especial, mas a lei (art. 39, parágrafo único) exige 12 meses.", "fonte": "Lei 8.213/1991, arts. 25, III, 39, par. único, 71, caput e §§ 2º e 3º (incl. Leis 15.156/2025 e 15.222/2025), 71-A, 71-B, 71-C, 71-D (MP 871/2019, sem conversão), 72, 73, 73-A e 124, IV; Decreto 3.048/1999, arts. 93 a 103 (red. Decreto 10.410/2020 onde indicado); IN PRES/INSS 128/2022, arts. 177, 240, 357 (caput red. IN 188/2025, republicada), 358 a 361; STF ADIs 2.110 e 2.111", "origem": "03_TESES/legislacao/leis/Lei-8213-1991_planos-de-beneficios-previdencia.htm (última ocorrência dos arts. 39 e 71 a 73-A); Decreto-3048-1999_regulamento-da-previdencia-social_planalto.htm (arts. 93 a 103); IN-128-2022-PRES-INSS_procedimentos-RGPS_DOU-original.txt (arts. 177, 240, 357 a 361), alteradoras conferidas pela tabela 1.b de prev-lacunas/INSUMO_pesquisa-14 (art. 357 pela IN 188/2025; art. 197 revogado pela IN 188/2025; arts. 358 a 361 sem alteração); Lei-13846-2019_pente-fino-conversao-MP-871.txt (sem art. 71-D); itens anteriores da ficha (out-001 a out-004, qd-021, qd-003, acu-007, rur-013, port-011)", "sinal": "firme", "ficha": true}, {"id": "fic-028", "tema": "Salário-maternidade e outros", "pergunta": "O que é e quem tem direito ao auxílio-reclusão?", "variantes": ["regra do auxílio-reclusão", "auxílio-reclusão", "requisitos do auxílio-reclusão", "como funciona o auxílio-reclusão", "quem tem direito ao auxílio-reclusão", "benefício da família do preso", "auxílio para família de presidiário"], "resposta": "O que é: o benefício pago aos dependentes do segurado de baixa renda preso em regime fechado.\nQuem tem direito: os dependentes do segurado preso, nas mesmas classes e condições da pensão por morte.\nRequisitos: o preso precisa ter qualidade de segurado, 24 contribuições de carência (para prisão a partir de 18/01/2019; antes disso o benefício era isento de carência), ser de baixa renda e estar em regime fechado ou em prisão provisória, preventiva ou temporária. Baixa renda: média simples dos salários de contribuição dos 12 meses anteriores ao mês da prisão, de até R$ 1.980,38 em 2026, valendo o limite da portaria vigente no mês da prisão; a competência com salário de contribuição abaixo do mínimo não entra na média; sem nenhum salário de contribuição nesses 12 meses, o preso é de baixa renda; com menos de 12, a média é feita com os existentes; o mês em que recebeu benefício por incapacidade conta pelo salário de benefício, nunca abaixo de 1 salário mínimo.\nRegras obrigatórias: o preso não pode receber remuneração da empresa nem auxílio por incapacidade temporária, pensão por morte, salário-maternidade, aposentadoria ou abono de permanência em serviço; livramento condicional, regime semiaberto e regime aberto não dão direito (prisão a partir de 18/01/2019); prisão domiciliar ou monitoramento eletrônico não afastam o benefício se o regime for o fechado; equipara-se à prisão o adolescente de 16 a 18 anos internado sob custódia do Juizado da Infância e da Juventude e o segurado em medida de segurança de internação; casamento ou união estável iniciados depois da prisão não geram direito, salvo união estável provada desde antes da prisão; o filho nascido durante a prisão recebe desde o nascimento; não se concede o benefício pedido depois da soltura; para manter o benefício é obrigatório provar a permanência na prisão.\nValor: calculado como a pensão por morte e limitado a 1 salário mínimo para prisões a partir de 14/11/2019, ou seja, R$ 1.621,00 em 2026, rateado em partes iguais entre os dependentes habilitados; o segurado especial rural tem o auxílio-reclusão de 1 salário mínimo, e cumpre a carência com 24 meses de atividade rural, ainda que descontínua, imediatamente anteriores ao requerimento, em vez de contribuições.\nInício e duração: começa na data da prisão se o pedido for feito em até 180 dias dela, para filho menor de 16 anos, ou em até 90 dias, para os demais dependentes; depois desses prazos, começa na data do requerimento. Dura só enquanto o segurado estiver em regime fechado, com prova de permanência na prisão a cada 90 dias (atestado trimestral), até que o INSS (Instituto Nacional do Seguro Social) tenha acesso à base de dados do CNJ (Conselho Nacional de Justiça). Suspende: se o dependente não entrega o atestado trimestral; se o preso tem emprego ou contribui como contribuinte individual, salvo contribuição como facultativo; se o preso opta pelo salário-maternidade; nos dois últimos casos volta no dia seguinte ao fim do emprego ou do salário-maternidade. Cessa: na progressão para o semiaberto ou o aberto (prisão a partir de 18/01/2019; antes, só na progressão para o aberto); na soltura ou no livramento condicional; na fuga; se o preso passa a receber aposentadoria; na morte do preso, quando se concede a pensão por morte, facultada a opção pelo valor do auxílio-reclusão se ele contribuiu durante a prisão; na morte do beneficiário, na extinção da última cota e nas demais causas de cessação da pensão por morte. Após soltura, fuga ou progressão, o benefício não é reativado: a nova prisão ou a regressão de regime é novo fato gerador e exige novo pedido.\nDocumentos necessários: certidão judicial que ateste o recolhimento efetivo à prisão, substituível pela consulta à base de dados do CNJ quando disponível; a cada 90 dias, atestado ou declaração do estabelecimento prisional, ou certidão judicial, de que o segurado continua em regime fechado; documento de cada dependente (certidão de nascimento ou de casamento); na união estável e na dependência econômica, início de prova material de até 24 meses antes da prisão, sem bastar testemunha; CNIS (Cadastro Nacional de Informações Sociais) do preso, para a carência e a baixa renda.\nAtenção: a carência de 24 contribuições e o limite de baixa renda são as condições que mais derrubam o pedido, e o atraso além de 90 ou 180 dias faz o benefício começar só no requerimento. Na fuga, a IN (Instrução Normativa) PRES/INSS 128/2022 manda cessar o benefício e trata a recaptura como novo fato gerador, enquanto o art. 117, § 2º, do Decreto 3.048/1999, em redação original sem revogação expressa, prevê suspensão e restabelecimento desde a recaptura, mantida a qualidade de segurado. A Lei 8.213/1991 (art. 80, § 7º) diz que o trabalho remunerado do preso em regime fechado não tira o direito dos dependentes, mas a IN 128/2022 (art. 391, II) suspende o benefício quando há emprego ou contribuição como contribuinte individual.", "fonte": "Lei 8.213/1991, arts. 25, IV, 39, I, e 80, caput e §§ 1º a 8º (red. e incl. Lei 13.846/2019); Decreto 3.048/1999, arts. 116, caput e §§ 1º a 6º, 117, caput e §§ 1º a 3º, 118 e 119 (red. Decreto 10.410/2020, salvo art. 117, §§ 2º e 3º, e art. 119, redação original); IN PRES/INSS 128/2022, arts. 198, 236, 369, 381 a 392 (art. 383, §§ 2º e 7º, e art. 392, § 4º, red. IN 141/2022; art. 382, § 1º, red. IN 188/2025, republicada) e 569; Portaria Interministerial MPS/MF 13/2026, art. 5º, caput e parágrafo único", "origem": "03_TESES/legislacao/leis/Lei-8213-1991_planos-de-beneficios-previdencia.htm (última ocorrência dos arts. 25, 39 e 80); Decreto-3048-1999_regulamento-da-previdencia-social_planalto.htm (arts. 116 a 119); IN-128-2022-PRES-INSS_procedimentos-RGPS_DOU-original.txt; alteradoras conferidas pela tabela 1.b de _CONTINUIDADE/_artefatos/prev-lacunas/INSUMO_pesquisa-14_in128-alteradoras-ristf_2026-11-03.md e lidas em prev-lacunas/fontes/INSUMO_dou-in141-2022.html e INSUMO_dou-in188-2025-republ.html; prev-lacunas/fontes/INSUMO_dou-portaria-interministerial-mps-mf-n-13-de-9-de-janeiro-de-2026-680382603.html (art. 5º); item qd-023", "sinal": "firme", "ficha": true}, {"id": "fic-029", "tema": "Salário-maternidade e outros", "pergunta": "O que é e quem tem direito ao salário-família?", "variantes": ["regra do salário-família", "salário-família", "requisitos do salário-família", "como funciona o salário-família", "quem tem direito ao salário-família", "cota por filho do INSS", "valor do salário-família"], "resposta": "O que é: uma cota mensal paga por filho ao segurado de baixa renda, junto com o salário ou a aposentadoria.\nQuem tem direito: com remuneração de até R$ 1.980,38 por mês em 2026, o empregado, inclusive o doméstico, o trabalhador avulso, o aposentado por invalidez ou por idade e os demais aposentados com 65 anos ou mais (homem) ou 60 anos ou mais (mulher).\nRequisitos: filho ou equiparado (enteado, menor tutelado ou sob guarda judicial sem condições de sustento) até 14 anos, ou inválido de qualquer idade; não exige carência.\nRegras obrigatórias: a remuneração considerada é a soma dos salários de contribuição, sem 13º e sem adicional de férias; a vacinação e a frequência escolar precisam ser comprovadas todo ano.\nValor: R$ 67,54 por cota em 2026, proporcional aos dias trabalhados no mês de admissão e de demissão; não se incorpora ao salário nem ao benefício.\nInício e duração: a empresa ou o empregador doméstico paga junto com o salário e compensa nas contribuições; o avulso pode receber pelo sindicato; o aposentado recebe junto com a aposentadoria; cessa quando o filho completa 14 anos, salvo invalidez.\nDocumentos necessários: certidão de
