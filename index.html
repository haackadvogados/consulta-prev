, Etapa 3 (Híbrida)", "sinal": "controvertido"}, {"id": "rur-027", "tema": "Aposentadoria rural e híbrida", "pergunta": "Trabalhei na roça quando jovem e depois na cidade; posso usar o tempo rural na aposentadoria por idade?", "variantes": ["tempo rural remoto na híbrida", "roça muito antiga conta?", "tempo rural descontínuo"], "resposta": "Sim, na aposentadoria híbrida: o tempo rural anterior a 1991, ainda que remoto, descontínuo e sem contribuição, conta para a carência, seja qual for o trabalho que predominou ou o exercido ao completar a idade.", "fonte": "STJ Tema 1007; STF Tema 1104", "origem": "catalogo-temas-vinculantes.md §7 (STJ Tema 1007); doutrina-previdenciaria.md §6", "sinal": "firme"}, {"id": "rur-028", "tema": "Aposentadoria rural e híbrida", "pergunta": "Tempo rural depois de 1991 sem contribuição entra na híbrida?", "variantes": ["rural recente na aposentadoria híbrida", "roça depois de 91 na carência", "híbrida com tempo rural novo"], "resposta": "Pela letra da Lei 8.213 entra, mas não há tese repetitiva que confirme; é leitura do texto, sujeita a divergência.", "fonte": "Lei 8.213/1991, art. 48, § 3º", "origem": "doutrina-previdenciaria.md §6 (Híbrida; LACUNA insumo R7a c.5); variantes-e-pedidos.md §7.8", "sinal": "controvertido"}, {"id": "rur-029", "tema": "Aposentadoria rural e híbrida", "pergunta": "O tempo rural aumenta o valor da minha aposentadoria por idade?", "variantes": ["tempo de roça aumenta o percentual?", "rural sem contribuição melhora o valor?", "coeficiente da aposentadoria por idade"], "resposta": "Na regra anterior à Reforma da Previdência (direito adquirido até 13/11/2019), não: o tempo rural sem contribuição averbado não aumenta o percentual de cálculo da aposentadoria por idade (70% mais 1% por grupo de 12 contribuições). Para o cálculo posterior à Reforma (60% mais 2 pontos percentuais por ano de contribuição acima do mínimo), as fontes não tratam do ponto.", "fonte": "TNU Súm. 76; Lei 8.213/1991, art. 50; Emenda Constitucional 103/2019, art. 26, § 2º", "origem": "catalogo-temas-vinculantes.md §3 (Súm. 76/TNU); doutrina-previdenciaria.md §3 (art. 50 só como direito adquirido) e §4 (coeficiente pós-EC 103)", "sinal": "controvertido"}, {"id": "inc-001", "tema": "Auxílio por incapacidade temporária", "pergunta": "Quem tem direito ao auxílio-doença?", "variantes": ["quando posso ficar encostado pelo INSS", "tenho direito a auxílio por incapacidade", "fiquei doente e não consigo trabalhar, o INSS paga?"], "resposta": "Tem direito o segurado incapaz para o trabalho ou para a sua atividade habitual por mais de 15 dias consecutivos, com a carência cumprida quando ela for exigida. O nome atual é auxílio por incapacidade temporária; a lei ainda usa auxílio-doença. Doença ou lesão que já existia antes da filiação não gera o benefício, salvo se houve progressão ou agravamento.", "fonte": "Lei 8.213/1991, art. 59, caput e § 1º; Dec. 3.048/1999, art. 71", "origem": "doutrina-incapacidade.md §7 (Auxílio por incapacidade temporária: requisito e valor)", "sinal": "firme"}, {"id": "inc-002", "tema": "Auxílio por incapacidade temporária", "pergunta": "Quanto eu recebo de auxílio-doença?", "variantes": ["qual o valor do encostamento", "o auxílio-doença paga o salário inteiro?", "quanto paga o auxílio por incapacidade"], "resposta": "91% do salário de benefício, que é a média de 100% dos salários de contribuição desde 07/1994, atualizados. Para fato gerador desde 01/03/2015, o valor não pode passar da média simples dos 12 últimos salários de contribuição. Nunca fica acima do teto nem abaixo do salário mínimo; abaixo do mínimo só pode ficar para quem trabalha em mais de uma atividade e está incapaz para uma delas.", "fonte": "Lei 8.213/1991, arts. 29, § 10, 33 e 61; EC 103/2019, art. 26, caput", "origem": "doutrina-incapacidade.md §7 (Auxílio por incapacidade temporária: requisito e valor)", "sinal": "firme"}, {"id": "inc-003", "tema": "Auxílio por incapacidade temporária", "pergunta": "O auxílio-doença por acidente de trabalho paga mais que o comum?", "variantes": ["B91 paga mais que B31?", "auxílio acidentário tem valor maior", "encostado por acidente ganha mais"], "resposta": "Não. O B91 (auxílio por incapacidade temporária acidentário) e o B31 (auxílio por incapacidade temporária comum) pagam os mesmos 91% do salário de benefício. A diferença de valor entre comum e acidentário só aparece na aposentadoria por incapacidade permanente, que é de 100% quando acidentária.", "fonte": "Lei 8.213/1991, art. 61; Dec. 3.048/1999, art. 72; EC 103/2019, art. 26, § 3º, II", "origem": "doutrina-incapacidade.md §7 (Auxílio por incapacidade temporária: requisito e valor; Aposentadoria por incapacidade permanente)", "sinal": "firme"}, {"id": "inc-004", "tema": "Auxílio por incapacidade temporária", "pergunta": "Quem paga os primeiros 15 dias de afastamento?", "variantes": ["a empresa paga os 15 dias?", "quando o INSS começa a pagar", "primeiros quinze dias do atestado"], "resposta": "A empresa paga os 15 primeiros dias do empregado. O INSS (Instituto Nacional do Seguro Social) paga a partir do 16º dia de afastamento. Se houver novo afastamento pelo mesmo motivo dentro de 60 dias, a empresa fica desobrigada e o benefício anterior é prorrogado.", "fonte": "Lei 8.213/1991, art. 60, caput e § 3º; Dec. 3.048/1999, art. 75, §§ 3º a 5º", "origem": "doutrina-incapacidade.md §7 (Data de início, duração e cessação)", "sinal": "firme"}, {"id": "inc-005", "tema": "Auxílio por incapacidade temporária", "pergunta": "A partir de quando o auxílio-doença é pago?", "variantes": ["desde quando recebo o benefício", "autônomo recebe desde o primeiro dia?", "pedi o auxílio atrasado, perco os dias?"], "resposta": "Empregado, salvo o doméstico, recebe a partir do 16º dia do afastamento; doméstico, autônomo e demais segurados, desde a DII (data de início da incapacidade). Se o pedido for feito depois do 30º dia do afastamento, o benefício começa na DER (data de entrada do requerimento). Se a incapacidade começou depois do pedido, começa na data de início da incapacidade.", "fonte": "Lei 8.213/1991, art. 60, caput e § 1º; Dec. 3.048/1999, art. 72, I a III; IN 128/2022, art. 336", "origem": "doutrina-incapacidade.md §7 (Data de início, duração e cessação)", "sinal": "firme"}, {"id": "inc-006", "tema": "Auxílio por incapacidade temporária", "pergunta": "Trabalho em dois empregos e fiquei incapaz só para um. Recebo?", "variantes": ["tenho duas atividades, posso receber auxílio-doença de uma", "dois vínculos e encostado em um", "trabalho em dois lugares e me afastei de um"], "resposta": "Sim. O segurado com mais de uma atividade recebe o benefício pela atividade em que está incapaz, e a carência é contada só dela. Nesse caso o valor pode ficar abaixo do salário mínimo, quando somado às outras remunerações o total supera o mínimo.", "fonte": "Dec. 3.048/1999, arts. 73 e 74; IN 128/2022, art. 337", "origem": "doutrina-incapacidade.md §7 (Data de início, duração e cessação)", "sinal": "firme"}, {"id": "inc-007", "tema": "Auxílio por incapacidade temporária", "pergunta": "Preso recebe auxílio-doença?", "variantes": ["quem está na cadeia recebe encostamento", "fui preso recebendo auxílio", "recluso tem auxílio por incapacidade"], "resposta": "Não, se estiver em regime fechado. Se já recebia e foi preso, o benefício fica suspenso por até 60 dias e depois é cessado.", "fonte": "Lei 8.213/1991, art. 59, §§ 2º a 8º; Dec. 3.048/1999, art. 71, §§ 3º a 9º", "origem": "doutrina-incapacidade.md §7 (Data de início, duração e cessação)", "sinal": "firme"}, {"id": "inc-008", "tema": "Auxílio por incapacidade temporária", "pergunta": "Meu auxílio acabou e piorei. Quando posso pedir de novo?", "variantes": ["cortaram meu auxílio, posso pedir outro", "novo pedido de auxílio-doença depois da alta", "voltou a doença depois que cessou"], "resposta": "Novo requerimento só depois de 30 dias da data do exame, da DCB (data de cessação do benefício) ou da cessação administrativa. Se for a mesma espécie e a mesma causa, com início em até 60 dias da cessação, o INSS (Instituto Nacional do Seguro Social) restabelece o benefício anterior em vez de conceder um novo.", "fonte": "IN 128/2022, arts. 346 e 347", "origem": "doutrina-incapacidade.md §7 (Data de início, duração e cessação); gerente-previdenciario SKILL.md Etapa 1-B", "sinal": "firme"}, {"id": "inc-009", "tema": "Perícia, Atestmed e prorrogação", "pergunta": "Dá para conseguir auxílio-doença só mandando atestado, sem perícia?", "variantes": ["o que é Atestmed", "auxílio pelo atestado no Meu INSS", "análise documental do INSS"], "resposta": "Sim, por análise documental (Atestmed), que concede pelo exame da documentação médica ou odontológica. O benefício assim concedido dura no máximo 30 dias, e a soma dos benefícios por análise documental fica limitada a 30 dias, mesmo que não consecutivos; acima disso, exige perícia presencial ou por telemedicina. Parecer favorável em perícia presencial ou por telemedicina no requerimento imediatamente anterior reinicia esse limite.", "fonte": "Lei 8.213/1991, art. 60, §§ 11-F e 11-G (Lei 15.265/2025); Portaria Conjunta MPS/INSS 13/2026, art. 3º, alterada pela 54/2026", "origem": "doutrina-incapacidade.md §7 (Análise documental (Atestmed))", "sinal": "firme"}, {"id": "inc-010", "tema": "Perícia, Atestmed e prorrogação", "pergunta": "O Atestmed pode dar mais de 30 dias?", "variantes": ["limite de 90 dias no atestado", "quantos dias o Atestmed concede", "análise documental de 90 dias ainda vale?"], "resposta": "A lei fixa 30 dias, mas permite exceção por ato do Executivo, justificada e por prazo determinado. A Portaria Conjunta 14/2026 ampliou o limite para 90 dias por 180 dias, e a Portaria Conjunta 43/2026 prorrogou essa ampliação por 365 dias. Nenhum ato lido diz de quando contam esses 365 dias, então o termo final do limite de 90 dias está em aberto.", "fonte": "Lei 8.213/1991, art. 60, § 11-I; Portarias Conjuntas MPS/INSS 14/2026 e 43/2026", "origem": "doutrina-incapacidade.md §7 (Análise documental (Atestmed)), LACUNA ins. R24-17 c.4", "sinal": "controvertido"}, {"id": "inc-011", "tema": "Perícia, Atestmed e prorrogação", "pergunta": "O INSS negou meu pedido pelo Atestmed. E agora?", "variantes": ["indeferiram o atestado", "negaram a análise documental", "Atestmed recusado, o que fazer"], "resposta": "Cabe recurso em 30 dias da decisão. O pedido de reanálise da documentação, em 10 dias da ciência, só vale para indeferimento cientificado a partir da Portaria Conjunta 54/2026, publicada em 06/11/2026. Depois de dois indeferimentos sucessivos por análise documental, os pedidos seguintes vão para perícia presencial.", "fonte": "Portaria Conjunta MPS/INSS 13/2026, arts. 8º, 8º-A e 13, red. Portaria Conjunta 54/2026", "origem": "doutrina-incapacidade.md §7 (Análise documental (Atestmed))", "sinal": "firme"}, {"id": "inc-012", "tema": "Perícia, Atestmed e prorrogação", "pergunta": "Auxílio por acidente de trabalho sai pelo Atestmed?", "variantes": ["B91 pela análise documental", "acidentário pelo atestado", "auxílio acidentário sem perícia"], "resposta": "Só se o nexo técnico previdenciário for reconhecido pela Perícia Médica Federal. Sem esse reconhecimento, a análise documental não concede o benefício como acidentário.", "fonte": "Portaria Conjunta MPS/INSS 13/2026", "origem": "doutrina-incapacidade.md §7 (Análise documental (Atestmed))", "sinal": "firme"}, {"id": "inc-013", "tema": "Perícia, Atestmed e prorrogação", "pergunta": "O que é alta programada? O auxílio acaba sozinho?", "variantes": ["data de cessação do auxílio", "o INSS marca a data da alta", "auxílio sem prazo dura quanto"], "resposta": "Sim. O ato de concessão fixa, sempre que possível, um prazo estimado de duração, e o benefício cessa nessa data. Sem prazo fixado, cessa em 120 dias da concessão ou da reativação. Nos dois casos, cessa salvo pedido de prorrogação.", "fonte": "Lei 8.213/1991, art. 60, §§ 8º e 9º; Dec. 3.048/1999, art. 78, §§ 1º a 4º; IN 128/2022, art. 344", "origem": "doutrina-incapacidade.md §7 (Data de início, duração e cessação)", "sinal": "firme"}, {"id": "inc-014", "tema": "Perícia, Atestmed e prorrogação", "pergunta": "Como peço prorrogação do auxílio-doença?", "variantes": ["ainda não estou bom, como prorrogo", "pedido de prorrogação do encostamento", "prazo para prorrogar o benefício"], "resposta": "O pedido de prorrogação é feito nos últimos 15 dias do benefício. Feito no prazo, evita a cessação automática na data fixada ou nos 120 dias. Para benefícios sem data de cessação, a TNU (Turma Nacional de Uniformização) admite a revisão com convocação e o pedido de prorrogação com pagamento até a perícia.", "fonte": "IN 128/2022, art. 339, § 3º, red. IN 212/2026; TNU Tema 164", "origem": "doutrina-incapacidade.md §7 (Data de início, duração e cessação; Precedentes)", "sinal": "firme"}, {"id": "inc-015", "tema": "Perícia, Atestmed e prorrogação", "pergunta": "O juiz deu prazo de recuperação. Conta de quando?", "variantes": ["prazo fixado na perícia judicial", "perito disse 3 meses, conta desde quando", "DCB fixada pelo juiz"], "resposta": "O prazo de recuperação fixado na perícia conta da data do exame, com mínimo de 30 dias a partir da implantação. Sem prazo fixado, os 120 dias contam da implantação ou do restabelecimento.", "fonte": "TNU Tema 246", "origem": "doutrina-incapacidade.md §7 (Precedentes)", "sinal": "firme"}, {"id": "inc-016", "tema": "Perícia, Atestmed e prorrogação", "pergunta": "O perito disse que minha incapacidade começou no dia da perícia. Pode isso?", "variantes": ["DII na data da perícia", "perito fixou o início da doença no dia do exame", "data de início da incapacidade errada"], "resposta": "Só excepcionalmente. Para a TNU (Turma Nacional de Uniformização), fixar a DII (data de início da incapacidade) na data da perícia é excepcional e exige fundamentação.", "fonte": "TNU Tema 343", "origem": "doutrina-incapacidade.md §7 (Precedentes)", "sinal": "firme"}, {"id": "inc-017", "tema": "Perícia, Atestmed e prorrogação", "pergunta": "Sou obrigado a fazer perícia, tratamento e cirurgia para manter o benefício?", "variantes": ["o INSS pode me obrigar a operar", "se eu faltar na perícia cortam", "tenho que fazer o tratamento que o INSS mandar?"], "resposta": "Perícia, reabilitação profissional e tratamento gratuito são obrigatórios, sob pena de suspensão do benefício, mesmo que concedido na Justiça. Cirurgia e transfusão de sangue são facultativas. A recuperação que dependa de cirurgia não autoriza, por si só, a aposentadoria por incapacidade permanente.", "fonte": "Lei 8.213/1991, art. 101, I a III (Lei 14.441/2022); TNU Tema 272", "origem": "03_TESES/legislacao/leis/Lei-8213-1991 (art. 101); doutrina-incapacidade.md §7 (Precedentes)", "sinal": "firme"}, {"id": "inc-018", "tema": "Perícia, Atestmed e prorrogação", "pergunta": "O INSS pode me chamar para nova perícia mesmo aposentado por invalidez?", "variantes": ["pente-fino do INSS", "revisão do aposentado por invalidez", "convocação para perícia de revisão"], "resposta": "Sim. O aposentado por incapacidade permanente e quem recebe auxílio por incapacidade temporária, concedidos na Justiça ou no INSS (Instituto Nacional do Seguro Social), podem ser convocados a qualquer momento para reavaliação. Ficam dispensados os segurados com aids, Alzheimer, Parkinson e esclerose lateral amiotrófica, e o aposentado cuja perícia constatou incapacidade permanente, irreversível ou irrecuperável, salvo suspeita fundada de fraude ou erro.", "fonte": "Lei 8.213/1991, art. 43, §§ 4º a 6º, e art. 60, §§ 10 e 15 (Lei 15.157/2025)", "origem": "doutrina-incapacidade.md §7 (Data de início, duração e cessação); legislacao-pos-2019.md §3 (Lei 15.157/2025)", "sinal": "firme"}, {"id": "inc-019", "tema": "Perícia, Atestmed e prorrogação", "pergunta": "Aposentado por invalidez com mais de 60 anos ainda faz perícia?", "variantes": ["idoso aposentado por invalidez é chamado para perícia", "com 60 anos fico livre do pente-fino", "isenção de perícia por idade"], "resposta": "Não, se não voltou a trabalhar: o aposentado por incapacidade permanente e o pensionista inválido ficam isentos do exame depois dos 60 anos. A isenção não vale quando o exame serve para conceder o adicional de 25%, para verificar recuperação a pedido do próprio aposentado ou para subsidiar curatela.", "fonte": "Lei 8.213/1991, art. 101, §§ 1º, II, e 2º", "origem": "03_TESES/legislacao/leis/Lei-8213-1991 (art. 101)", "sinal": "firme"}, {"id": "inc-020", "tema": "Perícia, Atestmed e prorrogação", "pergunta": "Dá para recorrer da perícia do INSS administrativamente?", "variantes": ["recurso contra perícia negada", "recorrer à Junta de Recursos", "perícia disse que estou apto, como recorro"], "resposta": "Sim. O recurso ordinário à Junta de Recursos é feito em 30 dias da ciência da decisão, em prazo contínuo. Matéria exclusivamente médica (incapacidade, auxílio-acidente, data de início da doença e da incapacidade, data de cessação) é de alçada exclusiva da Junta e não sobe à Câmara de Julgamento. Entrar com ação com o mesmo pedido importa renúncia ao recurso administrativo.", "fonte": "Dec. 3.048/1999, arts. 305, § 1º, e 307; IN 128/2022, art. 580; Regimento Interno do CRPS, arts. 78 e 89, § 3º; Lei 8.213/1991, art. 126, § 3º", "origem": "competencia-e-rito.md §9; gerente-previdenciario SKILL.md Etapa 1-B", "sinal": "firme"}, {"id": "inc-021", "tema": "Perícia, Atestmed e prorrogação", "pergunta": "O INSS está demorando para analisar meu auxílio. Tem prazo?", "variantes": ["perícia não marca", "INSS não responde o pedido de auxílio", "demora na análise do benefício"], "resposta": "O parâmetro é o acordo homologado no RE (recurso extraordinário) 1.171.152: 45 dias para incapacidade temporária e permanente e 60 dias para auxílio-acidente, contados do fim da instrução, e perícia em até 45 dias do agendamento (90 nas unidades de difícil provimento). A via contra a demora é o mandado de segurança, em 120 dias. A vigência atual do acordo, firmado por 24 meses desde 10/06/2021, não foi confirmada.", "fonte": "Acordo no RE 1.171.152 (Tema 1.066/STF, cancelado sem tese); Lei 12.016/2009, art. 23", "origem": "competencia-e-rito.md §9 (Mora do INSS e LACUNAS da via administrativa)", "sinal": "controvertido"}, {"id": "inc-022", "tema": "Aposentadoria por incapacidade permanente", "pergunta": "Quem tem direito à aposentadoria por invalidez?", "variantes": ["como me aposento por invalidez", "aposentadoria por incapacidade permanente, quem pode", "não tenho mais condição de trabalhar em nada"], "resposta": "Tem direito o segurado incapaz para o trabalho e insuscetível de reabilitação para atividade que lhe garanta a subsistência, recebendo ou não auxílio por incapacidade temporária antes. O nome atual é aposentadoria por incapacidade permanente; a lei ainda diz aposentadoria por invalidez. Exige carência de 12 contribuições, salvo as isenções.", "fonte": "Lei 8.213/1991, arts. 25, I, e 42; Dec. 3.048/1999, art. 43", "origem": "doutrina-incapacidade.md §7 (Aposentadoria por incapacidade permanente; Carência e isenção)", "sinal": "firme"}, {"id": "inc-023", "tema": "Aposentadoria por incapacidade permanente", "pergunta": "Quanto paga a aposentadoria por invalidez hoje?", "variantes": ["aposentadoria por invalidez paga 100%?", "valor da aposentadoria por incapacidade depois da reforma", "por que minha aposentadoria por invalidez veio baixa"], "resposta": "Para fato gerador desde 14/11/2019: 60% do salário de benefício mais 2 pontos percentuais por ano de contribuição acima de 20 anos (homem) ou 15 anos (mulher). Se decorrer de acidente do trabalho, doença profissional ou do trabalho, é 100%. Fato gerador até 13/11/2019 garante 100%, pelo direito adquirido.", "fonte": "EC 103/2019, art. 26, §§ 2º, III, 3º, II, e 5º; Lei 8.213/1991, art. 44; Dec. 3.048/1999, art. 44", "origem": "doutrina-incapacidade.md §7 (Aposentadoria por incapacidade permanente)", "sinal": "firme"}, {"id": "inc-024", "tema": "Aposentadoria por incapacidade permanente", "pergunta": "Dá para pedir na Justiça os 100% da aposentadoria por invalidez comum, dizendo que a reforma é inconstitucional?", "variantes": ["revisão da aposentadoria por invalidez para 100%", "os 60% da invalidez são inconstitucionais?", "Tema 1.300 do STF"], "resposta": "Não. O STF (Supremo Tribunal Federal) decidiu no Tema 1.300, com trânsito em julgado em 18/04/2026, que é constitucional o cálculo de 60% mais 2 pontos percentuais da aposentadoria por incapacidade permanente não acidentária quando a incapacidade é constatada depois da reforma. Os 100% só cabem na aposentadoria acidentária ou com fato gerador até 13/11/2019.", "fonte": "STF Tema 1.300 (RE 1.469.150), ADVERSO", "origem": "doutrina-incapacidade.md §7 (bloco ADVERSO: STF Tema 1.300); catalogo-temas-vinculantes-2.md §1", "sinal": "firme"}, {"id": "inc-025", "tema": "Aposentadoria por incapacidade permanente", "pergunta": "Fiquei incapaz antes da reforma, mas a perícia foi depois. Qual regra vale?", "variantes": ["doença começou antes de 13/11/2019 e perícia depois", "invalidez antes da reforma, direito a 100%?", "data que conta para a regra da aposentadoria por invalidez"], "resposta": "Está em aberto. A tese do STF (Supremo Tribunal Federal) no Tema 1.300 fala em incapacidade constatada depois da reforma, e a IN (Instrução Normativa) 128/2022 fala em fato gerador a partir de 14/11/2019. Se o marco é a DII (data de início da incapacidade) ou a data da perícia depende do acórdão, que não foi lido.", "fonte": "STF Tema 1.300; IN 128/2022, art. 233, II", "origem": "doutrina-incapacidade.md §7 (Aposentadoria por incapacidade permanente), LACUNA ins. R24-17 c.12", "sinal": "controvertido"}, {"id": "inc-026", "tema": "Aposentadoria por incapacidade permanente", "pergunta": "Estou no auxílio-doença e vão me aposentar por invalidez. Muda o valor?", "variantes": ["transformação do auxílio em aposentadoria", "conversão do auxílio-doença em aposentadoria por invalidez", "o auxílio vira aposentadoria, qual o valor"], "resposta": "Sim. Com fato gerador até 13/11/2019, a aposentadoria é 100% do salário de benefício do auxílio, reajustado; desde 14/11/2019, 60% mais 2 pontos percentuais, ou 100% se acidentária. Na transformação direta, o tempo em auxílio não entra como salário de contribuição na média (STF, Supremo Tribunal Federal, Tema 88). Não está definido se o salário de benefício, desde 14/11/2019, é o do auxílio reajustado ou uma nova média.", "fonte": "IN 128/2022, art. 233, § 1º, I a III; STF Tema 88", "origem": "doutrina-incapacidade.md §7 (Transformação e período em benefício no PBC), LACUNA ins. R24-17 c.2", "sinal": "controvertido"}, {"id": "inc-027", "tema": "Aposentadoria por incapacidade permanente", "pergunta": "Desde quando começa a aposentadoria por invalidez?", "variantes": ["data de início da aposentadoria por invalidez", "a aposentadoria retroage?", "quando passo a receber como aposentado"], "resposta": "Se veio depois do auxílio por incapacidade temporária, no dia seguinte à cessação dele; a IN (Instrução Normativa) 128/2022 fixa a data da perícia, e as datas podem divergir. Sem auxílio anterior, segue a regra do auxílio: empregado no 16º dia, demais na DII (data de início da incapacidade), e na DER (data de entrada do requerimento) quando pedida depois de 30 dias. Sem pedido no INSS (Instituto Nacional do Seguro Social), a concedida na Justiça começa na citação.", "fonte": "Lei 8.213/1991, art. 43; Dec. 3.048/1999, art. 44, § 1º; IN 128/2022, arts. 326, § 6º, e 327; STJ Súm. 576", "origem": "doutrina-incapacidade.md §7 (Data de início da aposentadoria)", "sinal": "firme"}, {"id": "inc-028", "tema": "Aposentadoria por incapacidade permanente", "pergunta": "O que é o acréscimo de 25% na aposentadoria?", "variantes": ["adicional de grande invalidez", "preciso de cuidador, ganho mais?", "25% para quem depende de outra pessoa"], "resposta": "É o adicional de 25% pago ao aposentado por incapacidade permanente que precisa da assistência permanente de outra pessoa. É devido ainda que ultrapasse o teto, é recalculado nos reajustes, cessa com a morte e não passa para a pensão.", "fonte": "Lei 8.213/1991, art. 45; Dec. 3.048/1999, art. 45 e Anexo I", "origem": "doutrina-incapacidade.md §7 (Adicional, mensalidade de recuperação e retorno)", "sinal": "firme"}, {"id": "inc-029", "tema": "Aposentadoria por incapacidade permanente", "pergunta": "Aposentado por idade ou por tempo que precisa de cuidador tem os 25%?", "variantes": ["adicional de 25% em outra aposentadoria", "extensão do acréscimo de 25%", "minha mãe aposentada por idade precisa de ajuda, ganha 25%?"], "resposta": "Não. O STF (Supremo Tribunal Federal) decidiu no Tema 1.095 que o adicional de 25% não se estende às demais espécies de aposentadoria; é só da aposentadoria por incapacidade permanente.", "fonte": "STF Tema 1.095 (RE 1.221.446), ADVERSO", "origem": "doutrina-incapacidade.md §7 (bloco ADVERSO: STF Tema 1.095)", "sinal": "firme"}, {"id": "inc-030", "tema": "Aposentadoria por incapacidade permanente", "pergunta": "Se eu melhorar, perco a aposentadoria por invalidez de uma vez?", "variantes": ["recuperei, o que acontece com a aposentadoria", "mensalidade de recuperação", "aposentadoria por invalidez é para sempre?"], "resposta": "Depende do caso previsto em lei. Recuperação total em até 5 anos de benefício cessa a aposentadoria de imediato para o empregado com direito a voltar à função, e para os demais após tantos meses quantos forem os anos de benefício. Recuperação parcial, ou depois de 5 anos, dá 6 meses de renda integral, 6 com redução de 50% e 6 com redução de 75%.", "fonte": "Lei 8.213/1991, art. 47; Dec. 3.048/1999, art. 49; IN 128/2022, art. 333", "origem": "doutrina-incapacidade.md §7 (Adicional, mensalidade de recuperação e retorno)", "sinal": "firme"}, {"id": "inc-031", "tema": "Aposentadoria por incapacidade permanente", "pergunta": "Aposentado por invalidez pode voltar a trabalhar?", "variantes": ["posso fazer um bico aposentado por invalidez", "trabalhar e receber aposentadoria por incapacidade", "voltei a trabalhar, perco a aposentadoria?"], "resposta": "Não sem perder o benefício. O retorno voluntário à atividade cancela a aposentadoria por incapacidade permanente desde a data do retorno.", "fonte": "Lei 8.213/1991, art. 46; Dec. 3.048/1999, art. 48", "origem": "doutrina-incapacidade.md §7 (Adicional, mensalidade de recuperação e retorno)", "sinal": "firme"}, {"id": "inc-032", "tema": "Aposentadoria por incapacidade permanente", "pergunta": "Minha incapacidade é parcial e permanente. Me aposento?", "variantes": ["incapacidade parcial dá aposentadoria", "posso fazer outro serviço, tenho direito a invalidez?", "perito disse incapacidade parcial definitiva"], "resposta": "Em regra, não: para a TNU (Turma Nacional de Uniformização), incapacidade parcial e permanente leva à análise de reabilitação profissional, não à aposentadoria. A exceção é a doença estigmatizante, em que cabe aposentadoria por incapacidade parcial e permanente após análise das condições pessoais.", "fonte": "TNU Temas 177 e 274", "origem": "doutrina-incapacidade.md §7 (Precedentes)", "sinal": "firme"}, {"id": "inc-033", "tema": "Auxílio-acidente", "pergunta": "O que é o auxílio-acidente?", "variantes": ["fiquei com sequela, tenho direito a algum benefício", "auxílio-acidente é a mesma coisa que auxílio-doença?", "indenização do INSS por sequela"], "resposta": "É uma indenização mensal ao segurado que, depois da consolidação das lesões de acidente de qualquer natureza, ficou com sequela que reduz a capacidade para o trabalho que habitualmente exercia. Não depende de estar incapaz, e o rol de sequelas do Anexo III do Regulamento é só exemplificativo.", "fonte": "Lei 8.213/1991, art. 86, caput; Dec. 3.048/1999, art. 104; IN 128/2022, art. 354, § 1º", "origem": "doutrina-incapacidade.md §8 (Fato gerador)", "sinal": "firme"}, {"id": "inc-034", "tema": "Auxílio-acidente", "pergunta": "Autônomo tem direito a auxílio-acidente?", "variantes": ["MEI recebe auxílio-acidente", "contribuinte individual e auxílio-acidente", "quem paga como facultativo tem auxílio-acidente"], "resposta": "Não. Têm direito o empregado, o doméstico com fato gerador desde 02/06/2015, o avulso e o segurado especial. O contribuinte individual (autônomo) e o facultativo ficam fora, por exclusão expressa da lei.", "fonte": "Lei 8.213/1991, art. 18, § 1º; IN 128/2022, art. 352, §§ 4º e 9º; TNU Tema 201, ADVERSO", "origem": "doutrina-incapacidade.md §8 (Segurados)", "sinal": "firme"}, {"id": "inc-035", "tema": "Auxílio-acidente", "pergunta": "Quanto paga o auxílio-acidente?", "variantes": ["valor do auxílio-acidente", "auxílio-acidente é meio salário?", "o auxílio-acidente pode ser menor que o mínimo"], "resposta": "50% do salário de benefício do auxílio por incapacidade temporária que o originou, corrigido; sem auxílio anterior, 50% do salário de benefício do auxílio a que teria direito. Pode ficar abaixo do salário mínimo. Não está definido se a correção da base é mensal ou só pelos reajustes anuais.", "fonte": "Lei 8.213/1991, art. 86, § 1º; Dec. 3.048/1999, arts. 42, par. único, e 104, § 1º; IN 128/2022, art. 233, X e § 3º", "origem": "doutrina-incapacidade.md §8 (Valor), LACUNA ins. R24-17 c.1", "sinal": "controvertido"}, {"id": "inc-036", "tema": "Auxílio-acidente", "pergunta": "Auxílio-acidente precisa de carência?", "variantes": ["quantas contribuições para o auxílio-acidente", "comecei a trabalhar agora e me acidentei", "auxílio-acidente sem tempo de contribuição"], "resposta": "Não. O auxílio-acidente independe de carência.", "fonte": "Lei 8.213/1991, art. 26, I; Dec. 3.048/1999, art. 30, I", "origem": "doutrina-incapacidade.md §8 (Carência)", "sinal": "firme"}, {"id": "inc-037", "tema": "Auxílio-acidente", "pergunta": "Posso trabalhar recebendo auxílio-acidente?", "variantes": ["voltei a trabalhar, perco o auxílio-acidente?", "auxílio-acidente com salário", "recebo auxílio-acidente e estou empregado"], "resposta": "Sim. O auxílio-acidente é devido a partir do dia seguinte à cessação do auxílio por incapacidade temporária, independentemente de qualquer remuneração ou rendimento do segurado.", "fonte": "Lei 8.213/1991, art. 86, § 2º; Dec. 3.048/1999, art. 104, § 2º", "origem": "doutrina-incapacidade.md §8 (Termo inicial)", "sinal": "firme"}, {"id": "inc-038", "tema": "Auxílio-acidente", "pergunta": "Desde quando o auxílio-acidente é pago?", "variantes": ["o auxílio-acidente retroage", "nunca pedi o auxílio-acidente, posso receber atrasado", "precisa pedir o auxílio-acidente separado?"], "resposta": "No dia seguinte à cessação do auxílio por incapacidade temporária; sem auxílio anterior, na DER (data de entrada do requerimento). Os atrasados respeitam a prescrição de 5 anos. A TNU (Turma Nacional de Uniformização) dispensa pedido de prorrogação e pedido específico do auxílio-acidente.", "fonte": "Lei 8.213/1991, art. 86, § 2º; STJ Tema 862; TNU Tema 315", "origem": "doutrina-incapacidade.md §8 (Termo inicial)", "sinal": "firme"}, {"id": "inc-039", "tema": "Auxílio-acidente", "pergunta": "Minha sequela é pequena. Tenho direito ao auxílio-acidente?", "variantes": ["lesão leve dá auxílio-acidente", "perdi pouco movimento do dedo", "sequela mínima e auxílio-acidente"], "resposta": "Sim, se houver redução da capacidade para o trabalho habitual: o grau da lesão não interfere, ainda que mínima, e é irrelevante que a doença possa reverter. Não há direito se a sequela não reduz a capacidade habitual nem exige maior esforço na atividade.", "fonte": "STJ Temas 416 e 156; TNU Súm. 88 (FAVORÁVEIS); TNU Súm. 89 (ADVERSA)", "origem": "doutrina-incapacidade.md §8 (Grau e reversibilidade)", "sinal": "firme"}, {"id": "inc-040", "tema": "Auxílio-acidente", "pergunta": "O auxílio-acidente é para a vida toda?", "variantes": ["até quando recebo auxílio-acidente", "auxílio-acidente acaba quando eu me aposentar?", "quando corta o auxílio-acidente"], "resposta": "Não. Cessa na véspera de qualquer aposentadoria, na emissão de CTC (certidão de tempo de contribuição) ou no óbito. É restabelecido se a aposentadoria por incapacidade permanente for cessada ou se o segurado desistir da aposentadoria, e fica suspenso enquanto o auxílio por incapacidade temporária pelo mesmo acidente estiver reaberto.", "fonte": "Lei 8.213/1991, art. 86, §§ 1º a 3º; Dec. 3.048/1999, art. 104, §§ 1º a 3º e 6º; IN 128/2022, arts. 355 e 356", "origem": "doutrina-incapacidade.md §8 (Cessação e restabelecimento)", "sinal": "firme"}, {"id": "inc-041", "tema": "Auxílio-acidente", "pergunta": "Posso receber auxílio-acidente junto com a aposentadoria?", "variantes": ["acumular auxílio-acidente e aposentadoria", "me aposentei e cortaram o auxílio-acidente", "auxílio-acidente continua depois de aposentar?"], "resposta": "Só se a lesão e a aposentadoria forem anteriores a 11/11/1997. Fora disso, a acumulação é vedada e o auxílio-acidente cessa na véspera da aposentadoria. Em compensação, o valor mensal do auxílio-acidente entra no salário de contribuição da aposentadoria, limitado ao teto.", "fonte": "STJ Súm. 507 e TNU Tema 85 (ADVERSOS); Lei 8.213/1991, arts. 31 e 86", "origem": "doutrina-incapacidade.md §8 (bloco ADVERSO: acumulação com aposentadoria; Reflexo na aposentadoria)", "sinal": "firme"}, {"id": "inc-042", "tema": "Auxílio-acidente", "pergunta": "Posso ter dois auxílios-acidente?", "variantes": ["dois acidentes, dois auxílios", "segundo auxílio-acidente", "acumular auxílio-acidente"], "resposta": "Não. A lei veda o recebimento de mais de um auxílio-acidente, salvo direito adquirido.", "fonte": "Lei 8.213/1991, art. 124, V", "origem": "doutrina-incapacidade.md §7 (Trabalho durante a incapacidade e compensação); 03_TESES/legislacao/leis/Lei-8213-1991 (art. 124)", "sinal": "firme"}, {"id": "inc-043", "tema": "Auxílio-acidente", "pergunta": "Recebendo auxílio-acidente eu continuo segurado do INSS?", "variantes": ["auxílio-acidente mantém a qualidade de segurado", "parei de contribuir e recebo auxílio-acidente", "perco a qualidade de segurado com auxílio-acidente?"], "resposta": "Não por tempo ilimitado. Quem está em gozo de benefício mantém a qualidade de segurado sem limite de prazo, mas a lei exclui expressamente o auxílio-acidente dessa regra.", "fonte": "Lei 8.213/1991, art. 15, I", "origem": "doutrina-incapacidade.md §8 (Cessação e restabelecimento); doutrina-previdenciaria.md §6 (Período de graça)", "sinal": "firme"}, {"id": "inc-044", "tema": "Auxílio-acidente", "pergunta": "Como peço o auxílio-acidente no INSS?", "variantes": ["requerimento de auxílio-acidente", "auxílio-acidente tem perícia?", "documentos para o auxílio-acidente"], "resposta": "Desde 24/03/2026 o requerimento passa obrigatoriamente por análise documental prévia, que não substitui o exame presencial da sequela e da redução da capacidade. Faltando documento essencial, o pedido é indeferido sem perícia.", "fonte": "Portaria Conjunta MPS/INSS 15/2026, arts. 1º, § 3º, 3º, par. único, e 4º, II", "origem": "doutrina-incapacidade.md §8 (Análise documental prévia)", "sinal": "firme"}, {"id": "inc-045", "tema": "Acidente do trabalho (B91)", "pergunta": "Qual a diferença entre auxílio-doença comum e acidentário?", "variantes": ["B31 ou B91, faz diferença?", "vale a pena brigar para ser acidentário", "benefício acidentário tem vantagem?"], "resposta": "O valor do auxílio é igual (91%), mas o B91 (auxílio por incapacidade temporária acidentário) traz efeitos que o B31 (comum) não tem: isenção de carência em todos os casos, aposentadoria por incapacidade permanente de 100%, estabilidade de 12 meses no emprego após a cessação, depósito do FGTS (Fundo de Garantia do Tempo de Serviço) durante o afastamento e ação na Justiça Estadual. É acidentário o que decorre de acidente do trabalho, doença profissional ou do trabalho.", "fonte": "Lei 8.213/1991, arts. 26, II, 61 e 118; EC 103/2019, art. 26, § 3º, II; Lei 8.036/1990, art. 15, § 5º; CF, art. 109, I", "origem": "doutrina-incapacidade.md §7; competencia-e-rito.md §5; 03_TESES/legislacao/leis (Lei 8.213, art. 118; Lei 8.036, art. 15)", "sinal": "firme"}, {"id": "inc-046", "tema": "Acidente do trabalho (B91)", "pergunta": "O que conta como acidente de trabalho?", "variantes": ["me machuquei no serviço, é acidente de trabalho?", "conceito de acidente do trabalho", "acidente na empresa"], "resposta": "É o que ocorre pelo exercício do trabalho a serviço de empresa ou de empregador doméstico, ou do segurado especial, e causa lesão corporal ou perturbação funcional que leve à morte ou à perda ou redução, permanente ou temporária, da capacidade para o trabalho. Também contam a doença profissional, a doença do trabalho e as situações equiparadas por lei.", "fonte": "Lei 8.213/1991, arts. 19, 20 e 21", "origem": "03_TESES/legislacao/leis/Lei-8213-1991 (arts. 19 a 21)", "sinal": "firme"}, {"id": "inc-047", "tema": "Acidente do trabalho (B91)", "pergunta": "Doença causada pelo trabalho é acidente de trabalho?", "variantes": ["LER, coluna, depressão pelo serviço é acidentário?", "doença ocupacional", "peguei doença no trabalho"], "resposta": "Sim. Doença profissional (produzida pelo trabalho peculiar a certa atividade) e doença do trabalho (adquirida pelas condições em que o trabalho é feito) equiparam-se a acidente do trabalho. Não contam a doença degenerativa, a inerente ao grupo etário, a que não incapacita e a endêmica da região, salvo exposição pela natureza do trabalho. Doença fora da relação oficial é acidentária se resultou das condições especiais do trabalho e com ele se relaciona diretamente.", "fonte": "Lei 8.213/1991, art. 20, I e II, §§ 1º e 2º", "origem": "03_TESES/legislacao/leis/Lei-8213-1991 (art. 20)", "sinal": "firme"}, {"id": "inc-048", "tema": "Acidente do trabalho (B91)", "pergunta": "Acidente no caminho para o trabalho é acidente de trabalho?", "variantes": ["acidente de trajeto", "bati a moto indo para o serviço", "acidente voltando do trabalho"], "resposta": "Sim. Equipara-se a acidente do trabalho o sofrido no percurso da residência para o trabalho ou deste para aquela, qualquer que seja o meio de locomoção, inclusive veículo próprio. A MP (medida provisória) 905/2019 chegou a revogar essa regra, mas perdeu a vigência, e o texto vigente da lei mantém o trajeto.", "fonte": "Lei 8.213/1991, art. 21, IV, d", "origem": "03_TESES/legislacao/leis/Lei-8213-1991 (art. 21, IV, d, última ocorrência); legislacao-pos-2019.md §3 (MP 905/2019)", "sinal": "firme"}, {"id": "inc-049", "tema": "Acidente do trabalho (B91)", "pergunta": "Fui agredido no serviço. É acidente de trabalho?", "variantes": ["assalto no trabalho", "acidente no horário de almoço", "viagem a serviço e acidente"], "resposta": "Sim. Equipara-se a acidente do trabalho o sofrido no local e horário de trabalho por agressão, sabotagem ou terrorismo de terceiro ou colega, ofensa física por disputa ligada ao trabalho, imprudência de terceiro, desabamento ou incêndio. Também o ocorrido fora do local e horário em ordem da empresa ou em viagem a serviço, e nos intervalos de refeição ou descanso no local do trabalho.", "fonte": "Lei 8.213/1991, art. 21, II, IV e § 1º", "origem": "03_TESES/legislacao/leis/Lei-8213-1991 (art. 21)", "sinal": "firme"}, {"id": "inc-050", "tema": "Acidente do trabalho (B91)", "pergunta": "A empresa não quis emitir a CAT. O que faço?", "variantes": ["empresa se recusa a fazer a CAT", "quem pode abrir a CAT", "prazo da comunicação de acidente"], "resposta": "A empresa deve emitir a CAT (comunicação de acidente do trabalho) até o primeiro dia útil seguinte ao acidente e, em caso de morte, de imediato, sob pena de multa. Se não emitir, podem fazê-lo o próprio acidentado, seus dependentes, o sindicato, o médico que o atendeu ou qualquer autoridade pública, sem esse prazo. A emissão por terceiro não livra a empresa da multa.", "fonte": "Lei 8.213/1991, art. 22, caput e §§ 2º e 3º", "origem": "03_TESES/legislacao/leis/Lei-8213-1991 (art. 22)", "sinal": "firme"}, {"id": "inc-051", "tema": "Acidente do trabalho (B91)", "pergunta": "Sem CAT o INSS pode reconhecer que minha doença é do trabalho?", "variantes": ["o que é NTEP", "nexo técnico epidemiológico", "INSS reconhece acidentário sem CAT"], "resposta": "Sim. A perícia do INSS (Instituto Nacional do Seguro Social) caracteriza a natureza acidentária quando constata o nexo técnico epidemiológico entre a atividade da empresa e a doença pela CID (Classificação Internacional de Doenças). A empresa pode pedir a não aplicação desse nexo, com recurso de efeito suspensivo ao Conselho de Recursos da Previdência Social, e o segurado também pode recorrer.", "fonte": "Lei 8.213/1991, art. 21-A, caput e §§ 1º e 2º", "origem": "03_TESES/legislacao/leis/Lei-8213-1991 (art. 21-A)", "sinal": "firme"}, {"id": "inc-052", "tema": "Acidente do trabalho (B91)", "pergunta": "Na doença do trabalho, qual é a data do acidente?", "variantes": ["data do acidente em doença ocupacional", "quando começa a contar a doença do trabalho", "dia do acidente na LER"], "resposta": "É a data do início da incapacidade para a atividade habitual, o dia da segregação compulsória ou o dia do diagnóstico, valendo o que ocorrer primeiro.", "fonte": "Lei 8.213/1991, art. 23", "origem": "03_TESES/legislacao/leis/Lei-8213-1991 (art. 23)", "sinal": "firme"}, {"id": "inc-053", "tema": "Acidente do trabalho (B91)", "pergunta": "Depois do auxílio por acidente de trabalho tenho estabilidade?", "variantes": ["estabilidade acidentária", "a empresa pode me demitir quando eu voltar do INSS", "12 meses de estabilidade"], "resposta": "Sim. O segurado que sofreu acidente do trabalho tem garantida a manutenção do contrato na empresa por no mínimo 12 meses depois da cessação do auxílio-doença acidentário, independentemente de receber auxílio-acidente.", "fonte": "Lei 8.213/1991, art. 118", "origem": "03_TESES/legislacao/leis/Lei-8213-1991 (art. 118)", "sinal": "firme"}, {"id": "inc-054", "tema": "Acidente do trabalho (B91)", "pergunta": "A empresa tem que depositar o FGTS enquanto estou afastado?", "variantes": ["FGTS durante o auxílio-doença", "afastado pelo INSS tem FGTS?", "depósito do fundo de garantia no afastamento"], "resposta": "Sim, na licença por acidente do trabalho o depósito do FGTS (Fundo de Garantia do Tempo de Serviço) é obrigatório. A fonte lida não prevê a mesma obrigação para o afastamento por doença comum.", "fonte": "Lei 8.036/1990, art. 15, § 5º", "origem": "03_TESES/legislacao/leis/Lei-8036-1990_FGTS.pdf (art. 15, § 5º)", "sinal": "firme"}, {"id": "inc-055", "tema": "Acidente do trabalho (B91)", "pergunta": "Afastado pelo INSS, como fico na empresa?", "variantes": ["contrato fica suspenso no auxílio-doença", "sou demitido estando encostado?", "situação do empregado afastado"], "resposta": "O empregado, inclusive o doméstico, em gozo de auxílio por incapacidade temporária é considerado pela empresa como licenciado.", "fonte": "Lei 8.213/1991, art. 63", "origem": "03_TESES/legislacao/leis/Lei-8213-1991 (art. 63)", "sinal": "firme"}, {"id": "inc-056", "tema": "Carência e qualidade de segurado", "pergunta": "Quantas contribuições preciso para o auxílio-doença?", "variantes": ["carência do auxílio-doença", "comecei a pagar agora, posso pedir auxílio?", "12 contribuições"], "resposta": "12 contribuições mensais, tanto para o auxílio por incapacidade temporária quanto para a aposentadoria por incapacidade permanente, salvo os casos isentos de carência.", "fonte": "Lei 8.213/1991, art. 25, I; Dec. 3.048/1999, art. 29, I", "origem": "doutrina-incapacidade.md §7 (Carência e isenção); doutrina-previdenciaria.md §6", "sinal": "firme"}, {"id": "inc-057", "tema": "Carência e qualidade de segurado", "pergunta": "Quando não precisa de carência para o auxílio-doença?", "variantes": ["doença grave dispensa carência", "acidente dispensa as 12 contribuições", "isenção de carência"], "resposta": "Não precisa nos casos de acidente de qualquer natureza, doença profissional ou do trabalho e doenças da lista interministerial iniciadas depois da filiação. A lista vigente é a da Portaria Interministerial MTP/MS (Ministério do Trabalho e Previdência e Ministério da Saúde) 22/2022, com o inciso XVIII, gestação de alto risco, incluído pela Portaria Interministerial MPS/MS (Ministério da Previdência Social e Ministério da Saúde) 15/2026. Acidente vascular encefálico agudo e abdome agudo cirúrgico só isentam com evolução aguda e critério de gravidade.", "fonte": "Lei 8.213/1991, art. 26, II; PIM MTP/MS 22/2022; PIM MPS/MS 15/2026", "origem": "doutrina-incapacidade.md §7 (Carência e isenção)", "sinal": "firme"}, {"id": "inc-058", "tema": "Carência e qualidade de segurado", "pergunta": "Caí em casa e quebrei a perna. Fico isento de carência?", "variantes": ["acidente fora do trabalho dispensa carência", "acidente de qualquer natureza", "acidente doméstico e auxílio-doença"], "resposta": "Pelo regulamento, sim: acidente de qualquer natureza é o evento de origem traumática ou por agente externo, e isenta de carência mesmo fora do trabalho. A TNU (Turma Nacional de Uniformização) restringe o conceito ao evento súbito e traumático (Tema 269, adverso), o que deixa de fora quadros que não sejam desse tipo.", "fonte": "Lei 8.213/1991, art. 26, II; Dec. 3.048/1999, art. 30, § 1º; TNU Tema 269", "origem": "doutrina-incapacidade.md §7 (Carência e isenção)", "sinal": "controvertido"}, {"id": "inc-059", "tema": "Carência e qualidade de segurado", "pergunta": "Fiquei anos sem pagar e voltei a contribuir. Quantas parcelas preciso?", "variantes": ["perdi a qualidade de segurado e voltei a pagar", "recuperar a carência", "quanto tempo depois de voltar a contribuir posso pedir auxílio"], "resposta": "Depois da perda da qualidade de segurado, é preciso cumprir metade da carência, ou seja, 6 contribuições, a contar da nova filiação, para o auxílio por incapacidade temporária e a aposentadoria por incapacidade permanente.", "fonte": "Lei 8.213/1991, art. 27-A", "origem": "doutrina-incapacidade.md §7 (Carência e isenção)", "sinal": "firme"}, {"id": "inc-060", "tema": "Carência e qualidade de segurado", "pergunta": "Já tinha a doença quando comecei a pagar o INSS. Tenho direito?", "variantes": ["doença preexistente", "comecei a contribuir já doente", "o INSS negou porque a doença é anterior"], "resposta": "Não, se a doença ou lesão já existia antes da filiação. A exceção é a incapacidade que surge por progressão ou agravamento dessa doença depois da filiação.", "fonte": "Lei 8.213/1991, art. 59, § 1º (red. Lei 13.846/2019)", "origem": "doutrina-incapacidade.md §7 (Auxílio por incapacidade temporária: requisito e valor)", "sinal": "firme"}, {"id": "inc-061", "tema": "Carência e qualidade de segurado", "pergunta": "Parei de trabalhar. Por quanto tempo ainda tenho direito ao auxílio-doença?", "variantes": ["período de graça", "desempregado tem auxílio-doença?", "quanto tempo fico segurado sem pagar"], "resposta": "Mantém a qualidade de segurado por 12 meses depois de cessar as contribuições, 24 meses com mais de 120 contribuições sem perda da qualidade, mais 12 meses se o desemprego estiver registrado, e 6 meses para o facultativo. Em gozo de benefício, mantém sem limite, exceto no auxílio-acidente. A perda ocorre no dia seguinte ao vencimento da contribuição do mês posterior ao fim desse prazo.", "fonte": "Lei 8.213/1991, art. 15, I, II e §§ 1º, 2º e 4º", "origem": "doutrina-previdenciaria.md §6 (Período de graça)", "sinal": "firme"}, {"id": "inc-062", "tema": "Carência e qualidade de segurado", "pergunta": "O tempo que fiquei no auxílio-doença conta para aposentadoria?", "variantes": ["tempo encostado conta para aposentar", "período em benefício conta como contribuição", "auxílio-doença conta tempo de serviço"], "resposta": "Conta quando intercalado com períodos de atividade ou contribuição. Pela TNU (Turma Nacional de Uniformização), o benefício não decorrente de acidente do trabalho só conta como tempo de contribuição ou carência se intercalado entre períodos com recolhimento. Intercalado, entra na média com o salário de benefício reajustado como salário de contribuição.", "fonte": "Lei 8.213/1991, arts. 29, § 5º, e 55, II; TNU Súm. 73; STF Tema 88", "origem": "doutrina-incapacidade.md §7 (Transformação e período em benefício no PBC); catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "inc-063", "tema": "Carência e qualidade de segurado", "pergunta": "Trabalhava em atividade especial e fiquei afastado. O tempo de afastamento conta como especial?", "variantes": ["auxílio-doença conta como tempo especial", "afastamento de quem trabalhava com insalubridade", "tempo especial durante o benefício"], "resposta": "Na Justiça, sim: o período em auxílio-doença, acidentário ou previdenciário, conta como especial para quem exercia atividade especial (STJ, Superior Tribunal de Justiça, Tema 998; TNU, Turma Nacional de Uniformização, Tema 165). Na via administrativa, o INSS (Instituto Nacional do Seguro Social) não conta como especial o afastamento por incapacidade a partir de 01/07/2020, e não há tese lida sobre esse período.", "fonte": "STJ Tema 998; TNU Tema 165; IN 128/2022, art. 271, § 2º", "origem": "doutrina-previdenciaria.md §5 (Contribuinte individual e afastamento; bloco ADVERSO agentes biológicos), LACUNA ins. R8 c.10", "sinal": "controvertido"}, {"id": "inc-064", "tema": "Trabalho, acumulação e reabilitação", "pergunta": "Posso trabalhar recebendo auxílio-doença?", "variantes": ["voltei a trabalhar encostado", "fazer bico recebendo auxílio", "trabalhar durante o benefício"], "resposta": "Não. A volta voluntária ao trabalho que garanta a subsistência cancela o auxílio por incapacidade temporária desde o retorno, com ressarcimento do que foi pago. A regra vale para quem já está recebendo; quem trabalhou depois de ter o pedido negado segue outra regra na Justiça (STJ, Superior Tribunal de Justiça, Tema 1.013).", "fonte": "Lei 8.213/1991, art. 60, §§ 6º e 7º; Dec. 3.048/1999, art. 73, §§ 5º e 6º; IN 128/2022, art. 342; STJ Tema 1.013", "origem": "doutrina-incapacidade.md §7 (Data de início, duração e cessação; Trabalho durante a incapacidade e compensação)", "sinal": "firme"}, {"id": "inc-065", "tema": "Trabalho, acumulação e reabilitação", "pergunta": "O INSS negou e tive que trabalhar doente. Perco os atrasados?", "variantes": ["trabalhei enquanto o processo corria", "recebo o atrasado mesmo tendo trabalhado", "trabalhei por necessidade depois do indeferimento"], "resposta": "Não. Entre o indeferimento e a implantação pela Justiça, o segurado recebe o benefício retroativo junto com a remuneração do trabalho, ainda que incompatível com a incapacidade (STJ, Superior Tribunal de Justiça, Tema 1.013). A TNU (Turma Nacional de Uniformização) admite o benefício no período trabalhado quando provada a incapacidade para a atividade habitual na época.", "fonte": "STJ Tema 1.013; TNU Súm. 72", "origem": "doutrina-incapacidade.md §7 (Trabalho durante a incapacidade e compensação)", "sinal": "firme"}, {"id": "inc-066", "tema": "Trabalho, acumulação e reabilitação", "pergunta": "Posso receber auxílio-doença e aposentadoria juntos?", "variantes": ["aposentado pode pegar auxílio-doença", "acumular aposentadoria e auxílio", "sou aposentado e fiquei doente"], "resposta": "Não. A lei veda o recebimento conjunto de aposentadoria e auxílio por incapacidade temporária, e também de salário-maternidade e auxílio, salvo direito adquirido.", "fonte": "Lei 8.213/1991, art. 124, I e IV", "origem": "doutrina-incapacidade.md §7 (Trabalho durante a incapacidade e compensação); 03_TESES/legislacao/leis/Lei-8213-1991 (art. 124)", "sinal": "firme"}, {"id": "inc-067", "tema": "Trabalho, acumulação e reabilitação", "pergunta": "Posso receber seguro-desemprego e auxílio-doença juntos?", "variantes": ["fui demitido e fiquei doente", "seguro-desemprego com benefício do INSS", "seguro-desemprego e auxílio-acidente"], "resposta": "Não com o auxílio por incapacidade temporária: o seguro-desemprego é inacumulável com benefício de prestação continuada, e na Justiça o valor é abatido (TNU, Turma Nacional de Uniformização, Tema 232). As exceções são a pensão por morte e o auxílio-acidente, que podem ser recebidos junto com o seguro-desemprego.", "fonte": "Lei 8.213/1991, art. 124, par. único; TNU Tema 232, ADVERSO", "origem": "doutrina-incapacidade.md §7 (Trabalho durante a incapacidade e compensação)", "sinal": "firme"}, {"id": "inc-068", "tema": "Trabalho, acumulação e reabilitação", "pergunta": "Já recebi outro benefício no período. Vou ter que devolver tudo?", "variantes": ["desconto de benefício pago no administrativo", "compensação de atrasados", "INSS quer descontar o que já pagou"], "resposta": "Não de uma vez. A compensação de benefício inacumulável pago administrativamente se faz mês a mês, sem gerar saldo negativo contra o segurado.", "fonte": "STJ Tema 1.207", "origem": "doutrina-incapacidade.md §7 (Trabalho durante a incapacidade e compensação)", "sinal": "firme"}, {"id": "inc-069", "tema": "Trabalho, acumulação e reabilitação", "pergunta": "O que é a reabilitação profissional do INSS?", "variantes": ["não posso mais fazer minha função, e agora", "INSS vai me treinar para outra profissão", "reabilitação do INSS"], "resposta": "O segurado em auxílio por incapacidade temporária que não pode se recuperar para a atividade habitual deve passar por reabilitação para outra atividade. O benefício é mantido até ser considerado reabilitado para atividade que garanta a subsistência ou, se não recuperável, até ser aposentado por incapacidade permanente. Concluída, o INSS (Instituto Nacional do Seguro Social) emite certificado com as atividades que pode exercer.", "fonte": "Lei 8.213/1991, arts. 62, caput e § 1º, 89 e 92", "origem": "03_TESES/legislacao/leis/Lei-8213-1991 (arts. 62, 89 a 92)", "sinal": "firme"}, {"id": "inc-070", "tema": "Trabalho, acumulação e reabilitação", "pergunta": "A reabilitação inclui prótese e transporte?", "variantes": ["INSS dá prótese", "órtese pelo INSS", "transporte do acidentado"], "resposta": "Sim. A reabilitação profissional compreende o fornecimento, a reparação e a substituição de prótese, órtese e instrumentos de locomoção quando atenuarem a perda funcional, e o transporte do acidentado do trabalho quando necessário. É devida em caráter obrigatório aos segurados, inclusive aposentados.", "fonte": "Lei 8.213/1991, arts. 89, par. único, e 90", "origem": "03_TESES/legislacao/leis/Lei-8213-1991 (arts. 89 e 90)", "sinal": "firme"}, {"id": "inc-071", "tema": "Trabalho, acumulação e reabilitação", "pergunta": "Voltei reabilitado e a empresa mudou minha função. É desvio de função?", "variantes": ["readaptação na empresa", "mudaram meu cargo depois do INSS", "função compatível com a limitação"], "resposta": "Não. A alteração de atribuições e responsabilidades compatível com a limitação sofrida não configura desvio de cargo ou função do segurado reabilitado ou em reabilitação pelo INSS (Instituto Nacional do Seguro Social). Empresas com 100 ou mais empregados devem preencher de 2% a 5% dos cargos com reabilitados ou pessoas com deficiência habilitadas.", "fonte": "Lei 8.213/1991, arts. 62, § 2º, e 93", "origem": "03_TESES/legislacao/leis/Lei-8213-1991 (arts. 62 e 93)", "sinal": "firme"}, {"id": "inc-072", "tema": "Ação judicial e competência", "pergunta": "Onde entro com a ação contra o INSS por benefício de incapacidade?", "variantes": ["Justiça Federal ou Estadual", "processo de auxílio-doença em qual justiça", "ação acidentária onde corre"], "resposta": "Benefício acidentário (auxílio, aposentadoria, auxílio-acidente ou pensão decorrentes de acidente do trabalho) vai à Justiça Estadual, fora dos juizados, qualquer que seja o valor. Benefício comum vai à Justiça Federal: JEF (Juizado Especial Federal) até 60 salários mínimos onde houver, vara federal acima disso. Comarca sem vara federal a mais de 70 km de uma, em ação desde 01/01/2020, pode correr na Justiça Estadual por competência delegada.", "fonte": "CF, art. 109, I e § 3º; Lei 8.213/1991, art. 129, II; Lei 10.259/2001, art. 3º; Lei 5.010/1966, art. 15, III; STF Tema 414; STJ Súm. 15", "origem": "competencia-e-rito.md §§1, 1-A, 4 e 5", "sinal": "firme"}, {"id": "inc-073", "tema": "Ação judicial e competência", "pergunta": "Quero converter meu auxílio comum em acidentário. Onde entro?", "variantes": ["transformar B31 em B91", "mudar auxílio-doença para acidentário", "o INSS não reconheceu que foi do trabalho"], "resposta": "Na Justiça Estadual, se a inicial afirmar nexo com o trabalho (acidente típico, doença ocupacional ou equiparado); sem nexo afirmado, a causa é previdenciária comum. A competência segue a causa de pedir e o pedido. Precedente específico do STJ (Superior Tribunal de Justiça) sobre essa conversão não foi conferido em fonte oficial.", "fonte": "CC 132.034/SP (STJ, 1ª Seção); competência pela causa de pedir", "origem": "competencia-e-rito.md §5 (Pensão, revisão e conversão; LACUNAS); gerente-previdenciario SKILL.md §5", "sinal": "controvertido"}, {"id": "inc-074", "tema": "Ação judicial e competência", "pergunta": "Ação acidentária contra o INSS tem custas? E se eu perder?", "variantes": ["preciso pagar custas na ação acidentária", "se perder pago honorários do INSS?", "ação de acidente de trabalho é de graça?"], "resposta": "O autor da ação acidentária é isento de custas e de verbas de sucumbência; a isenção é do segurado, não do INSS (Instituto Nacional do Seguro Social), que na Justiça Estadual não é isento de custas. Os honorários do perito são antecipados pelo INSS e, vencido o autor isento, ficam a cargo do Estado.", "fonte": "Lei 8.213/1991, art. 129, par. único; STJ Súm. 110 e 178; Lei 13.876/2019, art. 1º, § 7º, II; STJ Tema 1.044", "origem": "competencia-e-rito.md §§5 e 6", "sinal": "firme"}, {"id": "inc-075", "tema": "Ação judicial e competência", "pergunta": "Qual o prazo para entrar com ação acidentária?", "variantes": ["prescrição da ação de acidente de trabalho", "perdi o prazo para cobrar o INSS?", "quanto tempo tenho para processar"], "resposta": "5 anos contados do acidente, quando dele resultar morte ou incapacidade temporária, ou do reconhecimento da incapacidade permanente ou do agravamento. Contra benefício negado ou cessado não há decadência do direito; prescrevem só as parcelas de mais de 5 anos antes da ação. A ação acidentária exige prova da notificação do acidente por CAT (comunicação de acidente do trabalho), mas não exige esgotar a via administrativa.", "fonte": "Lei 8.213/1991, arts. 103, par. único, 104 e 129, II; ADI 6.096; STJ Súm. 85 e 89", "origem": "doutrina-incapacidade.md §8 (Prescrição da ação acidentária); competencia-e-rito.md §§5, 7 e 8", "sinal": "firme"}, {"id": "bpc-001", "tema": "BPC: quem tem direito", "pergunta": "Quem tem direito ao LOAS?", "variantes": ["quem pode pedir o BPC", "benefício do idoso, quem recebe", "amparo assistencial é para quem", "tenho direito ao benefício da LOAS?"], "resposta": "O BPC (benefício de prestação continuada) da LOAS (Lei Orgânica da Assistência Social) é devido à pessoa idosa com 65 anos ou mais e à pessoa com deficiência que não tenham meios de se manter nem de ser mantidas pela família. A renda familiar por pessoa precisa ser igual ou inferior a 1/4 do salário mínimo. Também são exigidos CPF (Cadastro de Pessoas Físicas), CadÚnico (Cadastro Único) atualizado há no máximo 24 meses e registro biométrico.", "fonte": "Lei 8.742/1993, art. 20, caput, § 3º, §§ 12 a 12-B; Dec. 6.214/2007, Anexo, art. 1º", "origem": "doutrina-beneficio-assistencial.md §13 (Requisitos e valor; Requisitos formais e biometria)", "sinal": "firme"}, {"id": "bpc-002", "tema": "BPC: quem tem direito", "pergunta": "Precisa ter contribuído para o INSS para receber o LOAS?", "variantes": ["nunca paguei INSS, posso receber o BPC", "LOAS exige contribuição", "benefício do idoso sem ter trabalhado"], "resposta": "Não. O BPC (benefício de prestação continuada) é benefício assistencial: os requisitos são a idade de 65 anos ou a deficiência e a renda familiar por pessoa de até 1/4 do salário mínimo, sem exigência de contribuição. Também não há desconto de contribuição sobre o valor pago.", "fonte": "CF, art. 203; Lei 8.742/1993, art. 20, caput; Dec. 6.214/2007, Anexo, art. 22", "origem": "doutrina-beneficio-assistencial.md §13 (Requisitos e valor); 03_TESES/legislacao/leis/CF-1988_constituicao-federal-consolidada.txt (art. 203)", "sinal": "firme"}, {"id": "bpc-003", "tema": "BPC: quem tem direito", "pergunta": "Quem acabou de fazer 65 anos já pode pedir o LOAS do idoso?", "variantes": ["completei 65 anos, já tenho direito ao BPC", "idade exata para o benefício do idoso", "65 anos ou mais de 65"], "resposta": "O ponto é controvertido. O caput do art. 20 da LOAS (Lei Orgânica da Assistência Social) fala em 65 anos ou mais, mas o § 14 do mesmo artigo, o decreto e a portaria falam em acima de 65 anos, e a fonte registra a divergência como lacuna. Pela letra do caput, quem completou 65 anos preenche o requisito etário.", "fonte": "Lei 8.742/1993, art. 20, caput e § 14", "origem": "doutrina-beneficio-assistencial.md §13 (Renda familiar por pessoa; LACUNA c.10)", "sinal": "controvertido"}, {"id": "bpc-004", "tema": "BPC: quem tem direito", "pergunta": "Que tipo de deficiência dá direito ao LOAS?", "variantes": ["doença dá direito ao BPC", "o que conta como deficiência para o LOAS", "doença que dura pouco tempo dá LOAS", "impedimento de longo prazo o que é"], "resposta": "É a pessoa com impedimento de longo prazo que, em interação com barreiras, obstrui sua participação plena na sociedade. Longo prazo é o impedimento com efeitos por no mínimo 2 anos. A TNU (Turma Nacional de Uniformização) conta esses 2 anos do início do impedimento até a cessação prevista, entendimento adverso a quem tem impedimento mais curto. Também conta como incapacidade para a vida independente a que impede a pessoa de prover o próprio sustento.", "fonte": "Lei 8.742/1993, art. 20, §§ 2º e 10; Lei 13.146/2015, art. 2º; TNU Tema 173 e Súmula 48 (adversos); TNU Súmula 29", "origem": "doutrina-beneficio-assistencial.md §13 (Requisitos e valor; ADVERSO; Prova da deficiência)", "sinal": "firme"}, {"id": "bpc-005", "tema": "BPC: quem tem direito", "pergunta": "Criança com deficiência pode receber o LOAS?", "variantes": ["BPC para filho pequeno", "LOAS para menor", "criança especial tem direito ao benefício"], "resposta": "Sim. Na criança e no adolescente menor de 16 anos, avaliam-se a deficiência e o impacto na limitação de atividade e de participação compatível com a idade. Os demais requisitos do BPC (benefício de prestação continuada), como a renda familiar por pessoa de até 1/4 do salário mínimo, continuam valendo.", "fonte": "Dec. 6.214/2007, Anexo, art. 4º, § 1º", "origem": "doutrina-beneficio-assistencial.md §13 (Requisitos e valor)", "sinal": "firme"}, {"id": "bpc-006", "tema": "BPC: quem tem direito", "pergunta": "Autismo ou visão de um olho só dá direito automático ao LOAS?", "variantes": ["autista tem direito ao BPC", "visão monocular dá LOAS", "TEA dá benefício assistencial"], "resposta": "Não é automático. Para o transtorno do espectro autista e para a visão monocular, a TNU (Turma Nacional de Uniformização) exige avaliação biopsicossocial, como nos demais casos de BPC (benefício de prestação continuada).", "fonte": "TNU Temas 376 e 378", "origem": "doutrina-beneficio-assistencial.md §13 (Prova da deficiência)", "sinal": "firme"}, {"id": "bpc-007", "tema": "BPC: quem tem direito", "pergunta": "Estrangeiro que mora no Brasil pode receber o LOAS?", "variantes": ["imigrante tem direito ao BPC", "estrangeiro recebe benefício do idoso", "venezuelano pode pedir LOAS"], "resposta": "Sim, segundo o STF (Supremo Tribunal Federal), que reconhece o direito do estrangeiro residente no país, e a portaria do INSS (Instituto Nacional do Seguro Social), que admite o estrangeiro em situação regular. O decreto, porém, fala só em brasileiro e português, e a fonte registra essa divergência com alerta.", "fonte": "STF Tema 173; Portaria Conjunta MDS/INSS 34/2025, art. 6º, I e II; Dec. 6.214/2007, art. 7º", "origem": "doutrina-beneficio-assistencial.md §13 (Requisitos e valor; LACUNA c.12)", "sinal": "controvertido"}, {"id": "bpc-008", "tema": "BPC: renda e grupo familiar", "pergunta": "Qual é o limite de renda para ter o LOAS?", "variantes": ["quanto a família pode ganhar para ter o BPC", "renda por pessoa do LOAS", "um quarto do salário mínimo", "renda per capita do benefício"], "resposta": "A renda familiar mensal por pessoa precisa ser igual ou inferior a 1/4 do salário mínimo vigente no mês do requerimento. Em 2026, com salário mínimo de R$ 1.621,00, esse limite é de R$ 405,25 por pessoa. Na concessão vale só a renda identificada na data do requerimento.", "fonte": "Lei 8.742/1993, art. 20, § 3º; Portaria Conjunta MDS/INSS 34/2025, arts. 11, II e § 1º; Dec. 12.797/2025, art. 1º", "origem": "doutrina-beneficio-assistencial.md §13 (Renda familiar por pessoa); doutrina-previdenciaria.md §4 (Valores de 2026)", "sinal": "firme"}, {"id": "bpc-009", "tema": "BPC: renda e grupo familiar", "pergunta": "Como o INSS calcula a renda por pessoa da família?", "variantes": ["como faz a conta da renda do LOAS", "bico entra na renda do BPC", "renda informal conta"], "resposta": "Somam-se os rendimentos mensais de todos os membros da família que moram sob o mesmo teto e divide-se pelo número total de pessoas da família, vedadas deduções não previstas em lei. A renda informal entra pelo que foi declarado no CadÚnico (Cadastro Único). Se o CadÚnico divergir de outras bases, prevalece a informação de maior renda.", "fonte": "Lei 8.742/1993, art. 20, § 3º-A; Portaria Conjunta MDS/INSS 34/2025, art. 8º, I, II e § 2º; Dec. 6.214/2007, art. 13, § 3º", "origem": "doutrina-beneficio-assistencial.md §13 (Renda familiar por pessoa)", "sinal": "firme"}, {"id": "bpc-010", "tema": "BPC: renda e grupo familiar", "pergunta": "Quem entra no grupo familiar para o LOAS?", "variantes": ["quem conta na família do BPC", "filho que mora junto entra na renda", "padrasto conta na renda do LOAS"], "resposta": "Entram, desde que morem sob o mesmo teto: o requerente, o cônjuge ou companheiro, os pais e, na falta de um deles, a madrasta ou o padrasto, os irmãos solteiros, os filhos e enteados solteiros e os menores tutelados.", "fonte": "Lei 8.742/1993, art. 20, § 1º; Dec. 6.214/2007, art. 4º, V", "origem": "doutrina-beneficio-assistencial.md §13 (Renda familiar por pessoa)", "sinal": "firme"}, {"id": "bpc-011", "tema": "BPC: renda e grupo familiar", "pergunta": "Filho casado que mora na mesma casa entra na renda do LOAS?", "variantes": ["quem não conta na família do BPC", "filho divorciado entra na renda", "pessoa internada entra no grupo familiar"], "resposta": "Não. Ficam fora do grupo o irmão, filho ou enteado casado, em união estável, divorciado, separado de fato ou viúvo, a pessoa internada ou acolhida em instituição de longa permanência e o tutor ou curador que não esteja no rol legal ou não more sob o mesmo teto.", "fonte": "Portaria Conjunta MDS/INSS 34/2025, art. 7º, § 1º", "origem": "doutrina-beneficio-assistencial.md §13 (Renda familiar por pessoa)", "sinal": "firme"}, {"id": "bpc-012", "tema": "BPC: renda e grupo familiar", "pergunta": "A aposentadoria de um salário mínimo do meu marido conta na renda do LOAS?", "variantes": ["aposentadoria do idoso entra na renda do BPC", "benefício de um salário mínimo do cônjuge conta", "marido aposentado impede o LOAS"], "resposta": "Não, se o benefício previdenciário for de até 1 salário mínimo e pago a idoso acima de 65 anos ou a pessoa com deficiência: ele sai da conta, um por membro da família. A exclusão vale também no pedido de BPC (benefício de prestação continuada) da pessoa com deficiência.", "fonte": "Lei 8.742/1993, art. 20, § 14; STF Tema 312; STJ Tema 640", "origem": "doutrina-beneficio-assistencial.md §13 (Renda familiar por pessoa)", "sinal": "firme"}, {"id": "bpc-013", "tema": "BPC: renda e grupo familiar", "pergunta": "Se outra pessoa da casa já recebe LOAS, isso conta na renda?", "variantes": ["dois BPC na mesma casa", "marido já tem LOAS, posso pedir também", "outro benefício assistencial na família"], "resposta": "Não. O BPC (benefício de prestação continuada) de outro idoso ou pessoa com deficiência da família sai do cálculo da renda. Também saem a bolsa de estágio supervisionado, os rendimentos de aprendizagem e a indenização ou auxílio por rompimento de barragens.", "fonte": "Lei 8.742/1993, art. 20, §§ 9º e 14; Portaria Conjunta MDS/INSS 34/2025, art. 8º, I, a a f", "origem": "doutrina-beneficio-assistencial.md §13 (Renda familiar por pessoa)", "sinal": "firme"}, {"id": "bpc-014", "tema": "BPC: renda e grupo familiar", "pergunta": "E se a aposentadoria do idoso da casa for maior que um salário mínimo?", "variantes": ["aposentadoria acima do mínimo entra na renda do BPC", "benefício maior que o mínimo conta inteiro"], "resposta": "Entra integralmente na renda. A TNU (Turma Nacional de Uniformização) decidiu que o benefício previdenciário acima de 1 salário mínimo de idoso ou de pessoa com deficiência não se exclui, nem em parte; o entendimento é adverso ao requerente.", "fonte": "TNU Tema 369 (adverso)", "origem": "doutrina-beneficio-assistencial.md §13 (Renda familiar por pessoa; ADVERSO)", "sinal": "firme"}, {"id": "bpc-015", "tema": "BPC: renda e grupo familiar", "pergunta": "A pensão de um salário mínimo da minha filha de 40 anos conta na renda do LOAS?", "variantes": ["benefício de um salário mínimo de pessoa jovem entra na renda", "pensão de membro sem deficiência conta no BPC"], "resposta": "Pela TNU (Turma Nacional de Uniformização), sim: não se exclui o benefício de 1 salário mínimo de membro sem deficiência e com menos de 65 anos. A tese é adversa e foi julgada em 20/08/2025, sem trânsito em julgado exibido na fonte.", "fonte": "TNU TF-133, PUIL 10006513420234063806/MG (adverso)", "origem": "doutrina-beneficio-assistencial.md §13 (Renda familiar por pessoa; ADVERSO)", "sinal": "controvertido"}, {"id": "bpc-016", "tema": "BPC: renda e grupo familiar", "pergunta": "O Bolsa Família conta na renda do LOAS?", "variantes": ["Bolsa Família atrapalha o BPC", "auxílio do governo entra na renda", "programa de transferência de renda conta"], "resposta": "Não há resposta firme. A regra que excluía os programas de transferência de renda foi revogada pelo Dec. 12.534/2025 e a portaria atual não a repete, mas nenhum ato lido diz que o Bolsa Família entra na renda; a fonte registra o ponto como lacuna. Para acumular, a LOAS (Lei Orgânica da Assistência Social) ressalva as transferências de renda, então o BPC (benefício de prestação continuada) pode ser recebido junto com elas.", "fonte": "Dec. 6.214/2007, art. 4º, § 2º, II (revogado pelo Dec. 12.534/2025); Lei 8.742/1993, art. 20, § 4º", "origem": "doutrina-beneficio-assistencial.md §13 (Renda familiar por pessoa; LACUNA c.2; Acumulação)", "sinal": "controvertido"}, {"id": "bpc-017", "tema": "BPC: renda e grupo familiar", "pergunta": "Quem recebe pensão alimentícia pode ter o LOAS?", "variantes": ["pensão do pai do meu filho conta na renda do BPC", "alimentos impedem o LOAS"], "resposta": "A pensão alimentícia recebida não impede a concessão, segundo a portaria. Não há regra expressa sobre se o valor entra no cálculo da renda, e a fonte registra o ponto como lacuna.", "fonte": "Portaria Conjunta MDS/INSS 34/2025, art. 12, IV", "origem": "doutrina-beneficio-assistencial.md §13 (Renda familiar por pessoa; LACUNA c.3)", "sinal": "controvertido"}, {"id": "bpc-018", "tema": "BPC: renda e grupo familiar", "pergunta": "Gasto com remédio e fralda pode ser descontado da renda do LOAS?", "variantes": ["despesa de saúde abate da renda do BPC", "dedução de gastos com tratamento", "remédio que o SUS não dá"], "resposta": "Sim. Deduzem-se da renda bruta os gastos com tratamento, consultas, fraldas, alimentos especiais e medicamentos não fornecidos pelo SUS (Sistema Único de Saúde) e com Centro-Dia não prestado pelo SUAS (Sistema Único de Assistência Social), uma vez por categoria, pelo valor médio da tabela oficial e com documentação. Gasto efetivo maior que a tabela se prova com recibos de 12 meses. Para pedido anterior a 10/10/2025 a fonte não tem a tabela aplicável.", "fonte": "Lei 8.742/1993, art. 20-B, III e § 4º; Portaria Conjunta MDS/INSS 34/2025, art. 8º, §§ 4º a 7º e Anexo I; Portaria Conjunta MDS/INSS 45/2026", "origem": "doutrina-beneficio-assistencial.md §13 (Dedução de gastos de saúde)", "sinal": "firme"}, {"id": "bpc-019", "tema": "BPC: renda e grupo familiar", "pergunta": "A renda passa um pouco de 1/4 do salário mínimo. Perdi o direito ao LOAS?", "variantes": ["renda de meio salário mínimo dá BPC", "renda acima do limite do LOAS", "miserabilidade com renda maior"], "resposta": "No INSS (Instituto Nacional do Seguro Social), sim: a ampliação até 1/2 salário mínimo prevista na lei não funciona, porque depende de decreto que não foi editado. Na Justiça, a renda acima de 1/4 admite prova da miserabilidade por outros meios, pois o STF (Supremo Tribunal Federal) declarou o critério inconstitucional e o STJ (Superior Tribunal de Justiça) decidiu que 1/4 não é o único meio de prova. A prova se faz por laudo social, auto de constatação ou, inviabilizados, testemunhas.", "fonte": "Lei 8.742/1993, art. 20, § 11-A, e art. 20-B; Lei 14.176/2021, art. 6º, par. único; STF Tema 27; STJ Tema 185; TNU Súmula 79", "origem": "doutrina-beneficio-assistencial.md §13 (Renda entre 1/4 e 1/2 SM; LACUNA c.1)", "sinal": "firme"}, {"id": "bpc-020", "tema": "BPC: renda e grupo familiar", "pergunta": "Meus filhos me ajudam com dinheiro. Isso tira o LOAS?", "variantes": ["ajuda dos filhos impede o BPC", "filho que mora fora tem que sustentar", "vizinho ajuda, perco o benefício"], "resposta": "A ajuda de terceiro que não tem obrigação legal de prestar alimentos não afasta o BPC (benefício de prestação continuada). Já os devedores legais de alimentos, como os filhos, podem afastá-lo se tiverem condições de sustentar sem prejuízo da própria manutenção; esse entendimento da TNU (Turma Nacional de Uniformização) é adverso. As duas teses não têm trânsito em julgado exibido na fonte.", "fonte": "TNU TF-139 (favorável); TNU TF-147 (adverso)", "origem": "doutrina-beneficio-assistencial.md §13 (Renda entre 1/4 e 1/2 SM; ADVERSO)", "sinal": "controvertido"}, {"id": "bpc-021", "tema": "BPC: cadastro, biometria e perícia", "pergunta": "Precisa estar no Cadastro Único para pedir o LOAS?", "variantes": ["CadÚnico é obrigatório para o BPC", "cadastro do CRAS para o LOAS", "CadÚnico desatualizado"], "resposta": "Sim. O CadÚnico (Cadastro Único) atualizado há no máximo 24 meses é requisito de concessão e de manutenção do BPC (benefício de prestação continuada), junto com o CPF (Cadastro de Pessoas Físicas). A TNU (Turma Nacional de Uniformização) exige o CadÚnico desde a MP (medida provisória) 871/2019.", "fonte": "Lei 8.742/1993, art. 20, § 12, e art. 21-B; Lei 15.077/2024, art. 2º; TNU TF-134, TF-138 e TF-141 (adversos)", "origem": "doutrina-beneficio-assistencial.md §13 (Requisitos formais e biometria)", "sinal": "firme"}, {"id": "bpc-022", "tema": "BPC: cadastro, biometria e perícia", "pergunta": "Precisa fazer biometria para receber o LOAS?", "variantes": ["biometria do BPC", "digital no INSS para o benefício", "idoso acamado sem biometria", "responsável legal faz a biometria"], "resposta": "Sim. O registro biométrico na CIN (Carteira de Identidade Nacional), no título de eleitor ou na CNH (Carteira Nacional de Habilitação) é requisito de concessão e manutenção do BPC (benefício de prestação continuada); se o requerente não puder, é obrigatório ao responsável legal. As bases da CNH, da Polícia Federal e do TSE (Tribunal Superior Eleitoral) valem até 31/12/2027, com cadastro até 30/04/2026 para concessão e até 31/12/2026 para manutenção. Fica dispensado em localidade de difícil acesso ou por dificuldade de deslocamento enquanto o poder público não der condições.", "fonte": "Lei 8.742/1993, art. 20, §§ 12-A e 12-B; Lei 15.077/2024, art. 1º; Dec. 6.214/2007, arts. 12 e 15; Portaria Conjunta MDS/INSS 36/2026, art. 3º; Portaria DIRBEN/INSS 1.347/2026, arts. 2º a 4º", "origem": "doutrina-beneficio-assistencial.md §13 (Requisitos formais e biometria)", "sinal": "firme"}, {"id": "bpc-023", "tema": "BPC: cadastro, biometria e perícia", "pergunta": "Como é a perícia do LOAS para deficiência?", "variantes": ["avaliação biopsicossocial", "perícia médica e assistente social no BPC", "entrevista com assistente social do INSS"], "resposta": "É uma avaliação biopsicossocial em duas partes: a médica, feita pela Perícia Médica Federal, e a social, feita pelo serviço social do INSS (Instituto Nacional do Seguro Social), com registro do CID (Classificação Internacional de Doenças).", "fonte": "Lei 8.742/1993, art. 20, §§ 2º-A e 6º, e art. 40-B; Dec. 6.214/2007, art. 16, §§ 3º e 3º-A", "origem": "doutrina-beneficio-assistencial.md §13 (Requisitos e valor)", "sinal": "firme"}, {"id": "bpc-024", "tema": "BPC: cadastro, biometria e perícia", "pergunta": "O INSS pediu um documento e eu não entreguei. Perdi o pedido do LOAS?", "variantes": ["exigência do INSS não cumprida", "prazo de 30 dias da exigência", "pedido do BPC arquivado"], "resposta": "Exigência não cumprida em 30 dias equivale a desistência do pedido. O novo requerimento é livre e pode ser feito a qualquer momento.", "fonte": "Dec. 6.214/2007, art. 20, §§ 2º e 3º; Portaria Conjunta MDS/INSS 34/2025, arts. 6º, § 4º, e 15, §§ 3º e 4º", "origem": "doutrina-beneficio-assistencial.md §13 (Requisitos formais e biometria)", "sinal": "firme"}, {"id": "bpc-025", "tema": "BPC: valor e manutenção", "pergunta": "Quanto paga o LOAS?", "variantes": ["valor do BPC", "quanto é o benefício do idoso", "LOAS paga um salário mínimo?"], "resposta": "Um salário mínimo por mês, sem desconto de contribuição. Em 2026, o salário mínimo é de R$ 1.621,00.", "fonte": "Lei 8.742/1993, art. 20, caput; Dec. 6.214/2007, Anexo, art. 22; Dec. 12.797/2025, art. 1º", "origem": "doutrina-beneficio-assistencial.md §13 (Requisitos e valor); doutrina-previdenciaria.md §4 (Valores de 2026)", "sinal": "firme"}, {"id": "bpc-026", "tema": "BPC: valor e manutenção", "pergunta": "O LOAS paga 13º?", "variantes": ["BPC tem décimo terceiro", "abono anual do LOAS", "gratificação natalina no benefício do idoso"], "resposta": "Não. O BPC (benefício de prestação continuada) não tem abono anual, o 13º.", "fonte": "Dec. 6.214/2007, Anexo, art. 22", "origem": "doutrina-beneficio-assistencial.md §13 (Requisitos e valor)", "sinal": "firme"}, {"id": "bpc-027", "tema": "BPC: valor e manutenção", "pergunta": "Quando quem recebe LOAS morre, a família fica com pensão?", "variantes": ["BPC gera pensão por morte", "LOAS passa para a esposa", "herdeiro recebe o benefício do falecido"], "resposta": "Não. O BPC (benefício de prestação continuada) é intransferível e não gera pensão por morte. Só os valores que ficaram sem receber em vida vão aos herdeiros, na forma da lei civil.", "fonte": "Dec. 6.214/2007, Anexo, art. 23; Portaria Conjunta MDS/INSS 34/2025, art. 15, § 2º", "origem": "doutrina-beneficio-assistencial.md §13 (Requisitos e valor)", "sinal": "firme"}, {"id": "bpc-028", "tema": "BPC: valor e manutenção", "pergunta": "Se eu ganhar o LOAS na Justiça, recebo desde quando?", "variantes": ["atrasados do BPC", "LOAS retroativo", "desde quando paga o benefício assistencial"], "resposta": "Desde a DER (data de entrada do requerimento). Se a perícia judicial mostrar que a incapacidade já existia na DER, ela é o termo inicial. O BPC (benefício de prestação continuada) não tem abono anual nos atrasados.", "fonte": "Portaria Conjunta MDS/INSS 34/2025, art. 14; TNU Súmula 22", "origem": "doutrina-beneficio-assistencial.md §13 (Atrasados, correção e valor da causa)", "sinal": "firme"}, {"id": "bpc-029", "tema": "BPC: valor e manutenção", "pergunta": "O LOAS pode ser cortado em revisão
