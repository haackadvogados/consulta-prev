tativos/TNU_temas-representativos_2026-10-16.md", "sinal": "firme", "ficha": true}, {"id": "tnu-a10", "tema": "TNU: temas e súmulas por assunto", "pergunta": "Quais temas e súmulas da TNU tratam de trabalho rural: segurado especial, prova e aposentadoria híbrida?", "variantes": ["TNU rural", "tema TNU rural", "súmula TNU rural", "jurisprudência do Juizado sobre rural", "tema TNU segurado especial", "súmula TNU segurado especial", "Turma Nacional rural"], "resposta": "Temas representativos e súmulas da TNU (Turma Nacional de Uniformização) sobre trabalho rural: segurado especial, prova e aposentadoria híbrida, com sinal ao segurado e status na data da fonte (temas: repositório de 16/10/2026 e catálogo; súmulas: lista oficial de 24/10/2026):\nTema 2 (FAVORÁVEL; transitado): Certidão de casamento extemporânea é início de prova material do trabalho rural.\nTema 3 (FAVORÁVEL; transitado): Prova documental não contemporânea, estendida por prova testemunhal robusta, serve ao rural.\nTema 11 (FAVORÁVEL; transitado): No salário-maternidade da segurada especial, a prova material contemporânea é flexibilizada.\nTema 17 (FAVORÁVEL; transitado): Prova material flexibilizada no salário-maternidade da segurada especial.\nTema 18 (FAVORÁVEL; transitado): Documento de imóvel do grupo familiar é início de prova material do rural.\nTema 21 (ADVERSO; transitado): O rural da carência deve ser imediatamente anterior à idade ou à DER (data de entrada do requerimento).\nTema 23 (FAVORÁVEL; transitado): Trabalho urbano do marido não descaracteriza a segurada especial.\nTema 32 (FAVORÁVEL; transitado): Certidão de óbito é início de prova material do trabalho rural.\nTema 37 (FAVORÁVEL; transitado): Atividade urbana intercalada não afasta a aposentadoria rural.\nTema 39 (ADVERSO; transitado): Pensão de rurícola exige qualidade de segurado ou requisitos da aposentadoria no óbito.\nTema 63 (ADVERSO; transitado): Rural posterior à Lei 8.213 exige contribuições para a carência.\nTema 115 (FAVORÁVEL; transitado): Natureza rural do trabalho não depende do ramo do empregador.\nTema 131 (FAVORÁVEL; transitado): Aposentadoria híbrida sem rural imediato; rural remoto conta na carência.\nTema 145 (ADVERSO; transitado): O rural da carência deve ser imediatamente anterior à idade ou à DER.\nTema 153 (FAVORÁVEL; transitado): Rural com CTPS (Carteira de Trabalho e Previdência Social) anterior a 1991 conta na carência sem contribuições.\nTema 219 (FAVORÁVEL; transitado): Trabalho rural antes dos 12 anos é computável.\nTema 301 (NEUTRO; transitado): Rural: itens I e III favoráveis; o item II descaracteriza o segurado especial após 120 dias.\nTema 322 (FAVORÁVEL; transitado): Auxílio-acidente entra no PBC (período básico de cálculo) da aposentadoria rural do segurado especial.\nTema 327 (FAVORÁVEL; transitado): Documento do cônjuge empregado rural vale para o segurado especial.\nTema 348 (FAVORÁVEL; transitado): Segurado especial tem período de graça prorrogado por inatividade involuntária.\nSúmula 5 (FAVORÁVEL): Trabalho rural de 12 a 14 anos, até a Lei 8.213/91, comprovado, é reconhecido.\nSúmula 6 (FAVORÁVEL): Certidão de casamento ou documento que qualifique o cônjuge como rurícola é início de prova material.\nSúmula 10 (sem sinal na fonte): Rural anterior à Lei 8.213/91 serve à contagem recíproca com o serviço público, recolhidas as contribuições.\nSúmula 14 (FAVORÁVEL): Na aposentadoria rural por idade, o início de prova material não precisa cobrir toda a carência.\nSúmula 24 (NEUTRO): Rural anterior à Lei 8.213/91 sem contribuições conta para benefício do RGPS (Regime Geral de Previdência Social), exceto para carência.\nSúmula 30 (FAVORÁVEL): Imóvel maior que o módulo rural não afasta, por si só, o segurado especial em economia familiar.\nSúmula 34 (ADVERSO): O início de prova material do rural deve ser contemporâneo aos fatos.\nSúmula 36 (FAVORÁVEL): Pensão por morte de trabalhador rural é cumulável com aposentadoria por invalidez.\nSúmula 41 (FAVORÁVEL): Atividade urbana de um integrante do núcleo familiar não descaracteriza, por si só, o segurado especial.\nSúmula 46 (FAVORÁVEL): Atividade urbana intercalada não impede benefício de trabalhador rural.\nSúmula 54 (FAVORÁVEL): Na idade rural, a atividade da carência se afere no período imediatamente anterior à DER ou à idade.\nSúmula 76 (ADVERSO): Rural não contributivo não majora o coeficiente da aposentadoria por idade (art. 50).", "fonte": "TNU, temas representativos e súmulas", "origem": "tnu-inventario-sinais.md v1.1; 04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md; 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md", "sinal": "firme", "ficha": true}, {"id": "tnu-a11", "tema": "TNU: temas e súmulas por assunto", "pergunta": "Quais temas e súmulas da TNU tratam de professor?", "variantes": ["TNU professor", "tema TNU professor", "súmula TNU professor", "jurisprudência do Juizado sobre professor", "tema TNU magistério", "súmula TNU magistério", "Turma Nacional professor"], "resposta": "Temas representativos e súmulas da TNU (Turma Nacional de Uniformização) sobre professor, com sinal ao segurado e status na data da fonte (temas: repositório de 16/10/2026 e catálogo; súmulas: lista oficial de 24/10/2026):\nTema 149 (ADVERSO; transitado): Incide fator previdenciário na aposentadoria do professor, salvo requisitos cumpridos antes da Lei 9.876/99.\nTema 158 (ADVERSO; transitado): Professor sem conversão em tempo comum após a EC (Emenda Constitucional) 18/81.", "fonte": "TNU, temas representativos e súmulas", "origem": "tnu-inventario-sinais.md v1.1; catalogo-temas-vinculantes-2.md v1.0 §4; 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md", "sinal": "firme", "ficha": true}, {"id": "tnu-a12", "tema": "TNU: temas e súmulas por assunto", "pergunta": "Quais temas e súmulas da TNU tratam de pessoa com deficiência?", "variantes": ["TNU pessoa com deficiência", "tema TNU deficiência", "súmula TNU deficiência", "jurisprudência do Juizado sobre pessoa com deficiência", "tema TNU biopsicossocial", "súmula TNU biopsicossocial", "Turma Nacional pessoa com deficiência"], "resposta": "Temas representativos e súmulas da TNU (Turma Nacional de Uniformização) sobre pessoa com deficiência, com sinal ao segurado e status na data da fonte (temas: repositório de 16/10/2026 e catálogo; súmulas: lista oficial de 24/10/2026):\nTema 173 (ADVERSO; transitado): Impedimento de longo prazo do BPC (benefício de prestação continuada) exige duração mínima de 2 anos.\nTema 376 (NEUTRO; transitado): TEA (transtorno do espectro autista) no BPC exige avaliação biopsicossocial.\nTema 378 (NEUTRO; transitado): Visão monocular no BPC exige avaliação biopsicossocial.\nSúmula 29 (FAVORÁVEL): Incapacidade para a vida independente inclui a impossibilidade de prover o próprio sustento.\nSúmula 48 (ADVERSO; alterada em 25/04/2019): Pessoa com deficiência no BPC exige impedimento de longo prazo de no mínimo 2 anos.\nSúmula 80 (FAVORÁVEL): No BPC da pessoa com deficiência é necessária avaliação social ou providência equivalente.\nNão citar: Tema 389 (em julgamento, sem tese).", "fonte": "TNU, temas representativos e súmulas", "origem": "tnu-inventario-sinais.md v1.1; catalogo-temas-vinculantes-2.md v1.0 §4; 04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md; 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md", "sinal": "firme", "ficha": true}, {"id": "tnu-a13", "tema": "TNU: temas e súmulas por assunto", "pergunta": "Quais temas e súmulas da TNU tratam de auxílio por incapacidade temporária e perícia?", "variantes": ["TNU auxílio-doença", "tema TNU auxílio-doença", "súmula TNU auxílio-doença", "jurisprudência do Juizado sobre auxílio-doença", "tema TNU perícia", "súmula TNU perícia", "Turma Nacional auxílio-doença"], "resposta": "Temas representativos e súmulas da TNU (Turma Nacional de Uniformização) sobre auxílio por incapacidade temporária e perícia, com sinal ao segurado e status na data da fonte (temas: repositório de 16/10/2026 e catálogo; súmulas: lista oficial de 24/10/2026):\nTema 1 (FAVORÁVEL; transitado): Benefício por incapacidade e pensão dele derivada calculados pela média dos 80% maiores salários de contribuição de todo o período contributivo (art. 29, II).\nTema 4 (NEUTRO; transitado): Restabelecimento do auxílio-doença na alta programada sem pedido de prorrogação (tese de 2011).\nTema 29 (FAVORÁVEL; transitado): Recolhimento tardio pelo empregador não prejudica a empregada doméstica.\nTema 36 (ADVERSO; transitado): Sem incapacidade constatada, dispensa-se o exame das condições pessoais.\nTema 38 (ADVERSO; transitado): Incapacidade preexistente veda o benefício mesmo no reingresso ao RGPS (Regime Geral de Previdência Social).\nTema 40 (ADVERSO; transitado): Incapacidade preexistente veda o benefício mesmo no reingresso ao RGPS.\nTema 47 (FAVORÁVEL; transitado): Herdeiros sucedem o autor falecido na ação de benefício por incapacidade.\nTema 57 (FAVORÁVEL; transitado): Não há prescrição do fundo de direito após a cessação do auxílio-doença.\nTema 105 (FAVORÁVEL; transitado): Benefício por incapacidade intercalado conta como carência.\nTema 106 (ADVERSO; transitado): Benefício concedido judicialmente é revisável administrativamente, mesmo no curso da ação.\nTema 164 (NEUTRO; transitado): Auxílio-doença sem DCB (data de cessação do benefício) pode ser revisto mediante convocação; o concedido após a MP (Medida Provisória) 767/2017 tem DCB sem nova perícia; o segurado sempre pode pedir prorrogação, com pagamento até a perícia.\nTema 165 (FAVORÁVEL; transitado): O auxílio-doença previdenciário conta como tempo especial quando o segurado exercia atividade especial antes do afastamento, sem prova de nexo com a atividade.\nTema 176 (ADVERSO; transitado): Carência das MPs (Medidas Provisórias) 739/2016 e 767/2017 para incapacidade surgida na vigência delas.\nTema 177 (NEUTRO; transitado): Incapacidade parcial e permanente fora da Súmula 47: o juiz encaminha à análise administrativa de reabilitação, vedada a condenação prévia à aposentadoria condicionada ao insucesso.\nTema 232 (ADVERSO; transitado): Auxílio-doença inacumulável com seguro-desemprego, com abatimento.\nTema 242 (ADVERSO; transitado): Greve de peritos do INSS (Instituto Nacional do Seguro Social) não gera responsabilidade civil.\nTema 246 (FAVORÁVEL; transitado): Prazo de recuperação estimado na perícia conta do exame, com mínimo de 30 dias desde a implantação; sem prazo fixado, valem 120 dias contados da implantação.\nTema 259 (FAVORÁVEL; transitado): Auxílio-doença cumulável com mandato de vereador (art. 60, § 7º).\nTema 274 (FAVORÁVEL; transitado): Doença estigmatizante não ligada ao HIV (vírus da imunodeficiência humana), com incapacidade parcial e permanente, pode gerar aposentadoria por invalidez após análise das condições sociais, pessoais, econômicas e culturais.\nTema 277 (ADVERSO; transitado): Na alta programada, a ação exige antes pedido de prorrogação, recurso ou reconsideração, quando previstos; sem isso, falta interesse de agir.\nTema 288 (FAVORÁVEL; transitado): Dispensa de perícia na pandemia com documentos médicos suficientes.\nTema 343 (FAVORÁVEL; transitado): Fixar a DII (data de início da incapacidade) na data da perícia é excepcional e exige fundamentação que afaste a presunção de incapacidade anterior ao exame.\nSúmula 53 (sem sinal na fonte): Sem auxílio-doença ou aposentadoria por invalidez se a incapacidade é preexistente ao reingresso.\nSúmula 57 (sem sinal na fonte): Auxílio-doença e aposentadoria por invalidez sob a Lei 9.876 pela média dos 80% maiores salários, qualquer que seja a filiação.\nSúmula 65 (FAVORÁVEL): Benefícios por incapacidade de 28/03/2005 a 20/07/2005 calculados sem a MP 242/2005.\nSúmula 72 (FAVORÁVEL): Cabe benefício por incapacidade no período em que trabalhou, provada a incapacidade na época.\nSúmula 73 (NEUTRO): Auxílio-doença ou aposentadoria por invalidez não acidentários contam como tempo ou carência só se intercalados com contribuições.\nSúmula 77 (sem sinal na fonte): Sem incapacidade para a atividade habitual, o julgador não precisa analisar condições pessoais e sociais.\nSúmula 78 (sem sinal na fonte): Portador de HIV: o julgador verifica condições pessoais, sociais, econômicas e culturais (incapacidade em sentido amplo).\nNão citar: Tema 392 (em julgamento, sem tese).", "fonte": "TNU, temas representativos e súmulas", "origem": "tnu-inventario-sinais.md v1.1; catalogo-temas-vinculantes.md v1.15 §4; 04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md; 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md", "sinal": "firme", "ficha": true}, {"id": "tnu-a14", "tema": "TNU: temas e súmulas por assunto", "pergunta": "Quais temas e súmulas da TNU tratam de aposentadoria por incapacidade permanente?", "variantes": ["TNU aposentadoria por invalidez", "tema TNU aposentadoria por invalidez", "súmula TNU aposentadoria por invalidez", "jurisprudência do Juizado sobre aposentadoria por invalidez", "tema TNU incapacidade permanente", "súmula TNU incapacidade permanente", "Turma Nacional aposentadoria por invalidez"], "resposta": "Temas representativos e súmulas da TNU (Turma Nacional de Uniformização) sobre aposentadoria por incapacidade permanente, com sinal ao segurado e status na data da fonte (temas: repositório de 16/10/2026 e catálogo; súmulas: lista oficial de 24/10/2026):\nTema 36 (ADVERSO; transitado): Sem incapacidade constatada, dispensa-se o exame das condições pessoais.\nTema 124 (ADVERSO; transitado): Adicional de 25% restrito à aposentadoria por invalidez.\nTema 177 (NEUTRO; transitado): Incapacidade parcial e permanente fora da Súmula 47: o juiz encaminha à análise administrativa de reabilitação, vedada a condenação prévia à aposentadoria condicionada ao insucesso.\nTema 266 (ADVERSO; transitado): Dispensa de reavaliação do art. 43, § 5º, não alcança benefícios cessados antes.\nTema 272 (NEUTRO; transitado): Recuperação que depende de cirurgia não gera "tnu-inventario-sinais.md v1.1; 04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md; 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md", "sinal": "firme", "ficha": true}, {"id": "tnu-a20", "tema": "TNU: temas e súmulas por assunto", "pergunta": "Quais temas e súmulas da TNU tratam de salário-maternidade?", "variantes": ["TNU salário-maternidade", "tema TNU salário-maternidade", "súmula TNU salário-maternidade", "jurisprudência do Juizado sobre salário-maternidade", "tema TNU adoção", "súmula TNU adoção", "Turma Nacional salário-maternidade"], "resposta": "Temas representativos e súmulas da TNU (Turma Nacional de Uniformização) sobre salário-maternidade, com sinal ao segurado e status na data da fonte (temas: repositório de 16/10/2026 e catálogo; súmulas: lista oficial de 24/10/2026):\nTema 11 (FAVORÁVEL; transitado): No salário-maternidade da segurada especial, a prova material contemporânea é flexibilizada.\nTema 17 (FAVORÁVEL; transitado): Prova material flexibilizada no salário-maternidade da segurada especial.\nTema 54 (FAVORÁVEL; transitado): A idade mínima de 16 anos vale só para o filho do segurado especial.\nTema 113 (FAVORÁVEL; transitado): Salário-maternidade da desempregada pago pela Previdência.\nTema 236 (ADVERSO; transitado, tese revisada): Salário-maternidade ao genitor (tese revisada).\nTema 344 (FAVORÁVEL; transitado): Salário-maternidade de 120 dias ao adotante de menor de 18 anos.\nSúmula 45 (sem sinal na fonte): Correção monetária do salário-maternidade desde o parto, qualquer que seja a data do requerimento.", "fonte": "TNU, temas representativos e súmulas", "origem": "tnu-inventario-sinais.md v1.1; 04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md; 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md", "sinal": "firme", "ficha": true}, {"id": "tnu-a21", "tema": "TNU: temas e súmulas por assunto", "pergunta": "Quais temas e súmulas da TNU tratam de cálculo, fator previdenciário e revisão?", "variantes": ["TNU cálculo e revisão", "tema TNU revisão", "súmula TNU revisão", "jurisprudência do Juizado sobre cálculo e revisão", "tema TNU fator previdenciário", "súmula TNU fator previdenciário", "Turma Nacional cálculo e revisão"], "resposta": "Temas representativos e súmulas da TNU (Turma Nacional de Uniformização) sobre cálculo, fator previdenciário e revisão, com sinal ao segurado e status na data da fonte (temas: repositório de 16/10/2026 e catálogo; súmulas: lista oficial de 24/10/2026):\nTema 1 (FAVORÁVEL; transitado): Benefício por incapacidade e pensão dele derivada calculados pela média dos 80% maiores salários de contribuição de todo o período contributivo (art. 29, II).\nTema 25 (ADVERSO; transitado): Fator previdenciário calculado pela tábua do IBGE (Instituto Brasileiro de Geografia e Estatística) vigente na DER (data de entrada do requerimento).\nTema 102 (FAVORÁVEL; transitado): Os efeitos da revisão da RMI (renda mensal inicial) retroagem à DER.\nTema 117 (FAVORÁVEL; transitado): Revisão do auxílio-doença calculado pela MP (Medida Provisória) 242/2005.\nTema 119 (FAVORÁVEL; transitado): Direito adquirido ao cálculo da Lei 6.950/81, inclusive com DIB (data de início do benefício) no buraco negro.\nTema 134 (NEUTRO; transitado): Art. 29, II: decadência contada do benefício originário, com prazos reabertos pelo Memorando 21/2010.\nTema 138 (NEUTRO; transitado): Art. 21, § 3º, da Lei 8.880 exige redução pelo teto.\nTema 149 (ADVERSO; transitado): Incide fator previdenciário na aposentadoria do professor, salvo requisitos cumpridos antes da Lei 9.876/99.\nTema 200 (FAVORÁVEL; transitado): A prescrição não flui durante a reclamação trabalhista que gerou a revisão.\nTema 203 (ADVERSO; transitado): O divisor mínimo da Lei 9.876, art. 3º, § 2º, independe do número de contribuições.\nTema 375 (ADVERSO; transitado): IRSM/94: decadência não interrompida pela MP 201/2004 (supera o Tema 130).\nSúmula 1 (sem sinal na fonte): Conversão dos benefícios em URV (Unidade Real de Valor), em março de 1994, pelo art. 20, I e II, da Lei 8.880/94.\nSúmula 2 (sem sinal na fonte): Reajuste de maio de 1996 pela MP 1.415/96, convertida na Lei 9.711/98.\nSúmula 8 (sem sinal na fonte): Sem reajuste pelo IGP-DI (Índice Geral de Preços, Disponibilidade Interna) em 1997, 1999, 2000 e 2001.\nSúmula 19 (sem sinal na fonte): Atualização dos salários de contribuição anteriores a março de 1994 com o IRSM (Índice de Reajuste do Salário Mínimo) integral de fevereiro de 1994 (39,67%).\nSúmula 21 (sem sinal na fonte): Sem direito adquirido a reajuste pelo IPC (Índice de Preços ao Consumidor) de janeiro de 1989 e abril de 1990.\nSúmula 25 (sem sinal na fonte): Revisão do art. 58 do ADCT (Ato das Disposições Constitucionais Transitórias) pelo número de salários mínimos da data da concessão.\nSúmula 33 (sem sinal na fonte): Preenchidos os requisitos na DER, ela é o termo inicial da aposentadoria por tempo de serviço.\nSúmula 38 (sem sinal na fonte): Tabela de Cálculos de Santa Catarina aplicada subsidiariamente na revisão OTN/ORTN (Obrigações do Tesouro Nacional e Obrigações Reajustáveis do Tesouro Nacional).\nSúmula 57 (sem sinal na fonte): Auxílio-doença e aposentadoria por invalidez sob a Lei 9.876 pela média dos 80% maiores salários, qualquer que seja a filiação.\nSúmula 65 (FAVORÁVEL): Benefícios por incapacidade de 28/03/2005 a 20/07/2005 calculados sem a MP 242/2005.\nSúmula 67 (sem sinal na fonte): Auxílio-alimentação pago em dinheiro integra o salário de contribuição.\nSúmula 83 (sem sinal na fonte): Desde a Lei 8.870/94, o décimo terceiro não integra o salário de contribuição para o salário de benefício.\nNão citar: Tema 130 (superado pelo Tema 375); Tema 392 (em julgamento, sem tese); Súmula 3 (cancelada em 2003); Súmula 60 (cancelada em 2016).", "fonte": "TNU, temas representativos e súmulas", "origem": "tnu-inventario-sinais.md v1.1; catalogo-temas-vinculantes.md v1.15 §4; catalogo-temas-vinculantes-2.md v1.0 §4; 04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md; 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md", "sinal": "firme", "ficha": true}, {"id": "tnu-a22", "tema": "TNU: temas e súmulas por assunto", "pergunta": "Quais temas e súmulas da TNU tratam de decadência e prescrição?", "variantes": ["TNU decadência e prescrição", "tema TNU decadência", "súmula TNU decadência", "jurisprudência do Juizado sobre decadência e prescrição", "tema TNU prescrição", "súmula TNU prescrição", "Turma Nacional decadência e prescrição"], "resposta": "Temas representativos e súmulas da TNU (Turma Nacional de Uniformização) sobre decadência e prescrição, com sinal ao segurado e status na data da fonte (temas: repositório de 16/10/2026 e catálogo; súmulas: lista oficial de 24/10/2026):\nTema 57 (FAVORÁVEL; transitado): Não há prescrição do fundo de direito após a cessação do auxílio-doença.\nTema 81 (FAVORÁVEL; transitado): O prazo do art. 74, II, não corre contra o menor impúbere.\nTema 86 (FAVORÁVEL; transitado): Requerimento tardio não prejudica o absolutamente incapaz.\nTema 103 (FAVORÁVEL; transitado): A prescrição não corre entre o requerimento e a ciência da decisão.\nTema 134 (NEUTRO; transitado): Art. 29, II: decadência contada do benefício originário, com prazos reabertos pelo Memorando 21/2010.\nTema 135 (ADVERSO; transitado): Decadência decenal alcança benefícios anteriores à MP (Medida Provisória) 1.523/1997.\nTema 200 (FAVORÁVEL; transitado): A prescrição não flui durante a reclamação trabalhista que gerou a revisão.\nTema 223 (ADVERSO; transitado): Absolutamente incapaz com outro dependente já habilitado recebe desde o requerimento.\nTema 283 (NEUTRO; transitado): Coisa julgada administrativa não impede o Judiciário nem a revisão dentro da decadência.\nTema 375 (ADVERSO; transitado): IRSM/94: decadência não interrompida pela MP 201/2004 (supera o Tema 130).\nSúmula 74 (sem sinal na fonte): A prescrição fica suspensa pelo requerimento administrativo e volta a correr pelo saldo após a ciência da decisão final.\nSúmula 81 (sem sinal na fonte; alterada em 09/12/2020): Impugnação de indeferimento, cessação ou cancelamento não se submete a prazo extintivo.\nNão citar: Tema 130 (superado pelo Tema 375); Súmula 64 (cancelada em 2015).", "fonte": "TNU, temas representativos e súmulas", "origem": "tnu-inventario-sinais.md v1.1; 04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md; 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md", "sinal": "firme", "ficha": true}, {"id": "tnu-a23", "tema": "TNU: temas e súmulas por assunto", "pergunta": "Quais temas e súmulas da TNU tratam de processo no Juizado: prévio requerimento, pedido de uniformização e honorários?", "variantes": ["TNU processo no Juizado", "tema TNU prévio requerimento", "súmula TNU prévio requerimento", "jurisprudência do Juizado sobre processo no Juizado", "tema TNU uniformização", "súmula TNU uniformização", "Turma Nacional processo no Juizado"], "resposta": "Temas representativos e súmulas da TNU (Turma Nacional de Uniformização) sobre processo no Juizado: prévio requerimento, pedido de uniformização e honorários, com sinal ao segurado e status na data da fonte (temas: repositório de 16/10/2026 e catálogo; súmulas: lista oficial de 24/10/2026):\nTema 13 (FAVORÁVEL; transitado): Sem prévio pedido de revisão quando o INSS (Instituto Nacional do Seguro Social) omitiu o tempo especial.\nTema 47 (FAVORÁVEL; transitado): Herdeiros sucedem o autor falecido na ação de benefício por incapacidade.\nTema 94 (NEUTRO; transitado): O Juizado Especial Estadual é absolutamente incompetente para causa previdenciária.\nTema 217 (FAVORÁVEL; transitado): Fungibilidade em juízo entre BPC (benefício de prestação continuada) e benefícios por incapacidade.\nTema 277 (ADVERSO; transitado): Na alta programada, a ação exige antes pedido de prorrogação, recurso ou reconsideração, quando previstos; sem isso, falta interesse de agir.\nTema 283 (NEUTRO; transitado): Coisa julgada administrativa não impede o Judiciário nem a revisão dentro da decadência.\nSúmula 7 (sem sinal na fonte): Não cabe incidente de uniformização sobre honorários advocatícios, questão processual.\nSúmula 17 (sem sinal na fonte): Não há renúncia tácita no Juizado Especial Federal para fins de competência.\nSúmula 42 (sem sinal na fonte): Não se conhece de incidente de uniformização que implique reexame de fato.\nSúmula 43 (sem sinal na fonte): Não cabe incidente de uniformização sobre matéria processual.\nNão citar: Súmula 51 (cancelada em 2017); Súmula 61 (cancelada em 2013); Súmula 86 (cancelada em 2021).", "fonte": "TNU, temas representativos e súmulas", "origem": "tnu-inventario-sinais.md v1.1; catalogo-temas-vinculantes.md v1.15 §4; 04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md; 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md", "sinal": "firme", "ficha": true}, {"id": "tnu-a24", "tema": "TNU: temas e súmulas por assunto", "pergunta": "Quais temas e súmulas da TNU tratam de auxílio-reclusão?", "variantes": ["TNU auxílio-reclusão", "tema TNU auxílio-reclusão", "súmula TNU auxílio-reclusão", "jurisprudência do Juizado sobre auxílio-reclusão", "tema TNU baixa renda", "súmula TNU baixa renda", "Turma Nacional auxílio-reclusão"], "resposta": "Temas representativos e súmulas da TNU (Turma Nacional de Uniformização) sobre auxílio-reclusão, com sinal ao segurado e status na data da fonte (temas: repositório de 16/10/2026 e catálogo; súmulas: lista oficial de 24/10/2026):\nTema 169 (FAVORÁVEL; transitado): Baixa renda do auxílio-reclusão flexibilizada quando o excesso é irrisório.\nTema 310 (ADVERSO; transitado): Baixa renda do auxílio-reclusão calculada só com os salários existentes.\nTema 357 (FAVORÁVEL; transitado): Auxílio-reclusão anterior à MP (Medida Provisória) 871 mantido no regime semiaberto.", "fonte": "TNU, temas representativos e súmulas", "origem": "tnu-inventario-sinais.md v1.1; 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md", "sinal": "firme", "ficha": true}, {"id": "tnu-t1", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 1 da TNU?", "variantes": ["tema 1", "TNU 1", "tema 1 TNU", "art. 29 II", "80% maiores"], "resposta": "O valor da aposentadoria por invalidez e do auxílio-doença, bem como das pensões destes derivados ou calculadas com base no art. 75, da Lei n. 8.213/91, será obtido, na forma do art. 29, II, do mesmo diploma, por meio da média aritmética simples dos 80% maiores salários de contribuição, considerado todo o período contributivo, independentemente do momento de inscrição do segurado e do número de contribuições mensais do período contributivo.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 02/08/2011; transitado em julgado em 05/10/2011 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 1 (PEDILEF 2009.51.51.066212-3/RJ)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t2", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 2 da TNU?", "variantes": ["tema 2", "TNU 2", "tema 2 TNU", "certidão de casamento", "prova material"], "resposta": "No caso de aposentadoria por idade rural, a certidão de casamento vale como início de prova material, ainda que extemporânea.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 06/09/2011; transitado em julgado em 18/10/2011 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 2 (PEDILEF 2006.82.01.505208-4/ PB)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t3", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 3 da TNU?", "variantes": ["tema 3", "TNU 3", "tema 3 TNU", "prova não contemporânea", "prova testemunhal"], "resposta": "No caso de aposentadoria por idade rural, é dispensável a existência de prova documental contemporânea, podendo ser estendida a outros períodos através de robusta prova testemunhal.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 06/09/2011; transitado em julgado em 20/10/2011 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 3 (PEDILEF 2005.81.10.001065-3/ CE)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t4", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 4 da TNU?", "variantes": ["tema 4", "TNU 4", "tema 4 TNU", "alta programada", "restabelecimento"], "resposta": "É devido o restabelecimento do auxílio-doença nas hipóteses conhecidas por “alta programada”, independentemente de prévio pedido administrativo de prorrogação. VIDE TEMA 164/TNU\nSinal: NEUTRO.\nStatus: transitado; julgado em 06/09/2011; transitado em julgado em 17/08/2012 (conferido em 16/10/2026).\nAtenção: A própria tese remete ao Tema 164 (\"VIDE TEMA 164/TNU\"); só aproveitável para fatos anteriores à MP (Medida Provisória) 767/2017.", "fonte": "TNU, Tema representativo 4 (PEDILEF 2007.70.50.016551-5/ PR)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t7", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 7 da TNU?", "variantes": ["tema 7", "TNU 7", "tema 7 TNU", "universitário", "21 anos"], "resposta": "É indevida a prorrogação da pensão por morte ao filho maior de 21 anos, ainda que esteja cursando o ensino superior.\nSinal: ADVERSO.\nStatus: transitado; julgado em 06/09/2011; transitado em julgado em 25/10/2011 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 7 (PEDILEF 2005.63.11.006938-1/ SP)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t10", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 10 da TNU?", "variantes": ["tema 10", "TNU 10", "tema 10 TNU", "renovação", "requerimento"], "resposta": "O ajuizamento de ações visando o recebimento do benefício previsto no art. 203, V, da Constituição Federal não exige a renovação bienal do requerimento administrativo, afastada a indevida analogia ao art. 21, da Lei n. 8.742/93. RE (recurso extraordinário) 914797 - DECISÃO STF (Supremo Tribunal Federal): determino a devolução dos autos ao Juízo de origem para que seja observada a decisão do Supremo no precedente RE 631.240 - TEMA 350.\nSinal: NEUTRO.\nStatus: transitado; julgado em 02/08/2011; transitado em julgado em 12/09/2018 (conferido em 16/10/2026).\nAtenção: O STF devolveu a matéria pelo Tema 350.", "fonte": "TNU, Tema representativo 10 (PEDILEF 0504108- 62.2009.4.05.8200/ PB)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "controvertido"}, {"id": "tnu-t11", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 11 da TNU?", "variantes": ["tema 11", "TNU 11", "tema 11 TNU", "segurada especial", "prova material"], "resposta": "A exigência de início de prova material contemporânea para concessão do salário-maternidade à segurada especial pode ser flexibilizada. Vide Tema 17.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 11/10/2011; transitado em julgado em 18/11/2011 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 11 (PEDILEF 2009.32.00.704394-5/ AM)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t13", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 13 da TNU?", "variantes": ["tema 13", "TNU 13", "tema 13 TNU", "prévio pedido de revisão", "especial omitido"], "resposta": "É dispensável prévio requerimento administrativo de revisão de aposentadoria por tempo de contribuição quando houver omissão da autarquia na análise do tempo especial anterior à Lei n. 9.032/95.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 11/10/2011; transitado em julgado em 18/11/2011 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 13 (PEDILEF 2009.72.51.000312-4/ SC)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t14", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 14 da TNU?", "variantes": ["tema 14", "TNU 14", "tema 14 TNU", "laudo extemporâneo", "laudo"], "resposta": "Na aposentadoria especial a apresentação de laudo pericial extemporâneo não afasta sua força probante, desde que não modificadas as condições do ambiente. Vide Súmula 68 da TNU (Turma Nacional de Uniformização).\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 11/10/2011, trânsito em 18/11/2011 (conferido em 14/10/2026).", "fonte": "TNU, Tema representativo 14 (PEDILEF 2008.72.59.003073-0/SC)", "origem": "catalogo-temas-vinculantes.md v1.15, §4 e §7", "sinal": "firme"}, {"id": "tnu-t17", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 17 da TNU?", "variantes": ["tema 17", "TNU 17", "tema 17 TNU", "segurada especial", "prova material"], "resposta": "A exigência de início de prova material para concessão do salário-maternidade à segurada especial pode ser flexibilizada. Vide Tema 11.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 11/10/2011; transitado em julgado em 18/11/2011 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 17 (PEDILEF 2009.32.00.704394-5/ AM)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t18", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 18 da TNU?", "variantes": ["tema 18", "TNU 18", "tema 18 TNU", "imóvel do grupo familiar", "prova material"], "resposta": "A certidão do INCRA ou outro documento que comprove propriedade de imóvel em nome de integrantes do grupo familiar do segurado é razoável início de prova material da condição de segurado especial para fins de aposentadoria rural por idade, inclusive dos períodos trabalhados a partir dos 12 anos de idade, antes da publicação da Lei n. 8.213/91. Desnecessidade de comprovação de todo o período de carência.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 11/10/2011; transitado em julgado em 18/11/2011 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 18 (PEDILEF 2009.71.95.000509-1/ RS)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t19", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 19 da TNU?", "variantes": ["tema 19", "TNU 19", "tema 19 TNU", "desemprego involuntário", "CTPS"], "resposta": "É possível comprovar a condição de desemprego involuntário por outros meios de prova diversos do registro no Ministério do Trabalho, não sendo a ausência de vínculo na CTPS (Carteira de Trabalho e Previdência Social) suficiente para tanto. Vide Súmula 27 da TNU (Turma Nacional de Uniformização).\nSinal: NEUTRO.\nStatus: transitado; julgado em 06/09/2011; transitado em julgado em 06/12/2011 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 19 (PEDILEF 2008.33.00.700541-2/ BA)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t21", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 21 da TNU?", "variantes": ["tema 21", "TNU 21", "tema 21 TNU", "imediatamente anterior", "idade rural"], "resposta": "Para a obtenção de aposentadoria por idade do segurado especial, é indispensável o exercício e a demonstração da atividade rural correspondente à carência no período imediatamente anterior ao implemento da idade mínima ou à data do requerimento administrativo. Vide Tema 145 da TNU (Turma Nacional de Uniformização).\nSinal: ADVERSO.\nStatus: transitado; julgado em 11/10/2011; trânsito em julgado em 06/12/2011 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 21 (PEDILEF 2006.71.95.008818-9/RS)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t23", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 23 da TNU?", "variantes": ["tema 23", "TNU 23", "tema 23 TNU", "trabalho urbano do marido", "segurada especial"], "resposta": "A condição de segurada especial em regime de economia familiar não é descaracterizada pelo trabalho urbano do marido da autora ou mesmo pela paga, posterior, de pensão alimentícia, em razão de separação.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 10/11/2011; trânsito em julgado em 06/12/2011 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 23 (PEDILEF 2008.72.50.003366-8/SC)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t25", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 25 da TNU?", "variantes": ["tema 25", "TNU 25", "tema 25 TNU", "tábua do IBGE", "fator previdenciário"], "resposta": "Para o cálculo do fator previdenciário deve ser observada a tábua de mortalidade elaborada pelo IBGE (Instituto Brasileiro de Geografia e Estatística) vigente na data do requerimento do benefício previdenciário, e não aquela utilizada anteriormente, quando preenchidos os requisitos necessários à concessão da aposentadoria.\nSinal: ADVERSO.\nStatus: transitado; julgado em 11/10/2011; trânsito em julgado em 13/12/2011 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 25 (PEDILEF 2005.82.00.505195-9/PB)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t27", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 27 da TNU?", "variantes": ["tema 27", "TNU 27", "tema 27 TNU", "art. 142", "ano da idade"], "resposta": "Aplica-se a tabela progressiva prevista no art. 142 da Lei n. 8.213/91, no caso de aposentadoria por idade urbana, considerando-se como marco temporal para apuração da carência o ano em que o segurado completa a idade mínima, ainda que contadas contribuições posteriores ao ano do cumprimento do requisito etário. Vide Súmula 44 da TNU (Turma Nacional de Uniformização).\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 24/11/2011; trânsito em julgado em 17/01/2012 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 27 (PEDILEF 0022551-92.2008.4.01.3600/MT)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t28", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 28 da TNU?", "variantes": ["tema 28", "TNU 28", "tema 28 TNU", "RE 597389", "coisa julgada"], "resposta": "Não se aplica orientação firmada no RE (recurso extraordinário) 597389/ SP, no cálculo dos benefícios concedidos antes da Lei n. 9.032/95, cujas sentenças transitaram em julgado quando do pronunciamento do STF (Supremo Tribunal Federal). Vide Tema 90.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 24/11/2011; trânsito em julgado em 05/06/2012 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 28 (PEDILEF 2007.72.95.008821-4/SC)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t29", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 29 da TNU?", "variantes": ["tema 29", "TNU 29", "tema 29 TNU", "doméstica", "recolhimento tardio"], "resposta": "O recolhimento tardio de contribuições a cargo do empregador não implica prejuízo de ordem previdenciária à segurada empregada doméstica.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 24/11/2011; trânsito em julgado em 24/01/2012 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 29 (PEDILEF 2008.70.50.01.8498-8/PR)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t32", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 32 da TNU?", "variantes": ["tema 32", "TNU 32", "tema 32 TNU", "certidão de óbito", "prova material"], "resposta": "Certidão de óbito configura início de prova material para caracterização da atividade rural, para fins de pensão por morte.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 24/11/2011; trânsito em julgado em 24/01/2012 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 32 (PEDILEF 2007.83.04.501228-9/PE)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t33", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 33 da TNU?", "variantes": ["tema 33", "TNU 33", "tema 33 TNU", "empresário", "habitualidade"], "resposta": "A habitualidade e permanência da exposição ao agente nocivo ruído, devidamente comprovadas por laudo pericial, presumem-se no caso de segurado contribuinte individual empresário.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 29/02/2012; trânsito em julgado em 15/08/2012 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 33 (PEDILEF 2009.71.95.001907-7/RS)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t34", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 34 da TNU?", "variantes": ["tema 34", "TNU 34", "tema 34 TNU", "incapacidade parcial", "condições pessoais"], "resposta": "Para a concessão do benefício previsto no art. 203, V, da Constituição Federal, nos casos de incapacidade parcial e temporária, deve-se examinar as condições pessoais do requerente.\nSinal: FAVORÁVEL.\nStatus: sem datas na fonte; sem data de julgamento/trânsito no repositório (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 34 (PEDILEF 0013826-53.2008.4.01.3200/AM)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "controvertido"}, {"id": "tnu-t36", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 36 da TNU?", "variantes": ["tema 36", "TNU 36", "tema 36 TNU", "condições pessoais", "sem incapacidade"], "resposta": "Na concessão do auxílio-doença é dispensável o exame das condições pessoais do segurado quando não constatada a incapacidade laboral. Vide Súmula 77 da TNU (Turma Nacional de Uniformização).\nSinal: ADVERSO.\nStatus: transitado; julgado em 07/08/2013; trânsito em julgado em 02/12/2013 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 36 (PEDILEF 0052862-57.2008.4.03.6301/SP)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t37", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 37 da TNU?", "variantes": ["tema 37", "TNU 37", "tema 37 TNU", "atividade urbana intercalada", "aposentadoria rural"], "resposta": "Não afasta o direito à aposentadoria por idade rural o exercício de atividade urbana intercalada ou breves períodos descontínuos de atividade rural. Vide Súmula 46 da TNU (Turma Nacional de Uniformização).\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 29/02/2012; trânsito em julgado em 17/04/2012 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 37 (PEDILEF 0500000-29.2005.4.05.8103/CE)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t38", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 38 da TNU?", "variantes": ["tema 38", "TNU 38", "tema 38 TNU", "incapacidade preexistente", "reingresso"], "resposta": "A incapacidade laboral preeexistente veda a concessão de auxílio-doença e aposentadoria por invalidez, mesmo nos casos de reingresso no RGPS (Regime Geral de Previdência Social). Vide Súmula 53 da TNU (Turma Nacional de Uniformização).\nSinal: ADVERSO.\nStatus: transitado; julgado em 29/03/2012; trânsito em julgado em 01/10/2012 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 38 (PEDILEF 2009.33.00.705098-0/BA)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t39", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 39 da TNU?", "variantes": ["tema 39", "TNU 39", "tema 39 TNU", "rurícola", "requisitos no óbito"], "resposta": "Para a concessão de pensão por morte de rurícola é necessário que o instituidor tenha, na data do óbito, a qualidade de segurado ou tenha implementado, antes de falecer, todos os requisitos para a concessão de aposentadoria por idade rural, tanto a carência quanto a idade mínima.\nSinal: ADVERSO.\nStatus: transitado; julgado em 29/03/2012; trânsito em julgado em 08/05/2012 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 39 (PEDILEF 0506910-51.2005.4.05.8013/AL)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t40", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 40 da TNU?", "variantes": ["tema 40", "TNU 40", "tema 40 TNU", "incapacidade preexistente", "reingresso"], "resposta": "A incapacidade laboral preeexistente veda a concessão de auxílio-doença e aposentadoria por invalidez, mesmo nos casos de reingresso no RGPS (Regime Geral de Previdência Social). Vide Súmula 53 da TNU (Turma Nacional de Uniformização).\nSinal: ADVERSO.\nStatus: transitado; julgado em 29/03/2012; transitado em julgado em 08/05/2012 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 40 (PEDILEF 0010516-35.2006.4.03.6310/ SP)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t41", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 41 da TNU?", "variantes": ["tema 41", "TNU 41", "tema 41 TNU", "fator 1,4", "homem"], "resposta": "Na aposentadoria por tempo de contribuição, o fator de conversão 1,4 (um vírgula quatro), para os homens, é aplicável em qualquer período.\nSinal: FAVORÁVEL.\nStatus: sem datas na fonte; sem data de julgamento/trânsito no repositório (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 41 (PEDILEF 2007.72.95.003208-7/ SC)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "controvertido"}, {"id": "tnu-t45", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 45 da TNU?", "variantes": ["tema 45", "TNU 45", "tema 45 TNU", "ex-cônjuge", "dependência superveniente"], "resposta": "É devida pensão por morte ao ex-cônjuge que não percebe alimentos, desde que comprovada dependência econômica superveniente à separação, demonstrada em momento anterior ao óbito.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 25/04/2012; transitado em julgado em 02/08/2013 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 45 (PEDILEF 2006.84.00.509436-0/RN)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t47", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 47 da TNU?", "variantes": ["tema 47", "TNU 47", "tema 47 TNU", "herdeiros", "sucessão processual"], "resposta": "Os herdeiros detêm legitimidade, por sucessão processual, para prosseguir no feito do autor falecido, nos casos de concessão de benefício por incapacidade.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 25/04/2012; transitado em julgado em 12/06/2012 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 47 (PEDILEF 0014195-33.2007.4.03.6302/ SP)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t53", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 53 da TNU?", "variantes": ["tema 53", "TNU 53", "tema 53 TNU", "óleos e graxas", "manipulação"], "resposta": "A manipulação de óleos e graxas, desde que devidamente comprovado, configura atividade especial. VIDE TEMA 298/TNU\nSinal: FAVORÁVEL (ler com o Tema 298).\nStatus: transitado; julgado em 15/05/2012, trânsito em 09/07/2012 (conferido em 21/10/2026).\nAtenção: A partir do Decreto 2.172/97, o Tema 298 exige especificar o agente nocivo.", "fonte": "TNU, Tema representativo 53 (PEDILEF 2009.71.95.001828-0/RS)", "origem": "catalogo-temas-vinculantes.md v1.15, §4 e §7", "sinal": "firme"}, {"id": "tnu-t54", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 54 da TNU?", "variantes": ["tema 54", "TNU 54", "tema 54 TNU", "16 anos", "segurado especial"], "resposta": "A exigência etária de no mínimo 16 anos, para caracterização da qualidade de segurado especial, só se aplica ao filho do produtor rural ou pescador artesanal, não se estendendo a seu cônjuge ou companheiro que exerçam atividade rural em regime de economia familiar.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 27/06/2012; transitado em julgado em 24/07/2012 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 54 (PEDILEF 2009.70.61.000792-5/ PR)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t56", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 56 da TNU?", "variantes": ["tema 56", "TNU 56", "tema 56 TNU", "engenheiro mecânico", "categoria profissional"], "resposta": "O tempo de serviço laborado pelo segurado na condição de engenheiro mecânico até a edição da Lei n. 9.032/95 deve ser enquadrado como especial, conforme descrito no código 2.1.1 do Anexo II do Decreto n. 83.080/79.\nSinal: FAVORÁVEL.\nStatus: transitado; transitado em julgado em 17/07/2012 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 56 (PEDILEF 0505355-94.2008.4.05.8400/ RN)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t57", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 57 da TNU?", "variantes": ["tema 57", "TNU 57", "tema 57 TNU", "fundo de direito", "cessação"], "resposta": "Não ocorre prescrição do fundo de direito quando, entre o cancelamento administrativo do auxílio-doença e o ajuizamento da ação, decorrem mais de 5 anos.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 25/04/2012; transitado em julgado em 24/07/2012 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 57 (PEDILEF 0508032-49.2007.4.05.8201/PB)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t63", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 63 da TNU?", "variantes": ["tema 63", "TNU 63", "tema 63 TNU", "rural posterior a 1991", "carência"], "resposta": "O tempo de serviço rural posterior à Lei n. 8.213/91, para efeitos de carência, demanda o recolhimento de contribuições previdenciárias.\nSinal: ADVERSO.\nStatus: transitado; julgado em 27/06/2012; trânsito em julgado em 14/08/2012 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 63 (PEDILEF 2007.50.50.009140-9/ES)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t68", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 68 da TNU?", "variantes": ["tema 68", "TNU 68", "tema 68 TNU", "motorista", "tratorista"], "resposta": "É possível a equiparação da atividade de motorista à de tratorista para fins de contagem de tempo de atividade especial, por categoria profissional. VIDE SÚMULA 70/TNU.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 27/06/2012; trânsito em julgado em 04/09/2012 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 68 (PEDILEF 2009.50.53.000401-9/ES)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t70", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 70 da TNU?", "variantes": ["tema 70", "TNU 70", "tema 70 TNU", "HIV assintomático", "estigma"], "resposta": "Na concessão do benefício de prestação continuada ao portador do vírus HIV (vírus da imunodeficiência humana) assintomático, devem ser observadas, além da incapacidade de prover a própria subsistência, as condições socioculturais estigmatizantes da doença. Vide Súmula 78 da TNU (Turma Nacional de Uniformização).\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 16/08/2012; trânsito em julgado em 19/09/2012 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 70 (PEDILEF 0503863-51.2009.4.05.8103/CE)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t73", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 73 da TNU?", "variantes": ["tema 73", "TNU 73", "tema 73 TNU", "grupo familiar", "art. 16"], "resposta": "O grupo familiar deve ser definido a partir da interpretação restrita do disposto no art. 16 da Lei n. 8.213/91 e no art. 20 da Lei n. 8.742/93, esta última na sua redação original.\nSinal: NEUTRO.\nStatus: sem datas na fonte; sem data de julgamento/trânsito no repositório (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 73 (PEDILEF 2006.63.01.052381-5/SP)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "controvertido"}, {"id": "tnu-t81", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 81 da TNU?", "variantes": ["tema 81", "TNU 81", "tema 81 TNU", "menor impúbere", "art. 74"], "resposta": "Contra os menores impúberes não corre o prazo do art. 74, II, da Lei n. 8.213/91 (art. 198, I, CC/02), devendo o benefício de pensão por morte ser deferido a partir do óbito do instituidor, observada sua quota parte e também a disposição do artigo 77, §1º da Lei n. 8.213/91.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 16/08/2012; trânsito em julgado em 30/10/2012 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 81 (PEDILEF 0508581-62.2007.4.05.8200/PB)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t85", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 85 da TNU?", "variantes": ["tema 85", "TNU 85", "tema 85 TNU", "aposentadoria", "Lei 9.528"], "resposta": "A cumulação de auxílio-acidente com aposentadoria somente é possível quando a eclosão da lesão incapacitante que ensejou aquele primeiro benefício e o início daquele segundo tenha ocorrido antes da alteração do art. 86 da Lei n. 8.213/91 pela Lei n. 9.528/97.\nSinal: ADVERSO.\nStatus: transitado; julgado em 17/10/2012; trânsito em julgado em 13/11/2012 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 85 (PEDILEF 2008.71.60.002693-3/RS)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t86", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 86 da TNU?", "variantes": ["tema 86", "TNU 86", "tema 86 TNU", "absolutamente incapaz", "requerimento tardio"], "resposta": "O requerimento tardio não prejudica o direito do absolutamente incapaz à percepção integral do benefício, a partir da data do óbito, enquanto não sobrevier a habilitação de dependente de outra classe.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 11/09/2012; trânsito em julgado em 13/11/2012 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 86 (PEDILEF 2010.72.54.002923-3/SC)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t87", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 87 da TNU?", "variantes": ["tema 87", "TNU 87", "tema 87 TNU", "vigilante armado", "laudo"], "resposta": "É possível o reconhecimento de tempo especial prestado com exposição ao agente nocivo periculosidade, na atividade de vigilante, em data posterior à vigência do Decreto n. 2.172/92, de 05/03/1997, desde que laudo técnico (ou elemento material equivalente) comprove a permanente exposição à atividade nociva, com o uso de arma de fogo. Vide Tema 128 (em revisão pelo Tema 1031/STJ).\nSinal: NEUTRO.\nStatus: transitado, em revisão; julgado em 17/10/2012; trânsito em julgado em 27/11/2012 (conferido em 16/10/2026).\nAtenção: A fonte registra o tema em revisão pelo STJ (Superior Tribunal de Justiça) Tema 1031; o catálogo registra o STF (Supremo Tribunal Federal) Tema 1209 contra a especialidade do vigilante, com ou sem arma.", "fonte": "TNU, Tema representativo 87 (PEDILEF 2009.72.60.000443-9/SC)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "controvertido"}, {"id": "tnu-t90", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 90 da TNU?", "variantes": ["tema 90", "TNU 90", "tema 90 TNU", "RE 597389", "coisa julgada"], "resposta": "Não se aplica orientação firmada no RE (recurso extraordinário) 597389/SP , no cálculo dos benefícios concedidos antes da n. Lei 9.032/95, cujas sentenças transitaram em julgado quando pronunciamento do STF (Supremo Tribunal Federal), ressalvado os casos previstos no art. 475, \"l\", parágrafo 1º, do CPC (Código de Processo Civil) revogado. Vide Tema 28.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 19/12/2012; trânsito em julgado em 26/11/2013 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 90 (PEDILEF 2008.32.00.702790-2/AM)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t93", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 93 da TNU?", "variantes": ["tema 93", "TNU 93", "tema 93 TNU", "DIB na DER", "Súmula 33"], "resposta": "Inteligência da Súmula 33 da TNU (Turma Nacional de Uniformização): Quando o segurado houver preenchido os requisitos legais para concessão da aposentadoria por tempo de serviço na data do requerimento administrativo, esta data será o termo inicial da concessão do benefício.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 06/12/2012; trânsito em julgado em 19/02/2013 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 93 (PEDILEF 0028122-71.2004.4.03.6302/SP)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t94", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 94 da TNU?", "variantes": ["tema 94", "TNU 94", "tema 94 TNU", "Juizado estadual", "incompetência"], "resposta": "É absoluta a incompetência do Juizado Especial Cível Estadual para o processamento e julgamento das causas previdenciárias, por expressa vedação legal à aplicação da Lei n. 10.259/2001 no âmbito do juízo estadual.\nSinal: NEUTRO.\nStatus: transitado; julgado em 17/10/2012; trânsito em julgado em 15/04/2013 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 94 (PEDILEF 2005.37.00.749443-3/MA)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t100", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 100 da TNU?", "variantes": ["tema 100", "TNU 100", "tema 100 TNU", "limpeza hospitalar", "código 1.3.2"], "resposta": "O código 1.3.2 do quadro anexo ao Decreto n. 53.831/64, além dos profissionais da área da saúde, contempla os trabalhadores que exercem atividades de serviços gerais em limpeza e higienização de ambientes hospitalares (Súmula 82 da TNU (Turma Nacional de Uniformização)). Vide Tema 238/TNU.\nSinal: FAVORÁVEL (só até 28/04/1995; depois, Tema 238 e Súmula 82).\nStatus: transitado; julgado em 17/04/2013, trânsito em 08/05/2013 (conferido em 14/10/2026).\nAtenção: A redação do portal não está no acórdão: o PEDILEF (pedido de uniformização de interpretação de lei federal) reconhece a especialidade pelo código 1.3.2 antes de 28/04/1995 e exige habitualidade e permanência depois da Lei 9.032/95.", "fonte": "TNU, Tema representativo 100 (PEDILEF 5002734-80.2012.4.04.7011/PR)", "origem": "catalogo-temas-vinculantes.md v1.15, §4 e §7", "sinal": "firme"}, {"id": "tnu-t102", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 102 da TNU?", "variantes": ["tema 102", "TNU 102", "tema 102 TNU", "efeitos da revisão", "DER"], "resposta": "Os efeitos financeiros da revisão da RMI (renda mensal inicial) de benefício previdenciário devem retroagir à data do requerimento administrativo do próprio benefício, e não à data do pedido revisional.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 17/04/2013; trânsito em julgado em 08/05/2013 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 102 (PEDILEF 2009.72.55.008009-9/SC)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t103", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 103 da TNU?", "variantes": ["tema 103", "TNU 103", "tema 103 TNU", "suspensão da prescrição", "requerimento"], "resposta": "Não corre a prescrição entre a data do protocolo do requerimento administrativo e a comunicação da decisão ao interessado. Vide Súmula n. 74 da TNU (Turma Nacional de Uniformização).\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 17/04/2013; trânsito em julgado em 13/05/2013 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 103 (PEDILEF 0502234-79.2008.4.05.8102/CE)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t105", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 105 da TNU?", "variantes": ["tema 105", "TNU 105", "tema 105 TNU", "benefício intercalado", "carência"], "resposta": "A contagem do tempo de gozo de benefício por incapacidade é admissível para fins de carência, quando intercalado com períodos de contribuição.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 06/12/2012; trânsito em julgado em 03/06/2013 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 105 (PEDILEF 0047837-63.2008.4.03.6301/SP)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t106", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 106 da TNU?", "variantes": ["tema 106", "TNU 106", "tema 106 TNU", "revisão administrativa", "benefício judicial"], "resposta": "A concessão judicial de benefício por incapacidade não impede a revisão administrativa pelo INSS (Instituto Nacional do Seguro Social), na forma prevista em norma regulamentadora, mesmo durante o curso da demanda judicial.\nSinal: ADVERSO.\nStatus: transitado; julgado em 17/05/2013; trânsito em julgado em 24/06/2013 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 106 (PEDILEF 5000525-23.2012.4.04.7114/RS)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t113", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 113 da TNU?", "variantes": ["tema 113", "TNU 113", "tema 113 TNU", "desempregada", "pagamento pela Previdência"], "resposta": "O salário-maternidade é devido mesmo nos casos de desemprego da gestante, hipótese em que deverá ser pago diretamente pela Previdência Social.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 18/11/2013; transitado em julgado em 03/12/2013 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 113 (PEDILEF 2010.71.58.004921-6/RS)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t114", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 114 da TNU?", "variantes": ["tema 114", "TNU 114", "tema 114 TNU", "filho inválido", "presunção relativa"], "resposta": "Para fins previdenciários, a presunção de dependência econômica do filho inválido é relativa, motivo pelo qual fica afastada quando este auferir renda própria, devendo ela ser comprovada.\nSinal: ADVERSO.\nStatus: transitado; julgado em 13/11/2013; transitado em julgado em 13/01/2014 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 114 (PEDILEF 0500518-97.2011.4.05.8300/PE)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t115", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 115 da TNU?", "variantes": ["tema 115", "TNU 115", "tema 115 TNU", "ramo do empregador", "natureza rural"], "resposta": "Não é ramo de exploração de atividade econômica do empregador que define a natureza do trabalho desempenhado pelo empregado, se rural ou urbano, para fins de concessão do benefício previdenciário de aposentadoria.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 13/11/2013; transitado em julgado em 03/02/2014 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 115 (PEDILEF 2009.39.00.701490-8/PA)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t117", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 117 da TNU?", "variantes": ["tema 117", "TNU 117", "tema 117 TNU", "MP 242/2005", "auxílio-doença"], "resposta": "É devida a revisão do benefício de auxílio-doença concedido pela sistemática da MP (Medida Provisória) n. 242/2005, aplicando-se a Lei n. 8.213/91, em sua redação anterior ao advento da referida medida provisória.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 14/02/2014; transitado em julgado em 15/04/2014 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 117 (PEDILEF 2007.38.00.740109-3/MG)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t118", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 118 da TNU?", "variantes": ["tema 118", "TNU 118", "tema 118 TNU", "invalidez posterior", "filho maior"], "resposta": "A invalidez ocorrida após o óbito do instituidor não autoriza a concessão de pensão por morte para filho maior.\nSinal: ADVERSO.\nStatus: transitado; julgado em 14/02/2014; transitado em julgado em 19/05/2014 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 118 (PEDILEF 0501099-40.2010.4.05.8400/RN)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t119", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 119 da TNU?", "variantes": ["tema 119", "TNU 119", "tema 119 TNU", "Lei 6.950/81", "buraco negro"], "resposta": "Segurados do INSS (Instituto Nacional do Seguro Social) que preencheram os requisitos para aposentadoria à época da vigência da Lei n. 6.950/81, mesmo que tenham se aposentado após o advento da Lei n. 8.213/91, têm direito à revisão do benefício, ainda que, para isso, a data de concessão tenha de ser alterada para o período denominado “buraco negro”, ou seja, entre 5 de outubro de 1988 e 5 de abril de 1991.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 12/03/2014; transitado em julgado em 10/06/2014 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 119 (PEDILEF 0002528-67.2009.4.03.6306/ SP)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t122", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 122 da TNU?", "variantes": ["tema 122", "TNU 122", "tema 122 TNU", "1/4 do mínimo", "presunção relativa"], "resposta": "O critério objetivo consubstanciado na exigência de renda familiar per capita inferior a ¼ do salário-mínimo gera uma presunção relativa de miserabilidade, que pode, portanto, ser afastada por outros elementos de prova.\nSinal: ADVERSO.\nStatus: transitado; julgado em 14/04/2016; transitado em julgado em 09/05/2016 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 122 (PEDILEF 5000493-92.2014.4.04.7002/PR)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t124", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 124 da TNU?", "variantes": ["tema 124", "TNU 124", "tema 124 TNU", "adicional de 25%", "grande invalidez"], "resposta": "Tese firmada no Tema 1095/STF: \"No âmbito do Regime Geral de Previdência Social (RGPS), somente lei pode criar ou ampliar benefícios e vantagens previdenciárias, não havendo, por ora, previsão de extensão do auxílio da grande invalidez a todas às espécies de aposentadoria.\"\nSinal: ADVERSO.\nStatus: transitado; transitado em julgado em 21/07/2022 (conferido em 16/10/2026).\nAlcance: Na mesma linha do STF (Supremo Tribunal Federal) Tema 1095.", "fonte": "TNU, Tema representativo 124 (PEDILEF 5000890-49.2014.4.04.7133/RS)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t130", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 130 da TNU?", "variantes": ["tema 130", "TNU 130", "tema 130 TNU", "IRSM", "decadência"], "resposta": "O início do prazo decadencial para revisar, com base no IRSM (Índice de Reajuste do Salário Mínimo) do mês de fevereiro de 1994 (39,67%), a RMI (renda mensal inicial) dos benefícios cujos segurados não fizeram acordo nos termos da Lei n. 10.999/2004, é a data de entrada em vigor da Medida Provisória n. 201, de 26/07/2004.\nSinal: NEUTRO.\nStatus: superado pelo Tema 375; julgado em 12/05/2016; transitado em julgado em 16/06/2016 (conferido em 16/10/2026).\nAtenção: Superado pelo Tema 375.", "fonte": "TNU, Tema representativo 130 (PEDILEF 5003519-62.2014.4.04.7208/SC)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "controvertido"}, {"id": "tnu-t131", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 131 da TNU?", "variantes": ["tema 131", "TNU 131", "tema 131 TNU", "híbrida", "rural remoto"], "resposta": "Para a concessão da aposentadoria por idade híbrida ou mista, na forma do art. 48, § 3º, da Lei n. 8.213/91, cujo requisito etário é o mesmo exigido para a aposentadoria por idade urbana, é irrelevante a natureza rural ou urbana da atividade exercida pelo segurado no período imediatamente anterior à implementação do requisito etário ou ao requerimento do benefício. Ainda, não há vedação para que o tempo rural anterior à Lei 8.213/91 seja considerado para efeito de carência, mesmo que não verificado o recolhimento das respectivas contribuições. Repetitivo STJ/Repercussão Geral: Questão submetida a julgamento - Tema 1007/STJ: \"Possibilidade de concessão de aposentadoria híbrida, prevista no art. 48, § 3º, da Lei 8.213/1991, mediante o cômputo de período de trabalho rural remoto, exercido antes de 1991, sem necessidade de recolhimentos, ainda que não haja comprovação de atividade rural no período imediatamente anterior ao requerimento administrativo\". Tese firmada no Tema: \"O tempo de serviço rural, ainda que remoto e descontínuo, anterior ao advento da Lei 8.213/1991, pode ser computado para fins da carência necessária à obtenção da aposentadoria híbrida por idade, ainda que não tenha sido efetivado o recolhimento das contribuições, nos termos do art. 48, § 3º da Lei 8.213/1991, seja qual for a predominância do labor misto exercido no período de carência ou o tipo de trabalho exercido no momento do implemento do requisito etário ou do requerimento administrativo.\"\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 20/10/2016; transitado em julgado em 01/09/2017 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 131 (PEDILEF 5009416-32.2013.4.04.7200/SC)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t134", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 134 da TNU?", "variantes": ["tema 134", "TNU 134", "tema 134 TNU", "art. 29 II", "Memorando 21/2010"], "resposta": "A revisão do benefício de aposentadoria por invalidez decorrente da conversão do auxílio-doença, nos termos do art. 29, II, da Lei n. 8.213/91, sujeita-se ao prazo decadencial previsto no art. 103 da mesma Lei, cujo marco inicial é a data da concessão do benefício originário. O prazo decadencial para revisão pelo art. 29, II, da Lei n. 8.213/91 se inicia a contar de 15/04/2010, em razão do reconhecimento administrativo do direito, perpetrada pelo Memorando-Circular Conjunto 21/DIRBENS/PFEINSS. Em razão do Memorando-Circular Conjunto 21/DIRBENS/PFEINSS, de 15-4-2010, que reconhece o direito do segurado à revisão pelo art. 29, II, da Lei n. 8.213/91, os prazos prescricionais em curso voltaram a correr integralmente a partir de sua publicação. Vide Tema 120.\nSinal: NEUTRO.\nStatus: transitado; julgado em 12/05/2016; transitado em julgado em 25/09/2019 (no STJ (Superior Tribunal de Justiça) - PUIL (pedido de uniformização de interpretação de lei) 217) (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 134 (PEDILEF 5004459-91.2013.4.04.7101/RS)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t135", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 135 da TNU?", "variantes": ["tema 135", "TNU 135", "tema 135 TNU", "decadência decenal", "MP 1.523/1997"], "resposta": "É devida a incidência da decadência decenal, prevista na MP (Medida Provisória) n. 1.523/1997, aos benefícios concedidos anteriormente à sua vigência.\nSinal: ADVERSO.\nStatus: transitado; julgado em 20/07/2016; transitado em julgado em 01/12/2017 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 135 (PEDILEF 5018558-45.2013.4.04.7108/RS)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t138", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 138 da TNU?", "variantes": ["tema 138", "TNU 138", "tema 138 TNU", "Lei 8.880", "teto"], "resposta": "O pedido revisional com fulcro no art. 21, §3º, da Lei 8.880/94 pressupõe que haja a redução da média dos salários-de-contribuição utilizados no cálculo do benefício, bem como que essa redução seja decorrente do limite máximo para o teto contributivo, de modo que, se a redução foi derivada de outros elementos utilizados no cálculo do salário-de-benefício, e não propriamente em razão da incidência do limite máximo para o salário-de-contribuição vigente no mês de início do benefício, não há que se cogitar de diferença percentual a ser incorporada/recuperada.\nSinal: NEUTRO.\nStatus: transitado; julgado em 14/09/2016; transitado em julgado em 30/03/2017 (conferido em 16/10/2026).\nAtenção: Sinal revisto em 09/11/2026 de ADVERSO para NEUTRO; o catálogo-mãe §6 ainda o lista entre os ADVERSOS.", "fonte": "TNU, Tema representativo 138 (PEDILEF 5001628-31.2013.4.04.7211/SC)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t145", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 145 da TNU?", "variantes": ["tema 145", "TNU 145", "tema 145 TNU", "imediatamente anterior", "idade rural"], "resposta": "Para a obtenção de aposentadoria por idade rural, é indispensável o exercício e a demonstração da atividade campesina correspondente à carência no período imediatamente anterior ao atingimento da idade mínima ou ao requerimento administrativo.\nSinal: ADVERSO.\nStatus: transitado; julgado em 17/08/2016; transitado em julgado em 19/09/2016 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 145 (PEDILEF 0000643-35.2011.4.03.6310/SP)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t147", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 147 da TNU?", "variantes": ["tema 147", "TNU 147", "tema 147 TNU", "pais", "dependência substancial"], "resposta": "A dependência econômica dos genitores em relação aos filhos não necessita ser exclusiva, porém a contribuição financeira destes deve ser substancial o bastante para a subsistência do núcleo familiar, e devidamente comprovada, não sendo mero auxílio financeiro o suficiente para caracterizar tal dependência.\nSinal: NEUTRO.\nStatus: transitado; julgado em 17/08/2016; transitado em julgado em 19/09/2016 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 147 (PEDILEF 5044944-05.2014.4.04.7100/RS)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t148",
