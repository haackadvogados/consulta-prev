"tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 148 da TNU?", "variantes": ["tema 148", "TNU 148", "tema 148 TNU", "perda da qualidade", "carência cumprida"], "resposta": "A perda da qualidade de segurado constitui óbice à concessão da pensão por morte quando o de cujus não chegou a preencher, antes de sua morte, os requisitos para obtenção de qualquer aposentadoria concedida pela previdência social, tal como ocorre nas hipóteses em que, embora houvesse preenchido a carência, não contava com tempo de serviço ou com idade bastante para se aposentar.\nSinal: ADVERSO.\nStatus: transitado; julgado em 14/09/2016; transitado em julgado em 20/02/2017 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 148 (PEDILEF 0001076-51.2011.4.03.6306/SP)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t149", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 149 da TNU?", "variantes": ["tema 149", "TNU 149", "tema 149 TNU", "fator previdenciário", "professor"], "resposta": "Incide o fator previdenciário na aposentadoria por tempo de serviço de professor, salvo quando o segurado tiver cumprido todos os requisitos para aposentação em data anterior à edição da Lei n. 9.876/99.\nSinal: ADVERSO.\nStatus: transitado; julgado em 20/10/2016, trânsito em 02/12/2016 (conferido em 09/11/2026).", "fonte": "TNU, Tema representativo 149 (PEDILEF 0501512-65.2015.4.05.8307/PE)", "origem": "catalogo-temas-vinculantes-2.md v1.0, §4", "sinal": "firme"}, {"id": "tnu-t153", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 153 da TNU?", "variantes": ["tema 153", "TNU 153", "tema 153 TNU", "CTPS rural", "antes de 1991"], "resposta": "É possível o reconhecimento do tempo de serviço exercido por trabalhador rural registrado em carteira profissional em período anterior à Lei 8.213/91 para efeito de carência, independentemente do recolhimento das contribuições previdenciárias, tendo em vista que o empregador rural, juntamente com as demais fontes previstas na legislação de regência, eram os responsáveis pelo custeio do fundo de assistência e previdência rural (FUNRURAL).\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 22/11/2017; transitado em julgado em 14/03/2018 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 153 (PEDILEF 0000804-14.2012.4.01.3805/MG)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t155", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 155 da TNU?", "variantes": ["tema 155", "TNU 155", "tema 155 TNU", "doméstico", "Lei 5.859/72"], "resposta": "Não é exigível que o trabalhador doméstico recolha contribuições à Previdência social para os períodos laborados antes da entrada em vigor da Lei n. 5.859/72.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 08/10/2014; transitado em julgado em 03/11/2014 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 155 (PEDILEF 0008223-14.2009.4.03.6302/SP)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t157", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 157 da TNU?", "variantes": ["tema 157", "TNU 157", "tema 157 TNU", "frentista", "periculosidade"], "resposta": "Não há presunção legal de periculosidade da atividade do frentista, sendo devida a conversão de tempo especial em comum, para concessão de aposentadoria por tempo de contribuição, desde que comprovado o exercício da atividade e o contato com os agentes nocivos por formulário ou laudo, tendo em vista se tratar de atividade não enquadrada no rol dos Decretos n. 53.831/64 e 83.080/79.\nSinal: NEUTRO.\nStatus: sem datas na fonte; sem data de julgamento/trânsito no repositório (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 157 (PEDILEF 5009522-37.2012.4.04.7003/PR)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "controvertido"}, {"id": "tnu-t158", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 158 da TNU?", "variantes": ["tema 158", "TNU 158", "tema 158 TNU", "professor", "EC 18/81"], "resposta": "Não é possível a conversão de período laborado na atividade de professor em tempo comum após a Emenda Constitucional 18/81. Revisão do Tema 22.\nSinal: ADVERSO.\nStatus: transitado; julgado em 11/09/2014; transitado em julgado em 06/10/2014 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 158 (PEDILEF 5010944-13.2013.4.04.7003/PR)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t159", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 159 da TNU?", "variantes": ["tema 159", "TNU 159", "tema 159 TNU", "eletricidade", "Decreto 2.172/97"], "resposta": "É possível o reconhecimento como especial de período laborado com exposição ao agente energia elétrica, após o Decreto 2.172/97, para fins de concessão de aposentadoria especial.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 06/08/2014; transitado em julgado em 13/10/2014 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 159 (PEDILEF 5001238-34.2012.4.04.7102/RS)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t164", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 164 da TNU?", "variantes": ["tema 164", "TNU 164", "tema 164 TNU", "alta programada", "DCB"], "resposta": "a) os benefícios de auxílio-doença concedidos judicial ou administrativamente, sem Data de Cessação de Benefício (DCB), ainda que anteriormente à edição da MP (Medida Provisória) nº 739/2016, podem ser objeto de revisão administrativa, na forma e prazos previstos em lei e demais normas que regulamentam a matéria, por meio de prévia convocação dos segurados pelo INSS (Instituto Nacional do Seguro Social), para avaliar se persistem os motivos de concessão do benefício; b) os benefícios concedidos, reativados ou prorrogados posteriormente à publicação da MP nº 767/2017, convertida na Lei n.º 13.457/17, devem, nos termos da lei, ter a sua DCB fixada, sendo desnecessária, nesses casos, a realização de nova perícia para a cessação do benefício; c) em qualquer caso, o segurado poderá pedir a prorrogação do benefício, com garantia de pagamento até a realização da perícia médica.\nSinal: NEUTRO (item c favorável).\nStatus: transitado; julgado em 19/04/2018, trânsito em 02/10/2018 (conferido em 07/10/2026).", "fonte": "TNU, Tema representativo 164 (PEDILEF 0500774-49.2016.4.05.8305/PE)", "origem": "catalogo-temas-vinculantes.md v1.15, §4 e §7", "sinal": "firme"}, {"id": "tnu-t165", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 165 da TNU?", "variantes": ["tema 165", "TNU 165", "tema 165 TNU", "auxílio-doença", "tempo especial"], "resposta": "O período de auxílio-doença de natureza previdenciária, independente de comprovação da relação da moléstia com a atividade profissional do segurado, deve ser considerado como tempo especial quando trabalhador exercia atividade especial antes do afastamento.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 18/09/2019, trânsito em 01/09/2020 (conferido em 25/10/2026).\nAtenção: Tese reafirmada pelo STJ (Superior Tribunal de Justiça) Tema 998; o repositório de 16/10/2026 registra o tema sem data de trânsito, e o catálogo, pelo portal, registra trânsito em 01/09/2020.", "fonte": "TNU, Tema representativo 165 (PEDILEF 5012755-25.2015.4.04.7201/SC)", "origem": "catalogo-temas-vinculantes.md v1.15, §4 e §7", "sinal": "firme"}, {"id": "tnu-t169", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 169 da TNU?", "variantes": ["tema 169", "TNU 169", "tema 169 TNU", "baixa renda", "excesso irrisório"], "resposta": "É possível a flexibilização do conceito de “baixa-renda” para o fim de concessão do benefício previdenciário de auxílio-reclusão desde que se esteja diante de situações extremas e com valor do último salário-de-contribuição do segurado preso pouco acima do mínimo legal - “valor irrisório”.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 22/02/2018; transitado em julgado em 27/03/2018 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 169 (PEDILEF 0000713-30.2013.4.03.6327/SP)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t170", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 170 da TNU?", "variantes": ["tema 170", "TNU 170", "tema 170 TNU", "cancerígeno", "LINACH"], "resposta": "A redação do art. 68, § 4º, do Decreto 3.048/99 dada pelo Decreto 8.123/2013 pode ser aplicada na avaliação de tempo especial de períodos a ele anteriores, incluindo-se, para qualquer período: (1) desnecessidade de avaliação quantitativa; e (2) ausência de descaracterização pela existência de EPI (equipamento de proteção individual)\nSinal: FAVORÁVEL.\nStatus: transitado em 23/11/2022 (no PUIL (pedido de uniformização de interpretação de lei) 1283/STJ); julgado em 17/08/2018 (conferido em 21/10/2026).\nAtenção: Cancerígeno do Grupo 1 da LINACH (Lista Nacional de Agentes Cancerígenos para Humanos); silente sobre a redação do Decreto 10.410/2020.", "fonte": "TNU, Tema representativo 170 (PEDILEF 5006019-50.2013.4.04.7204/SC)", "origem": "catalogo-temas-vinculantes.md v1.15, §4 e §7", "sinal": "firme"}, {"id": "tnu-t173", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 173 da TNU?", "variantes": ["tema 173", "TNU 173", "tema 173 TNU", "impedimento de longo prazo", "2 anos"], "resposta": "Para fins de concessão do benefício assistencial de prestação continuada, o conceito de pessoa com deficiência, que não se confunde necessariamente com situação de incapacidade laborativa, exige a configuração de impedimento de longo prazo com duração mínima de 2 (dois) anos, a ser aferido no caso concreto, desde o início do impedimento até a data prevista para a sua cessação (tese alterada em sede de embargos de declaração).\nSinal: ADVERSO.\nStatus: transitado; julgado em 21/11/2018; transitado em julgado em 06/03/2020 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 173 (PEDILEF 0073261-97.2014.4.03.6301/SP)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t174", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 174 da TNU?", "variantes": ["tema 174", "TNU 174", "tema 174 TNU", "metodologia", "LTCAT"], "resposta": "(a) \"A partir de 19 de novembro de 2003, para a aferição de ruído contínuo ou intermitente, é obrigatória a utilização das metodologias contidas na NHO-01 (Norma de Higiene Ocupacional 01 da Fundacentro) da FUNDACENTRO (Fundação Jorge Duprat Figueiredo de Segurança e Medicina do Trabalho) ou na NR-15 (Norma Regulamentadora 15), que reflitam a medição de exposição durante toda a jornada de trabalho, vedada a medição pontual, devendo constar do Perfil Profissiográfico Previdenciário (PPP) a técnica utilizada e a respectiva norma\"; (b) \"Em caso de omissão ou dúvida quanto à indicação da metodologia empregada para aferição da exposição nociva ao agente ruído, o PPP não deve ser admitido como prova da especialidade, devendo ser apresentado o respectivo laudo técnico (LTCAT), para fins de demonstrar a técnica utilizada na medição, bem como a respectiva norma\".\nSinal: NEUTRO (item b aproveitável: PPP omisso supre-se pelo LTCAT).\nStatus: transitado (tese revista); julgado em 21/11/2018, trânsito em 08/05/2019 (conferido em 15/10/2026).", "fonte": "TNU, Tema representativo 174 (PEDILEF 0505614-83.2017.4.05.8300/PE)", "origem": "catalogo-temas-vinculantes.md v1.15, §4 e §7", "sinal": "firme"}, {"id": "tnu-t176", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 176 da TNU?", "variantes": ["tema 176", "TNU 176", "tema 176 TNU", "carência", "MP 739/2016"], "resposta": "Constatado que a incapacidade do(a) segurado(a) do Regime Geral da Previdência Social (RGPS) ocorreu ao tempo da vigência das Medidas Provisórias 739/2016 e 767/2017, aplicam-se as novas regras de carência nelas previstas.\nSinal: ADVERSO.\nStatus: transitado; julgado em 17/08/2018; transitado em julgado em 02/10/2018 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 176 (PEDILEF 5001792-09.2017.4.04.7129/RS)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t177", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 177 da TNU?", "variantes": ["tema 177", "TNU 177", "tema 177 TNU", "reabilitação", "incapacidade parcial"], "resposta": "1. Constatada a existência de incapacidade parcial e permanente, não sendo o caso de aplicação da Súmula 47 da TNU (Turma Nacional de Uniformização), a decisão judicial poderá determinar o encaminhamento do segurado para análise administrativa de elegibilidade à reabilitação profissional, sendo inviável a condenação prévia à concessão de aposentadoria por invalidez condicionada ao insucesso da reabilitação; 2. A análise administrativa da elegibilidade à reabilitação profissional deverá adotar como premissa a conclusão da decisão judicial sobre a existência de incapacidade parcial e permanente, ressalvada a possibilidade de constatação de modificação das circunstâncias fáticas após a sentença.\nSinal: NEUTRO.\nStatus: transitado; julgado em 21/02/2019, trânsito em 10/06/2019 (conferido em 07/10/2026).", "fonte": "TNU, Tema representativo 177 (PEDILEF 0506698-72.2015.4.05.8500/SE)", "origem": "catalogo-temas-vinculantes.md v1.15, §4 e §7", "sinal": "firme"}, {"id": "tnu-t181", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 181 da TNU?", "variantes": ["tema 181", "TNU 181", "tema 181 TNU", "CadÚnico", "alíquota de 5%"], "resposta": "A prévia inscrição no Cadastro Único para Programas Sociais do Governo Federal - CadÚnico (Cadastro Único para Programas Sociais) é requisito essencial para validação das contribuições previdenciárias vertidas na alíquota de 5% (art. 21, § 2º, inciso II, alínea \"b\" e § 4º, da Lei 8.212/1991 - redação dada pela Lei n. 12.470/2011), e os efeitos dessa inscrição não alcançam as contribuições feitas anteriormente.\nSinal: ADVERSO.\nStatus: transitado; julgado em 21/11/2018; transitado em julgado em 25/01/2019 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 181 (PEDILEF 0000513-43.2014.4.02.5154/RJ)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t188", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 188 da TNU?", "variantes": ["tema 188", "TNU 188", "tema 188 TNU", "contribuinte individual", "EPI"], "resposta": "Após 03/12/1998, para o segurado contribuinte individual, não é possível o reconhecimento de atividade especial em virtude da falta de utilização de equipamento de proteção individual (EPI) eficaz, salvo nas hipóteses de: (a) exposição ao agente físico ruído acima dos limites legais; (b) exposição a agentes nocivos reconhecidamente cancerígenos, constantes do Grupo 1 da lista da LINACH (Lista Nacional de Agentes Cancerígenos para Humanos); ou (c) demonstração com fundamento técnico de inexistência, no caso concreto, de EPI apto a elidir a nocividade da exposição ao agente agressivo a que se submeteu o segurado.\nSinal: ADVERSO.\nStatus: transitado; julgado em 22/08/2019, trânsito em 16/09/2021 (no STF (Supremo Tribunal Federal), ARE (recurso extraordinário com agravo) 1317704/RS) (conferido em 14/10/2026).", "fonte": "TNU, Tema representativo 188 (PEDILEF 5000075-62.2017.4.04.7128/RS)", "origem": "catalogo-temas-vinculantes.md v1.15, §4 e §7", "sinal": "firme"}, {"id": "tnu-t192", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 192 da TNU?", "variantes": ["tema 192", "TNU 192", "tema 192 TNU", "recolhimento em atraso", "carência"], "resposta": "Contribuinte individual. Recolhimento com atraso das contribuições posteriores ao pagamento da primeira contribuição sem atraso. Perda da qualidade de segurado. Impossibilidade de cômputos das contribuições recolhidas com atraso relativas ao período entre a perda da qualidade de segurado e a sua reaquisição para efeito de carência.\nSinal: ADVERSO.\nStatus: transitado; julgado em 20/02/2013, trânsito em 25/03/2013 (conferido em 15/10/2026).\nAtenção: O sinal FAVORÁVEL dado antes (insumo D4) foi substituído por ADVERSO em 02/11/2026.", "fonte": "TNU, Tema representativo 192 (PEDILEF 2009.71.50.019216-5/RS)", "origem": "catalogo-temas-vinculantes.md v1.15, §4 e §7", "sinal": "firme"}, {"id": "tnu-t198", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 198 da TNU?", "variantes": ["tema 198", "TNU 198", "tema 198 TNU", "analogia", "categoria profissional"], "resposta": "Tese literal não transcrita nas fontes; o catálogo a resume assim: analogia às ocupações dos Decretos 53.831/64 e 83.080/79 antes de 29/04/1995, com justificativa da semelhança.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 22/08/2019, trânsito em 07/10/2019 (conferido em 14/10/2026).", "fonte": "TNU, Tema representativo 198 (PEDILEF 0502252-37.2017.4.05.8312/PE)", "origem": "catalogo-temas-vinculantes.md v1.15, §4 e §7", "sinal": "firme"}, {"id": "tnu-t200", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 200 da TNU?", "variantes": ["tema 200", "TNU 200", "tema 200 TNU", "reclamatória trabalhista", "prescrição"], "resposta": "Na pretensão ao recebimento de diferenças decorrentes de revisão de renda mensal inicial em virtude de verbas salariais reconhecidas em reclamação trabalhista, a prescrição quinquenal deve ser contada retroativamente da data do ajuizamento da ação previdenciária, não fluindo no período de tramitação da ação trabalhista, enquanto não definitivamente reconhecido o direito e não homologados os cálculos de liquidação.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 11/12/2020; transitado em julgado em 09/05/2024 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 200 (PEDILEF 5002165-21.2017.4.04.7103/RS)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t201", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 201 da TNU?", "variantes": ["tema 201", "TNU 201", "tema 201 TNU", "contribuinte individual", "auxílio-acidente"], "resposta": "O contribuinte individual não faz jus ao auxílio-acidente, diante de expressa exclusão legal.\nSinal: ADVERSO.\nStatus: transitado; julgado em 09/10/2019; transitado em julgado em 28/07/2020 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 201 (PEDILEF 0002245-25.2016.4.03.6330/SP)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t203", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 203 da TNU?", "variantes": ["tema 203", "TNU 203", "tema 203 TNU", "divisor mínimo", "Lei 9.876"], "resposta": "Para fins de interpretação da regra constante do art. 3º, § 2º, da Lei n. 9.876/99, aplicável aos segurados filiados à previdência social até o dia anterior à data de sua publicação, o divisor a ser utilizado para o cálculo do salário-de-benefício não precisa corresponder a um percentual, no mínimo, equivalente ao número de contribuições vertidas.\nSinal: ADVERSO.\nStatus: transitado; julgado em 16/10/2020; transitado em julgado em 27/11/2020 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 203 (PEDILEF 0004024-81.2011.4.01.3311/BA)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t204", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 204 da TNU?", "variantes": ["tema 204", "TNU 204", "tema 204 TNU", "marido não inválido", "óbito antes de 1988"], "resposta": "É possível a concessão de pensão por morte ao marido não inválido ainda que o óbito da instituidora tenha ocorrido anteriormente ao advento da Constituição Federal de 1988. Obs.: Tema 116/TNU cancelado.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 21/09/2022; transitado em julgado em 28/10/2022 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 204 (PEDILEF 0501742-39.2017.4.05.8501/SE)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t205", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 205 da TNU?", "variantes": ["tema 205", "TNU 205", "tema 205 TNU", "rol exemplificativo", "risco de contaminação"], "resposta": "a) para reconhecimento da natureza especial de tempo laborado em exposição a agentes biológicos não é necessário o desenvolvimento de uma das atividades arroladas nos Decretos de regência, sendo referido rol meramente exemplificativo; b) entretanto, é necessária a comprovação em concreto do risco de exposição a microorganismos ou parasitas infectocontagiosos, ou ainda suas toxinas, em medida denotativa de que o risco de contaminação em seu ambiente de trabalho era superior ao risco em geral, devendo, ainda, ser avaliado, de acordo com a profissiografia, se tal exposição tem um caráter indissociável da produção do bem ou da prestação do serviço, independentemente de tempo mínimo de exposição durante a jornada (Tema 211/TNU).\nSinal: NEUTRO (item a favorável; item b exige prova).\nStatus: transitado; julgado em 12/03/2020, trânsito em 26/05/2020 (conferido em 14/10/2026).", "fonte": "TNU, Tema representativo 205 (PEDILEF 0500012-70.2015.4.05.8013/AL)", "origem": "catalogo-temas-vinculantes.md v1.15, §4 e §7", "sinal": "firme"}, {"id": "tnu-t208", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 208 da TNU?", "variantes": ["tema 208", "TNU 208", "tema 208 TNU", "responsável técnico", "LTCAT"], "resposta": "1. Para a validade do Perfil Profissiográfico Previdenciário (PPP) como prova do tempo trabalhado em condições especiais nos períodos em que há exigência de preenchimento do formulário com base em Laudo Técnico das Condições Ambientais de Trabalho (LTCAT), é necessária a indicação do responsável técnico pelos registros ambientais para a totalidade dos períodos informados, sendo dispensada a informação sobre monitoração biológica. 2. A ausência total ou parcial da indicação no PPP pode ser suprida pela apresentação de LTCAT ou por elementos técnicos equivalentes, cujas informações podem ser estendidas para período anterior ou posterior à sua elaboração, desde que acompanhados da declaração do empregador ou comprovada por outro meio a inexistência de alteração no ambiente de trabalho ou em sua organização ao longo do tempo. Tese com redação alterada em sede de embargos de declaração.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 20/11/2020, ED (embargos de declaração) em 21/06/2021, trânsito em 26/07/2021 (conferido em 07/10/2026).", "fonte": "TNU, Tema representativo 208 (PEDILEF 0500940-26.2017.4.05.8312/PE)", "origem": "catalogo-temas-vinculantes.md v1.15, §4 e §7", "sinal": "firme"}, {"id": "tnu-t210", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 210 da TNU?", "variantes": ["tema 210", "TNU 210", "tema 210 TNU", "tensão elétrica", "250 V"], "resposta": "Para aplicação do artigo 57, §3.º, da Lei n.º 8.213/91 à tensão elétrica superior a 250 V, exige-se a probabilidade da exposição ocupacional, avaliando-se, de acordo com a profissiografia, o seu caráter indissociável da produção do bem ou da prestação do serviço, independente de tempo mínimo de exposição durante a jornada.\nSinal: NEUTRO (eletricidade; paralelo de redação do Tema 211).\nStatus: transitado; julgado em 12/12/2019, ED (embargos de declaração) em 12/03/2020, trânsito em 26/05/2020 (conferido em 14/10/2026).", "fonte": "TNU, Tema representativo 210 (PEDILEF 0501567-42.2017.4.05.8405/RN)", "origem": "catalogo-temas-vinculantes.md v1.15, §4 e §7", "sinal": "firme"}, {"id": "tnu-t211", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 211 da TNU?", "variantes": ["tema 211", "TNU 211", "tema 211 TNU", "agente biológico", "exposição ocupacional"], "resposta": "Para aplicação do artigo 57, §3.º, da Lei n.º 8.213/91 a agentes biológicos, exige-se a probabilidade da exposição ocupacional, avaliando-se, de acordo com a profissiografia, o seu caráter indissociável da produção do bem ou da prestação do serviço, independente de tempo mínimo de exposição durante a jornada.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 12/12/2019, trânsito em 12/02/2020 (conferido em 14/10/2026).\nAtenção: O verbete do Tema 211 no repositório de 16/10/2026 copia a questão e a tese do Tema 210 (eletricidade); vale a tese lida no portal, transcrita pelo catálogo.", "fonte": "TNU, Tema representativo 211 (PEDILEF 0501219-30.2017.4.05.8500/SE)", "origem": "catalogo-temas-vinculantes.md v1.15, §4 e §7", "sinal": "firme"}, {"id": "tnu-t213", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 213 da TNU?", "variantes": ["tema 213", "TNU 213", "tema 213 TNU", "EPI eficaz", "impugnação do PPP"], "resposta": "I - A informação no Perfil Profissiográfico Previdenciário (PPP) sobre a existência de equipamento de proteção individual (EPI) eficaz pode ser fundamentadamente desafiada pelo segurado perante a Justiça Federal, desde que exista impugnação específica do formulário na causa de pedir, onde tenham sido motivadamente alegados: (i.) a ausência de adequação ao risco da atividade; (ii.) a inexistência ou irregularidade do certificado de conformidade; (iii.) o descumprimento das normas de manutenção, substituição e higienização; (iv.) a ausência ou insuficiência de orientação e treinamento sobre o uso o uso adequado, guarda e conservação; ou (v.) qualquer outro motivo capaz de conduzir à conclusão da ineficácia do EPI. II - Considerando que o Equipamento de Proteção Individual (EPI) apenas obsta a concessão do reconhecimento do trabalho em condições especiais quando for realmente capaz de neutralizar o agente nocivo, havendo divergência real ou dúvida razoável sobre a sua real eficácia, provocadas por impugnação fundamentada e consistente do segurado, o período trabalhado deverá ser reconhecido como especial.\nSinal: FAVORÁVEL (I neutro: impugnação específica na causa de pedir; II favorável).\nStatus: transitado; julgado em 19/06/2020, ED (embargos de declaração) em 25/02/2021, trânsito em 09/04/2021 (conferido em 25/10/2026).\nAtenção: O repositório de 16/10/2026 imprime 25/06/2020, data da publicação, como data do julgamento.", "fonte": "TNU, Tema representativo 213 (PEDILEF 0004439-44.2010.4.03.6318/SP)", "origem": "catalogo-temas-vinculantes.md v1.15, §4 e §7", "sinal": "firme"}, {"id": "tnu-t216", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 216 da TNU?", "variantes": ["tema 216", "TNU 216", "tema 216 TNU", "aluno-aprendiz", "Súmula 18"], "resposta": "Para fins previdenciários, o cômputo do tempo de serviço prestado como aluno-aprendiz exige a comprovação de que, durante o período de aprendizado, houve simultaneamente: (i) retribuição consubstanciada em prestação pecuniária ou em auxílios materiais; (ii) à conta do Orçamento; (iii) a título de contraprestação por labor; (iv) na execução de bens e serviços destinados a terceiros. (alterada a redação da Súmula 18/TNU).\nSinal: NEUTRO.\nStatus: transitado; julgado em 14/02/2020; transitado em julgado em 06/05/2020 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 216 (PEDILEF 0525048-76.2017.4.05.8100/CE)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t217", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 217 da TNU?", "variantes": ["tema 217", "TNU 217", "tema 217 TNU", "fungibilidade", "benefício por incapacidade"], "resposta": "Em relação ao benefício assistencial e aos benefícios por incapacidade, é possível conhecer de um deles em juízo, ainda que não seja o especificamente requerido na via administrativa, desde que preenchidos os requisitos legais, observando-se o contraditório e o disposto no artigo 9º e 10 do CPC (Código de Processo Civil).\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 27/08/2020; transitado em julgado em 23/08/2022 (no STF (Supremo Tribunal Federal) - RE (recurso extraordinário) 1331557/DF) (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 217 (PEDILEF 0002358-97.2015.4.01.3507/GO)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t219", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 219 da TNU?", "variantes": ["tema 219", "TNU 219", "tema 219 TNU", "menor de 12 anos", "trabalho infantil"], "resposta": "É possível o cômputo do tempo de serviço rural exercido por pessoa com idade inferior a 12 (doze) anos na época da prestação do labor campesino.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 23/06/2022; trânsito em julgado em 26/07/2022 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 219 (PEDILEF 5008955-78.2018.4.04.7202/SC)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t223", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 223 da TNU?", "variantes": ["tema 223", "TNU 223", "tema 223 TNU", "absolutamente incapaz", "dependente habilitado"], "resposta": "O dependente absolutamente incapaz faz jus à pensão por morte desde o requerimento administrativo, na forma do art. 76 da Lei 8.213/91, havendo outro dependente previamente habilitado e percebendo benefício, do mesmo ou de outro grupo familiar, ainda que observados os prazos do art. 74 da Lei 8.213/91. Obs.: tese alterada no julgamento dos embargos de declaração (sessão ordinária de 25/2/2021).\nSinal: ADVERSO.\nStatus: transitado; julgado em 14/09/2016. EDs (embargos de declaração) em 26/02/2021; transitado em julgado em 30/03/2021 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 223 (PEDILEF 0500429-55.2017.4.05.8109/CE)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t225", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 225 da TNU?", "variantes": ["tema 225", "TNU 225", "tema 225 TNU", "titular de BPC", "direito a benefício previdenciário"], "resposta": "É possível a concessão de pensão por morte quando o instituidor, apesar de titular de benefício assistencial, tinha direito adquirido a benefício previdenciário não concedido pela Administração.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 20/11/2020; transitado em julgado em 03/02/2023 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 225 (PEDILEF 0029902-86.2012.4.01.3500/GO)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t226", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 226 da TNU?", "variantes": ["tema 226", "TNU 226", "tema 226 TNU", "cônjuge", "dependência absoluta"], "resposta": "A dependência econômica do cônjuge ou do companheiro relacionados no inciso I do art. 16 da Lei 8.213/91, em atenção à presunção disposta no §4º do mesmo dispositivo legal, é absoluta.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 26/03/2021; transitado em julgado em 03/05/2021 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 226 (PEDILEF 0030611-06.2012.4.03.6301/SP)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t232", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 232 da TNU?", "variantes": ["tema 232", "TNU 232", "tema 232 TNU", "seguro-desemprego", "abatimento"], "resposta": "O auxílio-doença é inacumulável com o seguro-desemprego, mesmo na hipótese de reconhecimento retroativo da incapacidade em momento posterior ao gozo do benefício da lei 7.998/90, hipótese na qual as parcelas do seguro-desemprego devem ser abatidas do valor devido a título de auxílio-doença.\nSinal: ADVERSO.\nStatus: transitado; julgado em 12/12/2019; transitado em julgado em 28/10/2020 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 232 (PEDILEF 0504751-73.2016.4.05.8200/PB)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t233", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 233 da TNU?", "variantes": ["tema 233", "TNU 233", "tema 233 TNU", "CTC", "aposentadoria cassada"], "resposta": "O servidor público aposentado no RPPS (regime próprio de previdência social) e que sofrer pena de cassação de sua aposentadoria pode utilizar o respectivo período contributivo para requerer aposentadoria no RGPS (Regime Geral de Previdência Social), devidamente comprovado por meio de Certidão de Tempo de Contribuição fornecida pelo órgão público competente.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 12/03/2020; transitado em julgado em 21/10/2020 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 233 (PEDILEF 0053962-51.2016.4.02.5151/RJ)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t236", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 236 da TNU?", "variantes": ["tema 236", "TNU 236", "tema 236 TNU", "genitor", "RE 1333622"], "resposta": "É cabível a concessão de salário-maternidade em favor do genitor segurado em caso de óbito da mãe ocorrido após o parto, pelo período remanescente do benefício, ainda quando o óbito tenha ocorrido antes da entrada em vigor da Lei n. 12.873/2013 (que incluiu o art. 72-B na Lei 8.213/91). Tese do RE (recurso extraordinário) 1333622/MG: [...] Desse modo, se não existia, à época do falecimento da mãe, previsão de outorga do salário-maternidade ao genitor pelo tempo restante de percepção do benefício - o que só veio a ocorrer com a entrada em vigor da Lei n. 12.873/2013 -, a concessão do salário-maternidade sem previsão legal ofende o princípio tempus regit actum, bem assim viola a orientação constitucional quanto a se ter a indicação prévia da fonte de custeio (CF (Constituição Federal), art. 195, § 5º).[...]\"\nSinal: ADVERSO.\nStatus: transitado, tese revisada; julgado; transitado em julgado; tese revisada; Julgado em 26/02/2021; transitado em julgado em 18/02/2022 (no STF (Supremo Tribunal Federal) - RE 1333622/MG) (conferido em 16/10/2026).\nAtenção: Revisada pelo RE 1333622 em sentido contrário à tese original.", "fonte": "TNU, Tema representativo 236 (PEDILEF 0072880-17.2013.4.01.3800/MG)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "controvertido"}, {"id": "tnu-t238", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 238 da TNU?", "variantes": ["tema 238", "TNU 238", "tema 238 TNU", "limpeza hospitalar", "categoria profissional"], "resposta": "Para fins de reconhecimento do tempo especial de serviço dos trabalhadores de serviços gerais em limpeza e higienização de ambientes hospitalares é exigível a prova de exposição aos agentes biológicos previstos sob o código 1.3.2 do quadro anexo ao Decreto nº 53.831/64, que deve ser realizada por meio dos correspondentes laudos técnicos e/ou formulários previdenciários, não se admitindo o reconhecimento por simples enquadramento de categoria profissional.\nSinal: ADVERSO.\nStatus: transitado; julgado em 25/03/2021, ED (embargos de declaração) em 26/08/2021, trânsito em 13/10/2021 (conferido em 14/10/2026).", "fonte": "TNU, Tema representativo 238 (PEDILEF 0000861-27.2015.4.01.3805/MG)", "origem": "catalogo-temas-vinculantes.md v1.15, §4 e §7", "sinal": "firme"}, {"id": "tnu-t239", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 239 da TNU?", "variantes": ["tema 239", "TNU 239", "tema 239 TNU", "desemprego involuntário", "prorrogação"], "resposta": "A prorrogação da qualidade de segurado por desemprego involuntário, nos moldes do §2º do art. 15 da Lei 8.213/91, se estende ao segurado contribuinte individual se comprovada a cessação da atividade econômica por ele exercida por causa involuntária, além da ausência de atividade posterior.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 01/06/2021; transitado em julgado em 01/06/2021 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 239 (PEDILEF 0504272-91.2018.4.05.8400/RN)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t240", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 240 da TNU?", "variantes": ["tema 240", "TNU 240", "tema 240 TNU", "anotação extemporânea", "CTPS"], "resposta": "I) É extemporânea a anotação de vínculo empregatício em CTPS (Carteira de Trabalho e Previdência Social), realizada voluntariamente pelo empregador após o término do contrato de trabalho; (II) Essa anotação, desacompanhada de outros elementos materiais de prova a corroborá-la, não serve como início de prova material para fins previdenciários.\nSinal: ADVERSO.\nStatus: transitado; julgado em 25/03/2021; transitado em julgado em 28/04/2021 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 240 (PEDILEF 0500540-27.2017.4.05.8307/PE)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t242", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 242 da TNU?", "variantes": ["tema 242", "TNU 242", "tema 242 TNU", "greve de peritos", "responsabilidade civil"], "resposta": "A demora excessiva na realização de perícia médica pelo INSS (Instituto Nacional do Seguro Social), em razão de movimento grevista de seus servidores, não enseja a responsabilização civil do Estado por danos suportados pelo segurado antea negativa do empregador em admiti-lo ao labor enquanto não liberado o retorno pela perícia médica administrativa.\nSinal: ADVERSO.\nStatus: transitado; julgado em 23/09/2021; transitado em julgado em 27/10/2021 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 242 (PEDILEF 0001436-92.2016.4.01.3807/MG)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t245", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 245 da TNU?", "variantes": ["tema 245", "TNU 245", "tema 245 TNU", "benefício invalidado", "boa-fé"], "resposta": "A invalidação do ato de concessão de benefício previdenciário não impede a aplicação do art. 15, I da Lei 8.213/91 ao segurado de boa-fé.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 25/06/2020; transitado em julgado em 06/08/2022 (no STF (Supremo Tribunal Federal) - RE (recurso extraordinário) 1381003/MG) (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 245 (PEDILEF 0008405-41.2016.4.01.3802/MG)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t246", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 246 da TNU?", "variantes": ["tema 246", "TNU 246", "tema 246 TNU", "prazo de recuperação", "120 dias"], "resposta": "I - Quando a decisão judicial adotar a estimativa de prazo de recuperação da capacidade prevista na perícia, o termo inicial é a data da realização do exame, sem prejuízo do disposto no art. 479 do CPC (Código de Processo Civil), devendo ser garantido prazo mínimo de 30 dias, desde a implantação, para viabilizar o pedido administrativo de prorrogação. II - quando o ato de concessão (administrativa ou judicial) não indicar o tempo de recuperação da capacidade, o prazo de 120 dias, previsto no § 9º, do art. 60 da Lei 8.213/91, deve ser contado a partir da data da efetiva implantação ou restabelecimento do benefício no sistema de gestão de benefícios da autarquia.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 20/11/2020, trânsito em 29/01/2021 (conferido em 07/10/2026).", "fonte": "TNU, Tema representativo 246 (PEDILEF 0500881-37.2018.4.05.8204/PB)", "origem": "catalogo-temas-vinculantes.md v1.15, §4 e §7", "sinal": "firme"}, {"id": "tnu-t250", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 250 da TNU?", "variantes": ["tema 250", "TNU 250", "tema 250 TNU", "aviso prévio indenizado", "tempo de contribuição"], "resposta": "O período de aviso prévio indenizado é válido para todos os fins previdenciários, inclusive como tempo de contribuição para obtenção de aposentadoria.\nSinal: FAVORÁVEL.\nStatus: sem trânsito na fonte; julgado; sem data de trânsito no repositório; Julgado em 25/02/2021 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 250 (PEDILEF 0515850-48.2018.4.05.8013/AL)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "controvertido"}, {"id": "tnu-t253", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 253 da TNU?", "variantes": ["tema 253", "TNU 253", "tema 253 TNU", "BPC", "auxílio-acidente"], "resposta": "É inacumulável o benefício de prestação continuada - BPC/LOAS (benefício de prestação continuada da Lei Orgânica da Assistência Social) com o auxílio-acidente, na forma do art. 20, §4º, da Lei nº 8.742/1993, sendo facultado ao beneficiário, quando preenchidos os requisitos legais de ambos os benefícios, a opção pelo mais vantajoso.\nSinal: NEUTRO.\nStatus: transitado; julgado em 28/05/2021; transitado em julgado em 29/06/2021 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 253 (PEDILEF 0500878-55.2018.4.05.8310/PE)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t255", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 255 da TNU?", "variantes": ["tema 255", "TNU 255", "tema 255 TNU", "120 contribuições", "prorrogação"], "resposta": "O pagamento de mais de 120 (cento e vinte) contribuições mensais, sem interrupção que acarrete a perda da qualidade de segurado, garante o direito à prorrogação do período de graça, previsto no parágrafo 1º, do art. 15 da Lei 8.213/91, mesmo nas filiações posteriores àquela na qual a exigência foi preenchida, independentemente do número de vezes em que foi exercido.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 16/10/2020; transitado em julgado em 02/08/2022 (no STJ (Superior Tribunal de Justiça) - PUIL (pedido de uniformização de interpretação de lei) 1973/DF) (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 255 (PEDILEF 0509717-14.2018.4.05.8102/CE)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t259", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 259 da TNU?", "variantes": ["tema 259", "TNU 259", "tema 259 TNU", "vereador", "mandato"], "resposta": "É possível a cumulação de benefício de auxílio-doença (auxílio por incapacidade temporária) com o exercício de mandato eletivo de vereador, desde que observado o disposto no § 7º do artigo 60 da Lei nº 8.213/91.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 30/04/2021; transitado em julgado em 01/06/2021 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 259 (PEDILEF 5000657-46.2018.4.04.7219/SC)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t266", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 266 da TNU?", "variantes": ["tema 266", "TNU 266", "tema 266 TNU", "art. 43 § 5º", "reavaliação"], "resposta": "A dispensa de avaliação a que se refere o art. 43 § 5º da Lei n. 8.213/91, com a redação dada pela Lei n. 13.847/19, não alcançará os benefícios cessados antes da sua edição.\nSinal: ADVERSO.\nStatus: transitado; julgado em 26/02/2021; transitado em julgado em 04/10/2021 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 266 (PEDILEF 5017999-45.2018.4.04.7001/PR)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t268", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 268 da TNU?", "variantes": ["tema 268", "TNU 268", "tema 268 TNU", "técnico agrícola", "agropecuária"], "resposta": "A ocupação de técnico agrícola não é equiparável à do \"trabalhador na agropecuária\", prevista no item 2.2.1 do Decreto 53.831/64, para fins de enquadramento por mera presunção de categoria profissional.\nSinal: ADVERSO.\nStatus: transitado; julgado em 26/08/2021; transitado em julgado em 13/10/2021 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 268 (PEDILEF 0535102-37.2018.4.05.8013/AL)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t269", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 269 da TNU?", "variantes": ["tema 269", "TNU 269", "tema 269 TNU", "acidente de qualquer natureza", "evento súbito"], "resposta": "O conceito de acidente de qualquer natureza, para os fins do art. 86 da Lei 8.213/91 (auxílio-acidente), consiste em evento súbito e de origem traumática, por exposição a agentes exógenos físicos, químicos ou biológicos, ressalvados os casos de acidente do trabalho típicos ou por equiparação, caracterizados na forma dos arts. 19 a 21 da Lei 8.213/91.\nSinal: ADVERSO.\nStatus: transitado; julgado em 06/05/2022; transitado em julgado em 21/04/2023 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 269 (PEDILEF 0031628-86.2017.4.02.5054/ES)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t272", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 272 da TNU?", "variantes": ["tema 272", "TNU 272", "tema 272 TNU", "cirurgia", "recusa à cirurgia"], "resposta": "A circunstância de a recuperação da capacidade depender de intervenção cirúrgica não autoriza, automaticamente, a concessão de aposentadoria por invalidez (aposentadoria por incapacidade permanente), sendo necessário verificar a inviabilidade de reabilitação profissional, consideradas as condições pessoais do segurado, e a sua manifestação inequívoca a respeito da recusa ao procedimento cirúrgico.\nSinal: NEUTRO (aproveitáveis a recusa inequívoca à cirurgia e a inviabilidade de reabilitação pelas condições pessoais).\nStatus: transitado; julgado em 10/02/2022, trânsito em 09/06/2022 (conferido em 25/10/2026).", "fonte": "TNU, Tema representativo 272 (PEDILEF 0211995-08.2017.4.02.5151/RJ)", "origem": "catalogo-temas-vinculantes.md v1.15, §4 e §7", "sinal": "firme"}, {"id": "tnu-t274", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 274 da TNU?", "variantes": ["tema 274", "TNU 274", "tema 274 TNU", "doença estigmatizante", "condições sociais"], "resposta": "É possível a concessão de aposentadoria por invalidez, após análise das condições sociais, pessoais, econômicas e culturais, existindo incapacidade parcial e permanente, no caso de outras doenças, que não se relacionem com o vírus HIV (vírus da imunodeficiência humana), mas, que sejam estigmatizantes e impactem significativa e negativamente na funcionalidade social do segurado, entendida esta como o potencial de acesso e permanência no mercado de trabalho.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 23/09/2021, trânsito em 24/10/2022 (conferido em 25/10/2026).\nAtenção: O repositório de 16/10/2026 imprime 30/09/2021, data da publicação, como data do julgamento.", "fonte": "TNU, Tema representativo 274 (PEDILEF 0512288-77.2017.4.05.8300/PE)", "origem": "catalogo-temas-vinculantes.md v1.15, §4 e §7", "sinal": "firme"}, {"id": "tnu-t275", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 275 da TNU?", "variantes": ["tema 275", "TNU 275", "tema 275 TNU", "adicional de 25%", "termo inicial"], "resposta": "O termo inicial do adicional de 25% do art. 45 da Lei 8.213/91, concedido judicialmente, deve ser: I. a data de início da aposentadoria por invalidez (aposentadoria por incapacidade permanente), independentemente de requerimento específico, se nesta data já estiver presente a necessidade da assistência permanente de outra pessoa; II. a data do primeiro exame médico de revisão da aposentadoria por invalidez no âmbito administrativo, na forma do art. 101 da Lei 8.213/91, independentemente de requerimento específico, no qual o INSS (Instituto Nacional do Seguro Social) tenha negado ou deixado de reconhecer o direito ao adicional, se nesta data já estiver presente a necessidade da assistência permanente de outra pessoa; III. a data do requerimento administrativo específico do adicional, se nesta data já estiver presente a necessidade da assistência permanente de outra pessoa;IV. a data da citação, na ausência de qualquer dos termos iniciais anteriores, se nesta data já estiver presente a necessidade da assistência permanente de outra pessoa; V. a data da realização da perícia judicial, se não houver elementos probatórios que permitam identificar fundamentadamente a data de início da necessidade da assistência permanente de outra pessoa em momento anterior.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 21/06/2021; transitado em julgado em 29/07/2022 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 275 (PEDILEF 5002674-54.2019.4.04.7208/SC)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t277", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 277 da TNU?", "variantes": ["tema 277", "TNU 277", "tema 277 TNU", "pedido de prorrogação", "interesse de agir"], "resposta": "O direito à continuidade do benefício por incapacidade temporária com estimativa de DCB (alta programada) pressupõe, por parte do segurado, pedido de prorrogação (§ 9º, art. 60 da Lei n. 8.213/91), recurso administrativo ou pedido de reconsideração, quando previstos normativamente, sem o quê não se configura interesse de agir em juízo.\nSinal: ADVERSO.\nStatus: transitado; julgado em 17/03/2022, trânsito em 25/04/2022 (conferido em 25/10/2026).", "fonte": "TNU, Tema representativo 277 (PEDILEF 0500255-75.2019.4.05.8303/PE)", "origem": "catalogo-temas-vinculantes.md v1.15, §4 e §7", "sinal": "firme"}, {"id": "tnu-t278", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 278 da TNU?", "variantes": ["tema 278", "TNU 278", "tema 278 TNU", "CTC", "contagem recíproca"], "resposta": "I - O(A) segurado(a) que trabalhava sob condições especiais e passou, sob qualquer condição, para regime previdenciário diverso, tem direito à expedição de certidão desse tempo identificado como especial, discriminado de data a data, ficando a conversão em comum e a contagem recíproca à critério do regime de destino, nos termos do art. 96, IX, da Lei n.º 8.213/1991; II - Na contagem recíproca entre o Regime Geral da Previdência Social - RGPS (Regime Geral de Previdência Social) e o Regime Próprio da União, é possível a conversão de tempo especial em comum, cumprido até o advento da EC (Emenda Constitucional) n.º 103/2019.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 27/09/2021; transitado em julgado em 22/08/2023 (2 verbetes) (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 278 (PEDILEF 5005679-21.2018.4.04.7111/RS)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t283", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 283 da TNU?", "variantes": ["tema 283", "TNU 283", "tema 283 TNU", "coisa julgada administrativa", "revisão"], "resposta": "A coisa julgada administrativa não exclui a apreciação da matéria controvertida pelo poder judiciário e não é oponível à revisão de ato administrativo para adequação aos requisitos previstos na lei previdenciária, enquanto não transcorrido o prazo decadencial.\nSinal: NEUTRO.\nStatus: transitado; julgado em 31/08/2021; transitado em julgado em 04/10/2021 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 283 (PEDILEF 5002117-85.2019.4.04.7202/SC)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t284", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 284 da TNU?", "variantes": ["tema 284", "TNU 284", "tema 284 TNU", "renúncia à cota", "pensão"], "resposta": "Os dependentes que recebem ou que têm direito à cota de pensão por morte podem renunciar a esse direito para o fim de receber benefício assistencial de prestação continuada, uma vez preenchidos os requisitos da Lei 8.742/1993.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 18/08/2022; transitado em julgado em 24/01/2023 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 284 (PEDILEF 0004160-11.2017.4.01.4300/TO)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t285", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 285 da TNU?", "variantes": ["tema 285", "TNU 285", "tema 285 TNU", "CadÚnico", "atualização extemporânea"], "resposta": "A atualização/revalidação extemporânea das informações do CadÚnico (Cadastro Único para Programas Sociais), realizada antes da exclusão do cadastro na forma regulamentar, autoriza a validação retroativa das contribuições pela alíquota de 5%, desde que comprovados os requisitos de enquadramento como segurado facultativo, na forma do art. 21, §2º, II, alínea b', da Lei 8.212/91.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 12/11/2021; transitado em julgado em 25/01/2022 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 285 (PEDILEF 5018761-55.2018.4.04.7100/RS)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t286", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 286 da TNU?", "variantes": ["tema 286", "TNU 286", "tema 286 TNU", "complementação", "5%"], "resposta": "Para fins de pensão por morte, é possível a complementação, após o óbito, pelos dependentes, das contribuições recolhidas em vida, a tempo e modo, pelo segurado facultativo de baixa renda do art. 21, §2º, II, 'b', da Lei 8.212/91, da alíquota de 5% para as de 11% ou 20%, no caso de não validação dos recolhimentos.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 23/06/2022; transitado em julgado em 26/07/2022 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 286 (PEDILEF 5007366-70.2017.4.04.7110/RS)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t287", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 287 da TNU?", "variantes": ["tema 287", "TNU 287", "tema 287 TNU", "amianto", "fator 1,75"], "resposta": "É 1,75 para homem e 1,50 para mulher o fator de conversão em comum do tempo especial laborado com exposição ao amianto, inclusive na superfície, para requerimentos administrativos feitos a partir da edição do Decreto 2.172/1997 (05/03/1997), ainda que seja anterior o período trabalhado com exposição ao agente nocivo.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 27/08/2021; transitado em julgado em 04/10/2021 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 287 (PEDILEF 0023252-47.2017.4.01.3500/GO)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t288", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 288 da TNU?", "variantes": ["tema 288", "TNU 288", "tema 288 TNU", "pandemia", "dispensa de perícia"], "resposta": "Em resposta emergencial e preventiva, para evitar o risco de transmissão e contágio por Coronavírus (SARS-CoV-2) durante a crise pandêmica, é possível a dispensa de perícia médica para concessão de benefício por incapacidade laboral, quando apresentados pareceres técnicos ou documentos médicos elucidativos, suficientes à formação da convicção judicial, desde que observado o contraditório, a ampla defesa e o princípio da não surpresa.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 16/02/2022; transitado em julgado em 26/07/2022 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 288 (PEDILEF 0507847-64.2019.4.05.8500/SE)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t296", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 296 da TNU?", "variantes": ["tema 296", "TNU 296", "tema 296 TNU", "Bolsa Família", "renda"], "resposta": "O BPC/LOAS (idoso ou deficiente) integra os conceitos de renda familiar mensal e renda familiar per capita para fins de aferição dos critérios de acesso ao programa Bolsa-família.\nSinal: NEUTRO.\nStatus: transitado; julgado em 23/06/2022; transitado em julgado em 29/07/2022 (2 verbetes) (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 296 (PEDILEF 0004582-91.2018.4.02.5053/ES)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t298", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 298 da TNU?", "variantes": ["tema 298", "TNU 298", "tema 298 TNU", "hidrocarbonetos", "óleos e graxas"], "resposta": "A partir da vigência do Decreto 2.172/97, a indicação genérica de exposição a \"hidrocarbonetos\" ou \"óleos e graxas\", ainda que de origem mineral, não é suficiente para caracterizar a atividade como especial, sendo indispensável a especificação do agente nocivo.\nSinal: ADVERSO (aproveitável: o acórdão manda oportunizar a prova da espécie do hidrocarboneto, inclusive pericial).\nStatus: transitado; julgado em 23/06/2022, ED (embargos de declaração) em 15/09/2022, trânsito em 02/05/2023 (conferido em 21/10/2026).", "fonte": "TNU, Tema representativo 298 (PEDILEF 5001319-31.2018.4.04.7115/RS)", "origem": "catalogo-temas-vinculantes.md v1.15, §4 e §7", "sinal": "firme"}, {"id": "tnu-t301", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 301 da TNU?", "variantes": ["tema 301", "TNU 301", "tema 301 TNU", "120 dias", "descaracterização"], "resposta": "Cômputo do Tempo de Trabalho Rural I. Para a aposentadoria por idade do trabalhador rural não será considerada a perda da qualidade de segurado nos intervalos entre as atividades rurícolas. Descaracterização da condição de segurado especial II. A condição de segurado especial é descaracterizada a partir do 1º dia do mês seguinte ao da extrapolação dos 120 dias de atividade remunerada no ano civil (Lei 8.213/91, art. 11, § 9º, III); III. Cessada a atividade remunerada referida no item II e comprovado o retorno ao trabalho de segurado especial, na forma do art. 55, parag. 3o, da Lei 8.213/91, o trabalhador volta a se inserir imediatamente no VII, do art. 11 da Lei 8.213/91, ainda que no mesmo ano civil.\nSinal: NEUTRO.\nStatus: transitado; julgado em 16/09/2022; trânsito em julgado em 24/10/2022 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 301 (PEDILEF 0501240-10.2020.4.05.8303/PE)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t310", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 310 da TNU?", "variantes": ["tema 310", "TNU 310", "tema 310 TNU", "divisor", "baixa renda"], "resposta": "A partir da vigência da Medida Provisória 871/2019, convertida na Lei 13.846/2019, a aferição da renda para enquadramento do segurado como baixa renda, visando à concessão de auxílio-reclusão, dá-se pela média dos salários de contribuição apurados no período de 12 meses anteriores ao mês do recolhimento à prisão, computando-se no divisor apenas o número de salários de contribuição efetivamente existentes no período.\nSinal: ADVERSO.\nStatus: transitado; julgado em 20/04/2023; transitado em julgado em 20/09/2023 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 310 (5027480-64.2020.4.04.7000 /PR)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t315", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 315 da TNU?", "variantes": ["tema 315", "TNU 315", "tema 315 TNU", "DIB", "dia seguinte à cessação"], "resposta": "A data do início do benefício de auxílio-acidente é o dia seguinte à data da cessação do benefício de auxílio por incapacidade temporária, que lhe deu origem, independentemente de pedido de prorrogação deste ou de pedido específico de concessão do benefício de auxílio-acidente, nos termos do art. 86, § 2º, da Lei 8.213/91, observada a prescrição quinquenal dos valores atrasados.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 18/10/2023; transitado em julgado em 24/04/2024 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 315 (PEDILEF 5063339-35.2020.4.04.7100/RS)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t317", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 317 da TNU?", "variantes": ["tema 317", "TNU 317", "tema 317 TNU", "dosimetria", "dose"], "resposta": "A menção à dose, dosímetro ou dosimetria no PPP (Perfil Profissiográfico Previdenciário) não é suficiente para se concluir pela observância das determinações da Norma de Higiene Ocupacional (NHO-01) da FUNDACENTRO (Fundação Jorge Duprat Figueiredo de Segurança e Medicina do Trabalho) e/ou da NR-15 (Norma Regulamentadora 15), nos termos do Tema 174 da TNU (Turma Nacional de Uniformização). É necessário menção expressa às referidas normas para indicar que as técnicas e metodologias utilizadas na aferição do ruído seguiram todos os seus preceitos.\nSinal: ADVERSO (remédio só pelo item b do Tema 174).\nStatus: transitado; julgado em 18/09/2025, trânsito em 11/02/2026 (conferido em 25/10/2026).", "fonte": "TNU, Tema representativo 317 (PEDILEF 5000648-28.2020.4.02.5002/ES)", "origem": "catalogo-temas-vinculantes.md v1.15, §4 e §7", "sinal": "firme"}, {"id": "tnu-t322", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 322 da TNU?", "variantes": ["tema 322", "TNU 322", "tema 322 TNU", "PBC", "segurado especial"], "resposta": "Devem ser computados os valores percebidos a título de auxílio-acidente no período básico de cálculo (PBC) da aposentadoria por idade rural do segurado especial, para fins de incremento da renda mensal inicial (RMI), independentemente do recolhimento de contribuições facultativas, a teor do inciso II do artigo 34 da Lei n. 8.213/91, excetuadas as hipóteses de cumulação de benefícios contempladas na Súmula 507 do STJ (Superior Tribunal de Justiça).\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 24/11/2023; transitado em julgado em 29/01/2024 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 322 (PEDILEF 5014634-54.2021.4.04.7202/SC)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t323", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 323 da TNU?", "variantes": ["tema 323", "TNU 323", "tema 323 TNU", "calor", "taxa de metabolismo"], "resposta": "a) para se apurar o limite de exposição ao agente agressivo calor entre 06/03/1997 e 18/11/2003, em regime de trabalho intermitente com períodos de descanso no próprio local de prestação de serviço (Quadro nº1 do Anexo nº 3 da NR-15 (Norma Regulamentadora 15)), não se faz necessária a indicação no PPP (Perfil Profissiográfico Previdenciário) - ou LTCAT (Laudo Técnico das Condições Ambientais de Trabalho) - da taxa de metabolismo (Kcal/h), pois o tipo de atividade(s) - leve, moderada ou pesada, desde que enquadrada em uma mesma categoria - é obtido pela descrição do labor exercido pelo segurado (Quadro nº 3 do Anexo nº 3 da NR-15); b) para se apurar o limite de exposição ao agente agressivo calor entre 06/03/1997 e 18/11/2003, em regime de trabalho intermitente com período de descanso em local diverso daquele de prestação de serviço, ou no mesmo ambiente quando os tipos de atividades não se enquadrarem na mesma categoria - leve, moderada ou pesada -, é imprescindível a indicação no PPP - ou LTCAT - da taxa de metabolismo média ponderada para uma hora M (Kcal/h), conforme Quadro nº 2 do Anexo nº 3 da NR-15; e c) para se apurar o limite de exposição ao agente agressivo calor, a partir de 1º/01/2004, ou facultativamente, 19/11/2003, é imprescindível a adoção da metodologia e dos procedimentos NHO 06 da FUNDACENTRO (Fundação Jorge Duprat Figueiredo de Segurança e Medicina do Trabalho), bem como a indicação no PPP - ou LTCAT - da taxa de metabolismo média ponderada para uma hora M (W), conforme Anexo nº 3 da NR-15 (Quadro nº 2 da Portaria SEPRT nº 1.359, de 09/12/2019, e Quadro nº 3 da Portaria MTP nº 426, de 07/10/2021).\nSinal: NEUTRO.\nStatus: transitado; julgado em 12/11/2025; transitado em julgado em 17/04/2026 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 323 (PEDILEF 0510577-41.2020.4.05.8200/PB)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t327", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 327 da TNU?", "variantes": ["tema 327", "TNU 327", "tema 327 TNU", "cônjuge empregado rural", "prova material"], "resposta": "Constitui início de prova material do exercício de atividade rural a documentação em nome do cônjuge ou companheiro que o qualifica como empregado rural para fins de concessão de benefício previdenciário na condição de segurado especial.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 07/11/2024; trânsito em julgado em 11/12/2024 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 327 (PEDILEF 0040819-60.2014.4.01.3803/MG)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t343", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 343 da TNU?", "variantes": ["tema 343", "TNU 343", "tema 343 TNU", "DII", "data de início da incapacidade"], "resposta": "A fixação da data de início da incapacidade (DII) na data da perícia constitui medida excepcional, que demanda fundamentação capaz de afastar a presunção lógica de que a incapacidade teve início em momento anterior ao exame pericial.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 09/04/2025, ED (embargos de declaração) em 11/03/2026, trânsito em 17/04/2026 (conferido em 07/10/2026).", "fonte": "TNU, Tema representativo 343 (PEDILEF 0523447-97.2020.4.05.8013/AL)", "origem": "catalogo-temas-vinculantes.md v1.15, §4 e §7", "sinal": "firme"}, {"id": "tnu-t344", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 344 da TNU?", "variantes": ["tema 344", "TNU 344", "tema 344 TNU", "adotante", "120 dias"], "resposta": "É devido o salário-maternidade pelo prazo de 120 dias ao segurado ou segurada adotante de menor de dezoito anos de idade.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado; transitado em julgado; tese revisada; Julgado em 18/03/2025; transitado em julgado em 28/04/2025 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 344 (PEDILEF 1006649-81.2020.4.01.3820/MG)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t347", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 347 da TNU?", "variantes": ["tema 347", "TNU 347", "tema 347 TNU", "agente comunitário de saúde", "EC 120"], "resposta": "Tese literal não transcrita nas fontes; o catálogo a resume assim: agente comunitário de saúde e de combate às endemias, art. 198, § 10, da CF (EC (Emenda Constitucional) 120/2022) de eficácia limitada, exigida a exposição efetiva até a lei complementar.\nSinal: ADVERSO.\nStatus: julgado e publicado em 11/02/2026; a célula de trânsito remete ao RE (recurso extraordinário) 1605997 (STF (Supremo Tribunal Federal) Tema 1470), sem data (conferido em 25/10/2026).\nAtenção: Aguarda o STF Tema 1470, com repercussão geral reconhecida e sem tese.", "fonte": "TNU, Tema representativo 347 (PEDILEF 5000482-58.2022.4.04.7010/PR)", "origem": "catalogo-temas-vinculantes.md v1.15, §4 e §7", "sinal": "controvertido"}, {"id": "tnu-t348", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 348 da TNU?", "variantes": ["tema 348", "TNU 348", "tema 348 TNU", "segurado especial", "inatividade involuntária"], "resposta": "O segurado especial tem direito à prorrogação do período de graça por inatividade involuntária, aplicando-se por analogia o art. 15, §2º, da Lei nº 8.213/91.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 14/05/2025; transitado em julgado em 17/06/2025 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 348 (PEDILEF Nº 0504229-18.2022.4.05.8400/RN)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t350", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 350 da TNU?", "variantes": ["tema 350", "TNU 350", "tema 350 TNU", "Lei 13.846", "12 meses"], "resposta": "O segurado em gozo de auxílio-acidente, ou que tenha a data da consolidação das lesões até 17 de junho de 2019, mantém a qualidade de segurado por 12 (doze) meses a partir da vigência da Lei 13.846/2019, observadas as possibilidades de prorrogação previstas nos §§ 1º e 2º do art. 15 da Lei 8.213/91.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 12/02/2025; transitado em julgado em 27/03/2025 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 350 (PEDILEF 5006764-40.2021.4.04.7013/PR)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t354", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 354 da TNU?", "variantes": ["tema 354", "TNU 354", "tema 354 TNU", "tecelagem", "Parecer 085/78"], "resposta": "À míngua da existência do Parecer MT-SSMT nº 085/78, impossível o enquadramento especial da atividade de trabalhador em indústria têxtil exercida até edição da lei 9.032/95, por analogia, em relação aos códigos 2.5.1 do Decreto 53.831/64 e 1.2.11 do Decreto 83.080/79, com esteio tão somente nesse fictício parecer.\nSinal: ADVERSO.\nStatus: transitado; julgado em 02/07/2024; transitado em julgado em 28/11/2024 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 354 (PEDILEF 5002079-59.2018.4.02.5102/RJ)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t355", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 355 da TNU?", "variantes": ["tema 355", "TNU 355", "tema 355 TNU", "seminarista", "aluno-aprendiz"], "resposta": "O seminarista em congregação religiosa não se equipara ao aluno aprendiz para fins previdenciários.\nSinal: ADVERSO.\nStatus: transitado; julgado em 25/02/2021; transitado em julgado em 09/09/2026 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 355 (PEDILEF 5007869-10.2020.4.04.7200/SC)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t357", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 357 da TNU?", "variantes": ["tema 357", "TNU 357", "tema 357 TNU", "semiaberto", "MP 871"], "resposta": "O beneficio de auxílio-reclusão concedido para fatos geradores ocorridos antes de 18 de janeiro de 2019, data da vigência da MP (Medida Provisória) nº 871, permanece mesmo na hipótese de progressão de regime fechado para o semiaberto (inclusive em caso de monitoramento eletrônico).\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 10/12/2024; transitado em julgado em 12/02/2025 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 357 (PEDILEF 5000345-04.2021.4.04.7013/PR)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t358", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 358 da TNU?", "variantes": ["tema 358", "TNU 358", "tema 358 TNU", "carência", "contribuição tempestiva"], "resposta": "1. Tempo de contribuição e carência são institutos distintos. 2. Carência condiz com contribuições tempestivas. 3. O art. 18 da EC (Emenda Constitucional) 103/2019 não dispensa a carência para a concessão de aposentadoria.\nSinal: ADVERSO.\nStatus: transitado; julgado em 16/10/2024, trânsito em 29/11/2024 (conferido em 03/11/2026).\nAtenção: O caso e a ratio são de recolhimento retroativo após a perda da qualidade; o risco é a leitura ampla do item 2 contra atraso pago dentro da qualidade.", "fonte": "TNU, Tema representativo 358 (PEDILEF 0500179-22.2022.4.05.8311/PE)", "origem": "catalogo-temas-vinculantes.md v1.15, §4 e §7", "sinal": "firme"}, {"id": "tnu-t359", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 359 da TNU?", "variantes": ["tema 359", "TNU 359", "tema 359 TNU", "facultativo baixa renda", "complementação"], "resposta": "No caso de não validação dos recolhimentos do segurado facultativo de baixa renda (art. 21, §2º, II, 'b', da Lei nº 8.212/91), a complementação posterior das contribuições recolhidas a menor viabiliza a manutenção da qualidade de segurado e o cômputo da carência para fins de concessão do benefício por incapacidade, permitindo a fixação da data de início do benefício (DIB) em momento anterior ao pagamento do complemento, com efeitos financeiros desde a DIB.\nSinal: FAVORÁVEL.\nStatus: transitado; julgado em 14/05/2025; transitado em julgado em 17/06/2025 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 359 (PEDILEF Nº 0504229-18.2022.4.05.8400/RN)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t369", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 369 da TNU?", "variantes": ["tema 369", "TNU 369", "tema 369 TNU", "renda per capita", "benefício acima do mínimo"], "resposta": "Na análise do direito ao Benefício de Prestação Continuada, quando pessoa idosa ou com deficiência, integrante do núcleo familiar, auferir benefício previdenciário de valor superior ao salário-mínimo, a renda familiar per capita deve ser calculada considerando o valor integral do benefício.\nSinal: ADVERSO.\nStatus: transitado; julgado em 11/02/2026; trânsito em 31/03/2026 pelo portal e em 14/04/2026 pelo repositório (conferido em 02/11/2026).\nAtenção: Data do trânsito divergente entre portal e repositório, não resolvida.", "fonte": "TNU, Tema representativo 369 (PEDILEF 0001882-94.2021.4.05.8500/SE)", "origem": "catalogo-temas-vinculantes.md v1.15, §4 e §7", "sinal": "firme"}, {"id": "tnu-t371", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 371 da TNU?", "variantes": ["tema 371", "TNU 371", "tema 371 TNU", "união estável", "24 meses"], "resposta": "1. É aplicável ao processo judicial a exigência de início de prova material de união estável e de dependência econômica, produzido em período não superior a 24 (vinte e quatro) meses anteriores ao fato gerador do benefício, nos termos do § 5º do art. 16 da Lei nº 8.213/1991, acrescentado pela Lei nº 13.846/2019. 2. Tratando-se de norma de direito material, essa exigência somente se aplica aos fatos geradores ocorridos a partir da vigência da MP (Medida Provisória) nº 871/2019, posteriormente convertida na Lei nº 13.846/2019.\nSinal: NEUTRO.\nStatus: transitado; julgado em 18/09/2025; transitado em julgado em 21/10/2025 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 371 (PEDILEF 0501240-21.2022.4.05.8503/SE)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t375", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 375 da TNU?", "variantes": ["tema 375", "TNU 375", "tema 375 TNU", "IRSM", "MP 201/2004"], "resposta": "A decadência do direito de revisar o ato inicial de concessão de benefício previdenciário, com a inclusão do Índice de Reajuste do Salário Mínimo (IRSM) de 39,67% na atualização do salário de contribuição de fevereiro de 1994, não se interrompeu pela publicação da Medida Provisória nº 201/2004, convertida na Lei nº 10.999/2004, restando superada a tese firmada pela TNU (Turma Nacional de Uniformização) no
