md §7 (Carência e isenção)", "sinal": "firme"}, {"id": "inc-058", "tema": "Carência e qualidade de segurado", "pergunta": "Caí em casa e quebrei a perna. Fico isento de carência?", "variantes": ["acidente fora do trabalho dispensa carência", "acidente de qualquer natureza", "acidente doméstico e auxílio-doença"], "resposta": "Pelo regulamento, sim: acidente de qualquer natureza é o evento de origem traumática ou por agente externo, e isenta de carência mesmo fora do trabalho. A TNU (Turma Nacional de Uniformização) restringe o conceito ao evento súbito e traumático (Tema 269, adverso), o que deixa de fora quadros que não sejam desse tipo.", "fonte": "Lei 8.213/1991, art. 26, II; Dec. 3.048/1999, art. 30, § 1º; TNU Tema 269", "origem": "doutrina-incapacidade.md §7 (Carência e isenção)", "sinal": "controvertido"}, {"id": "inc-059", "tema": "Carência e qualidade de segurado", "pergunta": "Fiquei anos sem pagar e voltei a contribuir. Quantas parcelas preciso?", "variantes": ["perdi a qualidade de segurado e voltei a pagar", "recuperar a carência", "quanto tempo depois de voltar a contribuir posso pedir auxílio"], "resposta": "Depois da perda da qualidade de segurado, é preciso cumprir metade da carência, ou seja, 6 contribuições, a contar da nova filiação, para o auxílio por incapacidade temporária e a aposentadoria por incapacidade permanente.", "fonte": "Lei 8.213/1991, art. 27-A", "origem": "doutrina-incapacidade.md §7 (Carência e isenção)", "sinal": "firme"}, {"id": "inc-060", "tema": "Carência e qualidade de segurado", "pergunta": "Já tinha a doença quando comecei a pagar o INSS. Tenho direito?", "variantes": ["doença preexistente", "comecei a contribuir já doente", "o INSS negou porque a doença é anterior"], "resposta": "Não, se a doença ou lesão já existia antes da filiação. A exceção é a incapacidade que surge por progressão ou agravamento dessa doença depois da filiação.", "fonte": "Lei 8.213/1991, art. 59, § 1º (red. Lei 13.846/2019)", "origem": "doutrina-incapacidade.md §7 (Auxílio por incapacidade temporária: requisito e valor)", "sinal": "firme"}, {"id": "inc-061", "tema": "Carência e qualidade de segurado", "pergunta": "Parei de trabalhar. Por quanto tempo ainda tenho direito ao auxílio-doença?", "variantes": ["período de graça", "desempregado tem auxílio-doença?", "quanto tempo fico segurado sem pagar"], "resposta": "Mantém a qualidade de segurado por 12 meses depois de cessar as contribuições, 24 meses com mais de 120 contribuições sem perda da qualidade, mais 12 meses se o desemprego estiver registrado, e 6 meses para o facultativo. Em gozo de benefício, mantém sem limite, exceto no auxílio-acidente. A perda ocorre no dia seguinte ao vencimento da contribuição do mês posterior ao fim desse prazo.", "fonte": "Lei 8.213/1991, art. 15, I, II e §§ 1º, 2º e 4º", "origem": "doutrina-previdenciaria.md §6 (Período de graça)", "sinal": "firme"}, {"id": "inc-062", "tema": "Carência e qualidade de segurado", "pergunta": "O tempo que fiquei no auxílio-doença conta para aposentadoria?", "variantes": ["tempo encostado conta para aposentar", "período em benefício conta como contribuição", "auxílio-doença conta tempo de serviço"], "resposta": "Conta quando intercalado com períodos de atividade ou contribuição. Pela TNU (Turma Nacional de Uniformização), o benefício não decorrente de acidente do trabalho só conta como tempo de contribuição ou carência se intercalado entre períodos com recolhimento. Intercalado, entra na média com o salário de benefício reajustado como salário de contribuição.", "fonte": "Lei 8.213/1991, arts. 29, § 5º, e 55, II; TNU Súm. 73; STF Tema 88", "origem": "doutrina-incapacidade.md §7 (Transformação e período em benefício no PBC); catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "inc-063", "tema": "Carência e qualidade de segurado", "pergunta": "Trabalhava em atividade especial e fiquei afastado. O tempo de afastamento conta como especial?", "variantes": ["auxílio-doença conta como tempo especial", "afastamento de quem trabalhava com insalubridade", "tempo especial durante o benefício"], "resposta": "Na Justiça, sim: o período em auxílio-doença, acidentário ou previdenciário, conta como especial para quem exercia atividade especial (STJ, Superior Tribunal de Justiça, Tema 998; TNU, Turma Nacional de Uniformização, Tema 165). Na via administrativa, o INSS (Instituto Nacional do Seguro Social) não conta como especial o afastamento por incapacidade a partir de 01/07/2020, e não há tese lida sobre esse período.", "fonte": "STJ Tema 998; TNU Tema 165; IN 128/2022, art. 271, § 2º", "origem": "doutrina-previdenciaria.md §5 (Contribuinte individual e afastamento; bloco ADVERSO agentes biológicos), LACUNA ins. R8 c.10", "sinal": "controvertido"}, {"id": "inc-064", "tema": "Trabalho, acumulação e reabilitação", "pergunta": "Posso trabalhar recebendo auxílio-doença?", "variantes": ["voltei a trabalhar encostado", "fazer bico recebendo auxílio", "trabalhar durante o benefício"], "resposta": "Não. A volta voluntária ao trabalho que garanta a subsistência cancela o auxílio por incapacidade temporária desde o retorno, com ressarcimento do que foi pago. A regra vale para quem já está recebendo; quem trabalhou depois de ter o pedido negado segue outra regra na Justiça (STJ, Superior Tribunal de Justiça, Tema 1.013).", "fonte": "Lei 8.213/1991, art. 60, §§ 6º e 7º; Dec. 3.048/1999, art. 73, §§ 5º e 6º; IN 128/2022, art. 342; STJ Tema 1.013", "origem": "doutrina-incapacidade.md §7 (Data de início, duração e cessação; Trabalho durante a incapacidade e compensação)", "sinal": "firme"}, {"id": "inc-065", "tema": "Trabalho, acumulação e reabilitação", "pergunta": "O INSS negou e tive que trabalhar doente. Perco os atrasados?", "variantes": ["trabalhei enquanto o processo corria", "recebo o atrasado mesmo tendo trabalhado", "trabalhei por necessidade depois do indeferimento"], "resposta": "Não. Entre o indeferimento e a implantação pela Justiça, o segurado recebe o benefício retroativo junto com a remuneração do trabalho, ainda que incompatível com a incapacidade (STJ, Superior Tribunal de Justiça, Tema 1.013). A TNU (Turma Nacional de Uniformização) admite o benefício no período trabalhado quando provada a incapacidade para a atividade habitual na época.", "fonte": "STJ Tema 1.013; TNU Súm. 72", "origem": "doutrina-incapacidade.md §7 (Trabalho durante a incapacidade e compensação)", "sinal": "firme"}, {"id": "inc-066", "tema": "Trabalho, acumulação e reabilitação", "pergunta": "Posso receber auxílio-doença e aposentadoria juntos?", "variantes": ["aposentado pode pegar auxílio-doença", "acumular aposentadoria e auxílio", "sou aposentado e fiquei doente"], "resposta": "Não. A lei veda o recebimento conjunto de aposentadoria e auxílio por incapacidade temporária, e também de salário-maternidade e auxílio, salvo direito adquirido.", "fonte": "Lei 8.213/1991, art. 124, I e IV", "origem": "doutrina-incapacidade.md §7 (Trabalho durante a incapacidade e compensação); 03_TESES/legislacao/leis/Lei-8213-1991 (art. 124)", "sinal": "firme"}, {"id": "inc-067", "tema": "Trabalho, acumulação e reabilitação", "pergunta": "Posso receber seguro-desemprego e auxílio-doença juntos?", "variantes": ["fui demitido e fiquei doente", "seguro-desemprego com benefício do INSS", "seguro-desemprego e auxílio-acidente"], "resposta": "Não com o auxílio por incapacidade temporária: o seguro-desemprego é inacumulável com benefício de prestação continuada, e na Justiça o valor é abatido (TNU, Turma Nacional de Uniformização, Tema 232). As exceções são a pensão por morte e o auxílio-acidente, que podem ser recebidos junto com o seguro-desemprego.", "fonte": "Lei 8.213/1991, art. 124, par. único; TNU Tema 232, ADVERSO", "origem": "doutrina-incapacidade.md §7 (Trabalho durante a incapacidade e compensação)", "sinal": "firme"}, {"id": "inc-068", "tema": "Trabalho, acumulação e reabilitação", "pergunta": "Já recebi outro benefício no período. Vou ter que devolver tudo?", "variantes": ["desconto de benefício pago no administrativo", "compensação de atrasados", "INSS quer descontar o que já pagou"], "resposta": "Não de uma vez. A compensação de benefício inacumulável pago administrativamente se faz mês a mês, sem gerar saldo negativo contra o segurado.", "fonte": "STJ Tema 1.207", "origem": "doutrina-incapacidade.md §7 (Trabalho durante a incapacidade e compensação)", "sinal": "firme"}, {"id": "inc-069", "tema": "Trabalho, acumulação e reabilitação", "pergunta": "O que é a reabilitação profissional do INSS?", "variantes": ["não posso mais fazer minha função, e agora", "INSS vai me treinar para outra profissão", "reabilitação do INSS"], "resposta": "O segurado em auxílio por incapacidade temporária que não pode se recuperar para a atividade habitual deve passar por reabilitação para outra atividade. O benefício é mantido até ser considerado reabilitado para atividade que garanta a subsistência ou, se não recuperável, até ser aposentado por incapacidade permanente. Concluída, o INSS (Instituto Nacional do Seguro Social) emite certificado com as atividades que pode exercer.", "fonte": "Lei 8.213/1991, arts. 62, caput e § 1º, 89 e 92", "origem": "03_TESES/legislacao/leis/Lei-8213-1991 (arts. 62, 89 a 92)", "sinal": "firme"}, {"id": "inc-070", "tema": "Trabalho, acumulação e reabilitação", "pergunta": "A reabilitação inclui prótese e transporte?", "variantes": ["INSS dá prótese", "órtese pelo INSS", "transporte do acidentado"], "resposta": "Sim. A reabilitação profissional compreende o fornecimento, a reparação e a substituição de prótese, órtese e instrumentos de locomoção quando atenuarem a perda funcional, e o transporte do acidentado do trabalho quando necessário. É devida em caráter obrigatório aos segurados, inclusive aposentados.", "fonte": "Lei 8.213/1991, arts. 89, par. único, e 90", "origem": "03_TESES/legislacao/leis/Lei-8213-1991 (arts. 89 e 90)", "sinal": "firme"}, {"id": "inc-071", "tema": "Trabalho, acumulação e reabilitação", "pergunta": "Voltei reabilitado e a empresa mudou minha função. É desvio de função?", "variantes": ["readaptação na empresa", "mudaram meu cargo depois do INSS", "função compatível com a limitação"], "resposta": "Não. A alteração de atribuições e responsabilidades compatível com a limitação sofrida não configura desvio de cargo ou função do segurado reabilitado ou em reabilitação pelo INSS (Instituto Nacional do Seguro Social). Empresas com 100 ou mais empregados devem preencher de 2% a 5% dos cargos com reabilitados ou pessoas com deficiência habilitadas.", "fonte": "Lei 8.213/1991, arts. 62, § 2º, e 93", "origem": "03_TESES/legislacao/leis/Lei-8213-1991 (arts. 62 e 93)", "sinal": "firme"}, {"id": "inc-072", "tema": "Ação judicial e competência", "pergunta": "Onde entro com a ação contra o INSS por benefício de incapacidade?", "variantes": ["Justiça Federal ou Estadual", "processo de auxílio-doença em qual justiça", "ação acidentária onde corre"], "resposta": "Benefício acidentário (auxílio, aposentadoria, auxílio-acidente ou pensão decorrentes de acidente do trabalho) vai à Justiça Estadual, fora dos juizados, qualquer que seja o valor. Benefício comum vai à Justiça Federal: JEF (Juizado Especial Federal) até 60 salários mínimos onde houver, vara federal acima disso. Comarca sem vara federal a mais de 70 km de uma, em ação desde 01/01/2020, pode correr na Justiça Estadual por competência delegada.", "fonte": "CF, art. 109, I e § 3º; Lei 8.213/1991, art. 129, II; Lei 10.259/2001, art. 3º; Lei 5.010/1966, art. 15, III; STF Tema 414; STJ Súm. 15", "origem": "competencia-e-rito.md §§1, 1-A, 4 e 5", "sinal": "firme"}, {"id": "inc-073", "tema": "Ação judicial e competência", "pergunta": "Quero converter meu auxílio comum em acidentário. Onde entro?", "variantes": ["transformar B31 em B91", "mudar auxílio-doença para acidentário", "o INSS não reconheceu que foi do trabalho"], "resposta": "Na Justiça Estadual, se a inicial afirmar nexo com o trabalho (acidente típico, doença ocupacional ou equiparado); sem nexo afirmado, a causa é previdenciária comum. A competência segue a causa de pedir e o pedido. Precedente específico do STJ (Superior Tribunal de Justiça) sobre essa conversão não foi conferido em fonte oficial.", "fonte": "CC 132.034/SP (STJ, 1ª Seção); competência pela causa de pedir", "origem": "competencia-e-rito.md §5 (Pensão, revisão e conversão; LACUNAS); gerente-previdenciario SKILL.md §5", "sinal": "controvertido"}, {"id": "inc-074", "tema": "Ação judicial e competência", "pergunta": "Ação acidentária contra o INSS tem custas? E se eu perder?", "variantes": ["preciso pagar custas na ação acidentária", "se perder pago honorários do INSS?", "ação de acidente de trabalho é de graça?"], "resposta": "O autor da ação acidentária é isento de custas e de verbas de sucumbência; a isenção é do segurado, não do INSS (Instituto Nacional do Seguro Social), que na Justiça Estadual não é isento de custas. Os honorários do perito são antecipados pelo INSS e, vencido o autor isento, ficam a cargo do Estado.", "fonte": "Lei 8.213/1991, art. 129, par. único; STJ Súm. 110 e 178; Lei 13.876/2019, art. 1º, § 7º, II; STJ Tema 1.044", "origem": "competencia-e-rito.md §§5 e 6", "sinal": "firme"}, {"id": "inc-075", "tema": "Ação judicial e competência", "pergunta": "Qual o prazo para entrar com ação acidentária?", "variantes": ["prescrição da ação de acidente de trabalho", "perdi o prazo para cobrar o INSS?", "quanto tempo tenho para processar"], "resposta": "5 anos contados do acidente, quando dele resultar morte ou incapacidade temporária, ou do reconhecimento da incapacidade permanente ou do agravamento. Contra benefício negado ou cessado não há decadência do direito; prescrevem só as parcelas de mais de 5 anos antes da ação. A ação acidentária exige prova da notificação do acidente por CAT (comunicação de acidente do trabalho), mas não exige esgotar a via administrativa.", "fonte": "Lei 8.213/1991, arts. 103, par. único, 104 e 129, II; ADI 6.096; STJ Súm. 85 e 89", "origem": "doutrina-incapacidade.md §8 (Prescrição da ação acidentária); competencia-e-rito.md §§5, 7 e 8", "sinal": "firme"}, {"id": "bpc-001", "tema": "BPC: quem tem direito", "pergunta": "Quem tem direito ao LOAS?", "variantes": ["quem pode pedir o BPC", "benefício do idoso, quem recebe", "amparo assistencial é para quem", "tenho direito ao benefício da LOAS?"], "resposta": "O BPC (benefício de prestação continuada) da LOAS (Lei Orgânica da Assistência Social) é devido à pessoa idosa com 65 anos ou mais e à pessoa com deficiência que não tenham meios de se manter nem de ser mantidas pela família. A renda familiar por pessoa precisa ser igual ou inferior a 1/4 do salário mínimo. Também são exigidos CPF (Cadastro de Pessoas Físicas), CadÚnico (Cadastro Único) atualizado há no máximo 24 meses e registro biométrico.", "fonte": "Lei 8.742/1993, art. 20, caput, § 3º, §§ 12 a 12-B; Dec. 6.214/2007, Anexo, art. 1º", "origem": "doutrina-beneficio-assistencial.md §13 (Requisitos e valor; Requisitos formais e biometria)", "sinal": "firme"}, {"id": "bpc-002", "tema": "BPC: quem tem direito", "pergunta": "Precisa ter contribuído para o INSS para receber o LOAS?", "variantes": ["nunca paguei INSS, posso receber o BPC", "LOAS exige contribuição", "benefício do idoso sem ter trabalhado"], "resposta": "Não. O BPC (benefício de prestação continuada) é benefício assistencial: os requisitos são a idade de 65 anos ou a deficiência e a renda familiar por pessoa de até 1/4 do salário mínimo, sem exigência de contribuição. Também não há desconto de contribuição sobre o valor pago.", "fonte": "CF, art. 203; Lei 8.742/1993, art. 20, caput; Dec. 6.214/2007, Anexo, art. 22", "origem": "doutrina-beneficio-assistencial.md §13 (Requisitos e valor); 03_TESES/legislacao/leis/CF-1988_constituicao-federal-consolidada.txt (art. 203)", "sinal": "firme"}, {"id": "bpc-003", "tema": "BPC: quem tem direito", "pergunta": "Quem acabou de fazer 65 anos já pode pedir o LOAS do idoso?", "variantes": ["completei 65 anos, já tenho direito ao BPC", "idade exata para o benefício do idoso", "65 anos ou mais de 65"], "resposta": "O ponto é controvertido. O caput do art. 20 da LOAS (Lei Orgânica da Assistência Social) fala em 65 anos ou mais, mas o § 14 do mesmo artigo, o decreto e a portaria falam em acima de 65 anos, e a fonte registra a divergência como lacuna. Pela letra do caput, quem completou 65 anos preenche o requisito etário.", "fonte": "Lei 8.742/1993, art. 20, caput e § 14", "origem": "doutrina-beneficio-assistencial.md §13 (Renda familiar por pessoa; LACUNA c.10)", "sinal": "controvertido"}, {"id": "bpc-004", "tema": "BPC: quem tem direito", "pergunta": "Que tipo de deficiência dá direito ao LOAS?", "variantes": ["doença dá direito ao BPC", "o que conta como deficiência para o LOAS", "doença que dura pouco tempo dá LOAS", "impedimento de longo prazo o que é"], "resposta": "É a pessoa com impedimento de longo prazo que, em interação com barreiras, obstrui sua participação plena na sociedade. Longo prazo é o impedimento com efeitos por no mínimo 2 anos. A TNU (Turma Nacional de Uniformização) conta esses 2 anos do início do impedimento até a cessação prevista, entendimento adverso a quem tem impedimento mais curto. Também conta como incapacidade para a vida independente a que impede a pessoa de prover o próprio sustento.", "fonte": "Lei 8.742/1993, art. 20, §§ 2º e 10; Lei 13.146/2015, art. 2º; TNU Tema 173 e Súmula 48 (adversos); TNU Súmula 29", "origem": "doutrina-beneficio-assistencial.md §13 (Requisitos e valor; ADVERSO; Prova da deficiência)", "sinal": "firme"}, {"id": "bpc-005", "tema": "BPC: quem tem direito", "pergunta": "Criança com deficiência pode receber o LOAS?", "variantes": ["BPC para filho pequeno", "LOAS para menor", "criança especial tem direito ao benefício"], "resposta": "Sim. Na criança e no adolescente menor de 16 anos, avaliam-se a deficiência e o impacto na limitação de atividade e de participação compatível com a idade. Os demais requisitos do BPC (benefício de prestação continuada), como a renda familiar por pessoa de até 1/4 do salário mínimo, continuam valendo.", "fonte": "Dec. 6.214/2007, Anexo, art. 4º, § 1º", "origem": "doutrina-beneficio-assistencial.md §13 (Requisitos e valor)", "sinal": "firme"}, {"id": "bpc-006", "tema": "BPC: quem tem direito", "pergunta": "Autismo ou visão de um olho só dá direito automático ao LOAS?", "variantes": ["autista tem direito ao BPC", "visão monocular dá LOAS", "TEA dá benefício assistencial"], "resposta": "Não é automático. Para o transtorno do espectro autista e para a visão monocular, a TNU (Turma Nacional de Uniformização) exige avaliação biopsicossocial, como nos demais casos de BPC (benefício de prestação continuada).", "fonte": "TNU Temas 376 e 378", "origem": "doutrina-beneficio-assistencial.md §13 (Prova da deficiência)", "sinal": "firme"}, {"id": "bpc-007", "tema": "BPC: quem tem direito", "pergunta": "Estrangeiro que mora no Brasil pode receber o LOAS?", "variantes": ["imigrante tem direito ao BPC", "estrangeiro recebe benefício do idoso", "venezuelano pode pedir LOAS"], "resposta": "Sim, segundo o STF (Supremo Tribunal Federal), que reconhece o direito do estrangeiro residente no país, e a portaria do INSS (Instituto Nacional do Seguro Social), que admite o estrangeiro em situação regular. O decreto, porém, fala só em brasileiro e português, e a fonte registra essa divergência com alerta.", "fonte": "STF Tema 173; Portaria Conjunta MDS/INSS 34/2025, art. 6º, I e II; Dec. 6.214/2007, art. 7º", "origem": "doutrina-beneficio-assistencial.md §13 (Requisitos e valor; LACUNA c.12)", "sinal": "controvertido"}, {"id": "bpc-008", "tema": "BPC: renda e grupo familiar", "pergunta": "Qual é o limite de renda para ter o LOAS?", "variantes": ["quanto a família pode ganhar para ter o BPC", "renda por pessoa do LOAS", "um quarto do salário mínimo", "renda per capita do benefício"], "resposta": "A renda familiar mensal por pessoa precisa ser igual ou inferior a 1/4 do salário mínimo vigente no mês do requerimento. Em 2026, com salário mínimo de R$ 1.621,00, esse limite é de R$ 405,25 por pessoa. Na concessão vale só a renda identificada na data do requerimento.", "fonte": "Lei 8.742/1993, art. 20, § 3º; Portaria Conjunta MDS/INSS 34/2025, arts. 11, II e § 1º; Dec. 12.797/2025, art. 1º", "origem": "doutrina-beneficio-assistencial.md §13 (Renda familiar por pessoa); doutrina-previdenciaria.md §4 (Valores de 2026)", "sinal": "firme"}, {"id": "bpc-009", "tema": "BPC: renda e grupo familiar", "pergunta": "Como o INSS calcula a renda por pessoa da família?", "variantes": ["como faz a conta da renda do LOAS", "bico entra na renda do BPC", "renda informal conta"], "resposta": "Somam-se os rendimentos mensais de todos os membros da família que moram sob o mesmo teto e divide-se pelo número total de pessoas da família, vedadas deduções não previstas em lei. A renda informal entra pelo que foi declarado no CadÚnico (Cadastro Único). Se o CadÚnico divergir de outras bases, prevalece a informação de maior renda.", "fonte": "Lei 8.742/1993, art. 20, § 3º-A; Portaria Conjunta MDS/INSS 34/2025, art. 8º, I, II e § 2º; Dec. 6.214/2007, art. 13, § 3º", "origem": "doutrina-beneficio-assistencial.md §13 (Renda familiar por pessoa)", "sinal": "firme"}, {"id": "bpc-010", "tema": "BPC: renda e grupo familiar", "pergunta": "Quem entra no grupo familiar para o LOAS?", "variantes": ["quem conta na família do BPC", "filho que mora junto entra na renda", "padrasto conta na renda do LOAS"], "resposta": "Entram, desde que morem sob o mesmo teto: o requerente, o cônjuge ou companheiro, os pais e, na falta de um deles, a madrasta ou o padrasto, os irmãos solteiros, os filhos e enteados solteiros e os menores tutelados.", "fonte": "Lei 8.742/1993, art. 20, § 1º; Dec. 6.214/2007, art. 4º, V", "origem": "doutrina-beneficio-assistencial.md §13 (Renda familiar por pessoa)", "sinal": "firme"}, {"id": "bpc-011", "tema": "BPC: renda e grupo familiar", "pergunta": "Filho casado que mora na mesma casa entra na renda do LOAS?", "variantes": ["quem não conta na família do BPC", "filho divorciado entra na renda", "pessoa internada entra no grupo familiar"], "resposta": "Não. Ficam fora do grupo o irmão, filho ou enteado casado, em união estável, divorciado, separado de fato ou viúvo, a pessoa internada ou acolhida em instituição de longa permanência e o tutor ou curador que não esteja no rol legal ou não more sob o mesmo teto.", "fonte": "Portaria Conjunta MDS/INSS 34/2025, art. 7º, § 1º", "origem": "doutrina-beneficio-assistencial.md §13 (Renda familiar por pessoa)", "sinal": "firme"}, {"id": "bpc-012", "tema": "BPC: renda e grupo familiar", "pergunta": "A aposentadoria de um salário mínimo do meu marido conta na renda do LOAS?", "variantes": ["aposentadoria do idoso entra na renda do BPC", "benefício de um salário mínimo do cônjuge conta", "marido aposentado impede o LOAS"], "resposta": "Não, se o benefício previdenciário for de até 1 salário mínimo e pago a idoso acima de 65 anos ou a pessoa com deficiência: ele sai da conta, um por membro da família. A exclusão vale também no pedido de BPC (benefício de prestação continuada) da pessoa com deficiência.", "fonte": "Lei 8.742/1993, art. 20, § 14; STF Tema 312; STJ Tema 640", "origem": "doutrina-beneficio-assistencial.md §13 (Renda familiar por pessoa)", "sinal": "firme"}, {"id": "bpc-013", "tema": "BPC: renda e grupo familiar", "pergunta": "Se outra pessoa da casa já recebe LOAS, isso conta na renda?", "variantes": ["dois BPC na mesma casa", "marido já tem LOAS, posso pedir também", "outro benefício assistencial na família"], "resposta": "Não. O BPC (benefício de prestação continuada) de outro idoso ou pessoa com deficiência da família sai do cálculo da renda. Também saem a bolsa de estágio supervisionado, os rendimentos de aprendizagem e a indenização ou auxílio por rompimento de barragens.", "fonte": "Lei 8.742/1993, art. 20, §§ 9º e 14; Portaria Conjunta MDS/INSS 34/2025, art. 8º, I, a a f", "origem": "doutrina-beneficio-assistencial.md §13 (Renda familiar por pessoa)", "sinal": "firme"}, {"id": "bpc-014", "tema": "BPC: renda e grupo familiar", "pergunta": "E se a aposentadoria do idoso da casa for maior que um salário mínimo?", "variantes": ["aposentadoria acima do mínimo entra na renda do BPC", "benefício maior que o mínimo conta inteiro"], "resposta": "Entra integralmente na renda. A TNU (Turma Nacional de Uniformização) decidiu que o benefício previdenciário acima de 1 salário mínimo de idoso ou de pessoa com deficiência não se exclui, nem em parte; o entendimento é adverso ao requerente.", "fonte": "TNU Tema 369 (adverso)", "origem": "doutrina-beneficio-assistencial.md §13 (Renda familiar por pessoa; ADVERSO)", "sinal": "firme"}, {"id": "bpc-015", "tema": "BPC: renda e grupo familiar", "pergunta": "A pensão de um salário mínimo da minha filha de 40 anos conta na renda do LOAS?", "variantes": ["benefício de um salário mínimo de pessoa jovem entra na renda", "pensão de membro sem deficiência conta no BPC"], "resposta": "Pela TNU (Turma Nacional de Uniformização), sim: não se exclui o benefício de 1 salário mínimo de membro sem deficiência e com menos de 65 anos. A tese é adversa e foi julgada em 20/08/2025, sem trânsito em julgado exibido na fonte.", "fonte": "TNU TF-133, PUIL 10006513420234063806/MG (adverso)", "origem": "doutrina-beneficio-assistencial.md §13 (Renda familiar por pessoa; ADVERSO)", "sinal": "controvertido"}, {"id": "bpc-016", "tema": "BPC: renda e grupo familiar", "pergunta": "O Bolsa Família conta na renda do LOAS?", "variantes": ["Bolsa Família atrapalha o BPC", "auxílio do governo entra na renda", "programa de transferência de renda conta"], "resposta": "Não há resposta firme. A regra que excluía os programas de transferência de renda foi revogada pelo Dec. 12.534/2025 e a portaria atual não a repete, mas nenhum ato lido diz que o Bolsa Família entra na renda; a fonte registra o ponto como lacuna. Para acumular, a LOAS (Lei Orgânica da Assistência Social) ressalva as transferências de renda, então o BPC (benefício de prestação continuada) pode ser recebido junto com elas.", "fonte": "Dec. 6.214/2007, art. 4º, § 2º, II (revogado pelo Dec. 12.534/2025); Lei 8.742/1993, art. 20, § 4º", "origem": "doutrina-beneficio-assistencial.md §13 (Renda familiar por pessoa; LACUNA c.2; Acumulação)", "sinal": "controvertido"}, {"id": "bpc-017", "tema": "BPC: renda e grupo familiar", "pergunta": "Quem recebe pensão alimentícia pode ter o LOAS?", "variantes": ["pensão do pai do meu filho conta na renda do BPC", "alimentos impedem o LOAS"], "resposta": "A pensão alimentícia recebida não impede a concessão, segundo a portaria. Não há regra expressa sobre se o valor entra no cálculo da renda, e a fonte registra o ponto como lacuna.", "fonte": "Portaria Conjunta MDS/INSS 34/2025, art. 12, IV", "origem": "doutrina-beneficio-assistencial.md §13 (Renda familiar por pessoa; LACUNA c.3)", "sinal": "controvertido"}, {"id": "bpc-018", "tema": "BPC: renda e grupo familiar", "pergunta": "Gasto com remédio e fralda pode ser descontado da renda do LOAS?", "variantes": ["despesa de saúde abate da renda do BPC", "dedução de gastos com tratamento", "remédio que o SUS não dá"], "resposta": "Sim. Deduzem-se da renda bruta os gastos com tratamento, consultas, fraldas, alimentos especiais e medicamentos não fornecidos pelo SUS (Sistema Único de Saúde) e com Centro-Dia não prestado pelo SUAS (Sistema Único de Assistência Social), uma vez por categoria, pelo valor médio da tabela oficial e com documentação. Gasto efetivo maior que a tabela se prova com recibos de 12 meses. Para pedido anterior a 10/10/2025 a fonte não tem a tabela aplicável.", "fonte": "Lei 8.742/1993, art. 20-B, III e § 4º; Portaria Conjunta MDS/INSS 34/2025, art. 8º, §§ 4º a 7º e Anexo I; Portaria Conjunta MDS/INSS 45/2026", "origem": "doutrina-beneficio-assistencial.md §13 (Dedução de gastos de saúde)", "sinal": "firme"}, {"id": "bpc-019", "tema": "BPC: renda e grupo familiar", "pergunta": "A renda passa um pouco de 1/4 do salário mínimo. Perdi o direito ao LOAS?", "variantes": ["renda de meio salário mínimo dá BPC", "renda acima do limite do LOAS", "miserabilidade com renda maior"], "resposta": "No INSS (Instituto Nacional do Seguro Social), sim: a ampliação até 1/2 salário mínimo prevista na lei não funciona, porque depende de decreto que não foi editado. Na Justiça, a renda acima de 1/4 admite prova da miserabilidade por outros meios, pois o STF (Supremo Tribunal Federal) declarou o critério inconstitucional e o STJ (Superior Tribunal de Justiça) decidiu que 1/4 não é o único meio de prova. A prova se faz por laudo social, auto de constatação ou, inviabilizados, testemunhas.", "fonte": "Lei 8.742/1993, art. 20, § 11-A, e art. 20-B; Lei 14.176/2021, art. 6º, par. único; STF Tema 27; STJ Tema 185; TNU Súmula 79", "origem": "doutrina-beneficio-assistencial.md §13 (Renda entre 1/4 e 1/2 SM; LACUNA c.1)", "sinal": "firme"}, {"id": "bpc-020", "tema": "BPC: renda e grupo familiar", "pergunta": "Meus filhos me ajudam com dinheiro. Isso tira o LOAS?", "variantes": ["ajuda dos filhos impede o BPC", "filho que mora fora tem que sustentar", "vizinho ajuda, perco o benefício"], "resposta": "A ajuda de terceiro que não tem obrigação legal de prestar alimentos não afasta o BPC (benefício de prestação continuada). Já os devedores legais de alimentos, como os filhos, podem afastá-lo se tiverem condições de sustentar sem prejuízo da própria manutenção; esse entendimento da TNU (Turma Nacional de Uniformização) é adverso. As duas teses não têm trânsito em julgado exibido na fonte.", "fonte": "TNU TF-139 (favorável); TNU TF-147 (adverso)", "origem": "doutrina-beneficio-assistencial.md §13 (Renda entre 1/4 e 1/2 SM; ADVERSO)", "sinal": "controvertido"}, {"id": "bpc-021", "tema": "BPC: cadastro, biometria e perícia", "pergunta": "Precisa estar no Cadastro Único para pedir o LOAS?", "variantes": ["CadÚnico é obrigatório para o BPC", "cadastro do CRAS para o LOAS", "CadÚnico desatualizado"], "resposta": "Sim. O CadÚnico (Cadastro Único) atualizado há no máximo 24 meses é requisito de concessão e de manutenção do BPC (benefício de prestação continuada), junto com o CPF (Cadastro de Pessoas Físicas). A TNU (Turma Nacional de Uniformização) exige o CadÚnico desde a MP (medida provisória) 871/2019.", "fonte": "Lei 8.742/1993, art. 20, § 12, e art. 21-B; Lei 15.077/2024, art. 2º; TNU TF-134, TF-138 e TF-141 (adversos)", "origem": "doutrina-beneficio-assistencial.md §13 (Requisitos formais e biometria)", "sinal": "firme"}, {"id": "bpc-022", "tema": "BPC: cadastro, biometria e perícia", "pergunta": "Precisa fazer biometria para receber o LOAS?", "variantes": ["biometria do BPC", "digital no INSS para o benefício", "idoso acamado sem biometria", "responsável legal faz a biometria"], "resposta": "Sim. O registro biométrico na CIN (Carteira de Identidade Nacional), no título de eleitor ou na CNH (Carteira Nacional de Habilitação) é requisito de concessão e manutenção do BPC (benefício de prestação continuada); se o requerente não puder, é obrigatório ao responsável legal. As bases da CNH, da Polícia Federal e do TSE (Tribunal Superior Eleitoral) valem até 31/12/2027, com cadastro até 30/04/2026 para concessão e até 31/12/2026 para manutenção. Fica dispensado em localidade de difícil acesso ou por dificuldade de deslocamento enquanto o poder público não der condições.", "fonte": "Lei 8.742/1993, art. 20, §§ 12-A e 12-B; Lei 15.077/2024, art. 1º; Dec. 6.214/2007, arts. 12 e 15; Portaria Conjunta MDS/INSS 36/2026, art. 3º; Portaria DIRBEN/INSS 1.347/2026, arts. 2º a 4º", "origem": "doutrina-beneficio-assistencial.md §13 (Requisitos formais e biometria)", "sinal": "firme"}, {"id": "bpc-023", "tema": "BPC: cadastro, biometria e perícia", "pergunta": "Como é a perícia do LOAS para deficiência?", "variantes": ["avaliação biopsicossocial", "perícia médica e assistente social no BPC", "entrevista com assistente social do INSS"], "resposta": "É uma avaliação biopsicossocial em duas partes: a médica, feita pela Perícia Médica Federal, e a social, feita pelo serviço social do INSS (Instituto Nacional do Seguro Social), com registro do CID (Classificação Internacional de Doenças).", "fonte": "Lei 8.742/1993, art. 20, §§ 2º-A e 6º, e art. 40-B; Dec. 6.214/2007, art. 16, §§ 3º e 3º-A", "origem": "doutrina-beneficio-assistencial.md §13 (Requisitos e valor)", "sinal": "firme"}, {"id": "bpc-024", "tema": "BPC: cadastro, biometria e perícia", "pergunta": "O INSS pediu um documento e eu não entreguei. Perdi o pedido do LOAS?", "variantes": ["exigência do INSS não cumprida", "prazo de 30 dias da exigência", "pedido do BPC arquivado"], "resposta": "Exigência não cumprida em 30 dias equivale a desistência do pedido. O novo requerimento é livre e pode ser feito a qualquer momento.", "fonte": "Dec. 6.214/2007, art. 20, §§ 2º e 3º; Portaria Conjunta MDS/INSS 34/2025, arts. 6º, § 4º, e 15, §§ 3º e 4º", "origem": "doutrina-beneficio-assistencial.md §13 (Requisitos formais e biometria)", "sinal": "firme"}, {"id": "bpc-025", "tema": "BPC: valor e manutenção", "pergunta": "Quanto paga o LOAS?", "variantes": ["valor do BPC", "quanto é o benefício do idoso", "LOAS paga um salário mínimo?"], "resposta": "Um salário mínimo por mês, sem desconto de contribuição. Em 2026, o salário mínimo é de R$ 1.621,00.", "fonte": "Lei 8.742/1993, art. 20, caput; Dec. 6.214/2007, Anexo, art. 22; Dec. 12.797/2025, art. 1º", "origem": "doutrina-beneficio-assistencial.md §13 (Requisitos e valor); doutrina-previdenciaria.md §4 (Valores de 2026)", "sinal": "firme"}, {"id": "bpc-026", "tema": "BPC: valor e manutenção", "pergunta": "O LOAS paga 13º?", "variantes": ["BPC tem décimo terceiro", "abono anual do LOAS", "gratificação natalina no benefício do idoso"], "resposta": "Não. O BPC (benefício de prestação continuada) não tem abono anual, o 13º.", "fonte": "Dec. 6.214/2007, Anexo, art. 22", "origem": "doutrina-beneficio-assistencial.md §13 (Requisitos e valor)", "sinal": "firme"}, {"id": "bpc-027", "tema": "BPC: valor e manutenção", "pergunta": "Quando quem recebe LOAS morre, a família fica com pensão?", "variantes": ["BPC gera pensão por morte", "LOAS passa para a esposa", "herdeiro recebe o benefício do falecido"], "resposta": "Não. O BPC (benefício de prestação continuada) é intransferível e não gera pensão por morte. Só os valores que ficaram sem receber em vida vão aos herdeiros, na forma da lei civil.", "fonte": "Dec. 6.214/2007, Anexo, art. 23; Portaria Conjunta MDS/INSS 34/2025, art. 15, § 2º", "origem": "doutrina-beneficio-assistencial.md §13 (Requisitos e valor)", "sinal": "firme"}, {"id": "bpc-028", "tema": "BPC: valor e manutenção", "pergunta": "Se eu ganhar o LOAS na Justiça, recebo desde quando?", "variantes": ["atrasados do BPC", "LOAS retroativo", "desde quando paga o benefício assistencial"], "resposta": "Desde a DER (data de entrada do requerimento). Se a perícia judicial mostrar que a incapacidade já existia na DER, ela é o termo inicial. O BPC (benefício de prestação continuada) não tem abono anual nos atrasados.", "fonte": "Portaria Conjunta MDS/INSS 34/2025, art. 14; TNU Súmula 22", "origem": "doutrina-beneficio-assistencial.md §13 (Atrasados, correção e valor da causa)", "sinal": "firme"}, {"id": "bpc-029", "tema": "BPC: valor e manutenção", "pergunta": "O LOAS pode ser cortado em revisão do INSS?", "variantes": ["pente-fino do BPC", "revisão do LOAS a cada dois anos", "nova perícia do benefício assistencial"], "resposta": "Sim, o BPC (benefício de prestação continuada) é revisto a cada 2 anos. A reavaliação médica fica dispensada quando o impedimento é permanente, irreversível ou irrecuperável e a partir dos 65 anos. Na revisão, a renda é selecionada pelo menor valor entre a do último mês e a média de 12 meses.", "fonte": "Lei 8.742/1993, art. 21, caput e § 5º; Portaria Conjunta MDS/MPS/INSS 33/2025, art. 5º; Portaria Conjunta MDS/INSS 34/2025, art. 29", "origem": "doutrina-beneficio-assistencial.md §13 (Acumulação, revisão e suspensão; Renda familiar por pessoa)", "sinal": "firme"}, {"id": "bpc-030", "tema": "BPC: valor e manutenção", "pergunta": "Quem recebe LOAS por deficiência pode trabalhar?", "variantes": ["BPC e emprego", "arrumei serviço, perco o LOAS", "jovem aprendiz com BPC"], "resposta": "Pode, mas a atividade remunerada suspende o BPC (benefício de prestação continuada) em regime especial. O aprendiz acumula o BPC com a remuneração por até 2 anos. Quem tem deficiência moderada ou grave e passa a trabalhar ganhando até 2 salários mínimos pode receber o auxílio-inclusão.", "fonte": "Lei 8.742/1993, art. 21-A, caput e § 2º, e art. 26-A", "origem": "doutrina-beneficio-assistencial.md §13 (Acumulação, revisão e suspensão; Auxílio-inclusão)", "sinal": "firme"}, {"id": "bpc-031", "tema": "BPC: valor e manutenção", "pergunta": "O que é o auxílio-inclusão e quanto paga?", "variantes": ["auxílio-inclusão para quem tinha BPC", "benefício para deficiente que volta a trabalhar", "meio BPC trabalhando"], "resposta": "É devido à pessoa com deficiência moderada ou grave que recebe o BPC (benefício de prestação continuada) e passa a trabalhar com remuneração de até 2 salários mínimos, como segurada obrigatória do RGPS (Regime Geral de Previdência Social) ou filiada a regime próprio, com CadÚnico (Cadastro Único) atualizado e CPF (Cadastro de Pessoas Físicas). O valor é de 50% do BPC em vigor, sem 13º e sem desconto de contribuição. Vale desde 01/10/2021.", "fonte": "Lei 8.742/1993, arts. 26-A, 26-B e 26-E; Lei 14.176/2021, art. 6º, II", "origem": "doutrina-beneficio-assistencial.md §13 (Auxílio-inclusão)", "sinal": "firme"}, {"id": "bpc-032", "tema": "BPC: valor e manutenção", "pergunta": "Dá para receber o LOAS junto com aposentadoria ou pensão?", "variantes": ["acumular BPC com outro benefício", "LOAS e aposentadoria juntos", "pensão e LOAS ao mesmo tempo"], "resposta": "Não. O BPC (benefício de prestação continuada) não acumula com outro benefício da seguridade social ou de outro regime. As exceções são a assistência médica, a pensão especial de natureza indenizatória e as transferências de renda ressalvadas em lei. Quem tem direito aos dois escolhe o mais vantajoso.", "fonte": "Lei 8.742/1993, art. 20, § 4º; Dec. 6.214/2007, art. 5º; TNU Tema 253", "origem": "doutrina-beneficio-assistencial.md §13 (Acumulação, revisão e suspensão); doutrina-pensao-e-acumulacao.md §10 (Benefício assistencial)", "sinal": "firme"}, {"id": "pen-001", "tema": "Pensão: dependentes", "pergunta": "Quem tem direito à pensão por morte?", "variantes": ["quem recebe a pensão do falecido", "dependentes do INSS", "quem pode pedir pensão quando a pessoa morre"], "resposta": "Os dependentes, em três classes: a primeira é o cônjuge, o companheiro ou companheira e o filho menor de 21 anos ou inválido ou com deficiência intelectual, mental ou grave; a segunda são os pais; a terceira é o irmão nas mesmas condições do filho. A existência de dependente de uma classe exclui as classes seguintes.", "fonte": "Lei 8.213/1991, art. 16, I a III e § 1º", "origem": "doutrina-pensao-e-acumulacao.md §9 (Dependentes)", "sinal": "firme"}, {"id": "pen-002", "tema": "Pensão: dependentes", "pergunta": "A viúva precisa provar que dependia do marido?", "variantes": ["esposa tem que provar dependência econômica", "viúva que trabalha tem direito à pensão", "dependência do cônjuge é presumida"], "resposta": "Não. A dependência econômica do cônjuge e do companheiro é presumida, e a TNU (Turma Nacional de Uniformização) considera essa presunção absoluta. Pais e irmãos é que precisam provar a dependência.", "fonte": "Lei 8.213/1991, art. 16, § 4º; TNU Tema 226", "origem": "doutrina-pensao-e-acumulacao.md §9 (Dependentes)", "sinal": "firme"}, {"id": "pen-003", "tema": "Pensão: dependentes", "pergunta": "Quem vivia junto sem ser casado tem direito à pensão?", "variantes": ["companheira tem direito à pensão", "união estável dá pensão", "como provar união estável no INSS", "só testemunha serve para provar união estável"], "resposta": "Sim, o companheiro ou companheira é dependente da primeira classe. Para óbitos desde a MP (medida provisória) 871/2019, a união estável exige início de prova material contemporânea, produzido em até 24 meses antes do óbito, e não se admite prova só testemunhal, salvo força maior ou caso fortuito. Para fatos anteriores à MP 871/2019, a TNU (Turma Nacional de Uniformização) dispensa o início de prova material.", "fonte": "Lei 8.213/1991, art. 16, I e § 5º; IN 128/2022, art. 180; TNU Tema 371; TNU Súmula 63", "origem": "doutrina-pensao-e-acumulacao.md §9 (União estável, concubinato e ex-cônjuge)", "sinal": "firme"}, {"id": "pen-004", "tema": "Pensão: dependentes", "pergunta": "A amante tem direito a dividir a pensão?", "variantes": ["relação paralela dá pensão", "concubina recebe pensão", "segunda família tem direito"], "resposta": "Não. O concubinato não gera pensão e não se reconhece vínculo concomitante a casamento ou união estável, conforme o STF (Supremo Tribunal Federal), em teses adversas a quem mantinha a relação paralela.", "fonte": "STF Temas 526 e 529 (adversos)", "origem": "doutrina-pensao-e-acumulacao.md §9 (União estável, concubinato e ex-cônjuge)", "sinal": "firme"}, {"id": "pen-005", "tema": "Pensão: dependentes", "pergunta": "A ex-mulher que recebia pensão alimentícia divide a pensão por morte?", "variantes": ["ex-esposa tem direito à pensão do INSS", "divorciada recebe pensão por morte", "ex que abriu mão dos alimentos"], "resposta": "Sim. O cônjuge divorciado ou separado que recebia alimentos concorre em igualdade com os demais dependentes; se os alimentos eram temporários, a cota dura só o prazo que faltava. A mulher que renunciou aos alimentos tem direito à pensão se comprovar necessidade econômica que surgiu depois.", "fonte": "Lei 8.213/1991, art. 76, §§ 2º e 3º; STJ Súmula 336; TNU Tema 45", "origem": "doutrina-pensao-e-acumulacao.md §9 (União estável, concubinato e ex-cônjuge)", "sinal": "firme"}, {"id": "pen-006", "tema": "Pensão: dependentes", "pergunta": "Até que idade o filho recebe a pensão?", "variantes": ["pensão do filho acaba quando", "filho na faculdade continua com pensão", "pensão até 24 anos se estudar"], "resposta": "Até 21 anos, salvo se for inválido ou tiver deficiência intelectual, mental ou grave. Não há prorrogação por curso universitário: o STJ (Superior Tribunal de Justiça) e a TNU (Turma Nacional de Uniformização) negam a pensão ao maior de 21 anos que só estuda.", "fonte": "Lei 8.213/1991, art. 77, § 2º, II; STJ Tema 643; TNU Súmula 37 (adversos)", "origem": "doutrina-pensao-e-acumulacao.md §9 (Duração e cessação das cotas; ADVERSO)", "sinal": "firme"}, {"id": "pen-007", "tema": "Pensão: dependentes", "pergunta": "Filho maior com deficiência ou inválido tem direito à pensão?", "variantes": ["filho especial adulto recebe pensão", "filho inválido depois dos 21", "pensão vitalícia para filho com deficiência"], "resposta": "Sim, o filho inválido ou com deficiência intelectual, mental ou grave é dependente da primeira classe em qualquer idade. A invalidez ou deficiência surgida antes dos 21 anos mantém a cota; o INSS (Instituto Nacional do Seguro Social) admite a surgida antes ou depois do óbito. A cota cessa se cessar a invalidez ou for afastada a deficiência.", "fonte": "Lei 8.213/1991, art. 16, I, e art. 77, § 2º, II a IV; Dec. 3.048/1999, art. 115; IN 128/2022, art. 378, § 4º", "origem": "doutrina-pensao-e-acumulacao.md §9 (Dependentes; Duração e cessação das cotas)", "sinal": "firme"}, {"id": "pen-008", "tema": "Pensão: dependentes", "pergunta": "Enteado tem direito à pensão do padrasto?", "variantes": ["enteada recebe pensão", "menor tutelado tem direito à pensão", "filho da esposa entra na pensão"], "resposta": "Sim. O enteado e o menor sob tutela equiparam-se a filho, mediante declaração do segurado e desde que não tenham condições suficientes para o próprio sustento e educação.", "fonte": "Lei 8.213/1991, art. 16, § 2º; EC 103/2019, art. 23, § 6º", "origem": "doutrina-pensao-e-acumulacao.md §9 (Dependentes)", "sinal": "firme"}, {"id": "pen-009", "tema": "Pensão: dependentes", "pergunta": "Neto que estava sob a guarda do avô tem direito à pensão?", "variantes": ["menor sob guarda recebe pensão", "criança com guarda judicial tem direito", "guarda do neto dá pensão"], "resposta": "Depende da data do óbito e o ponto é controvertido. Desde 14/03/2025, a Lei 15.108/2025 equipara a filho o menor sob guarda judicial, com declaração do segurado e sem condições de sustento, mas a regra colide com a EC (Emenda Constitucional) 103/2019, que fala só em enteado e menor tutelado. Para óbitos de 14/11/2019 a 13/03/2025, o tratamento é controvertido; a favor há as ADIs (ações diretas de inconstitucionalidade) 4.878 e 5.083 do STF (Supremo Tribunal Federal) e o Tema 732 do STJ (Superior Tribunal de Justiça), com o alcance depois da EC 103/2019 em aberto.", "fonte": "Lei 8.213/1991, art. 16, § 2º (red. Lei 15.108/2025); EC 103/2019, art. 23, § 6º; STF ADIs 4.878 e 5.083; STJ Tema 732", "origem": "doutrina-pensao-e-acumulacao.md §9 (Dependentes; LACUNA c.7)", "sinal": "controvertido"}, {"id": "pen-010", "tema": "Pensão: dependentes", "pergunta": "Os pais podem receber pensão do filho que morreu?", "variantes": ["mãe recebe pensão do filho falecido", "pais dependentes do filho", "pensão para os pais"], "resposta": "Sim, se o filho não deixou cônjuge, companheiro ou filhos com direito, porque a primeira classe exclui os pais. Os pais precisam comprovar a dependência econômica.", "fonte": "Lei 8.213/1991, art. 16, II, §§ 1º e 4º", "origem": "doutrina-pensao-e-acumulacao.md §9 (Dependentes)", "sinal": "firme"}, {"id": "pen-011", "tema": "Pensão: dependentes", "pergunta": "Irmão pode receber pensão do irmão falecido?", "variantes": ["pensão para irmão", "irmão inválido tem direito à pensão", "irmã menor recebe pensão"], "resposta": "Sim, mas só se não houver dependentes da primeira classe nem pais com direito. O irmão precisa ser menor de 21 anos ou inválido ou ter deficiência intelectual, mental ou grave, e comprovar a dependência econômica.", "fonte": "Lei 8.213/1991, art. 16, III, §§ 1º e 4º", "origem": "doutrina-pensao-e-acumulacao.md §9 (Dependentes)", "sinal": "firme"}, {"id": "pen-012", "tema": "Pensão: requisitos e prazos", "pergunta": "Precisa de um mínimo de contribuições para deixar pensão?", "variantes": ["carência da pensão por morte", "quantas contribuições para a pensão", "pensão de quem contribuiu pouco"], "resposta": "Não. A pensão por morte independe de carência e cabe com o falecido aposentado ou não. O número de contribuições influi só na duração da cota do cônjuge ou companheiro, que fica limitada a 4 meses se o falecido não tinha 18 contribuições ou se o casamento ou a união tinha menos de 2 anos, salvo morte por acidente ou por doença profissional ou do trabalho.", "fonte": "Lei 8.213/1991, art. 26, I, art. 74, caput, e art. 77, § 2º, V, b", "origem": "doutrina-pensao-e-acumulacao.md §9 (Lei aplicável e instituidor; Duração e cessação das cotas)", "sinal": "firme"}, {"id": "pen-013", "tema": "Pensão: requisitos e prazos", "pergunta": "Meu marido tinha parado de contribuir. Ainda tenho direito à pensão?", "variantes": ["falecido sem qualidade de segurado", "morreu sem estar pagando INSS", "falecido já podia se aposentar"], "resposta": "Depende de o falecido manter a qualidade de segurado na data do óbito. A perda da qualidade impede a pensão, salvo se ele já tivesse reunido os requisitos de alguma aposentadoria até o óbito. Se não chegou a preencher os requisitos de nenhuma aposentadoria, a TNU (Turma Nacional de Uniformização) nega a pensão, em tese adversa.", "fonte": "Lei 8.213/1991, art. 102, §§ 1º e 2º; STJ Súmula 416; TNU Tema 148 (adverso)", "origem": "doutrina-pensao-e-acumulacao.md §9 (Lei aplicável e instituidor)", "sinal": "firme"}, {"id": "pen-014", "tema": "Pensão: requisitos e prazos", "pergunta": "Ele estava desempregado quando morreu. Mantinha a qualidade de segurado?", "variantes": ["período de graça", "quanto tempo depois de parar de contribuir ainda vale", "desempregado deixa pensão"], "resposta": "Mantém por 12 meses depois de cessadas as contribuições, ou 24 meses se tinha mais de 120 contribuições sem perder a qualidade. O desempregado com registro no órgão próprio ganha mais 12 meses sobre esses prazos. O facultativo mantém por 6 meses.", "fonte": "Lei 8.213/1991, art. 15, II e §§ 1º e 2º", "origem": "doutrina-previdenciaria.md §6 (Período de graça)", "sinal": "firme"}, {"id": "pen-015", "tema": "Pensão: requisitos e prazos", "pergunta": "O falecido era autônomo e tinha contribuições atrasadas. Dá para pagar agora e garantir a pensão?", "variantes": ["pagar INSS atrasado depois da morte", "regularizar contribuição do falecido", "carnê atrasado do autônomo falecido"], "resposta": "Não. A TNU (Turma Nacional de Uniformização) não admite regularizar contribuições do contribuinte individual depois do óbito, salvo as que a empresa tomadora de serviços devia arrecadar; a tese é adversa.", "fonte": "TNU Súmula 52 (adversa)", "origem": "doutrina-pensao-e-acumulacao.md §9 (União estável, concubinato e ex-cônjuge; ADVERSO)", "sinal": "firme"}, {"id": "pen-016", "tema": "Pensão: requisitos e prazos", "pergunta": "Vale a regra da época da morte ou a de hoje?", "variantes": ["qual lei vale para a pensão", "morte antes da reforma da previdência", "pensão de óbito antigo"], "resposta": "Vale a lei vigente na data do óbito, qualquer que seja a data do pedido. Por isso, óbito até 13/11/2019 segue a regra anterior à reforma e óbito desde 14/11/2019 segue a EC (Emenda Constitucional) 103/2019.", "fonte": "STJ Súmula 340; IN 128/2022, art. 365, § 1º; EC 103/2019, art. 23", "origem": "doutrina-pensao-e-acumulacao.md §9 (Lei aplicável e instituidor; Valor)", "sinal": "firme"}, {"id": "pen-017", "tema": "Pensão: requisitos e prazos", "pergunta": "Qual é o prazo para pedir a pensão sem perder dinheiro?", "variantes": ["prazo de 90 dias da pensão", "180 dias para pedir pensão", "pensão paga desde a morte"], "resposta": "Para óbito desde 18/01/2019, o pedido deve ser feito em até 180 dias para filhos menores de 16 anos e em até 90 dias para os demais dependentes para receber desde o óbito; para óbitos anteriores valem os prazos da época, de 30 dias (Lei 9.528/1997) ou 90 dias (Lei 13.183/2015). O INSS (Instituto Nacional do Seguro Social) aplica os 180 dias também ao dependente inválido ou com deficiência, mas só por instrução normativa. Na morte presumida, os efeitos começam na decisão judicial.", "fonte": "Lei 8.213/1991, art. 74, I a III (red. Lei 13.846/2019); IN 128/2022, art. 369 e § 1º", "origem": "doutrina-pensao-e-acumulacao.md §9 (Termo inicial, habilitação e rateio)", "sinal": "firme"}, {"id": "pen-018", "tema": "Pensão: requisitos e prazos", "pergunta": "Passou o prazo. Ainda posso pedir a pensão?", "variantes": ["pedi a pensão atrasado", "perdi o prazo de 90 dias", "pensão pedida um ano depois"], "resposta": "Sim. Depois do prazo, a pensão é paga desde a DER (data de entrada do requerimento), e não desde o óbito; a data de início do benefício continua sendo a do óbito. O filho nascido depois do óbito recebe desde o nascimento.", "fonte": "Lei 8.213/1991, art. 74, II; Dec. 3.048/1999, art. 105, § 1º; IN 128/2022, arts. 365, § 3º, e 369-A", "origem": "doutrina-pensao-e-acumulacao.md §9 (Termo inicial, habilitação e rateio)", "sinal": "firme"}, {"id": "pen-019", "tema": "Pensão: requisitos e prazos", "pergunta": "Apareceu outro dependente depois que a pensão já estava sendo paga. Como fica?", "variantes": ["filho de fora aparece depois", "habilitação tardia na pensão", "outro herdeiro pede a pensão depois"], "resposta": "A habilitação posterior só produz efeito desde a habilitação, e o novo dependente recebe desde a DER (data de entrada do requerimento) dele, com novo rateio em partes iguais. Mesmo o absolutamente incapaz, havendo dependente já habilitado, recebe desde a DER, segundo a TNU (Turma Nacional de Uniformização), em tese adversa.", "fonte": "Lei 8.213/1991, arts. 76, caput, e 77, caput; IN 128/2022, arts. 367 e 370; TNU Tema 223 (adverso)", "origem": "doutrina-pensao-e-acumulacao.md §9 (Termo inicial, habilitação e rateio)", "sinal": "firme"}, {"id": "pen-020", "tema": "Pensão: valor e duração", "pergunta": "Quanto é o valor da pensão por morte?", "variantes": ["pensão paga quanto", "viúva recebe 60%", "cota familiar da pensão", "pensão depois da reforma"], "resposta": "Para óbito desde 14/11/2019, é uma cota familiar de 50% mais 10 pontos percentuais por dependente, até 100%, sobre a aposentadoria que o falecido recebia ou a aposentadoria por incapacidade permanente a que teria direito. Com um único dependente, a pensão é de 60%. A renda não pode ser inferior a 1 salário mínimo no total; nenhum texto fixa piso por cota.", "fonte": "EC 103/2019, art. 23, caput; Dec. 3.048/1999, art. 106; IN 128/2022, art. 235, §§ 1º, 2º e 7º", "origem": "doutrina-pensao-e-acumulacao.md §9 (Valor; LACUNA c.13)", "sinal": "firme"}, {"id": "pen-021", "tema": "Pensão: valor e duração", "pergunta": "E se a morte foi antes da reforma da previdência?", "variantes": ["pensão de óbito até 2019", "pensão integral antiga", "valor da pensão antes da EC 103"], "resposta": "Para óbito até 13/11/2019, a pensão é de 100% da aposentadoria recebida ou da aposentadoria por invalidez a que o falecido teria direito, e a cota de quem deixa de receber reverte aos demais.", "fonte": "Lei 8.213/1991, art. 75 (red. Lei 9.528/1997) e art. 77, § 1º; STJ Súmula 340", "origem": "doutrina-pensao-e-acumulacao.md §9 (Valor)", "sinal": "firme"}, {"id": "pen-022", "tema": "Pensão: valor e duração", "pergunta": "Ele não era aposentado. Como calcula a pensão?", "variantes": ["pensão de quem ainda trabalhava", "base da pensão do falecido não aposentado", "morte em acidente de trabalho pensão integral"], "resposta": "A base é a aposentadoria por incapacidade permanente a que ele teria direito na data do óbito: 60% da média mais 2 pontos percentuais por ano acima de 20 anos de contribuição (homem) ou 15 (mulher), ou 100% da média se a morte decorreu de acidente do trabalho ou de doença profissional ou do trabalho. Sobre essa base se aplica a cota familiar de 50% mais 10 pontos por dependente.", "fonte": "EC 103/2019, art. 23, caput, e art. 26, §§ 2º, III, 3º, II, e 5º", "origem": "doutrina-pensao-e-acumulacao.md §9 (Valor)", "sinal": "firme"}, {"id": "pen-023", "tema": "Pensão: valor e duração", "pergunta": "Com filho inválido ou com deficiência a pensão é maior?", "variantes": ["pensão integral com dependente deficiente", "100% da pensão para filho especial", "dependente inválido aumenta a pensão"], "resposta": "Sim. Havendo dependente inválido ou com deficiência intelectual, mental ou grave, a pensão é de 100% até o teto do RGPS (Regime Geral de Previdência Social) e, acima dele, segue a cota familiar de 50% mais 10 pontos por dependente. Quando deixar de haver esse dependente, a pensão é recalculada.", "fonte": "EC 103/2019, art. 23, §§ 2º, 3º e 5º; Dec. 3.048/1999, arts. 106, §§ 2º e 3º, e 113, §§ 1º e 2º", "origem": "doutrina-pensao-e-acumulacao.md §9 (Valor)", "sinal": "firme"}, {"id": "pen-024", "tema": "Pensão: valor e duração", "pergunta": "Quando um filho faz 21 anos, a parte dele passa para a mãe?", "variantes": ["reversão de cotas", "cota do filho volta para a viúva", "pensão diminui quando o filho sai"], "resposta": "Para óbito desde 14/11/2019, não: as cotas não revertem e a pensão é recalculada a cada mudança, salvo se restarem 5 ou mais dependentes, caso em que se preservam os 100%. Para óbito até 13/11/2019, a cota reverte aos demais pensionistas.", "fonte": "EC 103/2019, art. 23, § 1º; Dec. 3.048/1999, art. 113, § 3º; Lei 8.213/1991, art. 77, § 1º", "origem": "doutrina-pensao-e-acumulacao.md §9 (Valor)", "sinal": "firme"}, {"id": "pen-025", "tema": "Pensão: valor e duração", "pergunta": "Por quanto tempo a viúva recebe a pensão?", "variantes": ["pensão vitalícia com quantos anos", "duração da pensão do cônjuge", "tabela de idade da pensão", "viúva jovem recebe por quanto tempo"], "resposta": "Para óbito desde 01/01/2021, com 18 contribuições e 2 anos de casamento ou união, o prazo segue a idade do cônjuge ou companheiro na data do óbito: 3 anos com menos de 22 anos; 6 anos entre 22 e 27; 10 anos entre 28 e 30; 15 anos entre 31 e 41; 20 anos entre 42 e 44; vitalícia com 45 anos ou mais. O prazo conta do óbito, e quem pede tarde recebe só da DER (data de entrada do requerimento) até o termo, sem direito se pedir depois dele.", "fonte": "Lei 8.213/1991, art. 77, § 2º, V, c, e § 2º-B; Portaria ME 424/2020, art. 1º; IN 128/2022, art. 375, §§ 6º a 8º; TNU Tema 377 (adverso)", "origem": "doutrina-pensao-e-acumulacao.md §9 (Duração e cessação das cotas); 05_AUTOMACAO/scripts/dados/pensao_duracao.json", "sinal": "firme"}, {"id": "pen-026", "tema": "Pensão: valor e duração", "pergunta": "E a duração da pensão para morte entre 2015 e 2020?", "variantes": ["tabela antiga da pensão por idade", "pensão vitalícia com 44 anos", "óbito em 2018 duração da pensão"], "resposta": "Para óbito de 01/03/2015 a 31/12/2020, com 18 contribuições e 2 anos de casamento ou união: 3 anos com menos de 21 anos; 6 anos entre 21 e 26; 10 anos entre 27 e 29; 15 anos entre 30 e 40; 20 anos entre 41 e 43; vitalícia com 44 anos ou mais. Para óbito antes de 01/03/2015, a fonte entende que não havia prazo por idade, mas só por leitura a contrario e com lacuna registrada.", "fonte": "Lei 8.213/1991, art. 77, § 2º, V, c, 1 a 6 (red. Lei 13.135/2015); IN 128/2022, art. 375", "origem": "doutrina-pensao-e-acumulacao.md §9 (Duração e cessação das cotas; LACUNA c.4); 05_AUTOMACAO/scripts/dados/pensao_duracao.json", "sinal": "firme"}, {"id": "pen-027", "tema": "Pensão: valor e duração", "pergunta": "Casei há pouco tempo. A pensão é só de 4 meses?", "variantes": ["pensão de 4 meses", "casamento com menos de 2 anos", "falecido com menos de 18 contribuições", "morte por acidente pensão de 4 meses"], "resposta": "Sim, o cônjuge ou companheiro recebe 4 meses se o falecido não tinha 18 contribuições ou se o casamento ou a união estável tinha menos de 2 anos. Se a morte decorreu de acidente de qualquer natureza ou de doença profissional ou do trabalho, essas duas exigências ficam dispensadas e vale a tabela por idade. Tempo de regime próprio conta nas 18 contribuições, e o INSS (Instituto Nacional do Seguro Social) dispensa as 18 contribuições se o falecido era aposentado, salvo por incapacidade permanente.", "fonte": "Lei 8.213/1991, art. 77, § 2º, V, b, §§ 2º-A e 5º; IN 128/2022, art. 375, I e §§ 2º a 4º", "origem": "doutrina-pensao-e-acumulacao.md §9 (Duração e cessação das cotas)", "sinal": "firme"}, {"id": "pen-028", "tema": "Pensão: valor e duração", "pergunta": "Se a viúva casar de novo, perde a pensão?", "variantes": ["novo casamento corta a pensão", "viúva que se casa outra vez", "nova união estável perde pensão"], "resposta": "Pela letra da lei, não: o rol vigente de cessação da cota do cônjuge (morte, fim do prazo de 4 meses ou por idade, cessação da invalidez ou da deficiência e perda do direito por homicídio doloso) não inclui novo casamento ou nova união. É leitura do silêncio da lei, sem tese lida na fonte que a confirme. Se o novo cônjuge também morrer, não se recebem duas pensões de cônjuge no RGPS (Regime Geral de Previdência Social), com opção pela mais vantajosa.", "fonte": "Lei 8.213/1991, art. 77, § 2º, I, V e VI; art. 74, § 1º; art. 124, VI", "origem": "03_TESES/legislacao/leis/Lei-8213-1991_planos-de-beneficios-previdencia.htm (art. 77, § 2º; art. 124); doutrina-pensao-e-acumulacao.md §9 e §10 (Vedação e hipóteses)", "sinal": "controvertido"}, {"id": "pen-029", "tema": "Pensão: dependentes", "pergunta": "Quem matou o segurado pode receber a pensão?", "variantes": ["assassino recebe pensão", "condenado pela morte perde a pensão"], "resposta": "Não. Fica excluído o condenado por sentença com trânsito em julgado por homicídio doloso, ou tentativa, contra o segurado, ressalvados os absolutamente incapazes e os inimputáveis. Com fundados indícios, a cota pode ser suspensa provisoriamente em processo administrativo.", "fonte": "Lei 8.213/1991, art. 16, § 7º, art. 74, § 1º, e art. 77, § 7º; IN 128/2022, art. 380", "origem": "doutrina-pensao-e-acumulacao.md §9 (União estável, concubinato e ex-cônjuge)", "sinal": "firme"}, {"id": "pen-030", "tema": "Pensão: valor e duração", "pergunta": "Dá para pedir na Justiça a pensão integral, contra o corte da reforma?", "variantes": ["reforma da previdência reduziu a pensão é inconstitucional", "pensão de 100% na Justiça", "ação contra a cota de 50%"], "resposta": "Não. O STF (Supremo Tribunal Federal) julgou constitucional o cálculo por cotas da EC (Emenda Constitucional) 103/2019, com trânsito em julgado em 26/10/2023.", "fonte": "STF ADI 7.051 (adversa)", "origem": "doutrina-pensao-e-acumulacao.md §9 (ADVERSO: STF ADI 7.051)", "sinal": "firme"}, {"id": "acu-001", "tema": "Acumulação de benefícios", "pergunta": "Posso receber pensão por morte e minha aposentadoria juntas?", "variantes": ["acumular pensão e aposentadoria", "viúva aposentada recebe pensão", "pensão e aposentadoria ao mesmo tempo"], "resposta": "Sim, mas com redução. Acumulam com redutor a pensão de cônjuge do RGPS (Regime Geral de Previdência Social) com aposentadoria de qualquer regime, a pensão de cônjuge do RGPS com pensão de outro regime ou militar, e a aposentadoria do RGPS com pensão de cônjuge de regime próprio ou militar. Recebe-se integral o benefício mais vantajoso e uma parte do outro.", "fonte": "EC 103/2019, art. 24, § 1º; Dec. 3.048/1999, art. 167-A, I a III; IN 128/2022, art. 641, I a III", "origem": "doutrina-pensao-e-acumulacao.md §10 (Vedação e hipóteses)", "sinal": "firme"}, {"id": "acu-002", "tema": "Acumulação de benefícios", "pergunta": "Quanto é cortado quando acumula pensão e aposentadoria?", "variantes": ["faixas de redução da acumulação", "redutor da pensão", "quanto recebo do segundo benefício"], "resposta": "O benefício mais vantajoso é pago integral. Do outro, recebe-se 60% do valor entre 1 e 2 salários mínimos, 40% entre 2 e 3, 20% entre 3 e 4 e 10% acima de 4, somando as faixas. A parte até 1 salário mínimo não aparece na letra da regra do RGPS (Regime Geral de Previdência Social); recebê-la a 100% é leitura favorável, apoiada em orientação do Ministério da Previdência Social de 05/01/2026.", "fonte": "EC 103/2019, art. 24, § 2º; Dec. 3.048/1999, art. 167-A, § 1º; IN 128/2022, art. 641, § 1º", "origem": "doutrina-pensao-e-acumulacao.md §10 (Redutor)", "sinal": "firme"}, {"id": "acu-003", "tema": "Acumulação de benefícios", "pergunta": "A parte até um salário mínimo do segundo benefício também é cortada?", "variantes": ["primeiro salário mínimo na acumulação", "faixa até um salário mínimo 100%", "redutor no primeiro mínimo"], "resposta": "O texto do RGPS (Regime Geral de Previdência Social) enumera só as quatro faixas acima de 1 salário mínimo. A faixa até 1 salário mínimo recebida a 100% e o uso do salário mínimo de cada pagamento constam só de norma dos regimes próprios e de orientação do Ministério da Previdência Social de 05/01/2026; no RGPS é leitura favorável, sem tese judicial.", "fonte": "EC 103/2019, art. 24, § 2º; Portaria MTP 1.467/2022, art. 165, § 3º, I, § 6º, III e IV, e § 8º", "origem": "doutrina-pensao-e-acumulacao.md §10 (Redutor; LACUNA c.1 e c.2)", "sinal": "controvertido"}, {"id": "acu-004", "tema": "Acumulação de benefícios", "pergunta": "Posso receber duas pensões de maridos diferentes?", "variantes": ["duas pensões de cônjuge", "viúva duas vezes acumula pensão", "pensão do primeiro e do segundo marido"], "resposta": "Não no RGPS (Regime Geral de Previdência Social): é vedado receber mais de uma pensão deixada por cônjuge ou companheiro, com opção expressa pela mais vantajosa. O INSS (Instituto Nacional do Seguro Social) ressalva óbitos até 28/04/1995.", "fonte": "Lei 8.213/1991, art. 124, VI; EC 103/2019, art. 24, caput; IN 128/2022, art. 639, VIII a X e § 2º", "origem": "doutrina-pensao-e-acumulacao.md §10 (Vedação e hipóteses)", "sinal": "firme"}, {"id": "acu-005", "tema": "Acumulação de benefícios", "pergunta": "Posso receber pensão do INSS e pensão do marido que era servidor público?", "variantes": ["pensão do INSS e pensão de servidor", "pensão de militar e do INSS", "duas pensões de regimes diferentes"], "resposta": "Sim, com redução. A pensão de cônjuge do RGPS (Regime Geral de Previdência Social) acumula com pensão de outro regime ou militar, pagando-se integral a mais vantajosa e a outra pelas faixas de 60%, 40%, 20% e 10%.", "fonte": "EC 103/2019, art. 24, §§ 1º e 2º; Dec. 3.048/1999, art. 167-A, I", "origem": "doutrina-pensao-e-acumulacao.md §10 (Vedação e hipóteses; Redutor)", "sinal": "firme"}, {"id": "acu-006", "tema": "Acumulação de benefícios", "pergunta": "Já recebia os dois benefícios antes da reforma. Vão cortar?", "variantes": ["direito adquirido na acumulação", "acumulação antes de novembro de 2019", "redutor vale para quem já recebia"], "resposta": "Não. As restrições da EC (Emenda Constitucional) 103/2019 não alcançam quem tinha direito adquirido até 13/11/2019; o decreto e o INSS (Instituto Nacional do Seguro Social) exigem esse direito quanto a ambos os benefícios. Se um dos benefícios mudar depois, a revisão do redutor pode ser pedida a qualquer tempo.", "fonte": "EC 103/2019, art. 24, §§ 3º e 4º; Dec. 3.048/1999, art. 167-A, §§ 2º e 4º; IN 128/2022, art. 641, §§ 2º e 4º", "origem": "doutrina-pensao-e-acumulacao.md §10 (Direito adquirido e opção; Redutor)", "sinal": "firme"}, {"id": "acu-007", "tema": "Acumulação de benefícios", "pergunta": "Quais benefícios do INSS não podem ser recebidos juntos?", "variantes": ["o que não acumula no INSS", "duas aposentadorias juntas", "auxílio-doença e aposentadoria juntos", "seguro-desemprego e pensão"], "resposta": "Salvo direito adquirido, não se acumulam: aposentadoria e auxílio-doença; mais de uma aposentadoria; aposentadoria e abono de permanência; salário-maternidade e auxílio-doença; mais de um auxílio-acidente; mais de uma pensão deixada por cônjuge ou companheiro. O seguro-desemprego não acumula com benefício previdenciário, exceto pensão por morte ou auxílio-acidente.", "fonte": "Lei 8.213/1991, art. 124, I a VI e par. único", "origem": "03_TESES/legislacao/leis/Lei-8213-1991_planos-de-beneficios-previdencia.htm (art. 124); doutrina-pensao-e-acumulacao.md §10", "sinal": "firme"}, {"id": "acu-008", "tema": "Acumulação de benefícios", "pergunta": "Tenho direito a uma cota de pensão pequena e ao LOAS. Posso ficar com o LOAS?", "variantes": ["renunciar à pensão para ter o BPC", "trocar pensão pelo LOAS", "pensão baixa e benefício assistencial"], "resposta": "Sim. Preenchidos os requisitos dos dois, cabe a opção pelo mais vantajoso, e o dependente pode renunciar à cota de pensão, a qualquer tempo, para receber o BPC (benefício de prestação continuada) da LOAS (Lei Orgânica da Assistência Social).", "fonte": "Lei 8.742/1993, art. 20, § 4º; TNU Temas 253 e 284; TNU TF-136 e TF-148", "origem": "doutrina-pensao-e-acumulacao.md §10 (Benefício assistencial)", "sinal": "firme"}, {"id": "acu-009", "tema": "Acumulação de benefícios", "pergunta": "Pensão de trabalhador rural acumula com aposentadoria por invalidez?", "variantes": ["pensão rural e aposentadoria por invalidez", "aposentado por invalidez recebe pensão rural"], "resposta": "Sim. A TNU (Turma Nacional de Uniformização) entende que não há vedação legal, porque os dois benefícios têm pressupostos e fatos geradores distintos.", "fonte": "TNU Súmula 36", "origem": "doutrina-pensao-e-acumulacao.md §9 (Duração e cessação das cotas)", "sinal": "firme"}, {"id": "acu-010", "tema": "Acumulação de benefícios", "pergunta": "Criança sob guarda pode receber pensão dos pais e do guardião?", "variantes": ["menor sob guarda duas pensões", "pensão do avô guardião e do pai"], "resposta": "Só por determinação judicial: o menor sob guarda acumula a pensão dos pais biológicos com a de um guardião apenas se a Justiça determinar. A regra está só em instrução normativa do INSS (Instituto Nacional do Seguro Social).", "fonte": "IN 128/2022, art. 645", "origem": "doutrina-pensao-e-acumulacao.md §10 (Direito adquirido e opção)", "sinal": "firme"}, {"id": "out-001", "tema": "Salário-maternidade e outros", "pergunta": "Por quanto tempo é pago o salário-maternidade?", "variantes": ["licença-maternidade do INSS dura quanto", "quando começa o salário-maternidade", "bebê internado prorroga o salário-maternidade"], "resposta": "Por 120 dias, com início entre 28 dias antes do parto e a data do parto. Se a mãe ou o recém-nascido ficar internado por mais de 2 semanas por complicações do parto, é pago durante a internação e por mais 120 dias após a alta, descontado o que foi recebido antes do parto.", "fonte": "Lei 8.213/1991, art. 71, caput e § 3º", "origem": "03_TESES/legislacao/leis/Lei-8213-1991_planos-de-beneficios-previdencia.htm (art. 71); legislacao-pos-2019.md §2 (Lei 15.222/2025)", "sinal": "firme"}, {"id": "out-002", "tema": "Salário-maternidade e outros", "pergunta": "Precisa ter um mínimo de contribuições para o salário-maternidade?", "variantes": ["carência do salário-maternidade", "10 contribuições para o salário-maternidade", "autônoma tem direito ao salário-maternidade"], "resposta": "Não. A lei previa carência de 10 contribuições para algumas seguradas, mas o STF (Supremo Tribunal Federal) declarou inconstitucional a carência do salário-maternidade.", "fonte": "Lei 8.213/1991, art. 25, III; STF ADIs 2.110 e 2.111", "origem": "doutrina-previdenciaria.md §6 (Carência)", "sinal": "firme"}, {"id": "out-003", "tema": "Salário-maternidade e outros", "pergunta": "Quem adota tem direito ao salário-maternidade?", "variantes": ["salário-maternidade na adoção", "pai adotante recebe salário-maternidade", "guarda para adoção"], "resposta": "Sim. O segurado ou segurada que adotar ou obtiver guarda judicial para fins de adoção de criança recebe 120 dias, pagos diretamente pela Previdência Social. Não pode ser concedido a mais de um segurado no mesmo processo de adoção ou guarda, ressalvado o pagamento à mãe biológica.", "fonte": "Lei 8.213/1991, art. 71-A, caput, §§ 1º e 2º", "origem": "03_TESES/legislacao/leis/Lei-8213-1991_planos-de-beneficios-previdencia.htm (art. 71-A)", "sinal": "firme"}, {"id": "out-004", "tema": "Salário-maternidade e outros", "pergunta": "Em quanto tempo o INSS tem que liberar o salário-maternidade?", "variantes": ["INSS demora no salário-maternidade", "prazo do INSS para o salário-maternidade", "concessão automática do salário-maternidade"], "resposta": "O salário-maternidade pago diretamente pela Previdência deve ser concedido em até 30 dias do requerimento; se o prazo não for cumprido, a concessão é provisória e automática. Os valores recebidos na concessão provisória não precisam ser devolvidos, salvo má-fé comprovada. A regra vale desde 25/05/2026.", "fonte": "Lei 8.213/1991, art. 73-A (incluído pela Lei 15.415/2026), caput e §§ 1º a 3º", "origem": "legislacao-pos-2019.md §3 (Lei 15.415/2026)", "sinal": "firme"}, {"id": "out-005", "tema": "Salário-maternidade e outros", "pergunta": "A família de quem foi preso tem direito a algum benefício?", "variantes": ["auxílio-reclusão quem tem direito", "benefício para família de presidiário", "preso no semiaberto dá auxílio-reclusão", "valor da baixa renda do auxílio-reclusão"], "resposta": "Sim, o auxílio-reclusão, devido aos dependentes nas condições da pensão por morte. O preso precisa ter cumprido carência de 24 contribuições, ser de baixa renda, estar em regime fechado e não receber remuneração da empresa nem auxílio-doença, pensão, salário-maternidade, aposentadoria ou abono de permanência. Em 2026, o limite de baixa renda é de R$ 1.980,38.", "fonte": "Lei 8.213/1991, art. 25, IV, e art. 80; Portaria Interministerial MPS/MF 13/2026, art. 5º", "origem": "doutrina-previdenciaria.md §6 (Carência) e §4 (Valores de 2026); legislacao-pos-2019.md §3 (Lei 13.846/2019)", "sinal": "firme"}, {"id": "out-006", "tema": "Salário-maternidade e outros", "pergunta": "Quanto é o salário-família?", "variantes": ["valor do salário-família 2026", "cota do salário-família por filho", "limite de salário para ter salário-família"], "resposta": "Em 2026, R$ 67,54 por cota, com limite de remuneração de R$ 1.980,38.", "fonte": "Portaria Interministerial MPS/MF 13/2026, art. 4º", "origem": "doutrina-previdenciaria.md §4 (Valores de 2026)", "sinal": "firme"}, {"id": "prof-001", "tema": "Professor", "pergunta": "Professor se aposenta mais cedo?", "variantes": ["professora tem aposentadoria especial?", "quantos anos de sala de aula precisa para aposentar", "idade mínima do professor depois da reforma"], "resposta": "Sim. Pela regra permanente da EC (Emenda Constitucional) 103/2019, o professor se aposenta com 57 anos (mulher) ou 60 (homem) e 25 anos de efetivo exercício de magistério na educação infantil, no ensino fundamental ou no médio, para ambos os sexos. A renda é de 60% da média mais 2 pontos percentuais por ano de contribuição acima de 15 (mulher) ou 20 (homem). Quem já estava contribuindo antes de 13/11/2019 pode ter regra de transição melhor.", "fonte": "CF, art. 201, § 8º; EC 103/2019, art. 19, § 1º, II; Dec. 3.048, art. 54; IN 128, art. 250", "origem": "doutrina-professor-pcd-fator.md §2-A.1", "sinal": "firme"}, {"id": "prof-002", "tema": "Professor", "pergunta": "Completei o tempo de professora antes da reforma. Preciso de idade mínima?", "variantes": ["tinha 25 anos de magistério em 2019", "direito adquirido do professor", "professor que fechou o tempo antes de 13/11/2019"], "resposta": "Não. Quem completou 25 anos de magistério (mulher) ou 30 (homem) até 13/11/2019 se aposenta sem idade mínima, cumprida a carência. A renda é 100% do SB (salário de benefício), calculado pelos 80% maiores salários, multiplicado pelo fator previdenciário com bônus de 10 anos (professora) ou 5 (professor) no tempo. O fator é afastado se a soma de idade e tempo atingir os pontos da regra 85/95 mais 5 pontos.", "fonte": "IN 128, arts. 229, 233, IV, a, e 251; Lei 8.213, arts. 29, § 9º, 29-C, § 3º, e 56; Dec. 3.048, art. 188-E, §§ 5º, 9º e 10", "origem": "doutrina-professor-pcd-fator.md §2-A.1", "sinal": "firme"}, {"id": "prof-003", "tema": "Professor", "pergunta": "Como funciona a regra de pontos do professor?", "variantes": ["pontuação professora 2026", "idade mais tempo de magistério", "transição por pontos do professor"], "resposta": "Exige 25 anos de magistério (mulher) ou 30 (homem) e a soma de idade e tempo de contribuição de 88 pontos para a professora e 98 para o professor em 2026. A renda é de 60% da média mais 2 pontos percentuais por ano acima de 15 (mulher) ou 20 (homem). Pontos e idade se apuram em dias.", "fonte": "EC 103/2019, art. 15, § 3º; Dec. 3.048, art. 188-M; IN 128, arts. 233, IV, c, e 252", "origem": "doutrina-professor-pcd-fator.md §2-A.1", "sinal": "firme"}, {"id": "prof-004", "tema": "Professor", "pergunta": "Qual a idade mínima do professor na transição em 2026?", "variantes": ["idade progressiva do professor", "professora com 54 anos e meio pode aposentar?", "transição por idade mínima magistério"], "resposta": "Em 2026, a transição por idade mínima exige 54 anos e 6 meses (professora) ou 59 anos e 6 meses (professor), além do tempo de magistério. A renda é de 60% da média mais 2 pontos percentuais por ano acima de 15 (mulher) ou 20 (homem).", "fonte": "EC 103/2019, art. 16, § 2º; Dec. 3.048, art. 188-N; IN 128, art. 253", "origem": "doutrina-professor-pcd-fator.md §2-A.1", "sinal": "firme"}, {"id": "prof-005", "tema": "Professor", "pergunta": "O professor tem regra de pedágio?", "variantes": ["pedágio de 100% professor", "professora com 52 anos", "regra do pedágio para quem dá aula"], "resposta": "Sim. Pelo pedágio de 100%, a professora se aposenta com 52 anos e o professor com 55, com 25 ou 30 anos de magistério mais 100% do tempo que faltava em 13/11/2019. A renda é 100% do SB (salário de benefício).", "fonte": "EC 103/2019, art. 20, § 1º; Dec. 3.048, art. 188-O; IN 128, arts. 233, IV, e, e 254", "origem": "doutrina-professor-pcd-fator.md §2-A.1", "sinal": "firme"}, {"id": "prof-006", "tema": "Professor", "pergunta": "Fui diretora e coordenadora da escola. Esse tempo conta como magistério?", "variantes": ["vice-diretor conta como professor?", "coordenação pedagógica conta", "tempo fora da sala de aula na escola", "orientador educacional"], "resposta": "Sim. Função de magistério é a docência mais a direção de unidade escolar e a coordenação e o assessoramento pedagógicos em estabelecimento de educação básica, exercidas por professor admitido para a função. Especialistas em educação que não são professores ficam fora (STF (Supremo Tribunal Federal), ADI (ação direta de inconstitucionalidade) 3.772).", "fonte": "Lei 9.394/1996, art. 67, § 2º; Dec. 3.048, art. 54, § 2º; IN 128, art. 214; STF ADI 3.772", "origem": "doutrina-professor-pcd-fator.md §2-A.1", "sinal": "firme"}, {"id": "prof-007", "tema": "Professor", "pergunta": "Professor de faculdade tem a aposentadoria de professor?", "variantes": ["ensino superior conta como magistério?", "professor universitário aposenta mais cedo", "dou aula em curso EAD, conta?"], "resposta": "Não. A redução vale só para a educação básica (infantil, fundamental e média, presencial ou a distância); o ensino superior fica fora. A exceção é o bônus da EC (Emenda Constitucional) 20/1998 para quem tinha magistério até 16/12/1998.", "fonte": "IN 128, art. 214, §§ 1º e 2º, e art. 251, § 1º", "origem": "doutrina-professor-pcd-fator.md §2-A.1", "sinal": "firme"}, {"id": "prof-008", "tema": "Professor", "pergunta": "Licença, férias e afastamento por doença contam no tempo de professor?", "variantes": ["licença-maternidade conta como magistério", "auxílio-doença no meio da carreira de professora", "licença-prêmio conta"], "resposta": "Sim. Contam férias, descansos, licença-prêmio, salário-maternidade e benefício por incapacidade entre períodos de magistério. O benefício acidentário conta até 30/06/2020 mesmo não intercalado e, desde 01/07/2020, só se intercalado com magistério. Também conta o tempo de professor auxiliar.", "fonte": "IN 128, art. 214, red. IN 141/2022", "origem": "doutrina-professor-pcd-fator.md §2-A.1", "sinal": "firme"}, {"id": "prof-009", "tema": "Professor", "pergunta": "Dá para converter o tempo de professor em tempo comum?", "variantes": ["transformar magistério em tempo normal", "acréscimo no tempo de professor", "converter tempo de professora para aposentadoria comum"], "resposta": "Não. É vedada a conversão do tempo de magistério em tempo comum, exercido em qualquer época. A TNU (Turma Nacional de Uniformização) fixou que não há conversão após a EC (Emenda Constitucional) 18/1981.", "fonte": "Dec. 3.048, art. 54, § 4º; IN 128, art. 255, § 2º; TNU Tema 158", "origem": "doutrina-professor-pcd-fator.md §2-A.1", "sinal": "firme"}, {"id": "prof-010", "tema": "Professor", "pergunta": "Trabalhei em outra profissão antes de dar aula. Esse tempo ajuda?", "variantes": ["tempo de comércio soma com magistério?", "tempo fora da escola conta para professor", "fui bancária e depois professora"], "resposta": "Não soma ao requisito de tempo de magistério, mas os salários desse período entram na média do benefício (PBC, período básico de cálculo).", "fonte": "IN 128, art. 255, § 1º", "origem": "doutrina-professor-pcd-fator.md §2-A.1", "sinal": "firme"}, {"id": "prof-011", "tema": "Professor", "pergunta": "O tempo fora do magistério entra no fator previdenciário do professor?", "variantes": ["fator do professor com tempo de outra atividade", "tempo comum melhora o fator da professora"], "resposta": "Há decisão favorável da TNU (Turma Nacional de Uniformização), julgada em 15/04/2026
