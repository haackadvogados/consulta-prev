julgamento do Tema nº 130.\nSinal: ADVERSO.\nStatus: transitado; julgado em 26/06/2025; transitado em julgado em 27/09/2025 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 375 (PEDILEF 0077764-65.2008.4.01.3800/MG)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t376", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 376 da TNU?", "variantes": ["tema 376", "TNU 376", "tema 376 TNU", "TEA", "avaliação biopsicossocial"], "resposta": "Na análise do direito ao benefício de prestação continuada, a caracterização da deficiência da pessoa com transtorno do espectro autista exige avaliação biopsicossocial, sendo insuficientes o diagnóstico médico deste impedimento ou a perícia exclusivamente médica.\nSinal: NEUTRO.\nStatus: transitado; julgado em 24/06/2026; transitado em julgado em 04/08/2026 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 376 (PEDILEF 5006875-14.2022.4.04.7005/PR)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t377", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 377 da TNU?", "variantes": ["tema 377", "TNU 377", "tema 377 TNU", "4 meses", "habilitação tardia"], "resposta": "O período de duração da pensão por morte previsto no art. 77, § 2º, V, 'b', da Lei nº 8.213/91, conta-se invariavelmente a partir do óbito, de modo que, nos casos de habilitação tardia (art. 74, II), o dependente apenas fará jus às parcelas compreendidas entre a DER (data de entrada do requerimento) e o termo final dos 4 meses contados do falecimento do segurado, inexistindo direito ao benefício caso o requerimento ocorra após o transcurso integral deste período.\nSinal: ADVERSO.\nStatus: transitado; julgado em 24/06/2026; transitado em julgado em 28/07/2026 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 377 (PEDILEF 5033998-02.2022.4.04.7000/PR)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t378", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 378 da TNU?", "variantes": ["tema 378", "TNU 378", "tema 378 TNU", "visão monocular", "avaliação biopsicossocial"], "resposta": "Na análise do direito ao benefício de prestação continuada, a caracterização da deficiência da pessoa com visão monocular exige avaliação biopsicossocial, sendo insuficientes o diagnóstico do impedimento visual ou a perícia exclusivamente médica.\nSinal: NEUTRO.\nStatus: transitado; julgado em 25/06/2025; transitado em julgado em 29/07/2025 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 378 (PEDILEF 5010660-51.2022.4.04.7112/RS)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-t382", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 382 da TNU?", "variantes": ["tema 382", "TNU 382", "tema 382 TNU", "tolueno", "via cutânea"], "resposta": "A exposição ao tolueno por via cutânea, inclusive na sua forma líquida, não autoriza o reconhecimento da atividade especial por análise qualitativa (Anexo 13, NR-15 (Norma Regulamentadora 15)).\nSinal: ADVERSO.\nStatus: transitado; julgado em 15/04/2026, trânsito em 26/05/2026 (conferido em 21/10/2026).", "fonte": "TNU, Tema representativo 382 (PEDILEF 5012678-57.2022.4.04.7108/RS)", "origem": "catalogo-temas-vinculantes.md v1.15, §4 e §7", "sinal": "firme"}, {"id": "tnu-t383", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 383 da TNU?", "variantes": ["tema 383", "TNU 383", "tema 383 TNU", "profissional de saúde", "EPI eficaz"], "resposta": "I - A informação de equipamento de proteção individual (EPI) eficaz constante do Perfil Profissiográfico Previdenciário (PPP) não obsta o reconhecimento da especialidade do trabalho dos profissionais de saúde, como médicos, enfermeiros, técnicos e auxiliares de enfermagem, fisioterapeutas e farmacêuticos que, no exercício habitual de suas atribuições, em ambiente hospitalar, realizem ou auxiliem diretamente procedimentos geradores de aerossol (intubação orotraqueal, ventilação não invasiva, aspiração de vias aéreas, reanimação cardiopulmonar, traqueostomia, broncoscopia e similares), prestem atendimento em caráter de urgência ou emergência em setores críticos (CTI/UTI (centro ou unidade de terapia intensiva), pronto-socorro e centro cirúrgico) ou atuem em setores/alas destinadas a pacientes com suspeita ou confirmação de doenças infectocontagiosas. II - Quanto aos profissionais de saúde em ambiente hospitalar, com exposição habitual e permanente a agentes biológicos (Temas 205 e 211/TNU) fora das hipóteses do item I, a informação de eficácia do EPI no PPP somente pode ser desconsiderada mediante impugnação específica e fundamentada, nos termos dos temas 213 da Turma Nacional de Uniformização e 1090 do Superior Tribunal de Justiça.\nSinal: FAVORÁVEL (item I; item II NEUTRO).\nStatus: julgado em 24/09/2026, publicado em 28/09/2026, sem trânsito (conferido em 25/10/2026).\nAtenção: Julgado sem trânsito: reconsultar o status na data de cada peça; não usar como entendimento dominante até o trânsito.", "fonte": "TNU, Tema representativo 383 (PEDILEF 1004356-32.2019.4.01.3802/MG)", "origem": "catalogo-temas-vinculantes.md v1.15, §4 e §7", "sinal": "controvertido"}, {"id": "tnu-t384", "tema": "TNU: tema a tema", "pergunta": "O que diz o Tema 384 da TNU?", "variantes": ["tema 384", "TNU 384", "tema 384 TNU", "complementação de alíquota", "efeitos financeiros"], "resposta": "1. A complementação de contribuições recolhidas tempestivamente sob alíquota reduzida (5% ou 11%) pelo segurado contribuinte individual ou facultativo, inclusive na condição de microempreendedor individual (MEI), nos termos do art. 21, § 3º, da Lei nº 8.212/1991, permite a fixação dos efeitos financeiros do benefício na própria DER (data de entrada do requerimento) quando: a) a complementação ocorrer no curso do processo administrativo, ainda que em fase recursal perante o Conselho de Recursos da Previdência Social (CRPS); ou b) a ausência de complementação decorrer de atuação não colaborativa do INSS (Instituto Nacional do Seguro Social), que tenha deixado de oportunizar ao interessado a respectiva regularização. 2. Quando, após regular intimação para cumprimento de exigência, o segurado deixar de complementar as contribuições e o fizer apenas após o encerramento do procedimento administrativo, os efeitos financeiros do benefício deverão ser fixados na data do novo requerimento administrativo em que for apresentada a complementação.\nSinal: NEUTRO.\nStatus: transitado; julgado em 06/08/2026; transitado em julgado em 23/09/2026 (conferido em 16/10/2026).", "fonte": "TNU, Tema representativo 384 (PEDILEF 5003886-26.2022.4.04.7202/SC)", "origem": "tnu-inventario-sinais.md v1.1 (sinal e situação); 04_DECISOES/TNU/temas-representativos/TNU_temas-representativos_2026-10-16.md (tese literal)", "sinal": "firme"}, {"id": "tnu-s1", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 1 da TNU?", "variantes": ["súmula 1", "TNU súmula 1", "súmula 1 TNU", "URV", "Lei 8.880"], "resposta": "A conversão dos benefícios previdenciários em URV (Unidade Real de Valor), em março/94, obedece às disposições do art. 20, incisos I e II da Lei 8.880/94 (MP (Medida Provisória) nº 434/94).\nSinal: não registrado nas fontes.\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 1", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s2", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 2 da TNU?", "variantes": ["súmula 2", "TNU súmula 2", "súmula 2 TNU", "reajuste de 1996", "MP 1.415"], "resposta": "Os benefícios previdenciários, em maio de 1996, deverão ser reajustados na forma da Medida Provisória 1.415, de 29 de abril de 1996, convertida na Lei 9.711, de 20 de novembro de 1998.\nSinal: não registrado nas fontes.\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 2", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s4", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 4 da TNU?", "variantes": ["súmula 4", "TNU súmula 4", "súmula 4 TNU", "pessoa designada", "Lei 9.032"], "resposta": "Não há direito adquirido à condição de dependente de pessoa designada, quando o falecimento do segurado deu-se após o advento da Lei 9.032/95.\nSinal: não registrado nas fontes.\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 4", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s5", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 5 da TNU?", "variantes": ["súmula 5", "TNU súmula 5", "súmula 5 TNU", "menor de 14 anos", "trabalho infantil"], "resposta": "A prestação de serviço rural por menor de 12 a 14 anos, até o advento da Lei 8.213, de 24 de julho de 1991, devidamente comprovada, pode ser reconhecida para fins previdenciários.\nSinal: FAVORÁVEL.\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 5", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s6", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 6 da TNU?", "variantes": ["súmula 6", "TNU súmula 6", "súmula 6 TNU", "certidão de casamento", "cônjuge"], "resposta": "A certidão de casamento ou outro documento idôneo que evidencie a condição de trabalhador rural do cônjuge constitui início razoável de prova material da atividade rurícola.\nSinal: FAVORÁVEL (ressalva do STJ (Superior Tribunal de Justiça) Tema 533: cônjuge que passou a trabalho urbano).\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 6", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s7", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 7 da TNU?", "variantes": ["súmula 7", "TNU súmula 7", "súmula 7 TNU", "honorários", "uniformização"], "resposta": "Descabe incidente de uniformização versando sobre honorários advocatícios por se tratar de questão de direito processual.\nSinal: não registrado nas fontes.\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 7", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s8", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 8 da TNU?", "variantes": ["súmula 8", "TNU súmula 8", "súmula 8 TNU", "IGP-DI", "reajuste"], "resposta": "Os benefícios de prestação continuada, no regime geral da Previdência Social, não serão reajustados com base no IGP-DI (Índice Geral de Preços, Disponibilidade Interna) nos anos de 1997, 1999, 2000 e 2001.\nSinal: não registrado nas fontes.\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 8", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s9", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 9 da TNU?", "variantes": ["súmula 9", "TNU súmula 9", "súmula 9 TNU", "EPI", "ruído"], "resposta": "O uso de Equipamento de Proteção Individual (EPI), ainda que elimine a insalubridade, no caso de exposição a ruído, não descaracteriza o tempo de serviço especial prestado.\nSinal: não registrado nas fontes.\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 9", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s10", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 10 da TNU?", "variantes": ["súmula 10", "TNU súmula 10", "súmula 10 TNU", "contagem recíproca", "rural"], "resposta": "O tempo de serviço rural anterior à vigência da Lei nº. 8.213/91 pode ser utilizado para fins de contagem recíproca, assim entendida aquela que soma tempo de atividade privada, rural ou urbana, ao de serviço público estatutário, desde que sejam recolhidas as respectivas contribuições previdenciárias.\nSinal: não registrado nas fontes.\nStatus: vigente (conferido em 24/10/2026).\nAlcance: contagem recíproca com regime próprio, fora do escopo de atuação da família previdenciária.", "fonte": "TNU, Súmula 10", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s14", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 14 da TNU?", "variantes": ["súmula 14", "TNU súmula 14", "súmula 14 TNU", "prova material", "carência"], "resposta": "Para a concessão de aposentadoria rural por idade, não se exige que o início de prova material corresponda a todo o período equivalente à carência do benefício.\nSinal: FAVORÁVEL.\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 14", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s17", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 17 da TNU?", "variantes": ["súmula 17", "TNU súmula 17", "súmula 17 TNU", "renúncia tácita", "competência"], "resposta": "Não há renúncia tácita no Juizado Especial Federal, para fins de competência.\nSinal: não registrado nas fontes.\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 17", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s18", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 18 da TNU?", "variantes": ["súmula 18", "TNU súmula 18", "súmula 18 TNU", "aluno-aprendiz", "tempo de serviço"], "resposta": "Para fins previdenciários, o cômputo do tempo de serviço prestado como aluno-aprendiz exige a comprovação de que, durante o período de aprendizado,houve simultaneamente: (i) retribuição consubstanciada em prestação pecuniária ou em auxílios materiais; (ii) à conta do Orçamento; (iii) a título decontraprestação por labor; (iv) na execução de bens e serviços destinados a terceiros.\nSinal: não registrado nas fontes.\nStatus: alterada em 14/02/2020 (fonte: \"alterada na sessão de\") (conferido em 24/10/2026).\nAtenção: súmula alterada; o texto acima é a redação atual exibida na lista oficial.", "fonte": "TNU, Súmula 18", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s19", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 19 da TNU?", "variantes": ["súmula 19", "TNU súmula 19", "súmula 19 TNU", "IRSM", "39,67%"], "resposta": "Para o cálculo da renda mensal inicial do benefício previdenciário, deve ser considerada, na atualização dos salários de contribuição anteriores a março de 1994, a variação integral do IRSM (Índice de Reajuste do Salário Mínimo) de fevereiro de 1994, na ordem de 39,67% (art. 21, § 1º, da Lei nº 8.880/94).\nSinal: não registrado nas fontes.\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 19", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s21", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 21 da TNU?", "variantes": ["súmula 21", "TNU súmula 21", "súmula 21 TNU", "IPC", "reajuste"], "resposta": "Não há direito adquirido a reajuste de benefícios previdenciários com base na variação do IPC (Índice de Preço ao Consumidor), de janeiro de 1989 (42,72%) e abril de 1990 (44,80%).\nSinal: não registrado nas fontes.\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 21", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s22", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 22 da TNU?", "variantes": ["súmula 22", "TNU súmula 22", "súmula 22 TNU", "termo inicial", "perícia"], "resposta": "Se a prova pericial realizada em juízo dá conta de que a incapacidade já existia na data do requerimento administrativo, esta é o termo inicial do benefício assistencial.\nSinal: FAVORÁVEL.\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 22", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s24", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 24 da TNU?", "variantes": ["súmula 24", "TNU súmula 24", "súmula 24 TNU", "rural antes de 1991", "carência"], "resposta": "O tempo de serviço do segurado trabalhador rural anterior ao advento da Lei nº 8.213/91, sem o recolhimento de contribuições previdenciárias, pode ser considerado para a concessão de benefício previdenciário do Regime Geral de Previdência Social (RGPS), exceto para efeito de carência, conforme a regra do art. 55, §2º, da Lei nº 8.213/91.\nSinal: NEUTRO (tempo favorável; carência excluída).\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 24", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s25", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 25 da TNU?", "variantes": ["súmula 25", "TNU súmula 25", "súmula 25 TNU", "art. 58 do ADCT", "salários mínimos"], "resposta": "A revisão dos valores dos benefícios previdenciários, prevista no art. 58 do ADCT (Ato das Disposições Constitucionais Transitórias), deve ser feita com base no número de salários mínimos apurado na data da concessão, e não no mês de recolhimento da última contribuição.\nSinal: não registrado nas fontes.\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 25", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s26", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 26 da TNU?", "variantes": ["súmula 26", "TNU súmula 26", "súmula 26 TNU", "vigilante", "guarda"], "resposta": "A atividade de vigilante enquadra-se como especial, equiparando-se à de guarda, elencada no item 2.5.7. do Anexo III do Decreto n. 53.831/64.\nSinal: não registrado nas fontes.\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 26", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s27", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 27 da TNU?", "variantes": ["súmula 27", "TNU súmula 27", "súmula 27 TNU", "desemprego", "registro no Ministério do Trabalho"], "resposta": "A ausência de registro em órgão do Ministério do Trabalho não impede a comprovação do desemprego por outros meios admitidos em Direito.\nSinal: não registrado nas fontes.\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 27", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s29", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 29 da TNU?", "variantes": ["súmula 29", "TNU súmula 29", "súmula 29 TNU", "vida independente", "sustento"], "resposta": "Para os efeitos do art. 20, § 2º, da Lei n. 8.742, de 1993, incapacidade para a vida independente não é só aquela que impede as atividades mais elementares da pessoa, mas também a impossibilita de prover ao próprio sustento.\nSinal: FAVORÁVEL.\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 29", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s30", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 30 da TNU?", "variantes": ["súmula 30", "TNU súmula 30", "súmula 30 TNU", "módulo rural", "economia familiar"], "resposta": "Tratando-se de demanda previdenciária, o fato de o imóvel ser superior ao módulo rural não afasta, por si só, a qualificação de seu proprietário como segurado especial, desde que comprovada, nos autos, a sua exploração em regime de economia familiar.\nSinal: FAVORÁVEL (com o STJ (Superior Tribunal de Justiça) Tema 1115).\nStatus: vigente (conferido em 24/10/2026).\nAtenção: os 4 módulos fiscais vêm da Lei 8.213 e do STJ Tema 1115, não da súmula.", "fonte": "TNU, Súmula 30", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s33", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 33 da TNU?", "variantes": ["súmula 33", "TNU súmula 33", "súmula 33 TNU", "DER", "termo inicial"], "resposta": "Quando o segurado houver preenchido os requisitos legais para concessão da aposentadoria por tempo de serviço na data do requerimento administrativo, esta data será o termo inicial da concessão do benefício.\nSinal: não registrado nas fontes.\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 33", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s34", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 34 da TNU?", "variantes": ["súmula 34", "TNU súmula 34", "súmula 34 TNU", "contemporaneidade", "prova material"], "resposta": "Para fins de comprovação do tempo de labor rural, o início de prova material deve ser contemporâneo à época dos fatos a provar.\nSinal: ADVERSO (exigência de contemporaneidade).\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 34", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s36", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 36 da TNU?", "variantes": ["súmula 36", "TNU súmula 36", "súmula 36 TNU", "pensão rural", "aposentadoria por invalidez"], "resposta": "Não há vedação legal à cumulação da pensão por morte de trabalhador rural com o benefício da aposentadoria por invalidez, por apresentarem pressupostos fáticos e fatos geradores distintos.\nSinal: FAVORÁVEL.\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 36", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s37", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 37 da TNU?", "variantes": ["súmula 37", "TNU súmula 37", "súmula 37 TNU", "universitário", "21 anos"], "resposta": "A pensão por morte, devida ao filho até os 21 anos de idade, não se prorroga pela pendência do curso universitário.\nSinal: ADVERSO.\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 37", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s38", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 38 da TNU?", "variantes": ["súmula 38", "TNU súmula 38", "súmula 38 TNU", "OTN/ORTN", "Tabela de Santa Catarina"], "resposta": "Aplica-se subsidiariamente a Tabela de Cálculos de Santa Catarina aos pedidos de revisão de RMI (renda mensal inicial) - OTN/ORTN (Obrigações do Tesouro Nacional e Obrigações Reajustáveis do Tesouro Nacional), na atualização dos salários de contribuição.\nSinal: não registrado nas fontes.\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 38", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s41", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 41 da TNU?", "variantes": ["súmula 41", "TNU súmula 41", "súmula 41 TNU", "atividade urbana", "núcleo familiar"], "resposta": "A circunstância de um dos integrantes do núcleo familiar desempenhar atividade urbana não implica, por si só, a descaracterização do trabalhador rural como segurado especial, condição que deve ser analisada no caso concreto.\nSinal: FAVORÁVEL (com o STJ (Superior Tribunal de Justiça) Tema 532).\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 41", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s42", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 42 da TNU?", "variantes": ["súmula 42", "TNU súmula 42", "súmula 42 TNU", "reexame de fato", "uniformização"], "resposta": "Não se conhece de incidente de uniformização que implique reexame de matéria de fato.\nSinal: não registrado nas fontes.\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 42", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s43", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 43 da TNU?", "variantes": ["súmula 43", "TNU súmula 43", "súmula 43 TNU", "matéria processual", "uniformização"], "resposta": "Não cabe incidente de uniformização que verse sobre matéria processual.\nSinal: não registrado nas fontes.\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 43", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s44", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 44 da TNU?", "variantes": ["súmula 44", "TNU súmula 44", "súmula 44 TNU", "art. 142", "ano da idade"], "resposta": "Para efeito de aposentadoria urbana por idade, a tabela progressiva de carência prevista no art. 142 da Lei nº 8.213/91 deve ser aplicada em função do ano em que o segurado completa a idade mínima para concessão do benefício, ainda que o período de carência só seja preenchido posteriormente.\nSinal: FAVORÁVEL.\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 44", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s45", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 45 da TNU?", "variantes": ["súmula 45", "TNU súmula 45", "súmula 45 TNU", "correção monetária", "parto"], "resposta": "Incide correção monetária sobre o salário-maternidade desde a época do parto, independentemente da data do requerimento administrativo.\nSinal: não registrado nas fontes.\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 45", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s46", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 46 da TNU?", "variantes": ["súmula 46", "TNU súmula 46", "súmula 46 TNU", "atividade urbana intercalada", "rural"], "resposta": "O exercício de atividade urbana intercalada não impede a concessão de benefício previdenciário de trabalhador rural, condição que deve ser analisada no caso concreto.\nSinal: FAVORÁVEL.\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 46", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s47", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 47 da TNU?", "variantes": ["súmula 47", "TNU súmula 47", "súmula 47 TNU", "incapacidade parcial", "condições pessoais"], "resposta": "Uma vez reconhecida a incapacidade parcial para o trabalho, o juiz deve analisar as condições pessoais e sociais do segurado para a concessão de aposentadoria por invalidez.\nSinal: não registrado nas fontes.\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 47", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s48", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 48 da TNU?", "variantes": ["súmula 48", "TNU súmula 48", "súmula 48 TNU", "impedimento de longo prazo", "2 anos"], "resposta": "Para fins de concessão do benefício assistencial de prestação continuada, o conceito de pessoa com deficiência, que não se confunde necessariamente com situação de incapacidade laborativa, exige a configuração de impedimento de longo prazo com duração mínima de 2 (dois) anos, a ser aferido no caso concreto, desde o início do impedimento até a data prevista para a sua cessação.\nSinal: ADVERSO.\nStatus: alterada em 25/04/2019 (fonte: \"25.4.2019\") (fonte: \"alterada na sessão de\") (conferido em 24/10/2026).\nAtenção: súmula alterada; o texto acima é a redação atual exibida na lista oficial.", "fonte": "TNU, Súmula 48", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s49", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 49 da TNU?", "variantes": ["súmula 49", "TNU súmula 49", "súmula 49 TNU", "permanência", "antes de 1995"], "resposta": "Para reconhecimento de condição especial de trabalho antes de 29/4/1995, a exposição a agentes nocivos à saúde ou à integridade física não precisa ocorrer de forma permanente.\nSinal: FAVORÁVEL.\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 49", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s50", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 50 da TNU?", "variantes": ["súmula 50", "TNU súmula 50", "súmula 50 TNU", "conversão", "qualquer período"], "resposta": "É possível a conversão do tempo de serviço especial em comum do trabalho prestado em qualquer período.\nSinal: NEUTRO (conversão de qualquer período até 13/11/2019).\nStatus: vigente (conferido em 24/10/2026).\nAlcance: a conversão de tempo especial em comum vai só até 13/11/2019 (EC (Emenda Constitucional) 103/2019, art. 25, § 2º), marco que o catálogo atribui à emenda, não à súmula.", "fonte": "TNU, Súmula 50", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s52", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 52 da TNU?", "variantes": ["súmula 52", "TNU súmula 52", "súmula 52 TNU", "contribuição após o óbito", "regularização"], "resposta": "Para fins de concessão de pensão por morte, é incabível a regularização do recolhimento de contribuições de segurado contribuinte individual posteriormente a seu óbito, exceto quando as contribuições devam ser arrecadadas por empresa tomadora de serviços.\nSinal: ADVERSO.\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 52", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s53", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 53 da TNU?", "variantes": ["súmula 53", "TNU súmula 53", "súmula 53 TNU", "preexistente", "reingresso"], "resposta": "Não há direito a auxílio-doença ou a aposentadoria por invalidez quando a incapacidade para o trabalho é preexistente ao reingresso do segurado no Regime Geral de Previdência Social.\nSinal: não registrado nas fontes.\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 53", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s54", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 54 da TNU?", "variantes": ["súmula 54", "TNU súmula 54", "súmula 54 TNU", "imediatamente anterior", "idade rural"], "resposta": "Para a concessão de aposentadoria por idade de trabalhador rural, o tempo de exercício de atividade equivalente à carência deve ser aferido no período imediatamente anterior ao requerimento administrativo ou à data do implemento da idade mínima.\nSinal: FAVORÁVEL.\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 54", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s55", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 55 da TNU?", "variantes": ["súmula 55", "TNU súmula 55", "súmula 55 TNU", "fator multiplicativo", "data da concessão"], "resposta": "A conversão do tempo de atividade especial em comum deve ocorrer com aplicação do fator multiplicativo em vigor na data da concessão da aposentadoria.\nSinal: NEUTRO (conversão de qualquer período até 13/11/2019).\nStatus: vigente (conferido em 24/10/2026).\nAlcance: a conversão de tempo especial em comum vai só até 13/11/2019 (EC (Emenda Constitucional) 103/2019, art. 25, § 2º), marco que o catálogo atribui à emenda, não à súmula.", "fonte": "TNU, Súmula 55", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s57", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 57 da TNU?", "variantes": ["súmula 57", "TNU súmula 57", "súmula 57 TNU", "80% maiores", "Lei 9.876"], "resposta": "O auxílio-doença e a aposentadoria por invalidez não precedida de auxílio-doença, quando concedidos na vigência da Lei n. 9.876/1999, devem ter o salário de benefício apurado com base na média aritmética simples dos maiores salários de contribuição correspondentes a 80% do período contributivo, independentemente da data de filiação do segurado ou do número de contribuições mensais no período contributivo.\nSinal: não registrado nas fontes.\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 57", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s62", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 62 da TNU?", "variantes": ["súmula 62", "TNU súmula 62", "súmula 62 TNU", "contribuinte individual", "especial"], "resposta": "O segurado contribuinte individual pode obter reconhecimento de atividade especial para fins previdenciários, desde que consiga comprovar exposição a agentes nocivos à saúde ou à integridade física.\nSinal: FAVORÁVEL.\nStatus: vigente (conferido em 24/10/2026).\nAtenção: \"não cooperado\" e \"sem formulário\" vêm do STJ (Superior Tribunal de Justiça) Tema 1291, não da súmula.", "fonte": "TNU, Súmula 62", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s63", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 63 da TNU?", "variantes": ["súmula 63", "TNU súmula 63", "súmula 63 TNU", "união estável", "prova material"], "resposta": "Para os fatos geradores ocorridos até a entrada em vigor da MP (Medida Provisória) nº 871/2019, a comprovação de união estável para efeito de concessão de pensão por morte prescinde de início de prova material.\nSinal: FAVORÁVEL.\nStatus: alterada em 18/09/2025 (conferido em 24/10/2026).\nAtenção: súmula alterada; o texto acima é a redação atual exibida na lista oficial.", "fonte": "TNU, Súmula 63", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s65", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 65 da TNU?", "variantes": ["súmula 65", "TNU súmula 65", "súmula 65 TNU", "MP 242/2005", "cálculo"], "resposta": "Os benefícios de auxílio-doença, auxílio-acidente e aposentadoria por invalidez concedidos no período de 28/3/2005 a 20/7/2005 devem ser calculados nos termos da Lei n. 8.213/1991, em sua redação anterior à vigência da Medida Provisória n. 242/2005.\nSinal: FAVORÁVEL (residual).\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 65", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s66", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 66 da TNU?", "variantes": ["súmula 66", "TNU súmula 66", "súmula 66 TNU", "servidor ex-celetista", "contagem recíproca"], "resposta": "O servidor público ex-celetista que trabalhava sob condições especiais antes de migrar para o regime estatutário tem direito adquirido à conversão do tempo de atividade especial em tempo comum com o devido acréscimo legal, para efeito de contagem recíproca no regime previdenciário próprio dos servidores públicos.\nSinal: não registrado nas fontes.\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 66", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s67", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 67 da TNU?", "variantes": ["súmula 67", "TNU súmula 67", "súmula 67 TNU", "auxílio-alimentação", "salário de contribuição"], "resposta": "O auxílio-alimentação recebido em pecúnia por segurado filiado ao Regime Geral da Previdência Social integra o salário de contribuição e sujeita-se à incidência de contribuição previdenciária.\nSinal: não registrado nas fontes.\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 67", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s68", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 68 da TNU?", "variantes": ["súmula 68", "TNU súmula 68", "súmula 68 TNU", "laudo extemporâneo", "laudo"], "resposta": "O laudo pericial não contemporâneo ao período trabalhado é apto à comprovação da atividade especial do segurado.\nSinal: FAVORÁVEL.\nStatus: vigente (conferido em 24/10/2026).\nAtenção: a súmula não tem condição; a exigência de ambiente inalterado é do Tema 14.", "fonte": "TNU, Súmula 68", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s70", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 70 da TNU?", "variantes": ["súmula 70", "TNU súmula 70", "súmula 70 TNU", "tratorista", "motorista de caminhão"], "resposta": "A atividade de tratorista pode ser equiparada à de motorista de caminhão para fins de reconhecimento de atividade especial mediante enquadramento por categoria profissional.\nSinal: não registrado nas fontes.\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 70", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s71", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 71 da TNU?", "variantes": ["súmula 71", "TNU súmula 71", "súmula 71 TNU", "pedreiro", "cimento"], "resposta": "O mero contato do pedreiro com o cimento não caracteriza condição especial de trabalho para fins previdenciários.\nSinal: não registrado nas fontes.\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 71", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s72", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 72 da TNU?", "variantes": ["súmula 72", "TNU súmula 72", "súmula 72 TNU", "trabalho durante a incapacidade", "atividade remunerada"], "resposta": "É possível o recebimento de benefício por incapacidade durante período em que houve exercício de atividade remunerada quando comprovado que o segurado estava incapaz para as atividades habituais na época em que trabalhou.\nSinal: FAVORÁVEL.\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 72", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s73", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 73 da TNU?", "variantes": ["súmula 73", "TNU súmula 73", "súmula 73 TNU", "benefício intercalado", "carência"], "resposta": "O tempo de gozo de auxílio-doença ou de aposentadoria por invalidez não decorrentes de acidente de trabalho só pode ser computado como tempo de contribuição ou para fins de carência quando intercalado entre períodos nos quais houve recolhimento de contribuições para a previdência social.\nSinal: NEUTRO; FAVORÁVEL quanto à carência do período intercalado.\nStatus: vigente (conferido em 24/10/2026).\nAtenção: as fontes dão sinais diferentes (NEUTRO no ins. R24-17; FAVORÁVEL quanto à carência no ins. R24-20).", "fonte": "TNU, Súmula 73", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s74", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 74 da TNU?", "variantes": ["súmula 74", "TNU súmula 74", "súmula 74 TNU", "suspensão da prescrição", "requerimento administrativo"], "resposta": "O prazo de prescrição fica suspenso pela formulação de requerimento administrativo e volta a correr pelo saldo remanescente após a ciência da decisão administrativa final.\nSinal: não registrado nas fontes.\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 74", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s75", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 75 da TNU?", "variantes": ["súmula 75", "TNU súmula 75", "súmula 75 TNU", "CTPS", "CNIS"], "resposta": "A Carteira de Trabalho e Previdência Social (CTPS) em relação à qual não se aponta defeito formal que lhe comprometa a fidedignidade goza de presunção relativa de veracidade, formando prova suficiente de tempo de serviço para fins previdenciários, ainda que a anotação de vínculo de emprego não conste no Cadastro Nacional de Informações Sociais (CNIS).\nSinal: não registrado nas fontes.\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 75", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s76", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 76 da TNU?", "variantes": ["súmula 76", "TNU súmula 76", "súmula 76 TNU", "coeficiente", "rural não contributivo"], "resposta": "A averbação de tempo de serviço rural não contributivo não permite majorar o coeficiente de cálculo da renda mensal inicial de aposentadoria por idade previsto no art. 50 da Lei nº 8.213/91.\nSinal: ADVERSO.\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 76", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s77", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 77 da TNU?", "variantes": ["súmula 77", "TNU súmula 77", "súmula 77 TNU", "condições pessoais", "sem incapacidade"], "resposta": "O julgador não é obrigado a analisar as condições pessoais e sociais quando não reconhecer a incapacidade do requerente para a sua atividade habitual.\nSinal: não registrado nas fontes.\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 77", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s78", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 78 da TNU?", "variantes": ["súmula 78", "TNU súmula 78", "súmula 78 TNU", "HIV", "estigma"], "resposta": "Comprovado que o requerente de benefício é portador do vírus HIV (vírus da imunodeficiência humana), cabe ao julgador verificar as condições pessoais, sociais, econômicas e culturais, de forma a analisar a incapacidade em sentido amplo, em face da elevada estigmatização social da doença.\nSinal: não registrado nas fontes.\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 78", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s79", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 79 da TNU?", "variantes": ["súmula 79", "TNU súmula 79", "súmula 79 TNU", "laudo social", "auto de constatação"], "resposta": "Nas ações em que se postula benefício assistencial, é necessária a comprovação das condições socioeconômicas do autor por laudo de assistente social, por auto de constatação lavrado por oficial de justiça ou, sendo inviabilizados os referidos meios, por prova testemunhal.\nSinal: NEUTRO.\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 79", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s80", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 80 da TNU?", "variantes": ["súmula 80", "TNU súmula 80", "súmula 80 TNU", "avaliação social", "assistente social"], "resposta": "Nos pedidos de benefício de prestação continuada (LOAS), tendo em vista o advento da Lei 12.470/11, para adequada valoração dos fatores ambientais, sociais, econômicos e pessoais que impactam na participação da pessoa com deficiência na sociedade, é necessária a realização de avaliação social por assistente social ou outras providências aptas a revelar a efetiva condição vivida no meio social pelo requerente.\nSinal: FAVORÁVEL.\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 80", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s81", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 81 da TNU?", "variantes": ["súmula 81", "TNU súmula 81", "súmula 81 TNU", "indeferimento", "cessação"], "resposta": "A impugnação de ato de indeferimento, cessação ou cancelamento de benefício previdenciário não se submete a qualquer prazo extintivo, seja em relação à revisão desses atos, seja em relação ao fundo de direito.\nSinal: não registrado nas fontes.\nStatus: alterada em 09/12/2020 (conferido em 24/10/2026).\nAtenção: súmula alterada; o texto acima é a redação atual exibida na lista oficial.", "fonte": "TNU, Súmula 81", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s82", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 82 da TNU?", "variantes": ["súmula 82", "TNU súmula 82", "súmula 82 TNU", "limpeza hospitalar", "código 1.3.2"], "resposta": "O código 1.3.2 do quadro anexo ao Decreto n.º 53.831/64, além dos profissionais da área da saúde, contempla os trabalhadores que exercem atividades de serviços gerais em limpeza e higienização@de ambientes hospitalares.\nSinal: FAVORÁVEL (alcance do 1.3.2; não dispensa laudo ou formulário).\nStatus: vigente (conferido em 24/10/2026).\nAtenção: o \"@\" consta do arquivo oficial; ler com o Tema 238.", "fonte": "TNU, Súmula 82", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s83", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 83 da TNU?", "variantes": ["súmula 83", "TNU súmula 83", "súmula 83 TNU", "décimo terceiro", "Lei 8.870"], "resposta": "A partir da entrada em vigor da Lei n. 8.870/94, o décimo terceiro salário não integra o salário de contribuição para fins de cálculo do salário de benefício.\nSinal: não registrado nas fontes.\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 83", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s85", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 85 da TNU?", "variantes": ["súmula 85", "TNU súmula 85", "súmula 85 TNU", "conversão de comum em especial", "Lei 9.032"], "resposta": "É possível a conversão de tempo comum em especial de período(s) anterior(es) ao advento da Lei nº 9.032/95 (que alterou a redação do §3º do art. 57 da Lei nº 8.213/91), desde que todas as condições legais para a concessão do benefício pleiteado tenham sido atendidas antes da publicação da referida lei, independentemente da data de entrada do requerimento (DER).\nSinal: não registrado nas fontes.\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 85", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s87", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 87 da TNU?", "variantes": ["súmula 87", "TNU súmula 87", "súmula 87 TNU", "EPI", "antes de 1998"], "resposta": "A eficácia do EPI (equipamento de proteção individual) não obsta o reconhecimento de atividade especial exercida antes de 03/12/1998, data de início da vigência da MP (Medida Provisória) 1.729/98, convertida na Lei n. 9.732/98.\nSinal: FAVORÁVEL.\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 87", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s88", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 88 da TNU?", "variantes": ["súmula 88", "TNU súmula 88", "súmula 88 TNU", "limitação leve", "Tema 416"], "resposta": "A existência de limitação, ainda que leve, para o desempenho da atividade para o trabalho habitual enseja a concessão do benefício de auxílio-acidente, em observância a tese fixada sob o Tema 416 do Superior Tribunal de Justiça.\nSinal: FAVORÁVEL.\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 88", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "tnu-s89", "tema": "TNU: súmulas", "pergunta": "O que diz a Súmula 89 da TNU?", "variantes": ["súmula 89", "TNU súmula 89", "súmula 89 TNU", "sem redução", "maior esforço"], "resposta": "Não há direito à concessão de benefício de auxílio-acidente quando, após consolidação das lesões decorrentes de acidente de qualquer natureza, resultarem seqüelas que não reduzem a capacidade laborativa habitual nem sequer demandam dispêndio de maior esforço na execução da atividade habitual.\nSinal: ADVERSO.\nStatus: vigente (conferido em 24/10/2026).", "fonte": "TNU, Súmula 89", "origem": "04_DECISOES/TNU/sumulas/TNU_sumulas-1-89.md (lista oficial de 24/10/2026); sinal: catalogo-temas-vinculantes.md §3 e catalogo-temas-vinculantes-2.md §3", "sinal": "firme"}, {"id": "vin-a01", "tema": "STF e STJ: temas por assunto", "pergunta": "Quais temas do STF e do STJ tratam de aposentadoria por idade, programada e regras de transição?", "variantes": ["STF aposentadoria por idade", "STJ aposentadoria por idade", "tema repetitivo idade", "repercussão geral idade", "tribunais superiores sobre aposentadoria por idade", "tema STJ híbrida"], "resposta": "Temas do STF (Supremo Tribunal Federal) e do STJ (Superior Tribunal de Justiça) sobre aposentadoria por idade, programada e regras de transição registrados nos catálogos da casa, com sinal ao segurado e status na data de corte (07/10/2026 a 10/11/2026, conforme a linha):\nSTF Tema 1104 (NEUTRO; sem RG (repercussão geral), transitado): Requisitos da aposentadoria híbrida são infraconstitucionais; mantém o STJ Tema 1007 como palavra final.\nADI (ação direta de inconstitucionalidade) 6309 (NEUTRO; sem trânsito, ED (embargos de declaração) pendentes): Idade mínima da aposentadoria especial da EC (Emenda Constitucional) 103 inconstitucional (favorável); vedação de conversão e cálculo de 60% mais 2 pontos constitucionais (adversos).\nSTJ Tema 644 (FAVORÁVEL; transitado): Empregado rural com CTPS (Carteira de Trabalho e Previdência Social) antes de 1991: o tempo conta para a carência do art. 142.\nSTJ Tema 1007 (FAVORÁVEL; transitado): Na aposentadoria híbrida, rural remoto e descontínuo anterior à Lei 8.213 conta para carência sem recolhimento.", "fonte": "STF e STJ, temas de repercussão geral, repetitivos e controle concentrado", "origem": "catalogo-temas-vinculantes.md v1.15 §1, §2 e §7; catalogo-temas-vinculantes-2.md v1.0 §1 e §2", "sinal": "firme", "ficha": true}, {"id": "vin-a02", "tema": "STF e STJ: temas por assunto", "pergunta": "Quais temas do STF e do STJ tratam de tempo de contribuição, carência e CNIS?", "variantes": ["STF tempo de contribuição e carência", "STJ tempo de contribuição e carência", "tema repetitivo carência", "repercussão geral carência", "tribunais superiores sobre tempo de contribuição e carência", "tema STJ CTPS"], "resposta": "Temas do STF (Supremo Tribunal Federal) e do STJ (Superior Tribunal de Justiça) sobre tempo de contribuição, carência e CNIS (Cadastro Nacional de Informações Sociais) registrados nos catálogos da casa, com sinal ao segurado e status na data de corte (07/10/2026 a 10/11/2026, conforme a linha):\nSTJ Tema 644 (FAVORÁVEL; transitado): Empregado rural com CTPS (Carteira de Trabalho e Previdência Social) antes de 1991: o tempo conta para a carência do art. 142.\nSTJ Tema 995 (FAVORÁVEL; transitado): Cabe reafirmar a DER (data de entrada do requerimento) até a entrega da prestação jurisdicional nas instâncias ordinárias.\nSTJ Tema 1188 (ADVERSO; transitado): Sentença trabalhista homologatória de acordo só é início de prova material com elementos contemporâneos.", "fonte": "STF e STJ, temas de repercussão geral, repetitivos e controle concentrado", "origem": "catalogo-temas-vinculantes.md v1.15 §1, §2 e §7; catalogo-temas-vinculantes-2.md v1.0 §1 e §2", "sinal": "firme", "ficha": true}, {"id": "vin-a03", "tema": "STF e STJ: temas por assunto", "pergunta": "Quais temas do STF e do STJ tratam de contribuinte individual, facultativo de baixa renda e contribuição em atraso?", "variantes": ["STF contribuinte individual", "STJ contribuinte individual", "tema repetitivo contribuinte individual", "repercussão geral contribuinte individual", "tribunais superiores sobre contribuinte individual", "tema STJ contribuição em atraso"], "resposta": "Temas do STF (Supremo Tribunal Federal) e do STJ (Superior Tribunal de Justiça) sobre contribuinte individual, facultativo de baixa renda e contribuição em atraso registrados nos catálogos da casa, com sinal ao segurado e status na data de corte (07/10/2026 a 10/11/2026, conforme a linha):\nSTJ Tema 1291 (FAVORÁVEL; acórdão publicado, RE (recurso extraordinário) pendente): Contribuinte individual não cooperado tem especial após a Lei 9.032/95 se comprovar exposição, sem formulário de empresa.", "fonte": "STF e STJ, temas de repercussão geral, repetitivos e controle concentrado", "origem": "catalogo-temas-vinculantes.md v1.15 §1, §2 e §7; catalogo-temas-vinculantes-2.md v1.0 §1 e §2", "sinal": "firme", "ficha": true}, {"id": "vin-a04", "tema": "STF e STJ: temas por assunto", "pergunta": "Quais temas do STF e do STJ tratam de tempo especial em geral: PPP, laudo, EPI e permanência?", "variantes": ["STF tempo especial", "STJ tempo especial", "tema repetitivo PPP", "repercussão geral PPP", "tribunais superiores sobre tempo especial", "tema STJ EPI"], "resposta": "Temas do STF (Supremo Tribunal Federal) e do STJ (Superior Tribunal de Justiça) sobre tempo especial em geral: PPP (Perfil Profissiográfico Previdenciário), laudo, EPI (equipamento de proteção individual) e permanência registrados nos catálogos da casa, com sinal ao segurado e status na data de corte (07/10/2026 a 10/11/2026, conforme a linha):\nSTF Tema 555 (NEUTRO; transitado): EPI realmente capaz de neutralizar a nocividade afasta a especial (item I, adverso); no ruído acima do limite, a declaração de EPI eficaz no PPP não descaracteriza o tempo especial (item II, favorável).\nSTF Tema 709 (NEUTRO; transitado): Constitucional cessar a aposentadoria especial de quem continua ou volta à atividade nociva; DIB (data de início do benefício) e efeitos financeiros desde a DER (data de entrada do requerimento), cessando o pagamento após a implantação.\nSTF Tema 1107 (NEUTRO; sem RG (repercussão geral), transitado): Sem repercussão geral; a matéria fica com o STJ Tema 998 (texto não transcrito na fonte).\nADI (ação direta de inconstitucionalidade) 6309 (NEUTRO; sem trânsito, ED (embargos de declaração) pendentes): Idade mínima da aposentadoria especial da EC (Emenda Constitucional) 103 inconstitucional (favorável); vedação de conversão e cálculo de 60% mais 2 pontos constitucionais (adversos).\nSTJ Tema 534 (FAVORÁVEL; transitado): Rol de agentes nocivos é exemplificativo; eletricidade é especial após o Decreto 2.172/1997, com exposição permanente.\nSTJ Tema 998 (FAVORÁVEL; transitado): O auxílio-doença, acidentário ou previdenciário, de quem exercia atividade especial conta como tempo especial.\nSTJ Tema 1090 (NEUTRO; transitado): EPI no PPP descaracteriza em princípio o especial e o autor prova a ineficácia (adversos); dúvida sobre a eficácia favorece o autor (favorável).\nSTJ Tema 1291 (FAVORÁVEL; acórdão publicado, RE (recurso extraordinário) pendente): Contribuinte individual não cooperado tem especial após a Lei 9.032/95 se comprovar exposição, sem formulário de empresa.", "fonte": "STF e STJ, temas de repercussão geral, repetitivos e controle concentrado", "origem": "catalogo-temas-vinculantes.md v1.15 §1, §2 e §7; catalogo-temas-vinculantes-2.md v1.0 §1 e §2", "sinal": "firme", "ficha": true}, {"id": "vin-a05", "tema": "STF e STJ: temas por assunto", "pergunta": "Quais temas do STF e do STJ tratam de ruído?", "variantes": ["STF ruído", "STJ ruído", "tema repetitivo ruído", "repercussão geral ruído", "tribunais superiores sobre ruído", "tema STJ NHO-01"], "resposta": "Temas do STF (Supremo Tribunal Federal) e do STJ (Superior Tribunal de Justiça) sobre ruído registrados nos catálogos da casa, com sinal ao segurado e status na data de corte (07/10/2026 a 10/11/2026, conforme a linha):\nSTF Tema 555 (NEUTRO; transitado): EPI (equipamento de proteção individual) realmente capaz de neutralizar a nocividade afasta a especial (item I, adverso); no ruído acima do limite, a declaração de EPI eficaz no PPP (Perfil Profissiográfico Previdenciário) não descaracteriza o tempo especial (item II, favorável).\nSTJ Tema 694 (ADVERSO; transitado): Ruído: limite de 90 dB de 06/03/1997 a 18/11/2003, se
