1-11.2005.4.01.4000/PI", "origem": "doutrina-revisao.md §11.9", "sinal": "firme"}, {"id": "rev-030", "tema": "Revisão: teses mortas", "pergunta": "Meu benefício deveria subir na mesma proporção do teto?", "variantes": ["reajuste pelo teto", "benefício não acompanha o teto", "perdi valor em salários mínimos"], "resposta": "Não há base: as EC (Emendas Constitucionais) 20 e 41 reajustam o teto pelos índices dos benefícios, e não o contrário. Nenhuma tese de tribunal superior garantindo esse reajuste foi localizada em fonte oficial.", "fonte": "EC 20/1998, art. 14; EC 41/2003, art. 5º", "origem": "doutrina-revisao.md §11.9; haack-prev-revisao SKILL §8", "sinal": "controvertido"}, {"id": "rev-031", "tema": "Revisão: teses mortas", "pergunta": "Minha aposentadoria por invalidez deveria ser de 100%?", "variantes": ["incapacidade permanente 60% é inconstitucional?", "aposentadoria por invalidez integral"], "resposta": "Não, se a incapacidade foi constatada depois da reforma e não decorre do trabalho: o STF (Supremo Tribunal Federal) julgou constitucional o cálculo de 60% da média mais 2 pontos percentuais por ano acima de 20 (homem) ou 15 (mulher) (Tema 1.300, trânsito em 18/04/2026). Os 100% ficam para a incapacidade causada por acidente ou doença do trabalho.", "fonte": "STF Tema 1.300; EC 103/2019, art. 26, §§ 2º, III, e 3º, II", "origem": "haack-prev-revisao SKILL §8; parecer-de-revisao-ao-cliente.md §6", "sinal": "firme"}, {"id": "rev-032", "tema": "Revisão: na prática", "pergunta": "Pedindo revisão, o INSS pode diminuir meu benefício?", "variantes": ["risco de perder valor na revisão", "INSS reduz aposentadoria na revisão", "revisão pode piorar?"], "resposta": "Sim, há risco: na primeira revisão a pedido, o INSS (Instituto Nacional do Seguro Social) reexamina também os demais critérios da concessão. A revisão que prejudique o beneficiário só produz efeitos depois de assegurado o contraditório.", "fonte": "IN 128, arts. 584, 585, § 1º, e 588", "origem": "doutrina-revisao.md §11.7 e §11.8", "sinal": "firme"}, {"id": "rev-033", "tema": "Revisão: na prática", "pergunta": "Se o juiz der liminar e depois eu perder, devolvo o dinheiro?", "variantes": ["tutela antecipada revogada", "devolver valores da liminar"], "resposta": "Sim. Revogada a tutela antecipada, o autor devolve o que recebeu, por desconto de até 30% do benefício em manutenção (STJ (Superior Tribunal de Justiça) Tema 692).", "fonte": "STJ Tema 692 (Pet 12.482/DF)", "origem": "doutrina-revisao.md §11.9", "sinal": "firme"}, {"id": "rev-034", "tema": "Revisão: na prática", "pergunta": "Como saber se minha aposentadoria tem revisão?", "variantes": ["vale a pena revisar?", "que documento levo para ver revisão", "análise da carta de concessão"], "resposta": "Pela carta de concessão com a memória de cálculo, o histórico de créditos com a primeira prestação paga, o CNIS (Cadastro Nacional de Informações Sociais) completo com remunerações e a cópia integral do processo administrativo. Primeiro se confere o prazo de 10 anos, depois a tese e o valor da diferença.", "fonte": "Lei 8.213, art. 103, I; haack-prev-revisao, gate de insumo", "origem": "haack-prev-revisao SKILL §3 e princípio nuclear", "sinal": "firme"}, {"id": "rev-035", "tema": "Revisão: na prática", "pergunta": "Preciso pedir a revisão no INSS antes de entrar na Justiça?", "variantes": ["requerimento prévio para revisão", "ir direto ao juiz"], "resposta": "Em regra, não: a revisão pode ir direto à Justiça, salvo se depender de matéria de fato ainda não levada ao INSS (Instituto Nacional do Seguro Social), como verbas reconhecidas em ação trabalhista, caso em que o requerimento prévio é exigido (STF (Supremo Tribunal Federal) Tema 350, item III). Sem novo requerimento há menos de cinco anos, o interesse de agir se mantém, com a mesma ressalva.", "fonte": "STF Tema 350, item III; TNU PUIL 0001240-40.2021.4.03.6314/SP", "origem": "catalogo-temas-vinculantes.md (STF Tema 350, tese integral); competencia-e-rito.md §7; haack-prev-revisao SKILL §5.4; doutrina-revisao.md §11.1", "sinal": "firme"}, {"id": "rev-036", "tema": "Revisão: na prática", "pergunta": "Quanto vou receber de atrasados na revisão?", "variantes": ["valor dos atrasados", "quanto dá a revisão", "diferença acumulada"], "resposta": "A diferença mensal entre a renda devida e a paga, de cada mês não prescrito, corrigida até o cálculo. Em regra cobram-se os últimos 5 anos, e cada mês de espera pode fazer perder a parcela mais antiga. O valor só se afirma depois do cálculo sobre a carta de concessão e o CNIS (Cadastro Nacional de Informações Sociais).", "fonte": "Lei 8.213, art. 103, par. único; Súm. 85/STJ", "origem": "haack-prev-revisao SKILL §12; parecer-de-revisao-ao-cliente.md §4", "sinal": "firme"}, {"id": "adm-001", "tema": "Pedido no INSS", "pergunta": "Preciso pedir no INSS antes de entrar na Justiça?", "variantes": ["tem que passar pelo INSS primeiro", "posso processar o INSS sem pedir antes", "prévio requerimento"], "resposta": "Sim, para benefício novo é preciso requerer antes no INSS (Instituto Nacional do Seguro Social): sem o pedido e a negativa, ou sem o INSS passar do prazo legal de análise, não há interesse para a ação. Pedir não é o mesmo que esgotar todos os recursos administrativos.", "fonte": "STF Tema 350 (RE 631.240), item I", "origem": "competencia-e-rito.md §7", "sinal": "firme"}, {"id": "adm-002", "tema": "Pedido no INSS", "pergunta": "Tem caso em que posso ir direto à Justiça sem pedir no INSS?", "variantes": ["dá para pular o INSS", "quando não precisa de pedido administrativo", "revisão precisa pedir no INSS antes"], "resposta": "Sim, em duas situações: quando o INSS (Instituto Nacional do Seguro Social) tem entendimento notório e reiterado contra o pedido; e em revisão, restabelecimento ou manutenção de benefício, salvo se depender de fato que o INSS nunca analisou. Na ação acidentária, dispensa-se esgotar os recursos administrativos, não o pedido: a inicial de incapacidade exige o comprovante de indeferimento ou de não prorrogação, quando for o caso.", "fonte": "STF Tema 350, itens II e III; Súmula 89/STJ; Lei 8.213/1991, art. 129-A, II, a", "origem": "competencia-e-rito.md §7", "sinal": "firme"}, {"id": "adm-003", "tema": "Pedido no INSS", "pergunta": "Posso fazer o pedido no INSS sem documentos e completar depois na Justiça?", "variantes": ["pedir de qualquer jeito só para ter a negativa", "indeferimento forçado", "juntar os documentos só no processo"], "resposta": "Não é seguro: pelo STJ (Superior Tribunal de Justiça), o pedido precisa de documentação minimamente suficiente, e o indeferimento forçado ou a exigência ignorada podem tirar o interesse de agir; fato ou documento novo levado só ao juiz pode exigir novo requerimento, salvo documento apenas complementar. A tese do Tema 1.124 ainda não transitou em julgado.", "fonte": "STJ Tema 1.124, itens 1.1, 1.2, 1.3 e 1.6", "origem": "competencia-e-rito.md §7", "sinal": "controvertido"}, {"id": "adm-004", "tema": "Pedido no INSS", "pergunta": "O INSS pode recusar meu pedido porque falta documento?", "variantes": ["não aceitaram meu requerimento", "recusaram o protocolo", "documentação incompleta"], "resposta": "Não, documentação incompleta não autoriza o INSS (Instituto Nacional do Seguro Social) a recusar o protocolo do requerimento. O que faltar é pedido depois por carta de exigências.", "fonte": "Lei 8.213/1991, art. 105; IN PRES/INSS 128/2022, art. 566", "origem": "competencia-e-rito.md §9, item 2; pecas-administrativas.md §§2 e 3", "sinal": "firme"}, {"id": "adm-005", "tema": "Pedido no INSS", "pergunta": "Já tenho um pedido aberto no INSS, posso fazer outro igual?", "variantes": ["fazer novo pedido enquanto o outro está em análise", "pedir de novo o mesmo benefício", "novo requerimento"], "resposta": "Não enquanto o primeiro não for decidido: novo requerimento da mesma espécie só depois da decisão do anterior e do fim dos 30 dias do prazo de recurso. Revisão e benefício por incapacidade ficam fora dessa trava; na incapacidade, o novo pedido só cabe 30 dias depois da cessação ou da decisão anterior.", "fonte": "IN PRES/INSS 128/2022, arts. 576-A (red. IN 208/2026) e 346", "origem": "pecas-administrativas.md §§2 e 13; gerente-previdenciario/SKILL.md Etapa 1-B", "sinal": "firme"}, {"id": "adm-006", "tema": "Pedido no INSS", "pergunta": "Meu auxílio vai acabar, posso pedir prorrogação?", "variantes": ["prorrogar o auxílio-doença", "o benefício vai cessar", "pedido de prorrogação"], "resposta": "Sim, nos últimos 15 dias do benefício. Sem prazo fixado, o benefício cessa em 120 dias, salvo pedido de prorrogação; contra o resultado da nova avaliação cabe recurso ao CRPS (Conselho de Recursos da Previdência Social) em 30 dias.", "fonte": "IN PRES/INSS 128/2022, art. 339, § 3º (red. IN 212/2026); Lei 8.213/1991, art. 60, §§ 9º e 11", "origem": "pecas-administrativas.md §4", "sinal": "firme"}, {"id": "adm-007", "tema": "Pedido no INSS", "pergunta": "O INSS está demorando, qual o prazo para analisar meu pedido?", "variantes": ["pedido parado há meses", "quanto tempo o INSS tem para responder", "demora do INSS"], "resposta": "Pelo acordo homologado no STF (Supremo Tribunal Federal) no RE (Recurso Extraordinário) 1.171.152, contados do fim da instrução: 30 dias para salário-maternidade, 45 para benefício por incapacidade, 60 para pensão, auxílio-reclusão e auxílio-acidente, e 90 para aposentadorias e BPC (Benefício de Prestação Continuada); a perícia, em até 45 dias do agendamento, ou 90 nas unidades de difícil provimento. A vigência atual do acordo não foi confirmada; na falta dele, vale o prazo geral de 30 dias após a instrução, prorrogável.", "fonte": "RE 1.171.152 (Tema 1.066/STF, cancelado sem tese); Lei 9.784, art. 49", "origem": "competencia-e-rito.md §9 (Mora do INSS e LACUNAS)", "sinal": "controvertido"}, {"id": "adm-009", "tema": "Exigência e documento novo", "pergunta": "O INSS mandou carta de exigência, quanto tempo tenho?", "variantes": ["prazo da exigência", "INSS pediu mais documentos", "carta de exigências"], "resposta": "No mínimo 30 dias da ciência, prorrogáveis por igual período se houver pedido justificado antes do fim do prazo. Enquanto a exigência está aberta, os prazos do INSS (Instituto Nacional do Seguro Social) ficam suspensos.", "fonte": "IN PRES/INSS 128/2022, art. 566, caput, § 2º e § 9º (IN 212/2026)", "origem": "pecas-administrativas.md §3", "sinal": "firme"}, {"id": "adm-010", "tema": "Exigência e documento novo", "pergunta": "E se eu não cumprir a exigência a tempo?", "variantes": ["perdi o prazo da exigência", "não mandei os documentos pedidos", "pedido encerrado por desistência"], "resposta": "Sem cumprimento em 30 dias da ciência, o INSS (Instituto Nacional do Seguro Social) encerra o pedido sem analisar o mérito, como desistência. Dá para pedir de novo, mas com nova DER (data de entrada do requerimento), perdendo-se o período entre as duas datas.", "fonte": "IN PRES/INSS 128/2022, arts. 574, § 4º, II, 600, p.ú., e 601 (red. IN 212/2026)", "origem": "pecas-administrativas.md §3; competencia-e-rito.md §9, item 3", "sinal": "firme"}, {"id": "adm-011", "tema": "Exigência e documento novo", "pergunta": "Posso juntar documento novo depois que o INSS negou?", "variantes": ["achei um documento depois", "levar PPP no recurso", "documento novo muda a data"], "resposta": "Sim, no recurso à Junta, até a inclusão em pauta, mas documento novo apresentado só no recurso faz os efeitos financeiros contarem da data em que foi apresentado, e não da DER (data de entrada do requerimento). Documento decisivo deve ir ao INSS (Instituto Nacional do Seguro Social) o quanto antes.", "fonte": "IN PRES/INSS 128/2022, art. 582; Regimento Interno do CRPS, art. 71, § 1º", "origem": "pecas-administrativas.md §7; haack-prev-administrativo/SKILL.md §7", "sinal": "firme"}, {"id": "adm-012", "tema": "Exigência e documento novo", "pergunta": "Pedido de revisão com documento novo paga desde quando?", "variantes": ["revisão no INSS retroage", "efeito financeiro da revisão administrativa", "revisão por ação trabalhista no INSS"], "resposta": "Na revisão administrativa com elemento novo, os efeitos financeiros ficam na DPR (data do pedido de revisão), e o INSS (Instituto Nacional do Seguro Social) trata a sentença trabalhista como elemento novo. Na via judicial, a TNU (Turma Nacional de Uniformização) admite as diferenças desde a DIB (data de início do benefício).", "fonte": "IN PRES/INSS 128/2022, art. 586; Dec. 3.048/1999, art. 347, § 4º; TNU PUIL 0510156-08.2021.4.05.8300", "origem": "pecas-administrativas.md §6", "sinal": "firme"}, {"id": "adm-013", "tema": "INSS negou", "pergunta": "O INSS negou, e agora?", "variantes": ["benefício indeferido", "o que fazer depois da negativa", "recorrer ou entrar na Justiça"], "resposta": "Há três caminhos: recurso à Junta de Recursos do CRPS (Conselho de Recursos da Previdência Social) em 30 dias, novo requerimento ou ação judicial. A escolha considera o prazo do recurso, os documentos que faltaram e o fato de que ação com o mesmo pedido encerra o recurso administrativo.", "fonte": "Dec. 3.048/1999, art. 305, § 1º, II; Lei 8.213/1991, art. 126, § 3º; IN PRES/INSS 128/2022, art. 576-A", "origem": "gerente-previdenciario/SKILL.md Etapa 1-B", "sinal": "firme"}, {"id": "adm-014", "tema": "INSS negou", "pergunta": "Qual o prazo para recorrer da negativa do INSS?", "variantes": ["prazo do recurso administrativo", "30 dias para recorrer", "recurso à Junta de Recursos"], "resposta": "30 dias corridos da ciência da decisão, excluído o dia do começo e incluído o do vencimento. A ciência eletrônica se presume 5 dias após a disponibilização, mas consultar o processo antes disso antecipa o início do prazo.", "fonte": "Dec. 3.048/1999, art. 305, § 1º, II; IN PRES/INSS 128/2022, arts. 580, 597 e 599, § 1º; Regimento Interno do CRPS, arts. 77 e 80, § 1º", "origem": "pecas-administrativas.md §§7 e 13; haack-prev-administrativo/SKILL.md §3", "sinal": "firme"}, {"id": "adm-015", "tema": "INSS negou", "pergunta": "Tenho recurso no INSS e quero entrar na Justiça, pode?", "variantes": ["recurso pendente e ação ao mesmo tempo", "entrar com ação com recurso em andamento", "desistir do recurso administrativo"], "resposta": "Pode, mas a ação com o mesmo pedido equivale a renunciar ao recurso administrativo e desistir do que já foi interposto. Recurso pendente e ação com pedido idêntico não convivem.", "fonte": "Lei 8.213/1991, art. 126, § 3º; Dec. 3.048/1999, art. 307", "origem": "competencia-e-rito.md §9", "sinal": "firme"}, {"id": "adm-016", "tema": "INSS negou", "pergunta": "Quanto tempo o CRPS leva para julgar o recurso?", "variantes": ["demora do recurso administrativo", "prazo de julgamento da Junta", "INSS tem que cumprir a decisão do recurso"], "resposta": "O Regimento do CRPS (Conselho de Recursos da Previdência Social) fixa até 365 dias por instância, descontado o tempo em diligência. Decidido o recurso, o INSS (Instituto Nacional do Seguro Social) tem até 60 dias para cumprir, sem poder reduzir nem ampliar o alcance da decisão.", "fonte": "Regimento Interno do CRPS, arts. 77, §§ 5º e 6º, e 117, § 1º; Dec. 3.048/1999, art. 308, § 2º", "origem": "pecas-administrativas.md §§7 e 13", "sinal": "firme"}, {"id": "adm-017", "tema": "INSS negou", "pergunta": "Se a Junta negar, ainda dá para recorrer no INSS?", "variantes": ["recurso especial à Câmara", "segunda instância administrativa", "perdi na Junta de Recursos"], "resposta": "Sim, cabe recurso especial à Câmara de Julgamento em 30 dias, com efeito suspensivo e devolutivo. Matéria exclusivamente médica (incapacidade, auxílio-acidente, BPC (Benefício de Prestação Continuada) da pessoa com deficiência, datas de início da doença, da incapacidade e de cessação) para na Junta e não sobe.", "fonte": "Regimento Interno do CRPS, arts. 77, 89, § 3º, e 90; Dec. 3.048/1999, art. 308", "origem": "pecas-administrativas.md §9", "sinal": "firme"}, {"id": "proc-001", "tema": "Onde corre a ação", "pergunta": "Onde corre a ação contra o INSS?", "variantes": ["qual Justiça julga o INSS", "Juizado ou vara federal", "onde processar o INSS"], "resposta": "Benefício comum até 60 salários mínimos vai ao JEF (Juizado Especial Federal), que é obrigatório onde houver vara de JEF; acima disso, à vara federal comum. Se a causa é acidente do trabalho, vai à Justiça Estadual, qualquer que seja o valor.", "fonte": "Lei 10.259/2001, art. 3º, caput e § 3º; CF, art. 109, I; Súmula 15/STJ", "origem": "competencia-e-rito.md §§1 e 2", "sinal": "firme"}, {"id": "proc-003", "tema": "Onde corre a ação", "pergunta": "Passou de 60 salários, posso abrir mão do excedente para ficar no Juizado?", "variantes": ["renunciar ao que passa de 60 salários", "renúncia ao excedente", "ficar no JEF mesmo com valor alto"], "resposta": "Sim, é lícito renunciar de forma expressa ao que exceder 60 salários mínimos, incluídas até 12 parcelas vincendas, para litigar no JEF (Juizado Especial Federal). É troca de crédito por rito, decidida antes da petição inicial.", "fonte": "STJ Tema 1.030; Lei 10.259/2001, art. 3º", "origem": "competencia-e-rito.md §2", "sinal": "firme"}, {"id": "proc-005", "tema": "Onde corre a ação", "pergunta": "Acidente de trabalho contra o INSS corre onde?", "variantes": ["auxílio acidentário na Justiça", "benefício por acidente do trabalho", "doença do trabalho contra o INSS"], "resposta": "Na Justiça Estadual, nas duas instâncias e fora de qualquer Juizado, para os benefícios acidentários, a pensão por morte decorrente de acidente do trabalho e a revisão de benefício acidentário. O que define é a petição afirmar o nexo com o trabalho; ação de indenização contra o empregador é outra ação.", "fonte": "CF, art. 109, I; Súmula 15/STJ; STF Tema 414; STJ Tema 1.053; Lei 8.213/1991, art. 129, II", "origem": "competencia-e-rito.md §§1, 1-A e 5", "sinal": "firme"}, {"id": "proc-006", "tema": "Custos e advogado", "pergunta": "Preciso de advogado para entrar no Juizado Federal?", "variantes": ["posso entrar sozinho no Juizado", "advogado é obrigatório", "sem advogado contra o INSS"], "resposta": "Não no primeiro grau: no JEF (Juizado Especial Federal) a parte pode designar representante para a causa, advogado ou não. Para recorrer da sentença, a representação por advogado é obrigatória.", "fonte": "Lei 10.259/2001, art. 10; Lei 9.099/1995, art. 41, § 2º", "origem": "competencia-e-rito.md §2; Lei 10.259/2001 em disco (03_TESES/legislacao/leis)", "sinal": "firme"}, {"id": "proc-007", "tema": "Custos e advogado", "pergunta": "Tem custas para entrar no Juizado Federal?", "variantes": ["quanto custa entrar com a ação", "taxa do processo", "preciso pagar para processar o INSS"], "resposta": "Não no primeiro grau: o acesso ao JEF (Juizado Especial Federal) não depende de custas, taxas ou despesas. Para recorrer há preparo em 48 horas, que abrange as despesas dispensadas no primeiro grau, salvo para quem tem assistência judiciária gratuita.", "fonte": "Lei 9.099/1995, arts. 42, § 1º, e 54; Lei 10.259/2001, art. 1º", "origem": "competencia-e-rito.md §2; Lei 9.099/1995 em disco (03_TESES/legislacao/leis)", "sinal": "firme"}, {"id": "proc-008", "tema": "Custos e advogado", "pergunta": "Se eu perder no Juizado Federal, pago alguma coisa?", "variantes": ["perder a ação custa", "sucumbência no Juizado", "honorários do INSS se eu perder"], "resposta": "Na sentença de primeiro grau do JEF (Juizado Especial Federal), não: não há condenação em custas e honorários, salvo litigância de má-fé. Quem recorre e perde na Turma Recursal paga custas e honorários de 10% a 20% da condenação ou do valor corrigido da causa; com gratuidade, a cobrança fica suspensa.", "fonte": "Lei 9.099/1995, art. 55; CPC, art. 98, § 3º", "origem": "competencia-e-rito.md §2; Lei 9.099/1995 e CPC em disco (03_TESES/legislacao/leis)", "sinal": "firme"}, {"id": "proc-009", "tema": "Custos e advogado", "pergunta": "Se eu perder na vara federal, tenho que pagar o INSS?", "variantes": ["condenação em honorários", "perder fora do Juizado", "sucumbência com justiça gratuita"], "resposta": "Pode haver condenação, mas com gratuidade da justiça a cobrança fica suspensa: o INSS (Instituto Nacional do Seguro Social) só pode executá-la se, em até 5 anos do trânsito em julgado, provar que a falta de recursos acabou; passado esse prazo, a dívida se extingue.", "fonte": "CPC, art. 98, §§ 2º e 3º", "origem": "CPC em disco (03_TESES/legislacao/leis)", "sinal": "firme"}, {"id": "proc-010", "tema": "Custos e advogado", "pergunta": "E na ação acidentária, se eu perder?", "variantes": ["acidente de trabalho perder a ação", "custas na ação acidentária", "isenção do segurado"], "resposta": "O autor da ação acidentária é isento de custas e de verbas de sucumbência; a isenção é do segurado, não do INSS (Instituto Nacional do Seguro Social). Os honorários periciais são antecipados pelo INSS e, se o autor isento perder, ficam a cargo do Estado.", "fonte": "Lei 8.213/1991, art. 129, p.ú.; Súmula 110/STJ; Lei 13.876/2019, art. 1º, § 7º, II; STJ Tema 1.044", "origem": "competencia-e-rito.md §§5 e 6", "sinal": "firme"}, {"id": "proc-012", "tema": "Custos e advogado", "pergunta": "Vai ter perícia na ação?", "variantes": ["perícia judicial", "médico do juiz", "como provar a incapacidade"], "resposta": "Em benefício por incapacidade, sim: a incapacidade se prova por laudo, e sem laudo o caminho é pedir perícia judicial. A petição precisa descrever a doença, as limitações, a atividade, as falhas da perícia do INSS (Instituto Nacional do Seguro Social) e se houve ação anterior, com o indeferimento ou a não prorrogação e a documentação médica.", "fonte": "Lei 8.213/1991, art. 129-A", "origem": "gerente-previdenciario/SKILL.md Etapa 3 (Perícia); competencia-e-rito.md §5", "sinal": "firme"}, {"id": "proc-013", "tema": "Andamento da ação", "pergunta": "O INSS pode recorrer da sentença? Em quanto tempo?", "variantes": ["prazo do recurso do INSS", "INSS vai recorrer", "o INSS tem prazo maior"], "resposta": "Sim. No JEF (Juizado Especial Federal), o recurso contra a sentença é de 10 dias úteis, sem prazo maior para o INSS (Instituto Nacional do Seguro Social); na vara federal, na estadual delegada e na acidentária, a apelação é de 15 dias úteis, em dobro para o INSS.", "fonte": "Lei 9.099/1995, arts. 12-A e 42; Lei 10.259/2001, art. 9º; CPC, arts. 183, 219 e 1.003, § 5º", "origem": "competencia-e-rito.md §§1 e 7-A; prazos-recursais.md (a) e (b)", "sinal": "firme"}, {"id": "proc-014", "tema": "Andamento da ação", "pergunta": "Perdi na sentença, posso recorrer?", "variantes": ["recorrer da sentença", "prazo para recorrer na Justiça", "quem julga o recurso"], "resposta": "Sim: no JEF (Juizado Especial Federal), recurso à Turma Recursal em 10 dias úteis da ciência da sentença, com advogado obrigatório; na vara federal ou estadual delegada, apelação ao TRF (Tribunal Regional Federal) em 15 dias úteis; na acidentária, apelação ao TJ (Tribunal de Justiça).", "fonte": "Lei 9.099/1995, arts. 12-A, 41, § 2º, e 42; Lei 10.259/2001, art. 21; CPC, art. 1.003, § 5º; CF, art. 109, § 4º", "origem": "competencia-e-rito.md §§1 e 2", "sinal": "firme"}, {"id": "proc-015", "tema": "Andamento da ação", "pergunta": "Posso pedir para receber já, antes da sentença?", "variantes": ["liminar", "tutela de urgência", "tutela antecipada para implantar o benefício"], "resposta": "Sim, por tutela de urgência, concedida quando há elementos que mostrem a probabilidade do direito e perigo de dano ou risco ao resultado útil do processo. Concedida, o benefício é implantado e pago mês a mês antes da sentença.", "fonte": "CPC, art. 300", "origem": "CPC em disco (03_TESES/legislacao/leis); honorarios-contratuais.md §2", "sinal": "firme"}, {"id": "proc-017", "tema": "Atrasados e pagamento", "pergunta": "Ganhei, quando recebo os atrasados?", "variantes": ["quando sai o dinheiro", "pagamento depois do trânsito em julgado", "RPV ou precatório"], "resposta": "No JEF (Juizado Especial Federal), depois do trânsito em julgado, por RPV (requisição de pequeno valor), paga em 60 dias da entrega da requisição, sem precatório. Acima de 60 salários mínimos, o pagamento é por precatório, salvo renúncia ao excedente.", "fonte": "Lei 10.259/2001, art. 17, caput, §§ 1º e 4º", "origem": "competencia-e-rito.md §2 (Pagamento)", "sinal": "firme"}, {"id": "proc-018", "tema": "Atrasados e pagamento", "pergunta": "Qual o limite da RPV?", "variantes": ["teto da requisição de pequeno valor", "até quanto sai por RPV", "dividir o valor para receber mais rápido"], "resposta": "Na Justiça Federal, a RPV (requisição de pequeno valor) tem o mesmo limite de 60 salários mínimos da competência do JEF (Juizado Especial Federal). É vedado fracionar a execução para receber parte por RPV e parte por precatório, e quem passa do limite pode renunciar ao excedente para receber por RPV.", "fonte": "Lei 10.259/2001, art. 17, §§ 1º, 3º e 4º", "origem": "competencia-e-rito.md §2 (Pagamento)", "sinal": "firme"}, {"id": "proc-019", "tema": "Atrasados e pagamento", "pergunta": "Quando o benefício passa a ser pago depois que ganho a ação?", "variantes": ["implantação do benefício", "quando entra na conta todo mês", "INSS implantar"], "resposta": "No JEF (Juizado Especial Federal), a implantação do benefício mensal é obrigação de fazer, cumprida por ofício do juiz ao INSS (Instituto Nacional do Seguro Social), com o trânsito em julgado; antes disso, só com tutela de urgência.", "fonte": "Lei 10.259/2001, art. 16; CPC, art. 300", "origem": "Lei 10.259/2001 e CPC em disco (03_TESES/legislacao/leis)", "sinal": "firme"}, {"id": "proc-020", "tema": "Atrasados e pagamento", "pergunta": "Desde quando contam os atrasados?", "variantes": ["retroativo desde quando", "data de início do benefício na sentença", "atrasados desde o pedido"], "resposta": "Com as mesmas provas do processo administrativo, desde a DER (data de entrada do requerimento) ou da data posterior em que os requisitos foram cumpridos; prova que só surgiu em juízo por impossibilidade material, como perícia ou PPP (perfil profissiográfico previdenciário) novo, leva o início à citação. Sempre respeitada a prescrição de 5 anos, e a tese do STJ (Superior Tribunal de Justiça) Tema 1.124 ainda não transitou em julgado.", "fonte": "STJ Tema 1.124; Lei 8.213/1991, art. 103, p.ú.", "origem": "doutrina-previdenciaria.md §3-A; competencia-e-rito.md §7", "sinal": "controvertido"}, {"id": "proc-021", "tema": "Atrasados e pagamento", "pergunta": "Perco alguma coisa se demorar para entrar com a ação?", "variantes": ["prescrição de 5 anos", "atrasados de mais de cinco anos", "demorei para processar"], "resposta": "Sim, parcelas: prescrevem as prestações vencidas antes dos 5 anos anteriores ao ajuizamento. O direito ao benefício negado, cancelado ou cessado não se perde pelo tempo, e a prescrição não corre contra menores, incapazes e ausentes.", "fonte": "Lei 8.213/1991, art. 103, p.ú.; Súmula 85/STJ; ADI 6.096", "origem": "competencia-e-rito.md §8", "sinal": "firme"}, {"id": "proc-023", "tema": "Atrasados e pagamento", "pergunta": "Tenho benefício há muitos anos, ainda posso revisar?", "variantes": ["prazo para revisão", "decadência de 10 anos", "revisar aposentadoria antiga"], "resposta": "O prazo para revisar o ato de concessão é de 10 anos, contados do primeiro dia do mês seguinte ao recebimento da primeira prestação, inclusive sobre ponto que o INSS (Instituto Nacional do Seguro Social) não analisou. Para benefício negado, cancelado ou cessado não corre esse prazo de decadência; se o pedido administrativo de revisão segura o prazo está em julgamento no STJ (Superior Tribunal de Justiça), Tema 1.370, sem tese.", "fonte": "Lei 8.213/1991, art. 103; STF Tema 313; STJ Tema 975; ADI 6.096; STJ Tema 1.370", "origem": "competencia-e-rito.md §8; pecas-administrativas.md §6", "sinal": "controvertido"}, {"id": "proc-024", "tema": "Atrasados e pagamento", "pergunta": "Como os atrasados são corrigidos?", "variantes": ["correção monetária dos atrasados", "qual índice corrige", "SELIC ou INPC"], "resposta": "Pelo Manual de Cálculos da Justiça Federal, conforme a competência de cada parcela: INPC (Índice Nacional de Preços ao Consumidor) para parcelas de 09/2006 a 11/2021, SELIC (Sistema Especial de Liquidação e de Custódia) como índice único de 12/2021 a 08/2025 e, desde 09/2025, INPC com taxa legal. O regime desde 09/2025 não tem norma expressa e pode mudar.", "fonte": "Lei 8.213/1991, art. 41-A; STF Tema 810; EC 113/2021, art. 3º; Manual de Cálculos da JF, 4.3.1.1 e 4.3.2", "origem": "doutrina-previdenciaria.md §4 (Correção e juros)", "sinal": "controvertido"}, {"id": "proc-025", "tema": "Atrasados e pagamento", "pergunta": "Desde quando correm os juros dos atrasados?", "variantes": ["juros de mora", "juros desde a citação", "correção até o pagamento"], "resposta": "Os juros de mora correm desde a citação do INSS (Instituto Nacional do Seguro Social). Da expedição da RPV (requisição de pequeno valor) ou do precatório até o pagamento, a correção é pelo IPCA (Índice Nacional de Preços ao Consumidor Amplo), com juros de 2% ao ano simples, limitados à SELIC (Sistema Especial de Liquidação e de Custódia).", "fonte": "Súmula 204/STJ; EC 113/2021, art. 3º, red. EC 136/2025", "origem": "doutrina-previdenciaria.md §4 (Correção e juros)", "sinal": "firme"}, {"id": "doc-001", "tema": "Documentos do caso", "pergunta": "Que documentos trago para pedir aposentadoria?", "variantes": ["documentos para aposentadoria", "o que levar na consulta", "papelada da aposentadoria"], "resposta": "CNIS (Cadastro Nacional de Informações Sociais), carteiras de trabalho e documento de vínculo que não esteja no CNIS; para tempo especial, PPP (perfil profissiográfico previdenciário) ou LTCAT (laudo técnico das condições ambientais do trabalho) do período; se já houve pedido, a carta de indeferimento e a cópia do processo administrativo.", "fonte": "Lei 8.213/1991, art. 55, § 3º; IN PRES/INSS 128/2022, art. 274", "origem": "gerente-previdenciario/SKILL.md Etapa 1; roteiro-de-calculo.md §1", "sinal": "firme"}, {"id": "doc-002", "tema": "Documentos do caso", "pergunta": "Que documentos trago para auxílio por incapacidade?", "variantes": ["documentos para auxílio-doença", "laudos médicos", "benefício por doença"], "resposta": "Laudos e documentação médica com a data de início da incapacidade e as limitações, resultado da perícia do INSS (Instituto Nacional do Seguro Social), carta do benefício anterior e comunicação de cessação, CNIS (Cadastro Nacional de Informações Sociais) e, se for acidente de trabalho, a CAT (Comunicação de Acidente de Trabalho) ou decisão que reconheça o nexo.", "fonte": "Lei 8.213/1991, arts. 60 e 129-A", "origem": "gerente-previdenciario/SKILL.md Etapa 1; roteiro-de-calculo.md §6", "sinal": "firme"}, {"id": "doc-003", "tema": "Documentos do caso", "pergunta": "Que documentos trago para pensão por morte?", "variantes": ["documentos para pensão", "marido faleceu", "provar união estável"], "resposta": "Certidão de óbito; prova da qualidade de segurado do falecido (carta de aposentadoria ou CNIS (Cadastro Nacional de Informações Sociais)); certidão de nascimento ou casamento de cada dependente; na união estável, duas provas materiais, uma delas de até 24 meses antes do óbito; para ex-cônjuge, a decisão de alimentos.", "fonte": "Lei 8.213/1991, arts. 16, § 5º, e 76; IN PRES/INSS 128/2022, art. 180", "origem": "pecas-administrativas.md §2-A; gerente-previdenciario/SKILL.md Etapa 1", "sinal": "firme"}, {"id": "doc-004", "tema": "Documentos do caso", "pergunta": "Tem prazo para pedir a pensão e receber desde o óbito?", "variantes": ["pensão retroativa à data do óbito", "prazo para requerer pensão", "90 ou 180 dias"], "resposta": "Sim: 180 dias do óbito para filhos menores de 16 anos e 90 dias para os demais dependentes, para que os efeitos contem desde o óbito.", "fonte": "Lei 8.213/1991, art. 74, I e II", "origem": "pecas-administrativas.md §2-A", "sinal": "firme"}, {"id": "doc-005", "tema": "Documentos do caso", "pergunta": "Que documentos trago para o BPC (LOAS)?", "variantes": ["documentos para LOAS", "benefício assistencial", "BPC do idoso ou deficiente"], "resposta": "CPF (Cadastro de Pessoas Físicas), CadÚnico (Cadastro Único para Programas Sociais) atualizado há no máximo 24 meses e registro biométrico; quem mora sob o mesmo teto e a renda de cada um; comprovantes de gastos de saúde não fornecidos pelo poder público; na deficiência, documentação médica para a avaliação. BPC é o Benefício de Prestação Continuada e LOAS, a Lei Orgânica da Assistência Social.", "fonte": "Lei 8.742/1993, art. 20, §§ 12, 12-A e 12-B; Portaria Conjunta MDS/INSS 34/2025, arts. 7º e 8º", "origem": "pecas-administrativas.md §2-A; gerente-previdenciario/SKILL.md Etapa 1", "sinal": "firme"}, {"id": "doc-006", "tema": "Documentos do caso", "pergunta": "Que documentos trago para aposentadoria rural?", "variantes": ["provar trabalho na roça", "documentos de agricultor", "segurado especial"], "resposta": "Por ano do período, documentos como contrato de arrendamento, parceria ou comodato, DAP (Declaração de Aptidão ao Pronaf), bloco de notas do produtor e notas fiscais de entrada emitidas pelo comprador da produção, com o segurado como vendedor; autodeclaração ratificada para atividade até 31/12/2022 e, desde 01/01/2023, o cadastro de segurado especial no CNIS (Cadastro Nacional de Informações Sociais). Testemunha só complementa o documento.", "fonte": "Lei 8.213/1991, arts. 38-B, 55, § 3º, e 106", "origem": "pecas-administrativas.md §2; gerente-previdenciario/SKILL.md Etapa 1", "sinal": "firme"}, {"id": "doc-007", "tema": "Documentos do caso", "pergunta": "Que documentos trago para revisar meu benefício?", "variantes": ["documentos para revisão", "carta de concessão", "revisão por ação trabalhista"], "resposta": "Carta de concessão e relação dos salários de contribuição do período de cálculo. Na revisão por ação trabalhista, inteiro teor da sentença, certidão de trânsito em julgado, planilha de cálculos homologada e a prova material da época que houver nos autos trabalhistas, porque acordo homologado sem esses elementos não vale como início de prova.", "fonte": "IN PRES/INSS 128/2022, art. 172, § 1º; Dec. 3.048/1999, art. 144, p.ú.; STJ Tema 1.188", "origem": "pecas-administrativas.md §6; roteiro-de-calculo.md §§8 e 9", "sinal": "firme"}, {"id": "doc-008", "tema": "Documentos do caso", "pergunta": "Testemunha serve para provar tempo de trabalho?", "variantes": ["só tenho testemunhas", "prova testemunhal", "não tenho documento do período"], "resposta": "Não sozinha: tempo de serviço exige início de prova material contemporânea, e a prova exclusivamente testemunhal é vedada. A testemunha complementa o documento.", "fonte": "Lei 8.213/1991, art. 55, § 3º; Súmula 149/STJ", "origem": "pecas-administrativas.md §2; gerente-previdenciario/SKILL.md Etapa 3", "sinal": "firme"}, {"id": "doc-009", "tema": "Documentos do caso", "pergunta": "Meu CNIS está errado, dá para corrigir?", "variantes": ["vínculo faltando no CNIS", "salário errado no extrato", "retificar CNIS"], "resposta": "Sim, a qualquer tempo, mesmo sem pedir benefício. O INSS (Instituto Nacional do Seguro Social) tem até 180 dias para fornecer as informações e cabe recurso ao CRPS (Conselho de Recursos da Previdência Social); dado lançado fora de época no CNIS (Cadastro Nacional de Informações Sociais) só vale com documento que o corrobore.", "fonte": "Lei 8.213/1991, arts. 29-A, §§ 1º a 3º, e 126, III; Dec. 3.048/1999, art. 19", "origem": "pecas-administrativas.md §5; competencia-e-rito.md §9, item 1", "sinal": "firme"}, {"id": "port-001", "tema": "Meu INSS e procuração", "pergunta": "Como entro no Meu INSS?", "variantes": ["acessar o Meu INSS", "login gov.br", "entrar no aplicativo do INSS"], "resposta": "Na página do Meu INSS (Instituto Nacional do Seguro Social), clicar em 'Entrar com gov.br', informar o CPF (Cadastro de Pessoas Físicas), seguir em 'Continuar', digitar a senha e clicar em 'Entrar'.", "fonte": "Passo a passo oficial do Meu INSS (05/2025)", "origem": "meu-inss.md §1", "sinal": "firme"}, {"id": "port-003", "tema": "Meu INSS e procuração", "pergunta": "O advogado pode usar minha senha gov.br?", "variantes": ["passar a senha para o advogado", "advogado entrar na minha conta", "compartilhar senha"], "resposta": "Não: o advogado não usa a senha gov.br do cliente, prática que a OAB (Ordem dos Advogados do Brasil) considera insegura. Para consulta, o caminho é a procuração eletrônica; para requerer, o advogado usa o próprio acesso ao INSS (Instituto Nacional do Seguro Social) Digital, com certificado digital e autenticação de dois fatores.", "fonte": "Orientação OAB de 25/05/2026; Plano de Trabalho INSS/OAB-RS, itens 8.1 e 9.6, V", "origem": "haack-prev-portais/SKILL.md §1; inss-digital.md §§2 e 6", "sinal": "firme"}, {"id": "port-004", "tema": "Meu INSS e procuração", "pergunta": "Como faço a procuração eletrônica para o advogado?", "variantes": ["procuração no gov.br", "dar acesso ao advogado no Meu INSS", "cadastrar procurador"], "resposta": "O segurado faz só no site gov.br, não no aplicativo: 'Procurações Eletrônicas', 'Cadastrar Procuração', seus dados e os do advogado, data inicial e final (até 5 anos), serviços 23392 e 23393 do Meu INSS (Instituto Nacional do Seguro Social), 'Pré-visualizar Procuração', 'Assinar Procuração' e confirmação por código enviado por SMS (mensagem de texto) ao celular.", "fonte": "Procuração eletrônica, manual do INSS (04/2026)", "origem": "meu-inss.md §7", "sinal": "firme"}, {"id": "port-005", "tema": "Meu INSS e procuração", "pergunta": "A procuração eletrônica serve para o advogado pedir o benefício?", "variantes": ["procuração eletrônica protocola pedido", "limites da procuração do gov.br", "imprimir a procuração eletrônica"], "resposta": "Não, ela só permite consultar pedidos, extratos, documentos e benefícios, sem alteração cadastral nem novo requerimento, e impressa ou em PDF (Portable Document Format) não vale como procuração. Exige conta gov.br prata ou ouro dos dois e verificação em duas etapas do advogado; o segurado pode revogá-la a qualquer momento.", "fonte": "Procuração eletrônica, manual do INSS (04/2026); orientação OAB de 25/05/2026", "origem": "meu-inss.md §7; haack-prev-portais/SKILL.md §1", "sinal": "firme"}, {"id": "port-006", "tema": "Meu INSS e procuração", "pergunta": "O que o advogado precisa para pedir no INSS por mim?", "variantes": ["termo de representação", "procuração para o INSS", "documento para o advogado protocolar"], "resposta": "Termo de representação do Anexo V do acordo entre INSS (Instituto Nacional do Seguro Social) e OAB/RS (Ordem dos Advogados do Brasil, Seccional do Rio Grande do Sul), um por requerimento e com o serviço marcado, ou procuração com fins específicos; procuração com amplos poderes é vedada. Menor ou incapaz tem modelo próprio.", "fonte": "ACT INSS/OAB-RS, cláusula primeira, subcláusula segunda", "origem": "documentos-e-atalho.md §1; haack-prev-portais/SKILL.md §2", "sinal": "firme"}, {"id": "port-007", "tema": "Meu INSS e procuração", "pergunta": "Como acompanho meu pedido no Meu INSS?", "variantes": ["ver andamento do pedido", "consultar pedido", "situação do requerimento"], "resposta": "Em 'Consultar Pedidos', localizar o pedido e clicar em 'Detalhar'; a situação aparece como Em Análise, Concluído, Em Exigência ou Cancelado. Abrir a decisão ou a exigência pode dar início ao prazo, então anote a data antes de abrir.", "fonte": "Passo a passo oficial do Meu INSS (05/2025); Regimento Interno do CRPS, art. 80, § 1º", "origem": "meu-inss.md §5; haack-prev-portais/SKILL.md §5, item 9", "sinal": "firme"}, {"id": "port-008", "tema": "Meu INSS e procuração", "pergunta": "Como cumpro a exigência pelo Meu INSS?", "variantes": ["responder exigência no aplicativo", "anexar documento no Meu INSS", "pedido em exigência"], "resposta": "O INSS (Instituto Nacional do Seguro Social) avisa por SMS (mensagem de texto) ou e-mail, e o pedido aparece como 'Em Exigência' em 'Consultar Pedidos'. Os roteiros oficiais para cumprir divergem ('Cumprimento de exigência' ou 'Agendamentos/Solicitações'), por isso o botão deve ser conferido na tela.", "fonte": "Notícias do INSS atualizadas em 10/2026; manual do Meu INSS (11/2025)", "origem": "meu-inss.md §6", "sinal": "controvertido"}, {"id": "port-009", "tema": "Meu INSS e procuração", "pergunta": "Como consigo a cópia do processo administrativo?", "variantes": ["cópia do processo do INSS", "baixar o processo", "processo administrativo completo"], "resposta": "Pelo advogado, no INSS (Instituto Nacional do Seguro Social) Digital: 'Detalhar Requerimento', aba 'DETALHAMENTO', 'BAIXAR PROCESSO'; ali só aparecem os pedidos feitos pela entidade. Pedido feito por outro canal se consulta pelo Meu INSS ou pela Central 135.", "fonte": "Guia Prático Entidades Parceiras, INSS (06/2023)", "origem": "inss-digital.md §4", "sinal": "firme"}, {"id": "port-010", "tema": "Meu INSS e procuração", "pergunta": "Qual o tamanho máximo dos documentos que mando ao INSS?", "variantes": ["limite de arquivo", "arquivo grande demais", "foto ou cópia simples vale"], "resposta": "Até 5 MB (megabytes) por documento e 50 MB no total, nos dois portais, em .pdf, .jpg, .jpeg, .png ou .bmp. Vale cópia simples, sem autenticação, digitalizada ou fotografada, desde que inteira, legível, colorida e com verso; documento ilegível é desconsiderado e gera exigência.", "fonte": "Plano de Trabalho INSS/OAB-RS, itens 8.2, III, 8.3, 8.5 e 8.5.1; manuais do INSS (06/2023 e 11/2025)", "origem": "documentos-e-atalho.md §1; meu-inss.md §8", "sinal": "firme"}, {"id": "port-011", "tema": "Meu INSS e procuração", "pergunta": "Pedi aposentadoria rural no Meu INSS, já acabou?", "variantes": ["autodeclaração rural", "pedido rural feito com sucesso", "adiar autodeclaração"], "resposta": "Não: depois de 'Pedido feito com sucesso' ainda é preciso informar a categoria da atividade e preencher a autodeclaração. Quem adia tem 30 dias, e o benefício pode ser negado por falta dos dados.", "fonte": "Passo a passo oficial do INSS, aposentadoria por idade rural (04/2025)", "origem": "meu-inss.md §4", "sinal": "firme"}, {"id": "anx-001", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Quais agentes ou atividades dão aposentadoria especial com 15 anos?", "variantes": ["15 anos de exposição", "especial de 15 anos", "mina subsolo", "mineiro", "quais agentes exigem 15 anos"], "resposta": "Só um enquadramento: trabalho permanente no subsolo de mineração subterrânea, em frente de produção (código 4.0.2 do Anexo IV do Decreto 3.048/1999). Nenhum agente químico, físico ou biológico isolado é de 15 anos.", "fonte": "Decreto 3.048/1999, Anexo IV, código 4.0.2", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-002", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Quais agentes ou atividades dão aposentadoria especial com 20 anos?", "variantes": ["20 anos de exposição", "especial de 20 anos", "amianto", "asbesto", "mineração afastada da frente de produção"], "resposta": "Dois enquadramentos: asbesto, o amianto (código 1.0.2: extração, processamento e manipulação de rochas amiantíferas; fabricação de guarnições para freios, embreagens e materiais isolantes com asbesto; fabricação de fibrocimento; mistura, cardagem, fiação e tecelagem de fibras de asbesto); e mineração subterrânea em atividade afastada das frentes de produção (código 4.0.1).", "fonte": "Decreto 3.048/1999, Anexo IV, códigos 1.0.2 e 4.0.1", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-003", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Quais agentes dão aposentadoria especial com 25 anos?", "variantes": ["25 anos de exposição", "especial de 25 anos", "lista de agentes nocivos", "quais são os agentes nocivos"], "resposta": "Todos os demais agentes do Anexo IV do Decreto 3.048/1999.\n- Químicos: arsênio e seus compostos; benzeno e seus compostos tóxicos; berílio e seus compostos tóxicos; bromo e seus compostos tóxicos; cádmio e seus compostos tóxicos; carvão mineral e seus derivados; chumbo e seus compostos tóxicos; cloro e seus compostos tóxicos; cromo e seus compostos tóxicos; dissulfeto de carbono; fósforo e seus compostos tóxicos; iodo; manganês e seus compostos; mercúrio e seus compostos; níquel e seus compostos tóxicos; petróleo, xisto betuminoso, gás natural e seus derivados; sílica livre; outras substâncias químicas (estireno, butadieno, acrilonitrila, aminas aromáticas, óxido de etileno, creosoto e demais do código 1.0.19).\n- Físicos: ruído; vibrações; radiações ionizantes; temperaturas anormais (calor); pressão atmosférica anormal.\n- Biológicos: micro-organismos e parasitas infectocontagiosos vivos e suas toxinas.\nFicam fora dos 25 anos só o asbesto (20 anos) e a mineração subterrânea (20 anos afastada da frente de produção; 15 anos na frente de produção).", "fonte": "Decreto 3.048/1999, Anexo IV, códigos 1.0.1 a 3.0.1", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-004", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Qual o tempo de exposição de cada agente nocivo: 15, 20 ou 25 anos?", "variantes": ["tabela de tempo por agente", "tempo de exposição por agente", "15 20 25 anos", "quanto tempo precisa de exposição"], "resposta": "15 anos: mineração subterrânea em frente de produção. 20 anos: asbesto (amianto) e mineração subterrânea afastada das frentes de produção. 25 anos: todos os outros agentes químicos (arsênio, benzeno, chumbo, cromo, mercúrio, sílica, petróleo e derivados e os demais), os físicos (ruído, vibrações, radiações ionizantes, calor, pressão anormal) e os biológicos.", "fonte": "Decreto 3.048/1999, Anexo IV", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-005", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Quais são os agentes químicos que dão direito a tempo especial?", "variantes": ["lista de agentes químicos", "produto químico", "químicos do anexo IV"], "resposta": "São 19 códigos no Anexo IV do Decreto 3.048/1999: arsênio e seus compostos; asbesto (amianto); benzeno e seus compostos tóxicos; berílio e seus compostos tóxicos; bromo e seus compostos tóxicos; cádmio e seus compostos tóxicos; carvão mineral e seus derivados; chumbo e seus compostos tóxicos; cloro e seus compostos tóxicos; cromo e seus compostos tóxicos; dissulfeto de carbono; fósforo e seus compostos tóxicos; iodo; manganês e seus compostos; mercúrio e seus compostos; níquel e seus compostos tóxicos; petróleo, xisto betuminoso, gás natural e seus derivados; sílica livre; outras substâncias químicas (estireno, butadieno, acrilonitrila, aminas aromáticas, óxido de etileno, creosoto e demais do código 1.0.19). Todos são de 25 anos, salvo o asbesto, de 20. Pelo anexo, o direito depende de exposição em nível de concentração superior aos limites de tolerância estabelecidos.", "fonte": "Decreto 3.048/1999, Anexo IV, códigos 1.0.0 a 1.0.19 (red. Decreto 3.265/1999)", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-006", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Quais são os agentes físicos que dão direito a tempo especial?", "variantes": ["lista de agentes físicos", "ruído calor vibração radiação", "físicos do anexo IV"], "resposta": "São cinco no Anexo IV do Decreto 3.048/1999, todos de 25 anos: ruído, com NEN (Nível de Exposição Normalizado) superior a 85 dB(A); vibrações, em trabalhos com perfuratrizes e marteletes pneumáticos; radiações ionizantes; temperaturas anormais, que é o calor acima dos limites da NR-15 (Norma Regulamentadora 15); e pressão atmosférica anormal, em caixões ou câmaras hiperbáricas, tubulões ou túneis sob ar comprimido e mergulho. Frio, umidade e eletricidade não constam da lista atual do anexo.", "fonte": "Decreto 3.048/1999, Anexo IV, códigos 2.0.0 a 2.0.5", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-007", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Estou exposto a mais de um agente nocivo. Qual tempo vale?", "variantes": ["dois agentes", "associação de agentes", "mais de um agente", "ruído e químico juntos"], "resposta": "Vale o do agente que exigir menor tempo de exposição, desde que os agentes associados estejam acima do nível de tolerância. A associação típica do anexo é a mineração subterrânea: 15 anos na frente de produção e 20 anos afastada dela.", "fonte": "Decreto 3.048/1999, Anexo IV, código 4.0.0 (red. Decreto 4.882/2003), 4.0.1 e 4.0.2", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-008", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "A lista de agentes nocivos do decreto é fechada?", "variantes": ["rol taxativo", "rol exaustivo", "agente fora da lista", "atividade que não está na lista"], "resposta": "Pelo regulamento, o rol de agentes é exaustivo e as atividades listadas são só exemplos: basta a exposição ao agente, mesmo em atividade não citada. Em juízo, a TNU (Turma Nacional de Uniformização), no Tema 205, trata o rol como exemplificativo, admitindo agente fora da lista com prova de risco superior ao geral.", "fonte": "Decreto 3.048/1999, Anexo IV, código 1.0.0 (red. Decreto 3.265/1999); TNU Tema 205, item a", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "controvertido"}, {"id": "anx-009", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Exposição a arsênio e seus compostos dá aposentadoria especial? Em quantos anos?", "variantes": ["arsênico", "arsina", "inseticida com arsênio", "trabalhei com arsênico"], "resposta": "Sim, em 25 anos de exposição. Consta do Anexo IV do Decreto 3.048/1999, código 1.0.1: arsênio e seus compostos. Atividades exemplificativas do anexo: a) extração de arsênio e seus compostos tóxicos; b) metalurgia de minérios arsenicais; c) utilização de hidrogênio arseniado (arsina) em sínteses orgânicas e no processamento de componentes eletrônicos; d) fabricação e preparação de tintas e lacas; e) fabricação, preparação e aplicação de inseticidas, herbicidas, parasiticidas e raticidas com a utilização de compostos de arsênio; f) produção de vidros, ligas de chumbo e medicamentos com a utilização de compostos de arsênio; g) conservação e curtume de peles, tratamento e preservação da madeira com a utilização de compostos de arsênio.", "fonte": "Decreto 3.048/1999, Anexo IV, código 1.0.1", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-010", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Exposição a asbesto (amianto) dá aposentadoria especial? Em quantos anos?", "variantes": ["amianto", "fibrocimento", "telha de amianto", "lona de freio", "trabalhei com amianto"], "resposta": "Sim, em 20 anos de exposição. Consta do Anexo IV do Decreto 3.048/1999, código 1.0.2: asbesto (amianto). Atividades exemplificativas do anexo: a) extração, processamento e manipulação de rochas amiantíferas; b) fabricação de guarnições para freios, embreagens e materiais isolantes contendo asbestos; c) fabricação de produtos de fibrocimento; d) mistura, cardagem, fiação e tecelagem de fibras de asbestos.", "fonte": "Decreto 3.048/1999, Anexo IV, código 1.0.2", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-011", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Exposição a benzeno e seus compostos tóxicos dá aposentadoria especial? Em quantos anos?", "variantes": ["benzeno", "cola", "tinta", "verniz", "solvente", "borracha", "pneu", "borracheiro", "trabalhei com benzeno"], "resposta": "Sim, em 25 anos de exposição. Consta do Anexo IV do Decreto 3.048/1999, código 1.0.3: benzeno e seus compostos tóxicos. Atividades exemplificativas do anexo: a) produção e processamento de benzeno; b) utilização de benzeno como matéria-prima em sínteses orgânicas e na produção de derivados; c) utilização de benzeno como insumo na extração de óleos vegetais e álcoois; d) utilização de produtos que contenham benzeno, como colas, tintas, vernizes, produtos gráficos e solventes; e) produção e utilização de clorobenzenos e derivados; f) fabricação e vulcanização de artefatos de borracha; g) fabricação e recauchutagem de pneumáticos.", "fonte": "Decreto 3.048/1999, Anexo IV, código 1.0.3", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-012", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Exposição a berílio e seus compostos tóxicos dá aposentadoria especial? Em quantos anos?", "variantes": ["berílio", "tubo fluorescente", "ampola de raio X", "trabalhei com berílio"], "resposta": "Sim, em 25 anos de exposição. Consta do Anexo IV do Decreto 3.048/1999, código 1.0.4: berílio e seus compostos tóxicos. Atividades exemplificativas do anexo: a) extração, trituração e tratamento de berílio; b) fabricação de compostos e ligas de berílio; c) fabricação de tubos fluorescentes e de ampolas de raio X; d) fabricação de queim f) utilização do berílio na indústria aeroespacial. O texto do Planalto traz esse código com trecho truncado entre as alíneas d e f.", "fonte": "Decreto 3.048/1999, Anexo IV, código 1.0.4", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-013", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Exposição a bromo e seus compostos tóxicos dá aposentadoria especial? Em quantos anos?", "variantes": ["bromo", "ácido brômico", "trabalhei com bromo"], "resposta": "Sim, em 25 anos de exposição. Consta do Anexo IV do Decreto 3.048/1999, código 1.0.5: bromo e seus compostos tóxicos. Atividades exemplificativas do anexo: a) fabricação e emprego do bromo e do ácido brômico.", "fonte": "Decreto 3.048/1999, Anexo IV, código 1.0.5", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-014", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Exposição a cádmio e seus compostos tóxicos dá aposentadoria especial? Em quantos anos?", "variantes": ["cádmio", "solda", "bateria", "galvanoplastia", "trabalhei com cádmio"], "resposta": "Sim, em 25 anos de exposição. Consta do Anexo IV do Decreto 3.048/1999, código 1.0.6: cádmio e seus compostos tóxicos. Atividades exemplificativas do anexo: a) extração, tratamento e preparação de ligas de cádmio; b) fabricação de compostos de cádmio; c) utilização de eletrodos de cádmio em soldas; d) utilização de cádmio no revestimento eletrolítico de metais; e) utilização de cádmio como pigmento e estabilizador na indústria do plástico; f) fabricação de eletrodos de baterias alcalinas de níquel-cádmio.", "fonte": "Decreto 3.048/1999, Anexo IV, código 1.0.6", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-015", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Exposição a carvão mineral e seus derivados dá aposentadoria especial? Em quantos anos?", "variantes": ["carvão", "piche", "alcatrão", "betume", "breu", "óleo mineral", "parafina", "negro de fumo", "coque", "graxa", "trabalhei com carvão"], "resposta": "Sim, em 25 anos de exposição. Consta do Anexo IV do Decreto 3.048/1999, código 1.0.7: carvão mineral e seus derivados. Atividades exemplificativas do anexo: a) extração, fabricação, beneficiamento e utilização de carvão mineral, piche, alcatrão, betume e breu; b) extração, produção e utilização de óleos minerais e parafinas; c) extração e utilização de antraceno e negro de fumo; d) produção de coque.", "fonte": "Decreto 3.048/1999, Anexo IV, código 1.0.7", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-016", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Exposição a chumbo e seus compostos tóxicos dá aposentadoria especial? Em quantos anos?", "variantes": ["chumbo", "bateria", "acumulador", "solda", "tinta", "pintura com pistola", "vidro", "cristal", "trabalhei com chumbo"], "resposta": "Sim, em 25 anos de exposição. Consta do Anexo IV do Decreto 3.048/1999, código 1.0.8: chumbo e seus compostos tóxicos. Atividades exemplificativas do anexo: a) extração e processamento de minério de chumbo; b) metalurgia e fabricação de ligas e compostos de chumbo; c) fabricação e reformas de acumuladores elétricos; d) fabricação e emprego de chumbo-tetraetila e chumbo-tetrametila; e) fabricação de tintas, esmaltes e vernizes à base de compostos de chumbo; f) pintura com pistola empregando tintas com pigmentos de chumbo; g) fabricação de objetos e artefatos de chumbo e suas ligas; h) vulcanização da borracha pelo litargírio ou outros compostos de chumbo; i) utilização de chumbo em processos de soldagem; j) fabricação de vidro, cristal e esmalte vitrificado; l) fabricação de pérolas artificiais; m) fabricação e utilização de aditivos à base de chumbo para a indústria de plásticos.", "fonte": "Decreto 3.048/1999, Anexo IV, código 1.0.8", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-017", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Exposição a cloro e seus compostos tóxicos dá aposentadoria especial? Em quantos anos?", "variantes": ["cloro", "organoclorado", "PVC", "cloreto de vinila", "clorofórmio", "agrotóxico", "trabalhei com cloro"], "resposta": "Sim, em 25 anos de exposição. Consta do Anexo IV do Decreto 3.048/1999, código 1.0.9: cloro e seus compostos tóxicos. Atividades exemplificativas do anexo: a) fabricação e emprego de defensivos organoclorados; b) fabricação e emprego de cloroetilaminas (mostardas nitrogenadas); c) fabricação e manuseio de bifenis policlorados (PCB); d) fabricação e emprego de cloreto de vinil como monômero na fabricação de policloreto de vinil (PVC) e outras resinas e como intermediário em produções químicas ou como solvente orgânico; e) fabricação de policloroprene; f) fabricação e emprego de clorofórmio (triclorometano) e de tetracloreto de carbono.", "fonte": "Decreto 3.048/1999, Anexo IV, código 1.0.9", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-018", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Exposição a cromo e seus compostos tóxicos dá aposentadoria especial? Em quantos anos?", "variantes": ["cromo", "cromagem", "galvanoplastia", "solda de aço inoxidável", "inox", "trabalhei com cromo"], "resposta": "Sim, em 25 anos de exposição. Consta do Anexo IV do Decreto 3.048/1999, código 1.0.10: cromo e seus compostos tóxicos. Atividades exemplificativas do anexo: a) fabricação, emprego industrial, manipulação de cromo, ácido crômico, cromatos e bicromatos; b) fabricação de ligas de ferro-cromo; c) revestimento eletrolítico de metais e polimento de superfícies cromadas; d) pintura com pistola utilizando tintas com pigmentos de cromo; e) soldagem de aço inoxidável.", "fonte": "Decreto 3.048/1999, Anexo IV, código 1.0.10", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-019", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Exposição a dissulfeto de carbono dá aposentadoria especial? Em quantos anos?", "variantes": ["dissulfeto de carbono", "viscose", "raiom", "trabalhei com dissulfeto de carbono"], "resposta": "Sim, em 25 anos de exposição. Consta do Anexo IV do Decreto 3.048/1999, código 1.0.11: dissulfeto de carbono. Atividades exemplificativas do anexo: a) fabricação e utilização de dissulfeto de carbono; b) fabricação de viscose e seda artificial (raiom); c) fabricação e emprego de solventes, inseticidas e herbicidas contendo dissulfeto de carbono; d) fabricação de vernizes, resinas, sais de amoníaco, de tetracloreto de carbono, de vidros óticos e produtos têxteis com uso de dissulfeto de carbono.", "fonte": "Decreto 3.048/1999, Anexo IV, código 1.0.11", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-020", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Exposição a fósforo e seus compostos tóxicos dá aposentadoria especial? Em quantos anos?", "variantes": ["fósforo", "organofosforado", "fertilizante", "praguicida", "agrotóxico", "munição", "trabalhei com fósforo"], "resposta": "Sim, em 25 anos de exposição. Consta do Anexo IV do Decreto 3.048/1999, código 1.0.12: fósforo e seus compostos tóxicos. Atividades exemplificativas do anexo: a) extração e preparação de fósforo branco e seus compostos; b) fabricação e aplicação de produtos fosforados e organofosforados (sínteses orgânicas, fertilizantes e praguicidas); c) fabricação de munições e armamentos explosivos.", "fonte": "Decreto 3.048/1999, Anexo IV, código 1.0.12", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-021", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Exposição a iodo dá aposentadoria especial? Em quantos anos?", "variantes": ["iodo", "trabalhei com iodo"], "resposta": "Sim, em 25 anos de exposição. Consta do Anexo IV do Decreto 3.048/1999, código 1.0.13: iodo. Atividades exemplificativas do anexo: a) fabricação e emprego industrial do iodo.", "fonte": "Decreto 3.048/1999, Anexo IV, código 1.0.13", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-022", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Exposição a manganês e seus compostos dá aposentadoria especial? Em quantos anos?", "variantes": ["manganês", "eletrodo", "solda", "pilha", "trabalhei com manganês"], "resposta": "Sim, em 25 anos de exposição. Consta do Anexo IV do Decreto 3.048/1999, código 1.0.14: manganês e seus compostos. Atividades exemplificativas do anexo: a) extração e beneficiamento de minérios de manganês; b) fabricação de ligas e compostos de manganês; c) fabricação de pilhas secas e acumuladores; d) preparação de permanganato de potássio e de corantes; e) fabricação de vidros especiais e cerâmicas; f) utilização de eletrodos contendo manganês; g) fabricação de tintas e fertilizantes.", "fonte": "Decreto 3.048/1999, Anexo IV, código 1.0.14", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-023", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Exposição a mercúrio e seus compostos dá aposentadoria especial? Em quantos anos?", "variantes": ["mercúrio", "termômetro", "lâmpada", "amálgama", "dentista", "fungicida", "trabalhei com mercúrio"], "resposta": "Sim, em 25 anos de exposição. Consta do Anexo IV do Decreto 3.048/1999, código 1.0.15: mercúrio e seus compostos. Atividades exemplificativas do anexo: a) extração e utilização de mercúrio e fabricação de seus compostos; b) fabricação de espoletas com fulminato de mercúrio; c) fabricação de tintas com pigmento contendo mercúrio; d) fabricação e manutenção de aparelhos de medição e de laboratório; e) fabricação de lâmpadas, válvulas eletrônicas e ampolas de raio X; f) fabricação de minuterias, acumuladores e retificadores de corrente; g) utilização como agente catalítico e de eletrólise; h) douração, prateamento, bronzeamento e estanhagem de espelhos e metais; i) curtimento e feltragem do couro e conservação da madeira; j) recuperação do mercúrio; l) amalgamação do zinco. m) tratamento a quente de amálgamas de metais; n) fabricação e aplicação de fungicidas.", "fonte": "Decreto 3.048/1999, Anexo IV, código 1.0.15", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-024", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Exposição a níquel e seus compostos tóxicos dá aposentadoria especial? Em quantos anos?", "variantes": ["níquel", "niquelagem", "trabalhei com níquel"], "resposta": "Sim, em 25 anos de exposição. Consta do Anexo IV do Decreto 3.048/1999, código 1.0.16: níquel e seus compostos tóxicos. Atividades exemplificativas do anexo: a) extração e beneficiamento do níquel; b) niquelagem de metais; c) fabricação de acumuladores de níquel-cádmio.", "fonte": "Decreto 3.048/1999, Anexo IV, código 1.0.16", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-025", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Exposição a petróleo, xisto betuminoso, gás natural e seus derivados dá aposentadoria especial? Em quantos anos?", "variantes": ["petróleo", "gasolina", "diesel", "frentista", "posto de combustível", "refinaria", "petroquímica", "asfalto", "hidrocarboneto", "trabalhei com petróleo"], "resposta": "Sim, em 25 anos de exposição. Consta do Anexo IV do Decreto 3.048/1999, código 1.0.17: petróleo, xisto betuminoso, gás natural e seus derivados. Atividades exemplificativas do anexo: a) extração, processamento, beneficiamento e atividades de manutenção realizadas em unidades de extração, plantas petrolíferas e petroquímicas; b) beneficiamento e aplicação de misturas asfálticas contendo hidrocarbonetos policíclicos.", "fonte": "Decreto 3.048/1999, Anexo IV, código 1.0.17", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-026", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Exposição a sílica livre dá aposentadoria especial? Em quantos anos?", "variantes": ["sílica", "poeira", "jato de areia", "pedreira", "cerâmica", "vidro", "refratário", "túnel", "marmoraria", "trabalhei com sílica"], "resposta": "Sim, em 25 anos de exposição. Consta do Anexo IV do Decreto 3.048/1999, código 1.0.18: sílica livre. Atividades exemplificativas do anexo: a) extração de minérios a céu aberto; b) beneficiamento e tratamento de produtos minerais geradores de poeiras contendo sílica livre cristalizada; c) tratamento, decapagem e limpeza de metais e fosqueamento de vidros com jatos de areia; d) fabricação, processamento, aplicação e recuperação de materiais refratários; e) fabricação de mós, rebolos e de pós e pastas para polimento; f) fabricação de vidros e cerâmicas; g) construção de túneis; h) desbaste e corte a seco de materiais contendo sílica.", "fonte": "Decreto 3.048/1999, Anexo IV, código 1.0.18", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-027", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Exposição a outras substâncias químicas dá aposentadoria especial? Em quantos anos?", "variantes": ["estireno", "butadieno", "acrilonitrila", "TDI", "aminas aromáticas", "óxido de etileno", "creosoto", "benzopireno", "borracha", "plástico", "esterilização", "trabalhei com estireno"], "resposta": "Sim, em 25 anos de exposição. Consta do Anexo IV do Decreto 3.048/1999, código 1.0.19: outras substâncias químicas (estireno, butadieno, acrilonitrila, aminas aromáticas, óxido de etileno, creosoto e demais do código 1.0.19). Substâncias e atividades do anexo: GRUPO I - ESTIRENO; BUTADIENO-ESTIRENO; ACRILONITRILA; 1-3 BUTADIENO; CLOROPRENO; MERCAPTANOS, n-HEXANO, DIISOCIANATO DE TOLUENO (TDI); AMINAS AROMÁTICAS a) fabricação e vulcanização de artefatos de borracha; b) fabricação e recauchutagem de pneus. GRUPO II - AMINAS AROMÁTICAS, AMINOBIFENILA, AURAMINA, AZATIOPRINA, BIS (CLORO METIL) ÉTER, 1-4 BUTANODIOL, DIMETANOSULFONATO (MILERAN), CICLOFOSFAMIDA, CLOROAMBUCIL, DIETILESTIL-BESTROL, ACRONITRILA, NITRONAFTILAMINA 4-DIMETIL-AMINOAZOBENZENO, BENZOPIRENO, BETA-PROPIOLACTONA, BISCLOROETILETER, BISCLOROMETIL, CLOROMETILETER, DIANIZIDINA, DICLOROBENZIDINA, DIETILSULFATO, DIMETILSULFATO, ETILENOAMINA, ETILENOTIUREIA, FENACETINA, IODETO DE METILA, ETILNITROSURÉIAS, METILENO-ORTOCLOROANILINA (MOCA), NITROSAMINA, ORTOTOLUIDINA, OXIME-TALONA, PROCARBAZINA, PROPANOSULTONA, 1-3-BUTADIENO, ÓXIDO DE ETILENO, ESTILBENZENO, DIISOCIANATO DE TOLUENO (TDI), CREOSOTO, 4-AMINODIFENIL, BENZIDINA, BETANAFTILAMINA, ESTIRENO, 1-CLORO-2, 4 - NITRODIFENIL, 3-POXIPRO-PANO a) manufatura de magenta (anilina e ortotoluidina); b) fabricação de fibras sintéticas; c) sínteses químicas; d) fabricação da borracha e espumas; e) fabricação de plásticos; f) produção de medicamentos; g) operações de preservação da madeira com creosoto; h) esterilização de materiais cirúrgicos.", "fonte": "Decreto 3.048/1999, Anexo IV, código 1.0.19", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-028", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Exposição a ruído dá aposentadoria especial? Em quantos anos?", "variantes": ["barulho", "decibéis", "dB", "trabalhei com barulho"], "resposta": "Sim. O ruído está no Anexo IV do Decreto 3.048/1999 (código 2.0.1), com 25 anos de exposição, para NEN (Nível de Exposição Normalizado) superior a 85 dB(A), na redação do Decreto 4.882/2003. Para períodos antigos valem os limites da época: acima de 80 dB(A) até 05/03/1997 e acima de 90 dB(A) de 06/03/1997 a 18/11/2003.", "fonte": "Decreto 3.048/1999, Anexo IV, código 2.0.1; IN 128/2022, art. 292, I a III (red. IN 170/2024)", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-029", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Exposição a vibrações dá aposentadoria especial? Em quantos anos?", "variantes": ["vibração", "britadeira", "martelete", "perfuratriz", "trabalhei com vibração"], "resposta": "Sim, em 25 anos de exposição. Consta do Anexo IV do Decreto 3.048/1999, código 2.0.2: vibrações. Atividades do anexo: a) trabalhos com perfuratrizes e marteletes pneumáticos.", "fonte": "Decreto 3.048/1999, Anexo IV, código 2.0.2", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-030", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Exposição a radiações ionizantes dá aposentadoria especial? Em quantos anos?", "variantes": ["radiação", "raio X", "radiologia", "técnico em radiologia", "radioativo", "nuclear", "trabalhei com radiação"], "resposta": "Sim, em 25 anos de exposição. Consta do Anexo IV do Decreto 3.048/1999, código 2.0.3: radiações ionizantes. Atividades do anexo: a) extração e beneficiamento de minerais radioativos; b) atividades em minerações com exposição ao radônio; c) realização de manutenção e supervisão em unidades de extração, tratamento e beneficiamento de minerais radioativos com exposição às radiações ionizantes; d) operações com reatores nucleares ou com fontes radioativas; e) trabalhos realizados com exposição aos raios Alfa, Beta, Gama e X, aos nêutrons e às substâncias radioativas para fins industriais, terapêuticos e diagnósticos; f) fabricação e manipulação de produtos radioativos; g) pesquisas e estudos com radiações ionizantes em laboratórios.", "fonte": "Decreto 3.048/1999, Anexo IV, código 2.0.3", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-031", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Exposição a temperaturas anormais dá aposentadoria especial? Em quantos anos?", "variantes": ["calor", "forno", "fundição", "caldeira", "trabalhei com calor"], "resposta": "Sim, em 25 anos de exposição. Consta do Anexo IV do Decreto 3.048/1999, código 2.0.4: temperaturas anormais (calor). Atividades do anexo: a) trabalhos com exposição ao calor acima dos limites de tolerância estabelecidos na NR-15 (Norma Regulamentadora 15), da Portaria nº 3.214/78.", "fonte": "Decreto 3.048/1999, Anexo IV, código 2.0.4", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-032", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Exposição a pressão atmosférica anormal dá aposentadoria especial? Em quantos anos?", "variantes": ["mergulho", "mergulhador", "câmara hiperbárica", "tubulão", "ar comprimido", "trabalhei com mergulho"], "resposta": "Sim, em 25 anos de exposição. Consta do Anexo IV do Decreto 3.048/1999, código 2.0.5: pressão atmosférica anormal. Atividades do anexo: a) trabalhos em caixões ou câmaras hiperbáricas; b) trabalhos em tubulões ou túneis sob ar comprimido; c) operações de mergulho com o uso de escafandros ou outros equipamentos.", "fonte": "Decreto 3.048/1999, Anexo IV, código 2.0.5", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-033", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Exposição a micro-organismos e parasitas infectocontagiosos vivos e suas toxinas dá aposentadoria especial? Em quantos anos?", "variantes": ["biológico", "hospital", "enfermagem", "laboratório", "esgoto", "lixo", "gari", "coveiro", "veterinário", "trabalhei com biológico"], "resposta": "Sim, em 25 anos de exposição. Consta do Anexo IV do Decreto 3.048/1999, código 3.0.1: micro-organismos e parasitas infectocontagiosos vivos e suas toxinas (agentes biológicos). Atividades do anexo: a) trabalhos em estabelecimentos de saúde em contato com pacientes portadores de doenças infecto-contagiosas ou com manuseio de materiais contaminados; b) trabalhos com animais infectados para tratamento ou para o preparo de soro, vacinas e outros produtos; c) trabalhos em laboratórios de autópsia, de anatomia e anátomo-histologia; d) trabalho de exumação de corpos e manipulação de resíduos de animais deteriorados; e) trabalhos em galerias, fossas e tanques de esgoto; f) esvaziamento de biodigestores; g) coleta e industrialização do lixo.", "fonte": "Decreto 3.048/1999, Anexo IV, código 3.0.1", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "qd-001", "tema": "Carência e qualidade de segurado", "pergunta": "Quais doenças dispensam carência no auxílio-doença e na aposentadoria por invalidez?", "variantes": ["Tenho câncer e poucas contribuições, preciso de carência?", "Lista de doenças graves que isentam de carência", "Quais doenças não precisam das 12 contribuições?", "AVC, Aids, Parkinson ou gravidez de risco dispensam carência?", "Doença grave sem carência no INSS"], "resposta": "Dispensam carência no auxílio por incapacidade temporária (auxílio-doença) e na aposentadoria por incapacidade permanente (aposentadoria por invalidez), se a doença começou depois da filiação ao INSS (Instituto Nacional do Seguro Social), estas 18 doenças e afecções:\n- tuberculose ativa;\n- hanseníase;\n- transtorno mental grave, desde que curse com alienação mental;\n- neoplasia maligna (câncer);\n- cegueira;\n- paralisia irreversível e incapacitante;\n- cardiopatia grave;\n- doença de Parkinson;\n- espondilite anquilosante;\n- nefropatia grave (doença renal grave);\n- estado avançado da doença de Paget (osteíte deformante);\n- síndrome da deficiência imunológica adquirida (Aids);\n- contaminação por radiação, com base em conclusão da medicina especializada;\n- hepatopatia grave (doença grave do fígado);\n- esclerose múltipla;\n- acidente vascular encefálico (AVC) agudo;\n- abdome agudo cirúrgico;\n- gestação de alto risco, desde 24/07/2026.\nAVC agudo e abdome agudo cirúrgico só isentam com quadro de evolução aguda (instalação súbita, sem contar episódio agudo de doença crônica) e critério de gravidade (risco iminente de morte ou de perda da função de órgão ou sistema). Também não exigem carência o acidente de qualquer natureza e a doença profissional ou do trabalho.", "fonte": "Lei 8.213/1991, art. 26, II; Portaria Interministerial MTP/MS 22/2022, arts. 1º, § 1º e § 2º, e 2º, I a XVII e par. único; Portaria Interministerial MPS/MS 15/2026, art. 1º (inciso XVIII)", "origem": "_CONTINUIDADE/_artefatos/prev-lacunas/fontes/INSUMO_dou-portaria-interministerial-mtp-ms-22-2022_2026-11-09.html (arts. 1º e 2º, em vigor em 03/10/2022); INSUMO_dou-portaria-interministerial-mps-ms-15-2026_2026-11-09.html (DOU de 24/07/2026, ed. 138-A, art. 1º); 03_TESES/legislacao/leis/Lei-8213-1991_planos-de-beneficios-previdencia.htm (art. 26, II)", "sinal": "firme"}, {"id": "qd-002", "tema": "Carência e qualidade de segurado", "pergunta": "Quais doenças a própria Lei 8.213 lista como isentas de carência?", "variantes": ["O artigo 151 da lei de benefícios lista quais doenças?", "Lista de doenças da lei do INSS sem carência", "Alienação mental e espondiloartrose isentam de carência?", "Diferença entre a lista da lei e a da portaria"], "resposta": "A Lei 8.213/1991, no art. 151, lista 15 doenças que dispensam carência no auxílio-doença e na aposentadoria por invalidez quando surgem depois da filiação ao RGPS (Regime Geral de Previdência Social):\n- tuberculose ativa;\n- hanseníase;\n- alienação mental;\n- esclerose múltipla;\n- hepatopatia grave;\n- neoplasia maligna;\n- cegueira;\n- paralisia irreversível e incapacitante;\n- cardiopatia grave;\n- doença de Parkinson;\n- espondiloartrose anquilosante;\n- nefropatia grave;\n- estado avançado da doença de Paget (osteíte deformante);\n- síndrome da deficiência imunológica adquirida (Aids);\n- contaminação por radiação, com base em conclusão da medicina especializada.\nÉ uma lista provisória, válida até a edição da lista ministerial do art. 26, II. A lista ministerial em vigor (Portaria Interministerial MTP/MS, do Ministério do Trabalho e Previdência e do Ministério da Saúde, 22/2022, com o acréscimo da Portaria Interministerial MPS/MS, do Ministério da Previdência Social e do Ministério da Saúde, 15/2026) repete essas doenças e acrescenta acidente vascular encefálico agudo, abdome agudo cirúrgico e gestação de alto risco.", "fonte": "Lei 8.213/1991, art. 151 (red. Lei 13.135/2015) e art. 26, II", "origem": "03_TESES/legislacao/leis/Lei-8213-1991_planos-de-beneficios-previdencia.htm (art. 151, última ocorrência, red. Lei 13.135/2015)", "sinal": "firme"}, {"id": "qd-003", "tema": "Carência e qualidade de segurado", "pergunta": "Quais benefícios do INSS não exigem carência?", "variantes": ["Benefício que não precisa de número mínimo de contribuições", "Pensão por morte precisa de carência?", "Auxílio-acidente e salário-família têm carência?", "Salário-maternidade de empregada exige contribuições mínimas?"], "resposta": "Não exigem carência:\n- pensão por morte;\n- salário-família;\n- auxílio-acide
