 do INSS?", "variantes": ["pente-fino do BPC", "revisão do LOAS a cada dois anos", "nova perícia do benefício assistencial"], "resposta": "Sim, o BPC (benefício de prestação continuada) é revisto a cada 2 anos. A reavaliação médica fica dispensada quando o impedimento é permanente, irreversível ou irrecuperável e a partir dos 65 anos. Na revisão, a renda é selecionada pelo menor valor entre a do último mês e a média de 12 meses.", "fonte": "Lei 8.742/1993, art. 21, caput e § 5º; Portaria Conjunta MDS/MPS/INSS 33/2025, art. 5º; Portaria Conjunta MDS/INSS 34/2025, art. 29", "origem": "doutrina-beneficio-assistencial.md §13 (Acumulação, revisão e suspensão; Renda familiar por pessoa)", "sinal": "firme"}, {"id": "bpc-030", "tema": "BPC: valor e manutenção", "pergunta": "Quem recebe LOAS por deficiência pode trabalhar?", "variantes": ["BPC e emprego", "arrumei serviço, perco o LOAS", "jovem aprendiz com BPC"], "resposta": "Pode, mas a atividade remunerada suspende o BPC (benefício de prestação continuada) em regime especial. O aprendiz acumula o BPC com a remuneração por até 2 anos. Quem tem deficiência moderada ou grave e passa a trabalhar ganhando até 2 salários mínimos pode receber o auxílio-inclusão.", "fonte": "Lei 8.742/1993, art. 21-A, caput e § 2º, e art. 26-A", "origem": "doutrina-beneficio-assistencial.md §13 (Acumulação, revisão e suspensão; Auxílio-inclusão)", "sinal": "firme"}, {"id": "bpc-031", "tema": "BPC: valor e manutenção", "pergunta": "O que é o auxílio-inclusão e quanto paga?", "variantes": ["auxílio-inclusão para quem tinha BPC", "benefício para deficiente que volta a trabalhar", "meio BPC trabalhando"], "resposta": "É devido à pessoa com deficiência moderada ou grave que recebe o BPC (benefício de prestação continuada) e passa a trabalhar com remuneração de até 2 salários mínimos, como segurada obrigatória do RGPS (Regime Geral de Previdência Social) ou filiada a regime próprio, com CadÚnico (Cadastro Único) atualizado e CPF (Cadastro de Pessoas Físicas). O valor é de 50% do BPC em vigor, sem 13º e sem desconto de contribuição. Vale desde 01/10/2021.", "fonte": "Lei 8.742/1993, arts. 26-A, 26-B e 26-E; Lei 14.176/2021, art. 6º, II", "origem": "doutrina-beneficio-assistencial.md §13 (Auxílio-inclusão)", "sinal": "firme"}, {"id": "bpc-032", "tema": "BPC: valor e manutenção", "pergunta": "Dá para receber o LOAS junto com aposentadoria ou pensão?", "variantes": ["acumular BPC com outro benefício", "LOAS e aposentadoria juntos", "pensão e LOAS ao mesmo tempo"], "resposta": "Não. O BPC (benefício de prestação continuada) não acumula com outro benefício da seguridade social ou de outro regime. As exceções são a assistência médica, a pensão especial de natureza indenizatória e as transferências de renda ressalvadas em lei. Quem tem direito aos dois escolhe o mais vantajoso.", "fonte": "Lei 8.742/1993, art. 20, § 4º; Dec. 6.214/2007, art. 5º; TNU Tema 253", "origem": "doutrina-beneficio-assistencial.md §13 (Acumulação, revisão e suspensão); doutrina-pensao-e-acumulacao.md §10 (Benefício assistencial)", "sinal": "firme"}, {"id": "pen-001", "tema": "Pensão: dependentes", "pergunta": "Quem tem direito à pensão por morte?", "variantes": ["quem recebe a pensão do falecido", "dependentes do INSS", "quem pode pedir pensão quando a pessoa morre"], "resposta": "Os dependentes, em três classes: a primeira é o cônjuge, o companheiro ou companheira e o filho menor de 21 anos ou inválido ou com deficiência intelectual, mental ou grave; a segunda são os pais; a terceira é o irmão nas mesmas condições do filho. A existência de dependente de uma classe exclui as classes seguintes.", "fonte": "Lei 8.213/1991, art. 16, I a III e § 1º", "origem": "doutrina-pensao-e-acumulacao.md §9 (Dependentes)", "sinal": "firme"}, {"id": "pen-002", "tema": "Pensão: dependentes", "pergunta": "A viúva precisa provar que dependia do marido?", "variantes": ["esposa tem que provar dependência econômica", "viúva que trabalha tem direito à pensão", "dependência do cônjuge é presumida"], "resposta": "Não. A dependência econômica do cônjuge e do companheiro é presumida, e a TNU (Turma Nacional de Uniformização) considera essa presunção absoluta. Pais e irmãos é que precisam provar a dependência.", "fonte": "Lei 8.213/1991, art. 16, § 4º; TNU Tema 226", "origem": "doutrina-pensao-e-acumulacao.md §9 (Dependentes)", "sinal": "firme"}, {"id": "pen-003", "tema": "Pensão: dependentes", "pergunta": "Quem vivia junto sem ser casado tem direito à pensão?", "variantes": ["companheira tem direito à pensão", "união estável dá pensão", "como provar união estável no INSS", "só testemunha serve para provar união estável"], "resposta": "Sim, o companheiro ou companheira é dependente da primeira classe. Para óbitos desde a MP (medida provisória) 871/2019, a união estável exige início de prova material contemporânea, produzido em até 24 meses antes do óbito, e não se admite prova só testemunhal, salvo força maior ou caso fortuito. Para fatos anteriores à MP 871/2019, a TNU (Turma Nacional de Uniformização) dispensa o início de prova material.", "fonte": "Lei 8.213/1991, art. 16, I e § 5º; IN 128/2022, art. 180; TNU Tema 371; TNU Súmula 63", "origem": "doutrina-pensao-e-acumulacao.md §9 (União estável, concubinato e ex-cônjuge)", "sinal": "firme"}, {"id": "pen-004", "tema": "Pensão: dependentes", "pergunta": "A amante tem direito a dividir a pensão?", "variantes": ["relação paralela dá pensão", "concubina recebe pensão", "segunda família tem direito"], "resposta": "Não. O concubinato não gera pensão e não se reconhece vínculo concomitante a casamento ou união estável, conforme o STF (Supremo Tribunal Federal), em teses adversas a quem mantinha a relação paralela.", "fonte": "STF Temas 526 e 529 (adversos)", "origem": "doutrina-pensao-e-acumulacao.md §9 (União estável, concubinato e ex-cônjuge)", "sinal": "firme"}, {"id": "pen-005", "tema": "Pensão: dependentes", "pergunta": "A ex-mulher que recebia pensão alimentícia divide a pensão por morte?", "variantes": ["ex-esposa tem direito à pensão do INSS", "divorciada recebe pensão por morte", "ex que abriu mão dos alimentos"], "resposta": "Sim. O cônjuge divorciado ou separado que recebia alimentos concorre em igualdade com os demais dependentes; se os alimentos eram temporários, a cota dura só o prazo que faltava. A mulher que renunciou aos alimentos tem direito à pensão se comprovar necessidade econômica que surgiu depois.", "fonte": "Lei 8.213/1991, art. 76, §§ 2º e 3º; STJ Súmula 336; TNU Tema 45", "origem": "doutrina-pensao-e-acumulacao.md §9 (União estável, concubinato e ex-cônjuge)", "sinal": "firme"}, {"id": "pen-006", "tema": "Pensão: dependentes", "pergunta": "Até que idade o filho recebe a pensão?", "variantes": ["pensão do filho acaba quando", "filho na faculdade continua com pensão", "pensão até 24 anos se estudar"], "resposta": "Até 21 anos, salvo se for inválido ou tiver deficiência intelectual, mental ou grave. Não há prorrogação por curso universitário: o STJ (Superior Tribunal de Justiça) e a TNU (Turma Nacional de Uniformização) negam a pensão ao maior de 21 anos que só estuda.", "fonte": "Lei 8.213/1991, art. 77, § 2º, II; STJ Tema 643; TNU Súmula 37 (adversos)", "origem": "doutrina-pensao-e-acumulacao.md §9 (Duração e cessação das cotas; ADVERSO)", "sinal": "firme"}, {"id": "pen-007", "tema": "Pensão: dependentes", "pergunta": "Filho maior com deficiência ou inválido tem direito à pensão?", "variantes": ["filho especial adulto recebe pensão", "filho inválido depois dos 21", "pensão vitalícia para filho com deficiência"], "resposta": "Sim, o filho inválido ou com deficiência intelectual, mental ou grave é dependente da primeira classe em qualquer idade. A invalidez ou deficiência surgida antes dos 21 anos mantém a cota; o INSS (Instituto Nacional do Seguro Social) admite a surgida antes ou depois do óbito. A cota cessa se cessar a invalidez ou for afastada a deficiência.", "fonte": "Lei 8.213/1991, art. 16, I, e art. 77, § 2º, II a IV; Dec. 3.048/1999, art. 115; IN 128/2022, art. 378, § 4º", "origem": "doutrina-pensao-e-acumulacao.md §9 (Dependentes; Duração e cessação das cotas)", "sinal": "firme"}, {"id": "pen-008", "tema": "Pensão: dependentes", "pergunta": "Enteado tem direito à pensão do padrasto?", "variantes": ["enteada recebe pensão", "menor tutelado tem direito à pensão", "filho da esposa entra na pensão"], "resposta": "Sim. O enteado e o menor sob tutela equiparam-se a filho, mediante declaração do segurado e desde que não tenham condições suficientes para o próprio sustento e educação.", "fonte": "Lei 8.213/1991, art. 16, § 2º; EC 103/2019, art. 23, § 6º", "origem": "doutrina-pensao-e-acumulacao.md §9 (Dependentes)", "sinal": "firme"}, {"id": "pen-009", "tema": "Pensão: dependentes", "pergunta": "Neto que estava sob a guarda do avô tem direito à pensão?", "variantes": ["menor sob guarda recebe pensão", "criança com guarda judicial tem direito", "guarda do neto dá pensão"], "resposta": "Depende da data do óbito e o ponto é controvertido. Desde 14/03/2025, a Lei 15.108/2025 equipara a filho o menor sob guarda judicial, com declaração do segurado e sem condições de sustento, mas a regra colide com a EC (Emenda Constitucional) 103/2019, que fala só em enteado e menor tutelado. Para óbitos de 14/11/2019 a 13/03/2025, o tratamento é controvertido; a favor há as ADIs (ações diretas de inconstitucionalidade) 4.878 e 5.083 do STF (Supremo Tribunal Federal) e o Tema 732 do STJ (Superior Tribunal de Justiça), com o alcance depois da EC 103/2019 em aberto.", "fonte": "Lei 8.213/1991, art. 16, § 2º (red. Lei 15.108/2025); EC 103/2019, art. 23, § 6º; STF ADIs 4.878 e 5.083; STJ Tema 732", "origem": "doutrina-pensao-e-acumulacao.md §9 (Dependentes; LACUNA c.7)", "sinal": "controvertido"}, {"id": "pen-010", "tema": "Pensão: dependentes", "pergunta": "Os pais podem receber pensão do filho que morreu?", "variantes": ["mãe recebe pensão do filho falecido", "pais dependentes do filho", "pensão para os pais"], "resposta": "Sim, se o filho não deixou cônjuge, companheiro ou filhos com direito, porque a primeira classe exclui os pais. Os pais precisam comprovar a dependência econômica.", "fonte": "Lei 8.213/1991, art. 16, II, §§ 1º e 4º", "origem": "doutrina-pensao-e-acumulacao.md §9 (Dependentes)", "sinal": "firme"}, {"id": "pen-011", "tema": "Pensão: dependentes", "pergunta": "Irmão pode receber pensão do irmão falecido?", "variantes": ["pensão para irmão", "irmão inválido tem direito à pensão", "irmã menor recebe pensão"], "resposta": "Sim, mas só se não houver dependentes da primeira classe nem pais com direito. O irmão precisa ser menor de 21 anos ou inválido ou ter deficiência intelectual, mental ou grave, e comprovar a dependência econômica.", "fonte": "Lei 8.213/1991, art. 16, III, §§ 1º e 4º", "origem": "doutrina-pensao-e-acumulacao.md §9 (Dependentes)", "sinal": "firme"}, {"id": "pen-012", "tema": "Pensão: requisitos e prazos", "pergunta": "Precisa de um mínimo de contribuições para deixar pensão?", "variantes": ["carência da pensão por morte", "quantas contribuições para a pensão", "pensão de quem contribuiu pouco"], "resposta": "Não. A pensão por morte independe de carência e cabe com o falecido aposentado ou não. O número de contribuições influi só na duração da cota do cônjuge ou companheiro, que fica limitada a 4 meses se o falecido não tinha 18 contribuições ou se o casamento ou a união tinha menos de 2 anos, salvo morte por acidente ou por doença profissional ou do trabalho.", "fonte": "Lei 8.213/1991, art. 26, I, art. 74, caput, e art. 77, § 2º, V, b", "origem": "doutrina-pensao-e-acumulacao.md §9 (Lei aplicável e instituidor; Duração e cessação das cotas)", "sinal": "firme"}, {"id": "pen-013", "tema": "Pensão: requisitos e prazos", "pergunta": "Meu marido tinha parado de contribuir. Ainda tenho direito à pensão?", "variantes": ["falecido sem qualidade de segurado", "morreu sem estar pagando INSS", "falecido já podia se aposentar"], "resposta": "Depende de o falecido manter a qualidade de segurado na data do óbito. A perda da qualidade impede a pensão, salvo se ele já tivesse reunido os requisitos de alguma aposentadoria até o óbito. Se não chegou a preencher os requisitos de nenhuma aposentadoria, a TNU (Turma Nacional de Uniformização) nega a pensão, em tese adversa.", "fonte": "Lei 8.213/1991, art. 102, §§ 1º e 2º; STJ Súmula 416; TNU Tema 148 (adverso)", "origem": "doutrina-pensao-e-acumulacao.md §9 (Lei aplicável e instituidor)", "sinal": "firme"}, {"id": "pen-014", "tema": "Pensão: requisitos e prazos", "pergunta": "Ele estava desempregado quando morreu. Mantinha a qualidade de segurado?", "variantes": ["período de graça", "quanto tempo depois de parar de contribuir ainda vale", "desempregado deixa pensão"], "resposta": "Mantém por 12 meses depois de cessadas as contribuições, ou 24 meses se tinha mais de 120 contribuições sem perder a qualidade. O desempregado com registro no órgão próprio ganha mais 12 meses sobre esses prazos. O facultativo mantém por 6 meses.", "fonte": "Lei 8.213/1991, art. 15, II e §§ 1º e 2º", "origem": "doutrina-previdenciaria.md §6 (Período de graça)", "sinal": "firme"}, {"id": "pen-015", "tema": "Pensão: requisitos e prazos", "pergunta": "O falecido era autônomo e tinha contribuições atrasadas. Dá para pagar agora e garantir a pensão?", "variantes": ["pagar INSS atrasado depois da morte", "regularizar contribuição do falecido", "carnê atrasado do autônomo falecido"], "resposta": "Não. A TNU (Turma Nacional de Uniformização) não admite regularizar contribuições do contribuinte individual depois do óbito, salvo as que a empresa tomadora de serviços devia arrecadar; a tese é adversa.", "fonte": "TNU Súmula 52 (adversa)", "origem": "doutrina-pensao-e-acumulacao.md §9 (União estável, concubinato e ex-cônjuge; ADVERSO)", "sinal": "firme"}, {"id": "pen-016", "tema": "Pensão: requisitos e prazos", "pergunta": "Vale a regra da época da morte ou a de hoje?", "variantes": ["qual lei vale para a pensão", "morte antes da reforma da previdência", "pensão de óbito antigo"], "resposta": "Vale a lei vigente na data do óbito, qualquer que seja a data do pedido. Por isso, óbito até 13/11/2019 segue a regra anterior à reforma e óbito desde 14/11/2019 segue a EC (Emenda Constitucional) 103/2019.", "fonte": "STJ Súmula 340; IN 128/2022, art. 365, § 1º; EC 103/2019, art. 23", "origem": "doutrina-pensao-e-acumulacao.md §9 (Lei aplicável e instituidor; Valor)", "sinal": "firme"}, {"id": "pen-017", "tema": "Pensão: requisitos e prazos", "pergunta": "Qual é o prazo para pedir a pensão sem perder dinheiro?", "variantes": ["prazo de 90 dias da pensão", "180 dias para pedir pensão", "pensão paga desde a morte"], "resposta": "Para óbito desde 18/01/2019, o pedido deve ser feito em até 180 dias para filhos menores de 16 anos e em até 90 dias para os demais dependentes para receber desde o óbito; para óbitos anteriores valem os prazos da época, de 30 dias (Lei 9.528/1997) ou 90 dias (Lei 13.183/2015). O INSS (Instituto Nacional do Seguro Social) aplica os 180 dias também ao dependente inválido ou com deficiência, mas só por instrução normativa. Na morte presumida, os efeitos começam na decisão judicial.", "fonte": "Lei 8.213/1991, art. 74, I a III (red. Lei 13.846/2019); IN 128/2022, art. 369 e § 1º", "origem": "doutrina-pensao-e-acumulacao.md §9 (Termo inicial, habilitação e rateio)", "sinal": "firme"}, {"id": "pen-018", "tema": "Pensão: requisitos e prazos", "pergunta": "Passou o prazo. Ainda posso pedir a pensão?", "variantes": ["pedi a pensão atrasado", "perdi o prazo de 90 dias", "pensão pedida um ano depois"], "resposta": "Sim. Depois do prazo, a pensão é paga desde a DER (data de entrada do requerimento), e não desde o óbito; a data de início do benefício continua sendo a do óbito. O filho nascido depois do óbito recebe desde o nascimento.", "fonte": "Lei 8.213/1991, art. 74, II; Dec. 3.048/1999, art. 105, § 1º; IN 128/2022, arts. 365, § 3º, e 369-A", "origem": "doutrina-pensao-e-acumulacao.md §9 (Termo inicial, habilitação e rateio)", "sinal": "firme"}, {"id": "pen-019", "tema": "Pensão: requisitos e prazos", "pergunta": "Apareceu outro dependente depois que a pensão já estava sendo paga. Como fica?", "variantes": ["filho de fora aparece depois", "habilitação tardia na pensão", "outro herdeiro pede a pensão depois"], "resposta": "A habilitação posterior só produz efeito desde a habilitação, e o novo dependente recebe desde a DER (data de entrada do requerimento) dele, com novo rateio em partes iguais. Mesmo o absolutamente incapaz, havendo dependente já habilitado, recebe desde a DER, segundo a TNU (Turma Nacional de Uniformização), em tese adversa.", "fonte": "Lei 8.213/1991, arts. 76, caput, e 77, caput; IN 128/2022, arts. 367 e 370; TNU Tema 223 (adverso)", "origem": "doutrina-pensao-e-acumulacao.md §9 (Termo inicial, habilitação e rateio)", "sinal": "firme"}, {"id": "pen-020", "tema": "Pensão: valor e duração", "pergunta": "Quanto é o valor da pensão por morte?", "variantes": ["pensão paga quanto", "viúva recebe 60%", "cota familiar da pensão", "pensão depois da reforma"], "resposta": "Para óbito desde 14/11/2019, é uma cota familiar de 50% mais 10 pontos percentuais por dependente, até 100%, sobre a aposentadoria que o falecido recebia ou a aposentadoria por incapacidade permanente a que teria direito. Com um único dependente, a pensão é de 60%. A renda não pode ser inferior a 1 salário mínimo no total; nenhum texto fixa piso por cota.", "fonte": "EC 103/2019, art. 23, caput; Dec. 3.048/1999, art. 106; IN 128/2022, art. 235, §§ 1º, 2º e 7º", "origem": "doutrina-pensao-e-acumulacao.md §9 (Valor; LACUNA c.13)", "sinal": "firme"}, {"id": "pen-021", "tema": "Pensão: valor e duração", "pergunta": "E se a morte foi antes da reforma da previdência?", "variantes": ["pensão de óbito até 2019", "pensão integral antiga", "valor da pensão antes da EC 103"], "resposta": "Para óbito até 13/11/2019, a pensão é de 100% da aposentadoria recebida ou da aposentadoria por invalidez a que o falecido teria direito, e a cota de quem deixa de receber reverte aos demais.", "fonte": "Lei 8.213/1991, art. 75 (red. Lei 9.528/1997) e art. 77, § 1º; STJ Súmula 340", "origem": "doutrina-pensao-e-acumulacao.md §9 (Valor)", "sinal": "firme"}, {"id": "pen-022", "tema": "Pensão: valor e duração", "pergunta": "Ele não era aposentado. Como calcula a pensão?", "variantes": ["pensão de quem ainda trabalhava", "base da pensão do falecido não aposentado", "morte em acidente de trabalho pensão integral"], "resposta": "A base é a aposentadoria por incapacidade permanente a que ele teria direito na data do óbito: 60% da média mais 2 pontos percentuais por ano acima de 20 anos de contribuição (homem) ou 15 (mulher), ou 100% da média se a morte decorreu de acidente do trabalho ou de doença profissional ou do trabalho. Sobre essa base se aplica a cota familiar de 50% mais 10 pontos por dependente.", "fonte": "EC 103/2019, art. 23, caput, e art. 26, §§ 2º, III, 3º, II, e 5º", "origem": "doutrina-pensao-e-acumulacao.md §9 (Valor)", "sinal": "firme"}, {"id": "pen-023", "tema": "Pensão: valor e duração", "pergunta": "Com filho inválido ou com deficiência a pensão é maior?", "variantes": ["pensão integral com dependente deficiente", "100% da pensão para filho especial", "dependente inválido aumenta a pensão"], "resposta": "Sim. Havendo dependente inválido ou com deficiência intelectual, mental ou grave, a pensão é de 100% até o teto do RGPS (Regime Geral de Previdência Social) e, acima dele, segue a cota familiar de 50% mais 10 pontos por dependente. Quando deixar de haver esse dependente, a pensão é recalculada.", "fonte": "EC 103/2019, art. 23, §§ 2º, 3º e 5º; Dec. 3.048/1999, arts. 106, §§ 2º e 3º, e 113, §§ 1º e 2º", "origem": "doutrina-pensao-e-acumulacao.md §9 (Valor)", "sinal": "firme"}, {"id": "pen-024", "tema": "Pensão: valor e duração", "pergunta": "Quando um filho faz 21 anos, a parte dele passa para a mãe?", "variantes": ["reversão de cotas", "cota do filho volta para a viúva", "pensão diminui quando o filho sai"], "resposta": "Para óbito desde 14/11/2019, não: as cotas não revertem e a pensão é recalculada a cada mudança, salvo se restarem 5 ou mais dependentes, caso em que se preservam os 100%. Para óbito até 13/11/2019, a cota reverte aos demais pensionistas.", "fonte": "EC 103/2019, art. 23, § 1º; Dec. 3.048/1999, art. 113, § 3º; Lei 8.213/1991, art. 77, § 1º", "origem": "doutrina-pensao-e-acumulacao.md §9 (Valor)", "sinal": "firme"}, {"id": "pen-025", "tema": "Pensão: valor e duração", "pergunta": "Por quanto tempo a viúva recebe a pensão?", "variantes": ["pensão vitalícia com quantos anos", "duração da pensão do cônjuge", "tabela de idade da pensão", "viúva jovem recebe por quanto tempo"], "resposta": "Para óbito desde 01/01/2021, com 18 contribuições e 2 anos de casamento ou união, o prazo segue a idade do cônjuge ou companheiro na data do óbito: 3 anos com menos de 22 anos; 6 anos entre 22 e 27; 10 anos entre 28 e 30; 15 anos entre 31 e 41; 20 anos entre 42 e 44; vitalícia com 45 anos ou mais. O prazo conta do óbito, e quem pede tarde recebe só da DER (data de entrada do requerimento) até o termo, sem direito se pedir depois dele.", "fonte": "Lei 8.213/1991, art. 77, § 2º, V, c, e § 2º-B; Portaria ME 424/2020, art. 1º; IN 128/2022, art. 375, §§ 6º a 8º; TNU Tema 377 (adverso)", "origem": "doutrina-pensao-e-acumulacao.md §9 (Duração e cessação das cotas); 05_AUTOMACAO/scripts/dados/pensao_duracao.json", "sinal": "firme"}, {"id": "pen-026", "tema": "Pensão: valor e duração", "pergunta": "E a duração da pensão para morte entre 2015 e 2020?", "variantes": ["tabela antiga da pensão por idade", "pensão vitalícia com 44 anos", "óbito em 2018 duração da pensão"], "resposta": "Para óbito de 01/03/2015 a 31/12/2020, com 18 contribuições e 2 anos de casamento ou união: 3 anos com menos de 21 anos; 6 anos entre 21 e 26; 10 anos entre 27 e 29; 15 anos entre 30 e 40; 20 anos entre 41 e 43; vitalícia com 44 anos ou mais. Para óbito antes de 01/03/2015, a fonte entende que não havia prazo por idade, mas só por leitura a contrario e com lacuna registrada.", "fonte": "Lei 8.213/1991, art. 77, § 2º, V, c, 1 a 6 (red. Lei 13.135/2015); IN 128/2022, art. 375", "origem": "doutrina-pensao-e-acumulacao.md §9 (Duração e cessação das cotas; LACUNA c.4); 05_AUTOMACAO/scripts/dados/pensao_duracao.json", "sinal": "firme"}, {"id": "pen-027", "tema": "Pensão: valor e duração", "pergunta": "Casei há pouco tempo. A pensão é só de 4 meses?", "variantes": ["pensão de 4 meses", "casamento com menos de 2 anos", "falecido com menos de 18 contribuições", "morte por acidente pensão de 4 meses"], "resposta": "Sim, o cônjuge ou companheiro recebe 4 meses se o falecido não tinha 18 contribuições ou se o casamento ou a união estável tinha menos de 2 anos. Se a morte decorreu de acidente de qualquer natureza ou de doença profissional ou do trabalho, essas duas exigências ficam dispensadas e vale a tabela por idade. Tempo de regime próprio conta nas 18 contribuições, e o INSS (Instituto Nacional do Seguro Social) dispensa as 18 contribuições se o falecido era aposentado, salvo por incapacidade permanente.", "fonte": "Lei 8.213/1991, art. 77, § 2º, V, b, §§ 2º-A e 5º; IN 128/2022, art. 375, I e §§ 2º a 4º", "origem": "doutrina-pensao-e-acumulacao.md §9 (Duração e cessação das cotas)", "sinal": "firme"}, {"id": "pen-028", "tema": "Pensão: valor e duração", "pergunta": "Se a viúva casar de novo, perde a pensão?", "variantes": ["novo casamento corta a pensão", "viúva que se casa outra vez", "nova união estável perde pensão"], "resposta": "Pela letra da lei, não: o rol vigente de cessação da cota do cônjuge (morte, fim do prazo de 4 meses ou por idade, cessação da invalidez ou da deficiência e perda do direito por homicídio doloso) não inclui novo casamento ou nova união. É leitura do silêncio da lei, sem tese lida na fonte que a confirme. Se o novo cônjuge também morrer, não se recebem duas pensões de cônjuge no RGPS (Regime Geral de Previdência Social), com opção pela mais vantajosa.", "fonte": "Lei 8.213/1991, art. 77, § 2º, I, V e VI; art. 74, § 1º; art. 124, VI", "origem": "03_TESES/legislacao/leis/Lei-8213-1991_planos-de-beneficios-previdencia.htm (art. 77, § 2º; art. 124); doutrina-pensao-e-acumulacao.md §9 e §10 (Vedação e hipóteses)", "sinal": "controvertido"}, {"id": "pen-029", "tema": "Pensão: dependentes", "pergunta": "Quem matou o segurado pode receber a pensão?", "variantes": ["assassino recebe pensão", "condenado pela morte perde a pensão"], "resposta": "Não. Fica excluído o condenado por sentença com trânsito em julgado por homicídio doloso, ou tentativa, contra o segurado, ressalvados os absolutamente incapazes e os inimputáveis. Com fundados indícios, a cota pode ser suspensa provisoriamente em processo administrativo.", "fonte": "Lei 8.213/1991, art. 16, § 7º, art. 74, § 1º, e art. 77, § 7º; IN 128/2022, art. 380", "origem": "doutrina-pensao-e-acumulacao.md §9 (União estável, concubinato e ex-cônjuge)", "sinal": "firme"}, {"id": "pen-030", "tema": "Pensão: valor e duração", "pergunta": "Dá para pedir na Justiça a pensão integral, contra o corte da reforma?", "variantes": ["reforma da previdência reduziu a pensão é inconstitucional", "pensão de 100% na Justiça", "ação contra a cota de 50%"], "resposta": "Não. O STF (Supremo Tribunal Federal) julgou constitucional o cálculo por cotas da EC (Emenda Constitucional) 103/2019, com trânsito em julgado em 26/10/2023.", "fonte": "STF ADI 7.051 (adversa)", "origem": "doutrina-pensao-e-acumulacao.md §9 (ADVERSO: STF ADI 7.051)", "sinal": "firme"}, {"id": "acu-001", "tema": "Acumulação de benefícios", "pergunta": "Posso receber pensão por morte e minha aposentadoria juntas?", "variantes": ["acumular pensão e aposentadoria", "viúva aposentada recebe pensão", "pensão e aposentadoria ao mesmo tempo"], "resposta": "Sim, mas com redução. Acumulam com redutor a pensão de cônjuge do RGPS (Regime Geral de Previdência Social) com aposentadoria de qualquer regime, a pensão de cônjuge do RGPS com pensão de outro regime ou militar, e a aposentadoria do RGPS com pensão de cônjuge de regime próprio ou militar. Recebe-se integral o benefício mais vantajoso e uma parte do outro.", "fonte": "EC 103/2019, art. 24, § 1º; Dec. 3.048/1999, art. 167-A, I a III; IN 128/2022, art. 641, I a III", "origem": "doutrina-pensao-e-acumulacao.md §10 (Vedação e hipóteses)", "sinal": "firme"}, {"id": "acu-002", "tema": "Acumulação de benefícios", "pergunta": "Quanto é cortado quando acumula pensão e aposentadoria?", "variantes": ["faixas de redução da acumulação", "redutor da pensão", "quanto recebo do segundo benefício"], "resposta": "O benefício mais vantajoso é pago integral. Do outro, recebe-se 60% do valor entre 1 e 2 salários mínimos, 40% entre 2 e 3, 20% entre 3 e 4 e 10% acima de 4, somando as faixas. A parte até 1 salário mínimo não aparece na letra da regra do RGPS (Regime Geral de Previdência Social); recebê-la a 100% é leitura favorável, apoiada em orientação do Ministério da Previdência Social de 05/01/2026.", "fonte": "EC 103/2019, art. 24, § 2º; Dec. 3.048/1999, art. 167-A, § 1º; IN 128/2022, art. 641, § 1º", "origem": "doutrina-pensao-e-acumulacao.md §10 (Redutor)", "sinal": "controvertido"}, {"id": "acu-003", "tema": "Acumulação de benefícios", "pergunta": "A parte até um salário mínimo do segundo benefício também é cortada?", "variantes": ["primeiro salário mínimo na acumulação", "faixa até um salário mínimo 100%", "redutor no primeiro mínimo"], "resposta": "O texto do RGPS (Regime Geral de Previdência Social) enumera só as quatro faixas acima de 1 salário mínimo. A faixa até 1 salário mínimo recebida a 100% e o uso do salário mínimo de cada pagamento constam só de norma dos regimes próprios e de orientação do Ministério da Previdência Social de 05/01/2026; no RGPS é leitura favorável, sem tese judicial.", "fonte": "EC 103/2019, art. 24, § 2º; Portaria MTP 1.467/2022, art. 165, § 3º, I, § 6º, III e IV, e § 8º", "origem": "doutrina-pensao-e-acumulacao.md §10 (Redutor; LACUNA c.1 e c.2)", "sinal": "controvertido"}, {"id": "acu-004", "tema": "Acumulação de benefícios", "pergunta": "Posso receber duas pensões de maridos diferentes?", "variantes": ["duas pensões de cônjuge", "viúva duas vezes acumula pensão", "pensão do primeiro e do segundo marido"], "resposta": "Não no RGPS (Regime Geral de Previdência Social): é vedado receber mais de uma pensão deixada por cônjuge ou companheiro, com opção expressa pela mais vantajosa. O INSS (Instituto Nacional do Seguro Social) ressalva óbitos até 28/04/1995.", "fonte": "Lei 8.213/1991, art. 124, VI; EC 103/2019, art. 24, caput; IN 128/2022, art. 639, VIII a X e § 2º", "origem": "doutrina-pensao-e-acumulacao.md §10 (Vedação e hipóteses)", "sinal": "firme"}, {"id": "acu-005", "tema": "Acumulação de benefícios", "pergunta": "Posso receber pensão do INSS e pensão do marido que era servidor público?", "variantes": ["pensão do INSS e pensão de servidor", "pensão de militar e do INSS", "duas pensões de regimes diferentes"], "resposta": "Sim, com redução. A pensão de cônjuge do RGPS (Regime Geral de Previdência Social) acumula com pensão de outro regime ou militar, pagando-se integral a mais vantajosa e a outra pelas faixas de 60%, 40%, 20% e 10%.", "fonte": "EC 103/2019, art. 24, §§ 1º e 2º; Dec. 3.048/1999, art. 167-A, I", "origem": "doutrina-pensao-e-acumulacao.md §10 (Vedação e hipóteses; Redutor)", "sinal": "firme"}, {"id": "acu-006", "tema": "Acumulação de benefícios", "pergunta": "Já recebia os dois benefícios antes da reforma. Vão cortar?", "variantes": ["direito adquirido na acumulação", "acumulação antes de novembro de 2019", "redutor vale para quem já recebia"], "resposta": "Não. As restrições da EC (Emenda Constitucional) 103/2019 não alcançam quem tinha direito adquirido até 13/11/2019; o decreto e o INSS (Instituto Nacional do Seguro Social) exigem esse direito quanto a ambos os benefícios. Se um dos benefícios mudar depois, a revisão do redutor pode ser pedida a qualquer tempo.", "fonte": "EC 103/2019, art. 24, §§ 3º e 4º; Dec. 3.048/1999, art. 167-A, §§ 2º e 4º; IN 128/2022, art. 641, §§ 2º e 4º", "origem": "doutrina-pensao-e-acumulacao.md §10 (Direito adquirido e opção; Redutor)", "sinal": "firme"}, {"id": "acu-007", "tema": "Acumulação de benefícios", "pergunta": "Quais benefícios do INSS não podem ser recebidos juntos?", "variantes": ["o que não acumula no INSS", "duas aposentadorias juntas", "auxílio-doença e aposentadoria juntos", "seguro-desemprego e pensão"], "resposta": "Salvo direito adquirido, não se acumulam: aposentadoria e auxílio-doença; mais de uma aposentadoria; aposentadoria e abono de permanência; salário-maternidade e auxílio-doença; mais de um auxílio-acidente; mais de uma pensão deixada por cônjuge ou companheiro. O seguro-desemprego não acumula com benefício previdenciário, exceto pensão por morte ou auxílio-acidente.", "fonte": "Lei 8.213/1991, art. 124, I a VI e par. único", "origem": "03_TESES/legislacao/leis/Lei-8213-1991_planos-de-beneficios-previdencia.htm (art. 124); doutrina-pensao-e-acumulacao.md §10", "sinal": "firme"}, {"id": "acu-008", "tema": "Acumulação de benefícios", "pergunta": "Tenho direito a uma cota de pensão pequena e ao LOAS. Posso ficar com o LOAS?", "variantes": ["renunciar à pensão para ter o BPC", "trocar pensão pelo LOAS", "pensão baixa e benefício assistencial"], "resposta": "Sim. Preenchidos os requisitos dos dois, cabe a opção pelo mais vantajoso, e o dependente pode renunciar à cota de pensão, a qualquer tempo, para receber o BPC (benefício de prestação continuada) da LOAS (Lei Orgânica da Assistência Social).", "fonte": "Lei 8.742/1993, art. 20, § 4º; TNU Temas 253 e 284; TNU TF-136 e TF-148", "origem": "doutrina-pensao-e-acumulacao.md §10 (Benefício assistencial)", "sinal": "firme"}, {"id": "acu-009", "tema": "Acumulação de benefícios", "pergunta": "Pensão de trabalhador rural acumula com aposentadoria por invalidez?", "variantes": ["pensão rural e aposentadoria por invalidez", "aposentado por invalidez recebe pensão rural"], "resposta": "Sim. A TNU (Turma Nacional de Uniformização) entende que não há vedação legal, porque os dois benefícios têm pressupostos e fatos geradores distintos.", "fonte": "TNU Súmula 36", "origem": "doutrina-pensao-e-acumulacao.md §9 (Duração e cessação das cotas)", "sinal": "firme"}, {"id": "acu-010", "tema": "Acumulação de benefícios", "pergunta": "Criança sob guarda pode receber pensão dos pais e do guardião?", "variantes": ["menor sob guarda duas pensões", "pensão do avô guardião e do pai"], "resposta": "Só por determinação judicial: o menor sob guarda acumula a pensão dos pais biológicos com a de um guardião apenas se a Justiça determinar. A regra está só em instrução normativa do INSS (Instituto Nacional do Seguro Social).", "fonte": "IN 128/2022, art. 645", "origem": "doutrina-pensao-e-acumulacao.md §10 (Direito adquirido e opção)", "sinal": "firme"}, {"id": "out-001", "tema": "Salário-maternidade e outros", "pergunta": "Por quanto tempo é pago o salário-maternidade?", "variantes": ["licença-maternidade do INSS dura quanto", "quando começa o salário-maternidade", "bebê internado prorroga o salário-maternidade"], "resposta": "Por 120 dias, com início entre 28 dias antes do parto e a data do parto. Se a mãe ou o recém-nascido ficar internado por mais de 2 semanas por complicações do parto, é pago durante a internação e por mais 120 dias após a alta, descontado o que foi recebido antes do parto.", "fonte": "Lei 8.213/1991, art. 71, caput e § 3º", "origem": "03_TESES/legislacao/leis/Lei-8213-1991_planos-de-beneficios-previdencia.htm (art. 71); legislacao-pos-2019.md §2 (Lei 15.222/2025)", "sinal": "firme"}, {"id": "out-002", "tema": "Salário-maternidade e outros", "pergunta": "Precisa ter um mínimo de contribuições para o salário-maternidade?", "variantes": ["carência do salário-maternidade", "10 contribuições para o salário-maternidade", "autônoma tem direito ao salário-maternidade"], "resposta": "Não. A lei previa carência de 10 contribuições para algumas seguradas, mas o STF (Supremo Tribunal Federal) declarou inconstitucional a carência do salário-maternidade.", "fonte": "Lei 8.213/1991, art. 25, III; STF ADIs 2.110 e 2.111", "origem": "doutrina-previdenciaria.md §6 (Carência)", "sinal": "firme"}, {"id": "out-003", "tema": "Salário-maternidade e outros", "pergunta": "Quem adota tem direito ao salário-maternidade?", "variantes": ["salário-maternidade na adoção", "pai adotante recebe salário-maternidade", "guarda para adoção"], "resposta": "Sim. O segurado ou segurada que adotar ou obtiver guarda judicial para fins de adoção de criança recebe 120 dias, pagos diretamente pela Previdência Social. Não pode ser concedido a mais de um segurado no mesmo processo de adoção ou guarda, ressalvado o pagamento à mãe biológica.", "fonte": "Lei 8.213/1991, art. 71-A, caput, §§ 1º e 2º", "origem": "03_TESES/legislacao/leis/Lei-8213-1991_planos-de-beneficios-previdencia.htm (art. 71-A)", "sinal": "firme"}, {"id": "out-004", "tema": "Salário-maternidade e outros", "pergunta": "Em quanto tempo o INSS tem que liberar o salário-maternidade?", "variantes": ["INSS demora no salário-maternidade", "prazo do INSS para o salário-maternidade", "concessão automática do salário-maternidade"], "resposta": "O salário-maternidade pago diretamente pela Previdência deve ser concedido em até 30 dias do requerimento; se o prazo não for cumprido, a concessão é provisória e automática. Os valores recebidos na concessão provisória não precisam ser devolvidos, salvo má-fé comprovada. A regra vale desde 25/05/2026.", "fonte": "Lei 8.213/1991, art. 73-A (incluído pela Lei 15.415/2026), caput e §§ 1º a 3º", "origem": "legislacao-pos-2019.md §3 (Lei 15.415/2026)", "sinal": "firme"}, {"id": "out-005", "tema": "Salário-maternidade e outros", "pergunta": "A família de quem foi preso tem direito a algum benefício?", "variantes": ["auxílio-reclusão quem tem direito", "benefício para família de presidiário", "preso no semiaberto dá auxílio-reclusão", "valor da baixa renda do auxílio-reclusão"], "resposta": "Sim, o auxílio-reclusão, devido aos dependentes nas condições da pensão por morte. O preso precisa ter cumprido carência de 24 contribuições, ser de baixa renda, estar em regime fechado e não receber remuneração da empresa nem auxílio-doença, pensão, salário-maternidade, aposentadoria ou abono de permanência. Em 2026, o limite de baixa renda é de R$ 1.980,38.", "fonte": "Lei 8.213/1991, art. 25, IV, e art. 80; Portaria Interministerial MPS/MF 13/2026, art. 5º", "origem": "doutrina-previdenciaria.md §6 (Carência) e §4 (Valores de 2026); legislacao-pos-2019.md §3 (Lei 13.846/2019)", "sinal": "firme"}, {"id": "out-006", "tema": "Salário-maternidade e outros", "pergunta": "Quanto é o salário-família?", "variantes": ["valor do salário-família 2026", "cota do salário-família por filho", "limite de salário para ter salário-família"], "resposta": "Em 2026, R$ 67,54 por cota, com limite de remuneração de R$ 1.980,38.", "fonte": "Portaria Interministerial MPS/MF 13/2026, art. 4º", "origem": "doutrina-previdenciaria.md §4 (Valores de 2026)", "sinal": "firme"}, {"id": "prof-001", "tema": "Professor", "pergunta": "Professor se aposenta mais cedo?", "variantes": ["professora tem aposentadoria especial?", "quantos anos de sala de aula precisa para aposentar", "idade mínima do professor depois da reforma"], "resposta": "Sim. Pela regra permanente da EC (Emenda Constitucional) 103/2019, o professor se aposenta com 57 anos (mulher) ou 60 (homem) e 25 anos de efetivo exercício de magistério na educação infantil, no ensino fundamental ou no médio, para ambos os sexos. A renda é de 60% da média mais 2 pontos percentuais por ano de contribuição acima de 15 (mulher) ou 20 (homem). Quem já estava contribuindo antes de 13/11/2019 pode ter regra de transição melhor.", "fonte": "CF, art. 201, § 8º; EC 103/2019, art. 19, § 1º, II; Dec. 3.048, art. 54; IN 128, art. 250", "origem": "doutrina-professor-pcd-fator.md §2-A.1", "sinal": "firme"}, {"id": "prof-002", "tema": "Professor", "pergunta": "Completei o tempo de professora antes da reforma. Preciso de idade mínima?", "variantes": ["tinha 25 anos de magistério em 2019", "direito adquirido do professor", "professor que fechou o tempo antes de 13/11/2019"], "resposta": "Não. Quem completou 25 anos de magistério (mulher) ou 30 (homem) até 13/11/2019 se aposenta sem idade mínima, cumprida a carência. A renda é 100% do SB (salário de benefício), calculado pelos 80% maiores salários, multiplicado pelo fator previdenciário com bônus de 10 anos (professora) ou 5 (professor) no tempo. O fator é afastado se a soma de idade e tempo atingir os pontos da regra 85/95 mais 5 pontos.", "fonte": "IN 128, arts. 229, 233, IV, a, e 251; Lei 8.213, arts. 29, § 9º, 29-C, § 3º, e 56; Dec. 3.048, art. 188-E, §§ 5º, 9º e 10", "origem": "doutrina-professor-pcd-fator.md §2-A.1", "sinal": "firme"}, {"id": "prof-003", "tema": "Professor", "pergunta": "Como funciona a regra de pontos do professor?", "variantes": ["pontuação professora 2026", "idade mais tempo de magistério", "transição por pontos do professor"], "resposta": "Exige 25 anos de magistério (mulher) ou 30 (homem) e a soma de idade e tempo de contribuição de 88 pontos para a professora e 98 para o professor em 2026. A renda é de 60% da média mais 2 pontos percentuais por ano acima de 15 (mulher) ou 20 (homem). Pontos e idade se apuram em dias.", "fonte": "EC 103/2019, art. 15, § 3º; Dec. 3.048, art. 188-M; IN 128, arts. 233, IV, c, e 252", "origem": "doutrina-professor-pcd-fator.md §2-A.1", "sinal": "firme"}, {"id": "prof-004", "tema": "Professor", "pergunta": "Qual a idade mínima do professor na transição em 2026?", "variantes": ["idade progressiva do professor", "professora com 54 anos e meio pode aposentar?", "transição por idade mínima magistério"], "resposta": "Em 2026, a transição por idade mínima exige 54 anos e 6 meses (professora) ou 59 anos e 6 meses (professor), além do tempo de magistério. A renda é de 60% da média mais 2 pontos percentuais por ano acima de 15 (mulher) ou 20 (homem).", "fonte": "EC 103/2019, art. 16, § 2º; Dec. 3.048, art. 188-N; IN 128, art. 253", "origem": "doutrina-professor-pcd-fator.md §2-A.1", "sinal": "firme"}, {"id": "prof-005", "tema": "Professor", "pergunta": "O professor tem regra de pedágio?", "variantes": ["pedágio de 100% professor", "professora com 52 anos", "regra do pedágio para quem dá aula"], "resposta": "Sim. Pelo pedágio de 100%, a professora se aposenta com 52 anos e o professor com 55, com 25 ou 30 anos de magistério mais 100% do tempo que faltava em 13/11/2019. A renda é 100% do SB (salário de benefício).", "fonte": "EC 103/2019, art. 20, § 1º; Dec. 3.048, art. 188-O; IN 128, arts. 233, IV, e, e 254", "origem": "doutrina-professor-pcd-fator.md §2-A.1", "sinal": "firme"}, {"id": "prof-006", "tema": "Professor", "pergunta": "Fui diretora e coordenadora da escola. Esse tempo conta como magistério?", "variantes": ["vice-diretor conta como professor?", "coordenação pedagógica conta", "tempo fora da sala de aula na escola", "orientador educacional"], "resposta": "Sim. Função de magistério é a docência mais a direção de unidade escolar e a coordenação e o assessoramento pedagógicos em estabelecimento de educação básica, exercidas por professor admitido para a função. Especialistas em educação que não são professores ficam fora (STF (Supremo Tribunal Federal), ADI (ação direta de inconstitucionalidade) 3.772).", "fonte": "Lei 9.394/1996, art. 67, § 2º; Dec. 3.048, art. 54, § 2º; IN 128, art. 214; STF ADI 3.772", "origem": "doutrina-professor-pcd-fator.md §2-A.1", "sinal": "firme"}, {"id": "prof-007", "tema": "Professor", "pergunta": "Professor de faculdade tem a aposentadoria de professor?", "variantes": ["ensino superior conta como magistério?", "professor universitário aposenta mais cedo", "dou aula em curso EAD, conta?"], "resposta": "Não. A redução vale só para a educação básica (infantil, fundamental e média, presencial ou a distância); o ensino superior fica fora. A exceção é o bônus da EC (Emenda Constitucional) 20/1998 para quem tinha magistério até 16/12/1998.", "fonte": "IN 128, art. 214, §§ 1º e 2º, e art. 251, § 1º", "origem": "doutrina-professor-pcd-fator.md §2-A.1", "sinal": "firme"}, {"id": "prof-008", "tema": "Professor", "pergunta": "Licença, férias e afastamento por doença contam no tempo de professor?", "variantes": ["licença-maternidade conta como magistério", "auxílio-doença no meio da carreira de professora", "licença-prêmio conta"], "resposta": "Sim. Contam férias, descansos, licença-prêmio, salário-maternidade e benefício por incapacidade entre períodos de magistério. O benefício acidentário conta até 30/06/2020 mesmo não intercalado e, desde 01/07/2020, só se intercalado com magistério. Também conta o tempo de professor auxiliar.", "fonte": "IN 128, art. 214, red. IN 141/2022", "origem": "doutrina-professor-pcd-fator.md §2-A.1", "sinal": "firme"}, {"id": "prof-009", "tema": "Professor", "pergunta": "Dá para converter o tempo de professor em tempo comum?", "variantes": ["transformar magistério em tempo normal", "acréscimo no tempo de professor", "converter tempo de professora para aposentadoria comum"], "resposta": "Não. É vedada a conversão do tempo de magistério em tempo comum, exercido em qualquer época. A TNU (Turma Nacional de Uniformização) fixou que não há conversão após a EC (Emenda Constitucional) 18/1981.", "fonte": "Dec. 3.048, art. 54, § 4º; IN 128, art. 255, § 2º; TNU Tema 158", "origem": "doutrina-professor-pcd-fator.md §2-A.1", "sinal": "firme"}, {"id": "prof-010", "tema": "Professor", "pergunta": "Trabalhei em outra profissão antes de dar aula. Esse tempo ajuda?", "variantes": ["tempo de comércio soma com magistério?", "tempo fora da escola conta para professor", "fui bancária e depois professora"], "resposta": "Não soma ao requisito de tempo de magistério, mas os salários desse período entram na média do benefício (PBC, período básico de cálculo).", "fonte": "IN 128, art. 255, § 1º", "origem": "doutrina-professor-pcd-fator.md §2-A.1", "sinal": "firme"}, {"id": "prof-011", "tema": "Professor", "pergunta": "O tempo fora do magistério entra no fator previdenciário do professor?", "variantes": ["fator do professor com tempo de outra atividade", "tempo comum melhora o fator da professora"], "resposta": "Há decisão favorável da TNU (Turma Nacional de Uniformização), julgada em 15/04/2026, mandando somar o tempo fora do magistério no fator previdenciário do professor, mas sem data de trânsito em julgado conhecida. É tese ainda não consolidada.", "fonte": "TNU TF-019 e TF-020 (PUILs 5000356-41.2024.4.04.7138/RS e 5007233-87.2024.4.04.7108/RS)", "origem": "doutrina-professor-pcd-fator.md §2-A.1; catalogo-temas-vinculantes-2.md §4.2", "sinal": "controvertido"}, {"id": "prof-012", "tema": "Professor", "pergunta": "O professor paga fator previdenciário?", "variantes": ["fator na aposentadoria do professor", "dá para tirar o fator da professora?", "professor fator previdenciário STJ"], "resposta": "Sim, quando os requisitos foram completados a partir de 29/11/1999 (STJ (Superior Tribunal de Justiça) Tema 1.011; STF (Supremo Tribunal Federal) Tema 1.091). Só não incide se todos os requisitos estavam completos antes da Lei 9.876/1999. No cálculo, o professor ganha 5 anos e a professora 10 anos a mais no tempo. Depois da EC (Emenda Constitucional) 103/2019, o fator só aparece no direito adquirido e no art. 17, que não tem versão para professor.", "fonte": "STJ Tema 1.011; STF Tema 1.091; TNU Tema 149; Lei 8.213, art. 29, § 9º, II e III; EC 103/2019, arts. 17 e 26", "origem": "doutrina-professor-pcd-fator.md §2-A.1", "sinal": "firme"}, {"id": "prof-013", "tema": "Professor", "pergunta": "Professor que tinha tempo antes de 1998 tem algum acréscimo?", "variantes": ["bônus de 17% professor", "acréscimo de 20% professora", "bônus da EC 20 magistério"], "resposta": "Sim. Quem tinha magistério até 16/12/1998 e opta pela aposentadoria comum com 35 anos (homem) ou 30 (mulher) exclusivamente em funções de magistério recebe acréscimo de 17% (homem) ou 20% (mulher) sobre esse tempo. A regra da EC (Emenda Constitucional) 20/1998 foi revogada pela EC 103/2019 e vale como direito adquirido; aqui conta também o ensino superior.", "fonte": "EC 20/1998, art. 9º, § 2º; IN 128, art. 251, § 1º", "origem": "doutrina-professor-pcd-fator.md §2-A.1", "sinal": "firme"}, {"id": "pcd-001", "tema": "Pessoa com deficiência", "pergunta": "Quem é considerado pessoa com deficiência para aposentar?", "variantes": ["minha doença conta como deficiência?", "o que é deficiência para o INSS", "deficiência leve dá aposentadoria?"], "resposta": "É quem tem impedimento de longo prazo, de 2 anos ininterruptos, de natureza física, mental, intelectual ou sensorial que, junto com barreiras, dificulta a participação plena na sociedade. A condição e o grau são fixados por avaliação do INSS (Instituto Nacional do Seguro Social).", "fonte": "LC 142/2013, art. 2º; IN 128, art. 303; Portaria Interministerial 1/2014, art. 3º", "origem": "doutrina-professor-pcd-fator.md §2-A.2", "sinal": "firme"}, {"id": "pcd-002", "tema": "Pessoa com deficiência", "pergunta": "Quanto tempo a pessoa com deficiência precisa contribuir para aposentar por tempo?", "variantes": ["aposentadoria PcD por tempo de contribuição", "deficiência grave quantos anos", "LC 142 tempo moderada leve"], "resposta": "Depende do grau, em tempo de contribuição na condição de PcD (pessoa com deficiência): grave, 20 anos (mulher) ou 25 (homem); moderada, 24 ou 29; leve, 28 ou 33. Exige carência e a condição de PcD na DER (data de entrada do requerimento) ou na data em que completou os requisitos. A renda é 100% do SB (salário de benefício).", "fonte": "LC 142/2013, arts. 3º, I a III, e 8º; Dec. 3.048, arts. 70-A, 70-B e 70-J; IN 128, art. 314", "origem": "doutrina-professor-pcd-fator.md §2-A.2", "sinal": "firme"}, {"id": "pcd-003", "tema": "Pessoa com deficiência", "pergunta": "A pessoa com deficiência se aposenta por idade mais cedo?", "variantes": ["aposentadoria por idade PcD", "55 anos mulher com deficiência", "idade da pessoa com deficiência"], "resposta": "Sim. Aos 55 anos (mulher) ou 60 (homem), com 15 anos de contribuição na condição de PcD (pessoa com deficiência), em qualquer grau. A renda é de 70% do SB (salário de benefício) mais 1 ponto percentual por grupo de 12 contribuições, até mais 30%.", "fonte": "LC 142/2013, arts. 3º, IV, e 8º; Dec. 3.048, arts. 70-C, § 1º, e 70-J; IN 128, art. 311; TNU TF-233 e TF-235", "origem": "doutrina-professor-pcd-fator.md §2-A.2", "sinal": "firme"}, {"id": "pcd-004", "tema": "Pessoa com deficiência", "pergunta": "Como é a avaliação da deficiência no INSS?", "variantes": ["perícia da pessoa com deficiência", "assistente social na aposentadoria PcD", "IF-BrA o que é"], "resposta": "É biopsicossocial: médico e assistente social pontuam 41 atividades em 7 domínios (25, 50, 75 ou 100 pontos cada) pelo IF-BrA (Índice de Funcionalidade Brasileiro Aplicado), e o grau sai da soma das duas avaliações, entre 2.050 e 8.200 pontos. A perícia também fixa a data provável de início e as mudanças de grau.", "fonte": "CF, art. 201, § 1º, I; LC 142/2013, arts. 4º e 5º; Dec. 3.048, arts. 70-A e 70-D; IN 128, art. 305; Portaria Interministerial 1/2014, art. 2º, § 1º, e Anexo", "origem": "doutrina-professor-pcd-fator.md §2-A.2", "sinal": "firme"}, {"id": "pcd-005", "tema": "Pessoa com deficiência", "pergunta": "Quantos pontos definem deficiência grave, moderada ou leve?", "variantes": ["pontuação do IF-BrA", "faixa de pontos deficiência", "deficiência insuficiente"], "resposta": "No IF-BrA (Índice de Funcionalidade Brasileiro Aplicado): grave até 5.739 pontos; moderada de 5.740 a 6.354; leve de 6.355 a 7.584; a partir de 7.585 a deficiência é insuficiente para a aposentadoria.", "fonte": "Portaria Interministerial SDH/MPS/MF/MOG/AGU 1/2014, Anexo, itens 4.a, 4.d e 4.e", "origem": "doutrina-professor-pcd-fator.md §2-A.2", "sinal": "firme"}, {"id": "pcd-006", "tema": "Pessoa com deficiência", "pergunta": "Fiquei com deficiência depois de anos trabalhando. Posso usar a aposentadoria da pessoa com deficiência?", "variantes": ["deficiência adquirida no meio da vida", "acidente que deixou sequela e aposentadoria PcD", "tempo antes da deficiência conta?", "mudou o grau da deficiência"], "resposta": "Sim. Com deficiência que surgiu depois ou com mudança de grau, os tempos são convertidos proporcionalmente e somados pelo grau preponderante, que é o de maior tempo. Se na DER (data de entrada do requerimento) a pessoa já não tiver a condição de PcD (pessoa com deficiência), pode sair a aposentadoria comum com os períodos convertidos.", "fonte": "LC 142/2013, art. 7º; Dec. 3.048, art. 70-E, §§ 1º e 2º; IN 128, art. 309, §§ 3º e 4º, e Anexo XVIII", "origem": "doutrina-professor-pcd-fator.md §2-A.2", "sinal": "firme"}, {"id": "pcd-007", "tema": "Pessoa com deficiência", "pergunta": "Como provo que já tinha deficiência anos atrás?", "variantes": ["testemunha prova deficiência antiga?", "deficiência antes de 2013", "prova da deficiência no passado"], "resposta": "Por documentos; é vedada a prova exclusivamente testemunhal. A LC (Lei Complementar) 142/2013 entrou em vigor em 09/11/2013, e a deficiência anterior a essa data também se prova documentalmente.", "fonte": "LC 142/2013, arts. 6º, § 2º, e 11; Dec. 3.048, art. 70-D, § 1º", "origem": "doutrina-professor-pcd-fator.md §2-A.2", "sinal": "firme"}, {"id": "pcd-008", "tema": "Pessoa com deficiência", "pergunta": "O perito fez só exame médico, sem o questionário. Vale?", "variantes": ["laudo sem IF-BrA", "perícia judicial da pessoa com deficiência sem assistente social", "visão monocular perícia"], "resposta": "Não deveria valer: a perícia administrativa ou judicial da PcD (pessoa com deficiência) não dispensa o IF-BrA (Índice de Funcionalidade Brasileiro Aplicado), inclusive na visão monocular, segundo teses da TNU (Turma Nacional de Uniformização). Laudo sem ele pode ser impugnado.", "fonte": "TNU TF-234, TF-351, TF-440, TF-051 e TF-251", "origem": "doutrina-professor-pcd-fator.md §2-A.2", "sinal": "firme"}, {"id": "pcd-009", "tema": "Pessoa com deficiência", "pergunta": "Tenho tempo especial e deficiência. Posso juntar os dois?", "variantes": ["insalubridade e deficiência juntas", "tempo especial na aposentadoria PcD", "converter especial para deficiência"], "resposta": "Em parte. O tempo especial pode contar como tempo de PcD (pessoa com deficiência) só na aposentadoria por tempo, se for mais favorável, só para períodos até 13/11/2019 e sem aplicar as duas reduções no mesmo período. O tempo de PcD não se converte para a aposentadoria especial.", "fonte": "LC 142/2013, art. 10; Dec. 3.048, art. 70-F e § 1º; IN 128, art. 310, §§ 1º e 2º, e Anexo XIX", "origem": "doutrina-professor-pcd-fator.md §2-A.2", "sinal": "firme"}, {"id": "pcd-010", "tema": "Pessoa com deficiência", "pergunta": "Na aposentadoria da pessoa com deficiência tem fator previdenciário?", "variantes": ["fator na aposentadoria PcD", "fator reduz aposentadoria da pessoa com deficiência?"], "resposta": "Só se aumentar a renda, pela LC (Lei Complementar) 142/2013. O INSS (Instituto Nacional do Seguro Social) aplica essa garantia apenas a quem tinha direito até 13/11/2019; para DIB (data de início do benefício) posterior a leitura do INSS é contrária, e a lei complementar não traz esse limite no tempo.", "fonte": "LC 142/2013, art. 9º, I; Dec. 3.048, art. 188-E, § 6º; IN 128, art. 229, § 2º, II", "origem": "doutrina-professor-pcd-fator.md §2-A.2", "sinal": "controvertido"}, {"id": "pcd-011", "tema": "Pessoa com deficiência", "pergunta": "A média da aposentadoria da pessoa com deficiência descarta os menores salários?", "variantes": ["80% maiores salários PcD", "cálculo da aposentadoria PcD depois da reforma", "média de 100% dos salários deficiente"], "resposta": "Está em julgamento. O INSS (Instituto Nacional do Seguro Social) usa a média de 100% dos salários desde 07/1994; a tese do segurado é a média dos 80% maiores, pela LC (Lei Complementar) 142/2013 e pela EC (Emenda Constitucional) 103/2019, art. 22. A TNU (Turma Nacional de Uniformização) afetou a questão no Tema 389 em 11/02/2026, ainda sem tese.", "fonte": "LC 142/2013, art. 8º; EC 103/2019, art. 22; Dec. 3.048, arts. 32 e 70-J; TNU Tema 389", "origem": "doutrina-professor-pcd-fator.md §2-A.2; catalogo-temas-vinculantes-2.md §4.1", "sinal": "controvertido"}, {"id": "pcd-012", "tema": "Pessoa com deficiência", "pergunta": "Aposentado como pessoa com deficiência pode continuar trabalhando ou escolher outra aposentadoria?", "variantes": ["posso trabalhar depois da aposentadoria PcD?", "aposentadoria da LC 142 e emprego", "PcD pode optar por outra aposentadoria mais vantajosa"], "resposta": "Sim nos dois casos. O aposentado pela LC (Lei Complementar) 142/2013 pode seguir trabalhando, e a PcD (pessoa com deficiência) pode optar por qualquer outra aposentadoria mais vantajosa.", "fonte": "IN 128, art. 306; LC 142/2013, art. 9º, V; Dec. 3.048, art. 70-G", "origem": "doutrina-professor-pcd-fator.md §2-A.2", "sinal": "firme"}, {"id": "pcd-013", "tema": "Pessoa com deficiência", "pergunta": "A carência toda precisa ser como pessoa com deficiência?", "variantes": ["180 contribuições já com deficiência?", "carência na aposentadoria PcD por tempo"], "resposta": "Não, na aposentadoria por tempo: exige-se a carência e a condição de PcD (pessoa com deficiência) na DER (data de entrada do requerimento) ou na data dos requisitos, sem exigir que a carência seja toda cumprida com deficiência. Na aposentadoria por idade, os 15 anos de contribuição precisam ser na condição de PcD.", "fonte": "LC 142/2013, art. 3º; IN 128, arts. 311 e 314, §§ 2º e 3º", "origem": "doutrina-professor-pcd-fator.md §2-A.2", "sinal": "firme"}, {"id": "fat-001", "tema": "Fator previdenciário", "pergunta": "O que é o fator previdenciário?", "variantes": ["por que minha aposentadoria veio menor", "fórmula do fator", "fator e expectativa de vida"], "resposta": "É um multiplicador da média que leva em conta o tempo de contribuição, a idade e a expectativa de sobrevida na aposentadoria, pela tábua do IBGE (Instituto Brasileiro de Geografia e Estatística), média nacional única para ambos os sexos. A fórmula é f = (Tc × 0,31 ÷ Es) × [1 + (Id + Tc × 0,31) ÷ 100].", "fonte": "Lei 9.876/1999, Anexo; Lei 8.213, art. 29, § 8º; Dec. 3.048, art. 188-E, §§ 2º e 3º", "origem": "doutrina-professor-pcd-fator.md §2-A.3", "sinal": "firme"}, {"id": "fat-002", "tema": "Fator previdenciário", "pergunta": "O fator previdenciário ainda existe depois da reforma?", "variantes": ["fator acabou em 2019?", "quem ainda paga fator", "fator no pedágio de 50%"], "resposta": "Sim, em dois casos: no direito adquirido até 13/11/2019 e na transição do art. 17 da EC (Emenda Constitucional) 103/2019, onde é obrigatório e não há a regra 85/95. Nas demais regras da reforma o fator não se aplica.", "fonte": "EC 103/2019, arts. 17, par. único, e 26; Dec. 3.048, art. 188-K, §§ 2º e 3º; IN 128, art. 229, § 1º", "origem": "doutrina-professor-pcd-fator.md §2-A.1 e §2-A.3", "sinal": "firme"}, {"id": "fat-003", "tema": "Fator previdenciário", "pergunta": "O que é a regra 85/95?", "variantes": ["regra 86/96", "pontos para tirar o fator", "soma idade e tempo sem fator"], "resposta": "É a soma de idade e tempo de contribuição, incluídas as frações em meses completos, que afasta o fator previdenciário, com tempo mínimo de 35 anos (homem) ou 30 (mulher). Depois da EC (Emenda Constitucional) 103/2019 só vale para quem completou até 13/11/2019: 95/85 de 18/06/2015 a 30/12/2018 e 96/86 de 31/12/2018 a 13/11/2019. O professor tem mais 5 pontos.", "fonte": "Lei 8.213, art. 29-C, red. Lei 13.183/2015; Dec. 3.048, art. 188-E, §§ 8º a 10", "origem": "doutrina-professor-pcd-fator.md §2-A.3", "sinal": "firme"}, {"id": "fat-004", "tema": "Fator previdenciário", "pergunta": "Mulher tem vantagem no cálculo do fator?", "variantes": ["bônus de 5 anos da mulher no fator", "professora ganha tempo no fator"], "resposta": "Sim. No fator previdenciário somam-se 5 anos ao tempo da mulher, 5 ao do professor e 10 ao da professora com tempo exclusivo de magistério na educação básica.", "fonte": "Lei 8.213, art. 29, § 9º; Dec. 3.048, art. 188-E, § 5º", "origem": "doutrina-professor-pcd-fator.md §2-A.3", "sinal": "firme"}, {"id": "fat-005", "tema": "Fator previdenciário", "pergunta": "Na aposentadoria por idade tem fator?", "variantes": ["fator reduz aposentadoria por idade?", "fator opcional"], "resposta": "Só se aumentar a renda: na aposentadoria por idade o fator previdenciário é opcional.", "fonte": "Lei 9.876/1999, art. 7º; Dec. 3.048, art. 188-E, § 7º", "origem": "doutrina-professor-pcd-fator.md §2-A.3", "sinal": "firme"}, {"id": "fat-006", "tema": "Fator previdenciário", "pergunta": "Dá para tirar o fator da minha aposentadoria na Justiça?", "variantes": ["ação para afastar o fator", "fator é inconstitucional?", "revisão do fator previdenciário"], "resposta": "Não. O STF (Supremo Tribunal Federal) declarou o fator previdenciário constitucional (Tema 1.091, trânsito em 27/06/2020). Ele só deixa de valer quando a própria regra da aposentadoria não o usa.", "fonte": "STF Tema 1.091", "origem": "doutrina-professor-pcd-fator.md §2-A.3; parecer-de-revisao-ao-cliente.md §6", "sinal": "firme"}, {"id": "fat-007", "tema": "Fator previdenciário", "pergunta": "Qual tabela de expectativa de vida vale no meu fator?", "variantes": ["tábua do IBGE do ano em que completei o tempo", "pedi depois e o fator piorou"], "resposta": "Vale a tábua do IBGE (Instituto Brasileiro de Geografia e Estatística) publicada até a DER (data de entrada do requerimento), não a da data em que os requisitos foram completados (TNU (Turma Nacional de Uniformização) Tema 25). O IBGE publica a nova tábua até 1º de dezembro de cada ano.", "fonte": "Dec. 3.048, art. 188-E, § 4º; Dec. 3.266/1999, art. 2º; TNU Tema 25", "origem": "doutrina-professor-pcd-fator.md §2-A.3", "sinal": "firme"}, {"id": "fat-008", "tema": "Fator previdenciário", "pergunta": "Tempo rural antigo conta no fator e nos pontos?", "variantes": ["roça antes de 1991 melhora o fator?", "tempo rural na regra 85/95"], "resposta": "Sim, segundo precedentes da TNU (Turma Nacional de Uniformização) fora do rito representativo: o tempo rural anterior à Lei 8.213/1991 conta no tempo do fator previdenciário e nos pontos da regra 85/95.", "fonte": "TNU PUILs 0038018-08.2017.4.01.3500/GO e 0002491-36.2015.4.03.6304/SP", "origem": "doutrina-professor-pcd-fator.md §2-A.3", "sinal": "firme"}, {"id": "rev-001", "tema": "Revisão: prazos", "pergunta": "Até quando posso pedir revisão da aposentadoria?", "variantes": ["prazo de 10 anos para revisão", "minha aposentadoria tem 12 anos, ainda dá?", "decadência da revisão"], "resposta": "Até 10 anos, contados do dia primeiro do mês seguinte ao do recebimento da primeira prestação. Passado esse prazo, a revisão do cálculo da concessão acaba. Há exceções que não decaem, como a readequação aos tetos e o reajuste, e a revisão por reclamatória trabalhista tem prazo próprio.", "fonte": "Lei 8.213, art. 103, caput e I, red. Lei 13.846/2019", "origem": "doutrina-revisao.md §11.1", "sinal": "firme"}, {"id": "rev-002", "tema": "Revisão: prazos", "pergunta": "O INSS negou meu benefício há mais de 10 anos. Perdi o direito?", "variantes": ["benefício cortado há muito tempo", "indeferimento antigo tem prazo?", "cessação do benefício decadência"], "resposta": "Não perdeu o direito: indeferimento, cancelamento ou cessação não têm prazo de decadência, porque o STF (Supremo Tribunal Federal) derrubou essa regra na ADI (ação direta de inconstitucionalidade) 6.096, transitada em 03/08/2021. As parcelas, porém, só se cobram dos últimos 5 anos.", "fonte": "STF ADI 6.096; Lei 8.213, art. 103, par. único", "origem": "doutrina-revisao.md §11.1", "sinal": "firme"}, {"id": "rev-003", "tema": "Revisão: prazos", "pergunta": "Se eu ganhar a revisão, recebo atrasado de quantos anos?", "variantes": ["atrasados de 5 anos", "prescrição das parcelas", "recebo desde o começo da aposentadoria?"], "resposta": "Dos últimos 5 anos: as parcelas mais antigas prescrevem. O pedido administrativo suspende esse prazo, que volta a correr depois da ciência da decisão. Na revisão por reclamatória trabalhista, a TNU (Turma Nacional de Uniformização) entende que o prazo não corre durante a ação trabalhista (Tema 200), tese que vincula os Juizados Especiais Federais.", "fonte": "Lei 8.213, art. 103, par. único; Súm. 85/STJ; Dec. 20.910, art. 4º; TNU Tema 200", "origem": "doutrina-revisao.md §11.1 e §11.7; haack-prev-revisao SKILL §4 Etapa D", "sinal": "controvertido"}, {"id": "rev-004", "tema": "Revisão: prazos", "pergunta": "O INSS nem analisou um período meu. O prazo de 10 anos vale assim mesmo?", "variantes": ["ponto não apreciado pelo INSS decai?", "INSS esqueceu de analisar tempo especial", "tempo especial não reconhecido na concessão"], "resposta": "Sim. O prazo de 10 anos alcança também a questão que o INSS (Instituto Nacional do Seguro Social) não apreciou na concessão (STJ (Superior Tribunal de Justiça) Tema 975). Período especial ou outro tempo não reconhecido só se revisa dentro desse prazo.", "fonte": "STJ Tema 975; Lei 8.213, art. 103", "origem": "doutrina-revisao.md §11.1", "sinal": "firme"}, {"id": "rev-005", "tema": "Revisão: prazos", "pergunta": "Pedi revisão no INSS antes dos 10 anos. Isso segura o prazo?", "variantes": ["pedido administrativo interrompe decadência?", "revisão no INSS dentro do prazo", "Tema 1.370"], "resposta": "Não há certeza. Nenhum texto oficial diz que o pedido ao INSS (Instituto Nacional do Seguro Social) dentro do prazo suspende ou interrompe a decadência, e a questão está no STJ (Superior Tribunal de Justiça) Tema 1.370, em julgamento e sem tese. Se for decidida contra, só a ação na Justiça garante o prazo.", "fonte": "Lei 8.213, art. 103, II; Dec. 3.048, art. 347, II; STJ Tema 1.370", "origem": "doutrina-revisao.md §11.1; haack-prev-revisao SKILL §7", "sinal": "controvertido"}, {"id": "rev-006", "tema": "Revisão: prazos", "pergunta": "Recebo pensão do meu marido. Posso revisar a aposentadoria dele que gerou a pensão?", "variantes": ["revisão da pensão por morte pela aposentadoria do falecido", "prazo da revisão na pensão", "benefício derivado decadência"], "resposta": "Só se o prazo da aposentadoria dele não tiver acabado: a decadência conta da concessão do benefício originário e não se renova quando a pensão é concedida. A readequação aos tetos é exceção e não decai, inclusive na pensão.", "fonte": "TNU PUIL 0002460-53.2015.4.03.6324/SP; TNU PUILs 0507760-41.2019.4.05.8102 e 5087643-04.2021.4.02.5101", "origem": "doutrina-revisao.md §11.1 e §11.2", "sinal": "firme"}, {"id": "rev-007", "tema": "Revisão: prazos", "pergunta": "Minha aposentadoria é dos anos 90. Ainda dá para revisar o cálculo?", "variantes": ["benefício antigo antes de 1997", "aposentadoria de 1995 revisão", "revisão de benefício muito antigo"], "resposta": "Não, quanto ao cálculo da concessão: para benefício anterior a 1997, o prazo de 10 anos começou em 01/08/1997 (STF (Supremo Tribunal Federal) Tema 313) e já terminou. Pode sobrar a readequação aos tetos, que não decai, se a média foi limitada ao teto.", "fonte": "STF Tema 313; STJ Tema 544", "origem": "doutrina-revisao.md §11.1 e §11.3", "sinal": "firme"}, {"id": "rev-008", "tema": "Revisão: prazos", "pergunta": "Revisão do reajuste anual também tem prazo de 10 anos?", "variantes": ["reajuste errado do benefício", "decadência do reajustamento"], "resposta": "Não. A revisão de reajustamento não decai; só as parcelas mais antigas que 5 anos prescrevem.", "fonte": "IN 128, art. 594, I; Lei 8.213, art. 103, par. único", "origem": "doutrina-revisao.md §11.1", "sinal": "firme"}, {"id": "rev-009", "tema": "Revisão: tipos", "pergunta": "O que é a revisão do teto?", "variantes": ["readequação aos tetos de 1998 e 2003", "minha aposentadoria foi limitada ao teto", "revisão das emendas 20 e 41"], "resposta": "É ajustar a renda aos novos tetos de R$ 1.200,00 (EC (Emenda Constitucional) 20/1998) e R$ 2.400,00 (EC 41/2003) quando a média foi limitada ao teto da época (STF (Supremo Tribunal Federal) Tema 76). Alcança benefícios com DIB (data de início do benefício) até 31/12/2003, inclusive os de 05/10/1988 a 05/04/1991 (Tema 930), e não decai. Os atrasados contam da ação individual, não da ação civil pública (STJ (Superior Tribunal de Justiça) Tema 1.005).", "fonte": "EC 20/1998, art. 14; EC 41/2003, art. 5º; STF Temas 76 e 930; STJ Tema 1.005", "origem": "doutrina-revisao.md §11.2", "sinal": "firme"}, {"id": "rev-010", "tema": "Revisão: tipos", "pergunta": "Benefício anterior a 1988 tem revisão do teto?", "variantes": ["readequação de benefício antes da Constituição", "menor e maior valor-teto"], "resposta": "Ainda não é definitivo. O STJ (Superior Tribunal de Justiça) mandou aplicar o menor e o maior valor-teto (Tema 1.140, julgado em 14/08/2024), mas há recurso extraordinário pendente e sem trânsito. A limitação só ao menor valor-teto não basta (TNU (Turma Nacional de Uniformização)).", "fonte": "STJ Tema 1.140; TNU PUIL 0504607-40.2018.4.05.8100", "origem": "doutrina-revisao.md §11.2", "sinal": "controvertido"}, {"id": "rev-011", "tema": "Revisão: tipos", "pergunta": "Trabalhei em dois empregos ao mesmo tempo. O INSS somou os salários?", "variantes": ["atividades concomitantes", "dois vínculos no CNIS", "revisão de dupla atividade"], "resposta": "Deveria: os salários das atividades concomitantes se somam, respeitado o teto (STJ (Superior Tribunal de Justiça) Tema 1.070). O INSS (Instituto Nacional do Seguro Social) aplicava a regra antiga da múltipla atividade para DIB (data de início do benefício) anterior a 18/06/2019, e é isso que a revisão corrige. Vale para DIB de 29/11/1999 a 17/06/2019, dentro do prazo de 10 anos.", "fonte": "STJ Tema 1.070; Lei 8.213, art. 32, red. Lei 13.846/2019; IN 128, art. 225", "origem": "doutrina-revisao.md §11.5; fluxo-de-revisao.md §3", "sinal": "firme"}, {"id": "rev-012", "tema": "Revisão: tipos", "pergunta": "Tem salário errado ou faltando no meu CNIS. Dá para corrigir?", "variantes": ["erro no CNIS", "salário a menor no extrato do INSS", "vínculo faltando no CNIS"], "resposta": "Sim, com documentos contemporâneos: dados extemporâneos no CNIS (Cadastro Nacional de Informações Sociais) só se incluem ou corrigem com prova da época. Se o benefício já foi concedido, a correção que muda o cálculo segue o prazo de 10 anos da revisão.", "fonte": "Lei 8.213, arts. 29-A, §§ 2º, 3º e 5º, e 103; Dec. 3.048, arts. 19, § 2º, e 19-B", "origem": "doutrina-revisao.md §11.1 e §11.7", "sinal": "firme"}, {"id": "rev-013", "tema": "Revisão: tipos", "pergunta": "A empresa não recolheu meu INSS. Esse tempo conta?", "variantes": ["patrão não pagou o INSS", "salário sem recolhimento conta?"], "resposta": "Sim, para o empregado: os salários contam ainda que o empregador não tenha recolhido a contribuição.", "fonte": "Lei 8.213, art. 34, I", "origem": "doutrina-revisao.md §11.7", "sinal": "firme"}, {"id": "rev-014", "tema": "Revisão: tipos", "pergunta": "Fiquei em auxílio-doença no meio do período. Isso entra no cálculo da aposentadoria?", "variantes": ["auxílio-doença conta na média?", "benefício por incapacidade no cálculo", "invalidez precedida de auxílio-doença"], "resposta": "Sim, se o benefício foi intercalado com atividade ou contribuição: o valor conta como salário de contribuição. Não se aplica na transformação direta do auxílio-doença em aposentadoria por invalidez (STF (Supremo Tribunal Federal) Tema 88) nem na aposentadoria voluntária sem retorno ao trabalho depois do benefício (TNU (Turma Nacional de Uniformização)).", "fonte": "Lei 8.213, art. 29, § 5º; STF Tema 88; Súm. 557/STJ; TNU PUIL 0061252-98.2017.4.03.6301", "origem": "doutrina-revisao.md §11.5", "sinal": "firme"}, {"id": "rev-015", "tema": "Revisão: tipos", "pergunta": "Eu já tinha direito a uma aposentadoria melhor antes de pedir. Posso trocar o cálculo?", "variantes": ["melhor benefício", "direito adquirido a valor maior", "aposentadoria calculada na data errada"], "resposta": "Sim, há direito ao cálculo mais favorável da data em que já tinha direito (STF (Supremo Tribunal Federal) Tema 334). O pedido, porém, decai em 10 anos da primeira prestação (STJ (Superior Tribunal de Justiça) Tema 966).", "fonte": "STF Tema 334; STJ Tema 966", "origem": "doutrina-revisao.md §11.6", "sinal": "firme"}, {"id": "rev-016", "tema": "Revisão: tipos", "pergunta": "Ainda dá para pedir a revisão do artigo 29?", "variantes": ["revisão do art. 29, II", "revisão do auxílio-doença do acordo", "diferença do art. 29 não paga"], "resposta": "Recálculo novo, não: o cronograma do acordo na ACP (ação civil pública) terminou e o recálculo fora dele está decaído. Resta cobrar diferença apurada e não paga, até 31/12/2027 pela leitura do próprio INSS (Instituto Nacional do Seguro Social).", "fonte": "Lei 8.213, art. 29, II; TNU Temas 1 e 134; ACP 0002320-59.2012.4.03.6183/SP", "origem": "doutrina-revisao.md §11.4", "sinal": "controvertido"}, {"id": "rev-017", "tema": "Revisão: tipos", "pergunta": "O INSS dividiu minha média por um número maior que minhas contribuições. Está certo?", "variantes": ["divisor mínimo", "divisor de 108 meses", "poucas contribuições depois de 1994"], "resposta": "Em parte. Para o filiado até 07/1994, a lei fixa divisor mínimo de 108 meses desde 05/05/2022, salvo na aposentadoria por incapacidade permanente, mas o regulamento e a instrução do INSS (Instituto Nacional do Seguro Social) ainda falam em 60% do período, e não se sabe se o INSS aplica os 108 meses. A tese de divisor igual ao número de contribuições foi rejeitada (TNU (Turma Nacional de Uniformização) Tema 203).", "fonte": "Lei 8.213, art. 135-A; Dec. 3.048, art. 188-E, § 1º; IN 128, art. 230; TNU Tema 203", "origem": "doutrina-revisao.md §11.6", "sinal": "controvertido"}, {"id": "rev-018", "tema": "Revisão: tipos", "pergunta": "Dá para tirar os salários baixos da média?", "variantes": ["descarte de contribuições", "excluir salários pequenos do cálculo"], "resposta": "Sim, nas aposentadorias programadas calculadas pela EC (Emenda Constitucional) 103/2019: podem ser excluídas as contribuições que reduzem a média, mantido o tempo mínimo exigido, e o tempo excluído não serve para nenhum outro fim. Nos benefícios por incapacidade a questão está na TNU (Turma Nacional de Uniformização) Tema 392, sem tese.", "fonte": "EC 103/2019, art. 26, § 6º; Dec. 3.048/1999, art. 32, §§ 24 e 25; TNU Tema 392", "origem": "doutrina-revisao.md §11.6; doutrina-incapacidade.md §7 (Auxílio por incapacidade temporária: requisito e valor)", "sinal": "firme"}, {"id": "rev-019", "tema": "Revisão: tipos", "pergunta": "Ainda dá para pedir as revisões dos anos 90, do buraco negro?", "variantes": ["revisão do buraco negro", "artigos 144 e 145", "revisão da Lei 8.870"], "resposta": "Não. As revisões dos arts. 144 e 145 da Lei 8.213 e do art. 26 da Lei 8.870 valeram para benefícios de 1988 a 1993 e estão decaídas desde 01/08/1997. Se a renda foi limitada ao teto, o que sobrevive é a readequação aos tetos de 1998 e 2003.", "fonte": "Lei 8.213, arts. 144 e 145 (revogados); Lei 8.870/1994, art. 26; STF Tema 313; STF Tema 930", "origem": "doutrina-revisao.md §11.3 e §11.9", "sinal": "firme"}, {"id": "rev-020", "tema": "Revisão: reclamatória trabalhista", "pergunta": "Ganhei ação trabalhista. Minha aposentadoria pode aumentar?", "variantes": ["reclamatória aumenta o benefício", "verbas da Justiça do Trabalho no INSS", "horas extras da ação trabalhista na aposentadoria"], "resposta": "Sim, se as verbas remuneratórias reconhecidas caem nos meses usados no cálculo do benefício. O prazo é de 10 anos contados do trânsito em julgado da reclamatória (STJ (Superior Tribunal de Justiça) Tema 1.117).", "fonte": "STJ Tema 1.117; TNU PUIL 5015985-46.2018.4.04.7112", "origem": "doutrina-revisao.md §11.7; haack-prev-revisao SKILL §5.2", "sinal": "firme"}, {"id": "rev-021", "tema": "Revisão: reclamatória trabalhista", "pergunta": "Fiz acordo na Justiça do Trabalho. Serve para revisar a aposentadoria?", "variantes": ["acordo trabalhista homologado vale no INSS?", "sentença homologatória de acordo"], "resposta": "Só com prova da época: o acordo homologado vale como início de prova apenas se houver nos autos elementos contemporâneos dos fatos (STJ (Superior Tribunal de Justiça) Tema 1.188). Sentença condenatória com prova no processo é o caso forte.", "fonte": "STJ Tema 1.188; TNU Súm. 31 (revogada em 22/11/2023)", "origem": "doutrina-revisao.md §11.7; haack-prev-revisao SKILL §5.1", "sinal": "firme"}, {"id": "rev-022", "tema": "Revisão: reclamatória trabalhista", "pergunta": "A ação trabalhista demorou anos. Perco os atrasados desse tempo?", "variantes": ["prescrição durante a reclamatória", "Tema 200 TNU", "atrasados da revisão por ação trabalhista"], "resposta": "Pela TNU (Turma Nacional de Uniformização), não: a prescrição não corre durante a ação trabalhista até a homologação dos cálculos, e só se soma o tempo em que corre, comparado com 5 anos (Tema 200). A tese vincula os Juizados Especiais Federais; pela regra mais rígida, a prescrição só para durante o pedido ao INSS (Instituto Nacional do Seguro Social), e parcelas antigas podem ficar de fora.", "fonte": "TNU Tema 200; Dec. 20.910, art. 4º; Súm. 85/STJ", "origem": "doutrina-revisao.md §11.7; haack-prev-revisao SKILL §4 Etapa D e §5.3", "sinal": "controvertido"}, {"id": "rev-023", "tema": "Revisão: reclamatória trabalhista", "pergunta": "A diferença da ação trabalhista é paga desde quando me aposentei?", "variantes": ["efeitos financeiros da revisão por reclamatória", "pedir no INSS ou na Justiça", "desde a DIB ou desde o pedido"], "resposta": "Na Justiça, desde a DIB (data de início do benefício), segundo a TNU (Turma Nacional de Uniformização), sem tema obrigatório do STJ (Superior Tribunal de Justiça) sobre isso. Pedindo ao INSS (Instituto Nacional do Seguro Social), a diferença conta só a partir da data do pedido de revisão. Em ambos os casos, respeitada a prescrição.", "fonte": "TNU PUILs 0510156-08.2021.4.05.8300 e 0001821-41.2015.4.03.6322; Dec. 3.048, arts. 347, § 4º, e 176, § 7º; IN 128, arts. 585 a 587", "origem": "doutrina-revisao.md §11.7; haack-prev-revisao SKILL §5.4", "sinal": "firme"}, {"id": "rev-024", "tema": "Revisão: reclamatória trabalhista", "pergunta": "Que documentos da ação trabalhista o INSS pede?", "variantes": ["papéis da reclamatória para revisão", "certidão de trânsito e cálculos"], "resposta": "A decisão em inteiro teor, a certidão de trânsito em julgado e a planilha de cálculos homologada, que o INSS (Instituto Nacional do Seguro Social) confronta com seus sistemas. Se o vínculo inteiro só foi reconhecido na reclamatória, exige-se também início de prova material da época.", "fonte": "IN 128, art. 172, I a IV e § 1º; art. 571", "origem": "doutrina-revisao.md §11.7; haack-prev-revisao SKILL §3 e §5.1", "sinal": "firme"}, {"id": "rev-025", "tema": "Revisão: reclamatória trabalhista", "pergunta": "O aumento de salário perto da aposentadoria conta se veio da ação trabalhista?", "variantes": ["aumento nos últimos 36 meses", "salário majorado antes de aposentar"], "resposta": "Sim. Aumento nos 36 meses anteriores ao benefício acima do limite legal não conta, salvo se homologado pela Justiça do Trabalho.", "fonte": "Lei 8.213, art. 29, § 4º", "origem": "doutrina-revisao.md §11.7", "sinal": "firme"}, {"id": "rev-026", "tema": "Revisão: reclamatória trabalhista", "pergunta": "Entrei com a ação trabalhista quando a aposentadoria já tinha mais de 10 anos. Ainda vale?", "variantes": ["reclamatória depois de decaída a revisão", "ação trabalhista tardia e revisão"], "resposta": "Não está decidido. O STJ (Superior Tribunal de Justiça) Tema 1.117 conta o prazo do trânsito da reclamatória, mas não tratou da ação trabalhista ajuizada depois de vencido o prazo normal do benefício; há risco de se entender que o prazo terminou.", "fonte": "STJ Tema 1.117", "origem": "doutrina-revisao.md §11.7; parecer-de-revisao-ao-cliente.md §4", "sinal": "controvertido"}, {"id": "rev-027", "tema": "Revisão: teses mortas", "pergunta": "Ainda dá para entrar com a revisão da vida toda?", "variantes": ["revisão da vida inteira", "salários antes de 1994 na média", "vida toda STF"], "resposta": "Não. O STF (Supremo Tribunal Federal) cancelou a tese favorável (Tema 1.102, trânsito em 15/05/2026): a média começa em 07/1994 para quem já contribuía antes, sem opção pela vida toda. Ação nova não tem chance e ainda pode gerar condenação em honorários do INSS (Instituto Nacional do Seguro Social).", "fonte": "STF Tema 1.102; ADIs 2.110 e 2.111; Lei 9.876/1999, art. 3º", "origem": "doutrina-revisao.md §11.9; parecer-de-revisao-ao-cliente.md §6", "sinal": "firme"}, {"id": "rev-028", "tema": "Revisão: teses mortas", "pergunta": "Continuei trabalhando aposentado. Posso trocar por uma aposentadoria maior?", "variantes": ["desaposentação", "reaposentação", "contribuições depois de aposentado"], "resposta": "Não. O STF (Supremo Tribunal Federal) decidiu que não existe desaposentação nem reaposentação sem lei (Tema 503, trânsito em 08/12/2020).", "fonte": "STF Tema 503; Lei 8.213, art. 18, § 2º", "origem": "doutrina-revisao.md §11.9", "sinal": "firme"}, {"id": "rev-029", "tema": "Revisão: teses mortas", "pergunta": "Tenho direito à revisão do IRSM de fevereiro de 1994?", "variantes": ["revisão dos 39,67%", "IRSM 1994"], "resposta": "Não, se não aderiu ao acordo da Lei 10.999/2004, cuja adesão ia até 31/10/2005. A TNU (Turma Nacional de Uniformização) decidiu que o prazo não foi reaberto (Tema 375); está decaído para todo benefício com 02/1994 no cálculo.", "fonte": "Lei 10.999/2004; TNU Tema 375; TNU PUIL 002902
