oso, gás natural e seus derivados; sílica livre; outras substâncias químicas (estireno, butadieno, acrilonitrila, aminas aromáticas, óxido de etileno, creosoto e demais do código 1.0.19).\n- Físicos: ruído; vibrações; radiações ionizantes; temperaturas anormais (calor); pressão atmosférica anormal.\n- Biológicos: micro-organismos e parasitas infectocontagiosos vivos e suas toxinas.\nFicam fora dos 25 anos só o asbesto (20 anos) e a mineração subterrânea (20 anos afastada da frente de produção; 15 anos na frente de produção).", "fonte": "Decreto 3.048/1999, Anexo IV, códigos 1.0.1 a 3.0.1", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-004", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Qual o tempo de exposição de cada agente nocivo: 15, 20 ou 25 anos?", "variantes": ["tabela de tempo por agente", "tempo de exposição por agente", "15 20 25 anos", "quanto tempo precisa de exposição"], "resposta": "15 anos: mineração subterrânea em frente de produção. 20 anos: asbesto (amianto) e mineração subterrânea afastada das frentes de produção. 25 anos: todos os outros agentes químicos (arsênio, benzeno, chumbo, cromo, mercúrio, sílica, petróleo e derivados e os demais), os físicos (ruído, vibrações, radiações ionizantes, calor, pressão anormal) e os biológicos.", "fonte": "Decreto 3.048/1999, Anexo IV", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-005", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Quais são os agentes químicos que dão direito a tempo especial?", "variantes": ["lista de agentes químicos", "produto químico", "químicos do anexo IV"], "resposta": "São 19 códigos no Anexo IV do Decreto 3.048/1999: arsênio e seus compostos; asbesto (amianto); benzeno e seus compostos tóxicos; berílio e seus compostos tóxicos; bromo e seus compostos tóxicos; cádmio e seus compostos tóxicos; carvão mineral e seus derivados; chumbo e seus compostos tóxicos; cloro e seus compostos tóxicos; cromo e seus compostos tóxicos; dissulfeto de carbono; fósforo e seus compostos tóxicos; iodo; manganês e seus compostos; mercúrio e seus compostos; níquel e seus compostos tóxicos; petróleo, xisto betuminoso, gás natural e seus derivados; sílica livre; outras substâncias químicas (estireno, butadieno, acrilonitrila, aminas aromáticas, óxido de etileno, creosoto e demais do código 1.0.19). Todos são de 25 anos, salvo o asbesto, de 20. Pelo anexo, o direito depende de exposição em nível de concentração superior aos limites de tolerância estabelecidos.", "fonte": "Decreto 3.048/1999, Anexo IV, códigos 1.0.0 a 1.0.19 (red. Decreto 3.265/1999)", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-006", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Quais são os agentes físicos que dão direito a tempo especial?", "variantes": ["lista de agentes físicos", "ruído calor vibração radiação", "físicos do anexo IV"], "resposta": "São cinco no Anexo IV do Decreto 3.048/1999, todos de 25 anos: ruído, com NEN (Nível de Exposição Normalizado) superior a 85 dB(A); vibrações, em trabalhos com perfuratrizes e marteletes pneumáticos; radiações ionizantes; temperaturas anormais, que é o calor acima dos limites da NR-15 (Norma Regulamentadora 15); e pressão atmosférica anormal, em caixões ou câmaras hiperbáricas, tubulões ou túneis sob ar comprimido e mergulho. Frio, umidade e eletricidade não constam da lista atual do anexo.", "fonte": "Decreto 3.048/1999, Anexo IV, códigos 2.0.0 a 2.0.5", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-007", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Estou exposto a mais de um agente nocivo. Qual tempo vale?", "variantes": ["dois agentes", "associação de agentes", "mais de um agente", "ruído e químico juntos"], "resposta": "Vale o do agente que exigir menor tempo de exposição, desde que os agentes associados estejam acima do nível de tolerância. A associação típica do anexo é a mineração subterrânea: 15 anos na frente de produção e 20 anos afastada dela.", "fonte": "Decreto 3.048/1999, Anexo IV, código 4.0.0 (red. Decreto 4.882/2003), 4.0.1 e 4.0.2", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-008", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "A lista de agentes nocivos do decreto é fechada?", "variantes": ["rol taxativo", "rol exaustivo", "agente fora da lista", "atividade que não está na lista"], "resposta": "Pelo regulamento, o rol de agentes é exaustivo e as atividades listadas são só exemplos: basta a exposição ao agente, mesmo em atividade não citada. Em juízo, a TNU (Turma Nacional de Uniformização), no Tema 205, trata o rol como exemplificativo, admitindo agente fora da lista com prova de risco superior ao geral.", "fonte": "Decreto 3.048/1999, Anexo IV, código 1.0.0 (red. Decreto 3.265/1999); TNU Tema 205, item a", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "controvertido"}, {"id": "anx-009", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Exposição a arsênio e seus compostos dá aposentadoria especial? Em quantos anos?", "variantes": ["arsênico", "arsina", "inseticida com arsênio", "trabalhei com arsênico"], "resposta": "Sim, em 25 anos de exposição. Consta do Anexo IV do Decreto 3.048/1999, código 1.0.1: arsênio e seus compostos. Atividades exemplificativas do anexo: a) extração de arsênio e seus compostos tóxicos; b) metalurgia de minérios arsenicais; c) utilização de hidrogênio arseniado (arsina) em sínteses orgânicas e no processamento de componentes eletrônicos; d) fabricação e preparação de tintas e lacas; e) fabricação, preparação e aplicação de inseticidas, herbicidas, parasiticidas e raticidas com a utilização de compostos de arsênio; f) produção de vidros, ligas de chumbo e medicamentos com a utilização de compostos de arsênio; g) conservação e curtume de peles, tratamento e preservação da madeira com a utilização de compostos de arsênio.", "fonte": "Decreto 3.048/1999, Anexo IV, código 1.0.1", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-010", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Exposição a asbesto (amianto) dá aposentadoria especial? Em quantos anos?", "variantes": ["amianto", "fibrocimento", "telha de amianto", "lona de freio", "trabalhei com amianto"], "resposta": "Sim, em 20 anos de exposição. Consta do Anexo IV do Decreto 3.048/1999, código 1.0.2: asbesto (amianto). Atividades exemplificativas do anexo: a) extração, processamento e manipulação de rochas amiantíferas; b) fabricação de guarnições para freios, embreagens e materiais isolantes contendo asbestos; c) fabricação de produtos de fibrocimento; d) mistura, cardagem, fiação e tecelagem de fibras de asbestos.", "fonte": "Decreto 3.048/1999, Anexo IV, código 1.0.2", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-011", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Exposição a benzeno e seus compostos tóxicos dá aposentadoria especial? Em quantos anos?", "variantes": ["benzeno", "cola", "tinta", "verniz", "solvente", "borracha", "pneu", "borracheiro", "trabalhei com benzeno"], "resposta": "Sim, em 25 anos de exposição. Consta do Anexo IV do Decreto 3.048/1999, código 1.0.3: benzeno e seus compostos tóxicos. Atividades exemplificativas do anexo: a) produção e processamento de benzeno; b) utilização de benzeno como matéria-prima em sínteses orgânicas e na produção de derivados; c) utilização de benzeno como insumo na extração de óleos vegetais e álcoois; d) utilização de produtos que contenham benzeno, como colas, tintas, vernizes, produtos gráficos e solventes; e) produção e utilização de clorobenzenos e derivados; f) fabricação e vulcanização de artefatos de borracha; g) fabricação e recauchutagem de pneumáticos.", "fonte": "Decreto 3.048/1999, Anexo IV, código 1.0.3", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-012", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Exposição a berílio e seus compostos tóxicos dá aposentadoria especial? Em quantos anos?", "variantes": ["berílio", "tubo fluorescente", "ampola de raio X", "trabalhei com berílio"], "resposta": "Sim, em 25 anos de exposição. Consta do Anexo IV do Decreto 3.048/1999, código 1.0.4: berílio e seus compostos tóxicos. Atividades exemplificativas do anexo: a) extração, trituração e tratamento de berílio; b) fabricação de compostos e ligas de berílio; c) fabricação de tubos fluorescentes e de ampolas de raio X; d) fabricação de queim f) utilização do berílio na indústria aeroespacial. O texto do Planalto traz esse código com trecho truncado entre as alíneas d e f.", "fonte": "Decreto 3.048/1999, Anexo IV, código 1.0.4", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-013", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Exposição a bromo e seus compostos tóxicos dá aposentadoria especial? Em quantos anos?", "variantes": ["bromo", "ácido brômico", "trabalhei com bromo"], "resposta": "Sim, em 25 anos de exposição. Consta do Anexo IV do Decreto 3.048/1999, código 1.0.5: bromo e seus compostos tóxicos. Atividades exemplificativas do anexo: a) fabricação e emprego do bromo e do ácido brômico.", "fonte": "Decreto 3.048/1999, Anexo IV, código 1.0.5", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-014", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Exposição a cádmio e seus compostos tóxicos dá aposentadoria especial? Em quantos anos?", "variantes": ["cádmio", "solda", "bateria", "galvanoplastia", "trabalhei com cádmio"], "resposta": "Sim, em 25 anos de exposição. Consta do Anexo IV do Decreto 3.048/1999, código 1.0.6: cádmio e seus compostos tóxicos. Atividades exemplificativas do anexo: a) extração, tratamento e preparação de ligas de cádmio; b) fabricação de compostos de cádmio; c) utilização de eletrodos de cádmio em soldas; d) utilização de cádmio no revestimento eletrolítico de metais; e) utilização de cádmio como pigmento e estabilizador na indústria do plástico; f) fabricação de eletrodos de baterias alcalinas de níquel-cádmio.", "fonte": "Decreto 3.048/1999, Anexo IV, código 1.0.6", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-015", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Exposição a carvão mineral e seus derivados dá aposentadoria especial? Em quantos anos?", "variantes": ["carvão", "piche", "alcatrão", "betume", "breu", "óleo mineral", "parafina", "negro de fumo", "coque", "graxa", "trabalhei com carvão"], "resposta": "Sim, em 25 anos de exposição. Consta do Anexo IV do Decreto 3.048/1999, código 1.0.7: carvão mineral e seus derivados. Atividades exemplificativas do anexo: a) extração, fabricação, beneficiamento e utilização de carvão mineral, piche, alcatrão, betume e breu; b) extração, produção e utilização de óleos minerais e parafinas; c) extração e utilização de antraceno e negro de fumo; d) produção de coque.", "fonte": "Decreto 3.048/1999, Anexo IV, código 1.0.7", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-016", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Exposição a chumbo e seus compostos tóxicos dá aposentadoria especial? Em quantos anos?", "variantes": ["chumbo", "bateria", "acumulador", "solda", "tinta", "pintura com pistola", "vidro", "cristal", "trabalhei com chumbo"], "resposta": "Sim, em 25 anos de exposição. Consta do Anexo IV do Decreto 3.048/1999, código 1.0.8: chumbo e seus compostos tóxicos. Atividades exemplificativas do anexo: a) extração e processamento de minério de chumbo; b) metalurgia e fabricação de ligas e compostos de chumbo; c) fabricação e reformas de acumuladores elétricos; d) fabricação e emprego de chumbo-tetraetila e chumbo-tetrametila; e) fabricação de tintas, esmaltes e vernizes à base de compostos de chumbo; f) pintura com pistola empregando tintas com pigmentos de chumbo; g) fabricação de objetos e artefatos de chumbo e suas ligas; h) vulcanização da borracha pelo litargírio ou outros compostos de chumbo; i) utilização de chumbo em processos de soldagem; j) fabricação de vidro, cristal e esmalte vitrificado; l) fabricação de pérolas artificiais; m) fabricação e utilização de aditivos à base de chumbo para a indústria de plásticos.", "fonte": "Decreto 3.048/1999, Anexo IV, código 1.0.8", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-017", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Exposição a cloro e seus compostos tóxicos dá aposentadoria especial? Em quantos anos?", "variantes": ["cloro", "organoclorado", "PVC", "cloreto de vinila", "clorofórmio", "agrotóxico", "trabalhei com cloro"], "resposta": "Sim, em 25 anos de exposição. Consta do Anexo IV do Decreto 3.048/1999, código 1.0.9: cloro e seus compostos tóxicos. Atividades exemplificativas do anexo: a) fabricação e emprego de defensivos organoclorados; b) fabricação e emprego de cloroetilaminas (mostardas nitrogenadas); c) fabricação e manuseio de bifenis policlorados (PCB); d) fabricação e emprego de cloreto de vinil como monômero na fabricação de policloreto de vinil (PVC) e outras resinas e como intermediário em produções químicas ou como solvente orgânico; e) fabricação de policloroprene; f) fabricação e emprego de clorofórmio (triclorometano) e de tetracloreto de carbono.", "fonte": "Decreto 3.048/1999, Anexo IV, código 1.0.9", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-018", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Exposição a cromo e seus compostos tóxicos dá aposentadoria especial? Em quantos anos?", "variantes": ["cromo", "cromagem", "galvanoplastia", "solda de aço inoxidável", "inox", "trabalhei com cromo"], "resposta": "Sim, em 25 anos de exposição. Consta do Anexo IV do Decreto 3.048/1999, código 1.0.10: cromo e seus compostos tóxicos. Atividades exemplificativas do anexo: a) fabricação, emprego industrial, manipulação de cromo, ácido crômico, cromatos e bicromatos; b) fabricação de ligas de ferro-cromo; c) revestimento eletrolítico de metais e polimento de superfícies cromadas; d) pintura com pistola utilizando tintas com pigmentos de cromo; e) soldagem de aço inoxidável.", "fonte": "Decreto 3.048/1999, Anexo IV, código 1.0.10", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-019", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Exposição a dissulfeto de carbono dá aposentadoria especial? Em quantos anos?", "variantes": ["dissulfeto de carbono", "viscose", "raiom", "trabalhei com dissulfeto de carbono"], "resposta": "Sim, em 25 anos de exposição. Consta do Anexo IV do Decreto 3.048/1999, código 1.0.11: dissulfeto de carbono. Atividades exemplificativas do anexo: a) fabricação e utilização de dissulfeto de carbono; b) fabricação de viscose e seda artificial (raiom); c) fabricação e emprego de solventes, inseticidas e herbicidas contendo dissulfeto de carbono; d) fabricação de vernizes, resinas, sais de amoníaco, de tetracloreto de carbono, de vidros óticos e produtos têxteis com uso de dissulfeto de carbono.", "fonte": "Decreto 3.048/1999, Anexo IV, código 1.0.11", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-020", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Exposição a fósforo e seus compostos tóxicos dá aposentadoria especial? Em quantos anos?", "variantes": ["fósforo", "organofosforado", "fertilizante", "praguicida", "agrotóxico", "munição", "trabalhei com fósforo"], "resposta": "Sim, em 25 anos de exposição. Consta do Anexo IV do Decreto 3.048/1999, código 1.0.12: fósforo e seus compostos tóxicos. Atividades exemplificativas do anexo: a) extração e preparação de fósforo branco e seus compostos; b) fabricação e aplicação de produtos fosforados e organofosforados (sínteses orgânicas, fertilizantes e praguicidas); c) fabricação de munições e armamentos explosivos.", "fonte": "Decreto 3.048/1999, Anexo IV, código 1.0.12", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-021", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Exposição a iodo dá aposentadoria especial? Em quantos anos?", "variantes": ["iodo", "trabalhei com iodo"], "resposta": "Sim, em 25 anos de exposição. Consta do Anexo IV do Decreto 3.048/1999, código 1.0.13: iodo. Atividades exemplificativas do anexo: a) fabricação e emprego industrial do iodo.", "fonte": "Decreto 3.048/1999, Anexo IV, código 1.0.13", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-022", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Exposição a manganês e seus compostos dá aposentadoria especial? Em quantos anos?", "variantes": ["manganês", "eletrodo", "solda", "pilha", "trabalhei com manganês"], "resposta": "Sim, em 25 anos de exposição. Consta do Anexo IV do Decreto 3.048/1999, código 1.0.14: manganês e seus compostos. Atividades exemplificativas do anexo: a) extração e beneficiamento de minérios de manganês; b) fabricação de ligas e compostos de manganês; c) fabricação de pilhas secas e acumuladores; d) preparação de permanganato de potássio e de corantes; e) fabricação de vidros especiais e cerâmicas; f) utilização de eletrodos contendo manganês; g) fabricação de tintas e fertilizantes.", "fonte": "Decreto 3.048/1999, Anexo IV, código 1.0.14", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-023", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Exposição a mercúrio e seus compostos dá aposentadoria especial? Em quantos anos?", "variantes": ["mercúrio", "termômetro", "lâmpada", "amálgama", "dentista", "fungicida", "trabalhei com mercúrio"], "resposta": "Sim, em 25 anos de exposição. Consta do Anexo IV do Decreto 3.048/1999, código 1.0.15: mercúrio e seus compostos. Atividades exemplificativas do anexo: a) extração e utilização de mercúrio e fabricação de seus compostos; b) fabricação de espoletas com fulminato de mercúrio; c) fabricação de tintas com pigmento contendo mercúrio; d) fabricação e manutenção de aparelhos de medição e de laboratório; e) fabricação de lâmpadas, válvulas eletrônicas e ampolas de raio X; f) fabricação de minuterias, acumuladores e retificadores de corrente; g) utilização como agente catalítico e de eletrólise; h) douração, prateamento, bronzeamento e estanhagem de espelhos e metais; i) curtimento e feltragem do couro e conservação da madeira; j) recuperação do mercúrio; l) amalgamação do zinco. m) tratamento a quente de amálgamas de metais; n) fabricação e aplicação de fungicidas.", "fonte": "Decreto 3.048/1999, Anexo IV, código 1.0.15", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-024", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Exposição a níquel e seus compostos tóxicos dá aposentadoria especial? Em quantos anos?", "variantes": ["níquel", "niquelagem", "trabalhei com níquel"], "resposta": "Sim, em 25 anos de exposição. Consta do Anexo IV do Decreto 3.048/1999, código 1.0.16: níquel e seus compostos tóxicos. Atividades exemplificativas do anexo: a) extração e beneficiamento do níquel; b) niquelagem de metais; c) fabricação de acumuladores de níquel-cádmio.", "fonte": "Decreto 3.048/1999, Anexo IV, código 1.0.16", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-025", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Exposição a petróleo, xisto betuminoso, gás natural e seus derivados dá aposentadoria especial? Em quantos anos?", "variantes": ["petróleo", "gasolina", "diesel", "frentista", "posto de combustível", "refinaria", "petroquímica", "asfalto", "hidrocarboneto", "trabalhei com petróleo"], "resposta": "Sim, em 25 anos de exposição. Consta do Anexo IV do Decreto 3.048/1999, código 1.0.17: petróleo, xisto betuminoso, gás natural e seus derivados. Atividades exemplificativas do anexo: a) extração, processamento, beneficiamento e atividades de manutenção realizadas em unidades de extração, plantas petrolíferas e petroquímicas; b) beneficiamento e aplicação de misturas asfálticas contendo hidrocarbonetos policíclicos.", "fonte": "Decreto 3.048/1999, Anexo IV, código 1.0.17", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-026", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Exposição a sílica livre dá aposentadoria especial? Em quantos anos?", "variantes": ["sílica", "poeira", "jato de areia", "pedreira", "cerâmica", "vidro", "refratário", "túnel", "marmoraria", "trabalhei com sílica"], "resposta": "Sim, em 25 anos de exposição. Consta do Anexo IV do Decreto 3.048/1999, código 1.0.18: sílica livre. Atividades exemplificativas do anexo: a) extração de minérios a céu aberto; b) beneficiamento e tratamento de produtos minerais geradores de poeiras contendo sílica livre cristalizada; c) tratamento, decapagem e limpeza de metais e fosqueamento de vidros com jatos de areia; d) fabricação, processamento, aplicação e recuperação de materiais refratários; e) fabricação de mós, rebolos e de pós e pastas para polimento; f) fabricação de vidros e cerâmicas; g) construção de túneis; h) desbaste e corte a seco de materiais contendo sílica.", "fonte": "Decreto 3.048/1999, Anexo IV, código 1.0.18", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-027", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Exposição a outras substâncias químicas dá aposentadoria especial? Em quantos anos?", "variantes": ["estireno", "butadieno", "acrilonitrila", "TDI", "aminas aromáticas", "óxido de etileno", "creosoto", "benzopireno", "borracha", "plástico", "esterilização", "trabalhei com estireno"], "resposta": "Sim, em 25 anos de exposição. Consta do Anexo IV do Decreto 3.048/1999, código 1.0.19: outras substâncias químicas (estireno, butadieno, acrilonitrila, aminas aromáticas, óxido de etileno, creosoto e demais do código 1.0.19). Substâncias e atividades do anexo: GRUPO I - ESTIRENO; BUTADIENO-ESTIRENO; ACRILONITRILA; 1-3 BUTADIENO; CLOROPRENO; MERCAPTANOS, n-HEXANO, DIISOCIANATO DE TOLUENO (TDI); AMINAS AROMÁTICAS a) fabricação e vulcanização de artefatos de borracha; b) fabricação e recauchutagem de pneus. GRUPO II - AMINAS AROMÁTICAS, AMINOBIFENILA, AURAMINA, AZATIOPRINA, BIS (CLORO METIL) ÉTER, 1-4 BUTANODIOL, DIMETANOSULFONATO (MILERAN), CICLOFOSFAMIDA, CLOROAMBUCIL, DIETILESTIL-BESTROL, ACRONITRILA, NITRONAFTILAMINA 4-DIMETIL-AMINOAZOBENZENO, BENZOPIRENO, BETA-PROPIOLACTONA, BISCLOROETILETER, BISCLOROMETIL, CLOROMETILETER, DIANIZIDINA, DICLOROBENZIDINA, DIETILSULFATO, DIMETILSULFATO, ETILENOAMINA, ETILENOTIUREIA, FENACETINA, IODETO DE METILA, ETILNITROSURÉIAS, METILENO-ORTOCLOROANILINA (MOCA), NITROSAMINA, ORTOTOLUIDINA, OXIME-TALONA, PROCARBAZINA, PROPANOSULTONA, 1-3-BUTADIENO, ÓXIDO DE ETILENO, ESTILBENZENO, DIISOCIANATO DE TOLUENO (TDI), CREOSOTO, 4-AMINODIFENIL, BENZIDINA, BETANAFTILAMINA, ESTIRENO, 1-CLORO-2, 4 - NITRODIFENIL, 3-POXIPRO-PANO a) manufatura de magenta (anilina e ortotoluidina); b) fabricação de fibras sintéticas; c) sínteses químicas; d) fabricação da borracha e espumas; e) fabricação de plásticos; f) produção de medicamentos; g) operações de preservação da madeira com creosoto; h) esterilização de materiais cirúrgicos.", "fonte": "Decreto 3.048/1999, Anexo IV, código 1.0.19", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-028", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Exposição a ruído dá aposentadoria especial? Em quantos anos?", "variantes": ["barulho", "decibéis", "dB", "trabalhei com barulho"], "resposta": "Sim. O ruído está no Anexo IV do Decreto 3.048/1999 (código 2.0.1), com 25 anos de exposição, para NEN (Nível de Exposição Normalizado) superior a 85 dB(A), na redação do Decreto 4.882/2003. Para períodos antigos valem os limites da época: acima de 80 dB(A) até 05/03/1997 e acima de 90 dB(A) de 06/03/1997 a 18/11/2003.", "fonte": "Decreto 3.048/1999, Anexo IV, código 2.0.1; IN 128/2022, art. 292, I a III (red. IN 170/2024)", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-029", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Exposição a vibrações dá aposentadoria especial? Em quantos anos?", "variantes": ["vibração", "britadeira", "martelete", "perfuratriz", "trabalhei com vibração"], "resposta": "Sim, em 25 anos de exposição. Consta do Anexo IV do Decreto 3.048/1999, código 2.0.2: vibrações. Atividades do anexo: a) trabalhos com perfuratrizes e marteletes pneumáticos.", "fonte": "Decreto 3.048/1999, Anexo IV, código 2.0.2", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-030", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Exposição a radiações ionizantes dá aposentadoria especial? Em quantos anos?", "variantes": ["radiação", "raio X", "radiologia", "técnico em radiologia", "radioativo", "nuclear", "trabalhei com radiação"], "resposta": "Sim, em 25 anos de exposição. Consta do Anexo IV do Decreto 3.048/1999, código 2.0.3: radiações ionizantes. Atividades do anexo: a) extração e beneficiamento de minerais radioativos; b) atividades em minerações com exposição ao radônio; c) realização de manutenção e supervisão em unidades de extração, tratamento e beneficiamento de minerais radioativos com exposição às radiações ionizantes; d) operações com reatores nucleares ou com fontes radioativas; e) trabalhos realizados com exposição aos raios Alfa, Beta, Gama e X, aos nêutrons e às substâncias radioativas para fins industriais, terapêuticos e diagnósticos; f) fabricação e manipulação de produtos radioativos; g) pesquisas e estudos com radiações ionizantes em laboratórios.", "fonte": "Decreto 3.048/1999, Anexo IV, código 2.0.3", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-031", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Exposição a temperaturas anormais dá aposentadoria especial? Em quantos anos?", "variantes": ["calor", "forno", "fundição", "caldeira", "trabalhei com calor"], "resposta": "Sim, em 25 anos de exposição. Consta do Anexo IV do Decreto 3.048/1999, código 2.0.4: temperaturas anormais (calor). Atividades do anexo: a) trabalhos com exposição ao calor acima dos limites de tolerância estabelecidos na NR-15 (Norma Regulamentadora 15), da Portaria nº 3.214/78.", "fonte": "Decreto 3.048/1999, Anexo IV, código 2.0.4", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-032", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Exposição a pressão atmosférica anormal dá aposentadoria especial? Em quantos anos?", "variantes": ["mergulho", "mergulhador", "câmara hiperbárica", "tubulão", "ar comprimido", "trabalhei com mergulho"], "resposta": "Sim, em 25 anos de exposição. Consta do Anexo IV do Decreto 3.048/1999, código 2.0.5: pressão atmosférica anormal. Atividades do anexo: a) trabalhos em caixões ou câmaras hiperbáricas; b) trabalhos em tubulões ou túneis sob ar comprimido; c) operações de mergulho com o uso de escafandros ou outros equipamentos.", "fonte": "Decreto 3.048/1999, Anexo IV, código 2.0.5", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "anx-033", "tema": "Agentes nocivos: lista do Anexo IV", "pergunta": "Exposição a micro-organismos e parasitas infectocontagiosos vivos e suas toxinas dá aposentadoria especial? Em quantos anos?", "variantes": ["biológico", "hospital", "enfermagem", "laboratório", "esgoto", "lixo", "gari", "coveiro", "veterinário", "trabalhei com biológico"], "resposta": "Sim, em 25 anos de exposição. Consta do Anexo IV do Decreto 3.048/1999, código 3.0.1: micro-organismos e parasitas infectocontagiosos vivos e suas toxinas (agentes biológicos). Atividades do anexo: a) trabalhos em estabelecimentos de saúde em contato com pacientes portadores de doenças infecto-contagiosas ou com manuseio de materiais contaminados; b) trabalhos com animais infectados para tratamento ou para o preparo de soro, vacinas e outros produtos; c) trabalhos em laboratórios de autópsia, de anatomia e anátomo-histologia; d) trabalho de exumação de corpos e manipulação de resíduos de animais deteriorados; e) trabalhos em galerias, fossas e tanques de esgoto; f) esvaziamento de biodigestores; g) coleta e industrialização do lixo.", "fonte": "Decreto 3.048/1999, Anexo IV, código 3.0.1", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo IV", "sinal": "firme"}, {"id": "qd-001", "tema": "Carência e qualidade de segurado", "pergunta": "Quais doenças dispensam carência no auxílio-doença e na aposentadoria por invalidez?", "variantes": ["Tenho câncer e poucas contribuições, preciso de carência?", "Lista de doenças graves que isentam de carência", "Quais doenças não precisam das 12 contribuições?", "AVC, Aids, Parkinson ou gravidez de risco dispensam carência?", "Doença grave sem carência no INSS"], "resposta": "Dispensam carência no auxílio por incapacidade temporária (auxílio-doença) e na aposentadoria por incapacidade permanente (aposentadoria por invalidez), se a doença começou depois da filiação ao INSS (Instituto Nacional do Seguro Social), estas 18 doenças e afecções:\n- tuberculose ativa;\n- hanseníase;\n- transtorno mental grave, desde que curse com alienação mental;\n- neoplasia maligna (câncer);\n- cegueira;\n- paralisia irreversível e incapacitante;\n- cardiopatia grave;\n- doença de Parkinson;\n- espondilite anquilosante;\n- nefropatia grave (doença renal grave);\n- estado avançado da doença de Paget (osteíte deformante);\n- síndrome da deficiência imunológica adquirida (Aids);\n- contaminação por radiação, com base em conclusão da medicina especializada;\n- hepatopatia grave (doença grave do fígado);\n- esclerose múltipla;\n- acidente vascular encefálico (AVC) agudo;\n- abdome agudo cirúrgico;\n- gestação de alto risco, desde 24/07/2026.\nAVC agudo e abdome agudo cirúrgico só isentam com quadro de evolução aguda (instalação súbita, sem contar episódio agudo de doença crônica) e critério de gravidade (risco iminente de morte ou de perda da função de órgão ou sistema). Também não exigem carência o acidente de qualquer natureza e a doença profissional ou do trabalho.", "fonte": "Lei 8.213/1991, art. 26, II; Portaria Interministerial MTP/MS 22/2022, arts. 1º, § 1º e § 2º, e 2º, I a XVII e par. único; Portaria Interministerial MPS/MS 15/2026, art. 1º (inciso XVIII)", "origem": "_CONTINUIDADE/_artefatos/prev-lacunas/fontes/INSUMO_dou-portaria-interministerial-mtp-ms-22-2022_2026-11-09.html (arts. 1º e 2º, em vigor em 03/10/2022); INSUMO_dou-portaria-interministerial-mps-ms-15-2026_2026-11-09.html (DOU de 24/07/2026, ed. 138-A, art. 1º); 03_TESES/legislacao/leis/Lei-8213-1991_planos-de-beneficios-previdencia.htm (art. 26, II)", "sinal": "firme"}, {"id": "qd-002", "tema": "Carência e qualidade de segurado", "pergunta": "Quais doenças a própria Lei 8.213 lista como isentas de carência?", "variantes": ["O artigo 151 da lei de benefícios lista quais doenças?", "Lista de doenças da lei do INSS sem carência", "Alienação mental e espondiloartrose isentam de carência?", "Diferença entre a lista da lei e a da portaria"], "resposta": "A Lei 8.213/1991, no art. 151, lista 15 doenças que dispensam carência no auxílio-doença e na aposentadoria por invalidez quando surgem depois da filiação ao RGPS (Regime Geral de Previdência Social):\n- tuberculose ativa;\n- hanseníase;\n- alienação mental;\n- esclerose múltipla;\n- hepatopatia grave;\n- neoplasia maligna;\n- cegueira;\n- paralisia irreversível e incapacitante;\n- cardiopatia grave;\n- doença de Parkinson;\n- espondiloartrose anquilosante;\n- nefropatia grave;\n- estado avançado da doença de Paget (osteíte deformante);\n- síndrome da deficiência imunológica adquirida (Aids);\n- contaminação por radiação, com base em conclusão da medicina especializada.\nÉ uma lista provisória, válida até a edição da lista ministerial do art. 26, II. A lista ministerial em vigor (Portaria Interministerial MTP/MS, do Ministério do Trabalho e Previdência e do Ministério da Saúde, 22/2022, com o acréscimo da Portaria Interministerial MPS/MS, do Ministério da Previdência Social e do Ministério da Saúde, 15/2026) repete essas doenças e acrescenta acidente vascular encefálico agudo, abdome agudo cirúrgico e gestação de alto risco.", "fonte": "Lei 8.213/1991, art. 151 (red. Lei 13.135/2015) e art. 26, II", "origem": "03_TESES/legislacao/leis/Lei-8213-1991_planos-de-beneficios-previdencia.htm (art. 151, última ocorrência, red. Lei 13.135/2015)", "sinal": "firme"}, {"id": "qd-003", "tema": "Carência e qualidade de segurado", "pergunta": "Quais benefícios do INSS não exigem carência?", "variantes": ["Benefício que não precisa de número mínimo de contribuições", "Pensão por morte precisa de carência?", "Auxílio-acidente e salário-família têm carência?", "Salário-maternidade de empregada exige contribuições mínimas?"], "resposta": "Não exigem carência:\n- pensão por morte;\n- salário-família;\n- auxílio-acidente;\n- auxílio-doença e aposentadoria por invalidez decorrentes de acidente de qualquer natureza, de doença profissional ou do trabalho ou de doença da lista ministerial surgida depois da filiação;\n- benefícios do segurado especial rural (aposentadoria por idade ou por invalidez, auxílio-doença, auxílio-reclusão e pensão, de 1 salário mínimo, e auxílio-acidente), que provam atividade rural pelo número de meses da carência em vez de contribuições;\n- serviço social;\n- reabilitação profissional;\n- salário-maternidade da empregada, da trabalhadora avulsa e da empregada doméstica.\nO salário-maternidade da contribuinte individual, da segurada especial e da facultativa tinha carência de 10 contribuições na lei, mas o STF (Supremo Tribunal Federal) declarou essa carência inconstitucional (ADIs, ações diretas de inconstitucionalidade, 2.110 e 2.111).", "fonte": "Lei 8.213/1991, art. 26, I a VI (red. Leis 9.876/1999, 13.135/2015 e 13.846/2019), art. 25, III, e art. 39, I; STF, ADIs 2.110 e 2.111", "origem": "03_TESES/legislacao/leis/Lei-8213-1991_planos-de-beneficios-previdencia.htm (arts. 25, 26 e 39, últimas ocorrências); doutrina-previdenciaria.md §6 (Carência), em .claude/skills/haack-prev-padrao/references/", "sinal": "firme"}, {"id": "qd-004", "tema": "Carência e qualidade de segurado", "pergunta": "Por quanto tempo continuo segurado do INSS sem contribuir, em cada situação?", "variantes": ["Período de graça", "Fui preso, ainda sou segurado?", "Saí do serviço militar, mantenho a qualidade de segurado?", "Quanto tempo depois de sair do emprego ainda tenho direito?", "Desempregado mantém a qualidade de segurado por quanto tempo?"], "resposta": "Mantém a qualidade de segurado, sem contribuir:\n- sem limite de prazo, quem está recebendo benefício, exceto auxílio-acidente;\n- até 12 meses após a última contribuição, quem deixou de exercer atividade remunerada ou está suspenso ou licenciado sem remuneração;\n- esse prazo de 12 meses passa a 24 meses para quem já pagou mais de 120 contribuições mensais sem perder a qualidade de segurado;\n- os prazos de 12 ou 24 meses ganham mais 12 meses para o desempregado que comprove a situação por registro no órgão próprio do Ministério do Trabalho e da Previdência Social (até 36 meses no total);\n- até 12 meses após cessar a segregação, quem teve doença de segregação compulsória;\n- até 12 meses após o livramento, o segurado preso ou recluso;\n- até 3 meses após o licenciamento, quem foi incorporado às Forças Armadas para prestar serviço militar;\n- até 6 meses após a última contribuição, o segurado facultativo.\nDurante esses prazos o segurado conserva todos os direitos. A perda ocorre no dia seguinte ao vencimento da contribuição do mês imediatamente posterior ao fim do prazo.", "fonte": "Lei 8.213/1991, art. 15, I a VI e §§ 1º a 4º (inciso I red. Lei 13.846/2019)", "origem": "03_TESES/legislacao/leis/Lei-8213-1991_planos-de-beneficios-previdencia.htm (art. 15, últimas ocorrências; redação da MP 905/2019 no inciso II com vigência encerrada)", "sinal": "firme"}, {"id": "qd-005", "tema": "Carência e qualidade de segurado", "pergunta": "Qual é a tabela de carência de quem começou a contribuir antes de 24/07/1991?", "variantes": ["Tabela progressiva de carência do artigo 142", "Comecei a trabalhar nos anos 80, quantas contribuições preciso?", "Carência reduzida para segurado antigo", "Quantos meses de contribuição eram exigidos em cada ano?"], "resposta": "Para quem era inscrito na Previdência Social Urbana até 24/07/1991 e para o trabalhador e o empregador rural cobertos pela Previdência Social Rural, a carência das aposentadorias por idade, por tempo de serviço e especial segue o ano em que todas as condições do benefício foram cumpridas:\n- 1991: 60 meses;\n- 1992: 60 meses;\n- 1993: 66 meses;\n- 1994: 72 meses;\n- 1995: 78 meses;\n- 1996: 90 meses;\n- 1997: 96 meses;\n- 1998: 102 meses;\n- 1999: 108 meses;\n- 2000: 114 meses;\n- 2001: 120 meses;\n- 2002: 126 meses;\n- 2003: 132 meses;\n- 2004: 138 meses;\n- 2005: 144 meses;\n- 2006: 150 meses;\n- 2007: 156 meses;\n- 2008: 162 meses;\n- 2009: 168 meses;\n- 2010: 174 meses;\n- 2011 em diante: 180 meses.", "fonte": "Lei 8.213/1991, art. 142 (red. Lei 9.032/1995)", "origem": "03_TESES/legislacao/leis/Lei-8213-1991_planos-de-beneficios-previdencia.htm (art. 142, segunda e última tabela, por ano de implementação das condições; a tabela original, por ano do requerimento, foi substituída)", "sinal": "firme"}, {"id": "qd-006", "tema": "Categorias e alíquotas", "pergunta": "Quais são as faixas e alíquotas do INSS do empregado em 2026?", "variantes": ["Tabela do INSS 2026 para carteira assinada", "Quanto desconta de INSS do meu salário?", "Alíquota progressiva do empregado doméstico", "Desconto máximo de INSS no contracheque"], "resposta": "Em 2026, o empregado, o empregado doméstico e o trabalhador avulso contribuem de forma progressiva, cada alíquota só sobre a parte do salário que cai na faixa:\n- até R$ 1.621,00: 7,5%;\n- de R$ 1.621,01 até R$ 2.902,84: 9%;\n- de R$ 2.902,85 até R$ 4.354,27: 12%;\n- de R$ 4.354,28 até R$ 8.475,55: 14%.\nAcima de R$ 8.475,55 (teto de 2026) não há desconto. Pela conta faixa a faixa, o desconto máximo é de R$ 988,09 em 2026, e um salário de R$ 3.000,00 desconta R$ 248,60. Vale para remunerações a partir da competência 01/2026; o 13º salário não se soma ao salário do mês para definir a faixa.", "fonte": "EC 103/2019, art. 28, I a IV e § 1º; Portaria Interministerial MPS/MF 13/2026, art. 7º e Anexo II", "origem": "05_AUTOMACAO/scripts/dados/aliquotas_contribuicao.json (linha empregado-2026-01); _CONTINUIDADE/_artefatos/prev-lacunas/fontes/INSUMO_dou-portaria-interministerial-mps-mf-n-13-de-9-de-janeiro-de-2026-680382603.html (Anexo II)", "sinal": "firme"}, {"id": "qd-007", "tema": "Categorias e alíquotas", "pergunta": "Quais foram as faixas do INSS do empregado de 2020 a 2025?", "variantes": ["Tabela do INSS de anos anteriores", "Quanto era descontado de INSS em 2022?", "Alíquota do empregado antes da reforma", "Tabela de contribuição 2024 e 2025"], "resposta": "Faixas do empregado, doméstico e avulso por competência:\n- 01/2020 e 02/2020 (alíquota única sobre o salário inteiro): até R$ 1.830,29, 8%; de R$ 1.830,30 a R$ 3.050,52, 9%; de R$ 3.050,53 a R$ 6.101,06, 11%;\n- 03/2020 a 12/2020 (progressiva): até R$ 1.045,00, 7,5%; até R$ 2.089,60, 9%; até R$ 3.134,40, 12%; até R$ 6.101,06, 14%;\n- 2021: até R$ 1.100,00, 7,5%; até R$ 2.203,48, 9%; até R$ 3.305,22, 12%; até R$ 6.433,57, 14%;\n- 2022: até R$ 1.212,00, 7,5%; até R$ 2.427,35, 9%; até R$ 3.641,03, 12%; até R$ 7.087,22, 14%;\n- 01/2023 a 04/2023: até R$ 1.302,00, 7,5%; até R$ 2.571,29, 9%; até R$ 3.856,94, 12%; até R$ 7.507,49, 14%;\n- 05/2023 a 12/2023: até R$ 1.320,00, 7,5%; até R$ 2.571,29, 9%; até R$ 3.856,94, 12%; até R$ 7.507,49, 14%;\n- 2024: até R$ 1.412,00, 7,5%; até R$ 2.666,68, 9%; até R$ 4.000,03, 12%; até R$ 7.786,02, 14%;\n- 2025: até R$ 1.518,00, 7,5%; até R$ 2.793,88, 9%; até R$ 4.190,83, 12%; até R$ 8.157,41, 14%.\nDesde 03/2020, cada alíquota incide só sobre a parte do salário dentro da faixa; cada faixa começa 1 centavo acima do limite da anterior.", "fonte": "Lei 8.212/1991, art. 20 (até 02/2020); EC 103/2019, art. 28 (desde 03/2020); Portarias SEPRT/ME 3.659/2020 e 477/2021; Portaria Interministerial MTP/ME 12/2022; Portarias Interministeriais MPS/MF 26/2023, 27/2023, 2/2024 e 6/2025, Anexos II", "origem": "05_AUTOMACAO/scripts/dados/aliquotas_contribuicao.json (linhas empregado-2020-01 a empregado-2025-01, com os HTML do DOU em _CONTINUIDADE/_artefatos/prev-lacunas/fontes/)", "sinal": "firme"}, {"id": "qd-008", "tema": "Categorias e alíquotas", "pergunta": "Quanto paga de INSS o autônomo, o MEI e o facultativo em cada plano, em 2026?", "variantes": ["Valor da guia do INSS em 2026", "Quanto custa contribuir pelo mínimo como autônomo?", "Plano simplificado 11% quanto é?", "Dona de casa baixa renda paga quanto?", "MEI caminhoneiro paga quanto de INSS?"], "resposta": "Em 2026, com salário mínimo de R$ 1.621,00 e teto de R$ 8.475,55:\n- contribuinte individual por conta própria e facultativo, plano normal: 20% sobre a base escolhida, de R$ 324,20 (sobre o mínimo) a R$ 1.695,11 (sobre o teto);\n- plano simplificado (contribuinte individual sem relação com empresa e facultativo): 11% do mínimo, R$ 178,31, sem direito a aposentadoria por tempo de contribuição;\n- MEI (microempreendedor individual): 5% do mínimo, R$ 81,05;\n- MEI transportador autônomo de cargas: 12% do mínimo, R$ 194,52;\n- facultativo de baixa renda (sem renda própria, dedicado ao trabalho doméstico na própria casa, família no CadÚnico (Cadastro Único) com renda de até 2 salários mínimos): 5% do mínimo, R$ 81,05;\n- contribuinte individual que presta serviço a empresa: 11% da remuneração, até o teto, retidos pela empresa.\nQuem pagou 11%, 5% ou 12% e quer contar o período para aposentadoria por tempo de contribuição ou levar para outro regime complementa até 20% (9, 15 ou 8 pontos percentuais). O vencimento do autônomo e do facultativo é o dia 15 do mês seguinte.", "fonte": "Lei 8.212/1991, arts. 21, caput, §§ 2º, 3º, 4º e 5º, e 30, II e § 4º; Lei 10.666/2003, art. 4º; LC 123/2006, arts. 18-A, § 3º, IV, e 18-F, III; Portaria Interministerial MPS/MF 13/2026, art. 2º", "origem": "05_AUTOMACAO/scripts/dados/aliquotas_contribuicao.json (linhas ci-facultativo-20, plano-simplificado-11, mei-5, mei-tac-12, facultativo-baixa-renda-5, ci-prestador-11, complementacao-11-5-para-20 e vencimento); valores em reais calculados sobre o salário mínimo e o teto de 2026 do art. 2º da Portaria 13/2026", "sinal": "firme"}, {"id": "qd-009", "tema": "Regras de transição", "pergunta": "Quais são as regras de transição da reforma e o que cada uma exige?", "variantes": ["Regras de transição da reforma da previdência", "Quem já contribuía antes de 2019 tem quais opções?", "Pontos, idade progressiva, pedágio 50 e pedágio 100", "Qual transição me serve?"], "resposta": "Para quem era filiado ao RGPS (Regime Geral de Previdência Social) até 13/11/2019, há seis regras de transição, todas com carência de 180 contribuições:\n- Pontos: 30 anos (mulher) ou 35 (homem) de contribuição e soma de idade e tempo, em dias, de 93 (mulher) ou 103 (homem) pontos em 2026, subindo 1 por ano até 100 e 105; renda de 60% da média mais 2 pontos percentuais por ano acima de 15 (mulher) ou 20 (homem).\n- Idade mínima progressiva: 30 ou 35 anos de contribuição e idade de 59 anos e 6 meses (mulher) ou 64 anos e 6 meses (homem) em 2026, subindo 6 meses por ano até 62 e 65; mesma renda.\n- Pedágio de 50%: só para quem tinha, em 13/11/2019, mais de 28 anos (mulher) ou 33 (homem) de contribuição; 30 ou 35 anos mais metade do que faltava naquela data, sem idade mínima; renda da média multiplicada pelo fator previdenciário.\n- Aposentadoria por idade: 62 anos (mulher, desde 2023) ou 65 (homem) e 15 anos de contribuição; renda de 60% mais 2 pontos percentuais por ano acima de 15 ou 20.\n- Pedágio de 100%: 57 anos (mulher) ou 60 (homem), 30 ou 35 anos de contribuição mais todo o tempo que faltava em 13/11/2019; renda de 100% da média.\n- Especial por pontos: 66 pontos e 15 anos de exposição, 76 pontos e 20 anos ou 86 pontos e 25 anos; renda de 60% mais 2 pontos percentuais por ano acima de 20 (acima de 15 para mulher e na especial de 15 anos).\nO professor tem versões próprias das regras de pontos, idade progressiva e pedágio de 100%. O segurado pode cumprir mais de uma e fica com a mais vantajosa.", "fonte": "EC 103/2019, arts. 15 a 18, 20, 21 e 26, §§ 2º, 3º, I, e 5º; Lei 8.213/1991, art. 25, II", "origem": "03_TESES/legislacao/leis/EC-103-2019_reforma-da-previdencia.txt (arts. 15 a 21 e 26); 03_TESES/legislacao/leis/Lei-8213-1991_planos-de-beneficios-previdencia.htm (art. 25, II)", "sinal": "firme"}, {"id": "qd-010", "tema": "Regras de transição", "pergunta": "Quem tem direito ao pedágio de 50% e quanto tempo a mais preciso trabalhar?", "variantes": ["Pedágio de 50 por cento, quem pode usar?", "Faltavam 2 anos em 2019, quanto tenho que pagar de pedágio?", "Regra do artigo 17 da reforma", "Transição sem idade mínima"], "resposta": "Tem direito quem, em 13/11/2019, já era filiado ao RGPS (Regime Geral de Previdência Social) e tinha mais de 28 anos de contribuição (mulher) ou mais de 33 anos (homem). Requisitos, todos juntos:\n- 30 anos de contribuição (mulher) ou 35 anos (homem);\n- mais um período adicional igual a 50% do tempo que, em 13/11/2019, faltava para chegar a 30 ou 35 anos;\n- 180 contribuições de carência;\n- sem idade mínima.\nExemplos: homem com 34 anos em 13/11/2019 faltava 1 ano, paga 6 meses de pedágio e se aposenta com 35 anos e 6 meses; mulher com 28 anos e 6 meses faltava 1 ano e 6 meses, paga 9 meses e se aposenta com 30 anos e 9 meses. Quem tinha exatamente 28 anos (mulher) ou 33 anos (homem), ou menos, fica fora. A renda é a média dos salários multiplicada pelo fator previdenciário, sem a regra 85/95.", "fonte": "EC 103/2019, art. 17, I e II e par. único; Lei 8.213/1991, art. 25, II", "origem": "03_TESES/legislacao/leis/EC-103-2019_reforma-da-previdencia.txt (art. 17); exemplos calculados pela regra do art. 17, II", "sinal": "firme"}, {"id": "qd-011", "tema": "Regras de transição", "pergunta": "Qual a idade e quantos pontos as transições exigem em cada ano, de 2019 em diante?", "variantes": ["Tabela ano a ano da idade mínima progressiva", "Quantos pontos eram exigidos em 2022?", "Idade da mulher na aposentadoria por idade de transição", "Que idade preciso em 2028?"], "resposta": "Regra de pontos, mulher (com 30 anos de contribuição): 86 em 2019; 87 em 2020; 88 em 2021; 89 em 2022; 90 em 2023; 91 em 2024; 92 em 2025; 93 em 2026; 94 em 2027; 95 em 2028; 96 em 2029; 97 em 2030; 98 em 2031; 99 em 2032; 100 de 2033 em diante.\nRegra de pontos, homem (com 35 anos): 96 em 2019; 97 em 2020; 98 em 2021; 99 em 2022; 100 em 2023; 101 em 2024; 102 em 2025; 103 em 2026; 104 em 2027; 105 de 2028 em diante.\nIdade mínima progressiva, mulher (com 30 anos): 56 anos em 2019; 56 e 6 meses em 2020; 57 em 2021; 57 e 6 meses em 2022; 58 em 2023; 58 e 6 meses em 2024; 59 em 2025; 59 e 6 meses em 2026; 60 em 2027; 60 e 6 meses em 2028; 61 em 2029; 61 e 6 meses em 2030; 62 de 2031 em diante.\nIdade mínima progressiva, homem (com 35 anos): 61 anos em 2019; 61 e 6 meses em 2020; 62 em 2021; 62 e 6 meses em 2022; 63 em 2023; 63 e 6 meses em 2024; 64 em 2025; 64 e 6 meses em 2026; 65 de 2027 em diante.\nTransição da aposentadoria por idade, mulher (com 15 anos): 60 anos em 2019; 60 e 6 meses em 2020; 61 em 2021; 61 e 6 meses em 2022; 62 de 2023 em diante. Homem: 65 anos em todos os anos.", "fonte": "EC 103/2019, arts. 15, caput, II, e § 1º; 16, caput, II, e § 1º; 18, I, e § 1º", "origem": "03_TESES/legislacao/leis/EC-103-2019_reforma-da-previdencia.txt (arts. 15, 16 e 18: valor de 2019 e acréscimo anual desde 01/01/2020, aplicados ano a ano)", "sinal": "firme"}, {"id": "qd-012", "tema": "Professor", "pergunta": "Quantos pontos e que idade o professor precisa em cada ano?", "variantes": ["Tabela de pontos da professora ano a ano", "Idade mínima do professor na transição em 2027", "Professora com 25 anos de sala de aula, quando me aposento?", "Regras de transição do professor"], "resposta": "Com 25 anos (professora) ou 30 anos (professor) de efetivo magistério na educação infantil, no ensino fundamental ou no médio, e filiação até 13/11/2019:\nPontos da professora: 81 em 2019; 82 em 2020; 83 em 2021; 84 em 2022; 85 em 2023; 86 em 2024; 87 em 2025; 88 em 2026; 89 em 2027; 90 em 2028; 91 em 2029; 92 de 2030 em diante.\nPontos do professor: 91 em 2019; 92 em 2020; 93 em 2021; 94 em 2022; 95 em 2023; 96 em 2024; 97 em 2025; 98 em 2026; 99 em 2027; 100 de 2028 em diante.\nIdade mínima progressiva da professora: 51 anos em 2019; 51 e 6 meses em 2020; 52 em 2021; 52 e 6 meses em 2022; 53 em 2023; 53 e 6 meses em 2024; 54 em 2025; 54 e 6 meses em 2026; 55 em 2027; 55 e 6 meses em 2028; 56 em 2029; 56 e 6 meses em 2030; 57 de 2031 em diante.\nIdade mínima progressiva do professor: 56 anos em 2019; 56 e 6 meses em 2020; 57 em 2021; 57 e 6 meses em 2022; 58 em 2023; 58 e 6 meses em 2024; 59 em 2025; 59 e 6 meses em 2026; 60 de 2027 em diante.\nPedágio de 100%: 52 anos (professora) ou 55 (professor), mais 100% do tempo de magistério que faltava em 13/11/2019, com renda de 100% da média. Regra permanente: 57 anos (mulher) ou 60 (homem) com 25 anos de magistério para ambos. Nas regras de pontos e idade, a renda é 60% da média mais 2 pontos percentuais por ano acima de 15 (mulher) ou 20 (homem).", "fonte": "EC 103/2019, arts. 15, § 3º, 16, § 2º, 19, § 1º, II, 20, § 1º, e 26, §§ 2º, 3º, I, e 5º", "origem": "05_AUTOMACAO/scripts/dados/professor_regras.json (regras art15-par3, art16-par2, art20-par1, art19-par1-II e tabela_anual 2019 a 2033); 03_TESES/legislacao/leis/EC-103-2019_reforma-da-previdencia.txt", "sinal": "firme"}, {"id": "qd-013", "tema": "Professor", "pergunta": "O que conta como tempo de magistério para a aposentadoria de professor?", "variantes": ["Licença e férias contam como magistério?", "Tempo de coordenadora pedagógica conta?", "Professor auxiliar tem aposentadoria de professor?", "Afastamento por doença conta como tempo de professor?", "Professor universitário conta?"], "resposta": "Conta como magistério, na educação infantil, no ensino fundamental ou no médio, presencial ou a distância:\n- a docência a qualquer título;\n- a direção de unidade escolar, exercida por professor;\n- a coordenação e o assessoramento pedagógicos, exercidos por professor;\n- a atividade de professor auxiliar;\n- o benefício por incapacidade recebido entre períodos de magistério;\n- o benefício por incapacidade acidentário até 30/06/2020, mesmo não intercalado, e, desde 01/07/2020, só se intercalado;\n- a licença-prêmio;\n- os descansos e as férias;\n- o salário-maternidade.\nNão conta: o especialista em educação que não é professor; o ensino superior, salvo para o acréscimo da EC (Emenda Constitucional) 20/1998 no magistério até 16/12/1998; e o tempo em outra atividade, que entra só no cálculo da média. O tempo de magistério não se converte em tempo comum. A prova é feita por diploma ou habilitação e CTPS (Carteira de Trabalho e Previdência Social), complementada por declaração da escola.", "fonte": "Lei 9.394/1996, art. 67, § 2º; Dec. 3.048/1999, art. 54, §§ 2º a 4º; IN PRES/INSS 128/2022, arts. 214, §§ 1º e 2º, 251, § 1º, e 255; STF, ADI 3.772", "origem": ".claude/skills/haack-prev-padrao/references/doutrina-professor-pcd-fator.md §2-A.1 (Quem é professor e que tempo conta; Conversão e tempo fora do magistério)", "sinal": "firme"}, {"id": "qd-014", "tema": "Pessoa com deficiência", "pergunta": "Quais são os graus de deficiência e o tempo exigido em cada um para aposentar?", "variantes": ["Deficiência leve, moderada e grave, quanto tempo?", "Aposentadoria da pessoa com deficiência por tempo e por idade", "Pontuação do IF-BrA", "Quantos anos a PcD precisa contribuir?"], "resposta": "Aposentadoria por tempo de contribuição da PcD (pessoa com deficiência), com renda de 100% do salário de benefício:\n- deficiência grave: 20 anos (mulher) ou 25 anos (homem);\n- deficiência moderada: 24 anos (mulher) ou 29 anos (homem);\n- deficiência leve: 28 anos (mulher) ou 33 anos (homem).\nAposentadoria por idade da PcD, em qualquer grau: 55 anos (mulher) ou 60 anos (homem), com 15 anos de contribuição e deficiência comprovada durante o mesmo período; renda de 70% do salário de benefício mais 1 ponto percentual por grupo de 12 contribuições, até 100%.\nO grau sai da avaliação do INSS (Instituto Nacional do Seguro Social) pelo IF-BrA (Índice de Funcionalidade Brasileiro Aplicado): grave até 5.739 pontos; moderada de 5.740 a 6.354; leve de 6.355 a 7.584; a partir de 7.585 a deficiência não basta para essa aposentadoria.", "fonte": "LC 142/2013, arts. 3º, I a IV, e 8º; Portaria Interministerial SDH/MPS/MF/MOG/AGU 1/2014, Anexo, itens 4.a, 4.d e 4.e", "origem": "03_TESES/legislacao/leis/LC-142-2013_aposentadoria-pessoa-com-deficiencia.htm (art. 3º); .claude/skills/haack-prev-padrao/references/doutrina-professor-pcd-fator.md §2-A.2 (pontuação e renda)", "sinal": "firme"}, {"id": "qd-015", "tema": "Pensão: dependentes", "pergunta": "Quem são os dependentes do segurado no INSS, classe por classe?", "variantes": ["Quem pode receber a pensão por morte?", "Enteado e menor sob guarda são dependentes?", "Ordem dos dependentes do INSS", "Pais e irmãos recebem pensão?"], "resposta": "São dependentes, em três classes:\n- 1ª classe: o cônjuge; a companheira ou o companheiro em união estável; o filho não emancipado, de qualquer condição, menor de 21 anos ou inválido ou com deficiência intelectual, mental ou grave; equiparados a filho, mediante declaração do segurado e se não tiverem condições de se sustentar, o enteado, o menor sob tutela e o menor sob guarda judicial;\n- 2ª classe: os pais;\n- 3ª classe: o irmão não emancipado, de qualquer condição, menor de 21 anos ou inválido ou com deficiência intelectual, mental ou grave.\nDependente de uma classe exclui os das classes seguintes. Na 1ª classe a dependência econômica é presumida; pais e irmãos precisam prová-la. União estável e dependência econômica exigem início de prova material de até 24 meses antes do óbito ou da prisão, não bastando testemunhas. Fica excluído quem foi condenado com trânsito em julgado por homicídio doloso, ou tentativa, contra o segurado, ressalvados os absolutamente incapazes e os inimputáveis.", "fonte": "Lei 8.213/1991, art. 16, I a III e §§ 1º a 5º e 7º (incisos I e III red. Lei 13.146/2015; § 2º red. Lei 15.108/2025; §§ 5º e 7º incl. Lei 13.846/2019)", "origem": "03_TESES/legislacao/leis/Lei-8213-1991_planos-de-beneficios-previdencia.htm (art. 16, últimas ocorrências de cada inciso e parágrafo)", "sinal": "firme"}, {"id": "qd-016", "tema": "Pensão: valor e duração", "pergunta": "Em que casos a pensão por morte acaba?", "variantes": ["Quando corta a pensão?", "A pensão do filho acaba com quantos anos?", "Viúva perde a pensão em que situações?", "Causas de cessação da pensão por morte", "Casar de novo corta a pensão?"], "resposta": "A cota de cada pensionista cessa:\n- para qualquer pensionista: pela morte; pela condenação com trânsito em julgado por homicídio doloso, ou tentativa, contra o segurado, ressalvados os absolutamente incapazes e os inimputáveis;\n- para filho, equiparado ou irmão: aos 21 anos, salvo se inválido ou com deficiência intelectual, mental ou grave;\n- para filho ou irmão inválido: pela cessação da invalidez;\n- para filho ou irmão com deficiência intelectual, mental ou grave: pelo afastamento da deficiência;\n- para cônjuge ou companheiro inválido ou com deficiência: pela cessação da invalidez ou afastamento da deficiência, respeitados os prazos mínimos abaixo;\n- para cônjuge ou companheiro: em 4 meses, se o falecido não tinha 18 contribuições ou se o casamento ou a união tinha menos de 2 anos;\n- para cônjuge ou companheiro com 18 contribuições e 2 anos de união, pelo prazo da idade na data do óbito; óbito desde 01/01/2021: 3 anos com menos de 22 anos, 6 anos de 22 a 27, 10 anos de 28 a 30, 15 anos de 31 a 41, 20 anos de 42 a 44, vitalícia com 45 ou mais; óbito de 01/03/2015 a 31/12/2020: 3 anos com menos de 21, 6 anos de 21 a 26, 10 anos de 27 a 29, 15 anos de 30 a 40, 20 anos de 41 a 43, vitalícia com 44 ou mais;\n- para cônjuge ou companheiro: pela perda do direito, apurada em processo judicial, se provada simulação ou fraude no casamento ou na união estável.\nSe a morte veio de acidente de qualquer natureza ou de doença profissional ou do trabalho, aplica-se o prazo por idade mesmo sem 18 contribuições ou 2 anos de união. Com o fim da última cota, a pensão se extingue. Novo casamento ou nova união não está entre as causas de cessação.", "fonte": "Lei 8.213/1991, art. 77, § 2º, I a VI, §§ 2º-A e 3º, e art. 74, §§ 1º e 2º; Portaria ME 424/2020, art. 1º", "origem": "03_TESES/legislacao/leis/Lei-8213-1991_planos-de-beneficios-previdencia.htm (art. 77, § 2º, últimas ocorrências: II red. Lei 13.183/2015, III e IV red. Lei 13.135/2015, VI incl. Lei 13.846/2019; art. 74, §§ 1º e 2º); 05_AUTOMACAO/scripts/dados/pensao_duracao.json (faixas desde 01/01/2021 e de 01/03/2015 a 31/12/2020)", "sinal": "firme"}, {"id": "qd-017", "tema": "BPC: renda e grupo familiar", "pergunta": "Quem entra e quem fica de fora da família no cálculo da renda do LOAS?", "variantes": ["Quem conta na renda do BPC?", "Avó que mora junto entra no grupo familiar do LOAS?", "Filho casado na mesma casa conta na renda?", "Composição do grupo familiar do BPC"], "resposta": "Entram no grupo familiar do BPC (benefício de prestação continuada) da LOAS (Lei Orgânica da Assistência Social), desde que morem sob o mesmo teto:\n- o requerente;\n- o cônjuge ou companheiro;\n- os pais e, na falta de um deles, a madrasta ou o padrasto;\n- os irmãos solteiros;\n- os filhos e enteados solteiros;\n- os menores tutelados, provada a tutela pelo termo de tutela.\nFicam de fora, mesmo morando junto:\n- o irmão, filho ou enteado casado, em união estável, divorciado, separado de fato ou viúvo;\n- a pessoa internada ou acolhida em instituição de longa permanência, como abrigo ou hospital;\n- o tutor ou curador que não esteja no rol acima ou não more sob o mesmo teto;\n- qualquer parente fora do rol, como avós, netos, tios, sobrinhos, genros e noras.\nMorar com familiar na mesma instituição hospitalar ou de abrigo não forma, por si só, grupo familiar.", "fonte": "Lei 8.742/1993, art. 20, § 1º (red. Lei 12.435/2011); Portaria Conjunta MDS/INSS 34/2025, art. 7º, §§ 1º a 3º", "origem": "03_TESES/legislacao/leis/Lei-8742-1993_LOAS-compilada.txt (art. 20, § 1º); _CONTINUIDADE/_artefatos/prev-lacunas/fontes/INSUMO_dou-portaria-conjunta-mds-inss-34-2025_2026-11-09.html (art. 7º)", "sinal": "firme"}, {"id": "qd-018", "tema": "BPC: renda e grupo familiar", "pergunta": "Que rendas não contam no cálculo da renda do LOAS?", "variantes": ["Aposentadoria de um salário do marido conta na renda do BPC?", "Bolsa de estágio entra na renda do LOAS?", "Outro LOAS na casa conta?", "Rendimentos excluídos da renda per capita"], "resposta": "Não entram na soma da renda da família para o BPC (benefício de prestação continuada):\n- bolsa de estágio supervisionado;\n- rendimento de contrato de aprendizagem;\n- auxílio financeiro temporário ou indenização por danos decorrentes de rompimento ou colapso de barragem;\n- o BPC já pago a outro idoso ou pessoa com deficiência da família;\n- benefício previdenciário de até 1 salário mínimo (R$ 1.621,00 em 2026) pago a idoso acima de 65 anos ou a pessoa com deficiência, um por membro da família;\n- o auxílio-inclusão e a remuneração de quem o recebe, só para manter o BPC já concedido a outra pessoa da família.\nTodo o resto entra, inclusive a renda informal declarada no CadÚnico (Cadastro Único). Se o mesmo membro recebe mais de um benefício de até 1 salário mínimo, só um deles é desconsiderado.", "fonte": "Lei 8.742/1993, art. 20, §§ 3º-A, 9º e 14; Portaria Conjunta MDS/INSS 34/2025, art. 8º, I, a a f, e §§ 1º e 2º", "origem": "03_TESES/legislacao/leis/Lei-8742-1993_LOAS-compilada.txt (art. 20, §§ 9º e 14); _CONTINUIDADE/_artefatos/prev-lacunas/fontes/INSUMO_dou-portaria-conjunta-mds-inss-34-2025_2026-11-09.html (art. 8º)", "sinal": "firme"}, {"id": "qd-019", "tema": "BPC: renda e grupo familiar", "pergunta": "Quanto o INSS desconta da renda do LOAS por gasto com remédio, fralda, consulta e alimentação especial?", "variantes": ["Valor do desconto de fralda no BPC", "Tabela de gastos dedutíveis do LOAS", "Remédio que o SUS não dá abate da renda?", "Desconto de Centro-Dia no BPC"], "resposta": "Desde 30/09/2026, o INSS (Instituto Nacional do Seguro Social) deduz da renda bruta da família, uma vez por categoria, estes valores médios por mês, para itens não fornecidos de graça pelo SUS (Sistema Único de Saúde) ou pelo SUAS (Sistema Único de Assistência Social):\n- medicamentos: R$ 56,00;\n- consultas e tratamentos médicos: R$ 110,00;\n- fraldas: R$ 120,00;\n- alimentação especial: R$ 147,00;\n- Centro-Dia do SUAS: R$ 40,00.\nDe 10/10/2025 a 29/09/2026 os valores eram: medicamentos, R$ 45,00; consultas e tratamentos, R$ 90,00; fraldas, R$ 99,00; alimentação especial, R$ 121,00; Centro-Dia, R$ 32,00.\nA dedução exige documento médico que ateste tratamento contínuo e a falta ou negativa do item no SUS, ou a necessidade e a falta do Centro-Dia. Quem gasta mais que a tabela pode provar o gasto efetivo com recibos dos 12 meses anteriores ao pedido.", "fonte": "Lei 8.742/1993, art. 20-B, III; Portaria Conjunta MDS/INSS 34/2025, art. 8º, §§ 4º a 7º, e Anexo I; Portaria Conjunta MDS/INSS 45/2026, art. 1º e Anexo I", "origem": "_CONTINUIDADE/_artefatos/prev-lacunas/fontes/INSUMO_dou-portaria-conjunta-mds-inss-34-2025_2026-11-09.html (art. 8º e Anexo I, DOU de 10/10/2025); INSUMO_dou-portaria-conjunta-mds-inss-45-2026_2026-11-09.html (Anexo I, DOU de 30/09/2026, em vigor na publicação)", "sinal": "firme"}, {"id": "qd-020", "tema": "Prova rural", "pergunta": "Quais documentos a lei aceita para provar o trabalho rural?", "variantes": ["Documentos para aposentadoria rural", "Bloco do produtor serve de prova?", "Nota fiscal de venda da safra prova atividade rural?", "DAP e Pronaf provam tempo de roça?", "Declaração do sindicato rural ainda vale?"], "resposta": "A lei aceita, junto com a autodeclaração e o cadastro do segurado especial, entre outros:\n- contrato individual de trabalho ou CTPS (Carteira de Trabalho e Previdência Social);\n- contrato de arrendamento, parceria ou comodato rural;\n- DAP (Declaração de Aptidão ao Programa Nacional de Fortalecimento da Agricultura Familiar, Pronaf) ou documento que a substitua;\n- bloco de notas do produtor rural;\n- notas fiscais de entrada emitidas pela empresa que comprou a produção, com o segurado como vendedor;\n- documentos fiscais de entrega da produção a cooperativa agrícola, entreposto de pescado ou outros, com o segurado como vendedor ou consignante;\n- comprovantes de recolhimento de contribuição à Previdência Social sobre a venda da produção;\n- cópia da declaração de imposto de renda com renda da venda de produção rural;\n- licença de ocupação ou permissão outorgada pelo Incra (Instituto Nacional de Colonização e Reforma Agrária).\nA declaração do sindicato rural deixou de constar da lista, revogada pela Lei 13.846/2019. A lista é exemplificativa: outros documentos da época também servem como início de prova.", "fonte": "Lei 8.213/1991, art. 106, caput e I a X (red. Leis 11.718/2008 e 13.846/2019)", "origem": "03_TESES/legislacao/leis/Lei-8213-1991_planos-de-beneficios-previdencia.htm (art. 106, últimas ocorrências: caput e IV red. Lei 13.846/2019; III revogado)", "sinal": "firme"}, {"id": "qd-021", "tema": "Salário-maternidade e outros", "pergunta": "Quanto é o salário-maternidade e quem paga, para cada tipo de segurada?", "variantes": ["Quem paga a licença-maternidade, a empresa ou o INSS?", "Valor do salário-maternidade da autônoma", "Salário-maternidade da agricultora", "Doméstica recebe quanto de salário-maternidade?", "Desempregada tem salário-maternidade?"], "resposta": "Por 120 dias, com estes valores e pagadores, sempre com o mínimo de 1 salário mínimo (R$ 1.621,00 em 2026):\n- empregada: remuneração integral, paga pela empresa, que depois compensa nas contribuições;\n- empregada de MEI (microempreendedor individual): remuneração integral, paga direto pelo INSS (Instituto Nacional do Seguro Social);\n- trabalhadora avulsa: remuneração integral, paga direto pelo INSS;\n- empregada doméstica: valor do último salário de contribuição, pago direto pelo INSS;\n- segurada especial rural: 1 salário mínimo, com 12 meses de atividade rural antes do benefício, pago direto pelo INSS; a lei prevê 1/12 da última contribuição anual a quem tiver contribuído;\n- contribuinte individual e facultativa: 1/12 da soma dos 12 últimos salários de contribuição, apurados em até 15 meses, pago direto pelo INSS;\n- desempregada que mantém a qualidade de segurada: mesma conta da contribuinte individual, paga direto pelo INSS;\n- quem adota ou obtém guarda judicial para adoção: 120 dias, pagos direto pelo INSS.\nA internação da mãe ou do bebê por mais de 2 semanas por complicação do parto estende o benefício por toda a internação e mais 120 dias após a alta; o nascimento de criança com deficiência permanente por síndrome congênita do vírus Zika acrescenta 60 dias.", "fonte": "Lei 8.213/1991, arts. 39, par. único, 71, caput e §§ 2º e 3º, 71-A, 72, caput e §§ 1º e 3º, e 73, caput, I a III e par. único", "origem": "03_TESES/legislacao/leis/Lei-8213-1991_planos-de-beneficios-previdencia.htm (arts. 39, 71 a 73, últimas ocorrências; § 3º do art. 71 incl. Lei 15.222/2025; § 2º incl. Lei 15.156/2025). As alterações da Lei 15.371/2026 (salário-paternidade) só vigoram em 01/01/2027 (art. 14 dessa lei, em 03_TESES/legislacao/leis/Lei-15371-2026_licenca-e-salario-paternidade.txt)", "sinal": "firme"}, {"id": "qd-022", "tema": "Salário-maternidade e outros", "pergunta": "Quem tem direito ao salário-família e até que idade do filho?", "variantes": ["Salário-família 2026", "Aposentado recebe salário-família?", "Doméstica tem salário-família?", "Até quantos anos do filho se recebe salário-família?", "Enteado dá direito a salário-família?"], "resposta": "Tem direito, em 2026, quem ganha até R$ 1.980,38 por mês:\n- o empregado, inclusive o doméstico;\n- o trabalhador avulso;\n- o aposentado por invalidez ou por idade;\n- os demais aposentados com 65 anos ou mais (homem) ou 60 anos ou mais (mulher).\nA cota é de R$ 67,54 por filho ou equiparado até 14 anos de idade, ou inválido de qualquer idade. Equiparam-se a filho o enteado, o menor sob tutela e o menor sob guarda judicial que não tenham condições de se sustentar. Exige certidão de nascimento e, todo ano, atestado de vacinação obrigatória e comprovante de frequência escolar; o empregado doméstico apresenta só a certidão. A empresa ou o empregador doméstico paga junto com o salário e compensa nas contribuições; o avulso pode receber pelo sindicato; o aposentado recebe junto com a aposentadoria. A remuneração considerada é a soma dos salários de contribuição, sem 13º e sem adicional de férias, e a cota é proporcional aos dias trabalhados no mês de admissão e de demissão. A cota não se incorpora ao salário nem ao benefício.", "fonte": "Lei 8.213/1991, arts. 16, § 2º, 65 a 70; Portaria Interministerial MPS/MF 13/2026, art. 4º e §§ 1º a 4º", "origem": "03_TESES/legislacao/leis/Lei-8213-1991_planos-de-beneficios-previdencia.htm (arts. 65, red. LC 150/2015, 67, 68, 69 e 70; art. 16, § 2º, red. Lei 15.108/2025); _CONTINUIDADE/_artefatos/prev-lacunas/fontes/INSUMO_dou-portaria-interministerial-mps-mf-n-13-de-9-de-janeiro-de-2026-680382603.html (art. 4º)", "sinal": "firme"}, {"id": "qd-023", "tema": "Cálculo do valor", "pergunta": "Quais são os valores do INSS em 2026?", "variantes": ["Teto do INSS 2026", "Salário mínimo 2026", "Limite de renda do auxílio-reclusão 2026", "Valor do LOAS em 2026", "Valores atualizados da previdência"], "resposta": "Valores em vigor desde 01/01/2026:\n- salário mínimo: R$ 1.621,00;\n- piso de aposentadoria, auxílio por incapacidade temporária e pensão por morte (valor total): R$ 1.621,00;\n- teto dos benefícios e do salário de contribuição: R$ 8.475,55;\n- reajuste dos benefícios acima do mínimo com início até 02/2025: 3,90%;\n- BPC (benefício de prestação continuada) e renda mensal vitalícia: R$ 1.621,00;\n- limite de renda por pessoa para o BPC (1/4 do mínimo): R$ 405,25;\n- auxílio-inclusão (50% do BPC): R$ 810,50;\n- salário-família: R$ 67,54 por cota, para remuneração de até R$ 1.980,38;\n- auxílio-reclusão: R$ 1.621,00, para preso de baixa renda com média dos 12 últimos salários de contribuição de até R$ 1.980,38;\n- diária para perícia ou reabilitação em outra cidade, por determinação do INSS (Instituto Nacional do Seguro Social): R$ 141,63;\n- limite das execuções do art. 128 da Lei 8.213/1991, pagas em até 60 dias sem precatório: R$ 97.260,00;\n- benefício do seringueiro (Lei 7.986/1989): R$ 3.242,00.", "fonte": "Decreto 12.797/2025, art. 1º; Portaria Interministerial MPS/MF 13/2026, arts. 1º a 5º e 8º, VIII e par. único; Lei 8.742/1993, arts. 20, § 3º, e 26-B", "origem": "_CONTINUIDADE/_artefatos/prev-lacunas/fontes/INSUMO_dou-portaria-interministerial-mps-mf-n-13-de-9-de-janeiro-de-2026-680382603.html (arts. 1º a 8º); 05_AUTOMACAO/scripts/dados/salario_minimo.json e teto_rgps.json (vigência 2026-01); limite do BPC e auxílio-inclusão calculados sobre o mínimo", "sinal": "firme"}, {"id": "qd-024", "tema": "Cálculo do valor", "pergunta": "Meu benefício começou em 2025. Quanto foi o reajuste em 2026?", "variantes": ["Reajuste proporcional do INSS 2026", "Aposentei em junho de 2025, qual o aumento?", "Tabela de reajuste por data de início do benefício", "Aumento da aposentadoria em janeiro de 2026"], "resposta": "O reajuste de 01/01/2026 depende do mês de início do benefício:\n- até 01/2025: 3,90%;\n- 02/2025: 3,90%;\n- 03/2025: 2,38%;\n- 04/2025: 1,86%;\n- 05/2025: 1,38%;\n- 06/2025: 1,02%;\n- 07/2025: 0,79%;\n- 08/2025: 0,58%;\n- 09/2025: 0,79%;\n- 10/2025: 0,27%;\n- 11/2025: 0,24%;\n- 12/2025: 0,21%.\nQuem recebe 1 salário mínimo passa a R$ 1.621,00. Benefício iniciado em 2025 cuja média superava o teto da época recebe também, em 01/2026, a diferença percentual entre a média e o teto, limitado a R$ 8.475,55.", "fonte": "Portaria Interministerial MPS/MF 13/2026, arts. 1º, § 1º, e 6º, e Anexo I", "origem": "_CONTINUIDADE/_artefatos/prev-lacunas/fontes/INSUMO_dou-portaria-interministerial-mps-mf-n-13-de-9-de-janeiro-de-2026-680382603.html (Anexo I, fator de reajuste por data de início)", "sinal": "firme"}, {"id": "qd-026", "tema": "Profissionais da saúde", "pergunta": "Quais profissões da saúde contavam como especiais só pela profissão até 28/04/1995?", "variantes": ["Enfermeira tem tempo especial pela profissão?", "Dentista e médico antes de 1995 contam como especial?", "Farmacêutico e veterinário têm enquadramento por categoria?", "Técnico de enfermagem conta pela categoria?"], "resposta": "Até 28/04/1995, contavam como especiais de 25 anos só pela profissão, provada pela CTPS (Carteira de Trabalho e Previdência Social) ou formulário:\n- pelo Decreto 53.831/1964, código 2.1.3: médicos, dentistas e enfermeiros;\n- pelo Decreto 83.080/1979, Anexo II, código 2.1.3: médicos expostos aos agentes nocivos do código 1.3.0 do Anexo I; médicos anatomopatologistas ou histopatologistas; médicos toxicologistas; médicos laboratoristas (patologistas); médicos radiologistas ou radioterapeutas; técnicos de raios X; técnicos de laboratório de anatomopatologia ou histopatologia; farmacêuticos-toxicologistas e bioquímicos; técnicos de laboratório de gabinete de necropsia; técnicos de anatomia; dentistas, enfermeiros e médicos veterinários expostos aos agentes nocivos do código 1.3.0 do Anexo I.\nProfissão da saúde fora dessas listas, como técnico e auxiliar de enfermagem, fisioterapeuta, farmacêutico não toxicologista, auxiliar de laboratório, trabalhador de lavanderia hospitalar e coveiro, só se enquadra pela categoria por analogia justificada (TNU (Turma Nacional de Uniformização), Tema 198). A partir de 29/04/1995, todas precisam provar a exposição a agentes biológicos.", "fonte": "Dec. 53.831/1964, Quadro Anexo, 2.1.3; Dec. 83.080/1979, Anexo II, 2.1.3; Lei 9.032/1995; IN PRES/INSS 128/2022, art. 269, § 1º; TNU Tema 198", "origem": ".claude/skills/haack-prev-padrao/references/doutrina-previdenciaria.md §5 (tabela de agentes biológicos e profissionais da saúde, linha Até 28/04/1995; Categoria e rol), com base no ins. R8 b.5.1 e b.5.2; lista do Dec. 83.080, Anexo II, 2.1.3, completada pela leitura OCR do PDF escaneado do Planalto em 03_TESES/legislacao/leis/Decreto-83080-1979_regulamento-beneficios-previdencia_anexos-ocr.txt (sem texto nativo)", "sinal": "firme"}, {"id": "qd-027", "tema": "Tempo especial: conceito e prova", "pergunta": "Motorista de caminhão ou de ônibus conta como especial pela profissão?", "variantes": ["Motorista de caminhão tem tempo especial?", "Cobrador de ônibus conta como especial?", "Ajudante de caminhão antes de 1995", "Aeroviário e aeronauta têm enquadramento por categoria?"], "resposta": "Sim, até 28/04/1995, pelo Decreto 53.831/1964, como atividade penosa de 25 anos. O código 2.4.4 (transporte rodoviário) lista:\n- motorneiros e condutores de bondes;\n- motoristas e cobradores de ônibus;\n- motoristas e ajudantes de caminhão.\nNo mesmo quadro, o código 2.4.1 (transporte aéreo), atividade perigosa de 25 anos, lista aeronautas e aeroviários de serviços de pista e de oficinas de manutenção, de conservação, de carga e descarga, de recepção e de despacho de aeronaves.\nA partir de 29/04/1995, o motorista precisa provar exposição a agente nocivo, como ruído ou vibração acima do limite, por PPP (Perfil Profissiográfico Previdenciário) ou laudo.", "fonte": "Dec. 53.831/1964, Quadro Anexo, códigos 2.4.1 e 2.4.4 (leitura da imagem do PDF escaneado do Planalto, sem texto nativo do quadro); Lei 9.032/1995; IN PRES/INSS 128/2022, art. 269, § 1º", "origem": "_CONTINUIDADE/_artefatos/prev-lacunas/INSUMO_pesquisa-08_agentes-quimicos_2026-10-21.md, b.1.2 (códigos 2.4.1 e 2.4.4 transcritos da imagem do PDF escaneado do Planalto, p. 4 e 5; sem texto nativo do quadro); marco de 28/04/1995 em doutrina-previdenciaria.md §1", "sinal": "firme"}, {"id": "qd-028", "tema": "Tempo especial: conceito e prova", "pergunta": "Quem trabalhava em metalúrgica, fundição ou com solda conta como especial pela profissão?", "variantes": ["Soldador tem tempo especial antes de 1995?", "Forneiro e fundidor contam como especial?", "Esmerilhador e pintor a pistola", "Trabalho em aciaria antes de 1995"], "resposta": "Sim, até 28/04/1995, como atividade de 25 anos, se a função estiver no Decreto 83.080/1979, Anexo II:\nCódigo 2.5.1, indústrias metalúrgicas e mecânicas (aciarias, fundições de ferro e metais não ferrosos, laminações):\n- forneiros, mãos de forno e reservas de forno;\n- fundidores, soldadores e lingoteiros;\n- tenazeiros, caçambeiros, amarradores, dobradores e desbastadores;\n- rebarbadores, esmerilhadores e marteleteiros de rebarbação;\n- operadores de tambores rotativos e de outras máquinas de rebarbação;\n- operadores de máquinas para fabricação de tubos por centrifugação;\n- operadores de pontes rolantes ou de equipamentos de transporte de peças e caçambas com metal líquido, nos recintos de aciarias, fundições e laminações;\n- operadores nos fornos de recozimento ou de têmpera, recozedores e temperadores.\nCódigo 2.5.3, operações diversas:\n- operadores de máquinas pneumáticas;\n- rebitadores com marteletes pneumáticos;\n- cortadores de chapa a oxiacetileno;\n- esmerilhadores;\n- soldadores (solda elétrica e a oxiacetileno);\n- operadores de jatos de areia com exposição direta à poeira;\n- pintores a pistola, com solventes hidrocarbonados e tintas tóxicas;\n- foguistas.\nO mecânico não aparece nessas listas. A partir de 29/04/1995 é preciso provar a exposição ao agente nocivo.", "fonte": "Dec. 83.080/1979, Anexo II, códigos 2.5.1 e 2.5.3 (leitura da imagem do PDF escaneado do Planalto, sem texto nativo dos anexos); Lei 9.032/1995", "origem": "_CONTINUIDADE/_artefatos/prev-lacunas/INSUMO_pesquisa-08_agentes-quimicos_2026-10-21.md, b.2.3 (códigos transcritos da imagem do PDF escaneado do Planalto, p. 198 e 202; sem texto nativo dos anexos)", "sinal": "firme"}, {"id": "anx3-000", "tema": "Auxílio-acidente", "pergunta": "Quais sequelas dão direito ao auxílio-acidente?", "variantes": ["lista de sequelas do auxílio-acidente", "anexo III", "que lesão dá auxílio-acidente", "tabela do auxílio-acidente"], "resposta": "O Anexo III do Decreto 3.048/1999 relaciona nove grupos de situações:\n- aparelho visual (perda de acuidade, lesão da musculatura do olho ou das vias lacrimais);\n- aparelho auditivo (perda ou redução da audição em grau médio ou superior por trauma acústico);\n- aparelho da fonação (perturbação da palavra em grau médio ou máximo);\n- prejuízo estético em grau médio ou máximo no crânio, na face ou no pescoço, ou perda de dentes com deformação da arcada;\n- perdas de segmentos de membros (mãos, dedos, pés);\n- alterações articulares (mandíbula, coluna, ombro, cotovelo, antebraço, dedos, quadril, joelho, tornozelo);\n- encurtamento de membro inferior de mais de 4 cm;\n- redução da força ou da capacidade funcional dos membros em grau sofrível ou inferior;\n- ou
