tros aparelhos (segmentectomia pulmonar com redução respiratória; perda de segmento do aparelho digestivo).\nDoença profissional ou do trabalho com sequela permanente que reduza a capacidade de trabalho também se enquadra, pelo art. 104 do regulamento.", "fonte": "Decreto 3.048/1999, Anexo III, Quadros 1 a 9, e art. 104", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo III", "sinal": "firme"}, {"id": "anx3-001", "tema": "Auxílio-acidente", "pergunta": "Auxílio-acidente: quais situações de aparelho visual dão direito?", "variantes": ["visão", "olho", "perdi a visão de um olho", "vista", "sequela visão auxílio-acidente"], "resposta": "Pelo Quadro 1 do Anexo III do Decreto 3.048/1999 (aparelho visual): a) acuidade visual, após correção, igual ou inferior a 0,2 no olho acidentado; b) acuidade visual, após correção, igual ou inferior a 0,5 em ambos os olhos, quando ambos tiverem sido acidentados; c) acuidade visual, após correção, igual ou inferior a 0,5 no olho acidentado, quando a do outro olho for igual a 0,5 ou menos, após correção; d) lesão da musculatura extrínseca do olho, acarretando paresia ou paralisia; e) lesão bilateral das vias lacrimais, com ou sem fístulas, ou unilateral com fístula. NOTA 1 - A acuidade visual restante é avaliada pela escala de Wecker, em décimos, e após a correção por lentes. NOTA 2 - A nubécula e o leucoma são analisados em função da redução da acuidade ou do prejuízo estético que acarretam, de acordo com os quadros respectivos.", "fonte": "Decreto 3.048/1999, Anexo III, Quadro nº 1", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo III", "sinal": "firme"}, {"id": "anx3-002", "tema": "Auxílio-acidente", "pergunta": "Auxílio-acidente: quais situações de aparelho auditivo dão direito?", "variantes": ["audição", "surdez", "perda auditiva", "ouvido", "PAIR", "sequela audição auxílio-acidente"], "resposta": "Pelo Quadro 2 do Anexo III do Decreto 3.048/1999 (aparelho auditivo): Trauma acústico: a) perda da audição no ouvido acidentado; b) redução da audição em grau médio ou superior em ambos os ouvidos, quando os dois tiverem sido acidentados; c) redução da audição, em grau médio ou superior, no ouvido acidentado, quando a audição do outro estiver também reduzida em grau médio ou superior. NOTA 1 - A capacidade auditiva em cada ouvido é avaliada mediante audiometria apenas aérea, nas frequências de 500, 1.000, 2.000 e 3.000 Hertz. NOTA 2 - A redução da audição, em cada ouvido, é avaliada pela média aritmética dos valores, em decibéis, encontrados nas frequências de 500, 1.000, 2.000 e 3.000 Hertz, segundo adaptação da classificação de Davis & Silvermann, 1970. Audição normal - até vinte e cinco decibéis. Redução em grau mínimo - vinte e seis a quarenta decibéis; Redução em grau médio - quarenta e um a setenta decibéis; Redução em grau máximo - setenta e um a noventa decibéis; Perda de audição - mais de noventa decibéis.", "fonte": "Decreto 3.048/1999, Anexo III, Quadro nº 2", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo III", "sinal": "firme"}, {"id": "anx3-003", "tema": "Auxílio-acidente", "pergunta": "Auxílio-acidente: quais situações de aparelho da fonação dão direito?", "variantes": ["fala", "voz", "sequela fala auxílio-acidente"], "resposta": "Pelo Quadro 3 do Anexo III do Decreto 3.048/1999 (aparelho da fonação): Perturbação da palavra em grau médio ou máximo, desde que comprovada por métodos clínicos objetivos.", "fonte": "Decreto 3.048/1999, Anexo III, Quadro nº 3", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo III", "sinal": "firme"}, {"id": "anx3-004", "tema": "Auxílio-acidente", "pergunta": "Auxílio-acidente: quais situações de prejuízo estético dão direito?", "variantes": ["cicatriz", "deformidade", "rosto", "dentes", "sequela cicatriz auxílio-acidente"], "resposta": "Pelo Quadro 4 do Anexo III do Decreto 3.048/1999 (prejuízo estético): Prejuízo estético, em grau médio ou máximo, quando atingidos crânios, e/ou face, e/ou pescoço ou perda de dentes quando há também deformação da arcada dentária que impede o uso de prótese. NOTA 1 - Só é considerada como prejuízo estético a lesão que determina apreciável modificação estética do segmento corpóreo atingido, acarretando aspecto desagradável, tendo-se em conta sexo, idade e profissão do acidentado. NOTA 2 - A perda anatômica de membro, a redução de movimentos articulares ou a alteração da capacidade funcional de membro não são considerados como prejuízo estético, podendo, porém, ser enquadradas, se for o caso, nos quadros respectivos.", "fonte": "Decreto 3.048/1999, Anexo III, Quadro nº 4", "origem": "Decreto-3048-1999_anexo-II-listas-A-B-C_planalto.htm (arquivo D3048anexoii-iii-iv.htm do Planalto), Anexo III", "sinal": "firme"}, {"id": "anx3-005", "tema": "Auxílio-acidente", "pergunta": "Auxílio-acidente: quais situações de perdas de segmentos de membros dão direito?", "variantes": ["amputação", "perdi um dedo", "dedo", "mão", "pé", "falange", "sequela amputação auxílio-acidente"], "resposta": "Pelo Quadro 5 do Anexo III do Decreto 3.048/1999 (perdas de segmentos de membros): a) perda de segmento ao nível ou acima do carpo; b) perda de segmento do primeiro quirodáctilo, desde que atingida a falange proximal; c) perda de segmentos de dois quirodáctilos, desde que atingida a falange proximal em pelo menos um deles; d) perda de segmento do segundo quirodáctilo, desde que atingida a falange proximal; e) perda de segmento de três ou mais falanges, de três ou mais quirodáctilos; f) perda de segmento ao nível ou acima do tarso; g) perda de segmento do primeiro pododáctilo, desde que atingida a falange proximal; h) perda de segmento de dois pododáctilos, desde que atingida a falange proximal em ambos; i) perda de segmento de três ou mais fal <script>
// Núcleo da busca da Consulta Previdenciária. Sem dependências; roda no navegador e no node (testes).
const Core = (() => {
  const STOP = new Set(("a o as os um uma uns umas de da do das dos em no na nos nas por para pra pro com sem que qual quais " +
    "quem como quando onde e ou se eu me meu minha meus minhas ele ela eles elas voce voces seu sua seus suas " +
    "ser sou e eh era foi sao estar esta estou estao ter tem tenho tinha ha ja nao sim mais menos muito pouco " +
    "isso isto esse essa este esta aquele aquela ao aos pela pelo pelas pelos ate entre sobre the " +
    "posso pode podem poder preciso precisa devo deve vou vai ir fazer faz faco fica ficar fico " +
    "caso tipo coisa mesmo mesma tambem so ainda depois antes la aqui").split(" "));

  // Grupos de termos equivalentes na fala do cliente. Um termo do grupo puxa os demais com peso menor.
  const SINONIMOS = [
    ["doenca", "encostado", "encostar", "afastado", "afastamento", "afastar", "incapacidade", "temporaria", "atestado"],
    ["invalidez", "invalido", "incapacidade", "permanente"],
    ["loas", "amparo", "bpc", "assistencial", "prestacao continuada"],
    ["negou", "negado", "negar", "indeferiu", "indeferido", "indeferimento", "recusou", "recusado", "cortou", "cessou", "cessado", "cancelou"],
    ["viuva", "viuvo", "falecido", "faleceu", "morreu", "morte", "obito", "pensao", "pensionista"],
    ["esposa", "esposo", "marido", "mulher", "conjuge", "companheiro", "companheira", "casado", "casada", "uniao estavel"],
    ["roca", "lavoura", "agricultor", "agricultura", "rural", "campo", "colono", "sitio", "segurado especial"],
    ["insalubre", "insalubridade", "periculosidade", "perigoso", "nocivo", "especial", "agente"],
    ["autonomo", "contribuinte individual", "carne", "conta propria"],
    ["valor", "quanto", "renda", "calculo", "calcula", "recebo", "receber", "ganho", "ganhar"],
    ["advogado", "honorarios", "cobram", "cobra", "escritorio"],
    ["juiz", "justica", "processo", "acao", "judicial", "ajuizar"],
    ["deficiente", "deficiencia", "pcd"],
    ["demora", "demorando", "demorar", "atraso", "prazo", "tempo leva"],
    ["pericia", "perito", "medico"],
    ["mei", "microempreendedor"],
    ["ppp", "perfil profissiografico", "laudo"],
    ["trabalhar", "trabalhando", "trabalho", "emprego", "empregado", "atividade"],
    ["filho", "filha", "filhos", "dependente", "dependentes"],
    ["revisao", "revisar", "aumentar", "corrigir"],
    ["pagar", "paguei", "pagando", "contribuir", "contribuicao", "recolher", "recolhimento"],
    ["idoso", "idosa", "velhice", "idade"],
    ["acidente", "acidentario", "cat"],
    ["professor", "professora", "magisterio"],
    ["atrasados", "retroativo", "retroativos"],
    ["documentos", "documento", "papeis", "trazer", "comprovar", "prova"]
  ];

  const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9%]+/g, " ").trim();

  function stem(t) {
    if (/^\d/.test(t)) return t;
    if (t.length > 4) t = t.replace(/oes$/, "ao").replace(/aes$/, "ao").replace(/ais$/, "al").replace(/eis$/, "el");
    if (t.length > 3) t = t.replace(/s$/, "");
    return t.length > 6 ? t.slice(0, 6) : t;
  }

  const tokens = s => norm(s).split(" ").filter(t => t && !STOP.has(t) && (t.length > 1 || /\d/.test(t)));
  const stems = s => tokens(s).map(stem);

  const SIN = new Map();
  for (const g of SINONIMOS) {
    const gs = [...new Set(g.flatMap(x => stems(x)))];
    for (const a of gs) {
      if (!SIN.has(a)) SIN.set(a, new Set());
      for (const b of gs) if (b !== a) SIN.get(a).add(b);
    }
  }

  const CAMPOS = [["pergunta", 3], ["variantes", 2.6], ["tema", 1.6], ["resposta", 1], ["fonte", 0.6]];

  function indexar(itens) {
    const docs = itens.map(it => {
      const peso = new Map();
      const forte = new Set();
      for (const [campo, w] of CAMPOS) {
        const txt = Array.isArray(it[campo]) ? it[campo].join(" ") : it[campo];
        for (const s of stems(txt)) {
          if ((peso.get(s) || 0) < w) peso.set(s, w);
          if (w >= 2.6) forte.add(s);
        }
      }
      const frases = [it.pergunta, ...(it.variantes || [])].map(norm);
      return { it, peso, forte, frases };
    });
    const df = new Map();
    for (const d of docs) for (const s of d.peso.keys()) df.set(s, (df.get(s) || 0) + 1);
    const N = docs.length || 1;
    const idf = s => Math.log(1 + (N - (df.get(s) || 0) + 0.5) / ((df.get(s) || 0) + 0.5));
    const vocab = [...df.keys()];
    return { docs, idf, vocab };
  }

  // Devolve [{item, score, cobertura}] em ordem decrescente. `frouxo` ignora a penalidade de cobertura
  // (usado para escolher o contexto enviado ao Claude).
  function buscar(indice, consulta, { limite = 8, frouxo = false } = {}) {
    const bruto = norm(consulta);
    const toks = tokens(consulta);
    if (!toks.length) return [];
    const digitando = !/\s$/.test(consulta);
    const q = toks.map((t, i) => {
      const s = stem(t);
      const alt = new Map();
      if (digitando && i === toks.length - 1 && t.length >= 3 && t.length < 6) {
        for (const v of indice.vocab) if (v !== s && v.startsWith(t)) alt.set(v, 0.7);
      }
      for (const v of SIN.get(s) || []) if (!alt.has(v)) alt.set(v, 0.5);
      return { s, alt };
    });
    const res = [];
    for (const d of indice.docs) {
      let score = 0, casou = 0, casouForte = 0;
      for (const { s, alt } of q) {
        let melhor = (d.peso.get(s) || 0) * indice.idf(s);
        let forte = d.forte.has(s);
        for (const [v, f] of alt) {
          const p = (d.peso.get(v) || 0) * indice.idf(v) * f;
          if (p > melhor) { melhor = p; forte = d.forte.has(v); }
        }
        if (melhor > 0) { score += melhor; casou++; if (forte) casouForte++; }
      }
      if (!score) continue;
      const cobertura = casou / q.length;
      const coberturaForte = casouForte / q.length;
      if (!frouxo) score *= Math.pow(cobertura, 1.5) * (0.6 + 0.4 * coberturaForte);
      if (bruto.length >= 8 && d.frases.some(f => f.includes(bruto))) score *= 1.5;
      res.push({ item: d.it, score, cobertura, coberturaForte });
    }
    res.sort((a, b) => b.score - a.score);
    return res.slice(0, limite);
  }

  // O primeiro resultado responde a pergunta com segurança?
  function confiavel(res, consulta) {
    if (!res.length) return false;
    const n = tokens(consulta).length;
    const r = res[0];
    if (n <= 1) return r.coberturaForte === 1;
    return r.cobertura >= 0.75 && r.coberturaForte >= 0.5;
  }

  // Instruções fixas da conversa (primeiro turno, sempre mantido).
  const REGRAS =
    "Você é o apoio de um advogado previdenciarista (Regime Geral de Previdência Social, INSS) durante a entrevista com o cliente. " +
    "Ele digita a dúvida; você devolve a resposta que ele vai dizer em voz alta.\n\n" +
    "FORMA. Objetiva e completa, sem discorrer: começa pelo sim, pelo não, pelo número ou pela regra; depois, só as condições que " +
    "mudam a resposta (sexo, datas, tipo de benefício, antes ou depois de 13/11/2019). Em regra de 2 a 6 frases; lista curta quando " +
    "a resposta for uma lista (documentos, requisitos, etapas). Sem introdução, sem travessão, sem recomendar procurar advogado. " +
    "Sigla com o significado entre parênteses na primeira vez. Datas em DD/MM/AAAA. Texto simples, sem markdown. " +
    "Não calcule tempo nem valor de caso concreto: dê a regra.\n\n" +
    "CONCLUSIVA. A resposta resolve a pergunta. Se perguntam \"quais\", enumere todos, um por um; se perguntam \"quanto\", dê o número; " +
    "se a regra varia, dê cada variação com o seu resultado. É proibido responder que algo \"depende\", \"deve ser conferido\", " +
    "\"consta do anexo\" ou \"está na lista\" sem dizer o conteúdo. Nunca fale da BASE, do que ela diz ou deixa de dizer, nem do que " +
    "falta saber do cliente: quem lê só quer a resposta.\n\n" +
    "FONTE. Cada pergunta chega com itens da BASE verificada do escritório. Responda com a BASE sempre que ela cobrir, combinando " +
    "itens e adaptando à pergunta feita. Ponto marcado como CONTROVERTIDO, sem trânsito ou adverso é dito como tal, em uma frase. " +
    "Se a BASE não cobrir a pergunta, ou parte dela, complete com o direito previdenciário brasileiro que você conhece, de forma " +
    "igualmente afirmativa e completa; nesse caso a primeira linha da resposta é exatamente FORA DA BASE (a página avisa o advogado; " +
    "não escreva ressalva no texto) e você só cita número de artigo, súmula ou tema de que tenha certeza. " +
    "Pergunta de seguimento (\"e para mulher?\", \"e se for rural?\") refere-se à conversa anterior.\n\n" +
    "FECHO. A última linha é \"ITENS: \" seguido dos ids da BASE usados, separados por vírgula, ou \"ITENS: nenhum\".";

  function turnoPergunta(pergunta, candidatos) {
    const base = candidatos.map(c =>
      `[${c.id}]${c.sinal === "controvertido" ? " CONTROVERTIDO" : ""} P: ${c.pergunta}\nR: ${c.resposta}\nFonte: ${c.fonte}`).join("\n\n");
    return "BASE (itens mais próximos desta pergunta):\n" + (base || "(nenhum item próximo)") + "\n\nPERGUNTA: " + pergunta;
  }

  // historico: [{pergunta, texto}] já respondidos, do mais antigo ao mais novo.
  function conversa(historico, pergunta, candidatos) {
    const turnos = [{ role: "user", content: REGRAS }];
    for (const h of historico.slice(-5)) {
      turnos.push({ role: "user", content: "PERGUNTA: " + h.pergunta });
      turnos.push({ role: "assistant", content: h.texto });
    }
    turnos.push({ role: "user", content: turnoPergunta(pergunta, candidatos) });
    return turnos;
  }

  // Separa do texto do Claude a marca inicial "FORA DA BASE" e a linha final "ITENS: a, b".
  function separarItens(texto) {
    let t = String(texto || ""), fora = false, ids = [];
    const f = /^\s*FORA DA BASE[.:]?\s*/i.exec(t);
    if (f) { fora = true; t = t.slice(f[0].length); }
    const m = /\n?\s*ITENS:\s*([^\n]*)\s*$/i.exec(t);
    if (m) { ids = m[1].split(/[,\s]+/).map(s => s.replace(/[\[\].]/g, "")).filter(s => s && s !== "nenhum"); t = t.slice(0, m.index); }
    else t = t.replace(/\n\s*I(T(E(N(S)?)?)?)?$/, "");   // linha de fecho ainda chegando
    return { texto: t.trim(), ids, fora };
  }

  return { norm, stem, tokens, indexar, buscar, confiavel, conversa, separarItens };
})();
if (typeof module !== "undefined") module.exports = Core;

</script>

  const fio = [];
  let sample = null, ctl = null, temaAberto = null;

  const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

  function copiar(btn, texto) {
    const ok = () => { btn.textContent = "Copiado"; setTimeout(() => { btn.textContent = "Copiar"; }, 1400); };
    const reserva = () => { const t = el("textarea"); t.value = texto; document.body.append(t); t.select(); try { document.execCommand("copy"); ok(); } catch (e) {} t.remove(); };
    try { navigator.clipboard.writeText(texto).then(ok, reserva); } catch (e) { reserva(); }
  }
  function botaoCopiar(texto) { const b = el("button", "btn", "Copiar"); b.type = "button"; b.onclick = () => copiar(b, texto); return b; }
  function linhaFonte(txt) { const p = el("p", "fonte"); p.append(el("b", null, "Fonte: "), txt || ""); return p; }

  function cartao(item) {
    const c = el("section", "resposta"), cab = el("div", "cab");
    cab.append(el("span", "pilula tema", item.tema));
    if (item.sinal === "controvertido") cab.append(el("span", "pilula", "Ponto controvertido"));
    c.append(cab, el("h2", null, item.pergunta), el("p", "texto", item.resposta));
    const pe = el("div", "pe"), acoes = el("div", "acoes");
    acoes.append(botaoCopiar(item.resposta)); pe.append(linhaFonte(item.fonte), acoes); c.append(pe);
    return c;
  }

  function lista(itens) {
    const l = el("div", "lista");
    for (const item of itens) {
      const d = el("details"), corpo = el("div", "corpo");
      if (item.sinal === "controvertido") corpo.append(el("span", "pilula", "Ponto controvertido"));
      corpo.append(el("p", null, item.resposta), linhaFonte(item.fonte));
      d.append(el("summary", null, item.pergunta), corpo); l.append(d);
    }
    return l;
  }

  // ---------- conversa com o Claude ----------
  const MSG = {
    not_granted: "O uso do Claude não foi autorizado nesta página. A base abaixo continua respondendo.",
    rate_limited: "Limite de uso atingido. Tente de novo em instantes.",
    session_expired: "Sessão expirada. Entre de novo no claude.ai.",
    refused: "O Claude não respondeu a esta pergunta.",
    empty_completion: "O Claude não devolveu texto. Reformule a pergunta."
  };

  function cartaoFio(e) {
    const c = el("section", "resposta" + (e.fora ? " fora" : "")), cab = el("div", "cab");
    if (e.estado === "ok") cab.append(e.fora ? el("span", "pilula", "Fora da base: conferir antes de afirmar") : el("span", "pilula tema", "Com lastro na base"));
    const usados = (e.ids || []).map(i => POR_ID.get(i)).filter(Boolean);
    if (usados.some(u => u.sinal === "controvertido")) cab.append(el("span", "pilula", "Ponto controvertido"));
    c.append(cab, el("h2", null, e.pergunta));
    const txt = el("p", "texto" + (e.estado === "ok" || e.texto ? "" : " pensando"), e.texto || (e.estado === "erro" ? e.aviso : "Respondendo…"));
    c.append(txt);
    if (e.estado === "erro" && e.texto) c.append(el("p", "aviso", e.aviso));
    if (e.estado === "ok") {
      const pe = el("div", "pe"), acoes = el("div", "acoes");
      acoes.append(botaoCopiar(e.texto));
      pe.append(linhaFonte(usados.length ? [...new Set(usados.map(u => u.fonte))].join(" · ") : "sem item da base"), acoes);
      c.append(pe);
      if (usados.length) {
        const d = el("details", "usados"), s = el("summary", "fonte", "Ver os " + usados.length + " itens da base usados");
        s.style.cursor = "pointer"; d.append(s, lista(usados)); c.append(d);
      }
    }
    e.no = c; e.noTexto = txt;
    return c;
  }

  function desenharFio() {
    $conversa.replaceChildren(...fio.slice().reverse().map(cartaoFio));
    $nova.hidden = !fio.length;
  }

  async function perguntar() {
    const pergunta = $q.value.trim();
    if (!pergunta || !sample) return;
    if (ctl) ctl.abort();
    ctl = new AbortController();
    const meu = ctl;
    const feitos = fio.filter(f => f.estado === "ok");
    const anterior = feitos.length ? feitos[feitos.length - 1].pergunta + " " : "";
    const vistos = new Set(), cand = [];
    for (const r of [...Core.buscar(INDICE, pergunta, { limite: 32, frouxo: true }), ...Core.buscar(INDICE, anterior + pergunta, { limite: 14, frouxo: true })]) {
      if (!vistos.has(r.item.id)) { vistos.add(r.item.id); cand.push(r.item); }
    }
    const e = { pergunta, texto: "", ids: [], fora: false, estado: "pensando" };
    fio.push(e);
    $q.value = ""; desenhar(); desenharFio(); window.scrollTo(0, 0);
    try {
      const r = await sample(Core.conversa(feitos, pergunta, cand), {
        modelTier: "default", effort: "low", cache: false, signal: meu.signal,
        onText: ({ text }) => { const p = Core.separarItens(text); e.texto = p.texto; if (e.noTexto && p.texto) { e.noTexto.className = "texto"; e.noTexto.textContent = p.texto; } }
      });
      Object.assign(e, Core.separarItens(r.text), { estado: "ok" });
    } catch (err) {
      if (err && err.code === "cancelled") { fio.splice(fio.indexOf(e), 1); desenharFio(); return; }
      e.estado = "erro"; e.texto = (err && err.code !== "refused" && err.text) ? Core.separarItens(err.text).texto : "";
      e.aviso = (err && MSG[err.code]) || "Não foi possível consultar o Claude agora. A base abaixo continua respondendo.";
      if (err && ["not_granted", "sampling_disabled", "not_declared", "capability_disabled"].includes(err.code)) { sample = null; ajustarModo(); }
    }
    desenharFio();
  }

  // ---------- base, de imediato ----------
  function inicio() {
    const temas = new Map();
    for (const i of ITENS) { if (!temas.has(i.tema)) temas.set(i.tema, []); temas.get(i.tema).push(i); }
    if (temaAberto && temas.has(temaAberto)) {
      const g = el("div", "grupo"), volta = el("button", "btn", "← Todos os temas");
      volta.type = "button"; volta.style.alignSelf = "flex-start"; volta.onclick = () => { temaAberto = null; desenhar(); };
      g.append(volta, el("h3", null, temaAberto), lista(temas.get(temaAberto)));
      $saida.append(g);
      return;
    }
    const sec = el("section");
    sec.append(el("p", "rotulo", "Base por tema"));
    const grade = el("div", "temas");
    for (const [t, its] of temas) {
      const b = el("button"); b.type = "button"; b.append(t, el("span", null, String(its.length)));
      b.onclick = () => { temaAberto = t; desenhar(); };
      grade.append(b);
    }
    sec.append(grade);
    $saida.append(sec, el("p", "rodape", "Respostas extraídas das referências previdenciárias do escritório e da legislação em disco, conferidas contra a fonte. " +
      "Regra geral, não caso concreto: tempo de contribuição, data de aposentadoria e valor de benefício saem dos scripts de cálculo."));
  }

  function desenhar() {
    const consulta = $q.value;
    $limpar.hidden = !consulta;
    $enviar.disabled = !consulta.trim();
    $saida.replaceChildren();
    if (!consulta.trim()) { inicio(); return; }
    const res = Core.buscar(INDICE, consulta, { limite: 8 });
    if (!res.length) { $saida.append(el("p", "aviso", sample ? "Nada parecido na base. Envie a pergunta para o Claude responder." : "Nenhuma pergunta da base trata disso.")); return; }
    const s = el("section");
    if (Core.confiavel(res, consulta)) {
      s.append(el("p", "rotulo", "Na base, de imediato"), cartao(res[0].item));
      $saida.append(s);
      if (res.length > 1) { const o = el("section"); o.append(el("p", "rotulo", "Perguntas próximas"), lista(res.slice(1).map(r => r.item))); $saida.append(o); }
    } else {
      s.append(el("p", "rotulo", "Mais próximas na base"), lista(res.map(r => r.item)));
      $saida.append(s);
    }
  }

  function ajustarModo() {
    $enviar.hidden = !sample;
    $q.placeholder = sample ? "Pergunte qualquer coisa de previdenciário" : "Digite a pergunta do cliente";
    $dica.textContent = sample ? "Enter envia a pergunta. Pode emendar outra em seguida: a conversa é lembrada."
      : "A base responde enquanto você digita.";
  }

  let t = 0;
  $q.addEventListener("input", () => { clearTimeout(t); t = setTimeout(desenhar, 60); });
  $q.addEventListener("keydown", e => {
    if (e.key === "Escape") { $q.value = ""; desenhar(); }
    if (e.key === "Enter") { e.preventDefault(); if (sample) perguntar(); else $q.blur(); }
  });
  $limpar.onclick = () => { $q.value = ""; desenhar(); $q.focus(); };
  $enviar.onclick = () => { perguntar(); $q.focus(); };
  $nova.onclick = () => { if (ctl) ctl.abort(); fio.length = 0; desenharFio(); $q.focus(); };

  ajustarModo(); desenhar();
  if (window.claude && window.claude.use) window.claude.use("sample").then(s => { sample = s; ajustarModo(); desenhar(); }).catch(() => {});
  if (window.matchMedia("(min-width: 700px)").matches) $q.focus();
})();
</script>

</body>
</html>
